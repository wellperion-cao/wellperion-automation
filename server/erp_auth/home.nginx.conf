# wellperion.com 공개 홈 — 별도 server 블록 (아직 미적용 · GM 도메인 전환 결정 뒤 /etc/nginx/conf.d/home.conf 로 복사)
# 시토 2026-09-04 · 배 GEO(생성형 검색 최적화)
#
# 왜 ERP 도메인의 /home/ 을 여는 대신 별도 호스트인가:
#  - 공개 홈은 로그인 관문(auth_request)이 전혀 없어야 하고, 홈이 참조하는 ../회사문서/assets·../assets 도 같이 열려야 한다.
#    ERP 도메인에서 그 경로들을 예외로 열면 관문에 구멍이 하나씩 늘어난다(약속 L21 — 관문에 예외를 쌓지 않는다).
#  - AI 검색·사람 검색은 wellperion.com 을 본다. robots.txt·llms.txt·sitemap.xml 은 도메인 루트에 있어야 읽힌다.
#
# 적용 순서(도메인 전환 날):
#  1) DNS: wellperion.com A 레코드 → 15.164.151.105  (워드프레스는 wp.wellperion.com 같은 별칭으로 남겨 자료 회수)
#  2) sudo cp server/erp_auth/home.nginx.conf /etc/nginx/conf.d/home.conf && sudo nginx -t && sudo systemctl reload nginx
#  3) sudo certbot --nginx -d wellperion.com -d www.wellperion.com   (HTTPS · AI 크롤러는 HTTPS 만 신뢰)
#  4) 3. 웰페리온 가이드/home/index.html·en/index.html 의 <meta name="robots" content="noindex, nofollow"> 제거(초안 표식)
#  5) 검증: curl -s https://wellperion.com/robots.txt · /llms.txt · /sitemap.xml 200 · 구글 리치 결과 테스트에 홈 URL

server {
    listen 80;
    server_name wellperion.com www.wellperion.com;
    root /srv/erp/www;          # 저장소 "3. 웰페리온 가이드" 가 그대로 root (ERP 와 같은 파일 트리)
    charset utf-8;

    # 홈 = /home/ 폴더. 루트 요청을 홈으로 내부 재작성 (주소창은 wellperion.com/ 그대로)
    location = / { rewrite ^ /home/index.html last; }
    location = /en/ { rewrite ^ /home/en/index.html last; }
    location = /en { return 301 /en/; }

    # AI·검색 정책 파일은 도메인 루트에서 읽힌다 — 정본은 home/ 폴더 한 곳(약속 L01)
    location = /robots.txt  { alias /srv/erp/www/home/robots.txt; }
    location = /llms.txt    { alias /srv/erp/www/home/llms.txt; default_type text/plain; }
    location = /sitemap.xml { alias /srv/erp/www/home/sitemap.xml; }

    # 홈이 참조하는 공용 자산만 연다 (홈 폴더 · 브랜드 자산 · 타이포 css · 파비콘). 그 밖은 전부 404 — ERP 화면은 이 호스트에서 안 보인다.
    location ^~ /home/            { try_files $uri $uri/ =404; }
    location ^~ /회사문서/assets/ { try_files $uri =404; }
    location ^~ /assets/          { try_files $uri =404; }
    location ^~ /_assets/         { try_files $uri =404; }   # 타이포·공용 css
    location ^~ /cmo/home/        { try_files $uri =404; }   # 360° 둘러보기 뷰어(배924) — 홈이 iframe 으로 부른다
    location = /wellperion_favicon.png { try_files $uri =404; }

    # 상담봇(배1036) — 홈 하단 진입 링크가 여기로. 페이지 + API 둘 다 공개(로그인 없음).
    location ^~ /counsel/ { try_files $uri $uri/ =404; }
    location /api/chat/ {
        limit_req zone=intake burst=20 nodelay;   # chat.nginx.conf 와 같은 존 재사용(같은 http 블록 안이라 그대로 보인다)
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / { return 404; }

    location ~ /\. { deny all; }
}
