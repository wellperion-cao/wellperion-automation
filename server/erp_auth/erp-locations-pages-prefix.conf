# GitHub Pages 절대경로(/wellperion-automation/…)로 적힌 링크를 서버 경로로 되돌린다 (2026-09-03 GM 발견 · 종합접수처 404).
# 화면 95개에 흩어진 절대경로를 하나씩 고치는 대신 관문 한 곳에서 흡수한다(약속 L21). 화면 쪽은 각 담당이 상대경로로 바꾸면 자연히 안 탄다.
location ^~ /wellperion-automation/ {
    rewrite ^/wellperion-automation/(.*)$ /$1 redirect;
}

# github.io 절대 주소 링크(화면 12개·35곳)는 서버가 내려보낼 때 서버 경로로 바꿔 준다 — 사용자가 로그인 관문 밖(공개 Pages)으로 새지 않게.
# (location 블록 밖 server 문맥 지시자 — include 위치가 server{} 안이라 그대로 유효)
sub_filter 'https://wellperion-cao.github.io/wellperion-automation/' '/';
sub_filter 'http://wellperion-cao.github.io/wellperion-automation/' '/';
sub_filter_once off;
sub_filter_types text/html;
