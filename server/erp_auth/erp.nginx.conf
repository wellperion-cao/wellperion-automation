# 웰페리온 ERP — nginx (AWS 서버 /etc/nginx/conf.d/erp.conf)
# 정적 ERP 미러(/srv/erp/www = GitHub 5분 동기화) 앞에 로그인 관문(127.0.0.1:8000)을 세운다.
# 쿠키 없는 요청은 페이지를 받지 못하고 /auth/login 으로 간다.
server {
    listen 80 default_server;
    server_name _;
    root /srv/erp/www;
    # 2026-09-07 GM 「고친 화면이 새로고침 없이 바로 보이게」 — 캐시 헤더가 없으면 브라우저가 Last-Modified
    # 기준으로 며칠씩 옛 HTML 을 들고 있어 매번 새로고침·시크릿 창이 필요했다(쿠키 문제 아님).
    # no-cache = 매 요청 서버에 재검증(304 · 몸체 안 받음) → 배포 직후 바로 새 화면. 라이브 erp.conf 는
    # certbot 관리라 이 파일로 덮지 않는다 — 같은 줄을 HSTS 옆에 손으로 넣었다(2026-09-07).
    add_header Cache-Control "no-cache" always;
    charset utf-8;
    index index.html;

    # 관문 자체(로그인·가입·관리)는 열려 있어야 로그인할 수 있다
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;   # 어느 화면인지 — app 이 modules.json 과 대조해 권한 판정(403)
    }

    # 모듈 API 등 추가 경로는 이 폴더에 파일 하나씩 (레인별로 파일을 나눠 서로 덮지 않게)
    # [2026-09-04 시우 · 배956] 깃허브 페이지스 서브경로(/wellperion-automation/…)를 절대경로로 박은 페이지 49개(파비콘 45 ·
    #   인쇄 위젯 print_options.js 17 · 월간운영계획 3 등)가 미러 루트(/)에서는 404 — 파일을 고치면 깃허브 쪽이 깨지므로 관문에서 접두만 벗긴다.
    location /wellperion-automation/ { rewrite ^/wellperion-automation/(.*)$ /$1 last; }
    include /etc/nginx/conf.d/erp-locations/*.conf;

    # 옛 첫 화면 주소(/erp/) → 루트로 301(영구). 하위 경로(/erp/launchers/…·/erp/modules.json 등)는
    # 이 exact match 에 안 걸려 그대로 살아있다 — 첫 화면만 옮기고 폴더는 안 없앤다(배1151 · GM 2026-09-09).
    # 09-07 옛 주소 스텁을 지워 파트너팀 팀장이 404 를 본 사고 재발 방지 — 지우지 않고 리다이렉트만 건다.
    location = /erp { return 301 /; }
    location = /erp/ { return 301 /; }

    # 첫 화면 = ERP 모듈 홈(erp/index.html), 주소는 루트(배1151). 로그인 관문은 그대로.
    location = / {
        auth_request /auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files /erp/index.html =404;
    }

    # 그 밖의 모든 페이지 = 로그인 필요
    location / {
        if ($request_uri ~ "^//") { return 404; }   # 선행 이중 슬래시 = 권한 판정 우회 통로(검수 C4 · 2026-09-05 · app.module_at 도 같이 고침)
        auth_request /auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        # $uri.html = .html 없는 깔끔한 주소 허용 · $uri/ 를 뺀 이유 = index 없는 폴더 주소(/coo/chairman/)가
        # nginx 자체 403 을 내고 그것이 @forbidden(권한 없음 화면)으로 잘못 보였다(GM 2026-09-05). 폴더는 index.html 만.
        try_files $uri $uri.html $uri/index.html =404;
    }
    # 폴더 주소(끝이 /)는 index.html 만 찾는다 — try_files 의 $uri 가 폴더 자체에 맞아 nginx 403(목록 금지)이 나고
    # 그것이 @forbidden(권한 없음 화면)으로 보이던 것 차단(GM 2026-09-05). index 없으면 404.
    location ~ ^/(?!auth/|api/|uploads/|dietcamp/|wellperion-automation/).*/$ {   # 프록시·alias 경로는 제외(정규식이 prefix location 보다 먼저 잡힘)
        auth_request /auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files ${uri}index.html =404;
    }
    location @forbidden { return 302 /auth/forbidden?next=$request_uri; }
    location @login {
        return 302 /auth/login?next=$request_uri;
    }
    location ~ /\. { deny all; }
}
