# 웰페리온 ERP — nginx (AWS 서버 /etc/nginx/conf.d/erp.conf)
# 정적 ERP 미러(/srv/erp/www = GitHub 5분 동기화) 앞에 로그인 관문(127.0.0.1:8000)을 세운다.
# 쿠키 없는 요청은 페이지를 받지 못하고 /auth/login 으로 간다.
# 라이브가 정본 · 2026-09-12 라이브에서 내려받음 · 저장소를 라이브에 밀지 않는다
# 80 포트 기본 서버 = 평문으로 ERP 를 서빙하지 않는다(2026-09-14 점검 높음 13번 — IP 로 들어오면 로그인·쿠키가 평문으로 갔다).
# 서버 안 헬스체크(deploy_*.sh 의 curl http://127.0.0.1/…)만 남기고 나머지는 전부 HTTPS 로 보낸다.
server {
    listen 80 default_server;
    server_name _;
    location = /api/health { proxy_pass http://127.0.0.1:8001; }
    location / { return 301 https://erp.wellperion.com$request_uri; }
}

server {
    server_name erp.wellperion.com; # managed by Certbot
    root /srv/erp/www;
    charset utf-8;
    index index.html;

    # 관문 자체(로그인·가입·관리)는 열려 있어야 로그인할 수 있다
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 로그인·가입 속도 제한(2026-09-14 점검 높음 19번) — 존 auth 는 erp-intake-zone.conf(http 문맥)에. 사무실 공용 IP 를
    # 감안해 분당 30·버스트 20. 넘치면 429(화면엔 잠시 뒤 다시).
    location = /auth/login {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/signup {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_buffer_size 16k; proxy_buffers 4 16k; proxy_busy_buffers_size 32k;   # X-Erp-Allowed(허용 카드 목록 · 최대 5KB)가 기본 4k 버퍼를 넘어 502 가 났다(2026-09-14)
        client_max_body_size 10m;   # 본문은 안 넘기지만(request_body off) 한도는 이 location 기준으로 재서 1MB 넘는 저장(업무 현황 SSOT 1.35MB)이 413 으로 잘렸다(배12619 · 2026-09-14) — /api/ 의 10m 과 같게
    }

    # 모듈 API 등 추가 경로는 이 폴더에 파일 하나씩 (레인별로 파일을 나눠 서로 덮지 않게)
    include /etc/nginx/conf.d/erp-locations/*.conf;

    # 로그인 없는 공개 자산 경로 (배1115 ② · GM 결재 후 nginx reload 필요)
    # 목적: 회장님 방 PNG, 분실물 등록 화면 — ERP 계정 없는 외부인 직접 접근
    location /public/ {
        alias /srv/erp/www/3.\ 웰페리온\ 가이드/public/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # 첫 화면 = ERP 모듈 홈(erp/index.html), 주소는 루트(배1151). 로그인 관문은 그대로.
    location = / {
        auth_request /auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files /erp/index.html =404;
    }

    # 그 밖의 모든 페이지 = 로그인 필요
    location / {
        if ($request_uri ~ "^//") { return 404; }   # 선행 이중 슬래시 = 권한 판정 우회 통로(검수 C4 · 2026-09-05)
        auth_request /auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files $uri $uri.html $uri/index.html =404;
    }
    # 폴더 주소(끝이 /)는 index.html 만 — $uri 가 폴더에 맞아 nginx 403 이 권한없음 화면으로 보이던 것 차단(2026-09-05)
    location ~ ^/(?!auth/|api/|uploads/|dietcamp/|wellperion-automation/).*/$ {
        auth_request /auth/check;
        error_page 401 = @login;
        error_page 403 = @forbidden;
        try_files ${uri}index.html =404;
    }
    location @forbidden { return 302 /auth/forbidden?next=$request_uri; }
    location @login {
        return 302 /auth/login?next=$request_uri;
    }
    location ~ /\. { deny all; }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erp.wellperion.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erp.wellperion.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-cache" always;   # 2026-09-07 GM: 고친 화면이 새로고침 없이 보이게 — 매 요청 재검증(304)

}
server {
    if ($host = erp.wellperion.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    server_name erp.wellperion.com;
    return 404; # managed by Certbot


}
