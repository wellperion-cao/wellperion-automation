# 웰페리온 ERP — nginx (AWS 서버 /etc/nginx/conf.d/erp.conf)
# 정적 ERP 미러(/srv/erp/www = GitHub 5분 동기화) 앞에 로그인 관문(127.0.0.1:8000)을 세운다.
# 쿠키 없는 요청은 페이지를 받지 못하고 /auth/login 으로 간다.
server {
    listen 80 default_server;
    server_name _;
    root /srv/erp/www;
    charset utf-8;
    index index.html;

    # 관문 자체(로그인·가입·관리)는 열려 있어야 로그인할 수 있다
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /auth/check {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # 그 밖의 모든 페이지 = 로그인 필요
    location / {
        auth_request /auth/check;
        error_page 401 = @login;
        try_files $uri $uri/ =404;
    }
    location @login {
        return 302 /auth/login?next=$request_uri;
    }
    location ~ /\. { deny all; }
}
