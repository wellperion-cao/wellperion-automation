# 서버의 /etc/nginx/conf.d/erp-locations/chro.conf — erp.conf 의 server 블록이 include 한다.
# 인사(hr) API. 경로는 CTO 회신(2026-09-05) 확정값
# https://erp.wellperion.com/api/hr/* 그대로 — /api/ 보다 긴 접두라 nginx 가 이 블록을 먼저 매칭한다.
# 화면(정적 /chro/hub/…)은 이미 기본 location / 이 서빙 중이라 여기서 손대지 않는다(건드리면 hub 페이지가 깨진다).
# 인증 = 기존 관문 그대로 상속(auth_request /auth/check) — 새 인증 체계 안 만든다.
#
# ★2026-09-10 시토 — 포트를 8002 에서 라이브(8001)로 되돌렸다.
#   원래는 erp-chro.service(chro 계정 전용 · 8002)로 보냈는데, 그 서비스가 09-07 부터 죽어 있었고
#   09-09 에 환경 3벌(배1183)을 세우며 **베타 환경이 8002 를 차지**했다. 그래서 인사 API 요청이
#   조용히 베타 프로세스(자료칸 erp_beta · 비어 있음)로 들어가 모든 조회가 0건을 돌려주고 있었다.
#   인사 라우트(api_hr.py)는 api_*.py 자동 등록으로 라이브(8001) 안에 이미 들어 있다 — 그쪽으로 보낸다.
#   ⚠️ proxy_pass 에 끝 슬래시를 붙이지 않는다. 붙이면 /api/hr/ 접두가 잘려 나가는데,
#      api_hr.py 의 라우터 접두가 /api/hr 라 그러면 404 가 된다(옛 8002 판은 루트에 붙어 있어 슬래시가 필요했다).
#   나우열M 전용 제한 계정 서비스(배1093)를 되살릴 때는 8002 가 아닌 빈 포트를 골라 이 파일도 같이 고친다.
location /api/hr/ {
    auth_request /auth/check;
    auth_request_set $erp_user $upstream_http_x_erp_user;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User $erp_user;
}
