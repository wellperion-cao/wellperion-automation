# 서버의 /etc/nginx/conf.d/erp-locations/spogym.conf — 스포짐 라인(배1036 요청④). dietcamp.conf 와 같은 형태.
# 공개(로그인 없음) — 상담봇 고객 페이지만 둔다(온보딩 전까지는 /spogym/counsel/ 뿐). 폴더 = /srv/www/3_spogym.
location ^~ /spogym/ {
    alias /srv/www/3_spogym/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;   # 스포짐 = 온보딩 전(전 칸 미수령) · 대표 확인 뒤 뗀다
}
