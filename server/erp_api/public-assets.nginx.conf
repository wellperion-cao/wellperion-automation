# 서버의 /etc/nginx/conf.d/erp-locations/public-assets.conf — 로그인 없는 공개 자산 통로 (배1115 ② · 2026-09-08 시토).
# 목적: 깃헙 Pages 를 비공개로 돌리기 전에, ERP 계정이 없는 사람(회장님 방·파트너·외부·회원)에게 나가는
#   이미지·PDF·런처(.bat)·안내 페이지가 erp.wellperion.com 에서 로그인 벽 없이 열리게 한다.
# 규칙: 공개할 파일은 "3. 웰페리온 가이드/public/" 아래에 둔다(폴더 하나 = 공개 여부 한눈에). 지출·매출·회원 원장은
#   여기 두지 않는다. /erp/launchers/ 는 AI서포트.bat 배포 경로라 함께 연다(비밀값 없음 · 47줄 실독 2026-09-08).
# 배포: scp → /etc/nginx/conf.d/erp-locations/public-assets.conf → nginx -t → reload (server/** 는 커밋≠반영).
location ^~ /public/ {
    try_files $uri $uri.html =404;
}
location ^~ /erp/launchers/ {
    try_files $uri =404;
}
