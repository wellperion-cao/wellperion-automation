# 서버의 /etc/nginx/conf.d/erp-locations/public-assets.conf — 로그인 없는 공개 자산 통로 (배1115 ② · 2026-09-08 시토).
# 목적: 깃헙 Pages 를 비공개로 돌리기 전에, ERP 계정이 없는 사람(회장님 방·파트너·외부·회원)에게 나가는
#   이미지·PDF·런처(.bat)·안내 페이지가 erp.wellperion.com 에서 로그인 벽 없이 열리게 한다.
# 규칙: 공개할 파일은 "3. 웰페리온 가이드/public/" 아래에 둔다(폴더 하나 = 공개 여부 한눈에). 지출·매출·회원 원장은
#   여기 두지 않는다. /erp/launchers/ 는 AI서포트.bat 배포 경로라 함께 연다(비밀값 없음 · 47줄 실독 2026-09-08).
# 배포: scp → /etc/nginx/conf.d/erp-locations/public-assets.conf → nginx -t → reload (server/** 는 커밋≠반영).
# 2026-09-09 GM 지시(회장님 몫도 ERP 안에서 보여야 한다 · 배1115 ②) — 회장님 카톡으로 이미 나가는 보고
#   이미지(PNG, 사람 이름·회원 정보·금액 상세 없는 것)를 "public/chairman/" 아래 두면 이 location 이
#   그대로 서빙한다(신설 불필요). 무엇이 들어가는지·배포 순서·되돌리는 법 = status/briefs/CTO-2026-09-09-배1115-공개경로-설계.md.
# 보안: 로그인 관문(location /) 은 이 파일이 먼저 걸리는 prefix location(^~)이라 안 걸린다(상속 아님 — 겹치는
#   상위 location 이 없어 auth_request off 불필요). try_files 가 실재하는 파일만 내주므로 실행·목록 노출 없음.
location ^~ /public/ {
    autoindex off;                                      # 목록 금지(기본값도 off — 감사용 명시)
    add_header X-Robots-Tag "noindex, nofollow" always;  # 검색엔진 수집 차단(회장님 보고 이미지 등)
    try_files $uri $uri.html =404;
}
location ^~ /erp/launchers/ {
    autoindex off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
}
