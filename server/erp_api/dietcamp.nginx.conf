# 서버의 /etc/nginx/conf.d/erp-locations/dietcamp.conf — erp.conf 의 server 블록이 include 한다.
# 다이어트캠프 라인(시보 배 892 · GM 지시 2026-09-05 "AWS 를 1. 웰페리온 / 2. 다이어트캠프 로 구분").
# 공개(로그인 없음) — 대표님께 보내는 페이지만 둔다. 금액·계좌·개인정보가 있는 파일은 올리지 않는다(브랜드가이드 절대 규칙 3·4).
# 폴더 = /srv/www/2_dietcamp (1_wellperion 은 /srv/erp/www 를 가리키는 링크 — 구분만, 이전 아님).
location ^~ /dietcamp/ {
    alias /srv/www/2_dietcamp/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;
}
