# 새 홈(배923) GM 검수용 무인증 미리보기 — erp.wellperion.com/home/ (시토 2026-09-05 · 시모 요청 · GM "대기 중인 것도 바로")
# 정적 파일뿐(개인정보 0) · 검색엔진 색인 금지 헤더 · 도메인 전환 뒤엔 home.nginx.conf 가 정본이고 이 파일은 지운다.
# 배포: scp → /etc/nginx/conf.d/erp-locations/home-preview.conf → nginx -t → reload
location ^~ /home/ {
    alias /srv/erp/www/home/;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
}
# 새 홈이 /home/ 밖에서 끌어 쓰는 것 4종(실측 2026-09-05) — 시설 사진(그림 파일만)·파비콘·열람 흔적 스크립트·시설둘러보기 임베드
location ^~ /회사문서/assets/profile/ {
    alias "/srv/erp/www/회사문서/assets/profile/";
    if ($uri !~* "\.(jpe?g|png|webp|svg)$") { return 404; }
    add_header X-Robots-Tag "noindex, nofollow" always;
}
location = /wellperion_favicon.png { alias /srv/erp/www/wellperion_favicon.png; }
location = /_assets/page_ping.js { alias /srv/erp/www/_assets/page_ping.js; default_type application/javascript; }
location = /cmo/home/시설둘러보기.html { alias "/srv/erp/www/cmo/home/시설둘러보기.html"; default_type text/html; charset utf-8; add_header X-Robots-Tag "noindex, nofollow" always; }
