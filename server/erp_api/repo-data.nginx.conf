# 화면이 읽는 자료를 회사 서버에서 준다 — 깃헙 의존 끊기 (배 1193 · GM 2026-09-11 「깃헙으로 하는게 있으면 안되지않아?」)
#
# 왜: ERP 화면 20장이 아직 raw.githubusercontent.com 에서 JSON 을 직접 읽는다(실측 2026-09-11).
#     깃헙이 느리거나 저장소를 비공개로 돌리면 그 화면들이 한꺼번에 빈다. 자료는 이미 서버
#     /srv/erp/repo 에 매분 내려와 있으므로, 같은 파일을 같은 서버에서 주면 그만이다.
#
# 무엇: /repo/<저장소 안 경로> → /srv/erp/repo/<같은 경로> (읽기 전용)
#     화면 쪽 수정은 주소 앞부분만 바꾸는 한 줄이 된다:
#       https://raw.githubusercontent.com/wellperion-cao/wellperion-automation/master/  →  /repo/
#
# 로그인 관문은 `location /` 과 같은 줄을 그대로 쓴다 — 깃헙에서는 누구나 읽던 파일이라
# 로그인 뒤로 넣는 것은 조이는 방향이다(느슨해지는 쪽이 아니다).
# ⚠️ 비로그인 공개 화면(습득물 등)은 이 통로를 못 쓴다 — 그 화면은 따로 본다.
location ^~ /repo/ {
    if ($request_uri ~ "^//") { return 404; }
    auth_request /auth/check;
    error_page 401 = @login;
    error_page 403 = @forbidden;
    alias /srv/erp/repo/;
    add_header Cache-Control "no-store" always;

    # 숨김 경로(.git·.env 등)는 여기서 막는다. erp.conf 의 `location ~ /\.` 는 이 블록보다
    # 뒤로 밀린다 — `^~` 앞자리 일치가 정규식 location 을 이기기 때문이다(실측 2026-09-11:
    # 막기 전에는 /repo/.git/config 가 로그인한 사람에게 열렸다).
    location ~ /\. { return 404; }
}
