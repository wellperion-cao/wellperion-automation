# 서버의 /etc/nginx/conf.d/erp-intake-zone.conf — limit_req_zone 은 http 문맥에만 둘 수 있어 location 파일(intake.nginx.conf)과 나눴다.
limit_req_zone $binary_remote_addr zone=intake:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=auth:1m rate=30r/m;     # 로그인·가입(erp.conf /auth/login·/auth/signup · 2026-09-14)
# 관제판(생존 신호 6창×45초 + 활동 푸시 3초 ≈ 분당 28) — intake 20r/m 과 분리(2026-09-17 시토)
limit_req_zone $binary_remote_addr zone=console:1m rate=60r/m;
