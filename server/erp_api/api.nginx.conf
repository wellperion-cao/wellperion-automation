# 서버의 /etc/nginx/conf.d/erp-locations/api.conf — erp.conf 의 server 블록이 include 한다.
# 로그인 쿠키 없는 요청은 401 (관문 /auth/check 가 판정).
#
# ⚠️ 역할 헤더 두 줄(아래 ★ 표시)은 저장소에 '준비'만 해 둔 것이고 실제 반영은 CTO 배포 몫이다.
#    반영 전까지 인사 API 는 이 헤더를 믿지 않는다(api_hr.py HR_TRUST_ROLE_HEADER 기본 꺼짐).
#    ★두 줄의 뜻: 인증 서비스(erp_auth /auth/check)는 이미 X-Erp-Role 을 응답 헤더로 돌려주는데,
#      관문에 이 두 줄이 없어 상류(FastAPI)에 도달하지 않는다. 동시에 관문이 그 헤더를 설정하지도
#      않으므로 클라이언트가 같은 이름 헤더를 직접 실어 보내면 그대로 통과한다 —
#      즉 이 두 줄은 기능 추가이면서 동시에 위조 차단이다(proxy_set_header 가 클라이언트 값을 덮어쓴다).
#    반영 뒤 확인 절차: 로그인한 계정으로 X-Erp-Role: admin 을 직접 실어 /api/hr/emp 를 부르고
#      응답 봉투의 role 이 viewer 로 나오는지 1회 본다. 그게 확인되면 HR_TRUST_ROLE_HEADER 를 켠다.
location /api/ {
    auth_request /auth/check;
    auth_request_set $erp_user $upstream_http_x_erp_user;   # /auth/check 가 돌려준 로그인 이메일 → /api/write 원장(배 961)
    auth_request_set $erp_role $upstream_http_x_erp_role;   # ★준비(반영=CTO) /auth/check 가 돌려준 역할 → 인사 API 권한 판별
    client_max_body_size 10m;                                # staff_feedback_photo 등 사진 base64 본문
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User $erp_user;
    proxy_set_header X-Erp-Role $erp_role;                  # ★준비(반영=CTO) 클라이언트가 실어 보낸 같은 헤더를 덮어쓴다
}
