# 서버의 /etc/nginx/conf.d/erp-locations/api.conf — erp.conf 의 server 블록이 include 한다.
# 로그인 쿠키 없는 요청은 401 (관문 /auth/check 가 판정).
#
# ⚠️ 역할 헤더 두 줄(아래 ★ 표시)은 저장소에 '준비'만 해 둔 것이고 실제 반영은 CTO 배포 몫이다.
#    반영 전까지 인사 API 는 이 헤더를 믿지 않는다(api_hr.py HR_TRUST_ROLE_HEADER 기본 꺼짐).
#    ★두 줄의 뜻: 인증 서비스(erp_auth /auth/check)는 이미 X-Erp-Role 을 응답 헤더로 돌려주는데,
#      관문에 이 두 줄이 없어 상류(FastAPI)에 도달하지 않는다. 동시에 관문이 그 헤더를 설정하지도
#      않으므로 클라이언트가 같은 이름 헤더를 직접 실어 보내면 그대로 통과한다 —
#      즉 이 두 줄은 기능 추가이면서 동시에 위조 차단이다(proxy_set_header 가 클라이언트 값을 덮어쓴다).
#    반영 뒤 확인 절차: 로그인한 계정으로 X-Erp-Role: admin 을 직접 실어 /api/hr/emp 를 부르고
#      응답 봉투의 role 이 viewer 로 나오는지 1회 본다. 그게 확인되면 HR_TRUST_ROLE_HEADER 를 켠다.
location /api/ {
    auth_request /auth/check;
    auth_request_set $erp_user $upstream_http_x_erp_user;   # /auth/check 가 돌려준 로그인 이메일 → /api/write 원장(배 961)
    auth_request_set $erp_role $upstream_http_x_erp_role;   # ★준비(반영=CTO) /auth/check 가 돌려준 역할 → 인사 API 권한 판별
    auth_request_set $erp_allowed $upstream_http_x_erp_allowed; # /auth/check 가 돌려준 허용 모듈 목록 → 쓰기 관문 판정(배1112)
    client_max_body_size 10m;                                # staff_feedback_photo 등 사진 base64 본문
    proxy_read_timeout 130s;                                 # GAS 왕복 대기 55초×2 > nginx 기본 60초 → 504 방지(배1112)
    proxy_send_timeout 130s;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User $erp_user;
    proxy_set_header X-Erp-Role $erp_role;                  # ★준비(반영=CTO) 클라이언트가 실어 보낸 같은 헤더를 덮어쓴다
    proxy_set_header X-Erp-Allowed $erp_allowed;            # 클라이언트가 실어 보낸 같은 헤더를 덮어쓴다(위조 차단)
}

# 업무·결재 첨부 — 로그인한 사람만(2026-09-14 시토). 접수 사진의 /uploads/ 블록(reception-public.nginx.conf)은
# 무인증 공개다(습득물 갤러리·텔레그램 링크가 로그인 없이 열려야 해서). 업무 첨부와 대표 서명본은 사내 문서라
# 같은 규칙으로 내주면 안 된다 — 주소만 알면 누구나 열게 된다. 그래서 더 긴 접두사로 여기서 먼저 가로챈다
# (nginx 는 ^~ 중 가장 긴 접두사를 고른다 — /uploads/todo/ 가 /uploads/ 를 이긴다).
# ⚠️ 이 블록을 반영하기 전에는 api.env 의 ERP_TODO_UPLOAD 를 켜지 마라. 파일은 저장되는데 아무도 못 연다
#    (api_write.todo_upload_on() 이 그 스위치 하나만 본다 — 코드가 아니라 배포하는 사람이 켠다).
location ^~ /uploads/todo/ {
    auth_request /auth/check;
    error_page 401 = @login;   # 시트·카톡에서 링크로 들어온 사람은 맨 401 대신 로그인 화면으로(2026-09-14 시토)
    alias /srv/erp/uploads/todo/;
    # 브라우저가 형식을 추측하지 않게. 확장자는 서버가 mimeType 표로만 붙이므로(api_write.UPLOAD_EXT)
    # .html·.svg 가 여기 놓일 길이 없다 — 표에 없는 형식은 .bin 으로 저장된다.
    add_header X-Content-Type-Options nosniff always;
    # 그림은 화면에 그대로 보여야 하고(첨부 미리보기), 그 밖의 형식은 열지 말고 내려받게 한다.
    # ⚠️ nosniff 를 안쪽에 한 번 더 적는 이유: nginx 는 안쪽 블록이 제 add_header 를 하나라도 가지면
    #    바깥 add_header 를 물려주지 않는다. 안 적으면 문서 내려받기에서 nosniff 가 통째로 빠진다.
    if ($uri !~* "\.(jpe?g|png|webp)$") {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition "attachment" always;
    }
}
