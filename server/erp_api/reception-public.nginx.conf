# 서버의 /etc/nginx/conf.d/erp-locations/reception-public.conf — 종합접수처 공개 쓰기 통로 (배 984 · 2026-09-05 시토).
# reg_submit 대체(공개 키오스크·회원 제출) — 로그인 없이 받는다. exact-match(=)라 api.conf 의 /api/ 접두 규칙(로그인
# 필요)보다 항상 먼저 걸린다(nginx 는 순서 무관 = 를 최우선으로 고른다). lf_submit 대체(/api/reception/lost)는
# 직원 도구(ERP 로그인 뒤 화면)라 이 파일에 넣지 않는다 — api.conf 의 일반 규칙이 그대로 적용된다.
location = /api/reception/submit {
    limit_req zone=intake burst=20 nodelay;   # intake-zone.nginx.conf 의 존을 그대로 재사용(새 존 안 만든다)
    limit_req_status 429;
    client_max_body_size 5m;                  # 사진 base64 포함(클라이언트가 이미 압축해서 보낸다)
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 공개 통로 — 클라이언트가 이 헤더를 직접 실어 보내도 지운다(검수 L1)
}
# 유사건 조회(배1120 · 2026-09-07 시토) — 공개 폼이 제출 전 부른다(읽기 전용 · 쓰기 없음). /submit 과 같은 원칙·같은 존.
location = /api/reception/similar {
    limit_req zone=intake burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";
}

# 분실물 공개 조회(배 11299 · 2026-09-09 시토) — 대외 홈페이지·워드프레스 임베드가 GAS 대신 부르는 자리.
# GM 확인 2026-09-09: "무로그인 공개읽기 라우트는 맞아, 홈페이지니까" — /submit·/similar 과 같은 원칙이다.
# 읽기 전용이고, 응답 칸은 코드(api_reception._LF_PUBLIC_FIELDS)로 못 박아 주인·수령자 연락처가 애초에 안 실린다.
# exact-match(=)라 쿼리(?view=disposal)가 붙어도 이 규칙이 먼저 걸린다(nginx 는 location 매칭에 쿼리를 안 본다).
location = /api/reception/lost/public {
    limit_req zone=intake burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 공개 통로 — 클라이언트가 실어 보내도 지운다(검수 L1)
}

location = /api/reception/photo {
    limit_req zone=intake burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 5m;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 검수 L1
}

# 접수·습득물 사진 — 서버 디스크 저장(배 984 · api_reception.save_photo). 시트/Drive 사진 URL 대신 여기서 정적
# 서빙한다(무인증 · 공개 열람용 — 습득물 갤러리·텔레그램 링크가 로그인 없이 봐야 한다). /srv/erp/www(깃허브 5분
# 동기화 트리) 바깥의 별도 디렉터리 — 배포 동기화가 업로드 파일을 건드리지 않게 분리했다.
location ^~ /uploads/ {
    alias /srv/erp/uploads/;
    # 그림 3종만 내준다 — 그 외 확장자는 404(저장 XSS 방어 · 2026-09-05 검수 C3). 브라우저가 형식을 추측하지 않게 nosniff.
    # (중첩 location + alias 는 nginx 가 경로를 못 맞춰 404 를 냈다 — if 로 거른다)
    if ($uri !~* "\.(jpe?g|png|webp)$") { return 404; }
    add_header X-Content-Type-Options nosniff always;
}

# 공개 화면 5장(ko 6 · en 4) — 배1019 (시우 2026-09-05). 파일 = 저장소
# "3. 웰페리온 가이드/public/{ko,en}/*.html"(빌드 산출물 · 정본은 워드프레스 vc_raw_html 조각 ·
# scripts/build_public_pages.py 로 재생성). erp.nginx.conf 의 root(/srv/erp/www)가 저장소 전체를 그대로
# 미러하므로 alias 로 그 경로를 직접 가리킨다 — exact-match(=)라 아래쪽 location / 의 auth_request(로그인
# 필요) 보다 항상 먼저 걸린다(위 /api/reception/submit 과 동일 원리). [시토 2026-09-05 배포] /srv/erp/www 가 곧 "3. 웰페리온 가이드"(심볼릭 링크)라 경로에서 그 접두를 뺐다 · 도메인 = erp.wellperion.com(전환은 GM 결정).
location = /ko/reception { default_type text/html; charset utf-8; alias "/srv/erp/www/public/ko/reception.html"; }
location = /ko/lookup { default_type text/html; charset utf-8; alias "/srv/erp/www/public/ko/lookup.html"; }
location = /ko/inquiry { default_type text/html; charset utf-8; alias "/srv/erp/www/public/ko/inquiry.html"; }
location = /ko/inquiry-form { default_type text/html; charset utf-8; alias "/srv/erp/www/public/ko/inquiry-form.html"; }
location = /ko/lost-found { default_type text/html; charset utf-8; alias "/srv/erp/www/public/ko/lost-found.html"; }
location = /ko/lost-found-register { default_type text/html; charset utf-8; alias "/srv/erp/www/public/ko/lost-found-register.html"; }
location = /en/reception { default_type text/html; charset utf-8; alias "/srv/erp/www/public/en/reception.html"; }
location = /en/lookup { default_type text/html; charset utf-8; alias "/srv/erp/www/public/en/lookup.html"; }
location = /en/inquiry { default_type text/html; charset utf-8; alias "/srv/erp/www/public/en/inquiry.html"; }
location = /en/lost-found { default_type text/html; charset utf-8; alias "/srv/erp/www/public/en/lost-found.html"; }

# 위 10장이 공통으로 참조하는 유일한 자산(wp-typography.css) — 빌드 시 조각의 상대경로
# ("../../assets/…", 조각 자기 위치 2단 깊이 기준)를 "/assets/wp-typography.css" 절대경로로 고쳐 내보내므로
# 그 절대경로를 여기서 그대로 서빙한다(로컬 실측: 상대경로 그대로 두면 depth-1 URL에서 루트를 뚫고 나가 404).
# /assets/ 폴더 전체를 무인증으로 열지 않는다(ERP 자산 폴더와 겹친다) — 공개 화면이 쓰는 파일 1개만.
location = /assets/wp-typography.css { alias "/srv/erp/www/public/assets/wp-typography.css"; }
