# 서버의 /etc/nginx/conf.d/erp-locations/gocheokgolf.conf — erp.conf 의 server 블록이 include 한다.
# 고척 QA골프스튜디오 라인(시보 · GM 지시 2026-09-09 "고객 자료는 깃이 아니라 AWS 에 둔다").
# 공개(로그인 없음) — 부장님께 보내는 페이지만 둔다. 계정·비밀번호·금액이 든 파일은 올리지 않는다.
# 폴더 = /srv/www/3_gocheokgolf
location ^~ /gocheokgolf/ {
    alias /srv/www/3_gocheokgolf/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;
}
