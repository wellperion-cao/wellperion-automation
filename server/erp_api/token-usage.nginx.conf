# 서버의 /etc/nginx/conf.d/erp-locations/token-usage.conf 로 배치.
# 로그인 없는 통로 · 열쇠 = api.env ERP_TOKEN_PUSH_KEY · 2026-09-14 GM 지시
location /api/token_usage/ {
    limit_req zone=intake burst=5 nodelay;
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
