# 서버의 /etc/nginx/conf.d/erp-locations/track.conf — 공개 트래킹 기록(배1034). exact match(=) 라서
# prefix location /api/ 관문(로그인 auth_request)보다 먼저 잡힌다. GET /api/track/summary 는 이 exact match 에
# 안 걸려 그대로 /api/ 관문(로그인)을 탄다(별도 location 불필요 — nginx.org/en/docs/http/ngx_http_core_module.html#location).
# 속도제한 = intake 존 재사용(erp-intake-zone.conf · deploy_intake.sh 가 이미 심어둠).
location = /api/track {
    limit_req zone=intake burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
