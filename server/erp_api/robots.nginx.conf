# 서버의 /etc/nginx/conf.d/erp-locations/robots.conf — erp.wellperion.com 의 robots.txt 한 장.
# 왜 필요한가: 이 자리가 비어 있으면 /robots.txt 요청이 로그인 화면 HTML 을 받는다. 크롤러는 그것을
# 「읽을 수 없는 사이트」로 판정하고 공개 상담 페이지까지 통째로 건너뛴다(시모 실측 2026-09-09).
# 여는 것이 아니라 좁히는 파일이다 — 이미 공개인 상담 페이지 둘만 허용하고 나머지는 전부 막는다.
location = /robots.txt {
    auth_request off;
    default_type text/plain;
    return 200 "User-agent: *\nAllow: /counsel/\nAllow: /dietcamp/counsel/\nAllow: /gocheokgolf/counsel/\nDisallow: /\nSitemap: https://erp.wellperion.com/sitemap.xml\n";
}

# sitemap.xml — 공개 상담 페이지 셋만. lastmod 는 일부러 안 적는다(손으로 적으면 낡고, 낡은 lastmod 는
# 없는 것만 못하다 · 시모 2026-09-09). 페이지가 늘면 이 줄만 늘린다.
location = /sitemap.xml {
    auth_request off;
    default_type application/xml;
    return 200 '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n<url><loc>https://erp.wellperion.com/counsel/</loc><changefreq>weekly</changefreq><priority>0.8</priority></url>\n<url><loc>https://erp.wellperion.com/dietcamp/counsel/</loc><changefreq>weekly</changefreq><priority>0.5</priority></url>\n<url><loc>https://erp.wellperion.com/gocheokgolf/counsel/</loc><changefreq>weekly</changefreq><priority>0.5</priority></url>\n</urlset>\n';
}
