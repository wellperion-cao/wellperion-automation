# 서버의 /etc/nginx/conf.d/erp-locations/marketing-worker.conf — GM PC 발행 워커가 접수 큐를 받고 채널별 결과를 올리는 통로 (배 12680 · 2026-09-16 시토).
# 로그인 쿠키가 없는 PC 가 부르므로 auth_request 를 안 건다 — 대신 라우트가 열쇠 헤더(X-Token-Push-Key = api.env ERP_TOKEN_PUSH_KEY)를 검사한다(partner-secrets.conf·token-usage.conf 와 같은 방식).
# 관리자 화면 쪽(/api/marketing/upload · /api/marketing/uploads)은 이 파일과 무관하게 /api/ 기본 통로(로그인 관문)를 지난다.
# 배포: scp → /etc/nginx/conf.d/erp-locations/marketing-worker.conf → nginx -t → reload (server/** 는 커밋≠반영).
location = /api/marketing/uploads/queue {
    limit_req zone=intake burst=10 nodelay;   # intake-zone.nginx.conf 의 존 재사용
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";           # 공개 통로 — 클라이언트가 실어 보내는 신원 헤더는 지운다
}
location = /api/marketing/uploads/status {
    limit_req zone=intake burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";
}
