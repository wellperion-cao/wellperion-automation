# 서버의 /etc/nginx/conf.d/erp-locations/jobs-public.conf — 채용 공고 상태 공개 읽기 통로 (배12615 · 2026-09-15 시토).
# erp.conf 의 server 블록이 erp-locations/*.conf 를 include 한다. 종합접수처 공개 통로(reception-public.conf)와 같은 모양.
# 로그인 없이 연다 — 지원자 화면(chro/recruiting/*.html · 깃허브 사본 포함)이 서버를 먼저 보고 안 되면 인사 GAS 로 간다.
# 배포: scp → /etc/nginx/conf.d/erp-locations/jobs-public.conf → nginx -t → reload (server/** 는 커밋≠반영).
location = /api/jobs/public {
    limit_req zone=intake burst=20 nodelay;   # intake-zone.nginx.conf 의 존을 그대로 재사용(새 존 안 만든다)
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 공개 통로 — 클라이언트가 이 헤더를 직접 실어 보내도 지운다
}
