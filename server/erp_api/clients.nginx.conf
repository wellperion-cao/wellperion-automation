# 서버의 /etc/nginx/conf.d/erp-locations/clients.conf — erp.conf 의 server 블록이 include 한다.
#
# 고객사 화면을 한 규칙으로 모은다 (배1170 · GM 지적 2026-09-09).
#   GM 원문: "상담봇이 erp.wellperion.com/dietcamp 는 dietcamp 파트너사인 것 같은데? 주소명 잘 설정해야할 것 같은데"
#
# 왜 필요했나
#   지금까지 고객사 화면이 /dietcamp/ · /spogym/ · /gocheokgolf/ · /counsel/ 로 제각각 붙어 있었다.
#   규칙이 없으니 회사가 늘 때마다 이름을 새로 고민해야 하고, 무엇보다 **우리 화면과 남의 회사 화면이
#   주소만 봐서는 안 갈린다.** 다이어트캠프 손님에게 웰페리온은 아무 상관 없는 회사인데 주소창에는
#   그 이름이 뜬다.
#
# 규칙 = /c/{회사}/ 하나. c = client(고객사).
#   우리 것   /            파트너사 직원
#             /admin/      파트너사 관리자
#             /studio/     회사 관리자(플랫폼)
#   남의 것   /c/{회사}/   고객사 화면
#
# ★옛 주소를 지우지 않는다. 리다이렉트도 걸지 않는다 — 같은 폴더를 두 주소가 함께 연다.
#   다이어트캠프 페이지에 이미 <script src="/dietcamp/chat_widget.html"> 이 박혀 있고, 그 페이지는
#   우리가 아니라 그쪽이 들고 있다. 리다이렉트는 대개 따라가지만 "대개"에 남의 라이브를 걸지 않는다.
#   옛 주소는 참조가 전부 새 주소로 옮겨진 것을 확인한 뒤에 닫는다.
#   (2026-09-07 실사고 — 옛 주소 스텁을 지워 파트너팀 팀장이 404 를 봤다.)
#
# 다음 고객사 = 이 파일에 location 한 칸 추가 + /srv/www/{n}_{이름} 폴더. 다른 파일은 안 건드린다.

location ^~ /c/dietcamp/ {
    alias /srv/www/2_dietcamp/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;
}

location ^~ /c/spogym/ {
    alias /srv/www/3_spogym/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;   # 스포짐 = 온보딩 전(전 칸 미수령) · 대표 확인 뒤 뗀다
}
