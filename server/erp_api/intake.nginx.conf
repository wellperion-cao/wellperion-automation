# 서버의 /etc/nginx/conf.d/erp-locations/intake.conf — 공개 접수 폼 쓰기 통로(배 960). erp.conf 의 server 블록이 include 한다.
# 로그인 없이 받는다(auth_request 없음) — 대신 본문 2MB · IP 당 분당 20회(zone 정의 = intake-zone.nginx.conf).
location /api/intake/ {
    # burst=20 (배 960 M6) — 분당 20회를 유지하되 순간에 몰린 20건까지는 그대로 받는다. 공용 IP(사내 와이파이·
    # 데스크 태블릿) 뒤에서 여러 명이 잇달아 접수하면 10 으로는 곧바로 429 가 났다. 넘치면 폼이 큐에 담아 다시 보낸다.
    limit_req zone=intake burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}

# 대조 결과는 내부 보고물(전화 뒤 4자리·건수) — 공개 통로에 같이 실리면 안 된다.
# nginx 는 정확일치(=)를 접두일치보다 먼저 고르므로 이 한 줄이 위 /api/intake/ 보다 이긴다.
location = /api/intake/reconcile {
    auth_request /auth/check;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
