# 서버의 /etc/nginx/conf.d/erp-locations/labs.conf — erp.conf 의 server 블록이 include 한다.
# AX 랩스 공개 라인(시보 요청 2026-09-15 · GM 「외부 영업 구조」) — 파트너에게 링크로 보내는 회사 소개서 한 장.
# 공개(로그인 없음 · noindex). 이 폴더에는 밖에 보내는 문서만 둔다 — 전략 로드맵(내부)·가격·법인·리드 파일은 올리지 않는다.
# 폴더 = /srv/www/4_labs (1_wellperion·2_dietcamp·3_gocheokgolf 와 같은 고객 단위 구분). 배포 = server/deploy_labs.sh.
location ^~ /labs/ {
    alias /srv/www/4_labs/;
    index index.html intro.html;   # 2026-09-16 GM 확정 — AX 허브(배 1131)를 AX 랩스 공개 사이트 첫 화면(index.html)으로 합침 · intro.html 은 소개서(시보)
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;
}
