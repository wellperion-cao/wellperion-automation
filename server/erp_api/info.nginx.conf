# 서버의 /etc/nginx/conf.d/erp-locations/info.conf — erp.conf 의 server 블록이 include 한다.
#
# 손님이 여는 상담 화면 주소 (GM 확정 2026-09-09).
#   GM 원문: "그냥 infobot은 어때? 일단 웰페리온만 erp.wellperion.com/응대bot_wellperion 이렇게 하면 될듯"
#            → 낱말은 info 로 확정. bot 은 뺐다.
#
# 왜 bot 을 뺐나
#   설계 정본(상담봇_기획설계_v1.0.html)에 「손님 화면에 FAQ·AI·봇 낱말 없음」이 못 박혀 있다.
#   주소창에 bot 이 보이면 손님은 들어가기 전에 이미 기계와 말한다는 걸 안다 — 화면에서 걷어낸 것을
#   주소가 먼저 말해 버린다. 관리자 화면 쪽은 bot 을 써도 된다(우리와 사장님만 본다).
#
# 왜 counsel 이 아닌가
#   영어 counsel 은 법률·심리 상담 쪽 낱말이라 손님이 오해한다. info 는 「안내」로 자연스럽게 읽히고
#   짧아서 카톡·문자로 보낼 때 안 깨진다.
#
# 규칙 = /info/{회사}/ 하나. 회사가 늘면 여기 칸 하나 + 폴더 하나.
#   우리 것   /            파트너사 직원
#             /erp/        파트너사 관리자
#             /erp/admin/  회사 관리자(플랫폼)
#   손님 것   /info/{회사}/
#
# ★옛 주소(/counsel/ · /dietcamp/ · /spogym/)를 지우지도, 리다이렉트로 넘기지도 않는다.
#   같은 폴더를 여러 주소가 함께 연다. 다이어트캠프 페이지에 이미 옛 주소가 박혀 있고 그 페이지는
#   우리가 아니라 그쪽이 들고 있다. 참조가 전부 옮겨진 것을 확인한 뒤에 옛 주소를 닫는다
#   (2026-09-07 실사고 — 옛 주소 스텁을 지워 파트너팀 팀장이 404 를 봤다).

# 웰페리온 — 화면 파일이 ERP 저장소 안(/srv/erp/www/counsel/)에 있어 alias 가 아니라 rewrite 로 잇는다.
location ^~ /info/wellperion/ {
    rewrite ^/info/wellperion/(.*)$ /counsel/$1 last;
}

location ^~ /info/dietcamp/ {
    alias /srv/www/2_dietcamp/counsel/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;
}

location ^~ /info/spogym/ {
    alias /srv/www/3_spogym/counsel/;
    index index.html;
    try_files $uri $uri/ =404;
    add_header X-Robots-Tag "noindex" always;   # 스포짐 = 온보딩 전(전 칸 미수령) · 대표 확인 뒤 뗀다
}
