# 서버의 /etc/nginx/conf.d/erp-locations/chat.conf — AEO 채팅봇 공개 답변 통로(배1018).
# POST /api/chat/{tenant} 는 공개(로그인 없음) — intake 와 같은 속도제한 zone 재사용(새 zone 안 만든다).
# GET .../unanswered 만 로그인 뒤(시보가 아침 학습 회로로 읽는 내부 조회) — 정확일치가 아니라 regex 로
# 먼저 걸러야 한다(tenant 가 변수라 = 정확일치를 못 쓴다 · nginx 는 prefix 보다 regex 를 먼저 본다).
location ~ ^/api/chat/[^/]+/unanswered$ {
    auth_request /auth/check;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /api/chat/ {
    limit_req zone=intake burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
