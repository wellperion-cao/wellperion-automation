# 서버의 /etc/nginx/conf.d/erp-locations/chat.conf — AEO 채팅봇 공개 답변 통로(배1018 · 관리자 API 4개 배1036).
# POST /api/chat/{tenant} 는 공개(로그인 없음) — intake 와 같은 속도제한 zone 재사용(새 zone 안 만든다).
# GET .../unanswered · PUT .../faq · GET .../stats 만 로그인 뒤(관리자 페이지 · 아침 학습 회로) — 정확일치가
# 아니라 regex 로 먼저 걸러야 한다(tenant 가 변수라 = 정확일치를 못 쓴다 · nginx 는 prefix 보다 regex 를 먼저 본다).
# .../feedback · .../profile 은 고객 페이지가 로그인 없이 부르는 공개 API라 아래 catch-all(공개)로 내려간다.
location ~ ^/api/chat/[^/]+/unanswered$ {
    auth_request /auth/check;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 검수 L1 — 이 통로는 아직 X-Erp-User 를 안 쓴다. 앞으로 쓸 라우트가 생겨도
                                       # 클라이언트가 직접 실어 보낸 값을 믿지 않게 지운다.
}
location ~ ^/api/chat/[^/]+/faq$ {
    auth_request /auth/check;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 검수 L1
}
location ~ ^/api/chat/[^/]+/stats$ {
    auth_request /auth/check;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 검수 L1
}
location /api/chat/ {
    limit_req zone=intake burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Erp-User "";   # 공개 통로 — 검수 L1
}
