# 서버의 /etc/nginx/conf.d/erp-locations/console.conf 로 배치.
# C레벨 관제판 생존 신호 — 로그인 없는 통로 · 열쇠 = api.env ERP_TOKEN_PUSH_KEY(token-usage.conf 와 같은 방식) · 2026-09-17 시토(배 12723)
# 읽기(/api/console/state)는 여기 두지 않는다 — /api/ 기본 관문(로그인)을 그대로 지난다.
location = /api/console/heartbeat {
    limit_req zone=console burst=20 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
# 활동 푸시(scripts/console_activity_push.py · 창 6개 × 3초) — 같은 열쇠 · 지시·응답 한 줄씩(값은 보내는 쪽에서 가림)
location = /api/console/event {
    limit_req zone=console burst=30 nodelay;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
