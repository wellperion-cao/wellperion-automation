# 서버의 /etc/nginx/conf.d/erp-locations/guide.conf 로 배치.
# pending·applied = 로그인 없는 통로 · 열쇠 = api.env ERP_TOKEN_PUSH_KEY(api_token_usage.py 와 동일) · 2026-09-14 시토
# commit 은 여기 안 둔다 — /api/ 기본 관문(로그인+역할)을 그대로 지난다.
location /api/guide/pending {
    limit_req zone=intake burst=5 nodelay;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
location /api/guide/applied {
    limit_req zone=intake burst=5 nodelay;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
}
