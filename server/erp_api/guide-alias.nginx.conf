# 파트너사 직원 화면 짧은 주소 (배 2535 · GM 2026-09-11 "그냥 /home로 하면 안되나?")
#
# ★GM 재지시 2026-09-11 「erp.wellperion.com/home로 만들어달라고 했는데, 왠 guide?」 —
#   /home 이 정본이다. 처음엔 새 홈 미리보기가 /home/ 을 쓰고 있어 /guide 로 비켰는데,
#   비켜야 할 쪽은 아직 발행 전인 미리보기였다. 미리보기를 /newhome/ 으로 옮기고 이 자리를 넘겼다.
#   /guide 는 이미 알린 주소라 같이 살려 둔다.
#
# 루트 / 는 ERP 모듈 홈(erp/index.html)이라 그 화면이 아니다 — 그래서 별도 주소가 필요하다.
#
# rewrite 한 줄만 둔다(location 을 새로 만들지 않는다). server 문맥이라 location 고르기 전에 돌고,
# last 라서 다시 고를 때 평소의 location / 에 걸린다 — 로그인 관문·권한 검사가 그대로 걸린다.
# location 을 따로 만들면 그 관문 줄을 베껴야 하고, 베낀 순간 한쪽만 고쳐지는 자리가 생긴다.
#
# 주소창에는 /guide 가 그대로 남는다(302 가 아니라 내부 재작성). 옛 주소도 그대로 살아 있다 —
# 실무진 즐겨찾기가 물려 있어 끊으면 안 된다(2026-09-07 강습회원관리 404 선례).
# 옛 긴 주소로 들어오면 새 주소로 넘긴다 (GM 2026-09-11 「주소는 계속 그대로 가는거야?」).
# 화면은 맞는데 주소창에 옛 주소가 남아 GM 눈에는 안 바뀐 것으로 보였다. 해시(#home·#S3)는
# 브라우저가 들고 가므로 건드리지 않는다. 옛 주소를 아주 막는 것은 09-18 — 그때까지는 넘겨만 준다.
# ★$request_uri 로 본다(=$uri 아님). 그 값은 아래 내부 재작성에 안 바뀌므로 되돌이가 날 수 없다.
if ($request_uri ~ "^/wellperion_guide\(main\)\.html") { return 301 /home; }

rewrite ^/(home|guide)/?$ "/wellperion_guide(main).html" last;
