# 서버의 /etc/nginx/conf.d/erp-locations/counsel-public.conf — 상담봇 고객 페이지 공개 통로(배1036).
# 1_wellperion 테넌트는 ERP 루트(= 이 저장소 git 체크아웃, 5분 동기화)에 얹혀 있어 기본은 로그인 관문
# (erp.nginx.conf) 이 걸린다. /counsel/ 만 예외로 열어(로그인 없음) 고객이 바로 본다 — ^~ 라 정규식(auth) 보다 먼저 잡힌다.
# 답변 API(POST /api/chat/1_wellperion)는 이미 공개(chat.conf) — 이 location 은 화면 파일만 연다.
# 색인 허용(AEO 자산 · §5·§6) — dietcamp/spogym 과 달리 noindex 를 안 붙인다(FAQ 14 · 대표 확인 완료 테넌트).
location ^~ /counsel/ {
    try_files $uri $uri/ =404;
}
