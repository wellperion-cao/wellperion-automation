# wellperion.com 대표 홈 — HTTPS 앞단 프록시 (AWS 서버 /etc/nginx/conf.d/wellperion-site.conf · 배 2856 · 2026-09-19)
# 원본 = cafe24 웹호스팅 183.111.138.230(워드프레스 그대로 · 호스팅 「도메인 연결」 유지). 이 서버는 TLS 를 끝내고 요청을 원본에 넘긴다.
# 워드프레스 설정·파일은 건드리지 않는다 — 응답 속 http://wellperion.com 을 여기서 https:// 로 바꿔 준다.
# 인증서 = certbot certonly --nginx (cert-name wellperion.com · deploy-hook reload) · 갱신 = certbot-renew.timer.
# DNS = Route53 호스팅 영역 Z06764051TPW43YDJRQGF (레코드 표 = server/wordpress/wellperion-site.dns.md).
# 옛 wp.conf(빈 WP 설치본 · 이전 대상 플레이스홀더)는 wp.conf.off-20260919 로 꺼 두었다.
# 되돌림: cafe24 네임서버 → NS2.CAFE24.COM / NS1.CAFE24.COM (cafe24 A 183.111.138.230) · 이 파일을 .off 로 옮기고 nginx -t && reload.

server {
    listen 80;
    server_name wellperion.com www.wellperion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wellperion.com www.wellperion.com;
    charset utf-8;
    client_max_body_size 64m;

    ssl_certificate /etc/letsencrypt/live/wellperion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wellperion.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/wellperion-site.access.log;
    error_log  /var/log/nginx/wellperion-site.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json text/xml application/rss+xml image/svg+xml;

    location / {
        proxy_pass http://183.111.138.230;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_redirect http://wellperion.com/ https://wellperion.com/;
        proxy_redirect http://www.wellperion.com/ https://www.wellperion.com/;

        sub_filter_once off;
        sub_filter_types text/css application/javascript application/json text/xml application/rss+xml;
        sub_filter 'http://wellperion.com' 'https://wellperion.com';
        sub_filter 'http://www.wellperion.com' 'https://www.wellperion.com';
        sub_filter 'http:\/\/wellperion.com' 'https:\/\/wellperion.com';
        sub_filter 'http:\/\/www.wellperion.com' 'https:\/\/www.wellperion.com';
        # 혼합 콘텐츠 잔여 2종(2026-09-19 실측): 테마의 구글 폰트 http 링크 · 옛 호스팅 주소로 박힌 업로드 이미지(같은 파일이 /wp/ 로 이 프록시에서 200)
        sub_filter 'http://fonts.googleapis.com' 'https://fonts.googleapis.com';
        sub_filter 'http://wellperion.cafe24.com' 'https://wellperion.com';
    }
}
