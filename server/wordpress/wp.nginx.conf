# wellperion.com 워드프레스 (cafe24 → AWS 이전 대상)
# erp.conf 가 80 의 default_server 다 — 이 블록은 Host 헤더가 wellperion.com 일 때만 잡힌다.
server {
    listen 80;
    server_name wellperion.com www.wellperion.com;
    root /srv/wp/html;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 64M;

    access_log /var/log/nginx/wp.access.log;
    error_log  /var/log/nginx/wp.error.log;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_read_timeout 120s;
    }

    # 업로드 폴더 안의 PHP 실행 차단
    location ~* /wp-content/uploads/.*\.php$ { deny all; }
    location ~ /\. { deny all; }

    location ~* \.(js|css|png|jpe?g|gif|svg|webp|woff2?|ico)$ {
        expires 30d;
        access_log off;
    }
}
