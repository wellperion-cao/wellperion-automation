<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>같은 실수, 두 번 안 나게 — 웰페리온 점검 현황</title>
<style>
  :root {
    --bg: #f8f7f4;
    --card: #ffffff;
    --border: #e5e2db;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --green: #1a7a3c;
    --green-bg: #edf7f0;
    --orange: #b85c00;
    --orange-bg: #fff4e6;
    --accent: #1a3a6b;
    --accent-light: #eef2fa;
    --mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    padding: 24px 16px 60px;
  }
  .container { max-width: 960px; margin: 0 auto; }

  /* 헤더 */
  .header {
    border-left: 4px solid var(--accent);
    padding: 16px 20px;
    background: var(--accent-light);
    border-radius: 0 8px 8px 0;
    margin-bottom: 28px;
  }
  .header h1 { font-size: 18px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .header .sub { font-size: 13px; color: #3a3a5a; margin-top: 4px; }

  /* 섹션 */
  .section { margin-bottom: 32px; }
  .section-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }

  /* 카운터 배지 */
  .count-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600;
  }
  .badge-green { background: var(--green-bg); color: var(--green); border: 1px solid #b6dfc5; }
  .badge-orange { background: var(--orange-bg); color: var(--orange); border: 1px solid #f5c89a; }

  /* 발행검증 배너 */
  .verify-banner {
    background: var(--orange-bg);
    border: 1px solid #f5c89a;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--orange);
    font-weight: 600;
  }
  .verify-banner.clean { background: var(--green-bg); border-color: #b6dfc5; color: var(--green); }

  /* 사건 카드 */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .inc-row {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .inc-row:last-child { border-bottom: none; }
  .inc-row:hover { background: #faf9f6; }

  .inc-main { display: flex; align-items: flex-start; gap: 12px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 12px; border-radius: 14px;
    font-size: 12px; font-weight: 700; white-space: nowrap;
    flex-shrink: 0; margin-top: 2px;
  }
  .pill-done { background: var(--green-bg); color: var(--green); border: 1px solid #b6dfc5; }
  .pill-open { background: var(--orange-bg); color: var(--orange); border: 1px solid #f5c89a; }

  .inc-summary { font-size: 14px; color: var(--text); line-height: 1.5; }

  /* 자세히 토글 */
  .detail-toggle {
    margin-top: 8px;
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    user-select: none;
    background: none; border: none; padding: 0;
    font-family: inherit;
  }
  .detail-toggle:hover { text-decoration: underline; }
  .detail-box {
    display: none;
    margin-top: 10px;
    padding: 12px 14px;
    background: #f4f2ed;
    border-radius: 6px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .detail-box.open { display: block; }
  .detail-label { font-weight: 700; color: #444; }

  /* 약속 섹션 */
  .promise-intro {
    font-size: 13px; color: #3a3a5a;
    background: var(--accent-light); border-radius: 6px; padding: 10px 14px;
    border-left: 3px solid var(--accent); margin-bottom: 16px;
  }
  .promise-group { margin-bottom: 18px; }
  .promise-group-label {
    font-size: 11px; font-weight: 700; color: var(--accent);
    letter-spacing: 0.06em; margin-bottom: 8px;
    background: var(--accent-light); border-radius: 4px;
    display: inline-block; padding: 3px 10px;
  }
  .promise-item {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; margin-bottom: 8px;
  }
  .promise-item:hover { background: #faf9f6; }
  .promise-name { font-size: 14px; font-weight: 700; color: var(--text); min-width: 120px; flex-shrink: 0; }
  .promise-desc { font-size: 13px; color: #444; line-height: 1.5; }

  /* 캐논 값 카드 그리드 */
  .canon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .canon-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .canon-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .canon-value { font-family: var(--mono); font-size: 13px; color: #333; background: #f4f2ed; padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 8px; word-break: break-all; }
  .canon-tag { font-size: 11px; color: var(--green); background: var(--green-bg); border: 1px solid #b6dfc5; border-radius: 10px; padding: 2px 8px; display: inline-block; }

  /* 로딩·에러 */
  .loading { padding: 32px; text-align: center; color: var(--muted); }
  .error { padding: 16px; color: #b00020; background: #fff0f0; border: 1px solid #fcc; border-radius: 8px; }

  /* 업데이트 시각 */
  .updated { font-size: 11px; color: var(--muted); margin-top: 8px; }

  @media (max-width: 600px) {
    .canon-grid { grid-template-columns: 1fr 1fr; }
    .inc-summary { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>같은 실수, 두 번 안 나게</h1>
    <div class="sub">회사 곳곳에 흩어진 값과 실수를 한 곳에서 관리해, 같은 문제가 두 번 안 나게 막는 현황판입니다.</div>
  </div>

  <!-- 발행 확인 배너 -->
  <div id="verify-banner" class="verify-banner">⏳ 발행 확인 현황 불러오는 중…</div>

  <!-- 우리의 약속 -->
  <div class="section">
    <div class="section-title">📌 우리의 약속 (AI·실무진이 다같이 지키는 것)</div>
    <div class="promise-intro">여기 적힌 건 우리 모두가 한 곳에서 보고 지키는 약속입니다. 새 약속이 생기면 여기 모입니다.</div>
    <div id="promise-wrap"><div class="loading">불러오는 중…</div></div>
    <div id="promise-updated" class="updated"></div>
  </div>

  <!-- 문제 해결 현황 -->
  <div class="section">
    <div class="section-title">🔒 문제 해결 현황</div>
    <div id="inc-count" class="count-row"></div>
    <div id="inc-list" class="card"><div class="loading">불러오는 중…</div></div>
    <div id="inc-updated" class="updated"></div>
  </div>

  <!-- 공식 값 관리 -->
  <div class="section">
    <div class="section-title">📌 공식 값 관리</div>
    <p style="font-size:13px; color:var(--muted); margin-bottom:14px;">아래 값들은 딱 한 곳에서만 관리합니다. 바꿀 때도 한 곳만 고치면 전체에 반영됩니다.</p>
    <div id="canon-grid" class="canon-grid"><div class="loading">불러오는 중…</div></div>
    <div id="canon-updated" class="updated"></div>
  </div>

</div>

<script>
const BASE = "https://raw.githubusercontent.com/wellperion-cao/wellperion-automation/master/ssot/";
const QUEUE_URL = "https://raw.githubusercontent.com/wellperion-cao/wellperion-automation/master/3.%20%EC%9B%B0%ED%8E%98%EB%A6%AC%EC%98%A8%20%EA%B0%80%EC%9D%B4%EB%93%9C/cmo/review/review_queue.json";

async function fetchJSON(url) {
  const res = await fetch(url + "?t=" + Date.now(), {cache: "no-store"});
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

var _detailCount = 0;

function makeStatusPill(state) {
  if (state === "GUARDED") {
    return '<span class="status-pill pill-done">✅ 막음 완료</span>';
  }
  return '<span class="status-pill pill-open">⏳ 아직 진행 중</span>';
}

function toggleDetail(id) {
  var el = document.getElementById(id);
  var btn = document.getElementById("btn-" + id);
  if (!el) return;
  if (el.classList.contains("open")) {
    el.classList.remove("open");
    btn.textContent = "▸ 자세히";
  } else {
    el.classList.add("open");
    btn.textContent = "▴ 접기";
  }
}

// ── 문제 해결 현황 ────────────────────────────────────────────
async function loadIncidents() {
  var listEl = document.getElementById("inc-list");
  var countEl = document.getElementById("inc-count");
  var updEl = document.getElementById("inc-updated");
  try {
    var data = await fetchJSON(BASE + "incidents.json");
    var list = data.incidents || [];
    var done = list.filter(function(i){ return i["상태"] === "GUARDED"; }).length;
    var going = list.filter(function(i){ return i["상태"] === "OPEN"; }).length;

    countEl.innerHTML =
      '<span class="badge badge-green">✅ 막음 완료 ' + done + '건</span>' +
      (going > 0 ? '<span class="badge badge-orange">⏳ 진행 중 ' + going + '건</span>' : '');

    var html = "";
    list.forEach(function(inc) {
      var summary = inc["요약"] || inc["증상"] || "";
      var detId = "detail-" + (++_detailCount);

      // 자세히 내용 (기술 세부)
      var detailHtml = "";
      if (inc["차단조치"]) detailHtml += '<div><span class="detail-label">조치:</span> ' + esc(inc["차단조치"]) + '</div>';
      if (inc["검증증거"]) detailHtml += '<div style="margin-top:6px"><span class="detail-label">검증:</span> ' + esc(inc["검증증거"]) + '</div>';
      if (inc["date"])     detailHtml += '<div style="margin-top:6px"><span class="detail-label">날짜:</span> ' + esc(inc["date"]) + '</div>';

      html += '<div class="inc-row">';
      html += '<div class="inc-main">';
      html += makeStatusPill(inc["상태"]);
      html += '<div class="inc-summary">' + esc(summary) + '</div>';
      html += '</div>';
      if (detailHtml) {
        html += '<button class="detail-toggle" id="btn-' + detId + '" onclick="toggleDetail(\'' + detId + '\')">▸ 자세히</button>';
        html += '<div class="detail-box" id="' + detId + '">' + detailHtml + '</div>';
      }
      html += '</div>';
    });

    listEl.innerHTML = html || '<div class="loading">문제 기록 없음</div>';
    updEl.textContent = "마지막 확인: " + new Date().toLocaleString("ko-KR");
  } catch(e) {
    listEl.innerHTML = '<div class="error">불러오기 실패: ' + esc(e.message) + '</div>';
  }
}

// ── 공식 값 관리 ──────────────────────────────────────────────
async function loadCanon() {
  var gridEl = document.getElementById("canon-grid");
  var updEl = document.getElementById("canon-updated");
  try {
    var data = await fetchJSON(BASE + "canon_values.json");
    var list = data.values || [];

    var html = "";
    list.forEach(function(v) {
      var label = v["이름"] || v.key;
      html += '<div class="canon-card">';
      html += '<div class="canon-name">' + esc(label) + '</div>';
      html += '<div class="canon-value">' + esc(v.value) + '</div><br>';
      html += '<span class="canon-tag">✅ 한 곳에서 관리</span>';
      html += '</div>';
    });

    gridEl.innerHTML = html || '<div class="loading">값 없음</div>';
    updEl.textContent = "마지막 확인: " + new Date().toLocaleString("ko-KR");
  } catch(e) {
    gridEl.innerHTML = '<div class="error">불러오기 실패: ' + esc(e.message) + '</div>';
  }
}

// ── 발행 확인 배너 ────────────────────────────────────────────
async function loadVerifyBanner() {
  var banner = document.getElementById("verify-banner");
  try {
    var queue = await fetchJSON(QUEUE_URL);
    var pending = (Array.isArray(queue) ? queue : []).filter(function(i) {
      return i.status === "발행검증대기";
    });
    if (pending.length === 0) {
      banner.className = "verify-banner clean";
      banner.textContent = "✅ 올린 글 모두 확인 완료 — 확인 안 된 글 없음";
    } else {
      banner.className = "verify-banner";
      var titles = pending.map(function(i){ return i.title || i.id || "?"; });
      banner.innerHTML = "⚠️ 올렸는데 아직 확인 안 한 글 <strong>" + pending.length + "건</strong> — " +
        titles.map(esc).join(", ");
    }
  } catch(e) {
    banner.className = "verify-banner";
    banner.textContent = "⚠️ 발행 확인 현황을 불러오지 못했습니다.";
  }
}

// ── 우리의 약속 ───────────────────────────────────────────────
async function loadLessons() {
  var wrap = document.getElementById("promise-wrap");
  var updEl = document.getElementById("promise-updated");
  try {
    var data = await fetchJSON(BASE + "lessons.json");
    var list = data.lessons || [];

    // 분류별로 묶기
    var groups = {};
    var groupOrder = [];
    list.forEach(function(l) {
      var g = l["분류"] || "기타";
      if (!groups[g]) { groups[g] = []; groupOrder.push(g); }
      groups[g].push(l);
    });

    var html = "";
    groupOrder.forEach(function(gname) {
      html += '<div class="promise-group">';
      html += '<div class="promise-group-label">' + esc(gname) + '</div>';
      groups[gname].forEach(function(l) {
        html += '<div class="promise-item">';
        html += '<div class="promise-name">' + esc(l["약속"]) + '</div>';
        html += '<div class="promise-desc">' + esc(l["내용"]) + '</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    wrap.innerHTML = html || '<div class="loading">약속 없음</div>';
    updEl.textContent = "마지막 확인: " + new Date().toLocaleString("ko-KR");
  } catch(e) {
    wrap.innerHTML = '<div class="error">불러오기 실패: ' + esc(e.message) + '</div>';
  }
}

loadLessons();
loadIncidents();
loadCanon();
loadVerifyBanner();
</script>
</body>
</html>
