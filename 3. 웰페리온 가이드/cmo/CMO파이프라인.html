<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="/wellperion-automation/wellperion_favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMO 콘텐츠 검수큐 (M5)</title>
<style>
:root{--bg:#221F20;--paper:#2a2725;--text:#f5f2ef;--dim:#8c8b83;--accent:#B79F8A;--accent-bg:rgba(183,159,138,0.12);--border:#3d3835;--green:#6abf7b;--green-bg:rgba(106,191,123,0.12);--red:#ED5B3F;--red-bg:rgba(237,91,63,0.12);--yellow:#e6c84e;--yellow-bg:rgba(230,200,78,0.12);--blue:#5b9fd5;--blue-bg:rgba(91,159,213,0.12);--purple:#a78bda;--purple-bg:rgba(167,139,218,0.12);--orange:#e6944e;--orange-bg:rgba(230,148,78,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh}
a{color:var(--accent);text-decoration:none}

.sticky-top{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border)}
.header{background:var(--paper);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:12px}
.header-titles{display:flex;flex-direction:column;gap:2px;min-width:0}
.header h1{font-size:17px;font-weight:700}
.header-sub{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0}
.header-right a,.header-right button{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:4px;text-decoration:none}
.header-right a:hover,.header-right button:hover{background:var(--accent-bg);color:var(--accent);border-color:rgba(183,159,138,0.3)}

.filter-bar{display:flex;padding:10px 20px;gap:4px;overflow-x:auto;background:var(--bg)}
.filter-btn{padding:8px 16px;border:1px solid transparent;border-radius:8px;background:none;color:var(--dim);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.filter-btn.active{border-color:rgba(183,159,138,0.3);color:var(--accent);background:var(--accent-bg)}
.filter-btn:hover{background:var(--accent-bg)}
.filter-count{font-size:10px;padding:1px 6px;border-radius:8px;margin-left:4px;font-weight:700;background:var(--accent-bg);color:var(--accent)}

.content{padding:16px 20px 60px;max-width:860px;margin:0 auto}

/* Summary */
.summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.summary-card{flex:1;min-width:80px;background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.summary-card .num{font-size:22px;font-weight:700}
.summary-card .label{font-size:11px;color:var(--dim);margin-top:2px}

/* Pipeline cards */
.pipeline-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;transition:border-color 0.15s}
.pipeline-card:hover{border-color:rgba(183,159,138,0.2)}
.card-header{display:flex;align-items:center;padding:14px 16px;gap:10px;cursor:pointer}
.card-header:hover{background:var(--accent-bg)}
.card-num{font-size:12px;font-weight:700;color:var(--accent);min-width:24px;text-align:center;flex-shrink:0}
.card-title{flex:1;font-size:14px;font-weight:700;min-width:0;word-break:break-word}
.card-date{font-size:11px;color:var(--dim);flex-shrink:0;white-space:nowrap}
.card-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.card-badge.url-missing{background:var(--orange-bg);color:var(--orange)}

.card-body{display:none;padding:10px 16px 14px;border-top:1px solid var(--border);background:var(--bg)}
.card-body.open{display:block}

/* Channel matrix */
.ch-matrix{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-bottom:8px}
.ch-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--paper);font-size:12px}
.ch-label{width:64px;flex-shrink:0;font-weight:700;color:var(--text);font-size:11px}
.ch-status-text{flex:1;font-size:12px}
.ch-link{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--green-bg);color:var(--green);text-decoration:none;white-space:nowrap;border:1px solid rgba(106,191,123,0.2)}
.ch-link:hover{opacity:0.8}
.ch-no-url{font-size:11px;color:var(--dim);white-space:nowrap}

.card-note{font-size:11px;color:var(--dim);line-height:1.5;padding:6px 4px;border-top:1px solid var(--border);margin-top:4px}

/* Mirror notice */
.mirror-notice{text-align:center;padding:16px 20px;color:var(--dim);font-size:12px;border-top:1px solid var(--border);margin-top:8px;line-height:1.7}

/* Empty/Loading */
.empty-msg{text-align:center;padding:40px 20px;color:var(--dim);font-size:14px}
.loading{text-align:center;padding:40px;color:var(--dim)}

/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#15803d;color:#fff;padding:8px 20px;border-radius:8px;font-size:13px;font-weight:700;display:none;z-index:300;box-shadow:0 4px 14px rgba(0,0,0,0.25)}
.toast.error{background:#c0392b}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--paper);border:1px solid var(--border);border-radius:16px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;padding:24px 20px}
.modal h2{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-btn{padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid;transition:opacity 0.15s}
.modal-btn:hover{opacity:0.85}
.modal-btn.save{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-btn.cancel{background:var(--paper);color:var(--dim);border-color:var(--border)}

@media print{
  .sticky-top,.toast,.modal-overlay{display:none!important}
  body{background:#fff;color:#222;font-size:11px}
  .content{padding:0;max-width:100%}
  .pipeline-card{border:1px solid #ccc;break-inside:avoid}
  .card-body{display:block!important}
  .ch-row{background:#f5f5f5}
}
@media(max-width:600px){
  .header{flex-direction:column;gap:8px;align-items:flex-start}
  .header-right{width:100%}
  .summary-row{flex-direction:column}
  .ch-matrix{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="sticky-top">
  <div class="header">
    <div class="header-titles">
      <h1>CMO 콘텐츠 검수큐 (M5)</h1>
      <div class="header-sub">정본 = review_queue.json &middot; 발행 파이프라인 읽기 거울 &middot; 자동 기록</div>
    </div>
    <div class="header-right">
      <button onclick="window.print()">인쇄</button>
      <button onclick="showShareModal()">보고용</button>
      <a href="../wellperion_guide(main).html">웰페리온 ERP</a>
    </div>
  </div>
  <div class="filter-bar" id="filterBar"></div>
</div>

<div class="toast" id="toast"></div>

<div class="content" id="mainContent">
  <div class="loading">불러오는 중...</div>
</div>

<!-- Share Modal -->
<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <h2>파이프라인 보고</h2>
    <pre id="shareContent" style="background:var(--bg);padding:12px;border-radius:8px;font-size:11px;white-space:pre-wrap;color:var(--text);max-height:55vh;overflow-y:auto;line-height:1.6;"></pre>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="document.getElementById('shareModal').classList.remove('show')">닫기</button>
      <button class="modal-btn save" onclick="copyShare()">복사</button>
    </div>
  </div>
</div>

<script>
/* ── 채널 정의 ── */
const CHANNELS = ['IG(회사)', 'IG(개인)', '블로그', '카페', '카카오', '당근'];
const CH_LABELS = {
  'IG(회사)': 'IG(공식)',
  'IG(개인)': 'IG(개인)',
  '블로그':   '블로그',
  '카페':     '카페',
  '카카오':   '카카오',
  '당근':     '당근'
};
const STATUS_COLORS = {
  '발행완료':     'var(--green)',
  '임시저장완료': 'var(--blue)',
  '검수대기':     'var(--orange)',
  '발행검증대기': 'var(--yellow)',
  '대기':         'var(--dim)'
};

let ALL_GROUPS = [];
let activeFilter = '전체';

document.addEventListener('DOMContentLoaded', () => {
  buildFilterBar();
  loadItems();
});

/* ── 채널 정규화 ── */
function normalizeChannel(str) {
  if (!str) return null;
  if (/인스타|instagram/i.test(str)) {
    return /namuk/i.test(str) ? 'IG(개인)' : 'IG(회사)';
  }
  if (/블로그/.test(str)) return '블로그';
  if (/카페/.test(str))   return '카페';
  if (/카카오/.test(str)) return '카카오';
  if (/당근/.test(str))   return '당근';
  return null;
}

/* ── 타이틀 정리: " — 채널명" 접미 제거 ── */
function cleanTitle(title) {
  if (!title) return '';
  return title
    .replace(/\s*—\s*(네이버\s*블로그|네이버\s*카페[^\n]*|카카오\s*채널|당근채널|인스타그램\s*[\(\（][^\)\）]*[\)\）]|인스타그램[^\n]*)$/, '')
    .trim();
}

/* ── 데이터 로드 ── */
async function loadItems() {
  try {
    const res = await fetch('review/review_queue.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    ALL_GROUPS = buildGroups(rows);
  } catch (e) {
    console.error('review_queue.json 로드 실패:', e);
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-msg">데이터 로드 실패: ' + esc(String(e)) + '</div>';
    return;
  }
  renderAll();
}

/* ── 행 → 콘텐츠 그룹 변환 ── */
function buildGroups(rows) {
  const map = new Map();
  rows.forEach(row => {
    const key = row.folder || row.id || 'unknown';
    if (!map.has(key)) map.set(key, { key, rows: [] });
    map.get(key).rows.push(row);
  });

  return Array.from(map.values()).map(g => {
    const { rows } = g;

    /* 채널별 대표 행 */
    const byChannel = {};
    rows.forEach(r => {
      const ch = normalizeChannel(r.channel);
      if (ch && !byChannel[ch]) byChannel[ch] = r;
    });

    /* 대표 행 선택 (채널 우선순위) */
    let rep = null;
    for (const ch of CHANNELS) {
      if (byChannel[ch]) { rep = byChannel[ch]; break; }
    }
    if (!rep) rep = rows[0];

    const title = cleanTitle(rep.title) || g.key.split('/').pop();

    /* 최신 published_at */
    const dates = rows.map(r => r.published_at).filter(Boolean).sort();
    const latestDate = dates[dates.length - 1] || '';

    /* 미리보기 */
    const preview = (rows.find(r => r.preview) || {}).preview || '';

    /* URL 누락 여부: 발행완료인데 post_url 없음 */
    const hasUrlMissing = rows.some(r => r.status === '발행완료' && !r.post_url);

    return { key: g.key, title, latestDate, preview, byChannel, hasUrlMissing };
  });
}

/* ── 필터 바 ── */
function buildFilterBar() {
  const bar = document.getElementById('filterBar');
  const filters = ['전체', '오늘', '이번주', 'URL누락있음'];
  bar.innerHTML = filters.map(f =>
    '<button class="filter-btn' + (f === '전체' ? ' active' : '') +
    '" id="fb_' + f + '" onclick="setFilter(\'' + f + '\',this)">' + f + '</button>'
  ).join('');
}

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderAll();
}

function getToday() {
  return new Date().toISOString().slice(0, 10);
}
function getWeekStart() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  return d.toISOString().slice(0, 10);
}

/* ── 전체 렌더 ── */
function renderAll() {
  const el = document.getElementById('mainContent');
  const today = getToday();
  const weekStart = getWeekStart();

  let filtered = ALL_GROUPS;
  if (activeFilter === '오늘') {
    filtered = filtered.filter(g => g.latestDate.slice(0, 10) === today);
  } else if (activeFilter === '이번주') {
    filtered = filtered.filter(g => g.latestDate.slice(0, 10) >= weekStart);
  } else if (activeFilter === 'URL누락있음') {
    filtered = filtered.filter(g => g.hasUrlMissing);
  }

  /* 발행일 내림차순 */
  filtered = filtered.slice().sort((a, b) =>
    (b.latestDate || '').localeCompare(a.latestDate || '')
  );

  /* 요약 집계 (전체 기준) */
  let totalChannelDone = 0, totalUrlOk = 0, totalUrlMissing = 0;
  ALL_GROUPS.forEach(g => {
    CHANNELS.forEach(ch => {
      const r = g.byChannel[ch];
      if (r && r.status === '발행완료') {
        totalChannelDone++;
        if (r.post_url) totalUrlOk++; else totalUrlMissing++;
      }
    });
  });

  let html = '';

  /* 요약 카드 */
  html += '<div class="summary-row">';
  html += sumCard(ALL_GROUPS.length,  '전체 콘텐츠',       'var(--accent)');
  html += sumCard(totalChannelDone,   '발행완료(채널합)',   'var(--green)');
  html += sumCard(totalUrlOk,         'URL 보유',           'var(--blue)');
  html += sumCard(totalUrlMissing,    'URL 누락',           'var(--orange)');
  html += '</div>';

  /* 카드 목록 */
  if (filtered.length === 0) {
    html += '<div class="empty-msg">해당 콘텐츠가 없습니다.</div>';
  } else {
    filtered.forEach((g, idx) => { html += renderCard(g, idx + 1); });
  }

  /* 거울 안내 */
  html += '<div class="mirror-notice">이 보드는 발행 파이프라인(review_queue.json)을 그대로 비추는 거울입니다.' +
          ' 콘텐츠 등록·발행은 제작 파이프라인에서 이뤄지고 여기에 자동 기록됩니다.</div>';

  el.innerHTML = html;
}

function sumCard(num, label, color) {
  return '<div class="summary-card"><div class="num" style="color:' + color + '">' + num +
         '</div><div class="label">' + esc(label) + '</div></div>';
}

/* ── 카드 렌더 ── */
function renderCard(g, idx) {
  const { title, latestDate, byChannel, hasUrlMissing } = g;

  /* 테두리 색상: 모든 존재하는 채널이 발행완료면 green, 아니면 orange */
  const existingRows = CHANNELS.map(ch => byChannel[ch]).filter(Boolean);
  const allDone = existingRows.length > 0 &&
    existingRows.every(r => r.status === '발행완료');
  const borderColor = allDone ? 'var(--green)' : existingRows.length === 0 ? 'var(--dim)' : 'var(--orange)';

  let html = '<div class="pipeline-card" style="border-left:3px solid ' + borderColor + '">';

  /* 카드 헤더 */
  html += '<div class="card-header" onclick="toggleBody(this)">';
  html += '<span class="card-num">' + idx + '</span>';
  if (hasUrlMissing) html += '<span class="card-badge url-missing">URL누락</span>';
  html += '<span class="card-title">' + esc(title) + '</span>';
  if (latestDate) html += '<span class="card-date">' + esc(latestDate.slice(0, 10)) + '</span>';
  html += '</div>';

  /* 카드 바디: 채널 매트릭스 */
  html += '<div class="card-body">';
  html += '<div class="ch-matrix">';
  CHANNELS.forEach(ch => {
    const row = byChannel[ch];
    const label = CH_LABELS[ch];
    if (!row) {
      html += '<div class="ch-row">' +
              '<span class="ch-label">' + esc(label) + '</span>' +
              '<span class="ch-status-text" style="color:var(--dim)">—</span>' +
              '</div>';
    } else {
      const status = row.status || '기록없음';
      const statusColor = STATUS_COLORS[status] || 'var(--dim)';
      let linkHtml = '';
      if (row.post_url) {
        linkHtml = ' <a class="ch-link" href="' + escA(row.post_url) +
                   '" target="_blank" rel="noopener">보기</a>';
      } else if (status === '발행완료') {
        linkHtml = ' <span class="ch-no-url">URL 미회수</span>';
      }
      html += '<div class="ch-row">' +
              '<span class="ch-label">' + esc(label) + '</span>' +
              '<span class="ch-status-text" style="color:' + statusColor + '">' + esc(status) + '</span>' +
              linkHtml +
              '</div>';
    }
  });
  html += '</div>';

  /* 비고(note): 대표 채널 비고 */
  const repRow = CHANNELS.map(ch => byChannel[ch]).find(r => r && r.note);
  if (repRow) {
    html += '<div class="card-note">' + esc(repRow.note) + '</div>';
  }

  html += '</div></div>';
  return html;
}

function toggleBody(header) {
  header.nextElementSibling.classList.toggle('open');
}

/* ── 보고용 모달 ── */
function showShareModal() {
  const now = new Date();
  const lines = ['━━━ CMO 발행 파이프라인 현황 ━━━'];
  lines.push('보고일: ' + now.toISOString().slice(0, 10));
  lines.push('정본: review_queue.json | 총 ' + ALL_GROUPS.length + '개 콘텐츠');
  lines.push('');

  const sorted = ALL_GROUPS.slice().sort((a, b) =>
    (b.latestDate || '').localeCompare(a.latestDate || '')
  );

  sorted.forEach(g => {
    const doneChannels = CHANNELS.filter(ch => g.byChannel[ch] && g.byChannel[ch].status === '발행완료');
    if (doneChannels.length === 0) return;
    lines.push('[' + g.title + '] ' + g.latestDate.slice(0, 10));
    lines.push('  발행 채널: ' + doneChannels.map(ch => CH_LABELS[ch]).join(' · '));
    doneChannels.forEach(ch => {
      const r = g.byChannel[ch];
      if (r.post_url) lines.push('  ' + CH_LABELS[ch] + ': ' + r.post_url);
    });
    lines.push('');
  });

  lines.push('━━━ 끝 ━━━');
  document.getElementById('shareContent').textContent = lines.join('\n');
  document.getElementById('shareModal').classList.add('show');
}

function copyShare() {
  navigator.clipboard.writeText(document.getElementById('shareContent').textContent)
    .then(() => showToast('복사됨'))
    .catch(() => showToast('복사 실패', true));
}

/* ── 유틸 ── */
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError ? ' error' : '');
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2500);
}

function esc(s) {
  return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') : '';
}
function escA(s) {
  return s ? String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') : '';
}
</script>
    <script src="/wellperion-automation/_assets/print_options.js"></script>
</body>
</html>
