<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../assets/wp-ui.css">
<title>마케팅 자동화 — AX 랩스</title>
<meta name="theme-color" content="#0A6E66">
<meta name="robots" content="noindex">
<!-- 파는 모듈(플랫폼 브랜드 · AX 랩스). 파트너사를 골라 그 계정 채널로 글을 올린다.
     2026-09-15 GM: 「마케팅 자동업로드도 웰페리온의 하루로 고정이 되어 있나 보네」 → 개인 앱(GM의일요일#marketing)으로
     튕기던 스텁을 걷어 내고 파트너사 선택이 있는 독립 화면으로 세웠다(설계 시모 배 2658).
     서버 배선(시토): data-hook 속성 3개 —
       partner-channels : GET  /api/partner_secrets/status?tenant={키}  → 채널별 활성/비활성
       upload-submit    : POST /api/marketing/upload                    → {tenant, channels[], title, body, images[], when}
       upload-history   : GET  /api/marketing/uploads?tenant={키}       → 최근 발행 목록
     배선 전엔 「서버 연결 전」 배지가 보인다(가짜 데이터로 채우지 않는다).
     색·글꼴 = erp/admin/platform_brand.css 한 벌(웰페리온 베이지·코랄 금지). -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../../erp/admin/platform_brand.css">
<style>
*{box-sizing:border-box}
body{padding:18px 20px 60px;max-width:1040px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.top>div{min-width:0}
.top .pf-st{flex:none;white-space:nowrap;margin-top:4px}
.brand{font-family:var(--pf-head);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pf-soft)}
.brand .dot{color:var(--pf-pri-dk)}
/* 한 열 고정 — 오른쪽 화면(iframe) 폭이 바뀌어도 두 카드가 서로 밀지 않는다(GM 2026-09-16 「좌우 사이즈에 따라 크기가 달라지고 글씨가 내려간다」) */
.grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.ch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:760px){.ch{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ch label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:1px solid var(--pf-line);border-radius:var(--pf-radius-sm);background:var(--pf-bg);font-size:13.5px;cursor:pointer;white-space:nowrap;overflow:hidden}
.ch label .pf-st{flex:none}
.ch label.off{opacity:.55;cursor:not-allowed}
.ch input{width:18px;height:18px;accent-color:var(--pf-pri-dk);margin:0}
.ch .pf-st{margin-left:auto}
.f{display:grid;gap:12px}
.f label.l{font-size:12.5px;font-weight:600;color:var(--pf-soft);display:block;margin-bottom:4px}
.drop{border:1px dashed var(--pf-pri);border-radius:var(--pf-radius-sm);background:var(--pf-bg);min-height:88px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;color:var(--pf-soft);padding:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.acts .note{font-size:12.5px;color:var(--pf-soft);margin-left:auto}
.pf-tabs{flex-wrap:nowrap;overflow-x:auto}
.pf-tabs [role=tab]{white-space:nowrap;flex:none}
.empty{padding:22px 12px;text-align:center;color:var(--pf-soft);font-size:13.5px}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat4 .box{border:1px solid var(--pf-line);border-radius:var(--pf-radius-sm);background:var(--pf-bg);padding:10px 12px;text-align:center}
.stat4 .box b{display:block;font-size:20px;font-weight:700;color:var(--pf-pri-dk)}
.stat4 .box span{font-size:11.5px;color:var(--pf-soft)}
@media (max-width:760px){.stat4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.subtbl{margin-top:10px;font-size:12px}
.srcname{font-size:11px;font-weight:400;color:var(--pf-soft);margin-left:6px}
.editbadge{font-size:11px;color:var(--pf-soft);margin-left:6px;white-space:nowrap}
.faildetails{margin-top:8px}
.faildetails summary{cursor:pointer;font-size:12.5px;color:var(--pf-soft)}
.faildetails table{margin-top:6px}
</style>
</head>
<body class="pf-body">

<div class="top">
  <div>
    <div class="brand">AX LABS<span class="dot">.</span> · 마케팅 자동화</div>
    <h1 class="pf-h1">파트너사 채널에 글 올리기</h1>
    <p class="pf-sub" style="margin:0">파트너사를 고르고, 켜진 채널에 글·사진을 한 번에 임시저장합니다. 실제 발행은 파트너사가 임시저장함에서 확인한 뒤 누릅니다.</p>
  </div>
  <span class="pf-st off" id="srv"><i></i>서버 연결 전</span>
</div>

<div class="pf-tabs" role="tablist" aria-label="계정" id="tenants">
  <button role="tab" aria-selected="true" class="on" data-tenant="wellperion">1호 웰페리온</button>
  <button role="tab" aria-selected="false" data-tenant="gm">GM 개인 · AI 하루</button>
  <button role="tab" aria-selected="false" data-tenant="dc">2호 다이어트캠프</button>
  <button role="tab" aria-selected="false" data-tenant="jo">3호 고척골프</button>
  <button role="tab" aria-selected="false" data-tenant="ax">웰페리온 AX 랩스</button>
</div>
<!-- 탭 5개(GM 2026-09-18 「개인계정이랑 공식계정 다 구분 · AX랩스도」 · 배 2792) — 공식/개인 계정 구분은 review_queue.json 의 account 칸(wellperion=공식 · namuk.wellperion=개인)으로 가른다 -->


<div class="grid" style="margin-top:14px">
  <section class="pf-card">
    <div class="pf-lb">채널 — 계정이 서버에 있으면 활성</div>
    <div class="ch" id="channels" data-hook="partner-channels"></div>

    <div class="pf-lb" style="margin-top:18px">글</div>
    <form class="f" id="form" data-hook="upload-submit" onsubmit="return false">
      <div><label class="l" for="title">제목</label><input class="pf-input" id="title" name="title" maxlength="80" placeholder="예) 9월 신규 회원 이벤트 안내"></div>
      <div><label class="l" for="body">본문</label><textarea class="pf-textarea" id="body" name="body" placeholder="채널마다 길이 규칙이 다르면 서버가 잘라 맞춥니다(블로그 전체 · 인스타 2,200자 · 당근 1,000자)."></textarea></div>
      <div><label class="l" for="imgs">사진</label><input type="file" id="imgs" name="images" accept="image/*" multiple hidden><div class="drop" id="drop" role="button" tabindex="0" aria-controls="imgs">사진을 끌어다 놓거나 눌러서 고르기<br><span id="imgCount"></span></div></div>
      <div><label class="l" for="when">올릴 시각</label><input class="pf-input" type="datetime-local" id="when" name="when"></div>
      <div class="acts">
        <button class="pf-btn p" type="submit" id="submit">임시저장함으로 보내기</button>
        <button class="pf-btn s" type="button" id="preview">미리보기</button>
        <span class="note" id="msg"></span>
      </div>
    </form>
  </section>

  <section class="pf-card">
    <div class="pf-lb">최근 발행 — <span id="tName">1호 웰페리온</span></div>
    <table class="pf-table" data-hook="upload-history"><colgroup><col style="width:24%"><col style="width:22%"><col><col style="width:22%"></colgroup>
      <thead><tr><th>날짜</th><th>채널</th><th>제목</th><th>상태</th></tr></thead>
      <tbody id="hist"><tr><td colspan="4" class="empty">서버가 연결되면 이 파트너사의 최근 발행이 여기에 뜹니다.</td></tr></tbody>
    </table>
  </section>
</div>

<section class="pf-card" style="margin-top:16px">
  <div class="pf-lb">업로드 시리즈 현황<span class="srcname" id="srcName"></span></div>
  <div id="seriesBody"><div class="empty">불러오는 중…</div></div>
</section>

<script>
(function(){
  // 채널 목록 = 파트너 계정 정본(플랫폼관리 파트너사 표)과 같은 7개 · 순서 고정 — 공식·다캠·고척 공용
  var CH_STD=[['naver-blog','네이버 블로그'],['naver-cafe','네이버 카페'],['instagram','인스타그램'],['threads','스레드'],['danggn','당근'],['google','구글 비즈니스'],['kakao-channel','카카오톡 채널']];
  // AX 랩스 5자리(부록 E · erp/admin/company_roadmap.html 320행) — gmail 은 server/erp_api/api_partner_secrets.py CHANNELS 에 키가 없어(존재 여부 API 없음) 항상 비활성으로 뜬다
  var CH_AX=[['gmail','지메일'],['instagram','인스타그램'],['threads','스레드'],['naver-blog','네이버 블로그'],['kakao-channel','카카오톡 채널']];
  // GM 개인계정 채널 — review_queue.json 실측(account=namuk.wellperion 67건이 전부 이 채널 하나)
  var CH_GM=[['ig-personal','인스타그램 (namuk.wellperion)']];
  var CH_BY_TENANT={wellperion:CH_STD,dc:CH_STD,jo:CH_STD,ax:CH_AX,gm:CH_GM};
  var NAMES={wellperion:'1호 웰페리온',gm:'GM 개인 · AI 하루',dc:'2호 다이어트캠프',jo:'3호 고척골프',ax:'웰페리온 AX 랩스'};   // ax = 랩스 자체 메시지 채널(GM 2026-09-16 · 시보)
  var LOCK=(new URLSearchParams(location.search).get('tenant')||'').trim();   // ERP 홈 마케팅 관리에서 열면 ?tenant=wellperion — 그 센터만(GM 2026-09-18 「다른 파트너사 것까지 다 보이네」)
  var tenant=(LOCK && document.querySelector('#tenants [data-tenant="'+LOCK+'"]'))?LOCK:'wellperion', active={};
  if(LOCK && tenant===LOCK){ var _tb=document.getElementById('tenants'); if(_tb){ _tb.hidden=true; _tb.style.display='none'; } }   // platform_brand.css .pf-tabs{display:flex} 가 hidden 속성보다 캐스케이드에서 이겨 인라인으로 덮는다(배 2792 발견)
  var $=function(id){return document.getElementById(id)};

  function renderChannels(){
    var host=$('channels'); host.innerHTML='';
    var offLabel=tenant==='ax'?'비활성 · 개설 대기':'비활성';
    (CH_BY_TENANT[tenant]||CH_STD).forEach(function(c){
      var on=!!active[c[0]];
      var l=document.createElement('label'); l.className=on?'':'off';
      l.innerHTML='<input type="checkbox" name="channels" value="'+c[0]+'"'+(on?'':' disabled')+'> '+c[1]+'<span class="pf-st '+(on?'on':'off')+'"><i></i>'+(on?'활성':offLabel)+'</span>';
      host.appendChild(l);
    });
  }
  // 업로드 시리즈 현황 — 파트너사별(GM 2026-09-18 12:4x · 배 2788)
  var REPO='/repo/';
  function fetchFirst(paths){
    var p=Promise.reject();
    paths.forEach(function(u){ p=p.catch(function(){ return fetch(encodeURI(u)).then(function(r){ if(!r.ok) throw 0; return r.json(); }); }); });
    return p;
  }
  function fmtDate(s){ return s?String(s).slice(0,10):'—'; }
  function trunc(s,n){ s=String(s||''); return s.length>n?s.slice(0,n)+'…':s; }
  // 발행 표 공통 가공(배 2792·2794 · GM 09-18 15:0x~15:1x 원 설계 → 15:2x 「날짜×켜진 채널」 표로 변경) —
  // ① 같은 제목(주제)으로 성공(ok) 기록이 여럿이면 마지막 한 줄만 보여주고, 그 앞의 성공은 "수정 N" 배지로 접는다(첫 성공은 원글 · 그 뒤 성공은 재발행/수정).
  // ② 실패(ok=false)는 표 줄로 안 올린다 — 계정 탭 전체 최근 7일치 건수만 배지로, 펼치면(details) 목록.
  // ③ 제목 글자 자체가 글 주소 링크(url 없으면 글자만) — 별도 링크 열 없음.
  // ④ 표 = 날짜 한 줄, 열 = 그 계정에 데이터가 있는 채널만(꺼진 채널은 열 자체를 안 그림). 칸 = 상태 배지 + 링크 제목, 같은 날 같은 채널에 여럿이면 칸 안에서 줄바꿈.
  function buildChannelData(rows){
    var groups={}, cutoff=Date.now()-7*86400000, recentFails=[];
    rows.forEach(function(r){
      var k=r.title||'(제목 없음)';
      (groups[k]=groups[k]||[]).push(r);
      if(!r.ok && !r.pending){ var t=Date.parse(r.date); if(!isNaN(t)&&t>=cutoff) recentFails.push(r); }   // pending(예: 인스타 임시저장 대기)은 실패가 아니다 — 세지 않는다
    });
    var display=[];
    Object.keys(groups).forEach(function(k){
      var ok=groups[k].filter(function(r){return r.ok;});
      if(!ok.length) return;   // 전부 실패인 주제 — 표 줄에 안 올림(실패 건수에는 이미 반영됨)
      ok.sort(function(a,b){return String(a.date).localeCompare(String(b.date));});
      var last=ok[ok.length-1];
      display.push({date:last.date,title:last.title,url:last.url,label:last.label,edits:ok.length-1});
    });
    display.sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
    return {display:display, recentFails:recentFails};
  }
  function failDetailsHtml(recentFails){
    if(!recentFails.length) return '';
    var rows=recentFails.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date));}).map(function(r){
      return '<tr><td>'+fmtDate(r.date)+'</td><td>'+(r.title||'')+'</td><td>'+trunc(r.reason,40)+'</td></tr>';
    }).join('');
    return '<details class="faildetails"><summary>최근 7일 실패 '+recentFails.length+'건</summary><table class="pf-table"><thead><tr><th>날짜</th><th>제목</th><th>사유</th></tr></thead><tbody>'+rows+'</tbody></table></details>';
  }
  function gridCellHtml(items){
    if(!items.length) return '<td>—</td>';
    var html=items.map(function(x){
      var badge=x.edits?'<span class="editbadge">수정 '+x.edits+'</span>':'';
      var t=x.title||'(제목 없음)';
      var titleCell=x.url?'<a href="'+x.url+'" target="_blank" rel="noopener">'+t+'</a>':t;
      return '<div><span class="pf-st on"><i></i>'+x.label+'</span> '+titleCell+badge+'</div>';
    }).join('');
    return '<td>'+html+'</td>';
  }
  function renderGrid(host, rows){
    // rows: [{date,title,url,ok,pending,reason,channel,label}] — 소스 무관 공통 모양
    var channels=groupByChannel(rows);   // 데이터가 있는(=켜진) 채널만 — 없는 채널은 groupByChannel 이 애초에 안 만든다
    if(!channels.length){ host.innerHTML='<div class="empty">아직 기록 없음</div>'; return; }
    var chData=channels.map(function(c){ return {name:c.name, data:buildChannelData(c.rows)}; });
    var recentFails=[].concat.apply([], chData.map(function(c){return c.data.recentFails;}));
    var dateSet={};
    chData.forEach(function(c){ c.data.display.forEach(function(x){ dateSet[fmtDate(x.date)]=1; }); });
    var dates=Object.keys(dateSet).sort(function(a,b){
      if(a==='—') return 1; if(b==='—') return -1;   // 날짜 미상은 맨 뒤(문자열로 정렬하면 — 가 숫자보다 커서 맨 위로 뜨는 버그 있었음)
      return a<b?1:(a>b?-1:0);   // 최신이 위
    }).slice(0,12);
    var gridHtml='<div class="empty">아직 기록 없음</div>';
    if(dates.length){
      var head='<tr><th>날짜</th>'+chData.map(function(c){return '<th>'+c.name+'</th>';}).join('')+'</tr>';
      var body=dates.map(function(d){
        var cells=chData.map(function(c){ return gridCellHtml(c.data.display.filter(function(x){return fmtDate(x.date)===d;})); }).join('');
        return '<tr><td>'+d+'</td>'+cells+'</tr>';
      }).join('');
      gridHtml='<div style="overflow-x:auto"><table class="pf-table"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
    }
    host.innerHTML=gridHtml+failDetailsHtml(recentFails);
  }
  function groupByChannel(rows){
    var by={}, order=[];
    rows.forEach(function(r){ if(!by[r.channel]){ by[r.channel]=[]; order.push(r.channel); } by[r.channel].push(r); });
    return order.map(function(name){ return {name:name, rows:by[name]}; });
  }
  // 소스별 정규화 — {date,title,url,ok,pending,reason,channel,label}. label = 칸에 찍히는 짧은 상태 글자.
  function normReview(items){
    return items.map(function(x){ return {date:x.published_at||x.card_sent_at||'', title:x.title||'', url:x.post_url||'', ok:x.status==='발행완료', reason:x.status||'', channel:x.channel||'(채널 없음)', label:'발행'}; });
  }
  function normBlog(runs){
    return (runs||[]).map(function(r){ return {date:r.date||'', title:r.topic||'', url:r.url||'', ok:r.result==='ok', reason:r.reason||'', channel:'블로그', label:'발행'}; });
  }
  function normIg(runs){
    // sent:false·없음 = 아직 발행기 검토 전 "대기" 상태(실패 아님) — partner_instagram/*.json 에는 실패 개념 자체가 없다
    return (runs||[]).map(function(r){ return {date:r.at||'', title:r.topic||'', url:r.post_url||'', ok:!!r.sent, pending:!r.sent, reason:'대기', channel:'인스타그램', label:'임시저장'}; });
  }
  function renderSeries(){
    var body=$('seriesBody'), src=$('srcName'), curTenant=tenant;
    body.innerHTML='<div class="empty">불러오는 중…</div>';
    if(tenant==='wellperion'){
      // 공식 계정만 — account==='wellperion' (review_queue.json 실측 · 09-18 배 2792). 그 외 계정 표기(비즈(cao)·없음)는 미분류로 따로 표기
      src.textContent='review_queue.json(공식 계정)';
      fetchFirst([REPO+'3. 웰페리온 가이드/cmo/review/review_queue.json','../review/review_queue.json']).then(function(review){
        if(curTenant!==tenant) return;
        var items=Array.isArray(review)?review:((review&&review.items)||[]);
        if(!items.length){ body.innerHTML='<div class="empty">아직 기록 없음</div>'; return; }
        var official=items.filter(function(x){return x.account==='wellperion';});
        var personalCnt=items.filter(function(x){return x.account==='namuk.wellperion';}).length;
        var other=items.length-official.length-personalCnt;
        body.innerHTML='';
        var chWrap=document.createElement('div'); body.appendChild(chWrap);
        renderGrid(chWrap, normReview(official));
        if(other){ var n=document.createElement('div'); n.className='srcname'; n.style.cssText='display:block;margin-top:6px'; n.textContent='미분류 '+other+'건(계정 칸 없음·기타 표기) — 개인계정(namuk.wellperion)엔 안 들어가 공식 쪽에 표시'; body.appendChild(n); }
      }).catch(function(){ if(curTenant===tenant) body.innerHTML='<div class="empty">아직 기록 없음</div>'; });
    } else if(tenant==='gm'){
      // 개인계정 — series_data.json(AI 시리즈 로드맵, 전량 개인계정) + review_queue.json 의 account==='namuk.wellperion'
      src.textContent='series_data.json · review_queue.json(개인 계정)';
      Promise.allSettled([
        fetchFirst([REPO+'3. 웰페리온 가이드/cmo/series/series_data.json','../series/series_data.json']),
        fetchFirst([REPO+'3. 웰페리온 가이드/cmo/review/review_queue.json','../review/review_queue.json'])
      ]).then(function(res){
        if(curTenant!==tenant) return;
        var series=res[0].status==='fulfilled'?res[0].value:null;
        var review=res[1].status==='fulfilled'?res[1].value:null;
        if(!series && !review){ body.innerHTML='<div class="empty">아직 기록 없음</div>'; return; }
        var eps=(series&&series.episodes)||[];
        var done=eps.filter(function(e){return /발행완료/.test(e.roadmap_status||'');}).length;
        var wait=eps.filter(function(e){return /검수대기|검수요청/.test(e.roadmap_status||'');}).length;
        var items=Array.isArray(review)?review:((review&&review.items)||[]);
        var personal=items.filter(function(x){return x.account==='namuk.wellperion';});
        var pubs=personal.filter(function(x){return x.status==='발행완료'&&x.published_at;}).map(function(x){return x.published_at;}).sort();
        var last=pubs.length?fmtDate(pubs[pubs.length-1]):'—';
        body.innerHTML='<div class="stat4"><div class="box"><b>'+(eps.length||'—')+'</b><span>전체 회차</span></div><div class="box"><b>'+done+'</b><span>발행완료</span></div><div class="box"><b>'+wait+'</b><span>검수대기</span></div><div class="box"><b>'+last+'</b><span>마지막 발행일</span></div></div>';
        var chWrap=document.createElement('div'); body.appendChild(chWrap);
        renderGrid(chWrap, normReview(personal));
      });
    } else if(tenant==='dc'||tenant==='jo'){
      var blogFile=tenant==='dc'?'dietcamp_blog_daily.json':'gocheok_blog_daily.json';
      src.textContent=blogFile+' · partner_instagram/'+tenant+'.json';
      Promise.allSettled([
        fetchFirst([REPO+'status/'+blogFile,'../../../status/'+blogFile]),
        fetchFirst([REPO+'status/partner_instagram/'+tenant+'.json','../../../status/partner_instagram/'+tenant+'.json'])
      ]).then(function(res){
        if(curTenant!==tenant) return;
        var blog=res[0].status==='fulfilled'?res[0].value:null;
        var ig=res[1].status==='fulfilled'?res[1].value:null;
        var rows=normBlog(blog&&blog.runs).concat(normIg(ig&&ig.runs));
        body.innerHTML='';
        var chWrap=document.createElement('div'); body.appendChild(chWrap);
        renderGrid(chWrap, rows);
      });
    } else {
      src.textContent='ax_blog_daily.json';
      fetchFirst([REPO+'status/ax_blog_daily.json','../../../status/ax_blog_daily.json']).then(function(blog){
        if(curTenant!==tenant) return;
        body.innerHTML='';
        var chWrap=document.createElement('div'); body.appendChild(chWrap);
        renderGrid(chWrap, normBlog(blog&&blog.runs));
      }).catch(function(){ if(curTenant===tenant) body.innerHTML='<div class="empty">아직 기록 없음</div>'; });
    }
  }
  function load(){
    $('tName').textContent=NAMES[tenant]; active={}; renderSeries();
    if(tenant==='gm'){
      // GM 개인계정 = 플랫폼관리 파트너사 표에 없다(서버 존재확인 대상 아님) — review_queue.json 실측으로 이미 발행 중이라 항상 활성
      active={'ig-personal':1}; renderChannels();
    } else {
      renderChannels();
      fetch('/api/partner_secrets/status?tenant='+encodeURIComponent(tenant),{credentials:'same-origin'})
        .then(function(r){ if(!r.ok) throw 0; return r.json(); })
        .then(function(j){ (j.channels||[]).forEach(function(c){ if(c.active) active[c.channel]=1; }); $('srv').className='pf-st on'; $('srv').innerHTML='<i></i>서버 연결됨'; renderChannels(); })
        .catch(function(){ /* 배선 전 — 「서버 연결 전」 그대로 */ });
    }
    fetch('/api/marketing/uploads?tenant='+encodeURIComponent(tenant),{credentials:'same-origin'})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ var rows=(j.items||[]); if(!rows.length) return; $('hist').innerHTML=rows.map(function(x){ return '<tr><td>'+x.date+'</td><td>'+x.channel+'</td><td>'+x.title+'</td><td><span class="pf-st '+(x.status==='ok'?'on':x.status==='fail'?'bad':'warn')+'"><i></i>'+x.status_label+'</span></td></tr>'; }).join(''); })
      .catch(function(){});
  }
  document.querySelectorAll('#tenants [role=tab]').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#tenants [role=tab]').forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-selected','false'); });
      b.classList.add('on'); b.setAttribute('aria-selected','true'); tenant=b.dataset.tenant; load();
    });
  });
  var drop=$('drop'), imgs=$('imgs');
  drop.addEventListener('click',function(){ imgs.click(); });
  drop.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); imgs.click(); } });
  imgs.addEventListener('change',function(){ $('imgCount').textContent=imgs.files.length?imgs.files.length+'장 골랐습니다':''; });
  $('form').addEventListener('submit',function(){
    var chs=[].slice.call(document.querySelectorAll('input[name=channels]:checked')).map(function(i){return i.value});
    if(!chs.length){ $('msg').textContent='켜진 채널을 하나 이상 고르세요.'; return; }
    if(!$('title').value.trim()){ $('msg').textContent='제목을 적으세요.'; $('title').focus(); return; }
    var fd=new FormData($('form')); fd.set('tenant',tenant); chs.forEach(function(c){ fd.append('channels',c); });
    $('submit').disabled=true; $('msg').textContent='보내는 중…';
    fetch('/api/marketing/upload',{method:'POST',body:fd,credentials:'same-origin'})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(){ $('msg').textContent='임시저장함으로 보냈습니다.'; load(); })
      .catch(function(){ $('msg').textContent='서버가 아직 연결되지 않았습니다 — 배선 뒤 다시 보내세요.'; })
      .then(function(){ $('submit').disabled=false; });
  });
  $('preview').addEventListener('click',function(){ $('msg').textContent='미리보기: 「'+($('title').value||'(제목 없음)')+'」 · '+($('body').value.length)+'자'; });
  load();
})();
</script>
</body>
</html>
