<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>웰페리온 둘러보기 — 360°</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 2단계 — 360° 촬영본으로 제자리에서 둘러보고, 바닥의 고리를 눌러 다음 지점으로 걸어간다.
   지점·연결 정본 = home/assets/360/tour_nodes.json (2026-09-05 공개 홈 폴더로 이동). 이 파일은 뷰어만. */
:root{--bg:#0F0E0E;--ink:#F1ECE5;--ink-2:#BFB4A9;--beige:#B79F8A;--label:"Jost","Pretendard",sans-serif;--sans:"Pretendard","Jost",sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#pano{position:fixed;inset:0}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 28px;z-index:5;pointer-events:none}
.wordmark{font-family:var(--label);letter-spacing:.32em;font-size:12px;font-weight:500}
.wordmark small{display:block;letter-spacing:.14em;font-size:10.5px;color:var(--ink-2);margin-top:4px;font-weight:400}
.title{position:fixed;left:28px;bottom:30px;z-index:5;pointer-events:none}
.title .en{font-family:var(--label);letter-spacing:.28em;font-size:11px;color:var(--beige)}
.title h2{font-weight:400;font-size:clamp(24px,3.4vw,42px);margin:6px 0 0;letter-spacing:-.01em;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.hint{position:fixed;right:28px;bottom:34px;z-index:5;font-family:var(--label);font-size:11px;letter-spacing:.2em;color:var(--ink-2);pointer-events:none}
.wait{position:fixed;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;text-align:center}
.wait div{font-family:var(--label);letter-spacing:.24em;font-size:12px;color:var(--ink-2);background:rgba(15,14,14,.55);padding:14px 22px;border:1px solid rgba(241,236,229,.16)}
/* 바닥 고리 — 다음 지점으로 */
.pnlm-hotspot-base.step{width:54px;height:54px;border-radius:50%;border:1px solid rgba(241,236,229,.85);background:rgba(15,14,14,.25);backdrop-filter:blur(3px);transform:translate(-50%,-50%) rotateX(55deg)}
.pnlm-hotspot-base.step::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(183,159,138,.55);animation:pulse 2.4s ease-out infinite}
.pnlm-hotspot-base.step:hover{border-color:var(--beige)}
.pnlm-hotspot-base.step .pnlm-tooltip span{font-family:var(--label);font-size:11px;letter-spacing:.18em;background:rgba(15,14,14,.8);color:var(--ink);border:0;padding:6px 10px}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.pnlm-load-box,.pnlm-about-msg{display:none!important}
.pnlm-container{background:var(--bg)!important}
</style>
</head>
<body>
<div id="pano"></div>
<div class="top"><div class="wordmark">WELLPERION<small>360° 둘러보기</small></div></div>
<div class="title"><div class="en">WALK THROUGH</div><h2 id="ttl"></h2></div>
<div class="hint">끌어서 둘러보기 · 바닥 고리를 눌러 이동</div>
<div class="wait" id="wait" hidden><div>360° 촬영본 대기 중 — 지점 2곳은 시험 화면입니다</div></div>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script>
(function(){
  var BASE="../../home/assets/360/";
  fetch(BASE+"tour_nodes.json?v="+Date.now()).then(function(r){return r.json()}).then(function(cfg){
    var scenes={}, placeholder=false;
    cfg.nodes.forEach(function(n){
      if(n.file==="_placeholder.jpg") placeholder=true;
      scenes[n.id]={type:"equirectangular",panorama:BASE+n.file,yaw:n.yaw||0,pitch:0,hfov:95,title:n.title,
        hotSpots:(n.hotspots||[]).map(function(h){return {type:"scene",sceneId:h.to,yaw:h.yaw,pitch:h.pitch,text:h.text||"",cssClass:"pnlm-hotspot-base step"}})};
    });
    document.getElementById('wait').hidden=!placeholder;
    var v=pannellum.viewer('pano',{default:{firstScene:cfg.start,sceneFadeDuration:900,autoLoad:true,showControls:false,compass:false,autoRotate:0},scenes:scenes});
    function ttl(){ var s=v.getScene(); document.getElementById('ttl').textContent=(scenes[s]||{}).title||''; }
    v.on('load',ttl); ttl();
  });
})();
</script>
  <script src="../../_assets/page_ping.js" defer></script>
</body>
</html>
