<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>웰페리온 둘러보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 시설 둘러보기 1단계 — 실제 촬영 사진 28장으로 공간을 옮겨 다니는 구조.
   2단계(360° 촬영본)는 같은 자리(.stage)에 빙 돌려보기를 끼운다 — 구조 유지, 사진만 교체. */
:root{
  --bg:#0F0E0E; --ink:#F1ECE5; --ink-2:#BFB4A9; --ink-3:#7E746C;
  --beige:#B79F8A; --line:rgba(241,236,229,.16);
  --serif:"Playfair Display","Noto Serif KR",Georgia,serif;
  --sans:"Pretendard","Jost","Noto Sans KR",-apple-system,sans-serif;
  --label:"Jost","Pretendard",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--beige);outline-offset:3px}

/* ── stage ───────────────────────────────── */
.stage{position:fixed;inset:0;perspective:1200px;overflow:hidden;background:var(--bg)}
.room{position:absolute;inset:0;opacity:0;pointer-events:none;transform-style:preserve-3d}
.room.is-on{opacity:1;pointer-events:auto}
.room .photo{position:absolute;inset:-6%;background-size:cover;background-position:center;transform:scale(1.04);will-change:transform;filter:saturate(.96)}
.room .photo.framed{background-size:cover;filter:blur(28px) brightness(.55) saturate(.9);transform:scale(1.15)}
.room .frame{position:absolute;inset:0;transform:translateZ(60px);display:none;align-items:center;justify-content:center;padding:12vh 14vw 22vh}
.room .frame img{height:min(62vh,760px);width:auto;max-width:74vw;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.55);border:1px solid rgba(241,236,229,.12)}
.room.small .frame{display:flex}
.vignette{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(120% 90% at 50% 40%, transparent 45%, rgba(15,14,14,.55) 100%),
  linear-gradient(to top, rgba(15,14,14,.82) 0%, rgba(15,14,14,.25) 28%, transparent 55%),
  linear-gradient(to bottom, rgba(15,14,14,.5) 0%, transparent 22%)}

/* 들어가기 / 나오기 */
.room.enter .photo{animation:enter 1100ms cubic-bezier(.2,.7,.2,1) forwards}
.room.leave{opacity:1;animation:leaveFade 900ms ease forwards}
.room.leave .photo{animation:leave 900ms cubic-bezier(.4,0,.8,1) forwards}
.room.enter .frame img{animation:frameIn 900ms cubic-bezier(.2,.7,.2,1) forwards}
@keyframes enter{from{transform:scale(1.12);opacity:0}to{transform:scale(1.04);opacity:1}}
@keyframes leave{from{transform:scale(1.04)}to{transform:scale(1.22);filter:blur(6px)}}
@keyframes leaveFade{from{opacity:1}to{opacity:0}}
@keyframes frameIn{from{transform:translateY(18px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* ── chrome ───────────────────────────────── */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:22px 28px;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.wordmark{font-family:var(--label);letter-spacing:.32em;font-size:12px;font-weight:500;color:var(--ink)}
.wordmark small{display:block;letter-spacing:.14em;font-size:10.5px;color:var(--ink-2);margin-top:4px;font-weight:400}
.counter{font-family:var(--label);font-variant-numeric:tabular-nums;letter-spacing:.18em;font-size:12px;color:var(--ink-2)}
.counter b{color:var(--ink);font-weight:500}

.rail{position:fixed;left:28px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:2px}
.rail button{text-shadow:0 1px 10px rgba(0,0,0,.6);display:grid;grid-template-columns:22px 1fr;align-items:center;gap:10px;padding:6px 0;text-align:left;font-family:var(--label);font-size:12px;letter-spacing:.08em;color:var(--ink-3);transition:color .3s}
.rail button i{display:block;width:6px;height:6px;border-radius:50%;background:currentColor;justify-self:center;transform:scale(.7);transition:transform .3s}
.rail button:hover{color:var(--ink-2)}
.rail button.is-on{color:var(--ink)}
.rail button.is-on i{transform:scale(1.4);background:var(--beige)}
.rail button.is-done{color:var(--ink-2)}

.caption{position:fixed;left:28px;right:28px;bottom:30px;z-index:5;display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;pointer-events:none}
.caption>*{pointer-events:auto}
.caption .en{font-family:var(--label);letter-spacing:.28em;font-size:11px;color:var(--beige);text-transform:uppercase}
.caption h2{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.2vw,54px);line-height:1.05;margin:8px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.caption p{margin:0;color:var(--ink-2);font-size:14px;letter-spacing:.02em}
.subs{display:flex;gap:8px}
.subs button{width:76px;height:52px;border:1px solid var(--line);background-size:cover;background-position:center;opacity:.72;transition:opacity .25s,border-color .25s}
.subs button:hover,.subs button.is-on{opacity:1;border-color:var(--beige)}

/* 다음 공간으로 — 문(門) 같은 고리 */
.door{position:fixed;right:9vw;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink)}
.door .ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(241,236,229,.7);display:grid;place-items:center;position:relative;backdrop-filter:blur(4px);background:rgba(15,14,14,.18);transition:transform .35s,border-color .35s}
.door .ring::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(183,159,138,.5);animation:pulse 2.6s ease-out infinite}
.door .ring svg{width:22px;height:22px}
.door:hover .ring{transform:scale(1.08);border-color:var(--beige)}
.door span{font-family:var(--label);font-size:11px;letter-spacing:.22em;color:var(--ink-2)}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.back{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:5;font-family:var(--label);font-size:11px;letter-spacing:.22em;color:var(--ink-3);padding:8px 10px}
.back:hover{color:var(--ink-2)}

/* ── intro ─────────────────────────────────── */
.intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;text-align:center;background:var(--bg);transition:opacity 900ms ease,visibility 0s 900ms;visibility:visible}
.intro.is-off{opacity:0;visibility:hidden}
.intro .bg{position:absolute;inset:-4%;background:url("../../회사문서/assets/profile/01-hero-photo-layer.jpg") center/cover;opacity:.55;transform:scale(1.02);animation:introKen 18s ease-in-out infinite alternate}
@keyframes introKen{to{transform:scale(1.1)}}
.intro .veil{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 55%, rgba(15,14,14,.15), rgba(15,14,14,.85))}
.intro .in{position:relative;padding:0 24px;max-width:720px}
.intro .en{font-family:var(--label);letter-spacing:.34em;font-size:12px;color:var(--beige)}
.intro h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,6vw,76px);line-height:1.05;margin:16px 0 14px;letter-spacing:-.01em;text-wrap:balance}
.intro p{color:var(--ink-2);font-size:15px;margin:0 0 34px;letter-spacing:.02em}
.intro .go{display:inline-flex;align-items:center;gap:14px;padding:16px 30px;border:1px solid rgba(241,236,229,.5);font-family:var(--label);letter-spacing:.26em;font-size:12px;transition:border-color .3s,background .3s}
.intro .go:hover{border-color:var(--beige);background:rgba(183,159,138,.12)}
.intro .hint{margin-top:26px;font-family:var(--label);font-size:11px;letter-spacing:.18em;color:var(--ink-3)}

/* ── overlay list (mobile) ─────────────────── */
.listbtn{display:none;font-family:var(--label);font-size:11px;letter-spacing:.22em;color:var(--ink-2);padding:8px 0}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(15,14,14,.94);display:none;padding:80px 20px 30px;overflow:auto}
.overlay.is-on{display:block}
.overlay .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:720px;margin:0 auto}
.overlay .grid button{aspect-ratio:4/3;background-size:cover;background-position:center;position:relative;text-align:left;border:1px solid var(--line)}
.overlay .grid button b{position:absolute;left:12px;bottom:10px;font-weight:500;font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.overlay .close{position:absolute;top:22px;right:24px;font-family:var(--label);letter-spacing:.22em;font-size:11px;color:var(--ink-2);padding:8px}

@media (max-width:900px){
  .rail{display:none}
  .listbtn{display:block}
  .top{padding:18px 18px}
  .caption{left:18px;right:18px;bottom:24px;grid-template-columns:1fr}
  .subs{order:-1}
  .door{right:18px;top:auto;bottom:150px;transform:none}
  .door .ring{width:52px;height:52px}
  .door span{display:none}
  .back{display:none}
  .room .frame{padding:10vh 6vw 30vh}
}
@media (prefers-reduced-motion:reduce){
  .room.enter .photo,.room.leave .photo,.room.leave,.room.enter .frame img,.intro .bg,.door .ring::before{animation:none}
  .room.leave{opacity:0}
}
</style>
</head>
<body>

<div class="intro" id="intro">
  <div class="bg"></div><div class="veil"></div>
  <div class="in">
    <div class="en">WELLPERION · HANNAM</div>
    <h1>공간을 걸어서<br>둘러보세요</h1>
    <p>리셉션에서 시작해 수영장·스파·트레이닝·골프·스쿼시·체조·필라테스·생크몽드·살롱까지, 열 곳을 차례로 지나갑니다.</p>
    <button class="go" id="go">입장<svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M0 6h16M11 1l5 5-5 5"/></svg></button>
    <div class="hint">← → 방향키 · 화면 밀기</div>
  </div>
</div>

<div class="stage" id="stage"></div>
<div class="vignette"></div>

<div class="top">
  <div class="wordmark">WELLPERION<small>둘러보기</small></div>
  <button class="listbtn" id="listbtn">공간 목록</button>
  <div class="counter"><b id="cur">01</b> / <span id="tot">10</span></div>
</div>

<nav class="rail" id="rail" aria-label="공간 순서"></nav>

<div class="caption">
  <div>
    <div class="en" id="cap-en"></div>
    <h2 id="cap-ko"></h2>
    <p id="cap-line"></p>
  </div>
  <div class="subs" id="subs" aria-label="이 공간의 다른 장면"></div>
</div>

<button class="door" id="next" aria-label="다음 공간으로">
  <span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span>
  <span id="next-name">다음</span>
</button>
<button class="back" id="prev">← 이전 공간</button>

<div class="overlay" id="overlay">
  <button class="close" id="close">닫기</button>
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
  var P = "../../회사문서/assets/profile/";
  // 공간 10곳 · 걷는 순서. main = 크게 보는 사진, subs = 같은 공간의 다른 장면.
  // w < 1000 인 사진은 'framed'(액자) 모드로 보인다 — 작은 원본을 화면에 늘리지 않는다.
  var ROOMS = [
    {ko:"리셉션 & 라운지", en:"Reception & Lounge", line:"서울 용산구 서빙고로 413 · 한남동",
     main:{f:"16-reception-desk.jpg",w:370}, subs:[{f:"02-lounge-gallery.jpg",w:539}]},
    {ko:"25m 수영장", en:"25m Pool", line:"실내 25m 레인",
     main:{f:"20-pool.jpg",w:1400}, subs:[{f:"03-25m-pool.jpg",w:530}]},
    {ko:"사우나 & 스파", en:"Sauna & Spa", line:"사우나 · 냉탕 · 모자이크 바스",
     main:{f:"24-sauna.jpg",w:1400}, subs:[{f:"25-cold-bath.jpg",w:1400},{f:"04-mosaic-bath.jpg",w:539},{f:"05-spa-marble.jpg",w:539}]},
    {ko:"트레이닝", en:"Training", line:"테크노짐",
     main:{f:"01-hero-photo-layer.jpg",w:1800}, subs:[{f:"23-technogym.jpg",w:1400},{f:"06-treadmill-line.jpg",w:561},{f:"07-technogym.jpg",w:270}]},
    {ko:"골프", en:"Golf", line:"GDR · QED 타석",
     main:{f:"21-golf.jpg",w:1400}, subs:[{f:"08-gdr-golf.jpg",w:536}]},
    {ko:"스쿼시", en:"Squash", line:"스쿼시 코트",
     main:{f:"22-squash.jpg",w:1400}, subs:[{f:"09-squash-court.jpg",w:539}]},
    {ko:"체조 & 트램폴린", en:"Gymnastics", line:"체조 스튜디오",
     main:{f:"28-gymnastics-studio.jpg",w:1400}, subs:[{f:"10-gymnastics-studio.jpg",w:539}]},
    {ko:"필라테스", en:"Pilates", line:"STOTT · 스태빌리티 체어 · 래더 배럴",
     main:{f:"26-pilates-stability-chair.jpg",w:1400}, subs:[{f:"27-pilates-ladder-barrel.jpg",w:1400},{f:"11-stott-pilates.jpg",w:270}]},
    {ko:"생크몽드 스파", en:"Cinq Mondes", line:"트리트먼트 룸 · 라운지",
     main:{f:"12-cinq-mondes-treatment.jpg",w:1000}, subs:[{f:"17-cinq-mondes-lounge.jpg",w:1000},{f:"18-treatment-chair.jpg",w:1000},{f:"19-cinq-mondes-products.jpg",w:1000}]},
    {ko:"뷰티 살롱", en:"beautévu", line:"헤어 · 메이크업",
     main:{f:"13-beaut-vu-salon.jpg",w:370}, subs:[{f:"14-hair-stations.jpg",w:370},{f:"15-makeup-station.jpg",w:370}]}
  ];

  var stage=document.getElementById('stage'), rail=document.getElementById('rail'), grid=document.getElementById('grid');
  var cur=-1, busy=false, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pad=function(n){return (n<10?'0':'')+n};
  document.getElementById('tot').textContent=pad(ROOMS.length);

  // 방 DOM 은 한 번만 만든다
  ROOMS.forEach(function(r,i){
    var el=document.createElement('div'); el.className='room'; el.dataset.i=i;
    el.innerHTML='<div class="photo"></div><div class="frame"><img alt=""></div>';
    stage.appendChild(el); r.el=el;
    var b=document.createElement('button'); b.innerHTML='<i></i><span>'+r.ko+'</span>'; b.onclick=function(){go(i)}; rail.appendChild(b); r.rb=b;
    var g=document.createElement('button'); g.style.backgroundImage='url("'+P+r.main.f+'")'; g.innerHTML='<b>'+r.ko+'</b>'; g.onclick=function(){closeList(); go(i)}; grid.appendChild(g);
  });

  function show(r,pic){
    var url=P+pic.f, small=pic.w<1000;
    r.el.classList.toggle('small',small);
    var ph=r.el.querySelector('.photo'); ph.style.backgroundImage='url("'+url+'")'; ph.classList.toggle('framed',small);
    r.el.querySelector('.frame img').src=small?url:'';
  }
  function caption(i,pic){
    var r=ROOMS[i];
    document.getElementById('cap-en').textContent=r.en;
    document.getElementById('cap-ko').textContent=r.ko;
    document.getElementById('cap-line').textContent=r.line;
    document.getElementById('cur').textContent=pad(i+1);
    document.getElementById('next-name').textContent= i+1<ROOMS.length ? ROOMS[i+1].ko : '처음으로';
    var subs=document.getElementById('subs'); subs.innerHTML='';
    [r.main].concat(r.subs).forEach(function(p){
      var b=document.createElement('button'); b.style.backgroundImage='url("'+P+p.f+'")'; b.setAttribute('aria-label',r.ko+' 다른 장면');
      if(p===pic) b.classList.add('is-on');
      b.onclick=function(){ show(r,p); caption(i,p); };
      subs.appendChild(b);
    });
    ROOMS.forEach(function(x,k){ x.rb.classList.toggle('is-on',k===i); x.rb.classList.toggle('is-done',k<i); });
  }
  function preload(i){ var r=ROOMS[i]; if(!r) return; [r.main].concat(r.subs).forEach(function(p){ var im=new Image(); im.src=P+p.f; }); }

  function go(i){
    if(busy) return; i=(i+ROOMS.length)%ROOMS.length; if(i===cur) return;
    busy=true;
    var prev=cur>=0?ROOMS[cur]:null, next=ROOMS[i];
    show(next,next.main); caption(i,next.main);
    next.el.classList.remove('leave'); next.el.classList.add('is-on','enter');
    if(prev){ prev.el.classList.remove('is-on','enter'); prev.el.classList.add('leave'); }
    cur=i; preload(i+1);
    setTimeout(function(){ if(prev) prev.el.classList.remove('leave'); next.el.classList.remove('enter'); busy=false; }, reduce?50:950);
  }

  document.getElementById('next').onclick=function(){go(cur+1)};
  document.getElementById('prev').onclick=function(){go(cur-1)};
  document.getElementById('go').onclick=function(){ document.getElementById('intro').classList.add('is-off'); go(0); };
  document.addEventListener('keydown',function(e){
    if(document.getElementById('intro').classList.contains('is-off')===false){ if(e.key==='Enter'||e.key===' '){ document.getElementById('go').click(); } return; }
    if(e.key==='ArrowRight') go(cur+1); else if(e.key==='ArrowLeft') go(cur-1); else if(e.key==='Escape') closeList();
  });

  // 깊이감 — 마우스 위치로 사진을 아주 조금 기울인다 (2단계 360° 가 오면 이 자리가 빙 돌려보기로 바뀐다)
  if(!reduce){
    var rx=0,ry=0,tx=0,ty=0;
    document.addEventListener('mousemove',function(e){ tx=(e.clientX/innerWidth-.5); ty=(e.clientY/innerHeight-.5); });
    (function tick(){ rx+=(tx-rx)*.06; ry+=(ty-ry)*.06;
      if(cur>=0 && !busy && !ROOMS[cur].el.classList.contains('small')){ var ph=ROOMS[cur].el.querySelector('.photo');
        ph.style.transform='scale(1.04) translate('+(-rx*22)+'px,'+(-ry*16)+'px) rotateY('+(rx*2.2)+'deg) rotateX('+(-ry*1.6)+'deg)'; }
      requestAnimationFrame(tick); })();
  }

  // 화면 밀기
  var sx=null; document.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  document.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>50) go(cur+(dx<0?1:-1)); },{passive:true});

  function closeList(){ document.getElementById('overlay').classList.remove('is-on'); }
  document.getElementById('listbtn').onclick=function(){ document.getElementById('overlay').classList.add('is-on'); };
  document.getElementById('close').onclick=closeList;

  preload(0); preload(1);
})();
</script>
  <script src="../../_assets/page_ping.js" defer></script>
</body>
</html>
