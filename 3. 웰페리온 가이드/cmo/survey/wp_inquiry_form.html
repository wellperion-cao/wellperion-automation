<!-- 웰페리온 문의 자체 Survey 폼 — 배1037 갈래B (시포 2026-07-15)
     wellperion.com/ko/inquiry 의 구글폼(Google Forms)을 대체할 자체제작 문의 폼.
     ★ 현재 상태: GitHub Pages 배포 전용(미임베드) — WordPress 문의 페이지(8394)에는 아직 심지 않음(고객 미노출).
        WP 임베드/구글폼 교체 발효 = GM go 대기(비가역 유입경로). 기존 wp_inquiry_block.html(구글폼 버전) = 즉시 롤백 자산으로 보존.
     ★ 구조: reception_block.html 패턴 이식(자체 HTML 폼 → GAS intake_submit → 구글시트). 단일 정본·self-contained.
        멤버십 → '26년 신규문의' 탭 / 강습 → '강습 신규문의' 스태프탭 (Survey.js intake_submit 라우팅).
     ★ 수집 유실 0: no-cors 금지 → redirect follow + r.json() 판독(res.ok만 성공) · 멱등 submissionId ·
        localStorage 대기큐(이탈/새로고침 생존·자동 재전송) · 지수백오프 · 최종실패 시 폼값 보존 + 전화/이메일 안내.
     ★ 스팸방어(구글폼 캡차 상실 보상): 허니팟(hp) + 타이밍 게이트(fillMs) + 숨김토큰(t) + 서버측 재검증/레이트리밋.
     ★ CSS 스코프: 전 규칙 .wlp-inq 래퍼 하위 → Salient/WPBakery 테마 오염 차단.
     ★ 테스트: URL 에 ?gas=head 부착 시 GAS @HEAD 배포로 전송(E2E 검증용). 미부착=운영 /exec. -->

      var field = document.createElement('div'); field.className = 'field';
      var lab = document.createElement('label'); lab.className = 'fl'; lab.setAttribute('for','f_'+f.key);
      lab.innerHTML = f.label + (f.opt ? ' <span class="opt">(선택)</span>' : '');
      field.appendChild(lab);

      if (f.type === 'text' || f.type === 'tel') {
        var inp = document.createElement('input'); inp.type='text'; inp.id='f_'+f.key; inp.placeholder=f.ph||''; inp.autocomplete='off';
        if (f.type === 'tel') { inp.inputMode='tel'; inp.addEventListener('input', function(){ this.value = formatPhone(this.value); }); }
        field.appendChild(inp);
      } else if (f.type === 'date') {
        var d = document.createElement('input'); d.type='date'; d.id='f_'+f.key; field.appendChild(d);
      } else if (f.type === 'textarea') {
        var ta = document.createElement('textarea'); ta.id='f_'+f.key; ta.placeholder=f.ph||''; field.appendChild(ta);
      } else if (f.type === 'select') {
        var sel = document.createElement('select'); sel.id='f_'+f.key;
        if (f.ph) { var o0=document.createElement('option'); o0.value=''; o0.textContent=f.ph; sel.appendChild(o0); }
        (f.opts||[]).forEach(function(o){ var op=document.createElement('option'); op.value=o; op.textContent=o; sel.appendChild(op); });
        field.appendChild(sel);
      } else if (f.type === 'multi') {
        var grid = document.createElement('div'); grid.className='multi'; grid.id='f_'+f.key;
        (f.opts||[]).forEach(function(o){
          var l=document.createElement('label');
          var cb=document.createElement('input'); cb.type='checkbox'; cb.value=o;
          cb.addEventListener('change', function(){ l.className = this.checked ? 'on' : ''; });
          l.appendChild(cb); var sp=document.createElement('span'); sp.textContent=o; l.appendChild(sp);
          grid.appendChild(l);
        });
        field.appendChild(grid);
      }
      box.appendChild(field);
    });

    // 개인정보 동의(필수) — PIPA 문안 승계
    var cField = document.createElement('div'); cField.className='field';
    var cLab = document.createElement('label'); cLab.className='fl'; cLab.textContent='개인정보 수집·이용 동의'; cField.appendChild(cLab);
    var cBox = document.createElement('div'); cBox.className='consent-box'; cBox.textContent = pipa(def.purpose); cField.appendChild(cBox);
    var cRow = document.createElement('div'); cRow.className='chk-row';
    cRow.innerHTML = '<input type="checkbox" id="f_consent"><span>위 개인정보 수집·이용에 동의합니다.</span>';
    cField.appendChild(cRow);
    box.appendChild(cField);

    // 허니팟(봇 트랩) — 화면 밖, 사람은 못 봄
    var hp = document.createElement('div'); hp.className='hp-field'; hp.setAttribute('aria-hidden','true');
    hp.innerHTML = '<label>이 항목은 비워두세요<input type="text" id="f_hp" tabindex="-1" autocomplete="off"></label>';
    box.appendChild(hp);

    formShownAt = Date.now();
  }

  function collect(){
    var def = FORMS[selectedCat]; if (!def) return null;
    var out = { category: selectedCat };
    def.fields.forEach(function(f){
      if (f.type === 'multi') {
        var picks = [];
        var grid = $('f_'+f.key);
        if (grid) Array.prototype.forEach.call(grid.querySelectorAll('input[type=checkbox]'), function(cb){ if (cb.checked) picks.push(cb.value); });
        out[f.key] = picks.join(', ');
      } else {
        var el = $('f_'+f.key);
        out[f.key] = el ? (el.value||'').trim() : '';
      }
    });
    out.consent = !!($('f_consent') && $('f_consent').checked);
    out.hp = ($('f_hp') && $('f_hp').value) || '';
    return out;
  }

  // ════════ 대기큐(localStorage) — 수집 유실 0 핵심 ════════
  function qRead(){ try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); } catch(e){ return []; } }
  function qWrite(arr){ try { localStorage.setItem(QUEUE_KEY, JSON.stringify(arr)); } catch(e){} }
  function qUpsert(item){
    var arr = qRead(); var found = false;
    for (var i=0;i<arr.length;i++){ if (arr[i].payload.submissionId === item.payload.submissionId){ arr[i]=item; found=true; break; } }
    if (!found) arr.push(item);
    qWrite(arr);
  }
  function qRemove(sid){ qWrite(qRead().filter(function(x){ return x.payload.submissionId !== sid; })); }
  function backoffMs(attempts){ return Math.min(30000, 1000 * Math.pow(2, Math.max(0, attempts-1))); }  // 1s,2s,4s,8s,16s,30s…

  var activeSid = '';   // 현재 화면에서 방금 제출한 submissionId(완료/실패 UX 대상)
  var flushTimer = null;

  function scheduleFlush(delay){
    if (flushTimer) clearTimeout(flushTimer);
    flushTimer = setTimeout(flushQueue, delay || 1000);
  }

  function send(item){
    return fetch(GAS_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(item.payload)
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res && res.ok) { onSent(item, res); return true; }
      if (res && res.noRetry) { onRejected(item, res); return true; }   // 검증 거부 등 — 재시도 무의미(대기큐 제거)
      return onSoftFail(item);                                          // 서버 일시오류(noRetry 아님) → 재시도
    })
    .catch(function(){ return onSoftFail(item); });                     // 네트워크 오류 → 재시도
  }

  function onSent(item, res){
    qRemove(item.payload.submissionId);
    if (item.payload.submissionId === activeSid) showDone(res.id || item.payload.submissionId);
  }
  function onRejected(item, res){
    qRemove(item.payload.submissionId);
    if (item.payload.submissionId === activeSid) {
      resetSubmitBtn();
      toast((res && res.error) || '접수에 실패했습니다. 입력값을 확인해 주세요.', true);
    }
  }
  function onSoftFail(item){
    item.attempts = (item.attempts||0) + 1;
    item.nextAt = Date.now() + backoffMs(item.attempts);
    qUpsert(item);
    if (item.payload.submissionId === activeSid) {
      resetSubmitBtn();
      if (item.attempts >= 3) showFailBanner(); else showPendingBanner();
    }
    scheduleFlush(backoffMs(item.attempts));
    return false;
  }

  function flushQueue(){
    var arr = qRead(); if (!arr.length) { return; }
    var now = Date.now();
    var due = arr.filter(function(x){ return !x.nextAt || x.nextAt <= now; });
    if (!due.length) {
      var soonest = Math.min.apply(null, arr.map(function(x){ return x.nextAt || now; }));
      scheduleFlush(Math.max(500, soonest - now));
      return;
    }
    // 순차 전송(동시성 최소화 — 백엔드 dedup이 있어 안전하지만 순차가 깔끔)
    (function next(i){
      if (i >= due.length) return;
      send(due[i]).then(function(){ next(i+1); });
    })(0);
  }

  // ── 배너/버튼 UX ──
  function resetSubmitBtn(){ var b=$('submitBtn'); b.disabled=false; b.textContent='문의 접수하기'; }
  function showPendingBanner(){
    var el = $('retryBanner'); el.className='retry-banner pending';
    el.innerHTML = '전송이 지연되고 있습니다. 자동으로 다시 시도 중입니다… 창을 닫으셔도 다음 방문 시 재전송됩니다.';
  }
  function showFailBanner(){
    var el = $('retryBanner'); el.className='retry-banner failed';
    el.innerHTML = '문의 전송이 지연되고 있습니다. 입력하신 내용은 저장되어 자동 재전송됩니다.<br>' +
      '급하시면 <a href="tel:'+CONTACT_PHONE+'">'+CONTACT_PHONE+'</a> 또는 <a href="mailto:'+CONTACT_EMAIL+'">'+CONTACT_EMAIL+'</a> 로 연락 주세요.<br>' +
      '<button type="button" class="again2" id="retryNow">지금 다시 시도</button>';
    var rn = $('retryNow'); if (rn) rn.addEventListener('click', function(){ showPendingBanner(); flushQueue(); });
  }
  function clearBanner(){ var el=$('retryBanner'); el.className='retry-banner'; el.innerHTML=''; }

  function showDone(id){
    clearBanner();
    $('rcptNo').textContent = id ? ('접수번호: ' + id) : '';
    $('formWrap').style.display='none';
    $('doneWrap').style.display='block';
    window.scrollTo(0,0);
  }

  // ── 유형 선택 ──
  $('typeGroup').addEventListener('click', function(ev){
    var btn = ev.target.closest('.type-btn'); if (!btn) return;
    var cat = btn.getAttribute('data-cat'); if (cat === selectedCat) return;
    Array.prototype.forEach.call(this.querySelectorAll('.type-btn'), function(b){ b.classList.remove('active'); });
    btn.classList.add('active'); selectedCat = cat; clearBanner(); buildForm(cat);
  });

  // ── 제출 ──
  $('submitBtn').addEventListener('click', function(){
    if (!selectedCat) { toast('문의 유형을 선택해 주세요', true); return; }
    var vals = collect(); if (!vals) return;
    var def = FORMS[selectedCat];

    // 필수 검증(프론트 1차 — 서버 재검증과 이중)
    for (var i=0;i<def.fields.length;i++){
      var f = def.fields[i];
      if (f.req && !vals[f.key]) { toast(f.label + '을(를) 입력해 주세요', true); return; }
    }
    var pd = String(vals.phone||'').replace(/\D/g,'');
    if (pd.length < 9 || pd.length > 11) { toast('연락처를 정확히 입력해 주세요', true); return; }
    if (!vals.consent) { toast('개인정보 수집·이용에 동의해 주세요', true); return; }

    var sid = uuid();
    var payload = {
      action:'intake_submit', t:INTAKE_TOKEN, submissionId:sid,
      category:vals.category, name:vals.name, phone:vals.phone,
      program:vals.program||'', channel:vals.channel||'', message:vals.message||'',
      wishTime:vals.wishTime||'', age:vals.age||'', exp1Date:vals.exp1Date||'',
      consent:true, hp:vals.hp||'', fillMs:(formShownAt? (Date.now()-formShownAt) : 0),
      utmSource:UTM_SOURCE, utmMedium:UTM_MEDIUM
    };
    activeSid = sid;
    var item = { payload:payload, attempts:0, nextAt:0 };
    qUpsert(item);   // ★먼저 대기큐에 적재 → 이 순간 이후 이탈/새로고침에도 유실 0

    var b=this; b.disabled=true; b.textContent='접수 중…'; clearBanner();
    send(item);
  });

  // ── 새 문의 ──
  $('againBtn').addEventListener('click', function(){
    selectedCat=''; activeSid='';
    Array.prototype.forEach.call(document.querySelectorAll('.type-btn'), function(b){ b.classList.remove('active'); });
    $('formFields').innerHTML=''; $('emptyHint').style.display='block';
    resetSubmitBtn(); clearBanner();
    $('doneWrap').style.display='none'; $('formWrap').style.display='block';
    window.scrollTo(0,0);
  });

  // ── 재방문/로드 시 대기큐 잔존분 자동 재전송(창을 닫았어도 다음 방문에 전송) ──
  window.addEventListener('online', function(){ scheduleFlush(300); });
  if (qRead().length) scheduleFlush(800);

  // ── 유형 딥링크(?type=) 프리선택 — 문의 페이지(8394) 버튼에서 유형별로 진입 시 해당 폼 자동 표시 ──
  //   허용값: membership|adult|youth (한글 별칭 병행). 미지정·미매칭 = 기존처럼 유형 선택 대기.
  (function(){
    try {
      var t = (qp('type') || '').toLowerCase();
      var alias = { membership:'membership', '멤버십':'membership',
                    adult:'adult', '성인':'adult', '성인강습':'adult',
                    youth:'youth', '유소년':'youth', '유소년강습':'youth' };
      var cat = alias[t]; if (!cat) return;
      var btn = document.querySelector('.wlp-inq .type-btn[data-cat="' + cat + '"]');
      if (btn) { btn.classList.add('active'); selectedCat = cat; buildForm(cat); }
    } catch (e) {}
  })();
})();
</script>
