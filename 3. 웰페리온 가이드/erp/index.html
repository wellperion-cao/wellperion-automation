<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 ERP</title>
<link rel="icon" type="image/x-icon" href="../welly_favicon.ico">
<style>
  /* 색·폰트는 wellperion_guide(main).html 의 :root 를 그대로 쓴다 (2026-09-03) */
  :root{
    --bg:#221F20; --paper:#2a2725; --text:#f5f2ef; --text-soft:#d4d0cc;
    --dim:#8c8b83; --dim-soft:#6b6a64;
    --accent:#B79F8A; --accent-hover:#d4b89e; --accent-bg:rgba(183,159,138,0.12);
    --border:#3d3835; --border-strong:#4d4845; --gray-bg:#2a2725;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}  /* .mod·.modules 가 display 를 덮어써서 필요하다 */
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       color:var(--text); background:var(--bg); line-height:1.75; font-size:15.5px;
       -webkit-font-smoothing:antialiased;}

  .topbar{display:flex; align-items:center; gap:14px; padding:16px 40px;
          background:var(--paper); border-bottom:1px solid var(--border);}
  .topbar .brand{display:flex; align-items:center; color:var(--text);}
  .topbar .brand svg{height:16px; width:auto; display:block;}  /* 브랜드 자산 정본 = erp/brand/ (배932·952) */
  .topbar .brand .sub{font-size:12px; color:var(--dim); font-weight:400; margin-left:8px;}
  .topbar .who{margin-left:auto; font-size:13.5px; color:var(--text-soft);}
  .topbar .who .role{display:inline-block; font-size:11.5px; font-weight:600;
                     padding:2px 9px; border-radius:20px; background:var(--accent);
                     color:#221F20; margin-left:7px;}
  .topbar a.logout{font-size:13px; color:var(--dim); text-decoration:none; margin-left:16px;}
  .topbar a.logout:hover{color:var(--accent-hover);}

  .main{max-width:1100px; padding:40px 40px 80px;}
  h2{font-size:26px; font-weight:700; letter-spacing:-0.015em; margin-bottom:4px;}
  .meta{font-size:13px; color:var(--dim); margin-bottom:30px;}
  h3{font-size:17px; font-weight:700; margin:44px 0 14px; padding-bottom:8px;
     border-bottom:2px solid var(--gray-bg);}

  .modules{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px;}
  .mod{display:block; background:var(--paper); border:1px solid var(--border);
       border-radius:12px; padding:20px 22px; text-decoration:none; color:inherit;
       transition:border-color 0.12s, background 0.12s;}
  .mod:hover{border-color:var(--accent); background:var(--accent-bg);}
  .mod .name{font-size:17px; font-weight:700; margin-bottom:6px;}
  .mod .desc{font-size:14px; color:var(--text-soft); line-height:1.65;}
  .mod .owner{font-size:12.5px; color:var(--dim); margin-top:12px;
              border-top:1px dashed var(--border-strong); padding-top:9px;}
  /* roles 에 내 역할이 없으면 흐리게만 — 숨기지 않는다 */
  .mod.locked{opacity:0.4;}
  .mod.locked:hover{border-color:var(--border); background:var(--paper);}
  .mod.locked .owner::after{content:" · 권한 없음"; color:var(--dim-soft);}

  .find{width:100%; max-width:420px; padding:10px 14px; margin-bottom:6px;
        background:var(--paper); border:1px solid var(--border-strong); border-radius:8px;
        color:var(--text); font-size:14px; font-family:inherit;}
  .find:focus{outline:none; border-color:var(--accent);}
  .find::placeholder{color:var(--dim-soft);}
  h3 .n{font-size:13px; font-weight:400; color:var(--dim); margin-left:8px;}

  .msg{color:var(--dim); font-size:14px;}
  @media(max-width:640px){ .topbar{padding:14px 18px;} .main{padding:26px 18px 60px;} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" aria-label="웰페리온 ERP"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108.7954 17.5240" height="20" role="img" aria-hidden="true"><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,96.8257,43.6787)" d="M0 0-3.093 5.825 .208 12.412H-1.778L-4.214 7.871-6.597 12.412H-8.731L-5.319 5.821-8.288-.041-14.694 12.412H-16.902L-8.271-3.912-4.197 3.954-.035-3.89 8.62 12.412H6.316Z" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,117.7407,42.6162)" d="M0 0-2.349 7.471H-3.277L-5.625 .004-8.025 7.47-9.046 7.471-6.261-1.094-4.967-1.096-2.813 5.929-.672-1.096 .621-1.094 3.419 7.471 2.399 7.47Z" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,122.3008,43.71)" d="M0 0H5.357V.776H.981V3.928H5.211V4.705H.981V7.788H5.357V8.563H0Z" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,130.3896,35.1455)" d="M0 0H-.981V-8.564H4.059V-7.788H0Z" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,136.5166,35.1455)" d="M0 0H-.981V-8.564H4.058V-7.788H0Z" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,147.4697,38.5273)" d="M0 0C-.151-.258-.361-.46-.635-.607-.857-.722-1.104-.81-1.378-.867-1.653-.925-2.063-.954-2.611-.954H-4.296V2.605H-3.036-2.718-2.399C-2.108 2.605-1.855 2.591-1.643 2.564-1.431 2.537-1.214 2.486-.993 2.409-.18 2.115 .224 1.584 .224 .814 .224 .529 .15 .257 0 0M-.078 2.917C-.45 3.126-.826 3.255-1.206 3.306-1.587 3.355-2.086 3.382-2.705 3.382H-5.277V-5.185H-4.296V-1.73H-2.452C-1.895-1.73-1.45-1.699-1.112-1.637-.652-1.552-.252-1.398 .094-1.173 .835-.695 1.207-.034 1.207 .808 1.207 1.743 .779 2.446-.078 2.917" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,150.0439,43.71)" d="M0 0H5.356V.776H.979V3.928H5.21V4.705H.979V7.788H5.356V8.563H0Z" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,163.793,37.938)" d="M0 0C0 .517-.129 .981-.39 1.391-.65 1.8-1.027 2.128-1.523 2.375-1.912 2.568-2.305 2.685-2.704 2.728-3.103 2.77-3.637 2.793-4.309 2.793H-6.643V-5.772H-5.66V2.016H-4.109C-3.632 2.016-3.215 1.991-2.855 1.946-2.498 1.899-2.178 1.79-1.895 1.616-1.611 1.442-1.389 1.217-1.225 .943-1.062 .669-.98 .381-.98 .081-.98-.314-1.09-.662-1.311-.963-1.532-1.265-1.846-1.496-2.253-1.659-2.536-1.767-2.8-1.832-3.05-1.856-3.296-1.878-3.654-1.891-4.122-1.891H-4.388-4.679L-1.353-5.772-.127-5.771-2.886-2.572C-2.092-2.572-1.411-2.316-.846-1.807-.281-1.298 0-.696 0 0" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,0,80)" d="M165.201 36.29H166.181V44.854H165.201Z" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,175.9219,41.9678)" d="M0 0C-.818-.707-1.806-1.061-2.964-1.061-4.096-1.061-5.079-.71-5.914-.012-6.751 .686-7.168 1.524-7.168 2.504-7.168 3.515-6.759 4.374-5.939 5.079-5.123 5.785-4.131 6.138-2.964 6.138-1.831 6.138-.85 5.791-.02 5.096 .812 4.401 1.227 3.561 1.227 2.573 1.227 1.564 .819 .704 0 0M.663 5.682C-.366 6.534-1.58 6.961-2.977 6.961-4.409 6.961-5.629 6.529-6.638 5.665-7.646 4.8-8.149 3.746-8.149 2.504-8.149 1.285-7.634 .249-6.604-.604-5.573-1.456-4.364-1.883-2.977-1.883-1.544-1.883-.321-1.448 .69-.579 1.7 .287 2.208 1.339 2.208 2.573 2.208 3.794 1.692 4.829 .663 5.682" fill="currentColor"/><path transform="translate(-79.3237,-30.6667) matrix(1,0,0,-1,186.5371,35.1455)" d="M0 0V-7.119L-5.494-.004-6.816 0V-8.564H-5.836V-1.033L0-8.564H.982V0Z" fill="currentColor"/></svg><span class="sub">ERP · 모듈 홈</span></div>
  <div class="who" id="who">확인 중…</div>
  <a class="logout" id="logout" href="/auth/logout" hidden>로그아웃</a>
</div>

<div class="main">
  <h2>모듈</h2>
  <div class="meta">회원 · 운영 · 점검 · 경영 4그룹 + 문서함(안내·초안·보고서).</div>
  <input class="find" id="find" type="search" placeholder="화면 이름으로 찾기" autocomplete="off">
  <div id="sections"><div class="msg">불러오는 중…</div></div>
</div>

<script>
// 1) 로그인 확인 — 401 이면 관문으로 보낸다. 서버(nginx 앞단 FastAPI)가 쿠키를 판정한다.
fetch('/auth/me', {credentials:'same-origin'}).then(function(r){
  if (r.status === 401) { location.href = '/auth/login?next=/erp/'; return null; }
  if (!r.ok) throw new Error('auth ' + r.status);
  return r.json();
}).then(function(me){
  if (!me) return;
  document.getElementById('who').innerHTML =
    esc(me.name || me.email || '') + '<span class="role">' + esc(me.role || '') + '</span>';
  document.getElementById('logout').hidden = false;
  return loadModules(me.role, me.allowed_ids || null);
}).catch(function(e){
  // 로컬에서 파일로 열면 /auth/me 가 없다 — 튕기지 않고 권한 없는 상태로 그려 둔다.
  document.getElementById('who').textContent = '로그인 확인 불가';
  loadModules(null, null);
});

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// 2) 모듈 카드 — modules.json 은 scripts/erp_modules_build.py 가 화면 파일에서 자동 생성한다.
//    여기서는 group(핵심 → 닉네임) 순서대로 섹션을 나눠 그리기만 한다.
function loadModules(role, allowedIds){
  return fetch('modules.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    var root = document.getElementById('sections');
    root.innerHTML = '';
    var group = null, grid = null;

    (d.modules || []).forEach(function(m){
      var g = m.appgroup || '문서함';   // 회원·운영·점검·경영·문서함 5그룹(배1026 · 2026-09-05)
      if (g !== group) {
        group = g;
        var h = document.createElement('h3');
        h.innerHTML = esc(g) + '<span class="n"></span>';
        root.appendChild(h);
        grid = document.createElement('div');
        grid.className = 'modules';
        root.appendChild(grid);
      }
      if (allowedIds && allowedIds.indexOf(m.id) < 0) return;     // 권한 밖 화면은 카드 자체를 안 그린다(forEach)
      var allowed = true;
      var a = document.createElement('a');
      a.className = 'mod' + (allowed ? '' : ' locked');
      a.href = m.path;
      a.dataset.find = (m.name + ' ' + (m.desc || '') + ' ' + (m.staff || '')).toLowerCase();
      a.innerHTML = '<div class="name">' + esc(m.name) + '</div>' +
                    (m.desc ? '<div class="desc">' + esc(m.desc) + '</div>' : '') +
                    (m.staff ? '<div class="owner">담당 ' + esc(m.staff) + '</div>' : '');
      grid.appendChild(a);
    });
    if (!root.children.length) root.innerHTML = '<div class="msg">모듈이 없다.</div>';
    filter();
  }).catch(function(){
    document.getElementById('sections').innerHTML =
      '<div class="msg">모듈 목록(modules.json)을 불러오지 못했다.</div>';
  });
}

// 3) 제목 필터 — 안 남은 섹션은 제목째 감춘다.
function filter(){
  var q = document.getElementById('find').value.trim().toLowerCase();
  var root = document.getElementById('sections');
  var kids = root.children, head = null, shown = 0;
  for (var i = 0; i < kids.length; i++) {
    var el = kids[i];
    if (el.tagName === 'H3') {
      if (head) { head.hidden = !shown; head.querySelector('.n').textContent = shown ? shown + '개' : ''; }
      head = el; shown = 0;
      continue;
    }
    for (var j = 0; j < el.children.length; j++) {
      var card = el.children[j];
      var hit = !q || card.dataset.find.indexOf(q) >= 0;
      card.hidden = !hit;
      if (hit) shown++;
    }
    el.hidden = !shown;
  }
  if (head) { head.hidden = !shown; head.querySelector('.n').textContent = shown ? shown + '개' : ''; }
}
document.getElementById('find').addEventListener('input', filter);
</script>
</body>
</html>
