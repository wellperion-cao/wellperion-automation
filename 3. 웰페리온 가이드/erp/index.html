<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 ERP</title>
<link rel="icon" type="image/x-icon" href="../welly_favicon.ico">
<link rel="stylesheet" href="brand/tenant-wellperion.css">
<style>
  /* 색 정본 = brand/tenant-wellperion.css (GM 지시 2026-09-11 · 파트너사 관리자·직원 화면 브랜드컬러 통일).
     색 토큰(--bg·--paper·--text·--accent·--border 등)은 그 파일이 준다 — 여기서 다시 선언하지 않는다. */
  html{color-scheme:light dark;}
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}  /* .mod·.modules 가 display 를 덮어써서 필요하다 */
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       color:var(--text); background:var(--bg); line-height:1.55; font-size:14px;
       -webkit-font-smoothing:antialiased;}
  /* 밀도 = 관리자 콘솔 관행 (실측 근거 = status/briefs/CMO-2026-09-10-ERP콘솔-벤치마킹.md).
     본문 14px(Fiori·Carbon·Odoo·Atlassian 수렴) · 표 13px · 라벨 11px · 간격은 4배수만.
     종전 15.5px·줄높이 1.75·여백 40px 은 읽는 문서의 값이지 일하는 화면의 값이 아니었다. */
  :root{--row-h:32px;}

  .topbar{display:flex; align-items:center; gap:12px; padding:0 16px; height:48px;
          position:sticky; top:0; z-index:30; overflow:hidden;
          background:var(--paper); border-bottom:1px solid var(--border);}
  .topbar > *{white-space:nowrap; flex-shrink:0;}
  .topbar .brand{display:flex; align-items:center; color:var(--text);}
  .topbar .brand svg{height:16px; width:auto; display:block;}  /* 브랜드 자산 정본 = erp/brand/ (배932·952) */
  .topbar .brand .sub{font-size:12px; color:var(--dim); font-weight:400; margin-left:8px;}
  .topbar .who{margin-left:auto; font-size:13.5px; color:var(--text-soft);}
  .topbar .who .role{display:inline-block; font-size:11.5px; font-weight:600;
                     padding:2px 9px; border-radius:20px; background:var(--accent);
                     color:#221F20; margin-left:7px;}   /* 베이지 바탕엔 흰 글자가 안 읽힌다 */
  .topbar a.logout{font-size:13px; color:var(--dim); text-decoration:none; margin-left:16px;}
  .topbar a.logout:hover{color:var(--accent-hover);}
  /* 지금 어느 층에 있는지 — 회사 관리자(/erp/admin/) · 파트너사 관리자 · 파트너사 직원 (GM 지시 2026-09-09).
     같은 주소가 두 층을 겸하므로 이름표는 역할로 정한다. 위층으로 가는 길은 관리자에게만 보인다. */
  .topbar .layer{font-size:11.5px; font-weight:600; color:var(--text-soft);
                 padding:3px 10px; border-radius:20px; background:var(--gray-bg);
                 border:1px solid var(--border); white-space:nowrap;}
  .topbar a.up{font-size:13px; color:var(--dim); text-decoration:none; white-space:nowrap;}
  .topbar a.up:hover{color:var(--accent-hover);}

  /* 좌측 고정 메뉴 240px + 본문 — 본문에 폭 제한을 두지 않는다(창을 다 쓴다) */
  .shell{display:grid; grid-template-columns:240px minmax(0,1fr); align-items:start;}
  .side{position:sticky; top:48px; align-self:start; height:calc(100vh - 48px); overflow-y:auto;
        background:var(--sidebar); border-right:1px solid var(--border); padding:12px 0 24px;}
  .side .cap{font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--dim-soft);
             padding:12px 16px 4px; text-transform:uppercase;}
  .side .cap:first-child{padding-top:0;}
  .side a{display:flex; align-items:center; justify-content:space-between; gap:8px;
          height:32px; padding:0 16px; border-left:4px solid transparent;
          font-size:13px; font-weight:500; color:var(--text-soft); text-decoration:none;}
  .side a:hover{background:var(--gray-bg); color:var(--text);}
  .side a.on{background:var(--accent-bg); color:var(--accent-hover); font-weight:700;
             border-left-color:var(--accent);}
  .side a .b{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums;}
  .side a.on .b{color:var(--accent-hover);}
  .side .sep{height:1px; background:var(--border); margin:8px 16px;}

  .main{padding:12px 16px 32px; min-width:0;}
  h2{font-size:17px; font-weight:700; letter-spacing:-0.01em; margin-bottom:2px;}
  [role=tabpanel] > h2:first-child{margin-top:0;}
  .meta{font-size:12.5px; color:var(--dim); margin-bottom:12px;}
  h3{font-size:13px; font-weight:700; margin:16px 0 8px; padding-bottom:4px;
     border-bottom:1px solid var(--border);}

  /* 모듈 타일 = 들어가는 문. 설명은 한 줄로 자르고 담당은 같은 줄 끝에 붙인다 —
     종전엔 타일 하나가 170px 높이라 42장이 4.2화면이었다(실측 2026-09-10). */
  .modules{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:8px;}
  .mod{display:block; background:var(--paper); border:1px solid var(--border);
       border-radius:4px; padding:8px 12px; text-decoration:none; color:inherit;
       transition:border-color 0.12s, background 0.12s;}
  .mod:hover{border-color:var(--accent); background:var(--accent-bg);}
  .mod .name{font-size:13.5px; font-weight:700; margin-bottom:2px;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mod .desc{font-size:12px; color:var(--dim); line-height:1.45;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mod .owner{font-size:11px; color:var(--dim-soft); margin-top:2px;
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* roles 에 내 역할이 없으면 흐리게만 — 숨기지 않는다 */
  .mod.locked{opacity:0.4;}
  .mod.locked:hover{border-color:var(--border); background:var(--paper);}
  .mod.locked .owner::after{content:" · 권한 없음"; color:var(--dim-soft);}

  .find{width:260px; height:28px; padding:0 10px; margin:0;
        background:var(--gray-bg); border:1px solid var(--border); border-radius:4px;
        color:var(--text); font-size:12.5px; font-family:inherit;}
  .find:focus{outline:none; border-color:var(--accent);}
  .find::placeholder{color:var(--dim-soft);}
  h3 .n{font-size:13px; font-weight:400; color:var(--dim); margin-left:8px;}

  .msg{color:var(--dim); font-size:13px;}

  /* 목록은 표로 — 행 32px(조밀) · 표 안 13px · 머리행 고정 · 셀은 한 줄 말줄임 */
  /* 가로 스크롤 상자를 두지 않는다 — 상자가 스크롤 컨테이너가 되면 머리행 고정(sticky)의 기준이
     페이지가 아니라 그 상자가 돼, 머리행이 표 시작보다 48px 아래에 붙고 첫 줄이 그 뒤로 숨는다
     (2026-09-10 실측). 열 3개는 말줄임으로 들어가므로 가로 스크롤이 필요 없다. */
  .tbl-wrap{max-width:100%; min-width:0;
            border:1px solid var(--border); border-radius:4px; background:var(--paper);}
  /* border-collapse:collapse 에서는 머리행 고정(sticky)이 먹지 않는다 — separate 로 두고
     칸 사이 간격을 0 으로 만든 뒤, 칸 경계선은 각 칸의 아래 테두리로 그린다. */
  table.tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:13px; table-layout:fixed;}
  /* 고정은 th 가 아니라 thead 에 건다 — 이 표(table-layout:fixed)에서는 th 쪽 sticky 가
     먹지 않아 스크롤하면 머리행이 그대로 올라가 사라졌다(2026-09-10 실측). */
  table.tbl thead{position:sticky; top:48px; z-index:2;}
  table.tbl th{height:40px; text-align:left;
               font-size:13px; font-weight:600; color:var(--text-soft); background:var(--gray-bg);
               padding:0 12px; border-bottom:1px solid var(--border-strong); white-space:nowrap;}
  table.tbl td{height:var(--row-h); padding:0 12px; border-bottom:1px solid var(--border);
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  table.tbl tr:last-child td{border-bottom:none;}
  table.tbl tbody tr:hover{background:var(--accent-bg);}
  table.tbl td.k{width:28%; font-weight:600;}
  table.tbl td.k a{color:inherit; text-decoration:none;}
  table.tbl td.k a:hover{color:var(--accent-hover);}
  table.tbl td.d{color:var(--dim);}
  table.tbl td.o{width:16%; color:var(--dim); font-size:12px;}
  @media(max-width:900px){ :root{--row-h:44px;} table.tbl thead{top:88px;} }

  /* 탭은 좌측 메뉴로 옮겼다(2026-09-10). 상단바가 담는 것은 넷뿐 —
     제품명 · 지금 어디인지 · 전역 검색 · 사용자. */
  .topbar .crumb{font-size:13px; font-weight:600; color:var(--text);
                 padding-left:12px; border-left:1px solid var(--border);}
  .topbar .spacer{margin-left:auto;}
  .dl .mod .owner::before{content:"내려받기 · ";}
  /* 화면에 상주하는 설명문 대신 접힌 한 줄 (벤치마킹 §5-18) */
  .tip{font-size:12px; color:var(--dim); margin-bottom:8px;}
  .tip > summary{cursor:pointer; list-style:none; color:var(--text-soft); font-weight:600;}
  .tip > summary::-webkit-details-marker{display:none;}
  .tip > summary::before{content:"▸ "; color:var(--dim);}
  .tip[open] > summary::before{content:"▾ ";}
  .tip a{color:var(--accent-hover);}
  .note{font-size:12.5px; color:var(--dim); background:var(--gray-bg);
        border-left:2px solid var(--border-strong); padding:8px 12px; border-radius:4px; margin-bottom:12px;}
  .note a{color:var(--accent-hover);}
  /* 권한·비용은 다른 화면을 이 자리에 그대로 끼워 띄운다.
     ★2026-09-10 수리 — 권한 판에 width:calc(100vw - 80px) 이 박혀 있었다. 왼쪽 메뉴가 없던
     시절의 값이라 240px 메뉴가 생긴 뒤로 화면이 오른쪽으로 176px 밀려 잘렸다(실측).
     이제 폭을 지정하지 않는다 — 본문이 이미 메뉴 오른쪽 전부를 쓴다. */
  #adm-frame{display:block; width:100%; height:calc(100vh - 108px); min-height:520px;
             border:0; background:var(--paper); border-radius:6px;}
  @media(max-width:900px){
    /* 좁은 화면에선 왼쪽 기둥을 가로로 눕힌다 — 240px 를 세로로 두면 본문이 화면 밖으로 밀린다 */
    .shell{grid-template-columns:1fr;}
    .side{position:sticky; top:48px; z-index:19; height:auto; display:flex; gap:0;
          padding:0 8px; overflow-x:auto; -webkit-overflow-scrolling:touch;
          background:var(--paper); border-right:none; border-bottom:1px solid var(--border);}
    .side .cap, .side .sep{display:none;}
    .side #menu-groups{display:contents;}
    .side #menu-admin{display:contents;}
    .side a{border-left:none; border-bottom:3px solid transparent; white-space:nowrap;
            height:40px; padding:0 12px; gap:5px;}
    .side a.on{border-left-color:transparent; border-bottom-color:var(--accent); background:transparent;}
  }
  @media(max-width:640px){
    .topbar{padding:0 12px; gap:8px;}
    .topbar .find{width:120px;}
    .topbar .who, .topbar .crumb{display:none;}
    .main{padding:12px 12px 40px;}
    /* 폰에서는 설명 열을 뺀다 — 세 열을 다 넣으면 문서 이름이 네 글자에서 잘린다 */
    table.tbl td.d, table.tbl th:nth-child(2){display:none;}
    table.tbl td.k{width:64%;} table.tbl td.o{width:36%;}
  }
</style>
</head>

  <!-- 권한 판 — /auth/admin 화면을 이 자리에 그대로 끼워 띄운다
       (GM 지시 2026-09-11 「권한 누르면 다른 페이지로 넘어가는게 아니라 우측 페이지에 나타나야해」).
       그 화면은 iframe 안일 때 자기 머리표를 감추게 해 뒀다 — 머리표가 둘로 보이던 것은 막혀 있다.
       처음 누를 때 한 번만 읽는다(src 를 그때 넣는다) — 안 누르면 아예 안 불러온다. -->

<script>
// 1) 로그인 확인 — 401 이면 관문으로 보낸다. 서버(nginx 앞단 FastAPI)가 쿠키를 판정한다.
fetch('/auth/me', {credentials:'same-origin'}).then(function(r){
  if (r.status === 401) { location.href = '/auth/login?next=/erp/'; return null; }
  if (!r.ok) throw new Error('auth ' + r.status);
  return r.json();
}).then(function(me){
  if (!me) return;
  document.getElementById('who').innerHTML =
    esc(me.name || me.email || '') + '<span class="role">' + esc(me.role || '') + '</span>';
  document.getElementById('logout').hidden = false;
  // 관리자에게만 「권한관리」 탭을 띄운다. ★이건 보기 편하라고 감추는 것일 뿐 잠금이 아니다 —
  //   실제 차단은 /auth/admin 이 서버에서 한다(관리자 아니면 403, 관리자여도 비밀번호 한 번 더).
  if (me.role === 'admin') document.getElementById('menu-admin').hidden = false;
  setLayer(me.role);
  return loadModules(me.role, me.allowed_ids || null);
}).catch(function(e){
  // 로컬에서 파일로 열면 /auth/me 가 없다 — 튕기지 않고 권한 없는 상태로 그려 둔다.
  document.getElementById('who').textContent = '로그인 확인 불가';
  setLayer(null);
  loadModules(null, null);
});

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* 층 구조 (GM 확정 2026-09-09)
     /erp/admin/  회사 관리자      — 플랫폼을 파는 우리
     /erp/        파트너사 관리자  — 그 회사의 관리자
     /            파트너사 직원    — 그 회사의 직원
   이 파일 하나가 아래 두 층을 겸한다. 층은 주소로 가른다 — 역할로 가르면 직원이 /erp/ 를 열었을 때
   관리자 화면이 되고, 관리자가 / 를 열었을 때 직원 화면이 돼 주소와 화면이 어긋난다.
   비용·권한처럼 관리자 것인 탭은 위층에서만 보인다. 위층으로 가는 링크는 보기 편하라고 감출 뿐
   잠금이 아니다 — 실제 차단은 서버가 한다(/auth/admin 은 관리자 아니면 403). */
function setLayer(role){
  var isManager = /^\/erp(\/|$)/.test(location.pathname);
  var el = document.getElementById('layer');
  el.textContent = isManager ? '파트너사 관리자' : '파트너사 직원';
  el.hidden = false;

  var up = document.getElementById('up-admin');
  if (isManager) {
    // 회사 관리자 콘솔로 올라가는 줄은 두지 않는다 (GM 지시 2026-09-11) —
    // 파트너사가 보는 화면에 파는 회사 쪽 문이 보일 자리가 아니다. 주소로는 그대로 들어간다.
    // 대신 아래층(직원 화면)으로 내려가는 줄은 둔다 — 같은 회사 안이고, 관리자가 직원이 보는
    // 화면을 확인할 일이 잦은데 여태 주소를 손으로 쳐야 했다.
    up.href = '/home'; up.textContent = '파트너사 직원 화면 ↓'; up.hidden = false;
  } else {
    // 직원 층 — 비용·권한 탭은 이 층의 것이 아니다
    document.getElementById('menu-admin').hidden = true;   // 비용·권한은 이 층의 것이 아니다
    if (role === 'admin') { up.href = '/erp/'; up.textContent = '파트너사 관리자 화면 ↑'; up.hidden = false; }
  }
}

// 2) 모듈 카드 — modules.json 은 scripts/erp_modules_build.py 가 화면 파일에서 자동 생성한다.
//    여기서는 group(핵심 → 닉네임) 순서대로 섹션을 나눠 그리기만 한다.
function loadModules(role, allowedIds){
  /* 절대경로다 — 이 화면은 /erp/ 와 루트(/) 두 주소에서 같이 뜬다(배1151). 상대경로로 두면
     루트에서 /modules.json 을 찾아 404 가 나고 모듈 목록이 통째로 빈다. */
  return fetch('/erp/modules.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    var root = document.getElementById('sections');
    var rootDoc = document.getElementById('sections-doc');
    root.innerHTML = ''; rootDoc.innerHTML = '';

    // 그룹별로 먼저 모은 다음 한 번씩 그린다 (2026-09-08).
    //   왜: 예전엔 목록을 훑으며 '앞 항목과 그룹이 다르면' 새 제목을 붙였다. 그런데 매일 쓰는
    //   핵심 화면 3개가 목록 맨 앞에 따로 모여 있어서, 「회원」·「점검」 제목이 각각 두 번씩
    //   나뉘어 나왔다(회원 2개 … 점검 1개 … 회원 4개 …). 그룹으로 모으면 한 번씩만 나온다.
    //   그룹이 나오는 차례는 목록에 처음 등장한 순서를 그대로 따른다.
    // 자주 여는 화면을 맨 위로 — 실측 2026-09-09: GM 이 매일 보는 「GM 업무」 카드가
    //   스크롤 7.1화면(6,345px) 아래에 묻혀 있었다(회원 카드는 0.5화면). 목록 차례가
    //   부서 순서라 자주 쓰는 것일수록 아래로 갔다. 여기 적힌 것만 맨 위 한 줄로 올린다.
    var PINNED = ['coo-chairman-gm업무', 'coo-todo-업무-현황-ssot', 'coo-todo-결재-현황-ssot',
                  'member', 'inquiry', 'check'];
    // ── 세 갈래로 가른다 (GM 지시 2026-09-11 「문서함에 모듈이랑 저장파일들이랑 헷갈리는데,
    //    구분 명확히해서 정리해줄래?」).
    //      모듈  = 눌러서 일하는 화면 — 카드로 그린다
    //      문서  = 읽는 것(가이드·서식·기준·공고·교육) — 문서함 위 칸
    //      파일  = 날짜가 박힌 지난 보고 — 문서함 아래 칸, 최신부터
    //    종전에는 「화면으로 관리 안 하는 것」을 전부 문서함에 넣었다. 그래서 일하는 화면 15개가
    //    지난 보고 30개와 한 표에 섞여 있었다. 이름과 자리로 판정하므로 목록을 손으로 적지 않는다.
    var DOCWORD = /가이드|서식|기준|매뉴얼|규칙|템플릿|지침|안내|공고|교육|모집|찾습니다|올리는 법|사용법|사양서/;
    function kindOf(m){
      var path = m.path || '', name = m.name || '';
      if (/\/(home|public)\/(en\/)?index\.html$/.test(path) || /홈페이지/.test(path)) return 'skip';
      if (/\/chairman\//.test(path) || /[\/_]\d{6}_|[\/_]\d{8}[_.]/.test(path)
          || /20\d\d-\d\d-\d\d/.test(name)) return 'file';
      if (/\/recruiting\/(?!index)/.test(path) || DOCWORD.test(name)) return 'doc';
      return 'mod';
    }

    // 왼쪽 메뉴 차례 = GM 이 정한 1~5 (2026-09-11). 그 밖은 뒤로 간다.
    var GROUP_ORDER = ['마케팅 관리', '회원 관리', '운영 관리', '인사&파트너 관리', '매출&지출 관리', '전사 공통'];
    // 파트너사 목록에 남은 「ERP 플랫폼」은 담당이 회사 대표·GM·기술이라 그렇게 적힌 것이지
    // 파는 쪽 화면이 아니다(파는 쪽 것은 이미 플랫폼 콘솔로 옮겼다). 여기서는 사실대로 부른다.
    var GROUP_NAME = { 'ERP 플랫폼': '전사 공통' };

    var order = [], bag = {}, docs = [], files = [], pinned = {}, seenDoc = {};
    (d.modules || []).forEach(function(m){
      if (allowedIds && allowedIds.indexOf(m.id) < 0) return;     // 권한 밖 화면은 카드 자체를 안 그린다
      var isShelf = m.doc === true || m.appgroup === '문서함';
      if (isShelf) {
        var k = kindOf(m);
        if (k === 'skip') return;                                  // 손님이 보는 화면 사본은 안 싣는다
        if (k !== 'mod') {
          var key = (m.name || '') + '|' + (m.desc || '');
          if (seenDoc[key]) return;                                // 이름·설명이 같은 것은 한 줄만
          seenDoc[key] = 1;
          (k === 'file' ? files : docs).push(m);
          return;
        }
        // 일하는 화면이면 아래 카드 쪽으로 그대로 내려간다
      }
      var pi = PINNED.indexOf(m.id);
      if (pi >= 0) { pinned[pi] = m; return; }   // 자주 여는 것은 아래 그룹에 또 그리지 않는다
      // 묶음 이름 = 왼쪽 메뉴와 같은 업무영역(마케팅 관리·회원 관리·…). 옛 이름(회원·운영·점검·경영)은
      // 메뉴에 없는 말이라 화면과 메뉴가 서로 다른 낱말을 쓰고 있었다(GM 2026-09-11 통일 지시).
      var g = GROUP_NAME[m.group] || m.group || m.appgroup || '그 밖';
      if (!bag[g]) { bag[g] = []; order.push(g); }
      bag[g].push(m);
    });
    // 차례를 GM 이 정한 1~5 로 맞춘다. 목록에 나온 순서대로 두면 매번 달라 보인다.
    order.sort(function(a, b){
      var ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });

    function docTable(parent, list){
      var wrap = document.createElement('div'); wrap.className = 'tbl-wrap';
      var t = document.createElement('table'); t.className = 'tbl';
      t.innerHTML = '<thead><tr><th>문서</th><th>설명</th><th>담당</th></tr></thead>';
      var tb = document.createElement('tbody');
      list.forEach(function(m){
        var tr = document.createElement('tr');
        tr.dataset.find = (m.name + ' ' + (m.desc || '') + ' ' + (m.staff || '')).toLowerCase();
        // 읽는 것은 새 창으로 연다 — 읽고 닫으면 문서함 자리와 찾던 낱말이 그대로 남는다.
        tr.innerHTML = '<td class="k"><a target="_blank" rel="noopener" href="' + esc(m.path) + '">' + esc(m.name) + '</a></td>'
                     + '<td class="d">' + esc(m.desc || '') + '</td>'
                     + '<td class="o">' + esc(m.staff || '') + '</td>';
        tb.appendChild(tr);
      });
      t.appendChild(tb); wrap.appendChild(t); parent.appendChild(wrap);
    }
    function card(m){
      var a = document.createElement('a');
      a.className = 'mod';
      a.href = m.path;
      a.dataset.find = (m.name + ' ' + (m.desc || '') + ' ' + (m.staff || '')).toLowerCase();
      a.innerHTML = '<div class="name">' + esc(m.name) + '</div>' +
                    (m.desc ? '<div class="desc">' + esc(m.desc) + '</div>' : '') +
                    (m.staff ? '<div class="owner">담당 ' + esc(m.staff) + '</div>' : '');
      return a;
    }
    function section(parent, title, list){
      var h = document.createElement('h3');
      h.innerHTML = esc(title) + '<span class="n"></span>';
      parent.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'modules';
      parent.appendChild(grid);
      list.forEach(function(m){ grid.appendChild(card(m)); });
      h.dataset.grp = title; grid.dataset.grp = title;   // 좌측 메뉴가 이 이름으로 골라 띄운다
    }

    var pinList = PINNED.map(function(_, i){ return pinned[i]; }).filter(Boolean);
    if (pinList.length) section(root, '자주 여는 것', pinList);
    order.forEach(function(g){ section(root, g, bag[g]); });
    // 문서함 = 읽는 것 + 지난 보고. 일하는 화면은 위에서 이미 카드로 갔다.
    function docDate(m){                      // 파일 이름에 박힌 260905 · 20260905 를 날짜로 읽는다
      var mm = (m.path || '').match(/(\d{8}|\d{6})(?=[_.])/);
      if (!mm) return '';
      return mm[1].length === 8 ? mm[1] : '20' + mm[1];
    }
    files.sort(function(a, b){ return docDate(b).localeCompare(docDate(a)); });
    function docSection(title, hint, list){
      if (!list.length) return;
      var h = document.createElement('h3');
      h.innerHTML = esc(title) + '<span class="n"></span>';
      rootDoc.appendChild(h);
      var note = document.createElement('div');
      note.className = 'note';
      note.textContent = hint;
      rootDoc.appendChild(note);
      docTable(rootDoc, list);
    }
    docSection('문서', '읽는 것 — 가이드·서식·기준·공고·교육.', docs);
    docSection('저장 파일', '지난 보고 한 장짜리 — 최신 것부터. 그때 기록이라 고치지 않는다.', files);

    // 운영 축 — 지금 몇 장인지만 센다. 가동·비용 3색 신호는 자동화 잇기(시토 1136) 뒤에 붙인다.
    // 같은 숫자를 왼쪽 메뉴가 이미 보여준다 — 화면 위에 또 한 줄을 두지 않는다(2026-09-10).

    // 좌측 메뉴 — 그룹은 손으로 적지 않고 방금 그린 것에서 그대로 뽑는다
    var menu = document.getElementById('menu-groups');
    menu.innerHTML = '';
    var groups = [];
    if (pinList.length) groups.push(['자주 여는 것', pinList.length]);
    order.forEach(function(g){ groups.push([g, bag[g].length]); });
    groups.forEach(function(gp){
      var a = document.createElement('a');
      a.href = '#' + gp[0]; a.dataset.grp = gp[0];
      a.innerHTML = '<span class="t">' + esc(gp[0]) + '</span><span class="b">' + gp[1] + '</span>';
      menu.appendChild(a);
    });
    var bdoc = document.getElementById('b-doc');
    if (bdoc) bdoc.textContent = docs.length + files.length;   // 문서 + 저장 파일 (가른 뒤 한쪽만 세고 있었다)
    bindMenu();
    showGroup(groups.length ? groups[0][0] : null);

    if (!root.children.length) root.innerHTML = '<div class="msg">실행 화면이 없다.</div>';
    if (!rootDoc.children.length) rootDoc.innerHTML = '<div class="msg">문서가 없다.</div>';
    filter();
  }).catch(function(){
    document.getElementById('sections').innerHTML =
      '<div class="msg">모듈 목록(modules.json)을 불러오지 못했다.</div>';
  });
}

// 2-2) 좌측 메뉴 — 한 번에 한 자리만 띄운다. 무거운 판(비용·권한)은 처음 열 때만 읽는다.
var PANES = ['mod', 'doc', 'adm'];   // 권한은 오른쪽 자리에 끼워 띄운다(GM 2026-09-11)

function showPane(which){
  // 권한 판은 처음 열 때만 읽는다 — 안 여는 사람에겐 통신이 0이다.
  if (which === 'adm') {
    var f = document.getElementById('adm-frame');
    if (f && f.getAttribute('src') === 'about:blank') f.setAttribute('src', '/auth/admin');
  }
  PANES.forEach(function(k){ document.getElementById('pane-' + k).hidden = (k !== which); });
}

// 모듈 그룹 하나만 띄운다 — 42장을 한 줄로 늘어놓지 않는다.
// grp 가 null 이면(검색 중) 전부 띄운다.
function showGroup(grp){
  showPane('mod');
  var root = document.getElementById('sections');
  [].forEach.call(root.children, function(el){
    if (!el.dataset || !el.dataset.grp) return;
    el.hidden = (grp !== null && el.dataset.grp !== grp);
  });
  mark(grp ? '[data-grp="' + cssq(grp) + '"]' : null, grp || '검색 결과');
}

function cssq(v){ return String(v).replace(/"/g, '\\"'); }

function mark(sel, label){
  var links = document.querySelectorAll('.side a[data-grp], .side a[data-go]');
  [].forEach.call(links, function(a){ a.classList.remove('on'); });
  if (sel) {
    var hit = document.querySelector('.side a' + sel);
    if (hit) hit.classList.add('on');
  }
  var crumb = document.getElementById('crumb');
  if (crumb) crumb.textContent = label;
}

function bindMenu(){
  [].forEach.call(document.querySelectorAll('.side a[data-grp]'), function(a){
    if (a.dataset.bound) return;
    a.dataset.bound = '1';
    a.addEventListener('click', function(e){
      e.preventDefault();
      document.getElementById('find').value = '';
      filter();
      showGroup(a.dataset.grp);
      window.scrollTo(0, 0);
    });
  });
  [].forEach.call(document.querySelectorAll('.side a[data-go]'), function(a){
    if (a.dataset.bound) return;
    a.dataset.bound = '1';
    a.addEventListener('click', function(e){
      e.preventDefault();
      showPane(a.dataset.go);
      mark('[data-go="' + a.dataset.go + '"]', a.querySelector('.t').textContent);
      window.scrollTo(0, 0);
    });
  });
}

// 3) 찾기 — 상단바 한 곳에서 모듈과 문서를 같이 건진다.
//    글자를 넣는 순간 그룹 칸막이를 걷어 전체에서 찾고, 지우면 원래 그룹으로 돌아온다.
var lastGroup = null;
function filterIn(rootId, q){
  var root = document.getElementById(rootId);
  if (!root) return 0;
  var kids = root.children, head = null, shown = 0, total = 0;
  for (var i = 0; i < kids.length; i++) {
    var el = kids[i];
    if (el.tagName === 'H3') {
      if (head) { head.hidden = !shown; head.querySelector('.n').textContent = shown ? shown + '개' : ''; }
      head = el; shown = 0;
      continue;
    }
    // 표(문서함)는 줄 단위로, 타일(모듈)은 칸 단위로 거른다
    var items = el.classList && el.classList.contains('tbl-wrap')
      ? el.querySelectorAll('tbody tr') : el.children;
    for (var j = 0; j < items.length; j++) {
      var it = items[j];
      var hit = !q || (it.dataset.find || '').indexOf(q) >= 0;
      it.hidden = !hit;
      if (hit) { shown++; total++; }
    }
    el.hidden = !shown;
  }
  if (head) { head.hidden = !shown; head.querySelector('.n').textContent = shown ? shown + '개' : ''; }
  return total;
}

function filter(){
  var q = document.getElementById('find').value.trim().toLowerCase();
  var mods = filterIn('sections', q);
  var docs = filterIn('sections-doc', q);
  var noneEl = document.getElementById('find-none');
  if (noneEl) noneEl.hidden = true;
  if (!q) { if (lastGroup) showGroup(lastGroup); return; }
  /* 검색 중에는 칸막이를 전부 걷는다 — 화면과 문서를 한 자리에서 같이 보여준다.
     종전엔 걸린 쪽 하나만 띄워, 「문서 1개」라 적어 놓고 그 1개를 못 보여줬다(2026-09-10 실측). */
  showGroup(null);
  document.getElementById('pane-doc').hidden = (docs === 0);
  mark(null, '찾기 — 화면 ' + mods + '개 · 문서·파일 ' + docs + '개');
  // 하나도 안 걸리면 빈 화면이 된다 — 찾는 말이 없는 건지 화면이 고장난 건지 알 수가 없다.
  var none = document.getElementById('find-none');
  if (!none) {
    none = document.createElement('div');
    none.id = 'find-none';
    none.className = 'msg';
    document.getElementById('pane-mod').appendChild(none);
  }
  none.textContent = '「' + document.getElementById('find').value.trim() + '」로 찾은 것이 없다. 다른 말로 찾아 보세요.';
  none.hidden = (mods + docs) > 0;
}
document.getElementById('find').addEventListener('input', filter);
