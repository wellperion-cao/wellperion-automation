<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 ERP</title>
<link rel="icon" type="image/x-icon" href="../welly_favicon.ico">
<style>
  /* 색 = 권한관리·로그인 화면과 같은 토큰(밝은 종이 톤 · 다크 자동) — GM 지시 2026-09-08
     "권한관리가 더 밝아서 보기 좋다". 종전엔 가이드 허브의 어두운 :root 를 썼는데, 권한관리 화면을
     이 안에 끼워 띄우게 되면서 한 화면에 밝은 판과 어두운 판이 같이 뜨는 것도 함께 해소된다.
     강조색 = 브랜드 시그니처 에메랄드 #63BBA0 (브랜드 기반 문서 · GM 지시). 종전 베이지 #B79F8A 대체. */
  :root{
    --bg:#F4F0EB; --paper:#fff; --text:#221F20; --text-soft:#4A423C;
    --dim:#6E655C; --dim-soft:#9C938A;
    --accent:#63BBA0; --accent-hover:#3F9B80; --accent-bg:rgba(99,187,160,0.12);
    --border:rgba(34,31,32,0.12); --border-strong:rgba(34,31,32,0.26); --gray-bg:#FBF9F6;
  }
  /* 보는 사람이 다크 모드면 같이 어두워진다 — 끼워 띄우는 권한관리 화면이 그렇게 동작하므로 짝을 맞춘다 */
  @media(prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#221F20; --paper:#2a2725; --text:#F4F0EB; --text-soft:#CFC8C1;
      --dim:#AAA098; --dim-soft:#7E766E;
      --accent:#63BBA0; --accent-hover:#8ED6BF; --accent-bg:rgba(99,187,160,0.16);
      --border:rgba(255,255,255,0.10); --border-strong:rgba(255,255,255,0.24); --gray-bg:#302c2a;
    }
  }
  html{color-scheme:light dark;}
  *{box-sizing:border-box; margin:0; padding:0;}
  [hidden]{display:none !important;}  /* .mod·.modules 가 display 를 덮어써서 필요하다 */
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
       color:var(--text); background:var(--bg); line-height:1.75; font-size:var(--fs-3);
       -webkit-font-smoothing:antialiased;}

  .topbar{display:flex; align-items:center; gap:22px; padding:0 40px; height:58px;
          position:sticky; top:0; z-index:20;
          background:var(--paper); border-bottom:1px solid var(--border);}
  .topbar .brand{display:flex; align-items:center; color:var(--text);}
  .topbar .brand svg{height:16px; width:auto; display:block;}  /* 브랜드 자산 정본 = erp/brand/ (배932·952) */
  .topbar .brand .sub{font-size:var(--fs-2); color:var(--dim); font-weight:400; margin-left:8px;}
  .topbar .who{margin-left:auto; font-size:var(--fs-3); color:var(--text-soft);}
  .topbar .who .role{display:inline-block; font-size:var(--fs-1); font-weight:600;
                     padding:2px 9px; border-radius:20px; background:var(--accent);
                     color:#fff; margin-left:7px;}
  .topbar a.logout{font-size:var(--fs-2); color:var(--dim); text-decoration:none; margin-left:16px;}
  .topbar a.logout:hover{color:var(--accent-hover);}
  /* 지금 어느 층에 있는지 — 회사 관리자(/erp/admin/) · 파트너사 관리자 · 파트너사 직원 (GM 지시 2026-09-09).
     같은 주소가 두 층을 겸하므로 이름표는 역할로 정한다. 위층으로 가는 길은 관리자에게만 보인다. */
  .topbar .layer{font-size:var(--fs-1); font-weight:600; color:var(--text-soft);
                 padding:3px 10px; border-radius:20px; background:var(--gray-bg);
                 border:1px solid var(--border); white-space:nowrap;}
  .topbar a.up{font-size:var(--fs-2); color:var(--dim); text-decoration:none; white-space:nowrap;}
  .topbar a.up:hover{color:var(--accent-hover);}

  .main{max-width:1100px; padding:40px 40px 80px;}
  h2{font-size:var(--fs-6); font-weight:700; letter-spacing:-0.015em; margin-bottom:4px;}
  [role=tabpanel] > h2:first-child{margin-top:0;}
  .meta{font-size:var(--fs-2); color:var(--dim); margin-bottom:30px;}
  h3{font-size:var(--fs-4); font-weight:700; margin:44px 0 14px; padding-bottom:8px;
     border-bottom:2px solid var(--gray-bg);}

  .modules{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px;}
  .mod{display:block; background:var(--paper); border:1px solid var(--border);
       border-radius:12px; padding:20px 22px; text-decoration:none; color:inherit;
       transition:border-color 0.12s, background 0.12s;}
  .mod:hover{border-color:var(--accent); background:var(--accent-bg); box-shadow:0 4px 14px rgba(34,31,32,.07);}
  .mod .name{font-size:var(--fs-4); font-weight:700; margin-bottom:6px;}
  .mod .desc{font-size:var(--fs-3); color:var(--text-soft); line-height:1.65;}
  .mod .owner{font-size:var(--fs-2); color:var(--dim); margin-top:12px;
              border-top:1px dashed var(--border-strong); padding-top:9px;}
  /* roles 에 내 역할이 없으면 흐리게만 — 숨기지 않는다 */
  .mod.locked{opacity:0.4;}
  .mod.locked:hover{border-color:var(--border); background:var(--paper);}
  .mod.locked .owner::after{content:" · 권한 없음"; color:var(--dim-soft);}

  .find{width:100%; max-width:420px; padding:10px 14px; margin-bottom:6px;
        background:var(--paper); border:1px solid var(--border-strong); border-radius:8px;
        color:var(--text); font-size:var(--fs-3); font-family:inherit;}
  .find:focus{outline:none; border-color:var(--accent);}
  .find::placeholder{color:var(--dim-soft);}
  h3 .n{font-size:var(--fs-2); font-weight:400; color:var(--dim); margin-left:8px;}

  .msg{color:var(--dim); font-size:var(--fs-3);}

  /* 탭 = 최상단 상단바 안 (GM 지시 2026-09-08 — 본문에 있던 것을 위로 올렸다) */
  .tabs{display:flex; gap:2px; height:100%; overflow-x:auto; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs button{background:none; border:0; padding:0 14px; height:100%; font:inherit; font-weight:600;
               white-space:nowrap; color:var(--dim); cursor:pointer;
               border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tabs button:hover{color:var(--text);}
  .tabs button[aria-selected=true]{color:var(--text); border-bottom-color:var(--accent);}
  .tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-6px; border-radius:8px;}
  .dl .mod .owner::before{content:"내려받기 · ";}
  .note{font-size:var(--fs-2); color:var(--dim); background:var(--gray-bg);
        border-left:2px solid var(--border-strong); padding:10px 14px; border-radius:6px; margin-bottom:20px;}
  .note a{color:var(--accent-hover);}
  /* 운영 축 — 오늘 카드 수만 센다(배1135 4단계). 가동·비용 신호는 자동화 잇기 뒤에 붙인다. */
  .ops{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin-bottom:16px;
       padding:10px 14px; background:var(--gray-bg); border:1px solid var(--border);
       border-radius:8px; font-size:var(--fs-2); color:var(--text-soft);}
  .ops b{color:var(--text); font-weight:700;}
  .ops .hint{width:100%; font-size:var(--fs-2); color:var(--dim);}
  /* 권한관리 끼워넣기 — 서버가 내주는 관리자 화면을 이 자리에 그대로 띄운다 */
  /* 관리자 화면은 넓은 콘솔이다 — 모듈 목록용 1100px 틀에 가두지 않고 창 폭을 다 쓴다.
     .main 은 왼쪽 정렬(좌우 여백 40px)이라 이 폭이 화면에 정확히 들어맞는다. */
  #pane-adm{width:calc(100vw - 80px);}
  #adm-frame{width:100%; height:calc(100vh - 260px); min-height:560px; border:1px solid var(--border);
             border-radius:12px; background:var(--paper); display:block;}
  @media(max-width:640px){ #pane-adm{width:auto;} }
  /* 사용량 탭 — 화면 하나를 그대로 끼워 띄운다(권한관리와 같은 방식). 탭으로 격상(GM 2026-09-09). */
  #use-frame{width:100%; height:calc(100vh - 150px); min-height:560px; border:1px solid var(--border);
             border-radius:12px; background:var(--paper); display:block;}
  @media(max-width:640px){ .topbar{padding:14px 18px;} .main{padding:26px 18px 60px;} }
</style>

<div class="main">
  <div id="pane-mod" role="tabpanel">
    <h2>실행 모듈</h2>
    <div class="meta">업무를 굴리는 화면만. 회원 · 운영 · 점검 · 경영 4그룹.</div>
    <div class="ops" id="ops" hidden></div>

    <div id="sections"><div class="msg">불러오는 중…</div></div>
  </div>

  <div id="pane-doc" role="tabpanel" hidden>
    <h2>문서함</h2>
    <div class="meta">읽는 것 — 안내 · 초안 · 보고서 · 가이드.</div>
    <input class="find" id="find-doc" type="search" placeholder="문서 이름으로 찾기" autocomplete="off">

  </div>

    <!-- 제목·설명을 여기 두지 않는다 — 끼워 띄우는 페이지가 자기 제목을 이미 갖고 있어 두 번 나온다(GM 지적 2026-09-09). -->
    <iframe id="use-frame" title="토큰 사용량" src="about:blank"></iframe>

      아래가 비어 보이면 <a href="/auth/admin" target="_blank" rel="noopener">새 창으로 열기</a>.</div>

<script>
// 1) 로그인 확인 — 401 이면 관문으로 보낸다. 서버(nginx 앞단 FastAPI)가 쿠키를 판정한다.
fetch('/auth/me', {credentials:'same-origin'}).then(function(r){
  if (r.status === 401) { location.href = '/auth/login?next=/erp/'; return null; }
  if (!r.ok) throw new Error('auth ' + r.status);
  return r.json();
}).then(function(me){
  if (!me) return;
  document.getElementById('who').innerHTML =
    esc(me.name || me.email || '') + '<span class="role">' + esc(me.role || '') + '</span>';
  document.getElementById('logout').hidden = false;
  // 관리자에게만 「권한관리」 탭을 띄운다. ★이건 보기 편하라고 감추는 것일 뿐 잠금이 아니다 —
  //   실제 차단은 /auth/admin 이 서버에서 한다(관리자 아니면 403, 관리자여도 비밀번호 한 번 더).
  if (me.role === 'admin') document.getElementById('tab-adm').hidden = false;
  setLayer(me.role);
  return loadModules(me.role, me.allowed_ids || null);
}).catch(function(e){
  // 로컬에서 파일로 열면 /auth/me 가 없다 — 튕기지 않고 권한 없는 상태로 그려 둔다.
  document.getElementById('who').textContent = '로그인 확인 불가';
  setLayer(null);
  loadModules(null, null);
});

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* 층 구조 (GM 확정 2026-09-09)
     /erp/admin/  회사 관리자      — 플랫폼을 파는 우리
     /erp/        파트너사 관리자  — 그 회사의 관리자
     /            파트너사 직원    — 그 회사의 직원
   이 파일 하나가 아래 두 층을 겸한다. 층은 주소로 가른다 — 역할로 가르면 직원이 /erp/ 를 열었을 때
   관리자 화면이 되고, 관리자가 / 를 열었을 때 직원 화면이 돼 주소와 화면이 어긋난다.
   비용·권한처럼 관리자 것인 탭은 위층에서만 보인다. 위층으로 가는 링크는 보기 편하라고 감출 뿐
   잠금이 아니다 — 실제 차단은 서버가 한다(/auth/admin 은 관리자 아니면 403). */
function setLayer(role){
  var isManager = /^\/erp(\/|$)/.test(location.pathname);
  var el = document.getElementById('layer');
  el.textContent = isManager ? '파트너사 관리자' : '파트너사 직원';
  el.hidden = false;

  var up = document.getElementById('up-admin');
  if (isManager) {
    if (role === 'admin') { up.href = '/erp/admin/'; up.textContent = '회사 관리자 콘솔 ↑'; up.hidden = false; }
  } else {
    // 직원 층 — 비용·권한 탭은 이 층의 것이 아니다
    document.getElementById('tab-use').hidden = true;
    document.getElementById('tab-adm').hidden = true;
    if (role === 'admin') { up.href = '/erp/'; up.textContent = '파트너사 관리자 화면 ↑'; up.hidden = false; }
  }
}

// 2) 모듈 카드 — modules.json 은 scripts/erp_modules_build.py 가 화면 파일에서 자동 생성한다.
//    여기서는 group(핵심 → 닉네임) 순서대로 섹션을 나눠 그리기만 한다.
function loadModules(role, allowedIds){
  /* 절대경로다 — 이 화면은 /erp/ 와 루트(/) 두 주소에서 같이 뜬다(배1151). 상대경로로 두면
     루트에서 /modules.json 을 찾아 404 가 나고 모듈 목록이 통째로 빈다. */
  return fetch('/erp/modules.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    var root = document.getElementById('sections');
    var rootDoc = document.getElementById('sections-doc');
    root.innerHTML = ''; rootDoc.innerHTML = '';

    // 그룹별로 먼저 모은 다음 한 번씩 그린다 (2026-09-08).
    //   왜: 예전엔 목록을 훑으며 '앞 항목과 그룹이 다르면' 새 제목을 붙였다. 그런데 매일 쓰는
    //   핵심 화면 3개가 목록 맨 앞에 따로 모여 있어서, 「회원」·「점검」 제목이 각각 두 번씩
    //   나뉘어 나왔다(회원 2개 … 점검 1개 … 회원 4개 …). 그룹으로 모으면 한 번씩만 나온다.
    //   그룹이 나오는 차례는 목록에 처음 등장한 순서를 그대로 따른다.
    // 자주 여는 화면을 맨 위로 — 실측 2026-09-09: GM 이 매일 보는 「GM 업무」 카드가
    //   스크롤 7.1화면(6,345px) 아래에 묻혀 있었다(회원 카드는 0.5화면). 목록 차례가
    //   부서 순서라 자주 쓰는 것일수록 아래로 갔다. 여기 적힌 것만 맨 위 한 줄로 올린다.
    var PINNED = ['coo-chairman-gm업무', 'coo-todo-업무-현황-ssot', 'coo-todo-결재-현황-ssot',
                  'member', 'inquiry', 'check', 'cto-자율현황'];
    var order = [], bag = {}, docs = [], pinned = {};
    (d.modules || []).forEach(function(m){
      var g = m.appgroup || '문서함';   // 회원·운영·점검·경영·문서함 5그룹(배1026 · 2026-09-05)
      if (allowedIds && allowedIds.indexOf(m.id) < 0) return;     // 권한 밖 화면은 카드 자체를 안 그린다
      // 문서(읽는 것)는 카드 자리에서 빼 문서함 탭으로 보낸다(배1135 4단계 · GM 지시 2026-09-08).
      if (g === '문서함') { docs.push(m); return; }
      var pi = PINNED.indexOf(m.id);
      if (pi >= 0) { pinned[pi] = m; return; }   // 자주 여는 것은 아래 그룹에 또 그리지 않는다
      if (!bag[g]) { bag[g] = []; order.push(g); }
      bag[g].push(m);
    });

    function card(m){
      var a = document.createElement('a');
      a.className = 'mod';
      a.href = m.path;
      a.dataset.find = (m.name + ' ' + (m.desc || '') + ' ' + (m.staff || '')).toLowerCase();
      a.innerHTML = '<div class="name">' + esc(m.name) + '</div>' +
                    (m.desc ? '<div class="desc">' + esc(m.desc) + '</div>' : '') +
                    (m.staff ? '<div class="owner">담당 ' + esc(m.staff) + '</div>' : '');
      return a;
    }
    function section(parent, title, list){
      var h = document.createElement('h3');
      h.innerHTML = esc(title) + '<span class="n"></span>';
      parent.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'modules';
      parent.appendChild(grid);
      list.forEach(function(m){ grid.appendChild(card(m)); });
    }

    var pinList = PINNED.map(function(_, i){ return pinned[i]; }).filter(Boolean);
    if (pinList.length) section(root, '자주 여는 것', pinList);
    order.forEach(function(g){ section(root, g, bag[g]); });
    if (docs.length) section(rootDoc, '문서함', docs);

    // 운영 축 — 지금 몇 장인지만 센다. 가동·비용 3색 신호는 자동화 잇기(시토 1136) 뒤에 붙인다.
    var execCount = pinList.length;
    order.forEach(function(g){ execCount += bag[g].length; });
    var ops = document.getElementById('ops');
    ops.hidden = false;
    ops.innerHTML = '<span><b>실행</b> ' + execCount + '개</span>'
      + '<span><b>문서함</b> ' + docs.length + '개</span>'
      + order.map(function(g){ return '<span>' + esc(g) + ' ' + bag[g].length + '</span>'; }).join('')
      + '<div class="hint">가동·비용 신호는 자동화 잇기가 끝난 뒤 붙인다 — 지금은 근거가 없어 그리지 않는다.</div>';

    if (!root.children.length) root.innerHTML = '<div class="msg">실행 화면이 없다.</div>';
    if (!rootDoc.children.length) rootDoc.innerHTML = '<div class="msg">문서가 없다.</div>';
    filter(); filterDoc();
  }).catch(function(){
    document.getElementById('sections').innerHTML =
      '<div class="msg">모듈 목록(modules.json)을 불러오지 못했다.</div>';
  });
}

// 2-2) 탭 전환 — 무거운 판(사용량·권한관리)은 처음 열 때 한 번만 읽는다.
var admLoaded = false, useLoaded = false;
var TABS = ['mod', 'doc', 'use', 'adm'];   // 다운로드는 회사 관리자 콘솔로 옮겼다(GM 2026-09-09)
function showTab(which){
  TABS.forEach(function(k){
    var on = (k === which);
    document.getElementById('tab-' + k).setAttribute('aria-selected', on);
    document.getElementById('pane-' + k).hidden = !on;
  });
  // 사용량 판도 처음 열 때 한 번만 불러온다.
  if (which === 'use' && !useLoaded) { useLoaded = true; document.getElementById('use-frame').src = '../cto/automation/토큰 사용량.html'; }
  // 관리자 화면은 서버가 내준다 — 처음 열 때 한 번만 불러온다(매번 다시 안 부른다).
  if (which === 'adm' && !admLoaded) { admLoaded = true; document.getElementById('adm-frame').src = '/auth/admin'; }
}
TABS.forEach(function(k){
  document.getElementById('tab-' + k).addEventListener('click', function(){ showTab(k); });
});

// 3) 제목 필터 — 안 남은 섹션은 제목째 감춘다.
function filterIn(inputId, rootId){
  var q = document.getElementById(inputId).value.trim().toLowerCase();
  var root = document.getElementById(rootId);
  var kids = root.children, head = null, shown = 0;
  for (var i = 0; i < kids.length; i++) {
    var el = kids[i];
    if (el.tagName === 'H3') {
      if (head) { head.hidden = !shown; head.querySelector('.n').textContent = shown ? shown + '개' : ''; }
      head = el; shown = 0;
      continue;
    }
    for (var j = 0; j < el.children.length; j++) {
      var card = el.children[j];
      var hit = !q || card.dataset.find.indexOf(q) >= 0;
      card.hidden = !hit;
      if (hit) shown++;
    }
    el.hidden = !shown;
  }
  if (head) { head.hidden = !shown; head.querySelector('.n').textContent = shown ? shown + '개' : ''; }
}
function filter(){ filterIn('find', 'sections'); }
function filterDoc(){ filterIn('find-doc', 'sections-doc'); }
document.getElementById('find').addEventListener('input', filter);
document.getElementById('find-doc').addEventListener('input', filterDoc);
</script>
