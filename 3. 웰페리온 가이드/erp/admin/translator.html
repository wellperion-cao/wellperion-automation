<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 번역비서 — 웰페리온 ERP 관리자</title>
<!-- AI 번역가 — 배 12804 · 2026-09-18 시보. GM 지시 2026-09-18 「상담 질문과 답을 받고 가공하여
     사람이 상담하듯이 · 다음 단계는 목소리를 입히고 싶어」 의 다음 단계 실험. meeting_note.html 틀을
     그대로 본뜬다(녹음=Web Speech API · 서버 업로드 없음 · 크롬 전용). 대화 기록·SSOT 반영 없음 —
     그 순간 통역만. 번역 = 서버 POST /api/translate(server/erp_api/api_translate.py).
     이 화면 자체는 회사 관리자 로그인 뒤(/erp/admin/)에만 뜬다 — 별도 비밀번호 커튼 없음. -->
<link rel="stylesheet" href="../../assets/wp-ui.css">
<link rel="stylesheet" href="platform_brand.css">
<style>
  :root{
    --bg:var(--pf-panel,#EDF3F3); --paper:var(--pf-bg,#fff); --text:var(--pf-ink,#0F1E1E); --text-soft:var(--pf-soft,#3A4A4A);
    --accent:var(--pf-pri,#0E9488); --accent-hover:var(--pf-pri-dk,#0A6E66);
    --accent-bg:var(--pf-tint,rgba(14,148,136,.10)); --border:var(--pf-line,rgba(12,40,40,.12));
  }
  html{color-scheme:light;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--pf-sans,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif);
       color:var(--text); background:var(--bg); line-height:1.55; font-size:var(--fs-3,14px);}
  /* 모바일이 주 화면 — wrap 을 세로 flex 로 두고 채팅이 늘어나 버튼을 엄지 닿는 아래로 민다(GM 09-18 20:1x) */
  .wrap{width:100%; max-width:640px; margin:0 auto; padding:20px 20px calc(16px + env(safe-area-inset-bottom));
        display:flex; flex-direction:column; min-height:100dvh;}
  h1{font-family:var(--pf-head); font-size:var(--fs-5); font-weight:700; margin-bottom:4px;}
  .sub{font-size:var(--fs-2); color:var(--text-soft); margin-bottom:16px;}
  .portrait{display:flex; flex-direction:column; flex:1; min-height:0;}
  .langrow{display:flex; gap:8px; align-items:center; margin:14px 0 14px; flex-wrap:wrap;}
  select.lang{font:inherit; font-size:var(--fs-2); padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--paper); color:var(--text);}
  /* 큰 누르는 버튼 2개 — 방향 토글 대신(GM 지시 2026-09-18 19:3x). 누르면 받아쓰기, 떼면 번역. */
  .pressgrid{display:flex; flex-direction:column; gap:10px; margin:0 0 14px;}
  .pressbtn{font:inherit; font-size:16px; font-weight:700; padding:18px 16px; border-radius:12px; cursor:pointer;
       border:1px solid var(--border); background:var(--paper); color:var(--text); min-height:64px;
       -webkit-user-select:none; user-select:none; touch-action:none;}
  .pressbtn.active{background:#B3261E; border-color:#B3261E; color:#fff;}
  .pressbtn:disabled{opacity:.5; cursor:not-allowed;}
  .pressbtn.hide{display:none;}
  .btn{font:inherit; font-size:var(--fs-2); font-weight:600; padding:8px 16px; border-radius:8px; cursor:pointer;
       border:1px solid var(--border); background:var(--paper); color:var(--text);}
  .btn.p{background:var(--accent-hover); border-color:var(--accent-hover); color:#fff;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  /* 글 입력 — 말 대신 타이핑(GM 「글 입력도 남긴다」). 방향 = 한국어→상대 언어(기본 방향). */
  .typerow{display:flex; gap:8px; margin:0 0 16px;}
  .typerow input{flex:1; font:inherit; font-size:var(--fs-2); padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--paper); color:var(--text);}
  .msg{font-size:var(--fs-2); color:var(--text-soft); margin:0 0 12px;}
  .msg.ok{color:var(--accent-hover); font-weight:600;}
  .msg.bad{color:var(--pf-bad,#B3261E); font-weight:600;}
  .chat{display:flex; flex-direction:column; gap:10px; flex:1; min-height:120px; overflow-y:auto;}
  .bubble{max-width:78%; border-radius:12px; padding:10px 14px;}
  .bubble.mine{align-self:flex-end; background:var(--accent-bg); border:1px solid var(--accent);}
  .bubble.other{align-self:flex-start; background:var(--paper); border:1px solid var(--border);}
  .bubble .orig{font-size:var(--fs-3); margin-bottom:3px;}
  .bubble .tr{font-size:var(--fs-2); color:var(--text-soft);}
  /* 번역문은 크게 — 가장 최근 말풍선만(GM 「번역문은 크게 보여 주고」) */
  .bubble:last-child .tr{font-size:20px; font-weight:700; color:var(--text); line-height:1.4; margin-top:6px;}
  .empty{color:var(--text-soft); font-size:var(--fs-2); text-align:center; padding:40px 0;}
  .note{font-size:var(--fs-1); color:var(--text-soft); margin-top:16px; line-height:1.5;}
  /* 가로 태블릿(≥768px·landscape) — 좌우 분할(GM 09-18 20:1x). 손님 쪽 글자 180도 회전은 넣지 않는다(나란히 앉는 자리라 오히려 불편) */
  .split{display:none;}
  @media (min-width:768px) and (orientation:landscape){
    .wrap{max-width:none; padding:0; min-height:100dvh;}
    #portraitView{display:none;}
    .split{display:flex; height:100dvh;}
    .side{flex:1; display:flex; flex-direction:column; justify-content:flex-end; padding:24px; gap:16px; min-width:0;}
    .divider{width:1px; background:var(--border);}
    .sidelabel{font-size:var(--fs-2); color:var(--text-soft); text-align:center;}
    .lasttr{flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
            font-size:30px; font-weight:700; color:var(--text); overflow-y:auto; padding:10px; line-height:1.4;}
    .split-btn{min-height:76px; font-size:18px;}
    /* 글 입력 대체 — 미지원 브라우저는 이것만 남고, 지원 브라우저는 말하기 버튼 아래 작게(GM 09-18) */
    .side .typerow{margin:0;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="portraitView" class="portrait">
    <h1>AI 번역비서 <span style="font-weight:500;color:var(--text-soft)">— 실시간 통역</span></h1>
    <div class="sub">버튼을 누르고 있는 동안 말하고, 떼면 번역합니다.</div>

    <div class="chat" id="chat"><div class="empty">번역이 여기 쌓입니다.</div></div>

    <div class="langrow">
      <span class="msg" style="margin:0">상대 언어</span>
      <select class="lang" id="otherLang"><option value="en">영어</option></select>
    </div>
    <div class="pressgrid">
      <button type="button" class="pressbtn" id="btnKo">🇰🇷 한국어로 말하기</button>
      <button type="button" class="pressbtn" id="btnOther">언어로 말하기</button>
    </div>
    <!-- 자동 통역 — 언어를 안 고르고 눌러 말하면 서버가 ko/en 을 스스로 판별한다(배 12831 · GM 09-18) -->
    <div class="pressgrid">
      <button type="button" class="pressbtn" id="btnAuto">🎤 자동 통역</button>
    </div>
    <div class="typerow">
      <input type="text" id="typeText" placeholder="또는 한국어로 입력">
      <button type="button" class="btn p" id="btnType">번역</button>
    </div>
    <div class="msg" id="statusMsg"></div>

    <div class="note">크롬·사파리에서 지원됩니다(Web Speech API) — 마이크 소리는 서버로 전송되지 않고 브라우저 안에서만 글자로 바뀝니다. 텍스트만 번역 서버로 보냅니다.</div>
  </div>

  <!-- 가로 태블릿 좌우 분할 — 왼쪽 우리(한국어)·오른쪽 손님(상대 언어). 회전 배치 없음(GM 09-18) -->
  <div class="split" id="splitView">
    <div class="side">
      <div class="sidelabel">우리</div>
      <div class="lasttr" id="lastKo">번역이 여기 크게 표시됩니다.</div>
      <button type="button" class="pressbtn split-btn" id="btnKoSplit">🇰🇷 한국어로 말하기</button>
      <div class="typerow">
        <input type="text" id="typeKoSplit" placeholder="또는 한국어로 입력">
        <button type="button" class="btn p" id="btnTypeKoSplit">번역</button>
      </div>
    </div>
    <div class="divider"></div>
    <div class="side">
      <div class="sidelabel">손님 <select class="lang" id="otherLangSplit"></select></div>
      <div class="lasttr" id="lastOther">Translation will appear here.</div>
      <button type="button" class="pressbtn split-btn" id="btnOtherSplit">언어로 말하기</button>
      <div class="typerow">
        <input type="text" id="typeOtherSplit" placeholder="또는 입력">
        <button type="button" class="btn p" id="btnTypeOtherSplit">번역</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

var LANG_NAME = { ko:'한국어' };
var SPEECH_LOCALE = { ko:'ko-KR' };

var otherSel = document.getElementById('otherLang');
var btnKo = document.getElementById('btnKo');
var btnOther = document.getElementById('btnOther');
var btnKoSplit = document.getElementById('btnKoSplit');
var btnOtherSplit = document.getElementById('btnOtherSplit');
var otherLangSplit = document.getElementById('otherLangSplit');
var lastKoEl = document.getElementById('lastKo');
var lastOtherEl = document.getElementById('lastOther');
var typeText = document.getElementById('typeText');
var btnType = document.getElementById('btnType');
var typeKoSplit = document.getElementById('typeKoSplit');
var btnTypeKoSplit = document.getElementById('btnTypeKoSplit');
var typeOtherSplit = document.getElementById('typeOtherSplit');
var btnTypeOtherSplit = document.getElementById('btnTypeOtherSplit');
var statusMsg = document.getElementById('statusMsg');
var chat = document.getElementById('chat');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function updateOtherBtnLabel(){
  var label = LANG_NAME[otherSel.value] + '로 말하기';
  btnOther.textContent = label;
  btnOtherSplit.textContent = label;
  otherLangSplit.value = otherSel.value;
  typeOtherSplit.placeholder = '또는 ' + LANG_NAME[otherSel.value] + '로 입력';
  // speech:null 언어(예 mn) — 말하기 버튼 숨김(recognition 이 아예 없을 때의 hide 는 건드리지 않는다)
  if (recognition) {
    var speechOk = !!SPEECH_LOCALE[otherSel.value];
    btnOther.classList.toggle('hide', !speechOk);
    btnOtherSplit.classList.toggle('hide', !speechOk);
  }
}
otherSel.addEventListener('change', updateOtherBtnLabel);
otherLangSplit.addEventListener('change', function(){ otherSel.value = otherLangSplit.value; updateOtherBtnLabel(); });

/* ── 언어 목록 — 정본 assistant_langs.json(배 12815). 못 읽으면 ko/en 두 개로 폴백. ── */
function applyLangs(list, defTarget){
  list.forEach(function(l){
    if (l.code === 'ko') return;
    LANG_NAME[l.code] = l.name_ko;
    if (l.speech) SPEECH_LOCALE[l.code] = l.speech;
  });
  var optsHtml = list.filter(function(l){ return l.code !== 'ko'; }).map(function(l){
    return '<option value="' + esc(l.code) + '">' + esc(l.name_ko) + (l.speech ? '' : ' (음성 인식 미지원 · 입력은 글자로)') + '</option>';
  }).join('');
  otherSel.innerHTML = optsHtml;
  otherLangSplit.innerHTML = optsHtml;
  otherSel.value = defTarget || 'en';
  otherLangSplit.value = otherSel.value;
  updateOtherBtnLabel();
}
fetch('assistant_langs.json', {cache:'no-store'}).then(function(r){
  if (!r.ok) throw 0; return r.json();
}).then(function(d){
  applyLangs(d.langs || [], d.default && d.default.target);
}).catch(function(){
  applyLangs([{code:'en', name_ko:'영어', speech:'en-US'}], 'en');
});

/* ── 인식(Web Speech API) — 누르면 받아쓰기 · 떼면 번역(push-to-talk · GM 지시 2026-09-18 19:3x) ── */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var recognition = null;
var pressing = null;      // {source, target, mine} 누르고 있는 동안만
var pendingSt = null;     // 뗀 시점 — onend 에서 이 값으로 번역을 부른다
var liveFinal = '';       // 누르는 동안 쌓인 받아쓴 글(중간 결과 포함 인식이라 final 만 모은다)
var finalSegs = [];       // liveFinal 을 이루는 확정 조각들 — mergeFinal 이 마지막 조각을 교체/버림 판정할 때 씀
var stopReason = null;
var recActive = false;    // 인식이 지금 실제로 돌고 있는가(onstart~onend) — 스스로 끝난 뒤 뗄 때를 구분한다

// 확정 조각 합치기 — meeting_note.html mergeFinal 과 같은 규칙(모바일 크롬이 isFinal 결과를 누적 문장으로
// 주거나 되풀이해 보내는 것 때문에 같은 말이 반복 붙는 것을 막는다).
function mergeFinal(prev, seg){
  var p = (prev || '').trim();
  var s = (seg || '').trim();
  if (!s) return { mode: 'skip', text: s };
  if (!p) return { mode: 'append', text: s };
  if (s === p) return { mode: 'skip', text: s };
  if (s.indexOf(p) === 0) return { mode: 'replace', text: s }; // 누적형: 새 것이 이어짐 → 직전 것을 새 것으로
  if (p.indexOf(s) === 0) return { mode: 'skip', text: s };    // 새 것이 직전의 부분집합 → 버림
  return { mode: 'append', text: s };
}
(function selfcheckMergeFinal(){
  var r;
  r = mergeFinal('안녕', '안녕 하세요'); console.assert(r.mode === 'replace', 'mergeFinal 누적형 실패', r);
  r = mergeFinal('안녕 하세요', '안녕 하세요'); console.assert(r.mode === 'skip', 'mergeFinal 중복형 실패', r);
  r = mergeFinal('안녕 하세요', '반갑습니다'); console.assert(r.mode === 'append', 'mergeFinal 정상조각형 실패', r);
  r = mergeFinal('안녕', ''); console.assert(r.mode === 'skip', 'mergeFinal 빈조각 실패', r);
  r = mergeFinal(' 안녕 ', '안녕 하세요 '); console.assert(r.mode === 'replace', 'mergeFinal 공백트림 실패', r);
})();

if (!SR) {
  /* 인식 미지원 브라우저 — 비활성이 아니라 버튼을 숨기고 글 입력만 남긴다(GM 09-18) */
  btnKo.classList.add('hide'); btnOther.classList.add('hide');
  btnKoSplit.classList.add('hide'); btnOtherSplit.classList.add('hide');
  statusMsg.textContent = '이 브라우저는 듣기를 지원하지 않습니다 — 크롬·사파리를 쓰거나 아래에 글로 입력해 주세요.';
  statusMsg.className = 'msg bad';
} else if (!window.isSecureContext) {
  /* iOS 사파리·안드로이드 크롬 모두 secure context 아니면 마이크 권한 자체가 안 뜬다.
     isSecureContext 는 localhost·127.0.0.1·https 를 브라우저가 직접 판정 — 문자열 비교보다 정확(배 12833) */
  btnKo.classList.add('hide'); btnOther.classList.add('hide');
  btnKoSplit.classList.add('hide'); btnOtherSplit.classList.add('hide');
  statusMsg.textContent = 'https 주소가 아니라 마이크를 쓸 수 없습니다 — 아래에 글로 입력해 주세요.';
  statusMsg.className = 'msg bad';
} else {
  recognition = new SR();
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = function(){ recActive = true; };
  recognition.onresult = function(e){
    for (var i = e.resultIndex; i < e.results.length; i++) {
      if (!e.results[i].isFinal) continue;
      var t = e.results[i][0].transcript;
      var prev = finalSegs.length ? finalSegs[finalSegs.length - 1] : '';
      var m = mergeFinal(prev, t);
      if (m.mode === 'append') finalSegs.push(m.text);
      else if (m.mode === 'replace') finalSegs[finalSegs.length - 1] = m.text;
      // skip: 중복 확정 조각 — 아무것도 안 함
    }
    liveFinal = finalSegs.join(' ');
  };
  recognition.onerror = function(e){
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      statusMsg.textContent = '마이크 권한이 없습니다 — 주소창 옆 자물쇠에서 마이크를 허용해 주세요.';
      statusMsg.className = 'msg bad';
      pressing = null; setPressUI(null);
    }
    // no-speech·network·audio-capture 등은 onend 가 이어서 처리(누르는 중이면 재시작)
  };
  recognition.onend = function(){
    recActive = false;
    if (stopReason === 'translate') {
      stopReason = null;
      var st = pendingSt; pendingSt = null;
      finishPress(st);
      return;
    }
    // 인식이 스스로 끝남(no-speech·network 등) — 아직 누르고 있으면 이어서 듣는다
    if (pressing) { try { recognition.start(); recActive = true; } catch (e) {} }
  };
}

function finishPress(st){
  var text = liveFinal.trim();
  statusMsg.textContent = ''; statusMsg.className = 'msg';
  if (text) handleUtterance(text, st.source, st.target, st.mine);
  else { statusMsg.textContent = '알아듣지 못했습니다 — 버튼을 다시 눌러 말씀해 주세요.'; statusMsg.className = 'msg'; }
}

function setPressUI(which){
  btnKo.classList.toggle('active', which === 'ko');
  btnOther.classList.toggle('active', which === 'other');
  btnKoSplit.classList.toggle('active', which === 'ko');
  btnOtherSplit.classList.toggle('active', which === 'other');
}
function startPress(source, target, mine, which){
  if (!recognition || pressing || stopReason === 'translate') return;
  try { speechSynthesis.cancel(); } catch (e) {}
  pressing = { source: source, target: target, mine: mine };
  liveFinal = ''; finalSegs = [];
  recognition.lang = SPEECH_LOCALE[source] || source;
  setPressUI(which);
  statusMsg.textContent = '듣는 중… (' + LANG_NAME[source] + ')'; statusMsg.className = 'msg ok';
  // recActive 는 onstart(비동기)가 아니라 여기서 바로 켠다 — onstart 전에 떼도(빠른 탭) endPress 가
  // stop() 을 부르게 해서 마이크가 켜진 채 방치되지 않게 한다.
  try { recognition.start(); recActive = true; } catch (e) {}
}
function endPress(){
  if (!recognition || !pressing) return;
  pendingSt = pressing; pressing = null;
  setPressUI(null);
  if (recActive) {
    stopReason = 'translate';
    try { recognition.stop(); } catch (e) {}
  } else {
    // 인식이 이미 스스로 끝나 있었다 — onend 가 다시 안 오므로 여기서 바로 처리
    var st = pendingSt; pendingSt = null;
    finishPress(st);
  }
}
function pressKo(e){ e.preventDefault(); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} startPress('ko', otherSel.value, true, 'ko'); }
function pressOther(e){ e.preventDefault(); try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} startPress(otherSel.value, 'ko', false, 'other'); }
btnKo.addEventListener('pointerdown', pressKo);
btnOther.addEventListener('pointerdown', pressOther);
btnKoSplit.addEventListener('pointerdown', pressKo);
btnOtherSplit.addEventListener('pointerdown', pressOther);
['pointerup', 'pointercancel', 'pointerleave'].forEach(function(evt){
  btnKo.addEventListener(evt, endPress);
  btnOther.addEventListener(evt, endPress);
  btnKoSplit.addEventListener(evt, endPress);
  btnOtherSplit.addEventListener(evt, endPress);
});

/* ── 글 입력(GM 「글 입력도 남긴다」) — 미지원 브라우저는 이것이 유일한 입력 수단,
   지원 브라우저에선 말하기 버튼의 보조 수단(배 12833) ── */
function sendTypedFrom(inputEl, source, target, mine){
  var text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  handleUtterance(text, source, target, mine);
}
function sendTyped(){ sendTypedFrom(typeText, 'ko', otherSel.value, true); }
btnType.addEventListener('click', sendTyped);
typeText.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendTyped(); });

function sendTypedKoSplit(){ sendTypedFrom(typeKoSplit, 'ko', otherSel.value, true); }
function sendTypedOtherSplit(){ sendTypedFrom(typeOtherSplit, otherSel.value, 'ko', false); }
btnTypeKoSplit.addEventListener('click', sendTypedKoSplit);
typeKoSplit.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendTypedKoSplit(); });
btnTypeOtherSplit.addEventListener('click', sendTypedOtherSplit);
typeOtherSplit.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendTypedOtherSplit(); });

/* ── 번역 요청 → 말풍선(크게) → 읽어주기 ── */
var translateSeq = 0;    // 동시 요청 중 늦게 온 응답이 최신 표시를 덮지 않게(요청 번호 비교)
function handleUtterance(text, source, target, mine){
  var seq = ++translateSeq;
  var bubble = addBubble(mine, text, '번역 중…');
  fetch('/api/translate', {
    method: 'POST', cache: 'no-store',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text, source: source, target: target })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.error) {
      bubble.querySelector('.tr').textContent = '(번역 실패)';
      if (seq === translateSeq) { statusMsg.textContent = d.error; statusMsg.className = 'msg bad'; }
      return;
    }
    var tr = d.translation || '(번역 실패)';
    bubble.querySelector('.tr').textContent = tr;
    if (seq !== translateSeq) return;   // 늦게 온 응답 — 최신 표시·읽기는 버림(이 말풍선 자체엔 이미 반영됨)
    if (target === 'ko') lastKoEl.textContent = tr;
    else lastOtherEl.textContent = tr;
    speak(tr, target, function(){});
  }).catch(function(){
    bubble.querySelector('.tr').textContent = '(번역 요청 실패)';
  });
}

function addBubble(mine, orig, tr){
  var empty = chat.querySelector('.empty'); if (empty) empty.remove();
  var div = document.createElement('div');
  div.className = 'bubble ' + (mine ? 'mine' : 'other');
  div.innerHTML = '<div class="orig">' + esc(orig) + '</div><div class="tr">' + esc(tr) + '</div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function speak(text, lang, done){
  if (!('speechSynthesis' in window) || !text) { done(); return; }
  try {
    speechSynthesis.cancel();   // 읽는 중에 새 번역이 오면 쌓이지 않게 먼저 끊는다
    var u = new SpeechSynthesisUtterance(text);
    u.lang = SPEECH_LOCALE[lang] || lang;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  } catch (e) { done(); }
}

/* ── 자동 통역(배 12831) — 눌러 녹음, 다시 누르거나 15초 도달하면 멈추고 서버가 ko/en 을 스스로 판별한다.
   서버(/api/transcribe)는 ko-KR·en-US 만 다뤄 이 버튼은 그 둘 사이만 오간다(GM 09-18 요청 범위) ── */
LANG_NAME.en = LANG_NAME.en || '영어';
SPEECH_LOCALE.en = SPEECH_LOCALE.en || 'en-US';

var AUTO_SAMPLE_RATE = 16000;
var AUTO_MAX_MS = 15000;

function floatToInt16(float32Arr){
  var out = new Int16Array(float32Arr.length);
  for (var i = 0; i < float32Arr.length; i++) {
    var s = Math.max(-1, Math.min(1, float32Arr[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
  }
  return out;
}
function downsampleTo16k(float32Arr, inputRate){
  if (inputRate === AUTO_SAMPLE_RATE) return floatToInt16(float32Arr);
  var ratio = inputRate / AUTO_SAMPLE_RATE;
  var newLen = Math.round(float32Arr.length / ratio);
  var result = new Float32Array(newLen);
  var offsetResult = 0, offsetBuffer = 0;
  while (offsetResult < newLen) {
    var nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
    var accum = 0, count = 0;
    for (var i = offsetBuffer; i < nextOffsetBuffer && i < float32Arr.length; i++) { accum += float32Arr[i]; count++; }
    result[offsetResult] = count ? accum / count : 0;
    offsetResult++;
    offsetBuffer = nextOffsetBuffer;
  }
  return floatToInt16(result);
}

var btnAuto = document.getElementById('btnAuto');
var AutoAC = window.AudioContext || window.webkitAudioContext;
var autoRecording = false, autoStarting = false, autoCtx = null, autoStream = null, autoSource = null, autoProcessor = null, autoTimer = null;
var autoChunks = [];

if (!btnAuto) {
  /* 없음 — 방어. 정상 화면에선 항상 존재 */
} else if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !AutoAC) {
  btnAuto.classList.add('hide');
} else {
  btnAuto.addEventListener('click', function(){
    if (autoRecording) { stopAutoRecording(); return; }
    if (autoStarting) return;
    startAutoRecording();
  });
}

function startAutoRecording(){
  autoStarting = true;
  btnAuto.disabled = true;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    autoStarting = false;
    btnAuto.disabled = false;
    autoStream = stream;
    autoCtx = new AutoAC();
    autoSource = autoCtx.createMediaStreamSource(stream);
    autoProcessor = autoCtx.createScriptProcessor(4096, 1, 1);
    autoChunks = [];
    autoProcessor.onaudioprocess = function(e){
      autoChunks.push(downsampleTo16k(e.inputBuffer.getChannelData(0), autoCtx.sampleRate));
    };
    autoSource.connect(autoProcessor);
    autoProcessor.connect(autoCtx.destination);
    autoRecording = true;
    btnAuto.classList.add('active');
    btnAuto.textContent = '⏹ 듣는 중… (다시 누르면 멈춤)';
    statusMsg.textContent = '자동 통역 듣는 중…'; statusMsg.className = 'msg ok';
    autoTimer = setTimeout(stopAutoRecording, AUTO_MAX_MS);
  }).catch(function(){
    autoStarting = false;
    btnAuto.disabled = false;
    statusMsg.textContent = '마이크 권한이 없습니다 — 주소창 옆 자물쇠에서 마이크를 허용해 주세요.';
    statusMsg.className = 'msg bad';
  });
}
function stopAutoRecording(){
  if (!autoRecording) return;
  autoRecording = false;
  clearTimeout(autoTimer); autoTimer = null;
  btnAuto.classList.remove('active');
  btnAuto.textContent = '🎤 자동 통역';
  if (autoProcessor) { autoProcessor.disconnect(); autoProcessor.onaudioprocess = null; autoProcessor = null; }
  if (autoSource) { autoSource.disconnect(); autoSource = null; }
  if (autoStream) { autoStream.getTracks().forEach(function(t){ t.stop(); }); autoStream = null; }
  if (autoCtx) { autoCtx.close(); autoCtx = null; }
  sendAutoPcm();
}
function sendAutoPcm(){
  var total = 0;
  autoChunks.forEach(function(c){ total += c.length; });
  var chunks = autoChunks; autoChunks = [];
  if (!total) return;
  var merged = new Int16Array(total);
  var off = 0;
  chunks.forEach(function(c){ merged.set(c, off); off += c.length; });
  statusMsg.textContent = '인식 중…'; statusMsg.className = 'msg';
  fetch('/api/transcribe?langs=ko-KR,en-US', {
    method: 'POST', cache: 'no-store',
    headers: { 'Content-Type': 'application/octet-stream' },
    body: merged.buffer
  }).then(function(r){
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(d){
    if (d.error) { statusMsg.textContent = '자동 통역 준비 중입니다.'; statusMsg.className = 'msg bad'; return; }
    var text = (d.text || '').trim();
    if (!text) { statusMsg.textContent = '다시 말씀해 주세요.'; statusMsg.className = 'msg'; return; }
    var lang = (d.lang || '').trim();
    if (!lang) { statusMsg.textContent = '언어를 못 알아들었어요.'; statusMsg.className = 'msg bad'; return; }
    statusMsg.textContent = ''; statusMsg.className = 'msg';
    if (lang.indexOf('ko') === 0) handleUtterance(text, 'ko', 'en', true);
    else handleUtterance(text, 'en', 'ko', false);
  }).catch(function(){
    statusMsg.textContent = '자동 통역 준비 중입니다.'; statusMsg.className = 'msg bad';
  });
}
})();
