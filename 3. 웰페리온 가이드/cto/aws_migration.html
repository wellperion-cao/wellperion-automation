*{box-sizing:border-box;margin:0;padding:0}

.header{background:linear-gradient(180deg,#2f2b28 0%,#272422 100%);padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.header .sub{font-size:12px;color:var(--dim-mid);}
.badge{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border);}

.stat{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:14px 20px;min-width:180px;flex:1;}
.stat .lb{font-size:11.5px;color:var(--dim-mid);font-weight:600;margin-bottom:6px;}
.stat .vl{font-size:26px;font-weight:800;color:var(--accent-bright);}

.card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px;}
.card-title{font-size:14px;font-weight:700;color:var(--accent-bright);margin-bottom:8px;display:flex;align-items:baseline;gap:8px;}
.card-title .stag{font-size:11.5px;font-weight:400;color:var(--dim-mid);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--paper-raised);color:var(--dim-mid);font-weight:600;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:6px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:top;}
tr:last-child td{border-bottom:none;}
td.area{white-space:nowrap;font-weight:700;}

.st{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:9px;border:1px solid;white-space:nowrap;}
.st-mirror{color:var(--dim-mid);background:var(--paper-raised);border-color:var(--border);}
.st-origin{color:var(--navy);background:var(--navy-bg);border-color:var(--navy-border);}
.st-shrink{color:var(--green);background:var(--green-bg);border-color:var(--green-border);}
.st-delete{color:var(--dim);background:var(--paper-raised);border-color:var(--border-subtle);}
.st-none{color:var(--dim);font-size:12px;}

.foot{font-size:12px;color:var(--dim-mid);padding:10px 0 20px;}
.err{color:var(--red);font-size:13px;padding:10px 0;}

@media (max-width:640px){

  .stats{gap:8px;}
  .stat{min-width:0;padding:10px 12px;}
  .stat .vl{font-size:20px;}
  table{font-size:12px;}
}
@page{size:A3 landscape;margin:10mm;}

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var STAGE_CLASS = { '거울':'st-mirror', '원천 전환':'st-origin', '시트 축소':'st-shrink', 'GAS 삭제':'st-delete' };
function stageBadge(stage){
  if(!stage) return '<span class="st-none">—</span>';
  var cls = STAGE_CLASS[stage] || 'st-mirror';
  return '<span class="st ' + cls + '">' + esc(stage) + '</span>';
}

function render(d){
  document.getElementById('subline').textContent = '정본 = status/aws_migration.json · 갱신 ' + (d.updated_at_kst || d.updated_at || '');
  var s = d.summary || {};
  document.getElementById('statProgress').textContent = (s.progress_pct != null ? s.progress_pct + '%' : '—');
  document.getElementById('statOrigin').textContent = s.origin_switched || '—';
  document.getElementById('statNext').textContent = s.next || '—';

  var rows = d.rows || [];
  var body = document.getElementById('rowsBody');
  if(!rows.length){ body.innerHTML = '<tr><td colspan="8" class="dim">등록된 영역이 없습니다.</td></tr>'; return; }
  body.innerHTML = rows.map(function(r){
    return '<tr>' +
      '<td class="area">' + esc(r.area) + '</td>' +
      '<td>' + esc(r.who_uses) + '</td>' +
      '<td>' + stageBadge(r.stage) + '</td>' +
      '<td>' + esc(r.switch_date) + '</td>' +
      '<td>' + esc(r.owner) + '</td>' +
      '<td>' + esc(r.staff_change) + '</td>' +
      '<td>' + esc(r.note) + '</td>' +
      '<td class="dim">' + esc(r.updated) + '</td>' +
    '</tr>';
  }).join('');
}

function fail(msg){
  document.getElementById('subline').textContent = msg;
  document.getElementById('rowsBody').innerHTML = '<tr><td colspan="8" class="err">원천을 못 읽음</td></tr>';
}

function loadSeed(){
  try{
    var el = document.getElementById('seed');
    var txt = el && el.textContent.trim();
    if(!txt) return null;
    return JSON.parse(txt);
  }catch(e){ return null; }
}

fetch('../../status/aws_migration.json?cb=' + Date.now(), {cache:'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
  .then(render)
  .catch(function(){
    var seed = loadSeed();
    if(seed){ render(seed); }
    else { fail('원천을 못 읽음'); }
  });
</script>
