<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><link rel="icon" type="image/png" href="/wellperion-automation/wellperion_favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>리셉션 업무 | AI COO</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F4EEE6; --paper:#FFFFFF; --paper2:#FBF7F1; --ink:#221F20; --ink2:#4A443E;
  --muted:#8C8073; --beige:#B79F8A; --beige-deep:#9A7F64; --line:#E7DCCE; --line2:#D8C9B6;
  --orange:#ED5B3F; --green:#337342;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 520px at 88% -8%, rgba(183,159,138,.18), transparent 60%),
    radial-gradient(800px 420px at -8% 4%, rgba(237,91,63,.05), transparent 55%), var(--bg);
  color:var(--ink);
  font-family:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.6;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 26px}
.letterhead{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px;border-bottom:1.5px solid var(--ink)}
.brand{display:flex;align-items:center;gap:14px}
.brand .mark{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:9px;display:grid;place-items:center;font-weight:800;color:var(--ink);font-size:20px;background:linear-gradient(160deg,rgba(183,159,138,.22),transparent)}
.brand .wm{font-weight:800;letter-spacing:.34em;font-size:15px;color:var(--ink)}
.brand .wm small{display:block;letter-spacing:.2em;font-size:10px;color:var(--beige-deep);font-weight:700;margin-top:4px}
.letterhead .meta{text-align:right;font-size:11.5px;color:var(--muted);letter-spacing:.04em;line-height:1.7}
.letterhead .meta a{color:var(--beige-deep);text-decoration:none;font-weight:600}
.letterhead .meta a:hover{color:var(--orange)}
.hero{padding:40px 0 10px}
.pill{display:inline-block;font-size:11px;letter-spacing:.24em;color:var(--orange);border:1px solid rgba(237,91,63,.45);border-radius:999px;padding:6px 14px;font-weight:700;text-transform:uppercase}
.hero h1{font-weight:800;color:var(--ink);font-size:30px;line-height:1.34;margin:18px 0 10px;letter-spacing:-.01em}
.hero p{color:var(--ink2);font-size:14.5px;line-height:1.75;margin:0;max-width:720px}
.sect{font-size:12px;letter-spacing:.14em;color:var(--beige-deep);font-weight:700;text-transform:uppercase;margin:34px 0 16px;display:flex;align-items:center;gap:12px}
.sect:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px 24px 22px;box-shadow:0 4px 20px rgba(154,127,100,.06);transition:.18s;position:relative}
.card:hover{border-color:var(--beige);transform:translateY(-2px);box-shadow:0 10px 30px rgba(154,127,100,.14)}
.card .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:linear-gradient(160deg,rgba(183,159,138,.2),rgba(183,159,138,.05));border:1px solid var(--line);margin-bottom:16px}
.card h3{margin:0 0 7px;font-size:18px;font-weight:800;color:var(--ink)}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.card .go{margin-top:16px;font-size:12.5px;font-weight:700;color:var(--beige-deep)}
.card:hover .go{color:var(--orange)}
.badge{position:absolute;top:22px;right:22px;font-size:10.5px;font-weight:700;color:var(--green);background:rgba(51,115,66,.1);border:1px solid rgba(51,115,66,.28);border-radius:999px;padding:4px 10px}
.card.soon{opacity:.6;cursor:default;pointer-events:none}
.card.soon .badge{color:var(--muted);background:rgba(140,128,115,.1);border-color:var(--line2)}
.foot{border-top:1.5px solid var(--ink);margin-top:50px;padding:22px 0 50px;color:var(--muted);font-size:11.5px;letter-spacing:.03em;text-align:center;line-height:1.8}
.foot b{color:var(--beige-deep);font-weight:700}
</style></head><body>
<div class="wrap">
  <div class="letterhead">
    <div class="brand"><div class="mark">W</div>
      <div class="wm">WELPERION<small>리셉션 업무</small></div></div>
    <div class="meta">AI COO &nbsp;›&nbsp; 리셉션 업무<br><a href="https://wellperion-cao.github.io/wellperion-automation/wellperion_guide(main).html" target="_blank">← ERP 메인</a></div>
  </div>
  <div class="hero">
    <span class="pill">RECEPTION OPS</span>
    <h1>리셉션 업무</h1>
    <p>리셉션에서 관리하는 업무 영역입니다. 아래에서 관리할 항목을 선택하세요.</p>
  </div>
  <div class="sect">업무 항목</div>
  <div class="grid">
    <a class="card" href="라커관리/">
      <span class="badge">● 운영중</span>
      <div class="ico">🔐</div>
      <h3>라커관리</h3>
      <p>남자 · 여자 · 골프 라커 운영 현황. 전체 회원 명단 · 만기 · 공실 · 회수 관리 대시보드.</p>
      <div class="go">열기 →</div>
    </a>
    <div class="card soon">
      <span class="badge">준비중</span>
      <div class="ico">🗂️</div>
      <h3>추가 예정</h3>
      <p>리셉션 업무 항목이 추후 이곳에 순차적으로 추가됩니다.</p>
    </div>
  </div>
  <div class="foot">웰페리온 (WELPERION) · AI COO &nbsp;<b>리셉션 업무</b><br>내부 운영용</div>
</div>
</body></html>
