<!-- 강사 페이롤(강습부) — 파트너팀 체계 ▸ 💰 페이롤 탭에 iframe(?embed=1) 으로 열리는 별도 화면. 정본 = 강사페이롤_DB 시트(cfo) + 바인딩 GAS 웹앱(.deploy-payroll/Code.gs).
     원천 = 브로제이 API(결제 → 등록, 예약·출석 → 세션) · 규칙 = 강사별 설정표 · 강사 스프레드시트는 관리부 증빙용 사본. 비밀번호는 런타임 입력(sessionStorage)·localStorage 캐시 없음(급여 PII).
     CFO 2026-09-17 · 매니저 지시 「모든 페이롤 변수를 담는 페이롤을 ERP 강습부 체계 안에」 -->
<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>💰 강사 페이롤 · 웰페리온</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>💰</text></svg>">
<link rel="stylesheet" href="../../assets/wp-ui.css">
<style>
:root{--bg:#221F20;--paper:#2a2725;--text:#f5f2ef;--dim:#8c8b83;--accent:#B79F8A;--accent-bg:rgba(183,159,138,.12);--border:#3d3835;--green:#6abf7b;--green-bg:rgba(106,191,123,.12);--red:#ED5B3F;--red-bg:rgba(237,91,63,.12);--yellow:#e6c84e;--yellow-bg:rgba(230,200,78,.12);--blue:#5b9fd5;--blue-bg:rgba(91,159,213,.12)}
@media print{:root{--bg:#fff;--paper:#fff;--text:#111;--dim:#555;--border:#bbb;--accent:#7a5c3e;--accent-bg:#f3ede6}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:14px;line-height:1.55}
.wrap{padding:14px 16px 60px;max-width:1500px;margin:0 auto}
.hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}.hd h1{font-size:19px;margin:0;font-weight:800}.hd .sub{color:var(--dim);font-size:12.5px}
body.embed .hd-top{display:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.chip{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:20px;padding:4px 11px;font-size:12.5px;cursor:pointer}.chip.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:700}
select,input[type=text],input[type=number],input[type=password],textarea{background:#1c1a19;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit}
.btn{border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#1a1a1a}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn:disabled{opacity:.5;cursor:default}
.mono{font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px 12px}.card .label{color:var(--dim);font-size:11.5px}.card .num{font-size:20px;font-weight:800;margin-top:2px}.card .sub{color:var(--dim);font-size:11px}
.card.g .num{color:var(--green)}.card.r .num{color:var(--red)}.card.y .num{color:var(--yellow)}.card.b .num{color:var(--blue)}
.sec{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:10px 0}.sectit{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;margin-bottom:8px}.sectit .cnt{color:var(--dim);font-weight:500;font-size:12px}.sectit .sp{flex:1}
.tw{overflow:auto;max-width:100%}table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border-bottom:1px solid var(--border);padding:5px 7px;text-align:right;white-space:nowrap}th{color:var(--dim);font-weight:600;text-align:right;position:sticky;top:0;background:var(--paper)}th.l,td.l{text-align:left}th.c,td.c{text-align:center}
tr.warn td{background:var(--yellow-bg)}tr.bad td{background:var(--red-bg)}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}.tag.show{background:var(--green-bg);color:var(--green)}.tag.noshow{background:var(--red-bg);color:var(--red)}.tag.wait{background:var(--yellow-bg);color:var(--yellow)}.tag.api{background:var(--blue-bg);color:var(--blue)}.tag.ovr{background:var(--accent-bg);color:var(--accent)}
.callout{border:1px solid var(--red);background:var(--red-bg);color:var(--text);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:13px;display:none}
.notice{color:var(--dim);font-size:12px;margin:6px 0}
.gate{max-width:420px;margin:60px auto;background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:22px}.gate h2{margin:0 0 8px;font-size:17px}.gate p{color:var(--dim);font-size:12.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;z-index:9;display:none}
.small{font-size:11.5px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.flag{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid var(--border);padding:5px 0;font-size:12.5px}.flag .t{flex:0 0 auto;background:var(--yellow-bg);color:var(--yellow);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.cfg-table td input{width:100%;min-width:60px}
@media print{.bar,.btn,.noprint{display:none !important}.sec{break-inside:avoid;border:none}body{font-size:11px}th,td{padding:2px 5px}}
</style></head><body>
<div class="wrap">
  <div class="hd hd-top"><h1>💰 강사 페이롤</h1><span class="sub">브로제이 결제·출석 → ERP 자동 집계 · 정본 = 페이롤 DB · 강사 시트는 증빙 사본</span><span style="flex:1"></span><a href="파트너팀 체계.html" style="color:var(--accent);font-size:12.5px">← 파트너팀 체계</a></div>
  <div id="gate" class="gate"><h2>🔒 페이롤 조회</h2><p>급여 정보입니다. 조회 비밀번호를 입력하세요. (브라우저 세션 동안만 기억, 저장하지 않음)</p><input type="password" id="gatePw" placeholder="조회 비밀번호" style="width:100%;margin:6px 0 10px"><button class="btn" id="gateBtn">열기</button><div id="gateErr" class="small" style="color:var(--red);margin-top:6px"></div></div>
  <div id="app" style="display:none">
    <div class="bar">
      <span class="small">팀</span><span id="teamChips"></span>
      <span class="small" style="margin-left:6px">강사</span><select id="selInstr"><option value="">전체(팀 요약)</option></select>
      <span class="small" style="margin-left:6px">월</span><button class="chip" id="mPrev">◀</button><b id="mLabel" class="mono">2026-09</b><button class="chip" id="mNext">▶</button>
      <span style="flex:1"></span>
      <button class="btn ghost" id="btnRefresh">↻ 새로고침</button>
      <button class="btn blue" id="btnSync" title="브로제이 API에서 이 강사·월을 지금 수집(관리 비밀번호)">⟳ 지금 수집</button>
      <button class="btn ghost" id="btnEvidence" title="강사 원본 시트 형식 사본을 만들어 관리부 증빙 링크 생성(관리 비밀번호)">🧾 증빙 사본</button>
      <button class="btn ghost" id="btnConfig">⚙ 설정표</button>
      <button class="btn ghost" id="btnClose" title="이 강사·월 마감(수집 중단)">🔒 마감</button>
      <button class="btn ghost noprint" id="btnPrint">🖨 인쇄</button>
    </div>
    <div id="status" class="notice"></div>
    <div id="err" class="callout"></div>
    <div id="viewTeam"></div>
    <div id="viewInstr"></div>
    <div id="viewConfig" style="display:none"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
/* ★ 배포 후 /exec URL 로 교체(.deploy-payroll README). 비밀번호는 여기 두지 않는다. */
var PAYROLL_API="https://script.google.com/macros/s/AKfycbzmyC4CMmpzFGQjaXdc4O-DDNvztUgH_elP2qEZdqZIOUqqYa_rROk6_GQr4ZRp7vEJ/exec";   // cao 계정 「강사페이롤 백엔드(ERP)」 웹앱 v1(2026-09-17 배포)
var TEAMS=["전체","PT","수영","골프","스쿼시","필라테스","체조","루프","GX"];   // 설정_강사.팀 값과 동일(시트목록 8팀)
var st={team:"전체",instr:"",month:"",pw:"",cfg:null,data:null,teamData:null};
var EMBED=/[?&]embed=1/.test(location.search); if(EMBED)document.body.classList.add("embed");
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function won(n){n=Math.round(+n||0);return n.toLocaleString("ko-KR")+"원";}
function num(n){return Math.round(+n||0).toLocaleString("ko-KR");}
function toast(m,bad){var t=$("toast");t.textContent=m;t.style.display="block";t.style.borderColor=bad?"var(--red)":"var(--border)";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none";},bad?5000:2600);}
function ym0(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);}
function ymAdd(ym,k){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;var d=new Date(y,m,1);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2);}
async function api(body){
  body=Object.assign({password:st.pw},body);
  var r=await fetch(PAYROLL_API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("HTTP "+r.status);
  var j=await r.json();
  if(j&&j.ok===false&&/unauthorized$/.test(j.error||"")){sessionStorage.removeItem("wp_payroll_pw");st.pw="";$("app").style.display="none";$("gate").style.display="block";$("gateErr").textContent="비밀번호가 올바르지 않습니다.";throw new Error("unauthorized");}
  return j;
}
function adminPw(){var p=prompt("관리 비밀번호를 입력하세요(수집·보정·설정·증빙·마감)");return p===null?null:String(p).trim();}
function showErr(m){var e=$("err");e.style.display=m?"block":"none";e.innerHTML=m?("⚠️ "+esc(m)+' <button class="btn ghost" onclick="load()" style="margin-left:8px">다시 시도</button>'):"";}
/* ── 관문 ── */
$("gateBtn").onclick=async function(){var pw=$("gatePw").value.trim();if(!pw)return;st.pw=pw;try{var j=await api({action:"payroll_config_get"});if(!j.ok)throw new Error(j.error||"실패");sessionStorage.setItem("wp_payroll_pw",pw);st.cfg=j.config;$("gate").style.display="none";$("app").style.display="block";boot();}catch(e){$("gateErr").textContent=e.message==="unauthorized"?"비밀번호가 올바르지 않습니다.":("연결 실패: "+e.message);}};
$("gatePw").onkeydown=function(e){if(e.key==="Enter")$("gateBtn").click();};
(async function(){var pw=sessionStorage.getItem("wp_payroll_pw");if(pw){$("gatePw").value=pw;$("gateBtn").click();}})();
/* ── 부팅 ── */
function boot(){
  st.month=sessionStorage.getItem("wp_payroll_month")||ym0(); st.team=sessionStorage.getItem("wp_payroll_team")||"전체"; st.instr=sessionStorage.getItem("wp_payroll_instr")||"";
  renderChips(); renderInstrSelect(); $("mLabel").textContent=st.month; load();
}
function renderChips(){$("teamChips").innerHTML=TEAMS.map(function(t){return '<button class="chip'+(st.team===t?" on":"")+'" data-t="'+t+'">'+t+'</button>';}).join("");
  $("teamChips").querySelectorAll(".chip").forEach(function(b){b.onclick=function(){st.team=b.dataset.t;sessionStorage.setItem("wp_payroll_team",st.team);st.instr="";renderChips();renderInstrSelect();load();};});}
function instrList(){return (st.cfg.instructors||[]).filter(function(i){return String(i["활성"]).toUpperCase()==="Y"&&(st.team==="전체"||i["팀"]===st.team);});}
function renderInstrSelect(){var s=$("selInstr");s.innerHTML='<option value="">전체(팀 요약)</option>'+instrList().map(function(i){return '<option value="'+esc(i["강사명"])+'"'+(st.instr===i["강사명"]?" selected":"")+'>'+esc(i["팀"]+" · "+i["강사명"]+(i["직급"]?" "+i["직급"]:""))+'</option>';}).join("");}
$("selInstr").onchange=function(){st.instr=this.value;sessionStorage.setItem("wp_payroll_instr",st.instr);load();};
$("mPrev").onclick=function(){st.month=ymAdd(st.month,-1);sessionStorage.setItem("wp_payroll_month",st.month);$("mLabel").textContent=st.month;load();};
$("mNext").onclick=function(){if(st.month>=ym0())return;st.month=ymAdd(st.month,1);sessionStorage.setItem("wp_payroll_month",st.month);$("mLabel").textContent=st.month;load();};
$("btnRefresh").onclick=load; $("btnPrint").onclick=function(){window.print();};
$("btnConfig").onclick=function(){var v=$("viewConfig");if(v.style.display==="none"){renderConfig();v.style.display="block";$("viewInstr").style.display="none";$("viewTeam").style.display="none";}else{v.style.display="none";$("viewInstr").style.display="";$("viewTeam").style.display="";}};
$("btnSync").onclick=async function(){var ap=adminPw();if(ap===null)return;var b=this;b.disabled=true;b.textContent="⟳ 수집 중…";try{
  var j=await api(st.instr?{action:"payroll_run_sync",adminPassword:ap,month:st.month,instructor:st.instr}:{action:"payroll_run_sync",adminPassword:ap,month:st.month,scope:"team",team:st.team});
  if(!j.ok)throw new Error(j.error||"실패");
  toast(j.queued?"팀 전체 수집을 뒤에서 시작했습니다 — 잠시 후 새로고침":("수집 완료 · 등록 "+j.regs.total+" · 세션 "+j.sessions.total+" · 호출 "+j.calls+"회 · "+j.secs+"s"));await load();
 }catch(e){toast("수집 실패: "+e.message,true);}finally{b.disabled=false;b.textContent="⟳ 지금 수집";}};
$("btnEvidence").onclick=async function(){if(!st.instr){toast("강사를 선택하세요",true);return;}var ap=adminPw();if(ap===null)return;var by=prompt("생성자 이름")||"";var b=this;b.disabled=true;try{
  var j=await api({action:"payroll_evidence_create",adminPassword:ap,month:st.month,instructor:st.instr,by:by});if(!j.ok)throw new Error(j.error||"실패");
  toast("증빙 사본 생성됨");window.open(j.url,"_blank");await load();}catch(e){toast("증빙 실패: "+e.message,true);}finally{b.disabled=false;}};
$("btnClose").onclick=async function(){if(!st.instr){toast("강사를 선택하세요",true);return;}var closed=st.data&&st.data.closed;if(!confirm((closed?"마감을 해제":"이 강사·월을 마감")+"할까요? "+st.month+" · "+st.instr))return;var ap=adminPw();if(ap===null)return;try{var j=await api({action:"payroll_close",adminPassword:ap,month:st.month,instructor:st.instr,reopen:!!closed});if(!j.ok)throw new Error(j.error);toast(closed?"마감 해제":"마감 처리");await load();}catch(e){toast("실패: "+e.message,true);}};
/* ── 로드 ── */
var _seq=0;
async function load(){
  var seq=++_seq; showErr(""); $("status").textContent="불러오는 중…";
  try{
    if(st.instr){var j=await api({action:"payroll_list",month:st.month,instructor:st.instr});if(seq!==_seq)return;if(!j.ok)throw new Error(j.error||"실패");st.data=j;$("viewTeam").innerHTML="";renderInstr(j);}
    else{var t=await api({action:"payroll_team",month:st.month,team:st.team});if(seq!==_seq)return;if(!t.ok)throw new Error(t.error||"실패");st.teamData=t;$("viewInstr").innerHTML="";renderTeam(t);}
    $("btnClose").textContent=(st.data&&st.instr&&st.data.closed)?"🔓 마감 해제":"🔒 마감";
  }catch(e){if(e.message!=="unauthorized")showErr("불러오지 못했습니다: "+e.message);$("status").textContent="";}
}
/* ── 강사 화면 ── */
function renderInstr(d){
  var s=d.summary,c=d.config;
  $("status").innerHTML="데이터 기준: <b>"+esc(d.syncedAt||"수집 기록 없음")+"</b> · 출처 브로제이 API · 강사 설정 지급율 "+(Math.round((+c["지급율"]||0)*100))+"% · 청구방식 "+esc(s.청구방식)+(d.closed?' · <span class="tag noshow">마감</span>':' · <span class="tag show">진행</span>')+(d.flags.length?' · <span class="tag wait">플래그 '+d.flags.length+'</span>':'');
  var cards=[["청구금액(지급 대상)",won(s.청구합),s.청구방식==="100회"?"ΣQ÷진행×100":"Σ 청구(N×O)","g"],["급여 지급 총액",won(s.지급총액),"업무추진비 "+num(s.업무추진비)+" + 청구 + 팀인센티브 "+num(s.팀인센티브)+" − 수수료 "+num(s.카드수수료)+" − 주차 "+num(s.주차비),"b"],["월 진행 세션",num(s.진행),"잔여 "+num(s.잔여),""],["당월 소진 매출",won(s.소진),"미소진 "+won(s.미소진),""],["당월 매출(등록 기준)",won(s.당월매출),"이달 등록 결제 합",""],["스케줄러 합계",won(s.스케줄러합계),"9월S 수업료×지급율 대조",Math.abs(s.스케줄러합계-s.청구합)>1?"y":""],["프로모션",num(s.프로모션수)+"회","강습료 "+won(s.프로모션강습료),""]];
  var h='<div class="statgrid">'+cards.map(function(k){return '<div class="card '+k[3]+'"><div class="label">'+k[0]+'</div><div class="num mono">'+k[1]+'</div><div class="sub">'+k[2]+'</div></div>';}).join("")+'</div>';
  if(d.flags.length)h+='<div class="sec"><div class="sectit">⚠ 확인 필요 <span class="cnt">'+d.flags.length+'건</span></div>'+d.flags.map(function(f){return '<div class="flag"><span class="t">'+esc(f.유형)+'</span><span>'+esc(f.내용)+'</span></div>';}).join("")+'</div>';

async function overrideDialog(){
  var d=st.data; if(!d)return;
  var target=prompt("보정 대상: 등록 / 월합계","등록"); if(target===null)return; target=target.trim();
  var key="",field="",value="",reason="";
  if(target==="등록"){var name=prompt("회원명(등록 목록의 이름)");if(name===null)return;var r=d.regs.filter(function(x){return x.회원명===name.trim();})[0];if(!r){toast("등록 목록에 없는 회원",true);return;}key=r.key;
    field=prompt("항목: 진행 / 월초잔여 / 결제금액 / 회원구분 / 등록회수 / 특이사항","진행");if(field===null)return;field=field.trim();}
  else if(target==="월합계"){field=prompt("항목: 팀매출(원) 등","팀매출");if(field===null)return;field=field.trim();}
  else{toast("대상은 등록 또는 월합계",true);return;}
  value=prompt("값");if(value===null)return; reason=prompt("사유(필수)")||""; if(!reason.trim()){toast("사유가 필요합니다",true);return;}
  var by=prompt("입력자 이름")||""; var ap=adminPw(); if(ap===null)return;
  try{var j=await api({action:"payroll_override_set",adminPassword:ap,month:st.month,instructor:st.instr,target:target,key:key,field:field,value:value,reason:reason,by:by});if(!j.ok)throw new Error(j.error);toast("보정 저장");await load();}catch(e){toast("실패: "+e.message,true);}
}

function renderConfig(){

  Object.keys(CFG_TABLES).forEach(function(tn){var cols=CFG_TABLES[tn],rows=c[CFG_KEYS[tn]]||[];
    h+='<div class="sec"><div class="sectit">⚙ '+tn+' <span class="cnt">'+rows.length+'행</span><span class="sp"></span><button class="btn ghost cfgAdd" data-t="'+tn+'">+ 행</button><button class="btn cfgSave" data-t="'+tn+'">저장</button></div><div class="tw"><table class="cfg-table" id="cfg-'+tn+'"><thead><tr>'+cols.map(function(k){return '<th class="l">'+esc(k)+'</th>';}).join("")+'</tr></thead><tbody>';

  document.querySelectorAll(".cfgSave").forEach(function(b){b.onclick=async function(){var tn=b.dataset.t,rows=[];$("cfg-"+tn).querySelectorAll("tbody tr").forEach(function(tr){var o={},any=false;tr.querySelectorAll("input").forEach(function(i){o[i.dataset.k]=i.value.trim();if(i.value.trim())any=true;});if(any)rows.push(o);});
