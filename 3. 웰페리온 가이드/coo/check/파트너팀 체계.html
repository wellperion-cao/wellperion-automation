<!DOCTYPE html>
<html lang="ko">
<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 파트너팀 체계</title>
<style>
:root{--bg:#221F20;--paper:#2a2725;--text:#f5f2ef;--dim:#8c8b83;--accent:#B79F8A;--accent-bg:rgba(183,159,138,0.12);--border:#3d3835;--green:#6abf7b;--green-bg:rgba(106,191,123,0.12);--red:#ED5B3F;--red-bg:rgba(237,91,63,0.12);--yellow:#e6c84e;--yellow-bg:rgba(230,200,78,0.12);--blue:#5b9fd5;--blue-bg:rgba(91,159,213,0.12);--purple:#a78bda;--purple-bg:rgba(167,139,218,0.12);--orange:#e6944e;--orange-bg:rgba(230,148,78,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh;overflow-x:hidden}
.sticky-top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);}
.header{background:var(--paper);padding:10px 20px}
.header-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.header h1{font-size:17px;font-weight:700;margin:0}
.header .sub{font-size:12px;color:var(--dim);margin-top:2px}
.sheet-links{display:flex;gap:6px;margin-left:auto}
.sheet-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(183,159,138,0.3);text-decoration:none;white-space:nowrap;cursor:pointer;transition:background 0.15s}
.sheet-link:hover{background:rgba(183,159,138,0.22)}
.sheet-link svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
.day-type{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;margin-left:8px}
.day-type.weekday{background:var(--blue-bg);color:var(--blue)}
.day-type.weekend{background:var(--accent-bg);color:var(--accent)}
.day-type.closed{background:var(--red-bg);color:var(--red)}
.mode-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px;background:var(--green-bg);color:var(--green)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:8px 20px;z-index:9;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;font-size:14px;font-weight:600;color:var(--dim);background:none;border:none;border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.tab.active{background:var(--accent-bg);color:var(--accent)}
.content{padding:16px 20px 140px;max-width:720px;margin:0 auto}
.date-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.date-bar input{background:var(--paper);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:15px;font-family:inherit}
.btn{padding:8px 14px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.submitter-bar{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.submitter-bar label{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.submitter-bar select{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:15px;font-family:inherit;font-weight:600}
.guide-cards{display:flex;gap:10px;margin-bottom:12px}
.guide-card{flex:1;border-radius:10px;padding:12px 14px;border:1px solid}
.guide-card.issue-guide{background:var(--red-bg);border-color:rgba(237,91,63,0.3)}
.guide-card.tip-guide{background:var(--purple-bg);border-color:rgba(167,139,218,0.3)}
.guide-card .guide-title{font-size:14px;font-weight:700;margin-bottom:4px}
.guide-card.issue-guide .guide-title{color:var(--red)}
.guide-card.tip-guide .guide-title{color:var(--purple)}
.guide-card .guide-desc{font-size:12px;color:var(--dim);line-height:1.4}
.shift-divider{background:var(--paper);border:1px solid var(--accent);border-radius:12px;padding:14px 18px;margin:20px 0 12px;position:relative}
.shift-divider:first-of-type{margin-top:0}
.shift-divider.night-shift{border-color:var(--orange)}
.shift-label{font-size:15px;font-weight:700;color:var(--accent)}
.shift-divider.night-shift .shift-label{color:var(--orange)}
.shift-progress{margin-top:8px}
.shift-progress .progress-text{font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
.shift-progress .progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:6px}
.shift-progress .progress-fill{height:100%;border-radius:4px;transition:width 0.3s}
.shift-submitted{font-size:12px;color:var(--green);font-weight:600;margin-top:6px}
.progress{background:var(--paper);border-radius:12px;padding:14px 18px;margin-bottom:16px;border:1px solid var(--border)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width 0.3s}
.progress-text{font-size:13px;color:var(--dim);display:flex;justify-content:space-between}
.time-slot{margin-bottom:16px}
.slot-header{font-size:13px;font-weight:700;color:var(--accent);padding:8px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.slot-time{background:var(--accent-bg);padding:2px 10px;border-radius:10px;font-size:12px}
.slot-time.night{background:var(--orange-bg);color:var(--orange)}
.category{background:var(--paper);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden}
.cat-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.cat-header:hover{background:var(--accent-bg)}
.cat-title{font-size:14px;font-weight:700}
.cat-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.cat-badge.done{background:var(--green-bg);color:var(--green)}
.cat-badge.pending{background:var(--yellow-bg);color:var(--yellow)}
.cat-body{border-top:1px solid var(--border);display:none}
.cat-body.open{display:block}
.item{padding:10px 16px;border-bottom:1px solid rgba(61,56,53,0.4)}
.item:last-child{border-bottom:none}
.item-row{display:flex;align-items:flex-start;gap:10px}
.item input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
.item label{flex:1;min-width:0;word-break:break-word;cursor:pointer;font-size:14px;font-weight:600}
.item.checked label{color:var(--dim);text-decoration:line-through}
.item-detail{font-size:12px;color:var(--dim);margin:4px 0 0 32px;line-height:1.5}
.item-btns{display:flex;gap:6px;flex-shrink:0}
.tiny-btn{font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;border:1px solid;font-weight:600;min-width:52px;text-align:center}
.tiny-btn.issue{background:var(--red-bg);color:var(--red);border-color:rgba(237,91,63,0.3)}
.tiny-btn.tip{background:var(--purple-bg);color:var(--purple);border-color:rgba(167,139,218,0.3)}
.extra-input{width:calc(100% - 32px);padding:8px 12px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px;font-family:inherit;margin:6px 0 0 32px;display:none}
.extra-input.show{display:block}
.extra-input.issue-field{border-color:rgba(237,91,63,0.3)}
.extra-input.tip-field{border-color:rgba(167,139,218,0.3)}
.submit-bar{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:10px;justify-content:center;z-index:10}
.submit-btn{padding:12px 24px;font-size:14px;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-family:inherit;flex:1;max-width:220px}
.submit-btn.primary{background:var(--accent);color:#fff}
.submit-btn.primary:disabled{opacity:0.4;cursor:not-allowed}
.submit-btn.night-btn{background:var(--orange);color:#fff}
.submit-btn.night-btn:disabled{opacity:0.4;cursor:not-allowed}
.submit-btn.submitted{background:var(--green-bg);color:var(--green);border:1px solid rgba(106,191,123,0.3)}
.group-submit-bar{display:flex;justify-content:flex-end;align-items:center;padding:8px 14px 4px;border-top:1px dashed var(--border);margin-top:6px}
.group-submit-btn{padding:7px 16px;font-size:12.5px;font-weight:700;border:1px solid var(--accent);background:var(--accent-bg);color:var(--accent);border-radius:8px;cursor:pointer;font-family:inherit}
.group-submit-btn:hover{background:var(--accent);color:#fff}
.group-submitted{font-size:12px;font-weight:700;color:var(--green)}
.saving{position:fixed;top:70px;right:20px;background:var(--green-bg);color:var(--green);padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;display:none;z-index:20}
.admin-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.admin-card h3{font-size:15px;font-weight:700;margin-bottom:10px}
.admin-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid rgba(61,56,53,0.3)}
.admin-row:last-child{border-bottom:none}
.admin-row .admin-row-right{text-align:right;font-size:13px}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.status-dot.green{background:var(--green)}.status-dot.yellow{background:var(--yellow)}.status-dot.red{background:var(--red)}
.tip-card{background:var(--purple-bg);border:1px solid rgba(167,139,218,0.3);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.tip-card h3{color:var(--purple);font-size:15px;font-weight:700;margin-bottom:10px}
.closed-msg{text-align:center;padding:60px 20px;color:var(--dim);font-size:16px}
.hidden{display:none}
.loading{text-align:center;padding:40px;color:var(--dim)}
/* Manual tab styles */
.manual-section{background:var(--paper);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden}
.manual-header{padding:14px 18px;cursor:pointer;user-select:none;display:flex;align-items:center;justify-content:space-between}
.manual-header:hover{background:var(--accent-bg)}
.manual-header h3{font-size:15px;font-weight:700;margin:0}
.manual-header .arrow{font-size:12px;color:var(--dim);transition:transform 0.2s}
.manual-header .arrow.open{transform:rotate(90deg)}
.manual-body{border-top:1px solid var(--border);padding:14px 18px;display:none;font-size:13px;line-height:1.8;color:var(--text)}
.manual-body.open{display:block}
.manual-body ul{margin:6px 0 6px 18px;list-style:disc}
.manual-body li{margin-bottom:4px}
.manual-body .manual-label{font-weight:700;color:var(--accent);display:block;margin-top:10px;margin-bottom:4px}
.manual-body .manual-label:first-child{margin-top:0}
.manual-body .highlight{color:var(--red);font-weight:600}
.manual-body .schedule-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px}
.manual-body .schedule-table td,.manual-body .schedule-table th{padding:6px 10px;border:1px solid var(--border);text-align:left}
.manual-body .schedule-table th{background:var(--accent-bg);color:var(--accent);font-weight:700}
.day-focus-section{background:var(--paper);border:1px solid var(--blue);border-radius:12px;padding:14px 18px;margin:12px 0}
.day-focus-section .day-focus-title{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:8px}
/* ── 요일별 트렐로 칸반 보드 (매뉴얼 탭 주 콘텐츠 · 요일 다중선택) ── */
.board-intro{font-size:12px;color:var(--dim);margin:2px 0 12px;line-height:1.5}
/* 보드 풀폭 탈출(엣지투엣지): .content(720px·중앙) 제약을 벗어나 화면 좌측 끝~우측 끝까지 꽉 채움.
   기준 = 업무 현황 SSOT.html 풀폭 방식(좌우 여백 최소 20px). 이 래퍼 안 보드에만 적용 → 다른 탭·헤더 영향 0. */
.board-fullwidth{width:100vw;max-width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);padding:0 20px;box-sizing:border-box}
/* 칸반 스크롤 컨테이너 — 켠 요일 개수만큼 컬럼이 가로로. 컬럼 많으면 가로 스크롤·스냅 */
.board-scroll{display:flex;gap:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;padding:2px 2px 16px;scrollbar-width:thin;align-items:flex-start}
.board-scroll::-webkit-scrollbar{height:8px}
.board-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.board-scroll.is-empty{display:block}
/* 트렐로 컬럼 = 요일 1개. 헤더(요일)+남/여/외곽 카드그룹 세로 */
.board-col{flex:0 0 410px;min-width:410px;max-width:410px;scroll-snap-align:start;background:var(--paper);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.board-col.is-weekend{border-color:rgba(230,148,78,0.45)}
.board-col-head{padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--bg)}
.board-col-head .bday{font-size:20px;font-weight:800}
.board-col.is-weekend .board-col-head .bday{color:var(--orange)}
.board-col-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
/* 보드 빈 상태(아무 요일도 안 켰을 때) */
.board-empty{padding:34px 18px;text-align:center;color:var(--dim);font-size:14px;line-height:1.6;background:var(--paper);border:1px dashed var(--border);border-radius:14px}

/* ── 요일 툴바 (매뉴얼 탭 상단 · 다중선택 toggle) ── */
.day-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 16px}
.day-tab{flex:1 1 0;min-width:54px;padding:11px 6px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.1;transition:all .12s}
.day-tab .dt-sub{font-size:10px;font-weight:600;opacity:.7}
.day-tab:hover{border-color:var(--accent)}
.day-tab.is-weekend{background:var(--accent-bg)}
.day-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.day-tab.active.is-weekend{background:var(--orange);border-color:var(--orange)}
.day-tab.active .dt-sub{opacity:.9}
/* 전체 선택/해제 토글 */
.day-tab.day-all{flex:0 0 auto;min-width:70px;font-size:13px;font-weight:700;border-style:dashed;color:var(--accent)}
.day-tab.day-all.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);border-style:solid}

/* ── 카드그룹(남/여/외곽) — 컬럼 안 카드리스트. 기존 dv-* 스타일 재사용(소형화) ── */
.dv-cell{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.dv-cell.male{border-left:4px solid var(--blue)}
.dv-cell.female{border-left:4px solid var(--orange)}
.dv-cell.outer{border-left:4px solid var(--green)}
.dv-cell-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.dv-cell-label{font-size:16px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.dv-cell-label.male{color:var(--blue)}
.dv-cell-label.female{color:var(--orange)}
.dv-cell-label.outer{color:var(--green)}
.dv-edit-btn{font-size:12px;font-weight:700;padding:5px 13px;border-radius:8px;cursor:pointer;font-family:inherit;
  border:1.5px solid;background:var(--accent-bg);color:var(--accent);border-color:rgba(183,159,138,0.4)}
.dv-edit-btn:hover{background:rgba(183,159,138,0.22)}
.dv-edit-btn.save{background:var(--green-bg);color:var(--green);border-color:rgba(106,191,123,0.4)}
.dv-edit-btn.cancel{background:var(--paper);color:var(--dim);border-color:rgba(140,139,131,0.4);margin-left:6px}
.dv-edit-btn.cancel:hover{background:rgba(140,139,131,0.15)}
/* 시간대 그룹 */
.dv-timeblock{margin:0 0 10px}
.dv-timeblock:last-child{margin-bottom:0}
.dv-tb-label{display:inline-block;font-size:12.5px;font-weight:800;color:var(--accent);
  background:var(--accent-bg);padding:3px 10px;border-radius:7px;margin-bottom:6px}
.dv-list{margin:0;padding-left:20px;list-style:disc;font-size:14px;line-height:1.6}
.dv-list li{margin-bottom:5px;word-break:break-word}
.dv-empty{font-size:13px;color:var(--dim);font-style:italic;padding:4px 0}
/* 2열 시간표 테이블 (boardCellBodyHTML) */
.dv-timetable{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.5;margin:0}
.dv-timetable col.dv-tt-timecol{width:38%}
.dv-timetable td{padding:5px 8px;border:1px solid var(--border);vertical-align:middle;word-break:break-word}
.dv-timetable tr:first-child td{border-top-color:var(--border)}
.dv-tt-time{color:var(--accent);font-weight:700;font-size:12px;background:var(--accent-bg);white-space:nowrap}
.dv-tt-task{color:var(--text)}
.dv-timetable tr:hover td{background:rgba(183,159,138,0.07)}
.dv-cell.male .dv-tt-time{color:var(--blue);background:var(--blue-bg)}
.dv-cell.female .dv-tt-time{color:var(--orange);background:var(--orange-bg)}
.dv-cell.outer .dv-tt-time{color:var(--green);background:var(--green-bg)}
.dv-edit{display:none;width:100%;min-height:170px;background:var(--paper);border:1.5px solid var(--accent);color:var(--text);
  border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;line-height:1.55;resize:vertical;box-sizing:border-box}
.dv-cell.editing .dv-edit{display:block}
.dv-cell.editing .dv-body{display:none}
.dv-edit-hint{font-size:12px;color:var(--dim);margin-top:7px;display:none;line-height:1.5}
.dv-cell.editing .dv-edit-hint{display:block}
/* 시간대 빠른 지정 칩 (편집 모드에서만 노출) */
.dv-ts-chips{display:none;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--dim)}
.dv-cell.editing .dv-ts-chips{display:flex}
.dv-ts-chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer;font-family:inherit;
  border:1.5px solid rgba(183,159,138,0.4);background:var(--accent-bg);color:var(--accent);transition:background .12s}
.dv-ts-chip:hover{background:rgba(183,159,138,0.22)}
/* ── 표 직접 편집 그리드 (편집 모드에서만 노출 · 행 단위 [시간 | 내용 | 삭제]) ── */
.dv-grid{display:none;margin:0}
.dv-cell.editing .dv-grid{display:block}
.dv-grid-table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.dv-grid-table col.dv-g-timecol{width:40%}
.dv-grid-table col.dv-g-delcol{width:34px}
.dv-grid-table td{border:1px solid var(--border);padding:0;vertical-align:top}
.dv-grid-th{background:var(--accent-bg);color:var(--accent);font-weight:700;font-size:11px;text-align:left;padding:5px 7px;border:1px solid var(--border)}
.dv-g-time,.dv-g-task{width:100%;background:var(--bg);border:none;color:var(--text);
  padding:8px 7px;font-size:13px;font-family:inherit;line-height:1.5;box-sizing:border-box;resize:none}
.dv-g-time:focus,.dv-g-task:focus{outline:none;background:rgba(183,159,138,0.10)}
.dv-g-task{overflow:hidden;word-break:break-word;min-height:38px;display:block}
.dv-cell.male .dv-g-time:focus{background:var(--blue-bg)}
.dv-cell.female .dv-g-time:focus{background:var(--orange-bg)}
.dv-cell.outer .dv-g-time:focus{background:var(--green-bg)}
.dv-g-del{width:100%;height:100%;min-height:38px;background:transparent;border:none;color:var(--red);
  font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;padding:4px}

  function esc(s){s=(s==null?'':''+s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function won(n){n=Math.round(n);var a=Math.abs(n);if(a>=100000000)return (n/100000000).toFixed(2).replace(/\.?0+$/,'')+'억';if(a>=10000)return Math.round(n/10000).toLocaleString()+'만';return n.toLocaleString();}
  function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c==='\r'){}else f+=c;}}if(f.length||row.length){row.push(f);rows.push(row);}return rows;}
  function bar(label,val,max,color,sub){var pct=max>0?Math.max(2,Math.round(val/max*100)):0;return '<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>'+esc(label)+'</span><span style="color:var(--dim)">'+esc(sub!=null?sub:won(val))+'</span></div><div style="background:var(--border);border-radius:6px;height:15px;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+(color||'var(--accent)')+';border-radius:6px"></div></div></div>';}
  function tbar(label,val,target,max,color){var pct=Math.min(100,Math.max(2,max>0?Math.round(val/max*100):0));var tp=Math.min(100,target>0&&max>0?Math.round(target/max*100):0);var rate=target>0?Math.round(val/target*100):0;return '<div style="margin:9px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span><b>'+esc(label)+'</b></span><span style="color:var(--dim)">'+won(val)+' / '+won(target)+' · <span style="color:'+(val>=target?'var(--green)':'var(--yellow)')+'">'+rate+'%</span></span></div><div style="background:var(--border);border-radius:6px;height:17px;position:relative;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:'+color+';border-radius:6px"></div><div style="position:absolute;top:0;height:100%;border-right:2px dashed var(--text);left:'+tp+'%"></div></div></div>';}
  function card(label,val,sub,color){return '<div class="dash-stat-card" style="background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:12px 14px"><div style="color:var(--dim);font-size:12px">'+esc(label)+'</div><div style="font-size:20px;font-weight:700;color:'+(color||'var(--text)')+';margin-top:3px">'+esc(val)+'</div>'+(sub?'<div style="color:var(--dim);font-size:11px;margin-top:2px">'+esc(sub)+'</div>':'')+'</div>';}

  function renderPeriod(){

        '<div class="grid2" style="margin-bottom:16px">'+panel('월별 추이',monthly)+panel('부서별 누적 / 목표',teamBars)+'</div>'+

      var teams=TEAMS.map(function(t){return {k:t,v:md.teams[t]||0,target:TEAM_TARGET[t]};});teams.sort(function(a,b){return (b.v/(b.target||1))-(a.v/(a.target||1));});

  window.loadSales=function(force){

      var M=parseCSV(txt);
      function find(lbl){for(var r=0;r<M.length;r++)for(var c=0;c<M[r].length;c++){if((''+M[r][c]).trim()===lbl)return[r,c];}return null;}
      var h=find('강습 매출 합계');if(!h)throw new Error('헤더 없음');
      var hr=h[0],base=h[1],monthCol=M[hr].indexOf('월');if(monthCol<0)monthCol=1;
      var tc={};TEAMS.forEach(function(t){for(var c=0;c<M[hr].length;c++){if((''+M[hr][c]).trim()===TEAM_LABEL[t]){tc[t]=c;break;}}});
      var months=[];for(var r=hr+1;r<M.length&&months.length<12;r++){var mm=(''+(M[r][monthCol]||'')).trim();if(/^\d{1,2}월$/.test(mm)){var o={label:mm,total:num(M[r][base]),teams:{}};TEAMS.forEach(function(t){o.teams[t]=tc[t]!=null?num(M[r][tc[t]]):0;});months.push(o);}else if(months.length)break;}

      if(hr<0)throw new Error('matrix');
      var colIdx={};CHECK_COLS.forEach(function(name){for(var c=0;c<M[hr].length;c++){var h=(''+M[hr][c]).trim();if(h===name||(name==='조명 및 냉난방'&&h.indexOf('조명')===0)){colIdx[name]=c;break;}}});
      var rows=[];for(var r=hr+1;r<M.length;r++){var z=(''+(M[r][zc]||'')).trim();if(!z)break;var row=[z];CHECK_COLS.forEach(function(name){var c=colIdx[name];row.push(c!=null?(''+(M[r][c]||'')).trim():'');});rows.push(row);if(z==='합계')break;}
      var ihr=-1;for(var r=0;r<M.length&&ihr<0;r++){for(var c=0;c<M[r].length;c++){if((''+M[r][c]).trim()==='이슈내용'){ihr=r;break;}}}
      var issues=[];if(ihr>=0){var jc=-1,zc2=-1,pc=-1,dc=-1;for(var c=0;c<M[ihr].length;c++){var h=(''+M[ihr][c]).trim();if(h==='이슈내용')jc=c;if(h==='업장')zc2=c;if(h==='점검자')pc=c;if(h==='날짜')dc=c;}for(var r=ihr+1;r<M.length;r++){var d=(''+(M[r][dc]||'')).trim();var iv=(''+(M[r][jc]||'')).trim();if(!d&&!iv)break;issues.push([d,(''+(M[r][zc2]||'')).trim(),(''+(M[r][pc]||'')).trim(),iv]);}}
      renderCheck({cols:['업장'].concat(CHECK_COLS),rows:rows,issues:issues},true);
    }).catch(function(e){renderCheck(CHECK_SNAP,false);});
  };

  function renderWork(){
    var arr=[];try{arr=JSON.parse(localStorage.getItem('todo_tasks')||'[]');}catch(e){}
    var hr=arr.filter(function(t){return /인사\s*&\s*파트너|인사·파트너|\[2\]/.test((t.category||'')+'');});
    var cache=hr.length>0;if(!cache)hr=SEED;
    var g={'진행중':[],'완료':[],'보류':[]};
    hr.forEach(function(t){var s=(t.status||'').trim();if(/완료/.test(s))g['완료'].push(t);else if(/보류|대기/.test(s))g['보류'].push(t);else g['진행중'].push(t);});
    document.getElementById('workStats').innerHTML=card('전체',hr.length+'건','인사 & 파트너','var(--accent)')+card('진행중',g['진행중'].length+'건','','var(--blue)')+card('완료',g['완료'].length+'건','','var(--green)')+card('보류',g['보류'].length+'건','','var(--orange)');
    var diff={'상':'var(--red)','중':'var(--yellow)','하':'var(--green)'};
    var cols=[['진행중','var(--blue)'],['완료','var(--green)'],['보류','var(--orange)']];
    document.getElementById('workBoard').innerHTML=cols.map(function(cc){var list=g[cc[0]];return '<div style="background:var(--paper);border:1px solid var(--border);border-radius:10px;overflow:hidden"><div style="padding:9px 12px;border-bottom:1px solid var(--border);font-weight:700;display:flex;justify-content:space-between"><span style="color:'+cc[1]+'">'+cc[0]+'</span><span style="color:var(--dim)">'+list.length+'</span></div><div style="padding:8px;display:flex;flex-direction:column;gap:8px">'+(list.length?list.map(function(t){var d=(''+(t.startDate||'')).slice(0,10)+(t.endDate?' ~ '+(''+t.endDate).slice(0,10):'');var lv=(t.난이도||'').trim();return '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 10px"><div style="font-weight:600;font-size:13px;line-height:1.45">'+esc(t.title||'')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center">'+(lv?'<span style="font-size:10px;border-radius:5px;padding:1px 6px;background:var(--border);color:'+(diff[lv]||'var(--dim)')+'">난이도 '+lv+'</span>':'')+'<span style="flex:1"></span><span style="font-size:10px;color:var(--dim)">'+esc(t.owner||'')+'</span></div>'+(d.replace(/[~ ]/g,'')?'<div style="font-size:10px;color:var(--dim);margin-top:4px">📅 '+esc(d)+'</div>':'')+'</div>';}).join(''):'<div style="color:var(--dim);font-size:12px;text-align:center;padding:14px">없음</div>')+'</div></div>';}).join('');
    document.getElementById('workUpdated').textContent=cache?'ERP 동기화':'기본 데이터';
  }

  loadSales(false);loadCheck(false);renderWork();
})();</script>
</body>
</html>
