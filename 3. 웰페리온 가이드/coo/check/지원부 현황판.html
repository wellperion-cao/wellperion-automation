<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
window.__PV='20260608-01';
(function(){
  window.addEventListener('pageshow',function(e){if(e.persisted)location.reload();});
  try{
    var u=new URL(location.href);
    if(u.searchParams.has('pv'))return;
    fetch(location.pathname,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      var m=t.match(/window\.__PV='([^']+)'/);
      if(m&&m[1]&&m[1]!==window.__PV){u.searchParams.set('pv',m[1]);location.replace(u.toString());}
    }).catch(function(){});
  }catch(e){}
})();
</script>
<title>웰페리온 지원부 현황판</title>
<meta property="og:type" content="website">
<meta property="og:title" content="웰페리온 지원부 현황판">
<meta property="og:description" content="지원부 일일 점검 현황 — 교대별 완료율·이슈·제출 현황 한눈에">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--bg:#221F20;--paper:#2a2725;--text:#f5f2ef;--dim:#8c8b83;--accent:#B79F8A;--accent-bg:rgba(183,159,138,0.12);--border:#3d3835;--green:#6abf7b;--green-bg:rgba(106,191,123,0.12);--red:#ED5B3F;--red-bg:rgba(237,91,63,0.12);--yellow:#e6c84e;--yellow-bg:rgba(230,200,78,0.12);--blue:#5b9fd5;--blue-bg:rgba(91,159,213,0.12);--orange:#e6944e;--orange-bg:rgba(230,148,78,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:15px;min-height:100vh}
.sticky-top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border)}
.header{background:var(--paper);padding:10px 20px}
.header-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.header h1{font-size:17px;font-weight:700;margin:0}
.header .sub{font-size:12px;color:var(--dim);margin-top:2px}
.header-links{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.hlink{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(183,159,138,0.3);text-decoration:none;white-space:nowrap;cursor:pointer;transition:background 0.15s}
.hlink:hover{background:rgba(183,159,138,0.22)}
.date-bar{padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg)}
.date-bar input[type=date]{background:var(--paper);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:14px;font-family:inherit}
.date-bar button{padding:8px 16px;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(183,159,138,0.3);border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.date-bar button:hover{background:rgba(183,159,138,0.22)}
.today-btn{padding:6px 12px;background:var(--paper);color:var(--dim);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.today-btn:hover{color:var(--text)}
.content{padding:16px 20px 60px;max-width:760px;margin:0 auto}
.loading{text-align:center;padding:40px;color:var(--dim);font-size:14px}
.error-msg{text-align:center;padding:30px 20px;color:var(--red);font-size:14px;background:var(--red-bg);border-radius:12px;border:1px solid rgba(237,91,63,0.2)}
.summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.stat-card{flex:1;min-width:100px;background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-align:center}
.stat-num{font-size:28px;font-weight:800;line-height:1.1;margin-bottom:4px}
.stat-label{font-size:12px;color:var(--dim);font-weight:600}
.section-title{font-size:13px;font-weight:700;color:var(--accent);padding:8px 0 6px;border-bottom:1px solid var(--border);margin:16px 0 10px}
.shift-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:4px}
.shift-table th{padding:8px 10px;text-align:left;background:var(--bg);font-weight:700;color:var(--dim);font-size:12px;border:1px solid var(--border)}
.shift-table td{padding:8px 10px;border:1px solid var(--border);vertical-align:middle}
.shift-table tr:hover td{background:rgba(183,159,138,0.05)}
.bar-wrap{background:var(--border);border-radius:4px;height:7px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;border-radius:4px;transition:width 0.3s}
.bar-green{background:var(--green)}
.bar-blue{background:var(--blue)}
.bar-orange{background:var(--orange)}
.bar-accent{background:var(--accent)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.chip-green{background:var(--green-bg);color:var(--green)}
.chip-dim{background:var(--border);color:var(--dim)}
.issue-list{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.issue-card{background:var(--paper);border:1px solid rgba(237,91,63,0.25);border-left:3px solid var(--red);border-radius:10px;padding:12px 14px}
.issue-who{font-size:11px;color:var(--dim);margin-bottom:4px}
.issue-name{font-size:13px;font-weight:700;color:var(--red);margin-bottom:2px}
.issue-body{font-size:13px;color:var(--text);line-height:1.5}
.no-issue{background:var(--paper);border:1px solid rgba(106,191,123,0.2);border-radius:10px;padding:14px 16px;text-align:center;color:var(--green);font-size:13px;font-weight:600}
.day-type{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;margin-left:6px}
.day-type.weekday{background:var(--blue-bg);color:var(--blue)}
.day-type.weekend{background:var(--accent-bg);color:var(--accent)}
.day-type.closed{background:var(--red-bg);color:var(--red)}
.closed-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:24px;text-align:center;color:var(--dim);font-size:14px}
.refresh-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--dim)}
.refresh-btn{padding:4px 10px;background:var(--paper);color:var(--dim);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.refresh-btn:hover{color:var(--accent);border-color:var(--accent)}
@media(max-width:500px){
  .stat-card{min-width:calc(50% - 10px)}
  .stat-num{font-size:22px}
  .shift-table{font-size:12px}
  .shift-table th,.shift-table td{padding:6px 7px}
}
</style>
</head>
<body>

<div class="sticky-top">
  <div class="header">
    <div class="header-top">
      <div>
        <h1>✅ 지원부 현황판</h1>
        <div class="sub">이경연 실장 관할 · 일일 점검 집계 · 읽기 전용</div>
      </div>
      <div class="header-links">
        <a class="hlink" href="https://wellperion-cao.github.io/wellperion-automation/coo/check/%EC%A7%80%EC%9B%90%EB%B6%80%20%EC%B2%B4%EA%B3%84.html" target="_blank">체크리스트 앱 ↗</a>
        <a class="hlink" href="https://wellperion-cao.github.io/wellperion-automation/coo/check/%EC%8B%9C%EC%84%A4%EB%B6%80%20%ED%98%84%ED%99%A9%ED%8C%90.html" target="_blank">시설부 현황판 ↗</a>
        <a class="hlink" href="https://wellperion-cao.github.io/wellperion-automation/" target="_blank">ERP 홈 ↗</a>
      </div>
    </div>
  </div>
  <div class="date-bar">
    <input type="date" id="dateInput">
    <button onclick="load()">조회</button>
    <button class="today-btn" onclick="goToday()">오늘</button>
    <span id="lastUpdated" style="font-size:11px;color:var(--dim);margin-left:auto"></span>
  </div>
</div>

<div class="content" id="view">
  <div class="loading">날짜를 선택하고 조회하세요.</div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzcOTihPYfTWQ64rbNMpfgv9p2keav0mcf7x0LrPhHm8nOUIlsqPTwCOumzE-JIcv1F/exec';
const DEPT = 'support';
const DN = ['일','월','화','수','목','금','토'];

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+(''+(d.getMonth()+1)).padStart(2,'0')+'-'+(''+(d.getDate())).padStart(2,'0');
}

function getDayInfo(ds){
  const d=new Date(ds+'T00:00:00'),dow=d.getDay(),wk=Math.ceil(d.getDate()/7);
  if(dow===0&&(wk===2||wk===4))return{type:'closed',label:'휴관일',cls:'closed'};
  if(ds.slice(5)==='01-01')return{type:'closed',label:'휴관일',cls:'closed'};
  if(dow===0||dow===6)return{type:'weekend',label:'주말',cls:'weekend'};
  return{type:'weekday',label:'평일',cls:'weekday'};
}

function escH(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pct(done,total){return total?Math.round(done/total*100):0;}

async function load(){
  const d=document.getElementById('dateInput').value;
  if(!d){alert('날짜를 선택해주세요.');return;}
  const el=document.getElementById('view');
  el.innerHTML='<div class="loading">불러오는 중...</div>';
  const info=getDayInfo(d);
  const dt=new Date(d+'T00:00:00');
  const dow=dt.getDay();
  const dayLabel=`${d} (${DN[dow]})`;

  if(info.type==='closed'){
    el.innerHTML=`<div class="closed-card"><div style="font-size:22px;margin-bottom:8px;">🚫</div><div style="font-weight:700;margin-bottom:4px;">${dayLabel}</div><div>휴관일입니다.</div></div>`;
    return;
  }

  let rows=[];
  try{
    const r=await fetch(API_URL+'?date='+d+'&dept='+encodeURIComponent(DEPT),{redirect:'follow'});
    const j=await r.json();
    rows=j.rows||[];
  }catch(e){
    el.innerHTML='<div class="error-msg">데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div>';
    return;
  }

  // STATE 조립
  const STATE={};
  rows.forEach(row=>{
    if(row.checked)STATE[row.itemId]=true;
    if(row.issue)STATE['iss_'+row.itemId]=row.issue;
    if(row.submitted_am)STATE._submitted_am=true;
    if(row.submittedAt_am)STATE._submittedAt_am=row.submittedAt_am;
    if(row.submitter_am)STATE._submitter_am=row.submitter_am;
    if(row.submitted_pm)STATE._submitted_pm=true;
    if(row.submittedAt_pm)STATE._submittedAt_pm=row.submittedAt_pm;
    if(row.submitter_pm)STATE._submitter_pm=row.submitter_pm;
    if(row.submitted_night)STATE._submitted_night=true;
    if(row.submittedAt_night)STATE._submittedAt_night=row.submittedAt_night;
    if(row.submitter_night)STATE._submitter_night=row.submitter_night;
    if(row.submitted&&!STATE._submitted_am)STATE._submitted_am=true;
    if(row.submittedAt&&!STATE._submittedAt_am)STATE._submittedAt_am=row.submittedAt;
  });

  // 교대별 집계
  const shifts={am:{done:0,total:0,issues:[],label:'오전'},pm:{done:0,total:0,issues:[],label:'오후'},night:{done:0,total:0,issues:[],label:'야간'},all:{done:0,total:0,issues:[],label:'상시'}};
  const shiftMap={am:'am',pm:'pm',night:'night',all:'all'};
  rows.forEach(row=>{
    if(!row.itemId)return;
    const s=shiftMap[row.shift]||'pm';
    if(shifts[s]){
      shifts[s].total++;
      if(row.checked)shifts[s].done++;
      if(row.issue)shifts[s].issues.push({name:row.itemName||row.itemId,body:row.issue,shift:s});
    }
  });

  // 전체 집계
  let total=0,done=0;
  const allIssues=[];
  Object.values(shifts).forEach(s=>{total+=s.total;done+=s.done;allIssues.push(...s.issues);});
  const overallPct=pct(done,total);

  let html='';

  // 헤더 정보
  html+=`<div class="refresh-bar"><span>${dayLabel} <span class="day-type ${info.cls}">${info.label}</span></span><button class="refresh-btn" onclick="load()">새로고침</button></div>`;

  // 요약 카드
  const pctColor=overallPct>=90?'var(--green)':overallPct>=60?'var(--yellow)':'var(--red)';
  html+=`<div class="summary-row">
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">총 점검 항목</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--green)">${done}</div><div class="stat-label">완료</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${total-done}</div><div class="stat-label">미완료</div></div>
    <div class="stat-card"><div class="stat-num" style="color:${pctColor}">${overallPct}%</div><div class="stat-label">완료율</div></div>
    <div class="stat-card"><div class="stat-num" style="color:var(--red)">${allIssues.length}</div><div class="stat-label">이슈</div></div>
  </div>`;

  // 교대별 현황
  html+=`<div class="section-title">교대별 현황</div>`;
  html+=`<table class="shift-table"><tr><th>교대</th><th>완료</th><th>총 항목</th><th>완료율</th><th>제출자</th><th>그래프</th></tr>`;
  const shiftRows=[
    {key:'am',label:'오전',barCls:'bar-green'},
    {key:'pm',label:'오후',barCls:'bar-blue'},
    {key:'night',label:'야간',barCls:'bar-orange'},
    {key:'all',label:'상시',barCls:'bar-accent'}
  ];
  shiftRows.forEach(sr=>{
    const s=shifts[sr.key];
    if(s.total===0)return;
    const p=pct(s.done,s.total);
    const submitted=STATE['_submitted_'+sr.key];
    const submitter=STATE['_submitter_'+sr.key]||'';
    const submittedAt=STATE['_submittedAt_'+sr.key];
    let subHtml='<span class="chip chip-dim">미제출</span>';
    if(submitted){
      const atStr=submittedAt?new Date(submittedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
      subHtml=`<span class="chip chip-green">${escH(submitter)}${atStr?' '+atStr:''}</span>`;
    }
    html+=`<tr>
      <td><strong>${sr.label}</strong></td>
      <td>${s.done}</td>
      <td>${s.total}</td>
      <td>${p}%</td>
      <td>${subHtml}</td>
      <td><div class="bar-wrap"><div class="bar-fill ${sr.barCls}" style="width:${p}%"></div></div></td>
    </tr>`;
  });
  html+=`</table>`;

  // 이슈 목록
  html+=`<div class="section-title">이슈 목록 <span style="color:var(--red);font-size:12px;">${allIssues.length}건</span></div>`;
  if(allIssues.length===0){
    html+=`<div class="no-issue">오늘 보고된 이슈가 없습니다.</div>`;
  }else{
    html+=`<div class="issue-list">`;
    allIssues.forEach(iss=>{
      html+=`<div class="issue-card">
        <div class="issue-who">${escH(shifts[iss.shift]?.label||iss.shift)}조</div>
        <div class="issue-name">${escH(iss.name)}</div>
        <div class="issue-body">${escH(iss.body)}</div>
      </div>`;
    });
    html+=`</div>`;
  }

  el.innerHTML=html;
  document.getElementById('lastUpdated').textContent='조회: '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

function goToday(){
  document.getElementById('dateInput').value=todayStr();
  load();
}

document.getElementById('dateInput').value=todayStr();
goToday();
</script>
</body>
</html>
