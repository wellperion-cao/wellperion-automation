  .broj-p1list li.done label{color:var(--dim); text-decoration:line-through;}
  .broj-progress-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .broj-progress-chip{flex:1; min-width:150px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--dc,var(--accent)); border-radius:9px; padding:8px 11px; display:flex; flex-direction:column; gap:3px;}

      {task:'space.broj 계정 권한 셋팅', main:'CFO 나우열 (권한 매트릭스)', sub:'각 담당자 (자기 계정 확인)'}

      p1: [

        {id:'broj-p1-2', text:'얼굴 인증 후 확인 버튼 간소화 여부'},
        {id:'broj-p1-3', text:'웰페리온 메인입구 자동문 작동 안 됨 (긴급)'},

      ],

  // GM 원본 항목 평면 인덱스(id → 소속 부서·그룹·원문·hot) — BROJ_DATA는 코드에 그대로 남으므로
  // "숨김" 처리해도 이 인덱스(=원본 정의)는 절대 사라지지 않는다.
  var _gmItemIndex = {};
  BROJ_DATA.depts.forEach(function(d){
    d.groups.forEach(function(g){
      g.items.forEach(function(it){
        _gmItemIndex[it.id] = {deptId: d.id, groupTitle: g.title, text: it.text, hot: !!it.hot};
      });
    });
  });

  var _brojBoard = {};        // GAS에서 받은 원본 보드(키=itemId, 값=bool(레거시) 또는 object(신규))
  var _editingItemId = null;  // 지금 인라인 편집 중인 항목(재렌더해도 편집 인풋 유지)
  var _hiddenSectionOpen = {}; // deptId → 숨김 목록 펼침 여부

  // ── 이름(작성자) — 실무진피드백.html과 동일 localStorage 키. 한 번 적으면 계속 재사용 ──
  function getStaffName(){
    try { return localStorage.getItem(STAFF_NAME_KEY) || ''; } catch(e){ return ''; }
  }
  function ensureStaffName(){
    var cur = getStaffName();
    if(cur) return cur;
    var name = '';
    try { name = prompt('이름을 입력해 주세요 (한 번 적으면 다음부터 자동으로 채워집니다)', '') || ''; } catch(e){}
    name = name.trim();
    if(name){ try { localStorage.setItem(STAFF_NAME_KEY, name); } catch(e){} }
    return name || '이름미상';
  }

  // ── 항목 상태 해석 — 레거시 bool 값과 신규 object 값을 함께 지원 ──
  function isChecked(id){
    var v = _brojBoard[id];
    if(v && typeof v === 'object') return !!v.checked;
    return !!v;
  }
  function resolveItem(itemId){
    var base = _gmItemIndex[itemId];
    var raw = _brojBoard[itemId];
    var overlay = (raw && typeof raw === 'object') ? raw : {checked: !!raw};
    if(base){
      return {
        id: itemId, origin: 'gm', deptId: base.deptId, groupTitle: base.groupTitle,
        text: (overlay.text != null && overlay.text !== '') ? overlay.text : base.text,
        hot: base.hot,
        checked: !!overlay.checked, hidden: !!overlay.hidden,
        updated_by: overlay.updated_by || '', updated_at: overlay.updated_at || ''
      };
    }
    if(raw && typeof raw === 'object' && raw.origin === 'staff'){
      return {
        id: itemId, origin: 'staff', deptId: raw.dept, groupTitle: raw.group || '🆕 현장 추가 항목',
        text: raw.text || '', hot: false,
        checked: !!raw.checked, hidden: !!raw.hidden,
        added_by: raw.added_by || '', updated_by: raw.updated_by || '', updated_at: raw.updated_at || ''
      };
    }
    return null;
  }
  function allItemIds(){
    var ids = Object.keys(_gmItemIndex);
    Object.keys(_brojBoard).forEach(function(k){ if(ids.indexOf(k) < 0) ids.push(k); });
    return ids;
  }
  function itemsForDept(deptId){
    return allItemIds().map(resolveItem).filter(function(it){ return it && it.deptId === deptId; });
  }

  // ── 저장 — 항목 단위 병합 저장. 진짜 항목단위 락은 GAS 수정 없이는 불가하므로(약속 L21: 새
  //    GAS 액션·새 저장소 신설 금지 — 기존 action=board/saveBoard 그대로 재사용), 저장 직전 최신
  //    보드를 다시 받아 그 위에 "내 항목 변경 하나"만 얹어 쓴다 — 충돌창을 세션 전체에서
  //    네트워크 왕복(수백ms)으로 좁힌다. 두 사람이 서로 다른 항목을 고쳐도 둘 다 남는다. ──
  function mutateBrojBoard(mutatorFn){
    return fetch(CHECK_GAS + '?action=board&key=' + encodeURIComponent(BROJ_STORAGE_KEY), {method:'GET', redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        var fresh = (data && data.ok && data.board && typeof data.board === 'object') ? data.board : {};
        mutatorFn(fresh);
        _brojBoard = fresh;
        return fetch(CHECK_GAS, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({action:'saveBoard', key:BROJ_STORAGE_KEY, board:fresh})});
      })
      .then(function(){ renderBrojAll(); })
      .catch(function(){ renderBrojAll(); });
  }
  function upgradeToObject(cur){
    if(cur && typeof cur === 'object') return cur;
    return {checked: !!cur};
  }

  function toggleChecked(id, checked){
    var name = ensureStaffName();
    mutateBrojBoard(function(board){
      var obj = upgradeToObject(board[id]);
      obj.checked = checked;
      obj.updated_by = name; obj.updated_at = nowStr();
      board[id] = obj;
    });
  }
  function startEditItem(id){
    _editingItemId = id;
    renderBrojAll();
    var input = document.querySelector('.broj-edit-input[data-item-id="' + id + '"]');
    if(input){ input.focus(); input.select(); }
  }
  function commitEditItem(id, newText){
    _editingItemId = null;
    newText = (newText || '').trim();
    if(!newText){ renderBrojAll(); return; }
    var name = ensureStaffName();
    mutateBrojBoard(function(board){
      var obj = upgradeToObject(board[id]);
      obj.text = newText;
      obj.updated_by = name; obj.updated_at = nowStr();
      board[id] = obj;
    });
  }
  function cancelEditItem(){
    _editingItemId = null;
    renderBrojAll();
  }
  function hideItem(id){
    if(!confirm('이 항목을 숨길까요?\n완전히 지워지지 않고 "숨김 항목"에서 다시 복원할 수 있습니다.')) return;
    var name = ensureStaffName();
    mutateBrojBoard(function(board){
      var obj = upgradeToObject(board[id]);
      obj.hidden = true;
      obj.updated_by = name; obj.updated_at = nowStr();
      board[id] = obj;
    });
  }
  function restoreItem(id){
    var name = ensureStaffName();
    mutateBrojBoard(function(board){
      var obj = upgradeToObject(board[id]);
      obj.hidden = false;
      obj.updated_by = name; obj.updated_at = nowStr();
      board[id] = obj;
    });
  }
  function addItem(deptId){
    var input = document.querySelector('.broj-add-input[data-add-dept="' + deptId + '"]');
    if(!input) return;
    var text = (input.value || '').trim();
    if(!text) return;
    var name = ensureStaffName();
    var id = 'staff-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
    mutateBrojBoard(function(board){
      board[id] = {checked:false, hidden:false, text:text, dept:deptId, group:'🆕 현장 추가 항목',
                   origin:'staff', added_by:name, updated_by:name, updated_at:nowStr()};
    });
    input.value = '';
  }
  function toggleHiddenSection(deptId){
    _hiddenSectionOpen[deptId] = !_hiddenSectionOpen[deptId];
    renderBrojDepts();
  }

  function brojDeptProgress(d){
    var items = itemsForDept(d.id).filter(function(it){ return !it.hidden; });
    var total = items.length, done = items.filter(function(it){ return it.checked; }).length;
    return {done: done, total: total};
  }
  function renderBrojP1Alert(){
    var el = document.getElementById('broj-p1-alert'); if(!el) return;
    var openCount = BROJ_DATA.brojReq.p1.filter(function(it){ return !isChecked(it.id); }).length;
    var rows = BROJ_DATA.brojReq.p1.map(function(it){
      var checked = isChecked(it.id);
      return '<li class="' + (checked ? 'done' : '') + '"><label><input type="checkbox" data-broj-id="' + it.id + '"' + (checked ? ' checked' : '') + '> ' + esc(it.text) + '</label></li>';
    }).join('');
    el.innerHTML = '<div class="broj-p1box"><div class="broj-p1head">🔴 브로제이(손영인 주임) 회신 대기 — P1 미회신 ' + openCount + '/4</div><ul class="broj-p1list">' + rows + '</ul></div>';
  }
  function renderBrojProgress(){
    var el = document.getElementById('broj-progress'); if(!el) return;
    el.innerHTML = '<div class="broj-progress-row">' + BROJ_DATA.depts.map(function(d){
      var p = brojDeptProgress(d), pct = p.total ? Math.round(p.done / p.total * 100) : 0;
      return '<div class="broj-progress-chip" style="--dc:' + d.color + '"><b>' + esc(d.label.split(' — ')[0]) + '</b><span>' + p.done + '/' + p.total + '</span><i style="width:' + pct + '%"></i></div>';
    }).join('') + '</div>';
  }
  function renderBrojRoleMap(){
    var el = document.getElementById('broj-role-map'); if(!el) return;
    el.innerHTML = '<table class="broj-role-table"><thead><tr><th style="width:15%">역할</th><th style="width:30%">담당</th><th>영역</th></tr></thead><tbody>' +
      BROJ_DATA.roleMap.map(function(r){ return '<tr><td><b>' + esc(r.role) + '</b></td><td>' + esc(r.name) + '</td><td>' + esc(r.scope) + '</td></tr>'; }).join('') +
      '</tbody></table>';
  }
  function renderItemLi(it){
    if(_editingItemId === it.id){
      return '<li class="editing" data-item-id="' + it.id + '"><input type="text" class="broj-edit-input" data-item-id="' + it.id + '" value="' + esc(it.text) + '"></li>';
    }
    var cls = (it.checked ? 'done' : '') + (it.hot ? ' hot' : '');
    var badge = it.origin === 'staff' ? '<span class="broj-badge-staff" title="현장에서 추가된 항목">🆕</span>' : '';
    var metaBits = [];
    if(it.origin === 'staff' && it.added_by) metaBits.push('추가: ' + esc(it.added_by));
    if(it.updated_by) metaBits.push('수정: ' + esc(it.updated_by) + (it.updated_at ? ' · ' + esc(it.updated_at) : ''));
    var meta = metaBits.length ? '<div class="broj-item-meta">' + metaBits.join(' · ') + '</div>' : '';
    return '<li class="' + cls + '" data-item-id="' + it.id + '">' +
      '<div class="broj-item-row">' +
        '<input type="checkbox" data-broj-id="' + it.id + '"' + (it.checked ? ' checked' : '') + '>' +
        badge +
        '<span class="broj-item-text">' + esc(it.text) + '</span>' +
        '<span class="broj-item-btns">' +
          '<button type="button" class="broj-mini-btn" data-action="edit" data-item-id="' + it.id + '" title="문구 수정">✏️</button>' +
          '<button type="button" class="broj-mini-btn" data-action="hide" data-item-id="' + it.id + '" title="숨기기(삭제 아님)">🗑</button>' +
        '</span>' +
      '</div>' + meta +
    '</li>';
  }
  function renderBrojDepts(){
    var el = document.getElementById('broj-depts'); if(!el) return;
    el.innerHTML = BROJ_DATA.depts.map(function(d){
      var p = brojDeptProgress(d);
      var staffItems = itemsForDept(d.id).filter(function(it){ return it.origin === 'staff' && !it.hidden; });
      var hiddenItems = itemsForDept(d.id).filter(function(it){ return it.hidden; });

      var groupsHtml = d.groups.map(function(g){
        var noteHtml = g.note ? '<div class="broj-group-note">' + g.note + '</div>' : '';
        var itemsHtml = g.items.map(function(baseIt){ return renderItemLi(resolveItem(baseIt.id)); }).join('');
        return '<div class="broj-group"><div class="broj-group-title">' + esc(g.title) + '</div>' + noteHtml +
          '<ul class="broj-list">' + itemsHtml + '</ul></div>';
      }).join('');

      var staffGroupHtml =
        '<div class="broj-group broj-group-staff"><div class="broj-group-title">🆕 현장 추가 항목' +
        (staffItems.length ? ' (' + staffItems.length + '건)' : '') + '</div>' +
        (staffItems.length ? '<ul class="broj-list">' + staffItems.map(renderItemLi).join('') + '</ul>' : '') +
        '<div class="broj-add-row">' +
          '<input type="text" class="broj-add-input" data-add-dept="' + d.id + '" placeholder="현장에서 생긴 새 항목을 입력하세요">' +
          '<button type="button" class="broj-add-btn" data-action="add" data-add-dept="' + d.id + '">+ 추가</button>' +
        '</div></div>';

      var hiddenHtml = '';
      if(hiddenItems.length){
        var open = !!_hiddenSectionOpen[d.id];
        hiddenHtml = '<div class="broj-hidden-block">' +
          '<button type="button" class="broj-hidden-toggle" data-action="toggle-hidden" data-dept="' + d.id + '">' +
            (open ? '▾' : '▸') + ' 숨김 항목 ' + hiddenItems.length + '건' +
          '</button>' +
          (open ? '<ul class="broj-list broj-hidden-list">' + hiddenItems.map(function(it){
            return '<li data-item-id="' + it.id + '"><span class="broj-item-text">' + esc(it.text) + '</span>' +
              '<button type="button" class="broj-mini-btn" data-action="restore" data-item-id="' + it.id + '" title="복원">↩</button></li>';
          }).join('') + '</ul>' : '') +
        '</div>';
      }

      return '<div class="broj-dept" style="--dc:' + d.color + '"><h4>' + esc(d.label) +
        ' <span class="broj-dept-sub">' + esc(d.sub) + '</span><span class="broj-dept-count">' + p.done + '/' + p.total + '</span></h4>' +
        groupsHtml + staffGroupHtml + hiddenHtml + '</div>';
    }).join('');
  }
  function renderBrojCross(){
    var el = document.getElementById('broj-cross'); if(!el) return;
    el.innerHTML = '<div class="broj-cross-title">🔷 크로스팀 협업 항목 (참고용 — 담당별 항목에 이미 포함)</div><table class="broj-role-table"><thead><tr><th>업무</th><th>주담당</th><th>부담당</th></tr></thead><tbody>' +
      BROJ_DATA.cross.map(function(r){ return '<tr><td>' + esc(r.task) + '</td><td>' + esc(r.main) + '</td><td>' + esc(r.sub) + '</td></tr>'; }).join('') +
      '</tbody></table>';
  }
  function renderBrojP2(){
    var el = document.getElementById('broj-p2'); if(!el) return;
    el.innerHTML = '<div class="broj-group-title">🟠 브로제이 요청 P2 (이번 주 회신)</div><ul class="broj-list">' +
      BROJ_DATA.brojReq.p2.map(function(it){
        var checked = isChecked(it.id);
        return '<li class="' + (checked ? 'done' : '') + '"><label><input type="checkbox" data-broj-id="' + it.id + '"' + (checked ? ' checked' : '') + '> ' + esc(it.text) + '</label></li>';
      }).join('') + '</ul>';
  }
  function renderBrojAll(){
    renderBrojP1Alert(); renderBrojProgress(); renderBrojRoleMap(); renderBrojDepts(); renderBrojCross(); renderBrojP2();
  }

  // ── 이벤트 위임(document 1곳에 1회만 바인딩) — 매 렌더마다 리스너 재부착 불필요.
  //    편집 인풋(.broj-edit-input)은 blur/Enter/Escape 시에만 커밋·취소하므로 타이핑(한글 조합) 중엔
  //    절대 재렌더하지 않는다(IME 깨짐 방지 · 기존 사고 사례와 동일 함정 회피). ──
  function bindBrojEvents(){
    document.addEventListener('change', function(e){
      var cb = e.target.closest && e.target.closest('[data-broj-id]');
      if(!cb) return;
      toggleChecked(cb.getAttribute('data-broj-id'), cb.checked);
    });
    document.addEventListener('click', function(e){
      var editBtn = e.target.closest && e.target.closest('[data-action="edit"]');
      var hideBtn = e.target.closest && e.target.closest('[data-action="hide"]');
      var restoreBtn = e.target.closest && e.target.closest('[data-action="restore"]');
      var addBtn = e.target.closest && e.target.closest('[data-action="add"]');
      var toggleHiddenBtn = e.target.closest && e.target.closest('[data-action="toggle-hidden"]');
      if(editBtn){ startEditItem(editBtn.getAttribute('data-item-id')); return; }
      if(hideBtn){ hideItem(hideBtn.getAttribute('data-item-id')); return; }
      if(restoreBtn){ restoreItem(restoreBtn.getAttribute('data-item-id')); return; }
      if(addBtn){ addItem(addBtn.getAttribute('data-add-dept')); return; }
      if(toggleHiddenBtn){ toggleHiddenSection(toggleHiddenBtn.getAttribute('data-dept')); return; }
    });
    document.addEventListener('keydown', function(e){
      if(e.target && e.target.matches && e.target.matches('.broj-add-input') && e.key === 'Enter'){
        e.preventDefault();
        addItem(e.target.getAttribute('data-add-dept'));
      } else if(e.target && e.target.matches && e.target.matches('.broj-edit-input')){
        if(e.key === 'Enter'){ e.preventDefault(); commitEditItem(e.target.getAttribute('data-item-id'), e.target.value); }
        else if(e.key === 'Escape'){ e.preventDefault(); cancelEditItem(); }
      }
    });
    // blur는 버블링하지 않으므로 캡처 단계에서 위임
    document.addEventListener('blur', function(e){
      if(e.target && e.target.matches && e.target.matches('.broj-edit-input')){
        commitEditItem(e.target.getAttribute('data-item-id'), e.target.value);
      }
    }, true);
  }

  function loadBrojBoard(){
    return fetch(CHECK_GAS + '?action=board&key=' + encodeURIComponent(BROJ_STORAGE_KEY), {method:'GET', redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.ok && data.board && typeof data.board === 'object'){ _brojBoard = data.board; }
        renderBrojAll();
      })
      .catch(function(){ renderBrojAll(); });
  }

  bindBrojEvents();
  loadBrojBoard();
})();
</script>
</body>
</html>
