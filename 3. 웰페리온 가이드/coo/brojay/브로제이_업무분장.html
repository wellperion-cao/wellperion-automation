    d.groups.forEach(function(g){ g.items.forEach(function(it){ total++; if(_brojState[it.id]) done++; }); });

      var checked = !!_brojState[it.id];
      return '<li class="' + (checked ? 'done' : '') + '"><label><input type="checkbox" data-broj-id="' + it.id + '"' + (checked ? ' checked' : '') + '> ' + esc(it.text) + '</label></li>';

  function renderBrojRoleMap(){
    var el = document.getElementById('broj-role-map'); if(!el) return;
    el.innerHTML = '<table class="broj-role-table"><thead><tr><th style="width:15%">역할</th><th style="width:30%">담당</th><th>영역</th></tr></thead><tbody>' +
      BROJ_DATA.roleMap.map(function(r){ return '<tr><td><b>' + esc(r.role) + '</b></td><td>' + esc(r.name) + '</td><td>' + esc(r.scope) + '</td></tr>'; }).join('') +
      '</tbody></table>';
  }
  function renderBrojDepts(){
    var el = document.getElementById('broj-depts'); if(!el) return;
    el.innerHTML = BROJ_DATA.depts.map(function(d){
      var p = brojDeptProgress(d);
      return '<div class="broj-dept" style="--dc:' + d.color + '"><h4>' + esc(d.label) + ' <span class="broj-dept-sub">' + esc(d.sub) + '</span><span class="broj-dept-count">' + p.done + '/' + p.total + '</span></h4>' +
        d.groups.map(function(g){
          return '<div class="broj-group"><div class="broj-group-title">' + esc(g.title) + '</div><ul class="broj-list">' +
            g.items.map(function(it){
              var checked = !!_brojState[it.id];
              return '<li class="' + (checked ? 'done' : '') + (it.hot ? ' hot' : '') + '"><label><input type="checkbox" data-broj-id="' + it.id + '"' + (checked ? ' checked' : '') + '> ' + esc(it.text) + '</label></li>';
            }).join('') + '</ul></div>';
        }).join('') + '</div>';
    }).join('');
  }
  function renderBrojCross(){
    var el = document.getElementById('broj-cross'); if(!el) return;
    el.innerHTML = '<div class="broj-cross-title">🔷 크로스팀 협업 항목 (참고용 — 담당별 항목에 이미 포함)</div><table class="broj-role-table"><thead><tr><th>업무</th><th>주담당</th><th>부담당</th></tr></thead><tbody>' +
      BROJ_DATA.cross.map(function(r){ return '<tr><td>' + esc(r.task) + '</td><td>' + esc(r.main) + '</td><td>' + esc(r.sub) + '</td></tr>'; }).join('') +
      '</tbody></table>';
  }
  function renderBrojP2(){
    var el = document.getElementById('broj-p2'); if(!el) return;
    el.innerHTML = '<div class="broj-group-title">🟠 브로제이 요청 P2 (이번 주 회신)</div><ul class="broj-list">' +
      BROJ_DATA.brojReq.p2.map(function(it){
        var checked = !!_brojState[it.id];
        return '<li class="' + (checked ? 'done' : '') + '"><label><input type="checkbox" data-broj-id="' + it.id + '"' + (checked ? ' checked' : '') + '> ' + esc(it.text) + '</label></li>';
      }).join('') + '</ul>';
  }
  function bindBrojCheckboxes(){
    var boxes = document.querySelectorAll('[data-broj-id]');
    Array.prototype.forEach.call(boxes, function(cb){
      cb.onchange = function(){
        _brojState[cb.getAttribute('data-broj-id')] = cb.checked;
        renderBrojAll();
        saveBrojBoard();
      };
    });
  }
  function renderBrojAll(){
    renderBrojP1Alert(); renderBrojProgress(); renderBrojRoleMap(); renderBrojDepts(); renderBrojCross(); renderBrojP2();
    bindBrojCheckboxes();
  }
  function loadBrojBoard(){
    return fetch(CHECK_GAS + '?action=board&key=' + encodeURIComponent(BROJ_STORAGE_KEY), {method:'GET', redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data && data.ok && data.board && typeof data.board === 'object'){ _brojState = data.board; }
        renderBrojAll();
      })
      .catch(function(){ renderBrojAll(); });
  }
  function saveBrojBoard(){
    clearTimeout(_brojSaveTimer);
    _brojSaveTimer = setTimeout(function(){
      fetch(CHECK_GAS, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'saveBoard', key:BROJ_STORAGE_KEY, board:_brojState})
      }).catch(function(){});
    }, 400);
  }

  loadBrojBoard();
})();
</script>
</body>
</html>
