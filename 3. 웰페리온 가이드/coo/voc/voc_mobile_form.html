<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><link rel="icon" type="image/png" href="/wellperion-automation/wellperion_favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>웰페리온 종합 접수처</title>
<!--
  웰페리온 회원 종합 접수처 모바일 폼 (QR + 사진) — 로그인 불필요.
  위치별 QR 의 ?loc= 파라미터로 위치 자동 프리필.
  제출 → GAS reg_submit (POST · 사진 base64 본문).
  ⚠️ GM 액션: GAS 배포 후 아래 VOC_API placeholder 를 /exec URL 로 교체.
-->
<style>
:root{--bg:#221F20;--paper:#2a2725;--text:#f5f2ef;--dim:#8c8b83;--accent:#B79F8A;--accent-bg:rgba(183,159,138,0.12);--border:#3d3835;--green:#6abf7b;--green-bg:rgba(106,191,123,0.12);--red:#ED5B3F;--blue:#5b9fd5;--orange:#e6944e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:780px;margin:0 auto;padding:28px 18px 60px}
.brand{text-align:center;margin-bottom:16px}
.brand .logo{font-size:13px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.brand h1{font-size:23px;font-weight:700;margin:8px 0 6px;letter-spacing:-0.5px}
.brand p{font-size:13.5px;color:var(--dim);line-height:1.6}
.card{background:var(--paper);border:1px solid var(--border);border-radius:16px;padding:16px 16px;margin-bottom:12px}
.field{margin-bottom:13px}
.field:last-child{margin-bottom:0}
label.fl{display:block;font-size:14px;font-weight:700;color:var(--accent);margin-bottom:9px}
label.fl .opt{font-size:12px;font-weight:500;color:var(--dim);margin-left:4px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.type-btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:11px 10px;border:1.5px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;text-align:center}
.type-btn.active{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
input[type=text],input[type=date],textarea,select{width:100%;background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:13px 14px;border-radius:12px;font-size:15px;font-family:inherit;line-height:1.5}
input[type=text]:focus,input[type=date]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=date]{color-scheme:dark}
textarea{min-height:120px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%238c8b83' d='M1 1l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.photo-zone{border:1.5px dashed var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:border-color .15s}
.photo-zone:hover{border-color:var(--accent)}
.photo-zone .ph-icon{font-size:30px;margin-bottom:6px}
.photo-zone .ph-text{font-size:14px;color:var(--dim)}
.photo-zone input[type=file]{display:none}
.preview{margin-top:12px;display:none}
.preview img{width:100%;max-height:280px;object-fit:cover;border-radius:12px;border:1px solid var(--border)}
.preview .rm{display:inline-block;margin-top:8px;font-size:13px;color:var(--red);cursor:pointer;font-weight:600}
.submit{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px}
.submit:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12.5px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.6}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--green);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:700;z-index:50;transition:transform .3s;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
.done{display:none;text-align:center;padding:40px 20px}
.done .dot{font-size:52px;margin-bottom:14px}
.done h2{font-size:22px;font-weight:700;margin-bottom:10px}
.done p{font-size:14.5px;color:var(--dim);line-height:1.7;margin-bottom:22px}
.done .again{padding:13px 26px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
.loc-chip{display:inline-block;margin-top:6px;padding:4px 12px;background:var(--accent-bg);color:var(--accent);border-radius:20px;font-size:13px;font-weight:600}
.dyn-field{margin-bottom:14px}
.dyn-field:last-child{margin-bottom:0}
.dyn-label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:7px}
.chk-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.chk-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.chk-row span{font-size:14px;color:var(--text)}
.banner-card{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:11px 10px;border:1.5px solid var(--accent);border-radius:12px;background:var(--accent-bg);cursor:default;user-select:none;text-align:center}
.social-section{text-align:center;margin-top:20px;margin-bottom:8px}
.social-section .social-title{font-size:13.5px;color:var(--dim);margin-bottom:12px;letter-spacing:-0.2px}
.social-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.social-chip{display:inline-flex;align-items:center;gap:5px;padding:9px 14px;background:var(--paper);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:13px;font-weight:600;font-family:inherit;text-decoration:none;transition:border-color .15s,color .15s}
.social-chip:hover{border-color:var(--accent);color:var(--accent)}
.banner-icon{font-size:16px;line-height:1}
.banner-main{font-size:13px;font-weight:700;color:var(--accent);line-height:1.3}
.banner-sub{font-size:11.5px;color:var(--dim);line-height:1.4}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="wrap" id="formWrap">
  <div class="brand">
    <div class="logo">WELLPERION</div>
    <h1>종합 접수처</h1>
    <p>무엇을 접수하시나요?<br>담당 부서가 신속히 확인·처리합니다.</p>
    <div class="loc-chip" id="locChip" style="display:none"></div>
  </div>
  <div class="card">
    <div class="field">
      <label class="fl">원하시는 항목을 선택해 주세요</label>
      <div class="types" id="typeGroup">
        <button type="button" class="type-btn" data-cat="clean">🧹 청결 이슈 접수</button>
        <button type="button" class="type-btn" data-cat="facility">🛠️ 시설물 고장 접수</button>
        <button type="button" class="type-btn" data-cat="lost">🔍 분실물 접수</button>
        <div class="banner-card" aria-label="안내">
          <span class="banner-icon">💬</span>
          <span class="banner-main">회원님의 말씀 귀담아 듣겠습니다</span>
        </div>
        <button type="button" class="type-btn" data-cat="praise">⭐ 직원·강사 칭찬합니다</button>
        <button type="button" class="type-btn" data-cat="voice">🗣️ 직원·강사 쓴소리합니다</button>
      </div>
    </div>
    <!-- 카테고리별 동적 필드 -->
    <div id="dynFields"></div>
    <div class="field">
      <label class="fl">위치 <span class="opt">(어디였나요?)</span></label>
      <input type="text" id="loc" placeholder="예: 2층 락커룸, 수영장, 주차장 …" autocomplete="off">
    </div>
    <div class="field">
      <label class="fl">상세 내용 <span class="opt">(선택)</span></label>
      <textarea id="content" placeholder="추가로 전하실 내용이 있으면 자유롭게 적어주세요."></textarea>
    </div>
    <div class="field">
      <label class="fl">사진 첨부 <span class="opt">(선택)</span></label>
      <label class="photo-zone" for="photo">
        <div class="ph-icon">📷</div>
        <div class="ph-text">사진을 촬영하거나 선택하세요</div>
        <input type="file" id="photo" accept="image/*" capture="environment">
      </label>
      <div class="preview" id="preview">
        <img id="previewImg" alt="첨부 사진 미리보기">
        <div><span class="rm" id="removePhoto">✕ 사진 삭제</span></div>
      </div>
    </div>
    <div class="field">
      <label class="fl" id="nameLbl">이름</label>
      <input type="text" id="name" placeholder="실명을 입력해 주세요" autocomplete="off">
    </div>
    <div class="field">
      <label class="fl" id="contactLbl">연락처</label>
      <input type="text" id="contact" placeholder="휴대폰 번호" autocomplete="off" inputmode="tel">
    </div>
  </div>
  <button class="submit" id="submitBtn">접수하기</button>
  <p class="note">접수해 주셔서 감사합니다. 처리 결과는 입력하신 연락처로 안내드립니다.<br>하루의 완성, 웰페리온</p>
  <div class="social-section">
    <p class="social-title">웰페리온 소식을 구경해보세요</p>
    <div class="social-links">
      <a class="social-chip" href="http://wellperion.com/" target="_blank" rel="noopener">🌐 홈페이지</a>
      <a class="social-chip" href="https://www.instagram.com/wellperion/" target="_blank" rel="noopener">📷 인스타그램</a>
      <a class="social-chip" href="https://blog.naver.com/wellperion" target="_blank" rel="noopener">📝 네이버블로그</a>
      <a class="social-chip" href="https://map.naver.com/p/search/웰페리온/place/1048457693" target="_blank" rel="noopener">📍 네이버지도</a>
    </div>
  </div>
  <div style="text-align:center;margin-top:16px;font-size:12.5px;color:var(--dim);line-height:2">
    <div>문의/상담 — <a href="mailto:info@wellperion.com" style="color:var(--accent);text-decoration:none">info@wellperion.com</a></div>
    <div>비즈니스/기타 — <a href="mailto:cao@wellperion.com" style="color:var(--accent);text-decoration:none">cao@wellperion.com</a></div>
  </div>
</div>
<div class="wrap done" id="doneWrap">
  <div class="dot">✅</div>
  <h2>접수가 완료되었습니다</h2>
  <p>소중한 의견 감사합니다.<br>담당 부서가 빠르게 확인하겠습니다.</p>
  <button class="again" id="againBtn">새 건의 접수하기</button>
</div>
<script>
(function(){
  // ⚠️ GM 액션: GAS 배포 후 아래 URL 을 /exec 주소로 교체.
  //    배포 전(placeholder)에는 제출 시 안내 메시지만 표시(라이브 깨짐 방지).
  var VOC_API = 'https://script.google.com/macros/s/AKfycbwk2XS1FND9V2xtXlWgsXzgA5p0FG7jVm6YKD74JK_ME_ZvHsNUUfGE5A_8p0X8VcF3gQ/exec';
  var selectedCategory = '';
  var photoData = '';      // data:image/...;base64,... (FileReader 결과)
  var photoMime = 'image/jpeg';
  var photoName = '';
  function $(id){ return document.getElementById(id); }
  function toast(msg, isErr){
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    setTimeout(function(){ t.className = 'toast' + (isErr ? ' err' : ''); }, 2600);
  }
  // QR ?loc= 프리필
  try {
    var qLoc = new URLSearchParams(location.search).get('loc');
    if (qLoc) {
      $('loc').value = qLoc;
      var chip = $('locChip');
      chip.textContent = '📍 ' + qLoc;
      chip.style.display = 'inline-block';
    }
  } catch (e) {}
  // 카테고리별 동적 필드 정의
  var dynConfigs = {
    lost: [
      { key:'name',     label:'이름',     type:'text', ph:'실명을 입력해 주세요' },
      { key:'contact',  label:'연락처',   type:'tel',  ph:'010-1234-5678' },
      { key:'itemName', label:'분실물품', type:'text', ph:'예: 갤럭시 이어폰, 지갑 …' },
      { key:'content',  label:'물품상세', type:'textarea', ph:'브랜드·색상·특징 등 물품에 대한 설명을 적어주세요.' },
      { key:'lostWhen', label:'분실시점', type:'date' },
      { key:'loc',      label:'분실위치', type:'select', ph:'장소를 선택하세요', opts:['헬스장','수영장','남자사우나','여자사우나','골프장','스쿼시장','체조장','G.X룸','키즈락커','프론트/리셉션','주차장','카페','기타'] }
    ],
    facility: [
      { key:'equipName', label:'고장 설비',   type:'text', ph:'예: 러닝머신 3번, 샤워기 …' },
      { key:'severity',  label:'위험도',      type:'select', opts:['긴급','일반'] },
      { key:'usable',    label:'사용 가능 여부', type:'select', opts:['가능','불가'] }
    ],
    clean: [
      { key:'issueKind', label:'유형',   type:'select', opts:['악취','쓰레기','곰팡이','기타'] },
      { key:'urgency',   label:'시급도', type:'select', opts:['높음','보통','낮음'] }
    ],
    praise: [
      { key:'targetStaff', label:'대상 직원·강사', type:'text', ph:'이름을 입력하세요' },
      { key:'episode',     label:'사례',           type:'textarea', ph:'칭찬하고 싶으신 내용을 적어주세요.' }
    ],
    voice: [
      { key:'targetStaff',   label:'대상 직원·강사', type:'text', ph:'이름을 입력하세요' },
      { key:'episode',       label:'사례',           type:'textarea', ph:'개선이 필요한 내용을 적어주세요.' },
      { key:'anonymousPref', label:'익명 희망',      type:'checkbox' }
    ]
  };
  // 동적 필드 렌더 (카테고리 선택 시 1회만 — IME 보호를 위해 키입력 중 재렌더 없음)
  function renderDynFields(cat) {
    var container = $('dynFields');
    container.innerHTML = '';
    if (!cat) return;
    var defs = dynConfigs[cat];
    if (!defs || !defs.length) return;
    var wrapper = document.createElement('div');
    wrapper.className = 'field';
    defs.forEach(function(def) {
      var row = document.createElement('div');
      row.className = 'dyn-field';
      var lbl = document.createElement('label');
      lbl.className = 'dyn-label';
      lbl.textContent = def.label;
      if (def.type !== 'checkbox') {
        lbl.setAttribute('for', 'dyn_' + def.key);
      }
      row.appendChild(lbl);
      if (def.type === 'text') {
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.id = 'dyn_' + def.key;
        inp.placeholder = def.ph || '';
        inp.autocomplete = 'off';
        row.appendChild(inp);
      } else if (def.type === 'tel') {
        var inpTel = document.createElement('input');
        inpTel.type = 'text';
        inpTel.id = 'dyn_' + def.key;
        inpTel.placeholder = def.ph || '';
        inpTel.autocomplete = 'off';
        inpTel.inputMode = 'tel';
        inpTel.addEventListener('input', function(){
          var d = this.value.replace(/\D/g,'').slice(0,11);
          this.value = d.length<4 ? d : (d.length<8 ? d.slice(0,3)+'-'+d.slice(3) : d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7));
        });
        row.appendChild(inpTel);
      } else if (def.type === 'date') {
        var inp = document.createElement('input');
        inp.type = 'date';
        inp.id = 'dyn_' + def.key;
        row.appendChild(inp);
      } else if (def.type === 'textarea') {
        var ta = document.createElement('textarea');
        ta.id = 'dyn_' + def.key;
        ta.placeholder = def.ph || '';
        row.appendChild(ta);
      } else if (def.type === 'select') {
        var sel = document.createElement('select');
        sel.id = 'dyn_' + def.key;
        if (def.ph) { var o0 = document.createElement('option'); o0.value=''; o0.textContent=def.ph; sel.appendChild(o0); }
        def.opts.forEach(function(o) {
          var opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o;
          sel.appendChild(opt);
        });
        row.appendChild(sel);
      } else if (def.type === 'checkbox') {
        var chkRow = document.createElement('div');
        chkRow.className = 'chk-row';
        var chk = document.createElement('input');
        chk.type = 'checkbox';
        chk.id = 'dyn_' + def.key;
        var span = document.createElement('span');
        span.textContent = '예, 익명으로 접수해 주세요';
        chkRow.appendChild(chk);
        chkRow.appendChild(span);
        row.appendChild(chkRow);
      }
      wrapper.appendChild(row);
    });
    container.appendChild(wrapper);
  }
  // 동적 필드 값 수집
  function collectDynValues() {
    var out = {};
    if (!selectedCategory) return out;
    var defs = dynConfigs[selectedCategory];
    if (!defs) return out;
    defs.forEach(function(def) {
      var el = $('dyn_' + def.key);
      if (!el) return;
      if (def.type === 'checkbox') {
        out[def.key] = el.checked ? '예' : '아니오';
      } else {
        out[def.key] = el.value.trim ? el.value.trim() : el.value;
      }
    });
    return out;
  }
  // 이름·연락처 라벨 및 placeholder 갱신 (IME 보호: 라벨만 교체, input DOM 유지)
  function updateNameContactHint() {
    var isVoice = (selectedCategory === 'voice');
    var chk = $('dyn_anonymousPref');
    var isAnon = isVoice && chk && chk.checked;
    var nameOpt = isAnon ? ' <span class="opt">(익명 시 생략 가능)</span>' : '';
    var contactOpt = isAnon ? ' <span class="opt">(익명 시 생략 가능)</span>' : '';
    $('nameLbl').innerHTML = '이름' + nameOpt;
    $('contactLbl').innerHTML = '연락처' + contactOpt;
  }
  // 유형 선택 (카테고리 버튼)
  $('typeGroup').addEventListener('click', function(ev){
    var btn = ev.target.closest('.type-btn');
    if (!btn) return;
    var cat = btn.getAttribute('data-cat');
    if (cat === selectedCategory) return; // 같은 버튼 재클릭 시 재렌더 방지
    Array.prototype.forEach.call(this.querySelectorAll('.type-btn'), function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    selectedCategory = cat;
    renderDynFields(cat);
    updateNameContactHint();
    var hideShared = (cat === 'lost');
    ['loc','content','name','contact'].forEach(function(fid){
      var el = document.getElementById(fid);
      if (el && el.closest('.field')) el.closest('.field').style.display = hideShared ? 'none' : '';
    });
  });
  // 익명 체크박스 변경 시 라벨 갱신 (이벤트 위임 — dynFields 하위)
  $('dynFields').addEventListener('change', function(ev){
    if (ev.target && ev.target.id === 'dyn_anonymousPref') {
      updateNameContactHint();
    }
  });
  // 사진 선택 → base64 (FileReader)
  $('photo').addEventListener('change', function(ev){
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    if (f.size > 12 * 1024 * 1024) { toast('사진이 너무 큽니다 (12MB 이하)', true); this.value = ''; return; }
    photoMime = f.type || 'image/jpeg';
    photoName = f.name || 'voc_photo.jpg';
    var reader = new FileReader();
    reader.onload = function(e){
      photoData = e.target.result;            // data:...;base64,...
      $('previewImg').src = photoData;
      $('preview').style.display = 'block';
    };
    reader.readAsDataURL(f);
  });
  $('removePhoto').addEventListener('click', function(){
    photoData = ''; photoName = ''; $('photo').value = '';
    $('preview').style.display = 'none';
  });
  // 제출
  $('submitBtn').addEventListener('click', function(){
    if (!selectedCategory) { toast('접수 유형을 선택해 주세요', true); return; }
    var dynValues = collectDynValues();
    var isLost = (selectedCategory === 'lost');
    var name = isLost ? (dynValues.name || '') : $('name').value.trim();
    var contact = isLost ? (dynValues.contact || '') : $('contact').value.trim();
    // voice + 익명 희망 시 이름·연락처 필수 면제
    var anonChk = $('dyn_anonymousPref');
    var isAnon = (selectedCategory === 'voice') && anonChk && anonChk.checked;
    if (!isAnon) {
      if (!name) { toast('이름을 입력해 주세요', true); return; }
      if (!contact) { toast('연락처를 입력해 주세요', true); return; }
    }
    if (VOC_API.indexOf('__VOC') === 0) {
      toast('아직 접수 서버가 연결되지 않았습니다 (관리자 설정 대기)', true);
      return;
    }
    var btn = this;
    btn.disabled = true;
    btn.textContent = '접수 중…';
    var payload = {
      action: 'reg_submit',
      category: selectedCategory,
      name: name,
      contact: contact,
      loc: isLost ? (dynValues.loc || '') : $('loc').value.trim(),
      content: isLost ? (dynValues.content || '') : $('content').value.trim(),
      photo: photoData,            // 사진 = POST 본문 base64 (GET 쿼리 유실 방어)
      fileName: photoName,
      mimeType: photoMime,
      // 동적 필드 (영문키)
      itemName:      dynValues.itemName      || '',
      lostWhen:      dynValues.lostWhen      || '',
      keepWhere:     dynValues.keepWhere     || '',
      equipName:     dynValues.equipName     || '',
      severity:      dynValues.severity      || '',
      usable:        dynValues.usable        || '',
      issueKind:     dynValues.issueKind     || '',
      urgency:       dynValues.urgency       || '',
      targetStaff:   dynValues.targetStaff   || '',
      episode:       dynValues.episode       || '',
      anonymousPref: dynValues.anonymousPref || ''
    };
    fetch(VOC_API, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // GAS CORS 단순요청 회피
      body: JSON.stringify(payload)
    })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (res && res.ok) {
        $('formWrap').style.display = 'none';
        $('doneWrap').style.display = 'block';
        window.scrollTo(0, 0);
      } else {
        toast((res && res.error) || '접수에 실패했습니다. 다시 시도해 주세요.', true);
        btn.disabled = false; btn.textContent = '접수하기';
      }
    })
    .catch(function(){
      toast('네트워크 오류 — 다시 시도해 주세요.', true);
      btn.disabled = false; btn.textContent = '접수하기';
    });
  });
  // 새 건의
  $('againBtn').addEventListener('click', function(){
    selectedCategory = ''; photoData = ''; photoName = '';
    Array.prototype.forEach.call(document.querySelectorAll('.type-btn'), function(b){ b.classList.remove('active'); });
    $('content').value = '';
    $('name').value = '';
    $('contact').value = '';
    $('photo').value = ''; $('preview').style.display = 'none';
    $('dynFields').innerHTML = '';
    ['loc','content','name','contact'].forEach(function(fid){ var el = document.getElementById(fid); if (el && el.closest('.field')) el.closest('.field').style.display = ''; });
    var btn = $('submitBtn'); btn.disabled = false; btn.textContent = '접수하기';
    $('doneWrap').style.display = 'none';
    $('formWrap').style.display = 'block';
    window.scrollTo(0, 0);
  });
})();
</script>
</body>
</html>
