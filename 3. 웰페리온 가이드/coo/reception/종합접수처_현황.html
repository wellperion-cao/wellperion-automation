<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="/wellperion-automation/wellperion_favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 종합접수처 현황</title>
<style>
:root {
  --bg:#221F20;--paper:#2a2725;--text:#f5f2ef;--dim:#8c8b83;
  --accent:#B79F8A;--accent-bg:rgba(183,159,138,0.12);--border:#3d3835;
  --green:#6abf7b;--green-bg:rgba(106,191,123,0.12);
  --red:#ED5B3F;--red-bg:rgba(237,91,63,0.12);
  --yellow:#e6c84e;--yellow-bg:rgba(230,200,78,0.12);
  --blue:#5b9fd5;--blue-bg:rgba(91,159,213,0.12);
  --orange:#e6944e;--orange-bg:rgba(230,148,78,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; font-size:15px;
}
a { color:var(--accent); text-decoration:none; }

/* ── 상단 고정 헤더 ── */
.sticky-top { position:sticky; top:0; z-index:100; background:var(--bg); border-bottom:1px solid var(--border); }
.header {
  background:var(--paper); display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; gap:10px; flex-wrap:wrap;
}
.header h1 { font-size:17px; font-weight:700; }
.header-meta { font-size:12px; color:var(--dim); margin-top:2px; }
.header-btns { display:flex; gap:6px; flex-wrap:wrap; }
.header-btns button, .header-btns a {
  padding:6px 12px; border:1px solid var(--border); border-radius:8px;
  background:var(--bg); color:var(--text); cursor:pointer; font-size:12px; font-weight:600;
  display:inline-flex; align-items:center; gap:4px; font-family:inherit; text-decoration:none;
}
.header-btns button:hover, .header-btns a:hover {
  background:var(--accent-bg); color:var(--accent); border-color:rgba(183,159,138,0.3);
}

.content { padding:16px; max-width:none; margin:0; }

/* ── 요약 카운트 ── */
.summary-row { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
.summary-pill {
  display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:12px;
  background:var(--paper); border:1px solid var(--border); font-size:13px; font-weight:600;
}
.summary-pill .n { font-size:16px; font-weight:800; }

/* ── 필터 칩 ── */
.filter-block { margin-bottom:14px; }
.filter-label { font-size:11px; font-weight:700; color:var(--dim); margin:0 0 6px; letter-spacing:0.02em; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip {
  font-size:12.5px; font-weight:700; padding:5px 14px; border-radius:20px;
  border:1.5px solid var(--border); background:var(--paper); color:var(--text);
  cursor:pointer; font-family:inherit;
}
.chip.active { border-color:var(--accent); background:var(--accent-bg); color:var(--accent); }

/* ── 칸반 ── */
.board { display:flex; gap:12px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:8px; align-items:flex-start; }
.col { flex:1; min-width:280px; background:var(--paper); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
.col-head { padding:11px 15px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.col-head .t { font-size:14px; font-weight:800; }
.col-head .c { font-size:12px; font-weight:700; background:var(--bg); border-radius:10px; padding:2px 9px; }
.col-body { padding:10px 10px 4px; min-height:40px; }
.col-empty { padding:10px 4px; font-size:12px; color:var(--dim); }

.card { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:12px 12px 10px; margin-bottom:8px; }
.card-top { display:flex; align-items:center; gap:7px; margin-bottom:7px; flex-wrap:wrap; }
.badge { font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; }
.card-when { font-size:11px; color:var(--dim); }
.card-id { font-size:10px; color:var(--dim); margin-left:auto; }
.card-name { font-size:13px; font-weight:600; margin-bottom:4px; }
.card-name .contact { font-size:12px; color:var(--dim); font-weight:400; margin-left:8px; }
.card-content { font-size:15px; color:var(--text); line-height:1.55; margin-bottom:6px; word-break:break-word; }
.card-loc { font-size:14px; color:var(--dim); margin-bottom:6px; }
.card-extras { margin-bottom:6px; display:flex; flex-wrap:wrap; gap:5px; }
.card-extras .k { font-size:11px; color:var(--dim); }
.card-extras .v { font-size:11px; color:var(--text); }
.card-sla { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px; white-space:nowrap; }
.divider { border-top:1px solid var(--border); margin:8px 0; }
.field-row { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
.field-row label { font-size:12px; font-weight:700; color:var(--dim); white-space:nowrap; }
.field-row select, .field-row input, .card textarea {
  background:var(--paper); border:1px solid var(--border); color:var(--text);
  padding:5px 8px; border-radius:7px; font-size:12px; font-family:inherit;
}
.field-row select, .field-row input { flex:1; min-width:80px; }
.card textarea { width:100%; box-sizing:border-box; resize:vertical; }
.save-row { display:flex; justify-content:flex-end; }
.save-btn {
  font-size:12px; font-weight:700; padding:5px 14px; border-radius:7px;
  background:var(--accent-bg); color:var(--accent); border:1px solid rgba(183,159,138,0.4);
  cursor:pointer; font-family:inherit;
}
.state-msg { padding:24px 4px; text-align:center; color:var(--dim); font-size:13px; }

/* ── 🧳 습득물 (7번째 카테고리 · 칸반 카드 내 사진·안내) ── */
.lf-thumb { width:100%; max-height:150px; object-fit:cover; border-radius:8px; border:1px solid var(--border); margin-bottom:7px; display:block; background:var(--paper); }
.lf-note { font-size:11.5px; color:var(--dim); line-height:1.6; }
.lf-note b { color:var(--text); font-weight:700; }
.lf-note a { color:var(--accent); font-weight:600; white-space:nowrap; }

/* ── 상태 요약 + 검색(우측) 한 줄 ── */
.summary-bar { display:flex; align-items:center; gap:12px 18px; flex-wrap:wrap; margin-bottom:14px; }
.summary-bar .summary-row { margin-bottom:0; }
.summary-bar .search-input { margin-left:auto; flex:0 1 340px; min-width:200px; }

/* ── 🔍 검색칸 ── */
.search-input { width:100%; max-width:520px; padding:11px 14px; border:1.5px solid var(--border); border-radius:10px; background:var(--paper); color:var(--text); font-size:14px; font-family:inherit; outline:none; }
.search-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(183,159,138,.15); }
.search-input::placeholder { color:var(--dim); }

/* ── 컬럼 내부 스크롤(페이지 세로 폭주 방지) ── */
.col-body { max-height:72vh; overflow-y:auto; }

/* ── ✅ 완료 컬럼 접기(스크롤 단축) ── */
.done-collapsed { padding:16px 8px; text-align:center; }
.done-collapsed .dc-n { font-size:13px; font-weight:800; color:var(--green); margin-bottom:10px; }
.dc-btn { font-size:12px; font-weight:700; padding:7px 14px; border-radius:8px; background:var(--green-bg); color:var(--green); border:1px solid rgba(106,191,123,.4); cursor:pointer; font-family:inherit; }
.dc-btn.dc-collapse { display:block; width:100%; margin-bottom:8px; background:var(--bg); color:var(--dim); border-color:var(--border); }
.done-collapsed .dc-hint { font-size:11px; color:var(--dim); margin-top:10px; line-height:1.55; }

/* ── 🖊️ 습득물 수령 서명 모달 (직원 · gallery lost_found_gallery.html 포팅 + 다크테마 색 조정) ── */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-back.show{display:flex;}
.modal{background:var(--paper);border:1px solid var(--border);border-radius:18px;max-width:440px;width:100%;max-height:92vh;overflow-y:auto;padding:22px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.modal h2{font-size:18px;font-weight:800;margin-bottom:4px;color:var(--text);}
.modal .msub{font-size:12.5px;color:var(--dim);margin-bottom:16px;}
.modal .mitem{display:flex;gap:11px;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:16px;}
.modal .mitem img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex-shrink:0;}
.modal .mitem .mt{font-size:13.5px;font-weight:600;word-break:break-word;color:var(--text);}
.modal .mitem .mm{font-size:11.5px;color:var(--dim);}
.mfield{margin-bottom:13px;}
.mfield label{display:block;font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:6px;letter-spacing:.3px;}
.mfield input,.mfield select{width:100%;background:var(--bg);border:1.5px solid var(--border);color:var(--text);padding:12px 13px;border-radius:11px;font-size:15px;font-family:inherit;-webkit-appearance:none;appearance:none;}
.mfield input:focus,.mfield select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(183,159,138,.18);}
.sign-wrap{border:1.5px solid var(--border);border-radius:12px;background:#fff;position:relative;overflow:hidden;}
.sign-wrap canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair;}
.sign-hint{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);text-align:center;color:#b8b2a8;font-size:13px;pointer-events:none;}
.sign-clear{margin-top:7px;font-size:12.5px;color:var(--red);cursor:pointer;font-weight:600;display:inline-block;}
.mbtns{display:flex;gap:10px;margin-top:18px;}
.mbtns button{flex:1;padding:14px;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;border:none;}
.mbtns .cancel{background:var(--bg);border:1.5px solid var(--border);color:var(--text);}
.mbtns .confirm{background:var(--green);color:#fff;}
.mbtns .confirm:disabled{opacity:.45;cursor:not-allowed;}

.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-120px);background:var(--green);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;font-weight:700;z-index:99999;transition:transform .3s;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red);}

/* ── 습득물 카드 직원 컨트롤(수령·삭제·A3 처분공지) ── */
.lf-ctrl-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px;}
.lf-btn{font-size:12px;font-weight:700;padding:6px 13px;border-radius:8px;cursor:pointer;font-family:inherit;border:1px solid var(--border);background:var(--paper);color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
.lf-claim{background:var(--accent-bg);color:var(--accent);border-color:rgba(183,159,138,0.4);}
.lf-del{font-size:11px;color:var(--dim);opacity:.75;}
.lf-del:hover{color:var(--red);opacity:1;}
.lf-a3{color:var(--dim);}

/* ── 카테고리별 그룹 토글 ── */
.cat-group{ margin-bottom:8px; }
.cat-group-head{ width:100%; display:flex; align-items:center; gap:7px; padding:8px 11px; background:var(--paper); border:1px solid var(--border); border-radius:9px; color:var(--text); cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; text-align:left; }
.cat-group-head:hover{ background:var(--accent-bg); border-color:rgba(183,159,138,0.4); }
.cat-group-head .cat-arrow{ width:12px; color:var(--dim); flex-shrink:0; }
.cat-group-head .cat-name{ flex:1; }
.cat-group-head .cat-n{ font-size:11.5px; font-weight:800; background:var(--bg); color:var(--dim); border-radius:9px; padding:1px 9px; }
.cat-group-body{ padding-top:8px; }
</style>

</head>
<body>

<div class="sticky-top">
  <div class="header">
    <div>
      <h1>🙋 웰페리온 종합접수처 현황 <span title="8종 접수·습득물·휴회 모두 GAS 실시간 자동 반영(사람 손 없이 갱신)" style="font-size:13px;font-weight:700;color:#1f7a3d;background:rgba(46,160,86,0.14);border:1px solid rgba(46,160,86,0.45);border-radius:999px;padding:2px 10px;vertical-align:middle;white-space:nowrap;">🟢 라이브</span></h1>

      <a href="/wellperion-automation/wellperion_guide(main).html#O1">🏠 ERP 허브</a>
      <button onclick="regLoad();lfLoad();holdLoad()">↻ 새로고침</button>

<div class="content">

  <div class="summary-bar">

    <input type="text" id="searchBox" class="search-input" placeholder="🔍 이름·내용·장소·번호 검색…" oninput="setSearch(this.value)" autocomplete="off">

    <!-- ③ 확인 비밀번호 -->
    <div class="mfield">
      <label for="m_pw">③ 확인 비밀번호</label>
      <input type="password" id="m_pw" placeholder="담당자 전용 비밀번호" autocomplete="off" inputmode="numeric">
    </div>

    <!-- ④ 수령 완료 -->
    <div class="mbtns">
      <button class="cancel" id="mCancel" type="button">취소</button>
      <button class="confirm" id="mConfirm" type="button">수령 완료</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   웰페리온 종합접수처 현황 (전용 SSOT 보드)
   데이터: VOC GAS reg_board (공개·마스킹·SLA 포함, no-store)
   갱신: reg_update (상태·담당·메모, 공개 액션)
   렌더 로직 = 운영부 체계.html _deptRegRender 이식·통합
   ═══════════════════════════════════════════ */
var REG_API = 'https://script.google.com/macros/s/AKfycbwk2XS1FND9V2xtXlWgsXzgA5p0FG7jVm6YKD74JK_ME_ZvHsNUUfGE5A_8p0X8VcF3gQ/exec';
/* 직원 현황(gate.js 뒤) 사진 노출 키 — 이 값이면 reg_board가 사진 원본 반환(썸네일용). 공개는 계속 '비공개'. */
var REG_PV = 'wlp_reg_pv_2026';

/* 🧳 습득물 직원 처리(수령·삭제) — lost_found_gallery.html 포팅 상수 (REG_API=VOC_API 동일 GAS) */
var VOC_SUBMIT_TOKEN = 'wlp_voc_7b3f9a2e6c1d4085';
var LOCATIONS = ['헬스장','수영장','남자사우나','여자사우나','골프장','스쿼시장','체조장','G.X룸','락커','리셉션','주차장','카페','기타'];
var STAFF = ['김남욱GM','이경연실장','나우열M','최준용M','임정은M','윤병현AM','백승화사원'];

var STATUS_LIST  = ['접수','처리중','완료'];
var STATUS_COLOR = {'접수':'var(--yellow)','처리중':'var(--blue)','완료':'var(--green)'};
var STATUS_BG    = {'접수':'var(--yellow-bg)','처리중':'var(--blue-bg)','완료':'var(--green-bg)'};

/* 6종 카테고리 (백엔드 REG_CATEGORIES 라벨과 동일) */
var CAT_META = [
  {label:'분실물 접수',          icon:'📦', dept:'운영부', color:'var(--orange)', bg:'var(--orange-bg)'},
  {label:'습득물 접수',          icon:'🧳', dept:'운영부', color:'var(--accent)', bg:'var(--accent-bg)'},
  {label:'시설물 고장 접수',      icon:'🔧', dept:'시설부', color:'var(--blue)',   bg:'var(--blue-bg)'},
  {label:'청결 이슈 접수',        icon:'🧹', dept:'지원부', color:'var(--green)',  bg:'var(--green-bg)'},
  {label:'컴플레인 접수',        icon:'📣', dept:'운영부', color:'var(--red)',    bg:'var(--red-bg)'},
  {label:'직원·강사 칭찬합니다',   icon:'⭐', dept:'운영부', color:'var(--green)',  bg:'var(--green-bg)'},
  {label:'직원·강사 쓴소리합니다', icon:'💬', dept:'운영부', color:'var(--red)',    bg:'var(--red-bg)'},
  {label:'휴회 접수',            icon:'⏸️', dept:'운영부', color:'var(--yellow)', bg:'var(--yellow-bg)'}
];
var DEPT_LIST = ['운영부','시설부','지원부'];

/* 공통·SLA 키 → 나머지는 extras */
var KNOWN_KEYS = ['regId','category','createdAt','name','contact','loc','content','photoUrl','status','assignee','memo','handler','dept','slaHours','deadline','remainH','slaStatus'];
var EXTRA_LABEL = {
  itemName:'분실물품', lostWhen:'분실시점', keepWhere:'보관요청',
  equipName:'고장설비', severity:'위험도', usable:'사용가능여부',
  issueKind:'유형', urgency:'시급도',
  targetStaff:'대상직원·강사', episode:'사례', anonymousPref:'익명희망',
  area:'분야', occurredAt:'발생시점',
  holdKind:'구분', holdStart:'휴회시작일', holdEnd:'휴회종료일', wishDays:'희망일수', holdReason:'사유'
};

var _allItems = [];   // VOC 6종 + 습득물(매핑) + 휴회(매핑) 병합 결과
var _vocItems = [];   // reg_board(VOC 6종)
var _lfItems  = [];   // lf_list → 습득물 매핑(게시중→접수·수령완료→완료)
var _holdItems = [];  // member_hold_intake_list → 휴회 매핑(읽기 전용·8번째 카드). 승인/반려는 회원 관리 화면 전용.
var _curCat = '';
var _curDept = '';
var _curMonth = '';
var _curSearch = '';
var _doneExpanded = false;
var _loading = false;

/* VOC + 습득물 + 휴회 병합 후 렌더 (하나만 갱신돼도 합쳐서 다시 그림) */
function _merge(){ _allItems = _vocItems.concat(_lfItems).concat(_holdItems); _render(); }

/* 검색·완료접기 */
function setSearch(v){ _curSearch = String(v||'').trim().toLowerCase(); _render(); }
function toggleDone(){ _doneExpanded = !_doneExpanded; _render(); }
function _hay(r){ var s=''; for(var k in r){ if(r.hasOwnProperty(k) && k.charAt(0)!=='_' && r[k]!=null) s += ' ' + r[k]; } return s.toLowerCase(); }

function _esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function _fmtTel(v){ var d=String(v||'').replace(/\D/g,''); if(d.length===10 && d.charAt(0)==='1') d='0'+d; if(d.length===11) return d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'); if(d.length===10) return d.charAt(1)==='2'?d.replace(/(\d{2})(\d{4})(\d{4})/,'$1-$2-$3'):d.replace(/(\d{3})(\d{3})(\d{4})/,'$1-$2-$3'); return String(v||''); }
function _catMeta(label){ for(var i=0;i<CAT_META.length;i++){ if(CAT_META[i].label===label) return CAT_META[i]; } return null; }
function $(id){ return document.getElementById(id); }
function toast(msg, isErr){ var t=$('toast'); if(!t) return; t.textContent = msg; t.className = 'toast show' + (isErr?' err':''); setTimeout(function(){ t.className = 'toast' + (isErr?' err':''); }, 2600); }

/* 접수월(YYYY-MM) 추출 — 습득물=foundWhen, 그 외=createdAt(서버 포맷 방어적 파싱, 실패시 '' → '전체'에만 포함) */
function _monthOf(r){
  var raw = r._lf ? (r.foundWhen || r.createdAt) : r.createdAt;
  var m = String(raw||'').match(/^(\d{4}-\d{2})/);
  return m ? m[1] : '';
}
function _monthLabel(ym){
  var p = String(ym||'').split('-');
  if(p.length < 2) return '';
  var mo = parseInt(p[1], 10);
  return isNaN(mo) ? '' : (p[0] + '년 ' + mo + '월');
}

/* ── 로드 (항상 전체 → 클라이언트 필터) ── */
function regLoad(){
  if(_loading) return;
  _loading = true;
  var board = document.getElementById('board');
  board.innerHTML = '<div class="state-msg">불러오는 중…</div>';
  var url = REG_API + '?action=reg_board&pv=' + encodeURIComponent(REG_PV) + '&_=' + Date.now();
  fetch(url, {redirect:'follow', cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      _loading = false;
      if(!d || !d.ok){ board.innerHTML = '<div class="state-msg">현황을 불러오지 못했습니다 — ' + _esc(d && d.error || '') + '</div>'; return; }
      _vocItems = Array.isArray(d.data) ? d.data : [];
      _merge();
    })
    .catch(function(){
      _loading = false;
      board.innerHTML = '<div class="state-msg">네트워크 오류 — 새로고침 해주세요.</div>';
    });
}

/* ── 필터 칩 렌더 ── */
function _renderChips(){
  var cc = document.getElementById('catChips');
  var html = '<button class="chip' + (_curCat===''?' active':'') + '" onclick="setCat(\'\')">전체</button>';
  CAT_META.forEach(function(m){
    var n = _allItems.filter(function(r){ return String(r.category||'')===m.label; }).length;
    html += '<button class="chip' + (_curCat===m.label?' active':'') + '" onclick="setCat(\'' + m.label + '\')">' + m.icon + ' ' + _esc(m.label) + ' (' + n + ')</button>';
  });
  cc.innerHTML = html;

  var dc = document.getElementById('deptChips');
  var dh = '<button class="chip' + (_curDept===''?' active':'') + '" onclick="setDept(\'\')">전체</button>';
  DEPT_LIST.forEach(function(dep){
    var n = _allItems.filter(function(r){ return String(r.dept||'')===dep; }).length;
    dh += '<button class="chip' + (_curDept===dep?' active':'') + '" onclick="setDept(\'' + dep + '\')">' + _esc(dep) + ' (' + n + ')</button>';
  });
  dc.innerHTML = dh;

  var mc = document.getElementById('monthChips');
  var months = {};
  _allItems.forEach(function(r){ var ym = _monthOf(r); if(ym) months[ym] = (months[ym]||0) + 1; });
  var monthKeys = Object.keys(months).sort().reverse();
  var mh = '<button class="chip' + (_curMonth===''?' active':'') + '" onclick="setMonth(\'\')">전체</button>';
  monthKeys.forEach(function(ym){
    mh += '<button class="chip' + (_curMonth===ym?' active':'') + '" onclick="setMonth(\'' + ym + '\')">' + _esc(_monthLabel(ym)) + ' (' + months[ym] + ')</button>';
  });
  mc.innerHTML = mh;
}
function setCat(c){ _curCat = c; _render(); }
function setDept(d){ _curDept = d; _render(); }
function setMonth(m){ _curMonth = m; _render(); }

/* ── 필터 적용 목록 ── */
function _filtered(){
  return _allItems.filter(function(r){
    if(_curCat && String(r.category||'') !== _curCat) return false;
    if(_curDept && String(r.dept||'') !== _curDept) return false;
    if(_curMonth && _monthOf(r) !== _curMonth) return false;
    if(_curSearch && _hay(r).indexOf(_curSearch) < 0) return false;
    return true;
  });
}

/* ── 상태 요약 ── */
function _renderSummary(rows){
  var el = document.getElementById('statusSummary');
  var html = '<span class="summary-pill">전체 <span class="n" style="color:var(--accent);">' + rows.length + '</span></span>';
  STATUS_LIST.forEach(function(s){
    var n = rows.filter(function(r){ return String(r.status||'접수')===s; }).length;
    html += '<span class="summary-pill">' + _esc(s) + ' <span class="n" style="color:' + (STATUS_COLOR[s]||'var(--accent)') + ';">' + n + '</span></span>';
  });
  el.innerHTML = html;
}

/* ── SLA 배지 (서버 slaStatus/remainH/deadline 기준) ── */
function _slaBadge(r){
  var st = String(r.slaStatus||'');
  if(st!=='정상' && st!=='임박' && st!=='초과') return '';
  var rem = (r.remainH===null||r.remainH===undefined) ? null : Number(r.remainH);
  var bg, color, txt;
  if(st==='초과'){ bg='var(--red-bg)'; color='var(--red)'; txt='초과 +' + (rem!==null?Math.abs(Math.round(rem))+'h':''); }
  else if(st==='임박'){ bg='var(--orange-bg)'; color='var(--orange)'; txt='임박' + (rem!==null?' '+(rem<1?Math.round(rem*60)+'분':Math.round(rem)+'h'):''); }
  else { bg='var(--border)'; color='var(--dim)'; txt='기한 ' + (rem!==null?(rem<24?Math.round(rem)+'h':'D-'+Math.floor(rem/24)):''); }
  return '<span class="card-sla" title="기한 ' + _esc(String(r.deadline||'')) + '" style="background:' + bg + ';color:' + color + ';">' + _esc(txt) + '</span>';
}

/* ── 카테고리별 그룹 토글 상태 (기본 접힘) ── */
var _openGroups = {};
window.toggleGroup = function(btn){
  var key = btn.getAttribute('data-grp');
  _openGroups[key] = !_openGroups[key];
  var body = btn.nextElementSibling;
  var arrow = btn.querySelector('.cat-arrow');
  if(body) body.style.display = _openGroups[key] ? 'block' : 'none';
  if(arrow) arrow.textContent = _openGroups[key] ? '▾' : '▸';
};
/* 컬럼 본문 = 카테고리별 접이식 그룹 (기본 접힘). 검색 중엔 매칭 카드 전부 펼쳐 노출. */
function _renderColBody(status, list){
  if(!list.length) return '<div class="col-empty">없음</div>';
  if(_curSearch){ var hh=''; list.forEach(function(r){ hh += _card(r); }); return hh; }
  var h='';
  CAT_META.forEach(function(m){
    var sub = list.filter(function(r){ return String(r.category||'')===m.label; });
    if(!sub.length) return;
    var gkey = status + '|' + m.label;
    var open = !!_openGroups[gkey];
    h += '<div class="cat-group">';
    h += '<button type="button" class="cat-group-head" data-grp="' + _esc(gkey) + '" onclick="toggleGroup(this)">';
    h += '<span class="cat-arrow">' + (open?'▾':'▸') + '</span><span class="cat-name">' + m.icon + ' ' + _esc(m.label) + '</span><span class="cat-n">' + sub.length + '</span></button>';
    h += '<div class="cat-group-body" style="display:' + (open?'block':'none') + ';">';
    sub.forEach(function(r){ h += _card(r); });
    h += '</div></div>';
  });
  return h;
}

/* ── 전체 렌더 ── */
function _render(){
  _renderChips();
  var rows = _filtered();
  _renderSummary(rows);

  var board = document.getElementById('board');
  if(!rows.length){
    board.innerHTML = '<div class="state-msg">해당 조건의 접수 항목이 없습니다.</div>';
    return;
  }
  var groups = {'접수':[],'처리중':[],'완료':[]};
  rows.forEach(function(r){ var s = String(r.status||'접수'); if(!groups[s]) groups[s]=[]; groups[s].push(r); });

  var html = '';
  STATUS_LIST.forEach(function(status){
    var list = groups[status]||[];
    var color = STATUS_COLOR[status]||'var(--accent)';
    var bg = STATUS_BG[status]||'var(--accent-bg)';
    html += '<div class="col">';
    html += '<div class="col-head" style="background:' + bg + ';">';
    html += '<span class="t" style="color:' + color + ';">' + _esc(status) + '</span>';
    html += '<span class="c" style="color:' + color + ';">' + list.length + '</span>';
    html += '</div><div class="col-body">';
    html += _renderColBody(status, list);
    html += '</div></div>';
  });
  board.innerHTML = html;
}

/* ── 카드 ── */
function _card(r){
  /* 🧳 습득물 카드 — 사진+안내(읽기 전용). 수령(서명)은 '습득물 보기'에서 처리(위조 방지). 월별 코호트로 자동 폐기(습득 다음 달 공지→그다음 달 폐기·폐기 공지 게시). */
  if(r._lf){
    var lid = _esc(r.regId||'');
    var lwhen = _esc(String(r.foundWhen||r.createdAt||'').replace('T',' '));
    var lcm = _catMeta('습득물 접수');
    var lh = '<div class="card">';
    lh += '<div class="card-top">';
    lh += '<span class="badge" style="background:' + lcm.bg + ';color:' + lcm.color + ';">🧳 습득물 접수</span>';
    if(r._lfLabel) lh += '<span class="badge" style="background:var(--paper);color:var(--dim);">' + _esc(r._lfLabel) + '</span>';
    lh += '<span class="card-when">운영부</span>';
    if(lid) lh += '<span class="card-id">#' + lid + '</span>';
    lh += '</div>';
    if(r.photoUrl) lh += '<img class="lf-thumb" src="' + _esc(_lfThumb(r.photoUrl)) + '" alt="습득물 사진" loading="lazy" decoding="async">';
    if(lwhen) lh += '<div class="card-loc" style="margin-bottom:6px;">🕒 ' + lwhen + '</div>';
    if(r.content) lh += '<div class="card-content">' + _esc(String(r.content)) + '</div>';
    if(r.loc) lh += '<div class="card-loc">습득장소: ' + _esc(String(r.loc)) + '</div>';
    if(r.keepLoc) lh += '<div class="card-loc">📦 보관위치: ' + _esc(String(r.keepLoc)) + '</div>';
    if(r.memo) lh += '<div class="card-loc">🔒 메모: ' + _esc(String(r.memo)) + '</div>';
    if(r.ownerName || r.ownerContact) lh += '<div class="card-loc">👤 주인: ' + _esc(String((r.ownerName || '') + (r.ownerContact ? ' · ' + _fmtTel(r.ownerContact) : ''))) + '</div>';
    lh += '<div class="divider"></div>';
    lh += '<div class="lf-note">습득 다음 달 공지 → 그다음 달 폐기(월 사이클). <a href="http://wellperion.com/ko/lost-found-register/" target="_blank" rel="noopener">습득물 접수</a> · <a href="http://wellperion.com/ko/lost-found/" target="_blank" rel="noopener">습득물 보기</a> · <a href="lost_found_guide.html" target="_blank" rel="noopener">운영 가이드</a></div>';
    lh += '<div class="lf-ctrl-row">';
    if(r._lfLabel==='게시중'){
      lh += '<button type="button" class="lf-btn lf-claim" data-lf-claim="' + lid + '" data-lf-desc="' + _esc(String(r.content||'')) + '" data-lf-loc="' + _esc(String(r.loc||'')) + '" data-lf-photo="' + _esc(String(r.photoUrl||'')) + '">✅ 수령</button>';
    }
    lh += '<button type="button" class="lf-btn lf-del" data-lf-del="' + lid + '" title="오등록 삭제">🗑 삭제</button>';
    lh += '<a class="lf-btn lf-a3" href="lost_found_disposal.html" target="_blank" rel="noopener">🖨 A3 처분공지</a>';
    lh += '</div>';
    lh += '</div>';
    return lh;
  }
  var id = _esc(r.regId||'');
  var catLabel = String(r.category||'');
  var cm = _catMeta(catLabel);
  var catColor = cm ? cm.color : 'var(--accent)';
  var catBg = cm ? cm.bg : 'var(--accent-bg)';
  var catIcon = cm ? cm.icon : '📋';
  var status = String(r.status||'접수');
  var rawId = String(r.regId||'');
  var rawCat = String(r.category||'');

  var extras = [];
  Object.keys(r).forEach(function(k){
    if(KNOWN_KEYS.indexOf(k)<0 && r[k]!=null && r[k]!==''){
      var _v = String(r[k]);
      if(k==='lostWhen') _v = _v.replace('T',' ');  // 분실시점 datetime-local 표시: 2026-07-07T14:30 → 2026-07-07 14:30
      extras.push('<span class="k">' + _esc(EXTRA_LABEL[k]||k) + ': </span><span class="v">' + _esc(_v) + '</span>');
    }
  });

  var h = '<div class="card" data-reg-card="' + _esc(rawId) + '" data-reg-cat="' + _esc(rawCat) + '">';
  h += '<div class="card-top">';
  if(catLabel) h += '<span class="badge" style="background:' + catBg + ';color:' + catColor + ';">' + catIcon + ' ' + _esc(catLabel) + '</span>';
  var sla = _slaBadge(r);
  if(sla) h += sla;
  if(r.dept) h += '<span class="card-when">' + _esc(String(r.dept)) + '</span>';
  if(id) h += '<span class="card-id">#' + id + '</span>';
  h += '</div>';

  if(r.createdAt) h += '<div class="card-loc" style="margin-bottom:6px;">🕒 ' + _esc(String(r.createdAt)) + '</div>';
  /* 사진 있는 접수 = 축소 썸네일(직원 pv 게이트로 받은 원본). '비공개'(공개 마스킹값)면 미표시 */
  if(r.photoUrl && r.photoUrl!=='비공개') h += '<img class="lf-thumb" src="' + _esc(_lfThumb(r.photoUrl)) + '" alt="접수 사진" loading="lazy" decoding="async">';
  if(r.name||r.contact) h += '<div class="card-name">' + _esc(String(r.name||'')) + '<span class="contact">' + _esc(String(r.contact||'')) + '</span></div>';
  if(r.content) h += '<div class="card-content">' + _esc(String(r.content)) + '</div>';
  if(r.loc) h += '<div class="card-loc">위치: ' + _esc(String(r.loc)) + '</div>';
  if(extras.length) h += '<div class="card-extras">' + extras.join('<span style="color:var(--border);">|</span>') + '</div>';

  h += '<div class="divider"></div>';

  /* ⏸️ 휴회 접수 = 읽기 전용 현황만(승인·반려는 회원 관리 화면 전용 — 여기서 기능 추가 금지) */
  if(catLabel === '휴회 접수'){
    h += '<div class="lf-note">⏸️ 승인·반려는 회원 관리 화면에서 처리합니다. <a href="../../cpo/member/membership.html#holdStatusCard" target="_blank" rel="noopener">휴회 회원 관리 바로가기 →</a></div>';
    h += '</div>';
    return h;
  }

  /* 상태 */
  var opts = STATUS_LIST.map(function(s){ return '<option value="' + _esc(s) + '"' + (s===status?' selected':'') + '>' + _esc(s) + '</option>'; }).join('');
  h += '<div class="field-row"><label>상태</label>';
  h += '<select data-reg-action="status" data-reg-id="' + _esc(rawId) + '" data-reg-cat="' + _esc(rawCat) + '" data-prev-status="' + _esc(status) + '">' + opts + '</select></div>';

  /* 담당 */
  h += '<div class="field-row"><label>담당</label>';
  h += '<input type="text" data-reg-assignee placeholder="담당자" value="' + _esc(String(r.assignee||'')) + '"></div>';

  /* 처리자(실제 처리한) */
  h += '<div class="field-row"><label>처리자</label>';
  h += '<input type="text" data-reg-handler placeholder="실제 처리한 사람" value="' + _esc(String(r.handler||'')) + '"></div>';

  /* 메모 */
  h += '<div style="margin-bottom:8px;"><label style="font-size:12px;font-weight:700;color:var(--dim);display:block;margin-bottom:4px;">처리 메모</label>';
  h += '<textarea data-reg-memo rows="2">' + _esc(String(r.memo||'')) + '</textarea></div>';

  /* 저장 */
  h += '<div class="save-row"><button data-reg-save type="button" class="save-btn">저장</button></div>';
  h += '</div>';
  return h;
}

/* ── 갱신 (reg_update) ── */
function _update(id, cat, payload, btn, statusEl, statusPrev){
  if(!id) return;
  var isStatus = ('status' in payload);
  var oBg='', oColor='', oBorder='';
  if(btn && !isStatus){
    oBg=btn.style.background; oColor=btn.style.color; oBorder=btn.style.borderColor;
    btn.textContent='저장 중...'; btn.style.background='var(--green-bg)'; btn.style.color='var(--green)';
    btn.style.borderColor='rgba(106,191,123,0.4)'; btn.style.pointerEvents='none';
  }
  var body = { action:'reg_update', id:id, category:cat };
  if('status' in payload) body.status = payload.status;
  if('assignee' in payload) body.assignee = payload.assignee;
  if('memo' in payload) body.memo = payload.memo;
  if('handler' in payload) body.handler = payload.handler;

  fetch(REG_API, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'},
    body:JSON.stringify(body), redirect:'follow'
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok){
      if(isStatus){ regLoad(); }
      else if(btn){
        btn.textContent='저장 완료 ✓';
        setTimeout(function(){ btn.textContent='저장'; btn.style.background=oBg; btn.style.color=oColor; btn.style.borderColor=oBorder; btn.style.pointerEvents='auto'; }, 2000);
      }
    } else {
      if(btn && !isStatus){ btn.textContent='저장'; btn.style.background=oBg; btn.style.color=oColor; btn.style.borderColor=oBorder; btn.style.pointerEvents='auto'; }
      if(isStatus && statusEl){ statusEl.value = statusPrev; }
      alert('저장 실패: ' + (d&&d.error?d.error:'알 수 없는 오류'));
    }
  }).catch(function(){
    if(btn && !isStatus){ btn.textContent='저장'; btn.style.background=oBg; btn.style.color=oColor; btn.style.borderColor=oBorder; btn.style.pointerEvents='auto'; }
    if(isStatus && statusEl){ statusEl.value = statusPrev; }
    alert('네트워크 오류 — 저장되지 않았습니다.');
  });
}

/* ═══════════════════════════════════════════
   🧳 습득물 = 7번째 카테고리로 통합 (같은 접수/처리중/완료 보드)
   데이터: 같은 VOC GAS lf_list(전 상태). 상태 매핑 게시중→접수 · 수령완료→완료
   (폐기물은 미표시). 카드는 사진+안내(수령=서명 필요 → 습득물 보기에서).
   미래 JWT 대비 wp_access_token key 방어적 동봉.
   ═══════════════════════════════════════════ */
var LF_STATUS_MAP = { '게시중':'접수', '수령완료':'완료' };  // 폐기물은 제외(미포함)
function _lfThumb(url){ var m=String(url).match(/\/d\/([a-zA-Z0-9_-]+)/); return m?('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400'):url; }
var _lfLoading = false;
function lfLoad(){
  if(_lfLoading) return;
  _lfLoading = true;
  var key=''; try{ key = localStorage.getItem('wp_access_token')||''; }catch(e){}
  var url = REG_API + '?action=lf_list&_=' + Date.now() + (key ? ('&key=' + encodeURIComponent(key)) : '');
  fetch(url, {redirect:'follow', cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      _lfLoading = false;
      if(!d || !d.ok){ _lfItems = []; _merge(); return; }
      var rows = Array.isArray(d.data) ? d.data : [];
      _lfItems = rows.filter(function(r){ return LF_STATUS_MAP[String(r.status||'')]; }).map(function(r){
        return {
          _lf: true,
          regId:    r.foundId  || '',
          category: '습득물 접수',
          dept:     '운영부',
          status:   LF_STATUS_MAP[String(r.status||'')],   // 게시중→접수 · 수령완료→완료
          _lfLabel: String(r.status||''),
          content:  r.itemDesc || '',
          loc:      r.foundLoc || '',
          foundWhen:r.foundWhen|| '',
          createdAt:r.createdAt|| '',
          photoUrl: r.photoUrl || '',
          keepLoc:      r.keepLoc      || '',
          memo:         r.memo         || '',
          ownerName:    r.ownerName    || '',
          ownerContact: r.ownerContact || ''
        };
      });
      _merge();
    })
    .catch(function(){ _lfLoading = false; /* 습득물 실패는 6종 보드 유지, 조용히 스킵 */ });
}

/* ═══════════════════════════════════════════
   ⏸️ 휴회 접수 = 8번째 카테고리로 통합 (같은 접수/처리중/완료 보드 · 읽기 전용)
   데이터: 회원쪽 GAS(REG_API와 다른 배포 — cpo/member/membership.html GAS_URL과 동일)
           member_hold_intake_list(ERP read + 서버 자동판정 · _SURVEY_PUBLIC_ACTIONS 등재로 토큰 게이트 면제).
   상태 매핑: 접수대기→접수 · 승인(휴회 진행중)→처리중 · 반려·완료(휴회 종료)→완료. 그 외 값=접수(보수적 폴백).
   승인/반려 기능 없음(회원 관리 화면 전용) — 카드에 바로가기 링크만 제공.
   ═══════════════════════════════════════════ */
var HOLD_API = 'https://script.google.com/macros/s/AKfycbykgMyFc-g_KG7x3HoKStKBwerKhYYfmbqNeFqCL5O1b_4-1nng4wEiKhkNJtfB4BWo/exec';
var HOLD_STATUS_MAP = { '접수대기':'접수', '승인':'처리중', '반려':'완료', '완료':'완료' };
var _holdLoading = false;
function holdLoad(){
  if(_holdLoading) return;
  _holdLoading = true;
  var key=''; try{ key = localStorage.getItem('wp_access_token')||''; }catch(e){}
  var url = HOLD_API + '?action=member_hold_intake_list' + (key ? ('&key=' + encodeURIComponent(key)) : '') + '&_=' + Date.now();
  fetch(url, {redirect:'follow', cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      _holdLoading = false;
      if(!d || !d.ok){ _holdItems = []; _merge(); return; }
      var rows = Array.isArray(d.data) ? d.data : [];
      _holdItems = rows.map(function(r){
        var vtxt = '판정: ' + (r.verdict || '-') + (r.verdictReason ? ' — ' + r.verdictReason : '');
        return {
          regId:     'H' + (r.intakeRow || ''),
          category:  '휴회 접수',
          dept:      '운영부',
          status:    HOLD_STATUS_MAP[String(r.status || '접수대기')] || '접수',
          createdAt: r.appliedAt || '',
          name:      r.name  || '',
          contact:   r.phone || '',
          content:   vtxt,
          holdKind:  r.kind  || '',
          holdStart: r.start || '',
          holdEnd:   r.end   || '',
          wishDays:  (r.wishDays != null ? r.wishDays + '일' : ''),
          holdReason:r.reason|| ''
        };
      });
      _merge();
    })
    .catch(function(){ _holdLoading = false; /* 휴회 실패는 나머지 7종 보드 유지, 조용히 스킵(실패 격리) */ });
}

/* ═══════════════════════════════════════════
   🖊️ 습득물 수령 서명 모달 (lost_found_gallery.html 포팅 — 순수 canvas·fetch, 외부lib 0)
   흐름: 카드 '수령' → _cur 채움 → openModal → 서명 → mConfirm → lf_handover(REG_API)
   ═══════════════════════════════════════════ */
var _cur = null;

/* 수령장소 옵션 */
(function(){ var s = $('m_loc'); if(!s) return; LOCATIONS.forEach(function(l){ var o = document.createElement('option'); o.value = l; o.textContent = l; s.appendChild(o); }); })();
/* 주는 담당자 옵션 (선택 placeholder + 7명 + 기타) */
(function(){
  var s = $('m_staff'); if(!s) return;
  var ph = document.createElement('option'); ph.value = ''; ph.textContent = '담당자 선택'; s.appendChild(ph);
  STAFF.forEach(function(n){ var o = document.createElement('option'); o.value = n; o.textContent = n; s.appendChild(o); });
  var e = document.createElement('option'); e.value = '기타'; e.textContent = '기타(직접 입력)'; s.appendChild(e);
})();
if($('m_staff')){
  $('m_staff').addEventListener('change', function(){
    var oth = $('m_staff_other');
    if(this.value==='기타'){ oth.style.display = 'block'; oth.focus(); }
    else { oth.style.display = 'none'; oth.value = ''; }
  });
}

function openModal(){
  var img = _cur.photo ? ('<img src="' + _esc(_lfThumb(_cur.photo)) + '" alt="">') : '';
  $('mItem').innerHTML = img + '<div><div class="mt">' + _esc(_cur.desc||'(설명 없음)') + '</div><div class="mm">' + _esc(_cur.id) + ' · 📍 ' + _esc(_cur.loc||'-') + '</div></div>';
  $('m_pw').value = ''; $('m_receiver').value = ''; $('m_staff').value = ''; $('m_staff_other').value = ''; $('m_staff_other').style.display = 'none';
  if(_cur.loc){ $('m_loc').value = _cur.loc; }
  clearPad();
  $('modalBack').classList.add('show');
  setTimeout(resizePad, 30);
}
function closeModal(){ $('modalBack').classList.remove('show'); _cur = null; }
$('mCancel').addEventListener('click', closeModal);
$('modalBack').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

/* ── 💬 실무진 피드백 모달 (GM 지시 2026-07-27) ──
   membership.html openStaffFeedback 패턴 그대로. 폼은 cpo/member/실무진피드백.html 하나뿐이고
   여기선 iframe으로 빌려 쓴다 — 항목·시트가 저절로 같아진다(사본을 두면 그 순간부터 어긋난다).
   지연 로드: 모달을 처음 열 때만 data-src→src 로 승격(페이지 첫 로딩을 무겁게 하지 않는다). */
function openStaffFeedback(){
  var fr = $('staffFeedbackFrame');
  if (fr && !fr.getAttribute('src')) fr.setAttribute('src', fr.getAttribute('data-src'));
  $('staffFeedbackBack').classList.add('show');
}
function closeStaffFeedback(){ $('staffFeedbackBack').classList.remove('show'); }
$('staffFeedbackBack').addEventListener('click', function(e){ if(e.target===this) closeStaffFeedback(); });

/* ── 📋 작업 현황 로그 모달 (GM 지시 2026-07-27) ──
   공용 패널은 원래 "▸ 작업 현황 로그" 한 줄로 접혀 있다. 팝업으로 열었다는 건 이미 보겠다는 뜻이라
   처음 열 때 한 번만 대신 펼쳐준다(패널 코드는 손대지 않는다 — 다른 페이지 동작 그대로). */
var _wlOpened = false;
function openWorklog(){
  $('worklogBack').classList.add('show');
  if(_wlOpened) return;
  // 패널 스크립트는 defer 로 늦게 붙는다 — 아직 없으면 잠깐 기다렸다 한 번 더 본다(최대 3초).
  var tries = 0;
  (function expand(){
    var t = $('worklogBack').querySelector('.wl-toggle');
    if(t){
      _wlOpened = true;
      if(t.getAttribute('aria-expanded') !== 'true') t.click();
      return;
    }
    if(++tries < 30) setTimeout(expand, 100);
  })();
}
function closeWorklog(){ $('worklogBack').classList.remove('show'); }
$('worklogBack').addEventListener('click', function(e){ if(e.target===this) closeWorklog(); });

/* ── 서명패드 (canvas + pointer → toDataURL PNG) ── */
var _signCv = $('signPad'), _signCtx = _signCv.getContext('2d'), _signDrawing = false, _signHasInk = false, _signLastX = 0, _signLastY = 0;
function resizePad(){
  var rect = _signCv.getBoundingClientRect(); if(!rect.width) return;
  var dpr = window.devicePixelRatio || 1;
  _signCv.width = Math.round(rect.width*dpr); _signCv.height = Math.round(rect.height*dpr);
  _signCtx.setTransform(dpr,0,0,dpr,0,0);
  _signCtx.lineWidth = 2.2; _signCtx.lineCap = 'round'; _signCtx.lineJoin = 'round'; _signCtx.strokeStyle = '#1a1a1a';
}
window.addEventListener('resize', function(){ if($('modalBack').classList.contains('show')){ resizePad(); } });
function _pt(e){ var r = _signCv.getBoundingClientRect(); var p = (e.touches && e.touches[0]) || e; return { x: p.clientX - r.left, y: p.clientY - r.top }; }
function _signStart(e){ e.preventDefault(); _signDrawing = true; var p = _pt(e); _signLastX = p.x; _signLastY = p.y; if(!_signHasInk){ _signHasInk = true; $('signHint').style.display = 'none'; } }
function _signMove(e){ if(!_signDrawing) return; e.preventDefault(); var p = _pt(e); _signCtx.beginPath(); _signCtx.moveTo(_signLastX,_signLastY); _signCtx.lineTo(p.x,p.y); _signCtx.stroke(); _signLastX = p.x; _signLastY = p.y; }
function _signEnd(){ _signDrawing = false; }
_signCv.addEventListener('pointerdown', _signStart); _signCv.addEventListener('pointermove', _signMove);
window.addEventListener('pointerup', _signEnd);
function clearPad(){ _signHasInk = false; _signCtx && _signCtx.clearRect(0,0,_signCv.width,_signCv.height); $('signHint').style.display = 'block'; }
$('signClear').addEventListener('click', clearPad);

/* ── 수령 확정 (lf_handover) ── */
$('mConfirm').addEventListener('click', function(){
  if(!_cur) return;
  var receiver = $('m_receiver').value.trim();
  if(!receiver){ toast('수령 회원 성함을 입력해 주세요', true); return; }
  if(!_signHasInk){ toast('수령 회원 서명을 받아주세요', true); return; }
  var staffSel = $('m_staff').value;
  var handoverStaff = (staffSel==='기타') ? $('m_staff_other').value.trim() : staffSel;
  if(!staffSel){ toast('주는 담당자를 선택해 주세요', true); return; }
  if(staffSel==='기타' && !handoverStaff){ toast('담당자 성함을 입력해 주세요', true); $('m_staff_other').focus(); return; }
  if($('m_pw').value.trim()!=='62611200'){ toast('비밀번호가 올바르지 않습니다', true); $('m_pw').focus(); return; }
  var sign = _signCv.toDataURL('image/png');
  var btn = this; btn.disabled = true; btn.textContent = '처리 중…';
  var payload = { action:'lf_handover', t:VOC_SUBMIT_TOKEN, id:_cur.id, receiver:receiver, handoverLoc:$('m_loc').value, handoverStaff:handoverStaff, signature:sign };
  fetch(REG_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify(payload), redirect:'follow' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      btn.disabled = false; btn.textContent = '수령 완료';
      if(d && d.ok){ toast(_cur.id + ' 수령완료 처리됨'); closeModal(); lfLoad(); }
      else { toast((d && d.error) || '수령 처리 실패', true); }
    })
    .catch(function(){ btn.disabled = false; btn.textContent = '수령 완료'; toast('네트워크 오류 — 다시 시도해 주세요', true); });
});

/* 보드 이벤트는 #board에 1회만 위임(재렌더마다 중복 부착 방지 — 상태변경 중복발송 버그 수정) */
function _wireBoard(){
  var board = document.getElementById('board');
  board.addEventListener('change', function(e){
    if(e.target && e.target.dataset && e.target.dataset.regAction==='status'){
      var _sel = e.target;
      _update(_sel.dataset.regId, _sel.dataset.regCat, {status:_sel.value}, null, _sel, _sel.getAttribute('data-prev-status')||'');
    }
  });
  board.addEventListener('click', function(e){
    var saveBtn = e.target.closest('[data-reg-save]');
    if(saveBtn){
      var card = saveBtn.closest('[data-reg-card]');
      if(!card) return;
      var payload = {};
      var a = card.querySelector('[data-reg-assignee]');
      var m = card.querySelector('[data-reg-memo]');
      var hd = card.querySelector('[data-reg-handler]');
      if(a) payload.assignee = a.value;
      if(m) payload.memo = m.value;
      if(hd) payload.handler = hd.value;
      _update(card.dataset.regCard, card.dataset.regCat, payload, saveBtn);
      return;
    }
    var claimBtn = e.target.closest('[data-lf-claim]');
    if(claimBtn){
      _cur = { id: claimBtn.dataset.lfClaim, desc: claimBtn.dataset.lfDesc, loc: claimBtn.dataset.lfLoc, photo: claimBtn.dataset.lfPhoto };
      openModal();
      return;
    }
    var delBtn = e.target.closest('[data-lf-del]');
    if(delBtn){
      var delId = delBtn.dataset.lfDel;
      if(!confirm('[' + delId + '] 습득물을 삭제할까요?')) return;
      delBtn.disabled = true;
      fetch(REG_API, { method:'POST', headers:{'Content-Type':'text/plain;charset=UTF-8'}, body:JSON.stringify({action:'lf_delete', t:VOC_SUBMIT_TOKEN, id:delId}), redirect:'follow' })
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(d && d.ok){ toast(delId + ' 삭제 완료'); lfLoad(); }
          else { toast((d && d.error) || '삭제 실패', true); delBtn.disabled = false; }
        })
        .catch(function(){ toast('네트워크 오류', true); delBtn.disabled = false; });
      return;
    }
  });
}

_wireBoard();
regLoad();
lfLoad();
holdLoad();
</script>
