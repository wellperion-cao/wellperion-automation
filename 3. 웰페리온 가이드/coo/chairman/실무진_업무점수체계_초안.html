<!-- 사내 게이트(단일 소스 _assets/gate.js) — GM업무.html과 동일(GM 지시 2026-08-05, 비밀번호 1531 통일). -->
<script src="../../_assets/gate.js" charset="utf-8"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  /* ── CSS = GM업무.html 을 본으로 그대로 따른다(형식 정본 재사용 — 새 디자인 체계 없음) ── */
  @page { size: A3 portrait; margin: 12mm; }

  :root{
    --deep:#22322D; --mid:#3D5A4F; --grey:#727B76; --line:#CBD2CD;
    --steam:#EDF1EE; --brass:#96762F;
    --alert:#A04E24; --alert-bg:#FBF1E7; --ink:#131B18; --pick:#E7EEE9;
    --font:'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
           'Malgun Gothic', '맑은 고딕', 'Apple SD Gothic Neo', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#8B948F;}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;}

  .sheet{
    width:297mm; min-height:420mm; margin:16px auto; background:#fff;
    padding:14mm 16mm 12mm; box-shadow:0 3px 22px rgba(0,0,0,.3);
  }

  .bar{width:297mm;margin:16px auto 0;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .bar button, .bar a{
    font-family:var(--font);font-size:13px;font-weight:600;
    padding:8px 16px;border:1px solid rgba(255,255,255,.45);
    background:rgba(255,255,255,.14);color:#fff;cursor:pointer;
    text-decoration:none;border-radius:2px;transition:.15s;
  }
  .bar button:hover, .bar a:hover{background:#fff;color:var(--deep);}

  .hd{border-bottom:3px solid var(--deep);padding-bottom:10px;margin-bottom:14px;}
  .brand{font-size:10px;font-weight:800;letter-spacing:.26em;color:var(--brass);margin:0 0 6px;}
  .hd h1{font-size:27px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px;}
  .hd .sub{font-size:14px;color:var(--grey);margin:0 0 12px;}
  .meta{display:flex;flex-wrap:wrap;gap:4px 28px;font-size:12.5px;}
  .meta b{color:var(--grey);font-weight:600;font-size:11px;letter-spacing:.08em;margin-right:6px;}

  /* 초안 안내 — 가장 먼저 보이게, 경고색 */
  .draft-banner{margin:14px 0 20px;padding:14px 16px;background:var(--alert-bg);
    border:2px solid var(--alert);font-size:14px;line-height:1.6;color:#5E3418;}
  .draft-banner b{color:var(--alert);font-weight:800;}
  .draft-banner .lbl{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;
    color:#fff;background:var(--alert);padding:3px 10px;border-radius:99px;margin-right:8px;}

  h2.sec-h{font-size:15.5px;font-weight:800;letter-spacing:.02em;margin:22px 0 8px;
    padding:7px 13px;background:var(--deep);color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  h2.sec-h .no{color:#C9D2CC;margin-right:8px;font-weight:600;}

  p.lede{font-size:13px;line-height:1.65;color:var(--ink);margin:0 0 10px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left;line-height:1.5;}
  th{background:var(--steam);font-weight:700;color:var(--deep);white-space:nowrap;}
  td.c,th.c{text-align:center;white-space:nowrap;}
  td.num{text-align:right;font-weight:700;color:var(--mid);white-space:nowrap;}
  tr.warn td{background:var(--alert-bg);}

  .stat-row{display:flex;flex-wrap:wrap;gap:8px 10px;margin:8px 0 14px;}
  .stat-row .chip{font-size:12px;font-weight:600;padding:5px 11px;border:1px solid var(--line);
    background:var(--steam);color:var(--mid);border-radius:99px;white-space:nowrap;}

  /* ★이대로면 생기는 문제 — 가장 눈에 띄게 */
  .crit-box{margin:8px 0 16px;padding:16px 18px;background:var(--alert-bg);
    border:3px solid var(--alert);break-inside:avoid;}
  .crit-box .crit-h{font-size:15px;font-weight:800;color:var(--alert);margin:0 0 9px;letter-spacing:-.01em;}
  .crit-box ul{margin:0;padding-left:19px;}
  .crit-box li{font-size:13px;line-height:1.6;margin-bottom:6px;color:#5E3418;}
  .crit-box li:last-child{margin-bottom:0;}
  .crit-box b{color:var(--alert);font-weight:800;}

  /* GM이 정할 것 5개 — A/B 카드 */
  .decision{margin-bottom:14px;border:1.5px solid var(--deep);break-inside:avoid;}
  .decision .dh{padding:8px 14px;background:var(--deep);color:#fff;font-size:13.5px;font-weight:800;
    display:flex;align-items:baseline;gap:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .decision .dh .dno{color:var(--brass);background:#fff;border-radius:99px;width:20px;height:20px;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
  .decision .db{display:grid;grid-template-columns:1fr 1fr;gap:0;}
  .decision .opt{padding:10px 14px;font-size:12.5px;line-height:1.6;}
  .decision .opt:first-child{border-right:1px solid var(--line);}
  .decision .opt .otag{display:inline-block;font-size:11px;font-weight:800;color:var(--brass);
    border:1px solid var(--line);border-radius:99px;padding:2px 9px;margin-bottom:5px;background:var(--steam);}
  .decision .opt .oeff{color:var(--grey);}
  .decision .fyi{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mid);
    background:var(--pick);}

  .note{margin:10px 0;padding:11px 14px;background:var(--alert-bg);
        border:1px solid #E5D1BC;font-size:12.5px;line-height:1.65;color:#5E3418;}
  .note b{color:var(--alert);font-weight:700;}

  .ft{border-top:1px solid var(--line);margin-top:16px;padding-top:6px;
      display:flex;justify-content:space-between;font-size:10.5px;color:var(--grey);}

  /* 키오스크 세로(1080)·좁은 창 — 용지 폭(297mm)보다 창이 좁으면 창 폭에 맞춘다.
     인쇄(@page)는 그대로. 2026-09-03 시우 · coo_page_guard 가로 잘림 6장 수리 */
  @media screen and (max-width: 1140px){ .sheet,.bar{width:100%;} }
  @media print{
    html,body{background:#fff;}
    .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;}
    .bar{display:none !important;}
    .crit-box,.decision,table{break-inside:avoid;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
