<meta charset="utf-8"><link rel="icon" type="image/png" href="/wellperion-automation/wellperion_favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* 최신본 자동 보장 — HTTP 캐시로 옛 버전이 떠 'GM 화면만 미반영'되는 문제 방지 (2026-05-29 COO).
   서버 최신본 버전과 비교해 다르면 1회만 강제 갱신. 루프 방지: ?pv 파라미터가 있으면(=1회 redirect 완료) 무조건 종료.
   (2026-06-04 CEO 수정: 기존 pv===__PV 가드가 CDN 버전 불일치 시 무한 새로고침 유발 → has('pv')로 교체) */
window.__PV='20260605-14';
(function(){
  window.addEventListener('pageshow',function(e){ if(e.persisted) location.reload(); });
  try{
    var u=new URL(location.href);
    if(u.searchParams.has('pv')) return;
    fetch(location.pathname,{cache:'no-store'}).then(function(r){return r.text();}).then(function(t){
      var m=t.match(/window\.__PV='([^']+)'/);
      if(m&&m[1]&&m[1]!==window.__PV){ u.searchParams.set('pv',m[1]); location.replace(u.toString()); }
    }).catch(function(){});
  }catch(e){}
})();
</script>
<title>웰페리온 결재 현황 SSOT</title>
<!-- 링크 미리보기(카톡 등) — OG 메타 (2026-06-01 GM) -->
<meta property="og:type" content="website">
<meta property="og:title" content="웰페리온 결재 현황 SSOT">
<meta property="og:description" content="결재 진행·완료·반려 현황을 한눈에. 링크를 열면 해당 화면이 그대로 표시됩니다.">
<meta name="description" content="웰페리온 결재 현황 SSOT — 결재 진행·완료·반려 현황">
<meta property="og:site_name" content="웰페리온">
<meta name="twitter:card" content="summary">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{
  --bg:#1a1815;--paper:#221F1B;--text:#E8E2D8;--dim:#8C7E6D;--dim-soft:#564a3d;
  --accent:#B79F8A;--accent-bg:rgba(183,159,138,0.12);--border:#3D3835;
  --green:#6abf7b;--green-bg:rgba(106,191,123,0.14);
  --red:#ED5B3F;--red-bg:rgba(237,91,63,0.14);
  --blue:#5B9FD5;--blue-bg:rgba(91,159,213,0.14);
  --yellow:#E0B341;--yellow-bg:rgba(224,179,65,0.14);
  --purple:#A78BDA;--purple-bg:rgba(167,139,218,0.14);
  --orange:#E6944E;--orange-bg:rgba(230,148,78,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%;font-size:15px;line-height:1.6;min-height:100vh}
.sticky-top{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border)}
.header{background:var(--paper);border-bottom:none;padding:10px 20px}
.header h1{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.header .sub{margin-top:2px;font-size:12px;color:var(--dim)}
.sheet-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sheet-links a{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--accent-bg);color:var(--accent);text-decoration:none;border:1px solid rgba(183,159,138,0.3)}
.sheet-links a:hover{opacity:0.85}
.header-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.header-right{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.sheet-link{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(183,159,138,0.3);text-decoration:none;white-space:nowrap;cursor:pointer;transition:background 0.15s}
.sheet-link:hover{background:rgba(183,159,138,0.22)}
.sheet-link svg{width:12px;height:12px;fill:currentColor;flex-shrink:0}
.content{padding:16px 20px 100px;max-width:100%;margin:0}
.loading{text-align:center;color:var(--dim);padding:40px 0;font-size:13px}
.filter-bar{background:var(--bg);padding:8px 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-row{display:flex;gap:4px;flex-wrap:nowrap;margin-bottom:6px;min-width:max-content}
.filter-row:last-child{margin-bottom:0}
.filter-btn{padding:6px 12px;border-radius:8px;background:none;color:var(--dim);border:1px solid transparent;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s}
.filter-btn:hover{background:var(--accent-bg)}
.filter-btn.active{background:var(--accent-bg);color:var(--accent);border-color:rgba(183,159,138,0.3)}
.share-btn{padding:6px 12px;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-bg);border:1px solid rgba(91,159,213,0.3);border-radius:8px;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:all 0.15s}
.share-btn:hover{opacity:0.85}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-card{background:var(--paper);border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center}
.stat-card .num{font-size:22px;font-weight:700;line-height:1.1}
.stat-card .label{font-size:11px;color:var(--dim);margin-top:4px}
.approval-card{background:var(--paper);border:1px solid rgba(255,255,255,0.4);border-left:3px solid var(--dim-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px;transition:background 0.1s}
.approval-card.st-done{border-left-color:var(--green)}
.approval-card.st-rejected,.approval-card.rejected{border-left-color:var(--red)}
.approval-card.st-progress{border-left-color:var(--blue)}
.approval-card.st-waiting{border-left-color:var(--yellow)}
.kanban-col-body .approval-card:nth-child(even){background:rgba(255,255,255,0.09)}
.approval-card:hover{background:rgba(183,159,138,0.04)}
.approval-card .title{font-size:14px;font-weight:700;flex:1;line-height:1.4}
.status-chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;flex-shrink:0;white-space:nowrap}
.status-chip.done{background:var(--green-bg);color:var(--green)}
.status-chip.rejected{background:var(--red-bg);color:var(--red)}
.status-chip.progress{background:var(--blue-bg);color:var(--blue)}
.status-chip.waiting{background:var(--yellow-bg);color:var(--yellow)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--accent-bg);color:var(--accent);font-weight:600;white-space:nowrap}
.chip.owner{background:var(--blue-bg);color:var(--blue)}
.owner-chip-btn{opacity:0.62;font-weight:700}
.owner-chip-btn:hover{opacity:0.88}
.owner-chip-btn.active{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 3px currentColor}
.chip.category{background:var(--purple-bg);color:var(--purple)}
.chip.budget{background:var(--green-bg);color:var(--green);font-weight:700}
.sign-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.sign-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 9px;border-radius:6px;background:var(--green-bg);color:var(--green);font-weight:600}
.sign-pill.empty{background:transparent;color:var(--dim);border:1px dashed var(--border)}
.sign-pill .time{font-size:10px;font-weight:500;opacity:0.85;margin-left:2px}
.complete-time{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 9px;border-radius:6px;background:var(--paper);color:var(--dim);border:1px solid var(--border);font-weight:600;margin-top:8px}
.opinion-block{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.opinion-title{font-size:11px;font-weight:700;color:var(--purple);margin-bottom:6px}
.opinion-row{background:var(--purple-bg);border-left:3px solid var(--purple);border-radius:6px;padding:6px 10px;margin:4px 0}
.opinion-who{font-size:11px;font-weight:700;color:var(--purple)}
.opinion-time{font-size:10px;color:var(--dim);margin-left:6px}
.opinion-text{font-size:13px;line-height:1.5;color:var(--text);white-space:pre-wrap;margin-top:2px;word-break:break-word}
.opinion-btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opinion-btn{font-size:11px;font-weight:600;padding:4px 10px;border-radius:7px;background:var(--purple-bg);color:var(--purple);border:1px solid rgba(167,139,218,0.3);cursor:pointer;font-family:inherit}
.opinion-btn:hover{opacity:0.85}
.detail-toggle{cursor:pointer;font-size:11px;color:var(--dim);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:4px;user-select:none}
.detail-toggle:hover{color:var(--accent)}
.detail-toggle .arrow{transition:transform 0.18s}
.detail-toggle.open .arrow{transform:rotate(90deg)}
.detail-body{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.detail-body.open{display:block}
/* [결재] 완료·반려 접이식 그룹 섹션 (전체 보기에서 진행중과 분리) */
.group-toggle{cursor:pointer;font-size:16px;font-weight:700;color:var(--text);margin:18px 0 4px;padding:11px 14px;border-radius:8px;background:var(--paper);border:1px solid var(--border);display:flex;align-items:center;gap:8px;user-select:none}
.group-toggle:hover{border-color:var(--accent)}
.group-toggle .arrow{transition:transform 0.15s;font-size:13px;color:var(--dim)}
.group-toggle.open .arrow{transform:rotate(90deg)}
.group-toggle .gcount{margin-left:auto;font-weight:600;color:var(--dim)}
.detail-body .body-text{font-size:13px;white-space:pre-wrap;line-height:1.55;color:var(--text)}
.progress-row{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:6px;margin:6px 0}
.progress-row .date{font-size:12px;font-weight:700;color:var(--accent);min-width:88px;flex-shrink:0}
.progress-row .text{font-size:13px;flex:1;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.empty-msg{text-align:center;padding:60px 20px;color:var(--dim);font-size:14px;line-height:1.6}
.empty-msg .ico{font-size:36px;display:block;margin-bottom:14px;opacity:0.5}
/* [결재-2] 카드 제목행 — 카테고리는 제목 옆, 결재대기 배지는 제목 아래, 담당자는 우측 */
.approval-card .title-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;flex-wrap:nowrap;}
.approval-card .title-row .card-title-area{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.approval-card .title-row .card-title-area .title-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.approval-card .title-row .card-title-area .title{font-size:14px;font-weight:700;min-width:0;word-break:break-word;line-height:1.4;background:rgba(255,255,255,0.06);padding:5px 9px;border-radius:7px;}
/* 카드 제목칸 배경 = 결재 상태 색 (업무현황 D-day 색 패턴, 2026-06-05 GM) */
.approval-card.st-waiting  .title-row .card-title-area .title{background:var(--yellow-bg);color:var(--yellow)}
.approval-card.st-progress .title-row .card-title-area .title{background:var(--blue-bg);color:var(--blue)}
.approval-card.st-done     .title-row .card-title-area .title{background:var(--green-bg);color:var(--green)}
.approval-card.st-rejected .title-row .card-title-area .title{background:var(--red-bg);color:var(--red)}
.approval-card .title-row .card-title-area .approval-badge-line{display:flex;flex-wrap:wrap;gap:4px;}
.approval-card .title-row .card-meta-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start;flex-shrink:0;max-width:200px;}
@media(max-width:400px){.approval-card .title-row{flex-wrap:wrap;}}
/* [결재] 결재 진행바 — 부서장→GM 단계 시각화 (약속 L09: 결재 종착=GM) */
.approval-steps{display:flex;align-items:flex-start;gap:0;margin:6px 0 8px;flex-wrap:wrap}
.approval-steps .step{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px}
.approval-steps .step-dot{font-size:13px;line-height:1.2}
.approval-steps .step-label{font-size:10px;color:var(--dim);white-space:nowrap}
.approval-steps .step.done .step-dot,.approval-steps .step.done .step-label{color:var(--green);font-weight:700}
.approval-steps .step.current .step-dot,.approval-steps .step.current .step-label{color:var(--blue);font-weight:700}
.approval-steps .step.pending .step-dot{opacity:0.5}
.approval-steps .step.reject .step-dot,.approval-steps .step.reject .step-label{color:var(--red);font-weight:700}
.approval-steps .conn{height:2px;width:24px;background:var(--border);margin-top:7px;border-radius:1px}
.approval-steps .conn.done{background:var(--green)}
/* [결재] 공유 링크 버튼 / 딥링크 하이라이트 */
.card-link-btn{background:none;border:none;cursor:pointer;font-size:12px;opacity:0.4;padding:0 2px;line-height:1;transition:opacity 0.15s;flex-shrink:0}
.card-link-btn:hover{opacity:1}
.deeplink-highlight{box-shadow:0 0 0 2px var(--accent),0 0 14px rgba(183,159,138,0.55)!important;transition:box-shadow 0.3s}
/* [결재-3] 대시보드 패널 — 업무 현황 SSOT와 동일 토큰 재사용 */
.dash-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.dash-overlay.show{display:flex;}
.dash-panel{background:var(--paper);border:1px solid var(--border);border-radius:16px;width:100%;max-width:700px;margin:40px auto;padding:28px 24px;}
.dash-panel h2{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;}
.dash-panel h2 .close-dash{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer;padding:4px 8px;}
.dash-panel h3{font-size:15px;font-weight:700;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.dash-table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 16px;}
.dash-table th,.dash-table td{padding:8px 10px;text-align:left;border:1px solid var(--border);}
.dash-table th{background:var(--bg);font-weight:700;color:var(--accent);font-size:12px;}
.dash-table td{vertical-align:middle;}
.dash-bar-wrap{height:16px;background:var(--bg);border-radius:8px;overflow:hidden;min-width:60px;}
.dash-bar{height:100%;border-radius:8px;transition:width 0.3s;}
.dash-bar.green{background:var(--green)}.dash-bar.blue{background:var(--blue)}.dash-bar.accent{background:var(--accent)}.dash-bar.red{background:var(--red)}.dash-bar.yellow{background:var(--yellow)}.dash-bar.purple{background:var(--purple);}
.dash-stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px;}
.dash-stat-card{flex:1;min-width:100px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:center;}
.dash-stat-card .num{font-size:24px;font-weight:700;color:var(--accent);}
.dash-stat-card .label{font-size:11px;color:var(--dim);margin-top:2px;}
.dash-print-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.dash-print-btn:hover{border-color:var(--accent);color:var(--accent);}
/* ── [결재-뷰] 뷰 토글(트렐로/캘린더) — 업무현황 SSOT 토큰 통일 (2026-06-02 시모) ── */
.view-toggle-btn{padding:6px 12px;font-size:12px;font-weight:700;color:var(--dim);background:var(--paper);border:none;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all 0.15s}
.view-toggle-btn+.view-toggle-btn{border-left:1px solid var(--border)}
.view-toggle-btn.active{background:var(--accent);color:#fff}
.view-toggle-btn:hover:not(.active){background:var(--accent-bg);color:var(--accent)}
/* ── [결재-칸반] 결재상태별 컬럼 보드 — 좌→우 가로 나열 + 보드 전체 가로 스크롤 ── */
.kanban-board{display:flex;flex-direction:row;align-items:flex-start;gap:14px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:thin;scrollbar-color:var(--dim-soft) transparent;-webkit-overflow-scrolling:touch;cursor:grab}
.kanban-board.dragging{cursor:grabbing}
.kanban-board::-webkit-scrollbar{height:8px}
.kanban-board::-webkit-scrollbar-track{background:transparent}
.kanban-board::-webkit-scrollbar-thumb{background:var(--dim-soft);border-radius:4px}
.kanban-board::-webkit-scrollbar-thumb:hover{background:var(--dim)}
.kanban-board::after{content:'';flex-shrink:0;width:8px}
/* 컬럼 = 결재상태 그룹. 고정폭 450px (업무현황과 통일). 컬럼 헤더 + 카드 세로 스택 */
.kanban-col{flex:0 0 auto;width:450px;align-self:stretch;background:var(--paper);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.kanban-col-head{padding:10px 14px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;border-top:3px solid var(--dim-soft)}
.kanban-col.col-waiting .kanban-col-head{border-top-color:var(--yellow);color:var(--yellow)}
.kanban-col.col-gm .kanban-col-head{border-top-color:var(--blue);color:var(--blue)}
.kanban-col.col-rep .kanban-col-head{border-top-color:var(--accent);color:var(--accent)}
.kanban-col.col-done .kanban-col-head{border-top-color:var(--green);color:var(--green)}
.kanban-col.col-reject .kanban-col-head{border-top-color:var(--red);color:var(--red)}
.kanban-col-head .kcount{margin-left:auto;font-size:12px;font-weight:600;color:var(--dim)}
.kanban-col-body{padding:10px 12px;display:flex;flex-direction:column;gap:16px;min-height:60px}
.kanban-col-body .approval-card{margin-bottom:0}
.kanban-col-empty{font-size:12px;color:var(--dim);padding:14px 4px;text-align:center}
/* ── [결재-캘린더] 월별 달력 (G1 gm1CalRender 패턴 이식) ── */
.cal-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cal-nav-btn{padding:6px 14px;font-size:13px;font-weight:700;border-radius:8px;cursor:pointer;font-family:inherit;background:var(--paper);color:var(--text);border:1px solid var(--border)}
.cal-nav-btn:hover{background:var(--accent-bg);color:var(--accent)}
.cal-month-label{font-size:16px;font-weight:700;min-width:120px;text-align:center}
.cal-legend{margin-left:auto;font-size:11px;color:var(--dim)}
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal-table th{padding:6px 4px;text-align:center;font-size:12px;font-weight:700;color:var(--dim)}
.cal-table td{vertical-align:top;padding:4px 3px;border:1px solid var(--border);height:84px;width:14.28%}
.cal-daynum{font-size:12px;font-weight:700;margin-bottom:3px}
.cal-badge{font-size:10px;border-radius:4px;padding:1px 5px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal-badge:hover{filter:brightness(1.15)}

<script>
const TODO_API_URL = 'https://script.google.com/macros/s/AKfycbxDwFkrxK1YIaEoSNcuw2MiHiZQ-7o5N6311ytksSyeEd86ZFOhLknOWqQgNArQvZ-7/exec';

const CAT_COLORS = {
  '[1] 매출 및 영업':  {bg:'var(--blue-bg)',   color:'var(--blue)'},
  '[2] 인사':          {bg:'var(--purple-bg)', color:'var(--purple)'},
  '[3] 파트너팀':      {bg:'var(--accent-bg)', color:'var(--accent)'},
  '[4] 운영 정책':    {bg:'var(--accent-bg)', color:'var(--accent)'},
  '[5] 시설 및 환경':  {bg:'var(--green-bg)',  color:'var(--green)'},
  '[6] 회원·CS':       {bg:'var(--red-bg)',    color:'var(--red)'},
  '[7] IT·시스템·자동화':{bg:'var(--blue-bg)',  color:'var(--blue)'},
  '[8] 교육·조직문화': {bg:'var(--yellow-bg)', color:'var(--yellow)'},
  '[9] 회의':          {bg:'var(--orange-bg)', color:'var(--orange)'}
};

/* 카테고리 → 부서장 매핑 (결재선 1단계 자동 복원, 2026-06-10 GM 확정 9분류).
   인사·파트너팀=나우열M([2][3]) / 운영부=이경연 실장([4]) / 시설부=이정헌 소장([5]).
   매핑 없는 카테고리([1][6][7][8][9])는 부서장 생략 → GM 단독(약속 L09: 결재 종착=GM). */
const CAT_DEPT_HEAD = {
  '[2] 인사':        '나우열M',
  '[3] 파트너팀':    '나우열M',
  '[4] 운영 정책':   '이경연 실장',
  '[5] 시설 및 환경': '이정헌 소장'
};
function deptHeadFor(category) { return CAT_DEPT_HEAD[category] || ''; }
const DEPT_HEADS = ['이경연 실장','이정헌 소장','나우열M'];

/* 담당자별 이름 배경색 (사람마다 고유색 — 업무현황 SSOT와 동일 맵, 2026-06-05 동기화) */
const OWNER_COLORS = {
  '이경연 실장': {bg:'var(--blue-bg)',   color:'var(--blue)'},
  '이정헌 소장': {bg:'var(--green-bg)',  color:'var(--green)'},
  '나우열M':     {bg:'var(--purple-bg)', color:'var(--purple)'},
  '최준용M':     {bg:'var(--accent-bg)', color:'var(--accent)'},
  '임정은M':     {bg:'var(--red-bg)',    color:'var(--red)'},
  '윤병현AM':    {bg:'var(--yellow-bg)', color:'var(--yellow)'},
  '이지영 사원': {bg:'var(--orange-bg)', color:'var(--orange)'},
  '김남욱GM':    {bg:'var(--accent-bg)', color:'var(--accent)'},
  '전응준 대표': {bg:'var(--red-bg)',    color:'var(--red)'}
};
function ownerChip(name) {
  var c = OWNER_COLORS[name];
  var style = c ? 'background:' + c.bg + ';color:' + c.color + ';' : '';
  return '<span class="chip owner" style="' + style + '">' + esc(name) + '</span>';
}
// 항목의 부서장 실명 — 카테고리 매핑 우선, 없으면 결재요청에 포함된 부서장 (결재자 필터·카운트용, 2026-06-03 GM)
function deptHeadNameOf(t) {
  // 우선순위 (2026-06-05 GM: GM이 직접 고른 결재자가 최우선): ① 결재요청에 명시된 부서장 → ② 담당자가 부서장이면 본인 → ③ 카테고리 자동매핑.
  var _reqDH = String((t && (t.approval || t['결재요청'])) || '').split(',').map(function(s){ return s.trim(); }).find(function(m){ return DEPT_HEADS.indexOf(m) >= 0; });
  if (_reqDH) return _reqDH;
  var owners = String((t && t.owner) || '').split(',').map(function(s){ return s.trim(); });
  var ownerDH = owners.find(function(o){ return DEPT_HEADS.indexOf(o) >= 0; });
  if (ownerDH) return ownerDH;
  return deptHeadFor(t && t.category) || '';
}

let ALL_TASKS = [];
let activeFilter = '전체';      // '전체' | '결재완료' | '반려' | '미결'
let activeRoleFilter = '전체';  // '전체' | 부서장 실명 | 'GM' (약속 L09: 대표 단계 폐지)
let activeCatFilter = '전체';   // '전체' | 카테고리
let searchQuery = '';            // 키워드
let activeSortBy = '최신순';    // '최신순' | '결재상태' | '카테고리' | '시작일순'
// [결재-뷰] 뷰 모드: 'kanban'(기본) | 'calendar'. 리스트 폐지(2026-06-03 GM·업무현황 파리티). localStorage 유지
let currentView = 'kanban';  // 캘린더 뷰 제거(2026-06-03 GM 정리) — 칸반 단일
let calViewYear, calViewMonth;  // 캘린더 표시 연·월 (init은 첫 렌더에서)

document.addEventListener('DOMContentLoaded', function() {
  updateHeaderSub();
  loadTasks();
});

// 헤더 메타 — 업무 현황 SSOT와 동일 형식 (날짜(요일) | 담당자)
function getUser() {
  return '김남욱GM';
}
function updateHeaderSub() {
  return; // 헤더는 정적 설명문 사용 (2026-05-30 GM) — 날짜|담당자 덮어쓰기 중단
  const u = getUser();
  const now = new Date();
  const days = ['일','월','화','수','목','금','토'];
  const ds = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const elSub = document.getElementById('headerSub');
  if (elSub) elSub.textContent = ds + ' (' + days[now.getDay()] + ')' + (u ? ' | ' + u : '');
}

async function loadTasks() {
  const el = document.getElementById('mainContent');
  el.innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const qs = 'action=todo_list';
    const r = await fetch(TODO_API_URL + '?' + qs, { redirect:'follow' });
    const res = await r.json();
    if (res.ok) {
      ALL_TASKS = (res.data || []).map(normalizeTask);
      applyUrlParams();
      render();
      handleDeepLink();
    } else {
      el.innerHTML = '<div class="empty-msg"><span class="ico">⚠️</span>데이터 로드 실패<br><span style="font-size:12px;color:var(--dim);">' + esc(res.error || '') + '</span></div>';
    }
  } catch (e) {
    el.innerHTML = '<div class="empty-msg"><span class="ico">⚠️</span>연결 실패<br><span style="font-size:12px;color:var(--dim);">' + esc(e.message) + '</span></div>';
  }
}

function normalizeTask(r) {
  const t = {};
  Object.keys(r).forEach(k => { t[k] = r[k]; });
  // 영문 alias
  t.id = r.id;
  t.title = r['업무명'] || r.title || '';
  t.category = r['카테고리'] || r.category || '';
  t.owner = r['담당자'] || r.owner || '';
  t.content = r['내용'] || r.content || '';
  t.startDate = r['시작일'] || r.startDate || '';
  t.endDate = r['종료일'] || r.endDate || '';
  t.status = r['상태'] || r.status || '';
  t.approval = r['결재요청'] || r.approval || '';
  t.deptSign = r['부서장싸인'] || '';
  t.gmSign = r['GM싸인'] || '';
  t.repSign = r['대표싸인'] || '';
  t.approvalStatus = r['결재상태'] || '';
  t.completeTime = r['결재완료시각'] || '';
    t.opinions = r['결재의견'] || '';
  t.reportUrl = r['결과보고서URL'] || '';
  t.updatedAt = r['수정일'] || r.updatedAt || '';
  t.createdAt = r['생성일'] || r.createdAt || '';
  return t;
}

function render() {
  const el = document.getElementById('mainContent');
  // 결재 관련 건 (결재상태 있거나 결재요청이 체크된 모든 행) — 2026-05-28 보강
  const approvalTasks = ALL_TASKS.filter(t => (t.approvalStatus && String(t.approvalStatus).trim()) || (t.approval && String(t.approval).trim()));

  // 통계 — funnel 단계별 카운트 (2026-05-28 GM 결재)
  const done = approvalTasks.filter(t => t.approvalStatus === '결재완료');
  const rejected = approvalTasks.filter(t => /반려/.test(t.approvalStatus));
  const pending = approvalTasks.filter(t => t.approvalStatus !== '결재완료' && !/반려/.test(t.approvalStatus));
  const gmSigned = approvalTasks.filter(t => String(t.gmSign || '').trim());

  let html = '';

  // 통계 카드 제거 (2026-05-30 GM: 업무현황 SSOT처럼) — 상태 필터(전체/진행중/결재완료/반려)와 중복.
  // 툴바(필터·정렬·검색)를 제목 아래 최상단으로. GM·대표 세분 수치는 '결재 현황 대시보드'에서 확인.

  // 결재자별 카운트 (미결만) — 부서장 3명(결재선 1단계) + GM(최종) (2026-06-16 대표 단계 폐지)
  const pendingByRole = { '이경연 실장':0, '이정헌 소장':0, '나우열M':0, 'GM':0 };
  pending.forEach(t => {
    const parsed = parseContent(t.content);
    const route = buildEffectiveRoute(t, parsed.budget);
    const nxt = nextApprover(t, route);  // '지금 서명할 차례' 기준 — 버튼 숫자=클릭 결과 일치
    if (nxt === '부서장') { const dn = deptHeadNameOf(t); if (dn && dn in pendingByRole) pendingByRole[dn]++; }
    else if (nxt && nxt in pendingByRole) pendingByRole[nxt]++;
  });

  // 카테고리 목록 (실측)
  const catSet = {};
  approvalTasks.forEach(t => { if (t.category) catSet[t.category] = (catSet[t.category]||0) + 1; });
  const catList = Object.keys(catSet).sort();

  // [결재-1] 1줄 — 상태 필터 + 정렬 드롭다운 + 대시보드·인쇄·보고용 (업무현황 정렬식 통일 · sticky 풀폭)
  let stHtml = '';
  // 상태 필터 버튼(전체/진행중/결재완료/반려) 삭제 — 칸반에 완료·반려 칸이 이미 있어 중복·칸반서 미반영 (2026-06-05 GM)
  // activeFilter 기본값 '전체' 유지 → 칸반에 전체 표시. 건수는 각 칸반 칸 머리글에 노출.
  stHtml += '<div style="display:flex;gap:4px;margin-left:auto;align-items:center;flex-shrink:0;">';
  // [결재-뷰] 뷰 토글: 트렐로(칸반) / 캘린더. 선택 뷰는 localStorage 유지 (2026-06-02 시모)
  stHtml += '<div style="display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;margin-right:4px;">';
  
  
  stHtml += '</div>';
  stHtml += '<select onchange="setSort(this.value)" style="background:var(--paper);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;flex-shrink:0;">';
  ['최신순','결재상태','카테고리','시작일순'].forEach(function(opt) {
    stHtml += '<option value="' + opt + '"' + (activeSortBy === opt ? ' selected' : '') + '>' + opt + (opt === '최신순' ? ' ▼' : '') + '</option>';
  });
  stHtml += '</select>';
  stHtml += '<button class="share-btn" onclick="openApprovalDashboard()" style="background:var(--purple-bg);color:var(--purple);border-color:rgba(167,139,218,0.3);">결재 현황 대시보드</button>';
  stHtml += '<button class="share-btn" onclick="printApprovalCards()" style="background:var(--accent-bg);color:var(--accent);border-color:rgba(183,159,138,0.3);">🖨 인쇄</button>';
  stHtml += '<button class="share-btn" onclick="shareReport()" style="background:var(--purple-bg);color:var(--purple);border-color:rgba(167,139,218,0.3);">보고용</button>';
  stHtml += '<button class="share-btn" onclick="shareList()">공유용</button>';
  stHtml += '</div>';
  document.getElementById('statusFilters').innerHTML = stHtml;

  // 2줄 — 결재자(담당자) 버튼 — 업무현황 담당자 줄처럼 라벨 없이 버튼만 (2026-06-01 GM)
  let owHtml = '';
  owHtml += '<button class="filter-btn ' + (activeRoleFilter==='전체'?'active':'') + '" onclick="setRoleFilter(\'전체\')">전체</button>';
  // 부서장 3명 — 결재선 1단계(GM 앞). 운영부=이경연([1][3])·시설부=이정헌([4])·파트너팀=나우열([2]) (2026-06-03 GM)
  DEPT_HEADS.forEach(function(dh){
    var _ocd = OWNER_COLORS[dh] || {bg:'var(--accent-bg)',color:'var(--accent)'};
    owHtml += '<button class="filter-btn owner-chip-btn ' + (activeRoleFilter===dh?'active':'') + '" style="background:'+_ocd.bg+';color:'+_ocd.color+';" onclick="setRoleFilter(\'' + dh + '\')">' + dh + ' (' + pendingByRole[dh] + ')</button>';
  });
  owHtml += '<button class="filter-btn owner-chip-btn ' + (activeRoleFilter==='GM'?'active':'') + '" style="background:var(--accent-bg);color:var(--accent);" onclick="setRoleFilter(\'GM\')">김남욱GM (' + pendingByRole['GM'] + ')</button>';
  document.getElementById('ownerFilters').innerHTML = owHtml;

  // 3줄 — 카테고리 버튼 — 업무현황처럼 라벨 없이
  let ctHtml = '';
  ctHtml += '<button class="filter-btn ' + (activeCatFilter==='전체'?'active':'') + '" onclick="setCatFilter(\'전체\')">전체</button>';
  catList.forEach(cat => {
    const _a = activeCatFilter === cat ? 'active' : '';
    ctHtml += '<button class="filter-btn ' + _a + '" onclick="setCatFilter(\'' + escAttr(cat) + '\')">' + esc(cat) + ' (' + catSet[cat] + ')</button>';
  });
  document.getElementById('catFilters').innerHTML = ctHtml;

  // 4줄 — 검색 (IME 한글 조합 끊김 방지 — 업무 현황 SSOT 패턴 이식 2026-06-02)
  //   input은 최초 1회만 생성·재사용. 재렌더 시 innerHTML로 교체하면 조합 중 DOM이 교체돼
  //   자모 분리·포커스 유실이 발생한다. ✕ 초기화 버튼만 토글하고 input은 절대 손대지 않는다.
  const searchEl = document.getElementById('searchRow');
  let si = document.getElementById('searchInput');
  if (!si) {
    searchEl.innerHTML =
      '<input type="text" id="searchInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="업무명·내용·담당자 검색" style="flex:1;background:var(--paper);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-family:inherit;">'
      + '<button type="button" id="searchClearBtn" class="filter-btn" onclick="clearSearch()" style="display:none;">✕ 초기화</button>';
    si = document.getElementById('searchInput');
    si.value = searchQuery;  // 최초 1회만 (딥링크 q 반영)
    // 한글 IME: 조합 중에는 재렌더 금지 — 조합 중 input→render가 자모 'ㄱ' 잔존 버그 유발(2026-06-03 GM).
    var _composing = false, _searchT = null;
    function _runSearch(){ clearTimeout(_searchT); _searchT = setTimeout(function(){ if (!_composing) setSearch(si.value); }, 280); }
    si.addEventListener('compositionstart', function(){ _composing = true; });
    si.addEventListener('compositionend', function(){ _composing = false; _runSearch(); });
    si.addEventListener('input', _runSearch);
  }
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) clearBtn.style.display = searchQuery ? '' : 'none';


  // 필터링
  let list = approvalTasks;
  if (activeFilter === '결재완료') list = done;
  else if (activeFilter === '반려') list = rejected;
  else if (activeFilter === '미결') list = pending;

  // 카테고리 필터
  if (activeCatFilter !== '전체') {
    list = list.filter(t => t.category === activeCatFilter);
  }

  // [결재] 결재자별 차례 필터 (미결 한정) — 부서장 3명·GM (약속 L09: 대표 단계 폐지)
  if (activeRoleFilter !== '전체') {
    const _isDeptHead = DEPT_HEADS.indexOf(activeRoleFilter) >= 0;
    list = list.filter(t => {
      if (t.approvalStatus === '결재완료' || /반려/.test(t.approvalStatus)) return false;
      const parsed = parseContent(t.content);
      const route = buildEffectiveRoute(t, parsed.budget);
      const nxt = nextApprover(t, route);
      // 그 사람이 '지금 서명할 차례'인 건만 (칸반 본인 칸과 1:1) (2026-06-05 GM)
      if (_isDeptHead) return nxt === '부서장' && deptHeadNameOf(t) === activeRoleFilter;
      return nxt === activeRoleFilter;
    });
  }

  // 검색
  if (searchQuery && searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(t => {
      const _p = parseContent(t.content || '');
      const _lg = (_p.logs || []).map(function(l){ return (l.date||'') + ' ' + (l.text||''); }).join(' ');
      const _bd = _p.budget ? (_p.budget.category + ' ' + _p.budget.amount) : '';
      const blob = [t.title, t.owner, t.category, _p.body, _p.plan, _p.result, _lg, _bd].filter(Boolean).join(' ').toLowerCase();
      return blob.includes(q);
    });
  }

  // 정렬 — activeSortBy에 따라 분기
  if (activeSortBy === '결재상태') {
    // 백엔드 실제 결재상태 문자열 기준 (apps_script_todo.js): '결재완료' / 'GM 완료'·'부서장 완료' / 'GM 반려' 등 / '대기'. (구 '대표님 *' 문자열은 /완료|반려/ 일반 매칭으로 하위호환)
    const stRank = t => {
      const s = String(t.approvalStatus || '');
      if (s === '결재완료') return 0;        // 전 라인 승인
      if (/반려/.test(s)) return 1;          // 반려 (GM/부서장)
      if (/완료/.test(s)) return 2;          // 중간 단계 완료 = 진행 중
      if (s === '대기') return 4;            // 미착수
      return 5;                              // 기타·미설정
    };
    list.sort((a, b) => stRank(a) - stRank(b) || String(a.title).localeCompare(String(b.title)));
  } else if (activeSortBy === '카테고리') {
    list.sort((a, b) => String(a.category || '').localeCompare(String(b.category || '')) || String(a.title).localeCompare(String(b.title)));
  } else if (activeSortBy === '시작일순') {
    list.sort((a, b) => String(b.startDate || '').localeCompare(String(a.startDate || '')));
  } else {
    // 최신순(기본): 생성일(createdAt) 최신 상단 — GM 2026-06-12 (생성일 결측 시 수정일→시작일→완료시각 폴백)
    const sortKey = t => String(t.createdAt || t['생성일'] || t.updatedAt || t['수정일'] || t.startDate || t['시작일'] || t.completeTime || '');
    list.sort((a, b) => sortKey(b).localeCompare(sortKey(a)));
  }

  // 인쇄(카드 기준)용 — 현재 필터·정렬 반영 리스트 보관 (2026-06-03 GM)
  window._lastApprovalList = list;

  // [결재-뷰] 칸반·캘린더 뷰 — 필터·검색·정렬이 적용된 list를 그대로 그린다 (2026-06-02 시모)
  if (currentView === 'kanban') {
    el.innerHTML = renderKanban(list);
    initKanbanDrag();
    return;
  }
  if (currentView === 'calendar') {
    el.innerHTML = renderCalendar(list);
    return;
  }

  if (!list.length) {
    html += '<div class="empty-msg"><span class="ico">📂</span>해당 조건의 결재 건이 없습니다.<br><span style="font-size:12px;color:var(--dim);">필터를 조정하거나 업무 현황 SSOT에서 결재요청을 체크해 보세요.</span></div>';
  } else if (activeFilter === '전체') {
    // 전체 보기: 진행 중은 펼쳐 보이고, 결재완료·반려는 접이식 섹션으로 분리 (2026-06-01 GM)
    const gPend = list.filter(t => t.approvalStatus !== '결재완료' && !/반려/.test(t.approvalStatus));
    const gDone = list.filter(t => t.approvalStatus === '결재완료');
    const gRej  = list.filter(t => /반려/.test(t.approvalStatus));
    let n = 0;
    html += '<div style="font-size:12px;color:var(--dim);margin-bottom:8px;">진행 중 ' + gPend.length + '건'
      + (gDone.length ? ' · 완료 ' + gDone.length : '') + (gRej.length ? ' · 반려 ' + gRej.length : '') + '</div>';
    if (gPend.length) {
      gPend.forEach(t => { html += renderApprovalCard(t, ++n); });
    } else {
      html += '<div style="font-size:13px;color:var(--dim);padding:10px 0 4px;">진행 중인 결재 건이 없습니다.</div>';
    }
    if (gDone.length) {
      html += '<div class="group-toggle" onclick="toggleDetail(this)"><span class="arrow">▶</span>✅ 결재완료<span class="gcount">' + gDone.length + '건</span></div>';
      html += '<div class="detail-body">';
      gDone.forEach(t => { html += renderApprovalCard(t, ++n); });
      html += '</div>';
    }
    if (gRej.length) {
      html += '<div class="group-toggle" onclick="toggleDetail(this)"><span class="arrow">▶</span>❌ 반려<span class="gcount">' + gRej.length + '건</span></div>';
      html += '<div class="detail-body">';
      gRej.forEach(t => { html += renderApprovalCard(t, ++n); });
      html += '</div>';
    }
  } else {
    html += '<div style="font-size:12px;color:var(--dim);margin-bottom:8px;">총 ' + list.length + '건 표시</div>';
    list.forEach((t, i) => { html += renderApprovalCard(t, i + 1); });
  }

  // mainContent만 갱신 — 검색 input(#searchRow)은 별도 고정 DOM이라 건드리지 않음.
  //   따라서 포커스·한글 IME 조합·캐럿이 그대로 유지된다(focus 복원 hack 불필요).
  el.innerHTML = html;
}

function setRoleFilter(r) { activeRoleFilter = r; render(); }
function setCatFilter(c) { activeCatFilter = c; render(); }
function setSearch(q) { searchQuery = q; render(); }
function setSort(s) { activeSortBy = s; render(); }
/* ✕ 초기화 — 사용자 액션이라 .value 직접 비움(조합 중 아님) */
function clearSearch() {
  const si = document.getElementById('searchInput');
  if (si) si.value = '';
  searchQuery = '';
  render();
  if (si) si.focus();
}

/* ─── 공유 링크 / 딥링크 (2026-06-01 GM) ─── */
let _deepLinkId = null;
function applyUrlParams() {
  try {
    const p = new URL(location.href).searchParams;
    const item = p.get('item');
    if (item) { _deepLinkId = item; activeFilter = '전체'; activeRoleFilter = '전체'; activeCatFilter = '전체'; searchQuery = ''; return; }
    if (p.get('f')) activeFilter = p.get('f');
    if (p.get('role')) activeRoleFilter = p.get('role');
    if (p.get('cat')) activeCatFilter = p.get('cat');
    if (p.get('sort')) activeSortBy = p.get('sort');
    if (p.get('q')) searchQuery = p.get('q');
  } catch (e) {}
}
function buildShareUrl() {
  const u = new URL(location.origin + location.pathname);
  if (activeFilter && activeFilter !== '전체') u.searchParams.set('f', activeFilter);
  if (activeRoleFilter && activeRoleFilter !== '전체') u.searchParams.set('role', activeRoleFilter);
  if (activeCatFilter && activeCatFilter !== '전체') u.searchParams.set('cat', activeCatFilter);
  if (activeSortBy && activeSortBy !== '최신순') u.searchParams.set('sort', activeSortBy);
  if (searchQuery && searchQuery.trim()) u.searchParams.set('q', searchQuery.trim());
  return u.toString();
}
// ── [결재 카드 인쇄] 카드 기준 + 남은 결재자별 서명칸 (2026-06-03 GM) ──
// 현재 필터·정렬 반영된 카드를 한꺼번에 인쇄. 각 카드에 '아직 서명 안 한 결재자'만 서명칸으로 표시.
// 결재 보고서 인쇄 — 업무 현황 보고서(rr-page)와 동일 문서 품질로 통일 (2026-06-16 GM).
//   업무 보고서의 헤더·정보표·섹션·푸터 레이아웃을 그대로 쓰되, 결재 고유 요소(결재선·서명란·대표 서명완료)를 보존·강화.
function buildApprovalPrint(list) {
  var nameMap = { 'GM': '김남욱 GM' };
  if (!list.length) return '<div class="rr-page"><div class="rr-empty">인쇄할 결재 건이 없습니다.</div></div>';

  var today = todayDateStr();

  return list.map(function(t) {
    var parsed = parseContent(t.content || '');
    var route = buildEffectiveRoute(t, parsed.budget);
    var signMap = { '부서장': t.deptSign, 'GM': t.gmSign };
    var pending = route.filter(function(r){ return !String(signMap[r] || '').trim(); });
    var _repDone = /^https?:\/\//.test(String(t.repSign || '').trim());

    /* ── 결재란 (헤더 우측 도장표) — 결재선 단계별 서명상태 표기 ── */
    var apRoles = route.slice();           // 부서장→GM 순서 (buildEffectiveRoute 산출)
    // 상단 결재란이 유일한 서명 공간 — 서명된 단계는 ✅, 미서명은 실제 도장·서명 받는 빈 칸(height로 공간 확보).
    var apCells = apRoles.map(function(r){
      var label = (r === '부서장') ? (deptHeadNameOf(t) || '부서장') : (nameMap[r] || r);
      var signed = String(signMap[r] || '').trim();
      return '<td><div class="rr-approval-role">' + esc(label) + ' (인)</div>'
        + '<div class="rr-approval-sign">' + (signed ? '✅' : '') + '</div></td>';
    });
    // 대표 단계 — URL=서명본(서명완료) ✅, 그 외=빈 서명 공간 (페이퍼 도장칸).
    apCells.push('<td><div class="rr-approval-role">전응준 대표 (인)</div>'
      + '<div class="rr-approval-sign">' + (_repDone ? '✅ 서명완료' : '') + '</div></td>');
    var approvalHtml = '<table class="rr-approval-table"><tr>'
      + '<td class="rr-approval-label">결재</td>' + apCells.join('') + '</tr></table>';

    /* ── 정보표 ── */
    var sd = String(t.startDate || '').slice(0, 10), ed = String(t.endDate || '').slice(0, 10);
    var period = (sd || ed) ? esc(sd + (ed ? ' ~ ' + ed : '')) : '-';
    var statusStr = esc(t.status || t['결재상태'] || t.approvalStatus || '-') || '-';
    var infoRows = [
      ['결재 제목', esc(t.title || '(제목 없음)')],
      ['카테고리', esc(t.category || '-')],
      ['담당', esc(t.owner || '-')],
      ['기간', period],
      ['결재상태', statusStr]
    ];
    var infoHtml = '<table class="rr-info-table">'
      + infoRows.map(function(r){ return '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td></tr>'; }).join('')
      + '</table>';

    /* ── 결재선 (부서장→GM 종착, 대표 페이퍼 단계 포함) ── */
    var routeSteps = apRoles.map(function(r){
      return (r === '부서장') ? (deptHeadNameOf(t) || '부서장') : (nameMap[r] || r);
    });
    routeSteps.push('전응준 대표');
    var routeHtml = '<div class="rr-route"><b>결재선</b> '
      + routeSteps.map(function(s){ return '<span class="rr-route-step">' + esc(s) + '</span>'; })
                  .join('<span class="rr-route-arrow">→</span>')
      + '</div>';

    /* ── 본문 ── */
    var bodyHtml = (parsed.body && parsed.body.trim())
      ? '<div class="rr-section-title">결재 내용</div>'
        + '<div class="rr-section-body">' + esc(parsed.body.trim()) + '</div>'
      : '';

    /* ── 결과보고 ── */
    var resultHtml = parsed.result
      ? '<div class="rr-section-title">결과보고</div>'
        + '<div class="rr-result-box">' + esc(parsed.result) + '</div>'
      : '';

    /* ── 결재 의견 (부서장·GM이 남긴 의견 — 최종 결재권자 GM에게 함께 전달) ── */
    var _ops = parseOpinions(t.opinions);
    var opinionHtml = _ops.length ? '<div class="rr-section-title">결재 의견</div><div class="rr-section-body">' + _ops.map(function(o){ return '[' + esc(o.name||o.role||'') + ' · ' + esc(String(o.time||'').slice(0,16)) + '] ' + esc(o.text||''); }).join('\n') + '</div>' : '';

    /* ── 진척 로그 (날짜 오름차순) ── */
    var logsHtml = '';
    if (parsed.logs && parsed.logs.length > 0) {
      var sorted = parsed.logs.slice().sort(function(a, b){ return a.date.localeCompare(b.date); });
      var rows = sorted.map(function(l){
        return '<tr><td class="rr-log-date">' + esc(l.date) + '</td><td>' + esc(l.text) + '</td></tr>';
      }).join('');
      logsHtml = '<div class="rr-section-title">진척 로그</div>'
        + '<table class="rr-log-table">'
        + '<thead><tr><th style="width:90px">날짜</th><th>내용</th></tr></thead>'
        + '<tbody>' + rows + '</tbody></table>';
    }

    /* ── 계획 ── */
    var planHtml = parsed.plan
      ? '<div class="rr-section-title">계획</div>'
        + '<div class="rr-section-body">' + esc(parsed.plan) + '</div>'
      : '';

    /* ── 예산 ── */
    var budgetHtml = '';
    if (parsed.budget && parsed.budget.category) {
      budgetHtml = '<div class="rr-section-title">예산</div>'
        + '<table class="rr-info-table">'
        + '<tr><th>항목</th><td>' + esc(parsed.budget.category) + '</td></tr>'
        + '<tr><th>금액</th><td>' + Number(parsed.budget.amount).toLocaleString() + ' 원</td></tr>'

// 대표 서명본 업로드 = 대표 결재완료 트리거 — 대표싸인 컬럼에 직접 URL 저장(approval_rep_sign_upload).
async function uploadRepSign(id, input) {
  var file = input && input.files && input.files[0];
  if (!file) return;
  var statusEl = document.getElementById('repSignStatus_' + id);
  function _status(msg){ if (statusEl) statusEl.textContent = msg; }
  if (file.size > 5 * 1024 * 1024) { _status(''); alert(file.name + ' — 5MB를 초과합니다.'); input.value = ''; return; }
  _status('업로드 중...');
  try {
    var base64 = await new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result).split(',')[1]); };
      reader.onerror = function(){ reject(new Error('파일 읽기 실패')); };
      reader.readAsDataURL(file);
    });
    var params = {
      action: 'approval_rep_sign_upload',
      id: id,
      file: base64,
      fileName: '대표서명_' + id + '_' + file.name,
      mimeType: file.type || 'application/octet-stream'
    };
    // base64 대용량 → 반드시 POST 본문(text/plain=CORS preflight 회피). 한글 파일명은 JSON+UTF-8로 안전.
    var r = await fetch(TODO_API_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(params)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var res = await r.json();
    if (!res.ok) throw new Error(res.error || '업로드 실패');
    _status('✅ 대표 서명본 수령');
    input.value = '';
    loadTasks();  // 카드 재렌더 → '🏛 대표 서명본 수령 ✅' + 📎 서명본 링크
  } catch (e) {
    _status('');
    alert('대표 서명본 업로드 실패: ' + e.message);
    input.value = '';
  }
}

/* 결재 필요 여부 산출용 (실제 라인은 buildEffectiveRoute가 (부서장)→GM으로 통일).
   금액 임계 분기 폐지 — 결재 필요 건은 GM 최종 (약속 L09: 결재 종착=GM, 대표 단계 폐지). */
function routeApproval(category, amount) {
  switch (category) {
    case '일상 운영비':
    case '소액 유지보수':
    case '마케팅':
    case '비상 지출':
    case '계약·정기 약정':
    case 'IT·소프트웨어':
    case '급여·인건비·외주·교육':
    case '장비 구매·교체':
    case '시설물 리뉴얼(공간 디자인)':
      return ['GM'];
    default: return [];
  }
}

function buildEffectiveRoute(t, budget) {
  // 결재 필요 여부 = 수동 결재요청 또는 예산 자동 산출
  const manual = String(t.approval || '').split(',').map(s => s.trim()).filter(Boolean);
  const auto = budget ? routeApproval(budget.category, budget.amount) : [];
  if (manual.length === 0 && auto.length === 0) return [];
  // 표준 결재선: (담당자가 명시 체크한 중간 결재자) → GM(최종) (2026-06-16 GM: 대표 단계 폐지 / 2026-06-17 COO A: 카테고리 자동 부서장 삽입 폐지).
  // 중간 결재자 = 결재요청에 명시 체크한 부서장만. 카테고리가 시설이라고 소장을 자동 삽입하지 않음. GM 최종은 항상 유지.
  const owners = String(t.owner || '').split(',').map(s => s.trim());
  const ownerIsGM = owners.indexOf('김남욱GM') >= 0;
  const midExplicit = DEPT_HEADS.some(h => manual.indexOf(h) >= 0);
  const route = [];
  if (midExplicit && !ownerIsGM) route.push('부서장');
  route.push('GM');
  return route;
}

function nextApprover(t, route) {
  const map = { '부서장': t.deptSign, 'GM': t.gmSign };
  for (const r of route) {
    if (!map[r]) return r;
  }
  return null;
}

/* 결재 비밀번호 게이트 — GM 승인/반려 시 본인 PIN 입력 필수 (2026-05-29 GM 지시 · 2026-06-16 대표 단계 폐지) */
/* 결재 비밀번호: 평문 저장 금지(공개 repo) — 페이지는 입력만 받고 서버(Apps Script)가 검증 (2026-05-29 COO 보안) */
const PIN_ROLES = ['부서장', 'GM'];

function gateApproval(role, actionLabel) {
  if (PIN_ROLES.indexOf(role) >= 0) {
    const input = prompt(role + ' ' + actionLabel + ' — 비밀번호를 입력하세요:');
    if (input === null || input === '') return null;   // 취소·빈값 → 중단
    return input;                                       // 실제 검증은 서버에서
  }
  return confirm(role + ' ' + actionLabel + ' 처리하시겠습니까?') ? '' : null;
}

async function approveTask(taskId, role) {
  const pin = gateApproval(role, '승인');
  if (pin === null) return;
  await signTask(taskId, role, 'approve', pin);
}

async function rejectTask(taskId, role) {
  const pin = gateApproval(role, '반려');
  if (pin === null) return;
  // 반려 사유 입력(2026-06-17 COO B2) — 담당자에게 업무현황 '내용'으로 표시됨. 빈값이면 반려 중단(사유 강제).
  const reason = prompt('반려 사유를 입력하세요 (담당자에게 업무현황으로 표시됩니다):');
  if (reason === null) return;                 // 취소 → 중단
  if (!reason.trim()) { alert('반려 사유를 입력해야 합니다.'); return; }
  await signTask(taskId, role, 'reject', pin, reason.trim());
}

/* 결재 리셋 (GM 전용) — 어느 단계서든 결재요청 전으로 되돌려 업무현황에서 수정 가능. GM PIN 서버검증 (2026-06-05 GM) */
async function resetTask(taskId) {
  if (!confirm('이 업무를 결재요청 전으로 리셋합니다.\n부서장·GM 싸인과 결재요청이 모두 지워지고, 업무현황에서 다시 수정할 수 있습니다.\n\n계속하시겠습니까?')) return;
  const pin = prompt('GM 비밀번호를 입력하세요 (결재 리셋):');
  if (pin === null || pin === '') return;
  try {
    const params = new URLSearchParams({ action: 'todo_reset', id: taskId, pin: pin });
    const r = await fetch(TODO_API_URL + '?' + params.toString(), { redirect: 'follow' });
    const res = await r.json();
    if (res.ok) { alert('✅ 리셋 완료 — 업무 현황 SSOT에서 수정하세요.'); loadTasks(); }
    else alert('리셋 실패: ' + (res.error || '알 수 없는 오류'));
  } catch (e) { alert('연결 실패: ' + e.message); }
}

async function signTask(taskId, role, decision, pin, reason) {
  const params = new URLSearchParams({
    action: 'todo_sign', id: taskId, role: role, decision: decision, signer: '페이지', pin: pin || ''
  });
  if (reason) params.set('reason', reason);   // 반려 사유(2026-06-17 COO B2) — reject 시에만 전달
  try {
    const r = await fetch(TODO_API_URL + '?' + params.toString(), { redirect:'follow' });
    const res = await r.json();
    if (res.ok) {
      loadTasks();
    } else {
      alert('처리 실패: ' + (res.error || '알 수 없는 오류'));
    }
  } catch (e) {
    alert('연결 실패: ' + e.message);
  }
}

/* 업무 중요도 부서장 확정 — 담당자 제안값을 부서장이 결재단계에서 확정·조정 (2026-06-03 GM ③). PIN 불필요(업무 중요도는 결재 결정 아님), todo_update difficulty만 갱신(싸인·상태 무손상). */
async function setDifficulty(id, val) {
  const params = new URLSearchParams({ action: 'todo_update', id: id, difficulty: val });
  try {
    const r = await fetch(TODO_API_URL + '?' + params.toString(), { redirect: 'follow' });
    const res = await r.json();
    if (res.ok) { loadTasks(); }
    else { alert('업무 중요도 저장 실패: ' + (res.error || '알 수 없는 오류')); }
  } catch (e) { alert('연결 실패: ' + e.message); }
}

/* ─── [GM 인라인 편집] GM 담당 결재건의 '본문(content)'만 이 페이지에서 직접 수정 (2026-06-23 시우) ───
   스코프 정정(GM 추가지시): 메타필드(제목·기간·카테고리·결재상태) 폐기 → '본문(content)' 편집.
   대상 = 담당(owner)에 '김남욱GM' 포함된 건. 타인 담당 건은 affordance 미노출.
   편집 대상 = t.content 원문 전체(섹션 마커 ===PLAN===·===PROGRESS_LOG===·===BUDGET===·===RESULT=== 포함).
     원문 그대로 textarea에서 고쳐 저장 → parseContent 왕복 손실 없음(기획·진척·결과 전부 보존·편집).
   저장 = 기존 GM PIN 게이트(gateApproval) 1회 통과 후 todo_update(한글 컬럼키 '내용') POST.
     필드키 확인: 업무현황 SSOT의 todo_update가 쓰는 '내용'(영문 alias content) — 동일 키 재사용(_normalizeBody map).
     ※ todo_update는 서버 PIN 미검증(무인증 API·기존 todo_update/setDifficulty와 동일)
        → PIN은 승인/반려와 동일한 클라이언트 UX 게이트로 일관 유지. pin은 본문에 함께 전송(서버 무시).
   IME 안전: textarea 1회 생성 후 재렌더 금지. 저장 버튼 클릭 시 blur로 조합 확정 후 .value만 읽어 커밋. */
function isGmOwned(t) {
  return String((t && (t.owner || t['담당자'])) || '').split(',').map(function(s){ return s.trim(); }).indexOf('김남욱GM') >= 0;
}

// '수정' 클릭 → 카드 안에 본문(content) 편집 textarea 표시 (1회 주입, 재렌더 없음).
function openGmEdit(taskId) {
  var card = null;
  document.querySelectorAll('.approval-card').forEach(function(c){ if (c.getAttribute('data-id') === taskId) card = c; });
  if (!card) return;
  if (card.querySelector('.gm-edit-box')) return;            // 이미 열림
  var t = ALL_TASKS.find(function(x){ return String(x.id) === String(taskId); });
  if (!t) return;

  var box = document.createElement('div');
  box.className = 'gm-edit-box';
  box.style.cssText = 'margin:10px 0 2px;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-bg);display:flex;flex-direction:column;gap:8px;';

  var lb = document.createElement('label');
  lb.style.cssText = 'font-size:11px;font-weight:700;color:var(--accent);';
  lb.innerHTML = '본문 (기획·진척 내용 직접 편집) <span style="font-weight:400;color:var(--dim);">— 섹션 마커(===PLAN=== 등)는 그대로 두세요</span>';

  // 본문 textarea (IME 안전: 1회 생성, 조합 중 손대지 않음)
  var ta = document.createElement('textarea');
  ta.id = 'gmEditContent_' + taskId;
  ta.setAttribute('autocomplete','off'); ta.setAttribute('autocorrect','off');
  ta.setAttribute('autocapitalize','off'); ta.setAttribute('spellcheck','false');
  ta.style.cssText = 'background:var(--paper);border:1px solid var(--border);color:var(--text);padding:9px 11px;border-radius:8px;font-size:13px;font-family:inherit;line-height:1.55;width:100%;min-height:220px;resize:vertical;white-space:pre-wrap;';
  ta.value = String(t.content || '');

  // 버튼줄
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;justify-content:flex-end;margin-top:2px;';
  var saveBtn = document.createElement('button');
  saveBtn.textContent = '💾 저장 (GM 비밀번호)';
  saveBtn.style.cssText = 'background:var(--green);color:#fff;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;';
  var cancelBtn = document.createElement('button');
  cancelBtn.textContent = '취소';
  cancelBtn.style.cssText = 'background:transparent;color:var(--dim);border:1px solid var(--border);padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;';
  cancelBtn.onclick = function(e){ e.stopPropagation(); box.remove(); };
  saveBtn.onclick = function(e){
    e.stopPropagation();
    // 조합 중이면 확정을 위해 blur (textarea 재생성은 하지 않음 — IME 안전)
    ta.blur();
    saveGmEdit(taskId, ta.value, saveBtn);
  };
  btnRow.appendChild(cancelBtn); btnRow.appendChild(saveBtn);

  box.appendChild(lb);
  box.appendChild(ta);
  box.appendChild(btnRow);

  // 카드 제목영역(title-row) 바로 아래에 삽입
  var anchor = card.querySelector('.title-row');
  if (anchor && anchor.nextSibling) card.insertBefore(box, anchor.nextSibling);
  else card.appendChild(box);
  ta.focus();
}

async function saveGmEdit(taskId, content, btn) {
  var t = ALL_TASKS.find(function(x){ return String(x.id) === String(taskId); });
  if (!t || !isGmOwned(t)) { alert('GM 담당 건만 이 페이지에서 수정할 수 있습니다.'); return; }
  // 빈 본문은 todo_update 빈값 보존 규칙상 기존값이 유지됨 → 의도와 달라 명시적으로 막음.
  if (!String(content || '').trim()) { alert('본문이 비어 있습니다. (빈 저장은 기존 본문을 보존만 합니다)'); return; }

  // 기존 GM 비밀번호 게이트 재사용 (승인/반려와 동일 prompt). 취소·빈값 → 중단.
  var pin = gateApproval('GM', '본문 수정');
  if (pin === null) return;

  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  // todo_update는 한글 컬럼키 '내용'을 그대로 시트에 기록(TODO_HEADERS 루프) → 업무현황·시트 동기화.
  var params = {
    action: 'todo_update',
    id: taskId,
    pin: pin,                          // 서버 todo_update는 미검증(무인증) — UX 일관용 전송
    '내용': String(content)
  };
  try {
    var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    var r;
    // 한글·길이 안전: 길면 POST(text/plain=CORS preflight 회피, 업무현황 apiCall 동일 규약)
    if ((TODO_API_URL.length + qs.length + 1) > 1800) {
      r = await fetch(TODO_API_URL, { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(params) });
    } else {
      r = await fetch(TODO_API_URL + '?' + qs, { redirect:'follow' });
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var res = await r.json();
    if (res && res.ok) { loadTasks(); }   // ALL_TASKS 갱신·재렌더 (시트와 동기화 완료)
    else { alert('수정 실패: ' + ((res && res.error) || '알 수 없는 오류')); if (btn) { btn.disabled = false; btn.textContent = '💾 저장 (GM 비밀번호)'; } }
  } catch (e) {
    alert('연결 실패: ' + e.message); if (btn) { btn.disabled = false; btn.textContent = '💾 저장 (GM 비밀번호)'; }
  }
}

function renderApprovalCard(t, idx) {
  const isRejected = /반려/.test(t.approvalStatus);
  const isDone = t.approvalStatus === '결재완료';
  const parsed = parseContent(t.content);
  const route = buildEffectiveRoute(t, parsed.budget);
  const nxt = (!isDone && !isRejected) ? nextApprover(t, route) : null;

  // 결재 단계 마킹 — 결재상태 컬럼이 비어 있어도 싸인 실측으로 단계 산출 (2026-05-29 COO 수정)
  const _MID = ['이경연 실장','이정헌 소장','나우열M'];
  // 부서장 실명: 카테고리 매핑 우선, 없으면 수동 결재요청 포함 부서장 (2026-06-02 GM 복원)
  const _midName = deptHeadNameOf(t) || '부서장';
  const signMap = { '부서장': t.deptSign, 'GM': t.gmSign };  // 대표 단계 폐지(2026-06-16)
  const signedRoles = route.filter(r => String(signMap[r] || '').trim());
  // 대표 단계(대표싸인 컬럼 3상태) — 결재상태와 독립. 빈값/PENDING/URL → 미올림/대기/완료.
  const _repStage = repStageOf(t);  // 'none' | 'pending' | 'done'
  let stCls, chipCls = 'status-chip', chipText;
  if (isDone) {
    stCls = 'st-done'; chipCls += ' done';
    // (GM 결재완료)·(대표 결재완료) 두 칸 시각 분리
    chipText = '✅ GM 결재완료'
      + (_repStage === 'done' ? ' · 🏛 대표 서명본 수령' : _repStage === 'pending' ? ' · 🏛 대표 보고 대기(종이)' : '');
  } else if (isRejected) {
    stCls = 'st-rejected'; chipCls += ' rejected'; chipText = '❌ ' + (t.approvalStatus || '반려');
  } else if (signedRoles.length) {
    stCls = 'st-progress'; chipCls += ' progress';
    chipText = '🔵 ' + signedRoles.join('·') + ' 완료' + (nxt ? ' · ' + nxt + ' 차례' : '');
  } else {
    stCls = 'st-waiting'; chipCls += ' waiting';
    chipText = '⏳ ' + (nxt ? nxt + ' 결재 대기' : '결재 대기');
  }

  let h = '<div class="approval-card ' + stCls + (isRejected ? ' rejected' : '') + '" data-id="' + escAttr(t.id) + '">';

  // [결재-2] 제목 줄 — 카테고리는 제목 옆, 결재대기 배지는 제목 아래, 담당자는 우측 card-meta-chips
  h += '<div class="title-row">';
  h += '<span style="font-size:11px;font-weight:700;color:var(--accent);min-width:30px;text-align:center;flex-shrink:0;letter-spacing:0.02em;padding-top:2px;">#' + String(idx).padStart(3, '0') + '</span>';
  h += '<div class="card-title-area">';
  // 첫째 줄: 제목 + 카테고리 칩 (제목 풀폭)
  h += '<div class="title-line">';
  h += '<span class="title">' + esc(t.title || '(제목 없음)') + '</span>';
  if (t.category) h += '<span class="chip category" style="font-size:10px;flex-shrink:0;">' + esc(t.category) + '</span>';
  h += '</div>';
  // 둘째 줄: 담당자 한 줄(· 구분) — 우측 칩에서 이동, 제목 줄바꿈 squeeze 해소 (2026-06-03 GM)
  if (t.owner && String(t.owner).trim()) {
    var _ownerChips = t.owner.split(',').map(function(o){ return ownerChip(o.trim()); }).filter(Boolean).join(' ');
    h += '<div class="card-owner-line" style="font-size:11px;line-height:1.4;display:flex;flex-wrap:wrap;align-items:center;gap:4px;">👤 ' + _ownerChips + '</div>';
  }
  // 셋째 줄: 결재 대기 배지
  h += '<div class="approval-badge-line"><span class="' + chipCls + '">' + esc(chipText) + '</span>' +
    // GM 서명 대기 단계 — 🖨 업무보고서 인쇄(GM 검토·결재용, 단건 인쇄 재사용). 2026-06-16 GM
    ((!isDone && !isRejected) ? '<button onclick="event.stopPropagation();printApprovalCard(\'' + escAttr(t.id) + '\')" title="업무보고서 인쇄 (GM 검토·결재용)" style="margin-left:6px;background:var(--accent-bg);color:var(--accent);border:1px solid rgba(183,159,138,0.3);padding:2px 8px;border-radius:7px;font-size:10px;cursor:pointer;font-family:inherit;">🖨 업무보고서 인쇄</button>' : '') +
    '<button onclick="event.stopPropagation();resetTask(\'' + escAttr(t.id) + '\')" title="결재요청 전으로 리셋 (GM 전용) — 업무현황에서 수정 가능" style="margin-left:6px;background:transparent;color:var(--dim);border:1px solid var(--border);padding:2px 8px;border-radius:7px;font-size:10px;cursor:pointer;font-family:inherit;">↩ 리셋</button>' +
    // [GM 인라인 편집] GM 담당 건만 — 이 페이지에서 본문(기획·진척 내용) 직접 수정 (2026-06-23 시우)
    (isGmOwned(t) ? '<button onclick="event.stopPropagation();openGmEdit(\'' + escAttr(t.id) + '\')" title="GM 담당 결재건 본문(기획·진척 내용) 직접 수정" style="margin-left:6px;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;">✏ 본문 수정</button>' : '') +
    '</div>';
  h += '</div>';
  // 결재현황 SSOT는 결재만 집중 — 카드별 인쇄/링크 버튼 제거 (2026-06-03 GM). 전체 결재 문서 인쇄는 툴바 🖨 인쇄 유지.
  h += '</div>';

  // 메타 — 예산만 (카테고리·담당자는 제목 줄로 이동)
  if (parsed.budget) {
    h += '<div class="meta-row" style="margin-bottom:6px;">';
    h += '<span class="chip budget">💰 ' + esc(parsed.budget.category) + ' · ' + formatKRW(parsed.budget.amount) + '</span>';
    h += '</div>';
  }

  // [결재] 결재 진행바 — 부서장→GM 단계 한눈에 (약속 L09: 결재 종착=GM)
  if (route && route.length) {
    let stepsH = '<div class="approval-steps">';
    route.forEach((r, i) => {
      if (i > 0) {
        const prevSigned = !!String(signMap[route[i - 1]] || '').trim();
        stepsH += '<div class="conn' + (prevSigned ? ' done' : '') + '"></div>';
      }
      const signed = !!String(signMap[r] || '').trim();
      const lbl = r === '부서장' ? _midName : r;
      let cls = 'step', dot = '○';
      if (signed) { cls += ' done'; dot = '●'; }
      else if (isRejected && r === nxt) { cls += ' reject'; dot = '✕'; }
      else if (!isDone && !isRejected && r === nxt) { cls += ' current'; dot = '●'; }
      else { cls += ' pending'; }
      stepsH += '<div class="' + cls + '"><span class="step-dot">' + dot + '</span><span class="step-label">' + esc(lbl) + '</span></div>';
    });
    stepsH += '</div>';
    h += stepsH;
  }

  // 싸인 라인 — 중간관리자(부서장) → GM(최종). 대표 단계 폐지(2026-06-16).
  h += '<div class="sign-line">';
  h += renderSignPill('부서장',       t.deptSign, t.id, nxt === '부서장',  route.includes('부서장'), _midName);
  h += renderSignPill('GM',          t.gmSign,   t.id, nxt === 'GM',     route.includes('GM'));
  h += '</div>';
  h += renderOpinions(t, route, _midName);

  // [업무 중요도] 부서장 확정 게이트 — 담당자 제안 업무 중요도를 부서장이 결재단계에서 확정·조정 (2026-06-03 GM ③)
  if (!isRejected) {
    const _diff = String(t['난이도'] || '').trim();
    const _deptSigned = !!String(t.deptSign || '').trim();
    // 미설정 업무 중요도는 결재현황(GM)에서 다 설정 가능 — 부서장 단계 유무 무관, 부서장 서명 전·미완료까지 (2026-06-05 GM)
    const _hasDept = route.includes('부서장');
    const _editable = !isDone && !_deptSigned;
    h += '<div class="meta-row" style="margin:6px 0 2px;align-items:center;gap:8px;flex-wrap:wrap;">';
    if (_editable) {
      const _o = (v, l) => '<option value="' + v + '"' + (_diff === v ? ' selected' : '') + '>' + l + '</option>';
      h += '<span style="font-size:11px;color:var(--dim);">⚙ 업무 중요도(' + esc(_hasDept && _midName ? _midName : 'GM') + ' 확정):</span>';
      h += '<select onchange="setDifficulty(\'' + escAttr(t.id) + '\',this.value)" onclick="event.stopPropagation();" title="업무 중요도 기준(팀 범위·S2 COO 탭): 하(1)=본인·1개 팀 / 중(5)=2개 팀 이상 / 상(10)=전사적 단위" style="font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);">'
        + _o('', '미정') + _o('하', '하 (1)·1팀') + _o('중', '중 (5)·2팀+') + _o('상', '상 (10)·전사') + '</select>';
      if (!_diff) h += '<span style="font-size:10px;color:var(--accent);">미설정 — 설정 가능</span>';
      h += '<span style="flex-basis:100%;font-size:10px;color:var(--dim);line-height:1.6;margin-top:2px;"><strong>기준</strong> <span style="color:var(--green);font-weight:700;">하(1)</span> 본인·1개 팀 · <span style="color:var(--yellow);font-weight:700;">중(5)</span> 2개 팀 이상 · <span style="color:var(--red);font-weight:700;">상(10)</span> 전사적 단위 <span style="opacity:.7;">(S2 COO 탭)</span></span>';
    } else {
      const _c = _diff === '상' ? 'var(--red)' : _diff === '중' ? 'var(--yellow)' : _diff === '하' ? 'var(--green)' : 'var(--dim)';
      h += '<span style="font-size:11px;color:var(--dim);">업무 중요도:</span>';
      h += '<span class="chip" style="font-weight:700;color:' + _c + ';">⚙ ' + (_diff || '미정') + (_deptSigned && _diff ? ' · 확정' : '') + '</span>';
    }
    h += '</div>';
  }

  if (t.completeTime) {
    h += '<div class="complete-time">🎉 결재완료: ' + esc(String(t.completeTime).slice(0, 16)) + '</div>';
  }
  if (t.reportUrl) {
    h += '<a href="' + escAttr(t.reportUrl) + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--purple-bg);color:var(--purple);border:1px solid rgba(167,139,218,0.3);text-decoration:none;">&#128196; 결과보고서</a>';
  }

  // [대표 결재 2단계] GM 결재완료(결재상태='결재완료') 건 위에 대표싸인 컬럼 3상태 파생 (2026-06-16 GM).
  //   빈값=대표 미올림 → [대표 결재 올리기] / 'PENDING'=올림(서명본 대기) → 🖨 인쇄 + 📄 업로드 + 올림 취소
  //   / URL=서명본 업로드=대표 결재완료 → 배지 + 📎 링크. 업로드만이 완료 트리거(훅 강제).
  if (isDone) {
    h += renderRepApprovalRow(t);
  }

  // 토글 (본문 + 기획 + 진척 로그 + 결과보고)
  if (parsed.body || parsed.plan || parsed.logs.length || parsed.result) {
    const label = [
      parsed.body ? '본문' : null,
      parsed.plan ? '기획' : null,
      parsed.logs.length ? '진척 ' + parsed.logs.length + '건' : null,
      parsed.result ? '결과보고' : null
    ].filter(Boolean).join(' · ');
    h += '<div class="detail-toggle" onclick="toggleDetail(this)"><span class="arrow">▶</span>' + label + '</div>';
    h += '<div class="detail-body">';
    if (parsed.body) h += '<div class="body-text">' + esc(parsed.body) + '</div>';
    if (parsed.plan) {
      h += '<div style="margin-top:10px;padding:10px 12px;background:var(--blue-bg);border:1px solid rgba(91,159,213,0.3);border-radius:8px;">';
      h += '<div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:4px;">📋 기획</div>';
      h += '<div style="font-size:13px;white-space:pre-wrap;line-height:1.55;">' + esc(parsed.plan) + '</div></div>';
    }
    if (parsed.logs.length) {
      h += '<div style="margin-top:10px;font-size:12px;font-weight:700;color:var(--accent);">📅 진척 로그</div>';
      parsed.logs.forEach(log => {
        h += '<div class="progress-row"><span class="date">' + esc(log.date) + '</span><span class="text">' + esc(log.text) + '</span></div>';
      });
    }
    if (parsed.result) {
      h += '<div style="margin-top:10px;padding:10px 12px;background:var(--purple-bg);border:1px solid rgba(167,139,218,0.3);border-radius:8px;">';
      h += '<div style="font-size:12px;font-weight:700;color:var(--purple);margin-bottom:4px;">🎯 결과보고</div>';
      h += '<div style="font-size:13px;white-space:pre-wrap;line-height:1.55;">' + esc(parsed.result) + '</div></div>';
    }
    h += '</div>';
  }

  h += '</div>';
  return h;
}

function renderSignPill(role, sign, taskId, isCurrent, isInRoute, displayLabel) {
  const label = displayLabel || role;   // 표시는 label(부서장=실명), 서명 onclick은 role 토큰 유지
  if (sign) {
    const time = String(sign).slice(0, 16);
    const rest = String(sign).slice(16).trim();
    return '<span class="sign-pill">✅ ' + esc(label) + '<span class="time">' + esc(time) + (rest ? ' ' + esc(rest) : '') + '</span></span>';
  }
  if (isInRoute === false) {
    return '<span class="sign-pill empty" style="opacity:0.35;">' + esc(label) + ' (해당 없음)</span>';
  }
  if (isCurrent && taskId) {
    return '<span class="sign-pill empty active" style="background:var(--accent-bg);border-color:var(--accent);color:var(--accent);display:inline-flex;align-items:center;gap:4px;padding:3px 4px;">' +
      '<span style="padding:1px 6px;font-weight:700;">' + esc(label) + ' 미서명</span>' +
      '<button onclick="approveTask(\'' + escAttr(taskId) + '\',\'' + escAttr(role) + '\')" style="background:var(--green);color:#fff;border:none;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">✅ ' + esc(label) + ' 승인</button>' +
      '<button onclick="rejectTask(\'' + escAttr(taskId) + '\',\'' + escAttr(role) + '\')" style="background:var(--red);color:#fff;border:none;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">❌ 반려</button>' +
      '</span>';
  }
  return '<span class="sign-pill empty">' + esc(label) + ' 미서명</span>';
}

/* ─── [결재 의견] 부서장·GM이 아무 때나 의견 기록 → 최종 결재권자(GM)에게 카드·인쇄로 함께 전달 (2026-07-02 시우 · GM 지시) ─── */
function parseOpinions(raw) {
  if (!raw) return [];
  try { var a = JSON.parse(raw); return Array.isArray(a) ? a : []; } catch (e) { return []; }
}
function renderOpinions(t, route, midName) {
  var ops = parseOpinions(t.opinions);
  var h = '<div class="opinion-block">';
  if (ops.length) {
    h += '<div class="opinion-title">💬 결재 의견 <span style="color:var(--dim);font-weight:600;">' + ops.length + '건 · 최종 결재권자(GM)에게 함께 전달</span></div>';
    ops.forEach(function(o){
      var nm = esc(o.name || o.role || '');
      var tm = esc(String(o.time || '').slice(0,16));
      h += '<div class="opinion-row"><span class="opinion-who">' + nm + '</span><span class="opinion-time">' + tm + '</span><div class="opinion-text">' + esc(o.text || '') + '</div></div>';
    });
  }
  var btns = '';
  if (route.includes('부서장')) btns += '<button onclick="event.stopPropagation();addOpinion(\'' + escAttr(t.id) + '\',\'부서장\',\'' + escAttr(midName || '부서장') + '\')" class="opinion-btn">💬 ' + esc(midName || '부서장') + ' 의견 남기기</button>';
  if (route.includes('GM')) btns += '<button onclick="event.stopPropagation();addOpinion(\'' + escAttr(t.id) + '\',\'GM\',\'김남욱GM\')" class="opinion-btn">💬 GM 의견 남기기</button>';
  if (btns) h += '<div class="opinion-btn-row">' + btns + '</div>';
  h += '</div>';
  return h;
}
async function addOpinion(taskId, role, name) {
  var pin = gateApproval(role, '의견 등록');
  if (pin === null) return;
  var text = prompt(name + ' 의견을 입력하세요 (최종 결재권자 GM에게 카드로 함께 전달됩니다):');
  if (text === null) return;
  if (!text.trim()) { alert('의견 내용을 입력하세요.'); return; }
  var params = new URLSearchParams({ action:'todo_opinion', id:taskId, role:role, name:name, text:text.trim(), pin:pin || '', signer:'페이지' });
  try {
    var r = await fetch(TODO_API_URL + '?' + params.toString(), { redirect:'follow' });
    var res = await r.json();
    if (res.ok) { loadTasks(); }
    else { alert('의견 등록 실패: ' + (res.error || '알 수 없는 오류')); }
  } catch (e) { alert('연결 실패: ' + e.message); }
}

function renderApprovalDashboard() {
  var panel = document.getElementById('approvalDashPanel');
  var all = ALL_TASKS.filter(function(t) {
    return (t.approvalStatus && String(t.approvalStatus).trim()) || (t.approval && String(t.approval).trim());
  });
  var done = all.filter(function(t) { return t.approvalStatus === '결재완료'; });
  var rejected = all.filter(function(t) { return /반려/.test(t.approvalStatus); });
  var pending = all.filter(function(t) { return t.approvalStatus !== '결재완료' && !/반려/.test(t.approvalStatus); });
  var total = all.length;

  var now = new Date();
  var ds = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

  var h = '';
  h += '<h2>결재 현황 대시보드 <span style="font-size:12px;color:var(--dim);font-weight:400;">' + ds + ' 기준</span>';
  h += '<span><button class="dash-print-btn" onclick="printApprovalDashboard()">인쇄</button>';
  h += '<button class="close-dash" onclick="closeApprovalDashboard()">&times;</button></span></h2>';

  // 요약 통계
  var gmSigned = all.filter(function(t) { return String(t.gmSign||'').trim(); }).length;
  var completionRate = total > 0 ? Math.round(done.length / total * 100) : 0;

  h += '<div class="dash-stat-row">';
  h += '<div class="dash-stat-card"><div class="num" style="color:var(--accent)">' + total + '</div><div class="label">총 결재 건</div></div>';
  h += '<div class="dash-stat-card"><div class="num" style="color:var(--yellow)">' + pending.length + '</div><div class="label">진행 중</div></div>';
  h += '<div class="dash-stat-card"><div class="num" style="color:var(--green)">' + done.length + '</div><div class="label">결재완료</div></div>';
  h += '<div class="dash-stat-card"><div class="num" style="color:var(--red)">' + rejected.length + '</div><div class="label">반려</div></div>';
  h += '<div class="dash-stat-card"><div class="num">' + completionRate + '%</div><div class="label">완료율</div></div>';
  h += '</div>';

  // 결재 단계별 서명 현황
  h += '<h3>결재 단계별 서명 현황</h3>';
  h += '<div class="dash-stat-row">';
  h += '<div class="dash-stat-card"><div class="num" style="color:var(--blue)">' + gmSigned + '</div><div class="label">GM 서명(최종)</div></div>';
  h += '</div>';

  // 미결 건 — 다음 결재자별 대기 현황
  h += '<h3>미결 건 — 다음 결재자 대기 현황</h3>';
  // 부서장(1단계)이 다수 대기이므로 GM만 집계하면 누락 — 부서장 3명 실명 포함해 필터 버튼 카운트와 정합 (2026-06-03 · 2026-06-16 대표 단계 폐지)
  var waitByRole = { '이경연 실장':[], '이정헌 소장':[], '나우열M':[], 'GM':[] };
  pending.forEach(function(t) {
    var parsed = parseContent(t.content);
    var route = buildEffectiveRoute(t, parsed.budget);
    var nxt = nextApprover(t, route);
    var key = (nxt === '부서장') ? deptHeadNameOf(t) : nxt;   // 부서장 차례면 담당자의 부서장 실명으로 귀속
    if (key && waitByRole[key] !== undefined) {
      waitByRole[key].push(t);
    }
  });
  h += '<table class="dash-table"><tr><th>결재자</th><th>대기 건수</th><th style="min-width:120px">비율</th></tr>';
  var roleOrder = ['이경연 실장','이정헌 소장','나우열M','GM'];
  var maxWait = Math.max.apply(null, roleOrder.map(function(r){ return waitByRole[r].length; }).concat([1]));
  var barColors = ['accent','blue','accent','blue'];  // 가용 .dash-bar 클래스 2종 순환(시각용)
  roleOrder.forEach(function(role, ri) {
    var cnt = waitByRole[role].length;
    var pct = Math.round(cnt / maxWait * 100);
    h += '<tr><td><strong>' + esc(role) + '</strong></td><td>' + cnt + '건</td>';
    h += '<td><div class="dash-bar-wrap"><div class="dash-bar ' + barColors[ri % barColors.length] + '" style="width:' + pct + '%"></div></div></td></tr>';
  });
  h += '</table>';

  // 카테고리별 분포
  h += '<h3>카테고리별 분포</h3>';
  var catBarColors = ['blue','purple','accent','green','yellow','red'];
  var catSet = {};
  all.forEach(function(t) { if (t.category) catSet[t.category] = (catSet[t.category]||0) + 1; });
  var catList = Object.keys(catSet).sort();
  h += '<table class="dash-table"><tr><th>카테고리</th><th>건수</th><th>비율</th><th style="min-width:120px">분포</th></tr>';
  catList.forEach(function(cat, ci) {
    var count = catSet[cat];
    var pct = total > 0 ? Math.round(count / total * 100) : 0;
    h += '<tr><td>' + esc(cat) + '</td><td>' + count + '건</td><td>' + pct + '%</td>';
    h += '<td><div class="dash-bar-wrap"><div class="dash-bar ' + catBarColors[ci % catBarColors.length] + '" style="width:' + pct + '%"></div></div></td></tr>';
  });
  h += '</table>';

  // 예산 포함 결재 건 목록
  var budgetTasks = all.filter(function(t) { return parseContent(t.content).budget; });
  if (budgetTasks.length > 0) {
    h += '<h3>예산 포함 결재 건 (' + budgetTasks.length + '건)</h3>';
    var totalAmt = 0;
    h += '<table class="dash-table"><tr><th>업무명</th><th>예산 항목</th><th>금액</th><th>결재 상태</th></tr>';
    budgetTasks.forEach(function(t) {
      var b = parseContent(t.content).budget;
      totalAmt += b.amount;
      h += '<tr><td>' + esc(t.title) + '</td><td>' + esc(b.category) + '</td>';
      h += '<td style="font-weight:700;color:var(--green)">' + formatKRW(b.amount) + '</td>';
      h += '<td>' + esc(t.approvalStatus || '대기') + '</td></tr>';
    });
    h += '<tr style="font-weight:700;"><td colspan="2" style="text-align:right;color:var(--accent)">합계</td><td style="color:var(--green)">' + formatKRW(totalAmt) + '</td><td></td></tr>';
    h += '</table>';
  }

  // 완료 건 월별 추이
  h += '<h3>결재완료 월별 추이</h3>';
  var monthMap = {};
  done.forEach(function(t) {
    var d = String(t.completeTime || t.updatedAt || '').slice(0,7);
    if (d && d.length >= 7) { monthMap[d] = (monthMap[d]||0) + 1; }
  });
  var months = Object.keys(monthMap).sort();
  if (months.length === 0) {
    h += '<p style="color:var(--dim);font-size:13px;">완료 데이터가 없습니다.</p>';
  } else {
    var maxVal = Math.max.apply(null, Object.values(monthMap).concat([1]));
    h += '<table class="dash-table"><tr><th>월</th><th>완료 건수</th><th style="min-width:120px">추이</th></tr>';
    months.forEach(function(m) {
      var pct = Math.round(monthMap[m] / maxVal * 100);
      h += '<tr><td>' + esc(m) + '</td><td>' + monthMap[m] + '건</td>';
      h += '<td><div class="dash-bar-wrap"><div class="dash-bar green" style="width:' + pct + '%"></div></div></td></tr>';
    });
    h += '</table>';
  }

  panel.innerHTML = h;
}
