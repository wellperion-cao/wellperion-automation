<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="/wellperion-automation/wellperion_favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>웰페리온 결재 현황 SSOT</title>
<!-- 업무 현황 SSOT + 결재 현황 SSOT 통합 페이지로 이전 (2026-07-18 GM 승인).
     기존 링크·북마크 보존용 리다이렉트 스텁 — 실제 화면·데이터소스는 「업무 현황 SSOT.html」 결재 탭(iframe: 결재 현황 SSOT_panel.html)로 이관됨. -->
<script>
(function(){
  try {
    var params = new URLSearchParams(location.search);
    params.set('tab', 'approval');
    location.replace('업무 현황 SSOT.html?' + params.toString());
  } catch (e) {
    location.replace('업무 현황 SSOT.html?tab=approval');
  }
})();
</script>
</head>
<body>
<noscript>이 페이지는 <a href="업무 현황 SSOT.html?tab=approval">웰페리온 업무 현황 SSOT — 결재 현황 탭</a>으로 이전되었습니다.</noscript>
</body>
</html>
