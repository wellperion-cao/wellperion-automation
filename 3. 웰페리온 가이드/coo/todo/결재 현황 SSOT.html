function setView(v) {
  // 리스트 뷰 폐지(2026-06-03 GM·업무현황 파리티) — 'list' 들어오면 트렐로로 폴백. 트렐로/캘린더 2뷰만.
  if (v !== 'kanban' && v !== 'calendar') v = 'kanban';
  currentView = v;
  try { localStorage.setItem('approval_view', v); } catch(e) {}
  render();
}

/* 결재 컬럼 분류 — '다음 서명자'별(2026-06-03 GM). 결재자 필터 버튼과 1:1 정합.
   반려 → reject / 결재완료 → done / 그 외 → 다음 서명할 사람 실명(부서장 실명·GM). 약속 L09: 대표 단계 폐지. */
function approvalBucketOf(t) {
  const s = String(t.approvalStatus || '');
  if (/반려/.test(s)) return 'reject';
  if (s === '결재완료') return 'done';
  const route = buildEffectiveRoute(t, parseContent(t.content || '').budget);
  const nx = nextApprover(t, route);  // '부서장' | 'GM' | null
  if (nx === '부서장') return deptHeadNameOf(t) || '나우열M';
  if (nx === 'GM') return 'GM';
  return 'done';  // 전원 서명됐으나 상태 미반영 → 완료로 귀속
}

/* 트렐로(칸반) 뷰 — 다음 서명자별 컬럼(이경연·이정헌·나우열 서명대기 | GM(최종) | 결재완료 | 반려).
   각 카드는 리스트와 동일한 renderApprovalCard 사용 → PIN·승인/반려 버튼·진행바 전부 보존. 대표 단계 폐지(2026-06-16). */
function renderKanban(list) {
  let COLS = [
    { key:'이경연 실장', cls:'col-waiting', icon:'⏳', label:'이경연 실장 서명 대기' },
    { key:'이정헌 소장', cls:'col-waiting', icon:'⏳', label:'이정헌 소장 서명 대기' },
    { key:'나우열M',     cls:'col-waiting', icon:'⏳', label:'나우열M 서명 대기' },
    { key:'GM',          cls:'col-gm',      icon:'🔵', label:'김남욱GM 서명 대기(최종)' }
  ];
  // 결재자 필터가 켜지면 해당 칸만 표시 — 나머지 칸('해당 건 없음') 숨겨 '그 사람 건만' 보이게 (2026-06-05 GM)
  if (typeof activeRoleFilter !== 'undefined' && activeRoleFilter !== '전체') {
    COLS = COLS.filter(function(c){ return c.key === activeRoleFilter; });
  }
  const buckets = {};
  COLS.forEach(c => { buckets[c.key] = []; });
  // 결재완료·반려는 보드 칸이 아니라 보드 아래 접이식 토글로 (업무현황 보류·완료 로그 패턴, 2026-06-05 GM)
  const doneList = [], rejectList = [];
  list.forEach(t => {
    const b = approvalBucketOf(t);
    if (b === 'done') { doneList.push(t); return; }
    if (b === 'reject') { rejectList.push(t); return; }
    if (buckets[b]) buckets[b].push(t); else if (buckets['GM']) buckets['GM'].push(t);
  });

  let h = '<div class="kanban-board" id="kanbanBoard">';
  COLS.forEach(col => {
    const items = buckets[col.key];
    h += '<div class="kanban-col ' + col.cls + '">';
    var _hc = OWNER_COLORS[ ({'GM':'김남욱GM'})[col.key] || col.key ];
    var _hst = _hc ? ' style="background:'+_hc.bg+';color:'+_hc.color+';border-top-color:'+_hc.color+';"' : '';
    h += '<div class="kanban-col-head"' + _hst + '>' + col.icon + ' ' + esc(col.label) + '<span class="kcount">' + items.length + '건</span></div>';
    h += '<div class="kanban-col-body">';
    if (!items.length) {
      h += '<div class="kanban-col-empty">해당 건 없음</div>';
    } else {
      items.forEach((t, i) => { h += renderApprovalCard(t, i + 1); });
    }
    h += '</div></div>';
  });
  h += '</div>';

  // 결재완료·반려 = 보드 아래 접이식 토글 (눌러서 펼침 — 업무현황 보류·완료 로그처럼, 2026-06-05 GM)
  if (doneList.length) {
    h += '<div class="group-toggle" onclick="toggleDetail(this)" style="margin-top:16px;"><span class="arrow">▶</span>✅ 결재완료<span class="gcount">' + doneList.length + '건</span></div>';
    h += '<div class="detail-body">';
    doneList.forEach((t, i) => { h += renderApprovalCard(t, i + 1); });
    h += '</div>';
  }
  if (rejectList.length) {
    h += '<div class="group-toggle" onclick="toggleDetail(this)"><span class="arrow">▶</span>❌ 반려<span class="gcount">' + rejectList.length + '건</span></div>';
    h += '<div class="detail-body">';
    rejectList.forEach((t, i) => { h += renderApprovalCard(t, i + 1); });
    h += '</div>';
  }

  if (!list.length) {
    h = '<div class="empty-msg"><span class="ico">📂</span>해당 조건의 결재 건이 없습니다.</div>' + h;
  }
  return h;
}

/* 칸반 보드 가로 스크롤 — 마우스 드래그 + 세로휠→가로 (업무현황 SSOT와 동일 패턴) */
function initKanbanDrag() {
  document.querySelectorAll('.kanban-board').forEach(function(board) {
    if (board.dataset.dragInit) return;
    board.dataset.dragInit = '1';
    var isDown = false, moved = false, startX = 0, scrollLeft = 0;
    board.addEventListener('mousedown', function(e) { isDown = true; moved = false; startX = e.pageX - board.offsetLeft; scrollLeft = board.scrollLeft; });
    board.addEventListener('mouseleave', function() { isDown = false; board.classList.remove('dragging'); });
    board.addEventListener('mouseup', function() { isDown = false; board.classList.remove('dragging'); });
    board.addEventListener('mousemove', function(e) {
      if (!isDown) return;
      var x = e.pageX - board.offsetLeft, dist = x - startX;
      if (!moved && Math.abs(dist) < 6) return;
      moved = true; board.classList.add('dragging'); e.preventDefault();
      board.scrollLeft = scrollLeft - dist * 1.2;
    });
    board.addEventListener('click', function(e) { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    // 휠 표준 (2026-06-03 GM): 일반 휠 = 세로(페이지) 그대로, Shift+휠 = 가로 보드 스크롤.
    // 트랙패드 가로 스와이프(deltaX)는 native 그대로 가로 스크롤.
    board.addEventListener('wheel', function(e) {
      if (board.scrollWidth <= board.clientWidth) return;
      if (e.shiftKey && e.deltaY !== 0) { e.preventDefault(); board.scrollLeft += e.deltaY; }
    }, { passive: false });
  });
}

/* ── 캘린더 뷰 (G1 gm1CalRender 패턴 이식) ──
   날짜 기준 = 결재완료 건은 결재완료시각, 그 외는 시작일. 미일정 건은 하단 목록.
   배지/일자 클릭 → 해당 카드로 딥링크(리스트 전환 후 스크롤·하이라이트). */
function calColumnColor(t) {
  const c = CAT_COLORS[t.category];
  const base = c ? ('background:' + c.bg + ';color:' + c.color + ';') : 'background:var(--accent-bg);color:var(--accent);';
  // 결재완료·반려 건은 흐리게(업무현황 SSOT 완료 흐림 파리티, 2026-06-03 GM)
  const s = String(t.approvalStatus || '');
  return base + ((s === '결재완료' || /반려/.test(s)) ? 'opacity:0.5;' : '');
}
function renderCalendar(list) {
  const now = new Date();
  if (calViewYear === undefined || calViewYear === null) { calViewYear = now.getFullYear(); calViewMonth = now.getMonth(); }

  const td = todayDateStr();
  const firstDay = new Date(calViewYear, calViewMonth, 1).getDay();
  const lastDate = new Date(calViewYear, calViewMonth + 1, 0).getDate();
  const prevLast = new Date(calViewYear, calViewMonth, 0).getDate();

  // 날짜 맵 — 시작일~종료일 기간 전체 칸에 분배(업무현황 SSOT 파리티). 종료일 없으면 시작일 1칸. (2026-06-03 GM)
  const evMap = {};
  const undated = [];
  const calPad2 = function(n){ return ('0' + n).slice(-2); };
  list.forEach(t => {
    const sd = String(t.startDate || '').slice(0, 10);
    if (!sd || sd.length < 10) { undated.push(t); return; }
    const ed = String(t.endDate || '').slice(0, 10) || sd;
    let cur = sd, guard = 0;
    while (cur <= ed && guard < 60) {
      if (!evMap[cur]) evMap[cur] = [];
      evMap[cur].push(t);
      const dp = cur.split('-');
      const dObj = new Date(Number(dp[0]), Number(dp[1]) - 1, Number(dp[2]) + 1);
      cur = dObj.getFullYear() + '-' + calPad2(dObj.getMonth() + 1) + '-' + calPad2(dObj.getDate());
      guard++;
    }
  });

  const cells = [];
  for (let i = firstDay - 1; i >= 0; i--) cells.push({ day: prevLast - i, dateStr: null, other: true });
  for (let d2 = 1; d2 <= lastDate; d2++) {
    const ds = calViewYear + '-' + ('0' + (calViewMonth + 1)).slice(-2) + '-' + ('0' + d2).slice(-2);
    cells.push({ day: d2, dateStr: ds, other: false });
  }
  let nextD = 1;
  while (cells.length < 42) cells.push({ day: nextD++, dateStr: null, other: true });

  let h = '';
  h += '<div class="cal-bar">';
  h += '<button class="cal-nav-btn" onclick="calPrevMonth()">← 이전 달</button>';
  h += '<span class="cal-month-label">' + calViewYear + '년 ' + (calViewMonth + 1) + '월</span>';
  h += '<button class="cal-nav-btn" onclick="calNextMonth()">다음 달 →</button>';
  h += '<button class="cal-nav-btn" onclick="calToday()" style="font-weight:600;color:var(--dim);">오늘로</button>';
  h += '<span class="cal-legend">시작일~종료일 기간 표시 · 배지 클릭 시 트렐로에서 상세</span>';
  h += '</div>';
  h += '<div style="overflow-x:auto;"><table class="cal-table"><thead><tr>';
  h += '<th style="color:#e85555;">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th style="color:#5588ee;">토</th>';
  h += '</tr></thead><tbody>';

  for (let row = 0; row < cells.length / 7; row++) {
    h += '<tr>';
    for (let col = 0; col < 7; col++) {
      const cell = cells[row * 7 + col];
      const tdStyle = cell.other ? 'opacity:0.35;' : ((cell.dateStr === td) ? 'background:var(--accent-bg);cursor:default;' : '');
      h += '<td style="' + tdStyle + '">';
      const numStyle = (col === 0 ? 'color:#e85555;' : col === 6 ? 'color:#5588ee;' : '')
        + (cell.dateStr === td ? 'background:var(--accent);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;' : '');
      h += '<div class="cal-daynum" style="' + numStyle + '">' + cell.day + '</div>';
      if (!cell.other && cell.dateStr && evMap[cell.dateStr]) {
        const evs = evMap[cell.dateStr];
        const showN = Math.min(evs.length, 3);
        for (let ei = 0; ei < showN; ei++) {
          const ev = evs[ei];
          h += '<div class="cal-badge" style="' + calColumnColor(ev) + '" title="' + escAttr(ev.title || '') + '" onclick="calGotoItem(\'' + escAttr(ev.id) + '\')">' + esc(ev.title || '(제목 없음)') + '</div>';
        }
        if (evs.length > 3) h += '<div style="font-size:10px;color:var(--dim);">+' + (evs.length - 3) + '개</div>';
      }
      h += '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table></div>';

  // 미일정(날짜 없음) 결재 건 목록
  if (undated.length) {
    h += '<div class="cal-undated"><div style="font-size:12px;font-weight:700;color:var(--dim);margin-bottom:6px;">📌 일정 미지정 (' + undated.length + '건)</div>';
    undated.forEach(t => {
      h += '<div class="cal-badge" style="display:inline-block;margin:0 6px 6px 0;' + calColumnColor(t) + '" onclick="calGotoItem(\'' + escAttr(t.id) + '\')">' + esc(t.title || '(제목 없음)') + '</div>';
    });
    h += '</div>';
  }
  if (!list.length) {
    h += '<div class="empty-msg" style="padding:30px 0;"><span class="ico">📂</span>해당 조건의 결재 건이 없습니다.</div>';
  }
  return h;
}
function calPrevMonth() { if (calViewMonth === 0) { calViewMonth = 11; calViewYear--; } else { calViewMonth--; } render(); }
function calNextMonth() { if (calViewMonth === 11) { calViewMonth = 0; calViewYear++; } else { calViewMonth++; } render(); }
function calToday() { const n = new Date(); calViewYear = n.getFullYear(); calViewMonth = n.getMonth(); render(); }
/* 캘린더 배지 클릭 → 트렐로 뷰로 전환 후 해당 카드 딥링크(스크롤·하이라이트·상세 펼침). 리스트 폐지(2026-06-03 GM) */
function calGotoItem(id) {
  currentView = 'kanban';
  try { localStorage.setItem('approval_view', 'kanban'); } catch(e) {}
  _deepLinkId = id;
  render();
  handleDeepLink();
}

function setFilter(f) {
  activeFilter = f;
  render();
}

function toggleDetail(el) {
  el.classList.toggle('open');
  const body = el.nextElementSibling;
  if (body) body.classList.toggle('open');
}

/* ─── 공유 유틸 (업무 현황 SSOT와 동일 — 4섹션 마커) ─── */
const PROGRESS_MARK = '===PROGRESS_LOG===';
const BUDGET_MARK = '===BUDGET===';
const PLAN_MARK = '===PLAN===';
const RESULT_MARK = '===RESULT===';

function parseContent(content) {
  const raw = String(content || '');
  const marks = [
    { key: 'plan',     mark: PLAN_MARK },
    { key: 'progress', mark: PROGRESS_MARK },
    { key: 'result',   mark: RESULT_MARK },
    { key: 'budget',   mark: BUDGET_MARK }
  ];
  const positions = marks
    .map(m => ({ key: m.key, mark: m.mark, idx: raw.indexOf(m.mark) }))
    .filter(m => m.idx >= 0)
    .sort((a, b) => a.idx - b.idx);
  const body = positions.length ? raw.slice(0, positions[0].idx).replace(/\s+$/, '') : raw;
  const sections = {};
  for (let i = 0; i < positions.length; i++) {
    const start = positions[i].idx + positions[i].mark.length;
    const end = i + 1 < positions.length ? positions[i + 1].idx : raw.length;
    sections[positions[i].key] = raw.slice(start, end).trim();
  }
  const plan = sections.plan || '';
  const result = sections.result || '';
  let budget = null;
  if (sections.budget) {
    const m = sections.budget.split(/\r?\n/)[0].match(/^(.+?)\s*\|\s*(\d+)$/);
    if (m) budget = { category: m[1].trim(), amount: Number(m[2]) };
  }
  let logs = [];
  if (sections.progress) {
    // 연속 줄(날짜패턴 미일치)은 직전 로그 본문에 이어붙임 — 여러 줄·빈 줄 보존 (2026-06-01 GM 버그수정)
    sections.progress.split(/\r?\n/).forEach(line => {
      const m = line.match(/^(\d{4}-\d{2}-\d{2})\s*\|\s*(.*)$/);
      if (m) logs.push({ date: m[1], text: m[2] });
      else if (logs.length) logs[logs.length - 1].text += '\n' + line;
    });
    logs.forEach(l => { l.text = l.text.replace(/\s+$/, ''); });
    logs.sort((a, b) => b.date.localeCompare(a.date));
  }
  return { body, plan, logs, result, budget };
}

function formatKRW(amount) {
  if (!amount) return '';
  return Number(amount).toLocaleString('ko-KR') + '원';
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escAttr(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
