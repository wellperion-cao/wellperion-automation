<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="2; url=./structure.html#cpv1">
<title>HR office 이동 안내</title>
<style>
  :root{ color-scheme: light dark; --bg:#F2EFE7; --ink:#2A2A28; --muted:#7A756A; --brass:#8A6A4A; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#1C1C1A; --ink:#EDE8DC; --muted:#9A9488; --brass:#D8B26A; } }
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;
    padding:24px;
  }
  .card{ max-width:420px; text-align:center; }
  .mark{ font-size:11px; letter-spacing:.28em; color:var(--brass); font-weight:700; text-transform:uppercase; }
  h1{ font-size:19px; margin:10px 0 6px; letter-spacing:-.01em; }
  p{ font-size:13px; color:var(--muted); line-height:1.6; margin:6px 0; }
  a.btn{
    display:inline-block; margin-top:16px; padding:10px 20px; border-radius:8px;
    background:var(--brass); color:#1a1408; font-weight:700; font-size:13px; text-decoration:none;
  }
  .foot{ margin-top:18px; font-size:11px; color:var(--muted); opacity:.75; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">WELLPERION · CHRO</div>
    <h1>HR office 화면이 폐지되었습니다</h1>
    <p>캐릭터 오피스 화면(숲속 오피스 · 8비트 시안)은 종료되었고, 같은 자동화 로그는<br>
       ERP 구조도의 <b>실시간 관제판</b>에서 계속 확인할 수 있습니다.</p>
    <a class="btn" href="./structure.html#cpv1">관제판으로 이동</a>
    <p class="foot">2초 뒤 자동으로 이동합니다 · 이동하지 않으면 위 버튼을 눌러주세요.<br>
       (오피스 CMD 명령 접수창은 이 화면과 함께 종료 — 명령 적재는 CHRO 세션에서 직접 요청)</p>
  </div>
</body>
</html>
