  /* ---------- wall signage (급훈 현판 + 인사 스케줄 월력) — painted onto the wall planes ----------
     No longer billboard: each plaque is mapped onto its wall's isometric plane. We sample three
     world corners of the board with toScreen() and build an absolute setTransform whose axes are
     the wall's horizontal direction (along the wall) and its vertical (gz) direction. The frame,
     text and calendar grid are drawn in the board's local pixel space and therefore shear onto the
     wall like a hung frame / painted board. Emitted BEFORE the agents in painter order, so seated
     characters in front correctly occlude the lower edges (depth-sort).
       plane 'x' → wall at x=coord, horizontal axis runs along gy (uStart→uEnd), vertical = gz
       plane 'y' → wall at y=coord, horizontal axis runs along gx (uStart→uEnd), vertical = gz   */
  function wallBoard(spec, drawFn){
    let o,ux,uy;
    if(spec.plane==='x'){
      o =toScreen(spec.coord, spec.uStart, spec.zTop);
      ux=toScreen(spec.coord, spec.uEnd,   spec.zTop);
      uy=toScreen(spec.coord, spec.uStart, spec.zBot);
    } else {
      o =toScreen(spec.uStart, spec.coord, spec.zTop);
      ux=toScreen(spec.uEnd,   spec.coord, spec.zTop);
      uy=toScreen(spec.uStart, spec.coord, spec.zBot);
    }
    const BW=Math.hypot(ux.x-o.x, ux.y-o.y)||1;   // local px ≈ on-screen px → crisp text
    const BH=Math.hypot(uy.x-o.x, uy.y-o.y)||1;
    const a=(ux.x-o.x)/BW, b=(ux.y-o.y)/BW;
    const c=(uy.x-o.x)/BH, d=(uy.y-o.y)/BH;
    ctx.save();
    ctx.setTransform(a*dpr, b*dpr, c*dpr, d*dpr, o.x*dpr, o.y*dpr);   // wall plane (sheared, crisp)
    drawFn(BW,BH);
    ctx.restore();                                                     // back to scaled world transform
  }
  // shared board specs (used by both the painters above and the on-screen bbox check below)
  const MOTTO_SPEC = {plane:'x', coord:ROOM.x0+0.12, uStart:6.2, uEnd:2.0, zTop:3.58, zBot:2.35};
  const TODAY_SPEC = {plane:'y', coord:ROOM.y0+0.12, uStart:0.35, uEnd:6.1, zTop:3.55, zBot:1.36};
  const CAL_SPEC   = {plane:'y', coord:ROOM.y0+0.12, uStart:6.35, uEnd:11.6, zTop:3.55, zBot:0.8};
  // screen-space bounding box of a wall board (its four world corners projected) → overlap tests
  function wallBoardBBox(spec){
    const c=[];
    if(spec.plane==='x'){
      c.push(toScreen(spec.coord,spec.uStart,spec.zTop), toScreen(spec.coord,spec.uEnd,spec.zTop),
             toScreen(spec.coord,spec.uStart,spec.zBot), toScreen(spec.coord,spec.uEnd,spec.zBot));
    } else {
      c.push(toScreen(spec.uStart,spec.coord,spec.zTop), toScreen(spec.uEnd,spec.coord,spec.zTop),
             toScreen(spec.uStart,spec.coord,spec.zBot), toScreen(spec.uEnd,spec.coord,spec.zBot));
    }
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const p of c){ if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; }
    return {minX,maxX,minY,maxY};
  }

  // 급훈 — painted high on the wall behind the team lead (x = ROOM.x0 plane), clearing her head
  function drawMotto(){
    wallBoard(MOTTO_SPEC, drawMottoBoard);
  }
  function drawMottoBoard(BW,BH){
    const lightT=currentTheme()==='light';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    // panel — deliberately brighter than the wall for contrast
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.32)'; ctx.shadowBlur=8; ctx.shadowOffsetX=-3; ctx.shadowOffsetY=4;
    roundRect(0,0,BW,BH,BH*0.14);
    ctx.fillStyle=lightT? '#F6EDD3' : '#242a33';
    ctx.fill(); ctx.shadowColor='transparent';
    ctx.restore();
    ctx.lineWidth=Math.max(2,BW*0.014); ctx.strokeStyle=P.brass;
    roundRect(0,0,BW,BH,BH*0.14); ctx.stroke();
    ctx.lineWidth=Math.max(1,BW*0.006); ctx.strokeStyle=hexA(P.leadTie,0.85);
    roundRect(BW*0.045,BH*0.12,BW*0.91,BH*0.76,BH*0.10); ctx.stroke();
    // 급훈 title label removed by request — the four words now breathe across the full frame
    let mf=BH*0.60;
    const words='매출!  긍정!  협동!  사랑!';
    ctx.font=`800 ${mf}px Georgia,'Times New Roman',serif`;
    while(ctx.measureText(words).width>BW*0.86 && mf>8){ mf-=1; ctx.font=`800 ${mf}px Georgia,'Times New Roman',serif`; }
    ctx.fillStyle=lightT? '#241C0B' : '#F4E6C2';
    ctx.fillText(words, BW/2, BH*0.52);
    ctx.textAlign='center'; ctx.textBaseline='middle';
  }

  /* ===== 일정 실데이터 — 게이트 인증 후 /exec에서 실시간 로드 (소스에 PII 미포함) ===== */
  const REAL_SCHEDULE={
    asOf:'인증 후 로드', monthLabel:'', firstDow:0, days:31, todayDate:0, todayLabel:'',
    marks:{}, today:[],
    legend:[ {k:'iv', label:'면접'}, {k:'dl', label:'공고 마감'}, {k:'ob', label:'온보딩'} ]
  };
  function markColor(k){ return k==='iv' ? PAL_LIVE() : (k==='dl' ? P.brass : P.sage); }

  // 월력 / 인사 스케줄 — painted on the camera-facing front wall (y = ROOM.y0 plane), right side
  function drawCalendar(){
    wallBoard(CAL_SPEC, drawCalBoard);
  }
  function drawCalBoard(BW,BH){
    const lightT=currentTheme()==='light';
    const live=lightT? '#C0503F':'#E8746A';
    const sat =lightT? '#4E6FA6':'#7C9BD0';
    const ink =lightT? '#33291B':'#EBE2CE';
    const sub =lightT? '#7C7059':'#B7AC93';
    const pad=BW*0.035;
    // panel — brighter than wall
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.32)'; ctx.shadowBlur=9; ctx.shadowOffsetX=3; ctx.shadowOffsetY=4;
    roundRect(0,0,BW,BH,BH*0.05);
    ctx.fillStyle=lightT? '#FBF6EA':'#171B22';
    ctx.fill(); ctx.shadowColor='transparent';
    ctx.restore();
    ctx.lineWidth=Math.max(1.5,BW*0.005); ctx.strokeStyle=hexA(P.brass,0.9);
    roundRect(0,0,BW,BH,BH*0.05); ctx.stroke();
    // header band
    const hb=BH*0.125;
    ctx.save(); roundRect(0,0,BW,hb+10,BH*0.05); ctx.clip();
    ctx.fillStyle=hexA(P.brass, lightT?0.20:0.15); ctx.fillRect(0,0,BW,hb); ctx.restore();
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillStyle=P.brass; ctx.font=`700 ${hb*0.58}px ${KFONT}`;
    ctx.fillText('인사 스케줄', pad, hb*0.54);
    ctx.textAlign='right'; ctx.fillStyle=sub; ctx.font=`600 ${hb*0.48}px ${KFONT}`;
    ctx.fillText(REAL_SCHEDULE.monthLabel, BW-pad, hb*0.54);
    // weekday header (Wed = 1st of July 2026; today = 8th, highlighted)
    const gx0=pad, gw=BW-2*pad, cw=gw/7;
    const wd=['일','월','화','수','목','금','토'];
    const wkY=hb+BH*0.02+cw*0.28;
    ctx.textAlign='center'; ctx.font=`700 ${cw*0.38}px ${KFONT}`;
    for(let i=0;i<7;i++){
      ctx.fillStyle=i===0?live:(i===6?sat:sub);
      ctx.fillText(wd[i], gx0+cw*(i+0.5), wkY);
    }
    // date grid + REAL schedule markers — 실데이터 마크(면접/공고 마감/온보딩), 오늘 하이라이트,
    // 하단 범례. 날짜 숫자·점 크기를 키워 벽면에서도 또렷하게 읽히도록 조정.
    const firstDow=REAL_SCHEDULE.firstDow, days=REAL_SCHEDULE.days, rows=Math.ceil((firstDow+days)/7);
    const lgH=BH*0.075;                                   // bottom legend strip
    const gridTop=wkY+cw*0.42, gridBot=BH-BH*0.025-lgH, ch=(gridBot-gridTop)/rows;
    const MARKS=REAL_SCHEDULE.marks;
    ctx.textBaseline='middle';
    for(let d=1; d<=days; d++){
      const idx=firstDow+d-1, col=idx%7, row=(idx/7)|0;
      const ccx=gx0+cw*(col+0.5), ccy=gridTop+ch*(row+0.5), isToday=(d===REAL_SCHEDULE.todayDate);
      if(isToday){ ctx.beginPath(); ctx.arc(ccx,ccy,Math.min(cw,ch)*0.44,0,Math.PI*2); ctx.fillStyle=P.brass; ctx.fill(); }
      ctx.font=`${isToday?800:700} ${Math.min(ch*0.58,cw*0.55)}px ${KFONT}`;
      ctx.fillStyle=isToday? (lightT?'#FBF6EA':'#171B22') : (col===0?live:(col===6?sat:ink));
      ctx.fillText(String(d), ccx, ccy-ch*0.08);
      const mk=MARKS[d];
      if(mk && mk.length){                                 // multiple dots per day, today included
        const dr=Math.min(cw,ch)*0.115, gap=dr*2.6, y0=ccy+ch*0.30;
        for(let i=0;i<mk.length;i++){
          const mx=ccx+(i-(mk.length-1)/2)*gap;
          ctx.beginPath(); ctx.arc(mx, y0, dr, 0, Math.PI*2);
          ctx.fillStyle=markColor(mk[i]); ctx.fill();
          if(isToday){ ctx.lineWidth=Math.max(1,dr*0.38); ctx.strokeStyle=lightT?'#FBF6EA':'#171B22'; ctx.stroke(); }
        }
      }
    }
    // legend — 마크 색상 의미를 보드 안에서 바로 읽게
    const lgF=lgH*0.62, lgR=lgF*0.40, lgYm=BH-BH*0.025-lgH*0.42;
    ctx.font=`700 ${lgF}px ${KFONT}`;
    let lgW=0; const lgGap=lgF*1.15;
    for(const it of REAL_SCHEDULE.legend) lgW += lgR*2 + lgF*0.45 + ctx.measureText(it.label).width + lgGap;
    lgW -= lgGap;
    let lx0=(BW-lgW)/2;
    ctx.textAlign='left';
    for(const it of REAL_SCHEDULE.legend){
      ctx.beginPath(); ctx.arc(lx0+lgR, lgYm, lgR, 0, Math.PI*2); ctx.fillStyle=markColor(it.k); ctx.fill();
      ctx.fillStyle=sub; ctx.fillText(it.label, lx0+lgR*2+lgF*0.45, lgYm+0.5);
      lx0 += lgR*2 + lgF*0.45 + ctx.measureText(it.label).width + lgGap;
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';
  }

  // 오늘 일정 세부 패널 — front wall, left of the 월력 (company-bulletin style time list)
  function drawToday(){
    wallBoard(TODAY_SPEC, drawTodayBoard);
  }
  // 오늘 실제 일정 = REAL_SCHEDULE.today (빌드타임 실데이터 — 재배포 시 갱신, 시간순)
  const TODAY_ROWS=REAL_SCHEDULE.today;
  function drawTodayBoard(BW,BH){
    const lightT=currentTheme()==='light';
    const ink =lightT? '#33291B':'#EBE2CE';
    const sub =lightT? '#7C7059':'#B7AC93';
    const pad=BW*0.045;
    // panel
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.32)'; ctx.shadowBlur=9; ctx.shadowOffsetX=3; ctx.shadowOffsetY=4;
    roundRect(0,0,BW,BH,BH*0.055);
    ctx.fillStyle=lightT? '#FBF6EA':'#171B22';
    ctx.fill(); ctx.shadowColor='transparent';
    ctx.restore();
    ctx.lineWidth=Math.max(1.5,BW*0.006); ctx.strokeStyle=hexA(P.brass,0.9);
    roundRect(0,0,BW,BH,BH*0.055); ctx.stroke();
    // header band
    const hb=BH*0.155;
    ctx.save(); roundRect(0,0,BW,hb+10,BH*0.055); ctx.clip();
    ctx.fillStyle=hexA(P.brass, lightT?0.20:0.15); ctx.fillRect(0,0,BW,hb); ctx.restore();
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillStyle=P.brass; ctx.font=`700 ${hb*0.52}px ${KFONT}`;
    ctx.fillText('오늘 일정', pad, hb*0.52);
    ctx.textAlign='right'; ctx.fillStyle=sub; ctx.font=`600 ${hb*0.44}px ${KFONT}`;
    ctx.fillText(REAL_SCHEDULE.todayLabel, BW-pad, hb*0.52);
    // rows — 실데이터 (항목 없으면 '오늘 일정 없음')
    const rows=TODAY_ROWS;
    if(!rows.length){
      ctx.textAlign='center'; ctx.fillStyle=sub; ctx.font=`600 ${BH*0.11}px ${KFONT}`;
      ctx.fillText('오늘 일정 없음', BW/2, hb+(BH-hb)/2);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      return;
    }
    const top=hb+BH*0.045, rh=(BH-top-BH*0.04)/rows.length;
    const fz=Math.min(rh*0.44, BW*0.058);
    for(let i=0;i<rows.length;i++){
      const r=rows[i], ry=top+rh*(i+0.5);
      // separator
      if(i>0){ ctx.strokeStyle=hexA(P.brass,0.16); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(pad,top+rh*i); ctx.lineTo(BW-pad,top+rh*i); ctx.stroke(); }
      // time / status chip — 색 = 달력 범례와 동일(면접/마감/온보딩), 완료는 세이지
      const chW=BW*0.17, chH=rh*0.66, chx=pad, chy=ry-chH/2;
      const chipCol = r.done? P.sage : (r.k? markColor(r.k) : (r.flag? PAL_LIVE() : P.brass));
      roundRect(chx,chy,chW,chH,chH*0.32);
      ctx.fillStyle=hexA(chipCol, lightT?0.16:0.22); ctx.fill();
      ctx.lineWidth=1; ctx.strokeStyle=hexA(chipCol,0.7); ctx.stroke();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle=chipCol; ctx.font=`700 ${fz*0.88}px ${KFONT}`;
      ctx.fillText(r.t, chx+chW/2, ry+0.5);
      // label
      ctx.textAlign='left';
      ctx.fillStyle = r.done? sub : ink;
      ctx.font=`${r.done?600:700} ${fz}px ${KFONT}`;
      let label=r.s; const maxW=BW-(chx+chW)-pad*1.4;
      while(ctx.measureText(label).width>maxW && label.length>4){ label=label.slice(0,-2); }
      if(label!==r.s) label=label.slice(0,-1)+'…';
      const lx=chx+chW+pad*0.7;
      ctx.fillText(label, lx, ry+0.5);
      if(r.done){ // strike + check
        const lw=ctx.measureText(label).width;
        ctx.strokeStyle=hexA(P.sage,0.8); ctx.lineWidth=Math.max(1,fz*0.08);
        ctx.beginPath(); ctx.moveTo(lx,ry+0.5); ctx.lineTo(lx+lw,ry+0.5); ctx.stroke();
      }
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';
  }
  function PAL_LIVE(){ return currentTheme()==='light' ? '#C0503F' : '#E8746A'; }

  // 창문 — soft daylight on the left wall, front corner (+ 흘러가는 구름 micro-animation)
  function drawWindow(t){
    wallBoard({plane:'x', coord:ROOM.x0+0.11, uStart:2.05, uEnd:0.5, zTop:3.15, zBot:1.45}, function(BW,BH){ drawWindowBoard(BW,BH,t); });
  }
  function drawWindowBoard(BW,BH,t){
    const lightT=currentTheme()==='light';
    // frame
    roundRect(-BW*0.04,-BH*0.05,BW*1.08,BH*1.10,BH*0.06);
    ctx.fillStyle=P.winFrame; ctx.fill();
    // sky glass with vertical gradient
    const g=ctx.createLinearGradient(0,0,0,BH);
    g.addColorStop(0, P.winSky); g.addColorStop(1, P.winSky2);
    roundRect(BW*0.05,BH*0.06,BW*0.90,BH*0.88,BH*0.03); ctx.fillStyle=g; ctx.fill();
    // 구름 — 유리 안쪽을 천천히 흐르는 두 덩이 (reduced-motion이면 정지)
    ctx.save();
    roundRect(BW*0.05,BH*0.06,BW*0.90,BH*0.88,BH*0.03); ctx.clip();
    const cAlpha = lightT?0.85:0.55;
    const drift1 = MOTION? ((t*BW*0.016)%(BW*1.5))-BW*0.25 : BW*0.30;
    const drift2 = MOTION? ((t*BW*0.010+BW*0.7)%(BW*1.5))-BW*0.25 : BW*0.62;
    const cloud=(cx0,cy0,r)=>{
      ctx.beginPath();
      ctx.arc(cx0,cy0,r,0,Math.PI*2); ctx.arc(cx0+r*0.9,cy0+r*0.18,r*0.72,0,Math.PI*2); ctx.arc(cx0-r*0.85,cy0+r*0.22,r*0.6,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${cAlpha})`; ctx.fill();
    };
    cloud(drift1, BH*0.30, BW*0.085);
    cloud(drift2, BH*0.52, BW*0.065);
    ctx.restore();
    // soft light bloom
    const gl=ctx.createRadialGradient(BW*0.5,BH*0.28,2, BW*0.5,BH*0.28,BW*0.6);
    gl.addColorStop(0, hexA('#FFFFFF',lightT?0.55:0.32)); gl.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=gl; ctx.fillRect(BW*0.05,BH*0.06,BW*0.90,BH*0.88);
    // mullions
    ctx.strokeStyle=P.winFrame; ctx.lineWidth=Math.max(2,BW*0.03);
    ctx.beginPath(); ctx.moveTo(BW*0.5,BH*0.06); ctx.lineTo(BW*0.5,BH*0.94);
    ctx.moveTo(BW*0.05,BH*0.5); ctx.lineTo(BW*0.95,BH*0.5); ctx.stroke();
    // sill
    ctx.fillStyle=shadeHex(P.winFrame,1.15); ctx.fillRect(-BW*0.04,BH*0.96,BW*1.08,BH*0.10);
  }

  // 벽시계 — round wall clock on the front wall, right end (reads 07:08 for today)
  function drawClockWall(t){
    wallBoard({plane:'y', coord:ROOM.y0+0.12, uStart:11.75, uEnd:13.05, zTop:3.42, zBot:2.12}, function(BW,BH){ drawClockBoard(BW,BH,t); });
  }
  function drawClockBoard(BW,BH,t){
    const lightT=currentTheme()==='light';
    const cxp=BW/2, cyp=BH/2, r=Math.min(BW,BH)*0.44;
    ctx.beginPath(); ctx.arc(cxp,cyp,r+r*0.10,0,Math.PI*2);
    ctx.fillStyle=P.brass; ctx.fill();                                  // brass bezel
    ctx.beginPath(); ctx.arc(cxp,cyp,r,0,Math.PI*2);
    ctx.fillStyle=lightT?'#FBF6EA':'#20242C'; ctx.fill();               // face
    ctx.strokeStyle=hexA(lightT?'#33291B':'#EBE2CE',0.75);
    for(let i=0;i<12;i++){ const a=i*Math.PI/6, r1=r*0.82, r2=r*0.94;
      ctx.lineWidth=(i%3===0)?Math.max(1.5,r*0.06):Math.max(1,r*0.03);
      ctx.beginPath(); ctx.moveTo(cxp+Math.cos(a)*r1,cyp+Math.sin(a)*r1); ctx.lineTo(cxp+Math.cos(a)*r2,cyp+Math.sin(a)*r2); ctx.stroke(); }
    // hands → 07:08 (hour = -60°? compute): hour hand at 7h08m, minute at 8m
    const hrA=(-90 + (7+8/60)*30)*Math.PI/180, mnA=(-90 + 8*6)*Math.PI/180;
    ctx.strokeStyle=lightT?'#33291B':'#EBE2CE'; ctx.lineCap='round';
    ctx.lineWidth=Math.max(2,r*0.09); ctx.beginPath(); ctx.moveTo(cxp,cyp); ctx.lineTo(cxp+Math.cos(hrA)*r*0.48,cyp+Math.sin(hrA)*r*0.48); ctx.stroke();
    ctx.lineWidth=Math.max(1.5,r*0.06); ctx.beginPath(); ctx.moveTo(cxp,cyp); ctx.lineTo(cxp+Math.cos(mnA)*r*0.72,cyp+Math.sin(mnA)*r*0.72); ctx.stroke();
    // 초침 스윕 — micro-animation (reduced-motion이면 12시 고정)
    const scA=(-90 + (MOTION? (t*6)%360 : 0))*Math.PI/180;
    ctx.strokeStyle=hexA(P.brass,0.9); ctx.lineWidth=Math.max(1,r*0.028);
    ctx.beginPath(); ctx.moveTo(cxp-Math.cos(scA)*r*0.14,cyp-Math.sin(scA)*r*0.14); ctx.lineTo(cxp+Math.cos(scA)*r*0.80,cyp+Math.sin(scA)*r*0.80); ctx.stroke();
    ctx.beginPath(); ctx.arc(cxp,cyp,r*0.08,0,Math.PI*2); ctx.fillStyle=P.brass; ctx.fill();
  }

  // subtle carpet medallion — thin inset border on the rug
  function drawRugPattern(){
    const inset=[[0.6,2.6],[9.4,2.6],[9.4,5.4],[0.6,5.4]];
    ctx.save();
    ctx.beginPath();
    inset.forEach((p,i)=>{ const s=project(p[0],p[1],0.03); if(i===0)ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y); });
    ctx.closePath();
    ctx.lineWidth=0.06; ctx.strokeStyle=hexA(P.rugEdge,0.55); ctx.stroke();
    ctx.restore();
  }

  /* ---------- camera fit (guarantees everyone on-screen) ---------- */
  function computeCamera(W,H){
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    const acc=(gx,gy,gz)=>{ const p=project(gx,gy,gz); if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x; if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y; };
    for(const gx of [ROOM.x0,ROOM.x1]) for(const gy of [ROOM.y0,ROOM.y1]) for(const gz of [0,WALL_H]) acc(gx,gy,gz);
    for(const c of chars) acc(c.gx, c.gy, c.lead?3.3:3.05);
    const bw=maxX-minX, bh=maxY-minY;
    const pad=Math.min(W,H)*0.066+18;   // more margin → further zoom-out, open roomy feel
    const scale=Math.min((W-2*pad)/bw,(H-2*pad)/bh);
    return { scale, offX:(W-scale*(minX+maxX))/2, offY:(H-scale*(minY+maxY))/2 };
  }
  let CAM={scale:1,offX:0,offY:0};
  function toScreen(gx,gy,gz){ const p=project(gx,gy,gz); return { x:CAM.offX+p.x*CAM.scale, y:CAM.offY+p.y*CAM.scale }; }

  /* ---------- scene assembly (depth-sorted painter's algorithm) ---------- */
  function buildScene(t){
    const draws=[];
    const push=(depth,z,fn)=>draws.push({depth,z,fn});

    // floor + rug
    for(let gx=ROOM.x0; gx<ROOM.x1; gx++){
      for(let gy=ROOM.y0; gy<ROOM.y1; gy++){
        const isRug = gx>=0 && gx<=10 && gy>=2 && gy<=6;
        const alt=(gx+gy)&1;
        let fill;
        if(isRug){
          const edge = (gx===0||gx===10||gy===2||gy===6);
          fill = edge ? fc(P.rugEdge,0.70) : fc(alt?P.rugA:P.rugB, 1.0);
        } else {
          fill = fc(alt?P.floorA:P.floorB, 1.0);
        }
        push(gx+gy-0.05, -1, (function(gx,gy,fill){return function(){ tile(gx,gy,0,1,1,fill); };})(gx,gy,fill));
      }
    }

    // back walls
    push(ROOM.x0+ROOM.y0-0.5, -2, function(){
      box(ROOM.x0, ROOM.y0, 0, ROOM.x1-ROOM.x0, 0.22, WALL_H, P.wall, 0.92);
      box(ROOM.x0, ROOM.y0, WALL_H-0.14, ROOM.x1-ROOM.x0, 0.22, 0.14, P.wallTrim, 1.2);
    });
    push(ROOM.x0+ROOM.y0-0.4, -2, function(){
      box(ROOM.x0, ROOM.y0, 0, 0.22, ROOM.y1-ROOM.y0, WALL_H, P.wallBack, 0.86);
      box(ROOM.x0, ROOM.y0, WALL_H-0.14, 0.22, ROOM.y1-ROOM.y0, 0.14, P.wallTrim, 1.2);
    });

    // meeting table (per cell)
    for(let gx=1; gx<11; gx++){
      for(let gy=3; gy<5; gy++){
        push(gx+gy, 0.5, (function(gx,gy){return function(){ box(gx,gy,0,1.0,1.0,1.0, P.table); };})(gx,gy));
      }
    }
    // brass center runner
    for(let gx=1; gx<11; gx++){
      push(gx+3.5+0.001, 0.6, (function(gx){return function(){ box(gx+0.15,3.85,1.0,0.7,0.30,0.03,P.brass,1.2); };})(gx));
    }

    // carpet medallion (just above floor tiles, below furniture)
    push(ROOM.x0+ROOM.y0-0.04, -1, function(){ drawRugPattern(); });

    // wall signage — 급훈 (behind lead), 오늘 일정 + 월력 (front wall), 창문 + 벽시계. Depth just above
    // walls so seated agents in front correctly occlude them (painter's algorithm).
    const SIGN_D = ROOM.x0+ROOM.y0-0.3;
    push(SIGN_D,       -1.5, function(){ drawWindow(t); });
    push(SIGN_D+0.005, -1.5, function(){ drawMotto(); });
    push(SIGN_D+0.010, -1.5, function(){ drawClockWall(t); });
    push(SIGN_D+0.015, -1.5, function(){ drawToday(); });
    push(SIGN_D+0.020, -1.5, function(){ drawCalendar(); });

    // premium furniture (depth-sorted on the floor)
    push(11.5+0.55, 4, function(){ drawCredenza(11.5,0.55); });
    push(-2.15+1.05, 4, function(){ drawCabinet(-2.15,1.05); });
    push(11.7+3.0,  4, function(){ drawWhiteboard(11.7,3.0); });
    push(-2.5+7.0,  4, function(){ drawCopier(-2.5,7.0,t); });   // 복합기, front-left corner

    // plants
    push(10.7+6.6, 5, function(){ drawPlant(10.7,6.6,t,0.0); });
    push(-2.1+5.4, 5, function(){ drawPlant(-2.1,5.4,t,2.1); });

    // props + characters
    for(const c of chars){
      const a=propAnchor(c); const pd=a.px+a.py;
      push(pd-0.03, 1, (function(c){return function(){ drawPlate(c); };})(c));
      push(pd-0.01, 1, (function(c){return function(){ drawDeskExtras(c,t); };})(c));
      push(pd, 2, (function(c){return function(){ drawMonitor(c,t); };})(c));
      push(pd+0.02, 3, (function(c){return function(){ drawLamp(c); };})(c));
      push(c.gx+c.gy, 6, (function(c){return function(){ drawChar(c,t); };})(c));
    }

    draws.sort((a,b)=> (a.depth-b.depth) || (a.z-b.z));
    for(const d of draws) d.fn();
  }

  /* ---------- overlays (device-px, crisp) ---------- */
  const KFONT="-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function hexA(hex,a){
    if(!hex || hex[0]!=='#') return hex||'rgba(0,0,0,0)';
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a})`;
  }
  const CEIL_PTS=[[1.5,3.4],[5.5,3.6],[9.5,3.8],[3.5,5.4],[8,2.4]];
  function drawOverlays(t,W,H){
    const lightT = currentTheme()==='light';
    ctx.textAlign='center'; ctx.textBaseline='middle';

    // ceiling downlight pools — soft warm ambience on the floor (premium recessed lighting)
    for(const p of CEIL_PTS){
      const s=toScreen(p[0],p[1],0.06);
      const r=Math.max(34,58*CAM.scale/1.6);
      const g=ctx.createRadialGradient(s.x,s.y,0, s.x,s.y,r);
      g.addColorStop(0, hexA(P.ceil, lightT?0.10:0.13)); g.addColorStop(1, hexA(P.ceil,0));
      ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g;
      ctx.beginPath(); ctx.ellipse(s.x,s.y,r,r*0.5,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    }

    // glows — 램프 글로우는 은은하게 맥동 (micro-animation, MOTION 게이트)
    for(const c of chars){
      if(c._lamp && c._lamp.lit){
        const s=toScreen(c._lamp.x, c._lamp.y, 1.52);
        const r=Math.max(38, 60*CAM.scale/1.6);
        const pulse=0.88+0.12*Math.sin(t*2.3+(c.phase||0))*MOTION;
        const g=ctx.createRadialGradient(s.x,s.y,0, s.x,s.y,r);
        g.addColorStop(0, hexA(P.glow,0.40*pulse)); g.addColorStop(0.5, hexA(P.glow,0.15*pulse)); g.addColorStop(1, hexA(P.glow,0));
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
      if(c._mon && c._mon.on){
        const s=toScreen(c._mon.x, c._mon.y, 1.35);
        const r=Math.max(18,28*CAM.scale/1.6);
        const g=ctx.createRadialGradient(s.x,s.y,0, s.x,s.y,r);
        g.addColorStop(0, hexA(P.monOn,0.38)); g.addColorStop(1, hexA(P.monOn,0));
        ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(s.x,s.y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
      }
    }

    // nameplates — opaque billboard panels (bold, framed, shadowed) so every seat reads clearly
    for(const c of chars){
      const a=propAnchor(c);
      const anchor = a.dir==='lead' ? toScreen(a.px+0.12, a.py+0.30, 1.0) : toScreen(a.px, a.py+0.66, 1.0);
      const isLead=c.lead;
      const label = isLead ? '팀장 · Claude' : (c.id+'  '+c.tag);
      const fs = Math.max(isLead?12:11, Math.min(isLead?18:15, (isLead?12.5:10.5)*CAM.scale/1.6));
      ctx.font=`700 ${fs}px ${KFONT}`;
      const tw=ctx.measureText(label).width;
      const dot = isLead?0:fs*1.05;
      const padX=fs*0.62, padY=fs*0.42;
      const w=tw+padX*2+dot, h=fs+padY*2;
      const px=anchor.x-w/2, py=anchor.y-h/2;
      ctx.save();
      ctx.shadowColor= isLead?'rgba(0,0,0,.42)':'rgba(0,0,0,.34)'; ctx.shadowBlur=7; ctx.shadowOffsetY=2.5;
      roundRect(px,py,w,h,h*0.30);
      ctx.fillStyle = isLead ? (lightT? '#3B2F16':'#241B0C')
                             : (lightT? 'rgba(255,251,243,.98)':'rgba(21,25,32,.96)');
      ctx.fill(); ctx.shadowColor='transparent';
      ctx.lineWidth = isLead?2.2:1.4;
      ctx.strokeStyle = isLead ? P.leadTie : hexA(P.brass,0.85);
      ctx.stroke();
      ctx.textAlign='left'; ctx.textBaseline='middle';
      let tx=px+padX;
      if(!isLead){
        ctx.beginPath(); ctx.arc(tx+fs*0.30, anchor.y, fs*0.30, 0, Math.PI*2);
        ctx.fillStyle=c.color; ctx.fill();
        tx += dot;
      }
      ctx.fillStyle = isLead ? '#F3D98A' : (lightT? '#2A2318':'#F1E8D4');
      ctx.fillText(label, tx, anchor.y+0.5);
      ctx.restore();
    }
    ctx.textAlign='center'; ctx.textBaseline='middle';

    // facial expressions (billboard on the camera-facing head, state-driven, + 깜빡임)
    for(const c of chars) drawFace(c,t);

    // NOTE: the team-lead processing-log bubble has been removed from the scene — the lead now stands
    // clear with no bubble over her head. That briefing stream is rendered in the bottom HUD panel
    // (#leadfeed, '팀장 · Claude 브리핑'), driven by setTicker → pushLog below.

    // ---- task bubbles for busy agents — overlap resolution keeps simultaneous ones readable ----
    const bubs=[];
    for(const c of chars){
      if(c.lead) continue;
      if(c.status==='busy'){
        const head=toScreen(c.gx,c.gy, c._headZ||2.9);
        bubs.push({c, hx:head.x, hy:head.y-6, prog:(t-c.tStart)/c.tDur, task:c.task});
      }
    }
    ctx.font=`600 12px ${KFONT}`;
    for(const b of bubs){
      let s=b.task; while(ctx.measureText(s).width>186 && s.length>4){ s=s.slice(0,-2); }
      if(s!==b.task) s=s.slice(0,-1)+'…';
      b.s=s;
      b.w=Math.max(92, ctx.measureText(s).width+24); b.h=40;
      b.cx=Math.max(b.w/2+6, Math.min(W-b.w/2-6, b.hx));   // desired: centered over head, on-screen
      b.by=b.hy-16-b.h;                                     // desired: floating above head
    }
    // stack overlapping bubbles upward; if pinned to the top edge, shift sideways. Leader line
    // (drawn per-bubble) keeps each tied to its owner's head after a nudge.
    bubs.sort((a,b)=> (a.hy-b.hy) || (a.hx-b.hx));
    const GAP=7;
    const hitTest=(b,a)=> Math.abs(b.cx-a.cx) < (b.w+a.w)/2+GAP && Math.abs((b.by+b.h/2)-(a.by+a.h/2)) < (b.h+a.h)/2+GAP;
    const placed=[];
    for(let i=0;i<bubs.length;i++){
      const b=bubs[i];
      for(let guard=0; guard<80; guard++){
        let hit=null;
        for(const a of placed){ if(hitTest(b,a)){ hit=a; break; } }
        if(!hit) break;
        const up=hit.by-b.h-GAP;
        if(up>=6){ b.by=up; }                              // room above → stack up
        else {                                             // pinned near top → separate horizontally
          const dir=(b.cx>=hit.cx)?1:-1;
          const need=(b.w+hit.w)/2+GAP-Math.abs(b.cx-hit.cx);
          b.cx=Math.max(b.w/2+6, Math.min(W-b.w/2-6, b.cx+dir*need));
          b.by=Math.max(6, (Math.abs(b.cx-hit.cx) < (b.w+hit.w)/2+GAP) ? up : b.by);
        }
      }
      b.by=Math.max(6, Math.min(H-b.h-8, b.by));
      placed.push(b);
    }
    for(const b of bubs) drawBubble(b, lightT);

    // completion checks
    for(const c of chars){
      if(c.status==='done'){
        const head=toScreen(c.gx,c.gy, c._headZ||(c.lead?3.2:2.9));
        drawCheck(head.x, head.y-18, Math.min(1,(t-c.tDone)/0.28));
      }
    }
  }
  /* expression repertoire — eyebrows + eye shape + mouth combine into calm / smile / grin / focus /
     ponder / surprise / content / tired / wink. Kept to bold dots + thin lines so it reads at tiny
     scale. c.expr is chosen per-character by updateExpression(); falls back to a state default.
     v2: 열린 눈은 주기적 깜빡임(blink micro-animation) — 감은눈 계열 표정에는 미적용. */
  function drawFace(c,t){
    const f=c._face; if(!f) return;
    const es=Math.max(1.3, 2.0*CAM.scale/1.6)*f.s;
    const dx=es*1.55, cx0=f.x, lightT=currentTheme()==='light';
    const col=lightT? '#2A2318':'#1B1F26';
    let expr=c.expr;
    if(!expr) expr = c.status==='busy'?'focus':(c.status==='done'?'grin':(c.lead?'smile':'calm'));
    const blink = MOTION===1 && (t-(c._blinkT||-9))<0.13 &&
      !(expr==='grin'||expr==='content'||expr==='wink'||expr==='tired');
    const lookUp = expr==='ponder'? -es*0.22 : 0;
    const eyeY=f.y-es*0.5+lookUp, my=f.y+es*1.32, browY=eyeY-es*1.05;
    const LWe=Math.max(1,es*0.5), LWb=Math.max(1,es*0.34);
    ctx.save();
    ctx.fillStyle=col; ctx.strokeStyle=col; ctx.lineCap='round'; ctx.lineJoin='round';
    const dot=(x,y,r)=>{ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); };
    const eyeArcUp=(x)=>{ ctx.lineWidth=LWe; ctx.beginPath(); ctx.arc(x, eyeY+es*0.32, es*0.82, 1.12*Math.PI, 1.88*Math.PI); ctx.stroke(); };   // ∩ happy closed
    const eyeArcDown=(x)=>{ ctx.lineWidth=LWe; ctx.beginPath(); ctx.arc(x, eyeY-es*0.18, es*0.82, 0.16*Math.PI, 0.84*Math.PI); ctx.stroke(); }; // ∪ droopy/tired
    const eyeShut=(x)=>{ ctx.lineWidth=LWe; ctx.beginPath(); ctx.moveTo(x-es*0.55,eyeY); ctx.lineTo(x+es*0.55,eyeY); ctx.stroke(); };           // wink closed
    const dotE=(x,y,r)=>{ if(blink){ eyeShut(x); } else { dot(x,y,r); } };       // 깜빡임 적용 열린 눈
    const brow=(x,y,innerDy,half)=>{ const sgn=x<cx0?+1:-1; ctx.lineWidth=LWb; ctx.beginPath();
      ctx.moveTo(x - sgn*half, y - innerDy*0.35); ctx.lineTo(x + sgn*half, y + innerDy); ctx.stroke(); };   // inner end toward face center
    const mArc=(yc,r,a0,a1)=>{ ctx.lineWidth=LWe; ctx.beginPath(); ctx.arc(cx0,yc,r,a0*Math.PI,a1*Math.PI); ctx.stroke(); };
    const mLine=(half)=>{ ctx.lineWidth=LWe; ctx.beginPath(); ctx.moveTo(cx0-half,my); ctx.lineTo(cx0+half,my); ctx.stroke(); };
    const mO=()=>{ ctx.beginPath(); ctx.ellipse(cx0,my,es*0.40,es*0.5,0,0,Math.PI*2); ctx.fill(); };
    switch(expr){
      case 'grin':                                     // 활짝웃음 — closed happy eyes, raised brows, big smile
        eyeArcUp(cx0-dx); eyeArcUp(cx0+dx);
        brow(cx0-dx, browY-es*0.22, -es*0.14, es*0.58); brow(cx0+dx, browY-es*0.22, -es*0.14, es*0.58);
        mArc(my-es*0.75, es*1.2, 0.08, 0.92); break;
      case 'content':                                  // 만족 — closed eyes, soft smile
        eyeArcUp(cx0-dx); eyeArcUp(cx0+dx);
        mArc(my-es*0.5, es*0.9, 0.15, 0.85); break;
      case 'smile':                                    // 옅은 미소
        dotE(cx0-dx,eyeY,es*0.46); dotE(cx0+dx,eyeY,es*0.46);
        mArc(my-es*0.5, es*0.92, 0.16, 0.84); break;
      case 'focus':                                    // 집중 — brows drawn in, firm mouth
        dotE(cx0-dx,eyeY,es*0.56); dotE(cx0+dx,eyeY,es*0.56);
        brow(cx0-dx, browY, es*0.38, es*0.62); brow(cx0+dx, browY, es*0.38, es*0.62);
        mLine(es*0.7); break;
      case 'ponder':                                   // 골똘 — look up, one brow raised
        dotE(cx0-dx,eyeY,es*0.5); dotE(cx0+dx,eyeY,es*0.5);
        brow(cx0+dx, browY-es*0.34, -es*0.12, es*0.6); brow(cx0-dx, browY, es*0.05, es*0.55);
        mLine(es*0.5); break;
      case 'surprise':                                 // 놀람 — wide eyes, raised brows, small o
        dotE(cx0-dx,eyeY,es*0.66); dotE(cx0+dx,eyeY,es*0.66);
        brow(cx0-dx, browY-es*0.4, -es*0.1, es*0.55); brow(cx0+dx, browY-es*0.4, -es*0.1, es*0.55);
        mO(); break;
      case 'tired':                                    // 살짝 피곤 — droopy eyes, worried brows, flat mouth
        eyeArcDown(cx0-dx); eyeArcDown(cx0+dx);
        brow(cx0-dx, browY+es*0.05, -es*0.12, es*0.5); brow(cx0+dx, browY+es*0.05, -es*0.12, es*0.5);
        mLine(es*0.5); break;
      case 'wink':                                     // 윙크 — one eye shut, half smile
        dotE(cx0-dx,eyeY,es*0.5); eyeShut(cx0+dx);
        mArc(my-es*0.5, es*0.9, 0.16, 0.84); break;
      case 'calm': default:                            // 평온 — soft eyes, faint mouth
        dotE(cx0-dx,eyeY,es*0.46); dotE(cx0+dx,eyeY,es*0.46);
        mLine(es*0.5); break;
    }
    ctx.restore();
  }
  function drawBubble(b, lightT){
    const w=b.w, h=b.h, x=b.cx-w/2, y=b.by, prog=Math.max(0,Math.min(1,b.prog));
    const ax=Math.max(x+12, Math.min(x+w-12, b.hx));       // tail root kept under the bubble
    // leader line to the owner's head so a nudged bubble still reads as theirs
    ctx.save();
    ctx.strokeStyle=hexA(P.brass,0.55); ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(ax, y+h); ctx.lineTo(b.hx, b.hy); ctx.stroke();
    ctx.fillStyle=hexA(P.brass,0.75); ctx.beginPath(); ctx.arc(b.hx,b.hy,2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // bubble body
    const bg=lightT?'rgba(255,252,245,.97)':'rgba(24,28,36,.96)';
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,.24)'; ctx.shadowBlur=10; ctx.shadowOffsetY=3;
    roundRect(x,y,w,h,10); ctx.fillStyle=bg; ctx.fill(); ctx.shadowColor='transparent';
    ctx.lineWidth=1; ctx.strokeStyle=hexA(P.brass,0.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax-6,y+h-1); ctx.lineTo(ax+6,y+h-1); ctx.lineTo(ax,y+h+7); ctx.closePath();
    ctx.fillStyle=bg; ctx.fill();
    ctx.font=`600 12px ${KFONT}`;
    ctx.fillStyle=lightT?'#2A2318':'#F3ECDD'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(b.s, x+12, y+15);
    const bx=x+12, bw=w-24, byy=y+27, bh=5;
    roundRect(bx,byy,bw,bh,3); ctx.fillStyle=lightT?'rgba(140,108,44,.18)':'rgba(201,169,106,.18)'; ctx.fill();
    roundRect(bx,byy,bw*prog,bh,3); ctx.fillStyle=P.brass; ctx.fill();
    ctx.restore();
    ctx.textAlign='center'; ctx.textBaseline='middle';
  }
  function drawCheck(cx,cy,k){
    const r=13*k;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.fillStyle=P.sage; ctx.globalAlpha=Math.min(1,k*1.2); ctx.fill();
    ctx.globalAlpha=1; ctx.strokeStyle='#fff'; ctx.lineWidth=2.4*k; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(cx-5*k,cy); ctx.lineTo(cx-1.5*k,cy+4*k); ctx.lineTo(cx+5.5*k,cy-4.5*k); ctx.stroke();
    ctx.restore();
  }

  /* ================= EVENT ENGINE — 실 자동화로그(db:autolog) 연동 ================= */
  const tally={}; agents.forEach(a=>tally[a.id]=0);
  let todayCount=0;
  let nextSpawnAt=1.0;
  const rand=(a,b)=>a+Math.random()*(b-a);

  let realQueue=[];          // {agent,text,kind,isLead,count} — 오래된→최신 순 소진
  let autologMaxRow=0;
  const actorToAgent=actor=>{ const m=String(actor||'').match(/A-?([1-7])/); return m? ('A-'+m[1]) : null; };
  const todayStr=()=>{ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
  function enqueueLog(rows,opts){ opts=opts||{}; rows.forEach(r=>{ const agent=actorToAgent(r['주체']); realQueue.push({ agent, text:String(r['작업']||'').slice(0,80), kind:String(r['결과']||'완료'), isLead:!agent, count:!!opts.count }); }); }

  async function initAutolog(){
    let rows=[];
    try{ const j=await api({db:'autolog',password:SESSION_PW}); rows=j.results||[]; }catch(e){}
    if(!rows.length){ return; }
    autologMaxRow = rows.reduce((m,r)=>Math.max(m,Number(r['_sheet_row'])||0),0);
    const td=todayStr();
    const todays=rows.filter(r=>String(r['일시']).slice(0,10)===td);
    todayCount=todays.length;
    todays.forEach(r=>{ const a=actorToAgent(r['주체']); if(a&&tally[a]!=null) tally[a]++; });
    const te=document.getElementById('today'); if(te) te.textContent=todayCount;
    agents.forEach(a=>{ const el=document.getElementById('cn-'+a.id); if(el) el.textContent=tally[a.id]; });
    // 피드: 최신 3건 실제 로그
    logFeed.length=0;
    rows.slice(0,3).forEach(r=>{ const a=actorToAgent(r['주체']); logFeed.push({ time:String(r['일시']).slice(11,16), id:(a||'팀장'), tag:(a&&byId[a]?byId[a].tag:''), text:String(r['작업']||'').slice(0,80), kind:String(r['결과']||''), color:(a&&byId[a]?byId[a].color:null) }); });
    renderFeed();
    // 최근 12건 오래된→최신 재생(생동감) — 카운터는 실값이므로 count:false
    enqueueLog(rows.slice(0,12).reverse(), {count:false});
    setInterval(pollAutolog, 25000);
  }
  async function pollAutolog(){
    let rows=[];
    try{ const j=await api({db:'autolog',password:SESSION_PW}); rows=j.results||[]; }catch(e){ return; }
    const fresh=rows.filter(r=>(Number(r['_sheet_row'])||0)>autologMaxRow);
    if(!fresh.length) return;
    autologMaxRow = rows.reduce((m,r)=>Math.max(m,Number(r['_sheet_row'])||0),autologMaxRow);
    enqueueLog(fresh.reverse(), {count:true});
  }

  function assignReal(now){
    if(!realQueue.length) return null;
    const ev=realQueue[0];
    if(ev.isLead){
      realQueue.shift();
      pushLog({ time:new Date().toTimeString().slice(0,8), id:'팀장', tag:'', text:ev.text, kind:'브리핑', color:null });
      lead.nod=1; lead._nodStart=now;
      if(ev.count){ todayCount++; const te=document.getElementById('today'); if(te) te.textContent=todayCount; }
      return true;
    }
    const c=byId[ev.agent];
    if(!c){ realQueue.shift(); return null; }
    if(c.status!=='idle') return null;   // 해당 에이전트 바쁨 → 다음 스폰에서 재시도
    realQueue.shift();
    c.status='busy'; c.task=ev.text; c.tStart=now; c.tDur=rand(2.2,4.0); c.exprEnd=0; c._count=ev.count;
    lead.lookTarget=c; lead.lookUntil=now+1.4; lead.nod=1; lead._nodStart=now;
    setTicker(c.id, c.tag, c.task, '배정');
    return c;
  }
  function nextEvent(now){ ambientFeed(); assignReal(now); }

  function updateEvents(t){
    if(t>=nextSpawnAt){ nextEvent(t); nextSpawnAt = t + rand(2.5,5.0); }
    for(const c of agents){
      if(c.status==='busy' && (t-c.tStart)>=c.tDur){
        c.status='done'; c.tDone=t; c.nod=1; c._nodStart=t; c.exprEnd=0;
        if(c._count){ todayCount++; tally[c.id]++; }
        setTicker(c.id, c.tag, c.task, '완료');
        flashChip(c.id);
        if(c._count){ var _te=document.getElementById('today'); if(_te)_te.textContent=todayCount; }
        if(c._count){ var _ce=document.getElementById('cn-'+c.id); if(_ce)_ce.textContent=tally[c.id]; } c._count=false;
      } else if(c.status==='done' && (t-c.tDone)>1.05){
        c.status='idle'; c.task=''; c.nodAt=t+rand(2.5,6); c.exprEnd=0;
      }
    }
    // idle micro-nods + 눈 깜빡임 스케줄 (blink micro-animation)
    for(const c of chars){
      if(c.status==='idle' && t>=c.nodAt){ c.nod=1; c._nodStart=t; c.nodAt=t+rand(3.5,8); }
      if(c.nod>0){ const k=(t-(c._nodStart||t))/0.55; c.nod=Math.max(0,1-k); }
      if(MOTION===1 && t>=(c.blinkAt||0)){ c._blinkT=t; c.blinkAt=t+rand(2.4,6.5); }
    }
    // varied behavior + facial-expression cycling (desynced per character)
    for(const c of chars){ updateBehavior(c,t); updateExpression(c,t); }
    if(lead.lookUntil && t>lead.lookUntil){ lead.lookTarget=null; lead.lookUntil=0; }
  }
  function updateExpression(c,t){
    if(t < (c.exprEnd||0)) return;
    let pool;
    if(c.status==='busy') pool=['focus','focus','ponder'];
    else if(c.status==='done') pool=['grin','content','grin','surprise'];
    else pool=c.exprIdle||['calm','smile'];
    let nx, guard=0; do{ nx=pool[(Math.random()*pool.length)|0]; guard++; }while(nx===c.expr && guard<3);
    c.expr=nx; c.exprEnd=t + rand(1.6,3.6);
  }

  /* ---------- HUD wiring ---------- */
  // the processing log now lives in the bottom '팀장 · Claude 브리핑' feed panel (#lf-lines)
  const escHtml=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const logFeed=[];                    // newest first, keep last 3
  function renderFeed(){
    const wrap=document.getElementById('lf-lines'); if(!wrap) return;
    wrap.innerHTML='';
    logFeed.forEach((e,i)=>{
      const row=document.createElement('div');
      const emph = i===0?'newest':(i===1?'dim':'dim2');
      row.className='lf-row '+emph;
      const kCls = e.kind==='완료'?'k-done':(e.kind==='브리핑'?'k-brief':'');
      const sw = e.color? `<span class="sw" style="background:${e.color}"></span>` : '';
      const ag = escHtml(e.id + (e.tag?' '+e.tag:''));
      row.innerHTML = `<span class="t">${e.time}</span>`+
        `<span class="ag">${sw}${ag}</span>`+
        `<span class="msg">${escHtml(e.text)}</span>`+
        `<span class="k ${kCls}">${escHtml(e.kind)}</span>`;
      wrap.appendChild(row);
    });
  }
  function pushLog(entry){ logFeed.unshift(entry); if(logFeed.length>3) logFeed.pop(); renderFeed(); }
  function setTicker(id,tag,task,kind){
    const color = byId[id]? byId[id].color : null;
    pushLog({ time:new Date().toTimeString().slice(0,8), id:id, tag:tag, text:task, kind:kind, color:color });
  }
  function flashChip(id){ const el=document.getElementById('chip-'+id); if(!el)return; el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),170); }
  (function buildTally(){
    const wrap=document.getElementById('tally');
    for(const a of agents){
      const chip=document.createElement('div'); chip.className='chip'; chip.id='chip-'+a.id;
      chip.innerHTML=`<span class="sw" style="background:${a.color}"></span><span class="cid">${a.id}</span><span class="cn" id="cn-${a.id}">0</span>`;
      wrap.appendChild(chip);
    }
  })();
  // seed the feed with the lead's opening brief
  pushLog({ time:new Date().toTimeString().slice(0,8), id:'팀장', tag:'', text:'오늘 업무 시작 · 에이전트에게 작업을 배정합니다', kind:'브리핑', color:null });
  function updateClock(){ document.getElementById('clock').textContent=new Date().toTimeString().slice(0,8); }

  /* ---------- reduced motion / visibility ---------- */
  const mqReduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  let MOTION = mqReduce.matches?0:1;
  try{ mqReduce.addEventListener('change', e=>{ MOTION=e.matches?0:1; }); }catch(_){ }

  /* ---------- resize (devicePixelRatio) ---------- */
  let W=0,H=0,dpr=1;
  function resize(){
    const wrap=canvas.parentElement;
    const r=wrap.getBoundingClientRect();
    W=Math.max(320, r.width); H=Math.max(420, r.height);
    dpr=Math.min(2.5, window.devicePixelRatio||1);
    canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
    CAM=computeCamera(W,H);
    LW=0.7/CAM.scale;
  }
  const ro=new ResizeObserver(resize); ro.observe(canvas.parentElement);

  /* ---------- theme toggle ---------- */
  document.getElementById('tgl').addEventListener('click', ()=>{
    const now = currentTheme()==='light' ? 'dark' : 'light';
    rootEl.setAttribute('data-theme', now);
    P=PAL[now];
    for(const k in _c) delete _c[k];
  });

  /* ---------- main loop ---------- */
  let raf=null, lastClock=0;
  function frame(ms){
    const t=ms/1000;
    // re-sync the canvas palette every frame: the artifact viewer stamps data-theme on :root from
    // OUTSIDE this page (and the OS prefers-color-scheme can flip live) — without this, CSS vars and
    // currentTheme() text repaint but the P-based scene (floor/walls/chars/furniture) would stay on
    // the old theme (mixed-theme render). fc() cache keys are hex-based, so no cache clear is needed.
    P=PAL[currentTheme()];
    updateEvents(t);
    CAM=computeCamera(W,H); LW=0.7/CAM.scale;

    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle=P.bg; ctx.fillRect(0,0,W,H);
    const vg=ctx.createRadialGradient(W*0.5,H*0.40,H*0.18, W*0.5,H*0.5,H*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1, currentTheme()==='light'?'rgba(90,70,30,.10)':'rgba(0,0,0,.36)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.translate(CAM.offX,CAM.offY); ctx.scale(CAM.scale,CAM.scale);
    ctx.lineJoin='round';
    buildScene(t);
    ctx.restore();

    drawOverlays(t,W,H);

    if(t-lastClock>0.25){ updateClock(); lastClock=t; }
    raf=requestAnimationFrame(frame);
  }
  function start(){ if(!raf) raf=requestAnimationFrame(frame); }

  const NOTION_FN='https://script.google.com/macros/s/AKfycbyyXrdM7nSXKPG3Dy8wI6_3AI1spZs24d-uHTzQZlsqzoRXKkFbSFnX-hr42D3ScQSSHQ/exec';

  async function loadRealData(){
    const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
    const p=n=>String(n).padStart(2,'0');
    REAL_SCHEDULE.monthLabel=y+'년 '+(mo+1)+'월';

    REAL_SCHEDULE.todayLabel=(mo+1)+'/'+now.getDate()+' ('+'일월화수목금토'[now.getDay()]+')';

    try{
      const rs=await Promise.all([api({db:'appl',password:SESSION_PW}),api({db:'onbo',password:SESSION_PW}),api({db:'hire',password:SESSION_PW})]);
      appl=rs[0].results||[]; onbo=rs[1].results||[]; hire=rs[2].results||[];
    }catch(e){ tLine('실데이터 로드 실패 — 새로고침 해주세요','tl-err'); tScroll(); return; }
    const ACTIVE=['서류 검토','1차 면접','2차 면접','최종 합격','보류'];
    TERM_IV.length=0; TERM_DL.length=0; TERM_OB.length=0;
    for(const k in REAL_SCHEDULE.marks) delete REAL_SCHEDULE.marks[k];
    REAL_SCHEDULE.today.length=0;
    const md=d=>(d.getMonth()+1)+'/'+d.getDate();
    const addMark=(d,k)=>{ if(d.getFullYear()===y&&d.getMonth()===mo){ const a=REAL_SCHEDULE.marks[d.getDate()]=REAL_SCHEDULE.marks[d.getDate()]||[]; if(a.indexOf(k)<0)a.push(k); } };
    appl.forEach(r=>{
      const st=r['전형 단계'], iv=r['면접 일정'];
      if(!iv||ACTIVE.indexOf(st)<0) return;
      const d=new Date(String(iv)); if(isNaN(d)) return;
      if(d.getFullYear()!==y||d.getMonth()!==mo) return;
      TERM_IV.push({day:d.getDate(), d:md(d), t:p(d.getHours())+':'+p(d.getMinutes()), s:(r['지원자명']||'')+' — '+(r['지원 포지션']||'')+' ('+st+')', done:d.getTime()<now.getTime()});
      addMark(d,'iv');
    });
    hire.forEach(r=>{
      if(r['채용 상태']!=='공고중') return;
      const dl=r['공고 마감일']; if(!dl) return;
      const d=new Date(String(dl).slice(0,10)+'T23:59'); if(isNaN(d)) return;
      if(d.getFullYear()===y&&d.getMonth()===mo){ TERM_DL.push({day:d.getDate(), d:md(d), s:r['포지션명']||''}); addMark(d,'dl'); }

      const due=r['완료 기한']; if(!due) return;
      const d=new Date(String(due).slice(0,10)+'T09:00'); if(isNaN(d)) return;
      if(d.getFullYear()===y&&d.getMonth()===mo){ TERM_OB.push({day:d.getDate(), d:md(d), s:(r['대상 신입 직원']||'')+' '+(r['체크 항목']||''), flag:(d-now)<86400000*2}); addMark(d,'ob'); }
    });
    TERM_IV.sort((a,b)=>a.day-b.day); TERM_DL.sort((a,b)=>a.day-b.day); TERM_OB.sort((a,b)=>a.day-b.day);
    TERM_IV.filter(it=>it.day===now.getDate()).forEach(it=>REAL_SCHEDULE.today.push({t:it.t,s:it.s,done:it.done,k:'iv'}));
    TERM_OB.forEach(it=>{ const dd=it.day-now.getDate(); if(dd>=0&&dd<=1) REAL_SCHEDULE.today.push({t:dd===0?'D-DAY':'D-1',s:it.s+' ('+it.d+' 기한)',flag:true,k:'ob'}); });
    TERM_DL.forEach(it=>{ const dd=it.day-now.getDate(); if(dd>=0&&dd<=7) REAL_SCHEDULE.today.push({t:'D-'+dd,s:it.s+' 공고 마감',flag:dd<=3,k:'dl'}); });
    rebuildTermDay();
    REAL_SCHEDULE.asOf=fmtAsOf(now)+' (실시간)';
    const f=document.querySelector('.foot'); if(f) f.textContent='데이터 기준: '+REAL_SCHEDULE.asOf+' · 처리 로그 피드는 목업 시연(자동화 로그 연동 예정)';

    initAutolog();
  }

  async function cmdUnlock(pw,silent){
    if(!pw||!String(pw).trim()){ if(!silent){ tLine('비밀번호를 입력해 주세요','tl-err'); tScroll(); } return false; }
    let data=null; try{ data=await api({db:'autolog',password:pw}); }catch(e){}
    const ok=data&&data.ok&&(data.role==='cmd'||data.role==='admin');
    if(!ok){ try{sessionStorage.removeItem('wp_cmd_pw');}catch(e){} if(!silent){ tLine('CMD 비밀번호가 올바르지 않습니다','tl-err'); tScroll(); } return false; }
    SESSION_PW=pw; CMD_UNLOCKED=true;
    try{sessionStorage.setItem('wp_cmd_pw',pw);}catch(e){}
    const badge=document.getElementById('term-badge'); if(badge) badge.textContent='● 연결됨';
    const ob=document.getElementById('cmd-open'); if(ob) ob.style.display='none';
    realQueue.length=0;
    loadRealData();
    tLine('CMD 잠금 해제 — 실데이터 연결됨. 이제 명령이 CHRO 세션으로 전달됩니다.','tl-h');
    tLine('일정·면접·마감·온보딩·팀원·상태 조회 / 그 외 문장은 CHRO에게 전송','tl-mut'); tScroll();
    return true;
  }
  function termExec(raw){
    if(awaitingCmdPw){ awaitingCmdPw=false; tIn.type='text'; tIn.placeholder='help'; cmdUnlock(raw,false); return; }
    tLine('chro> '+raw,'tl-cmd');
    const parts=raw.split(/\s+/);
    const key=(parts[0]||'').toLowerCase();
    if(key==='cmd'||key==='열기'||key==='unlock'){ promptCmdPw(); tScroll(); return; }
    const cmd=TERM_ALIAS[key];
    if(cmd && termCmds[cmd]){
      if(!CMD_UNLOCKED && cmd!=='help' && cmd!=='clear' && cmd!=='motto'){ tLine('실데이터 조회는 "CMD 열기"(비밀번호) 후 이용할 수 있어요','tl-mut'); tScroll(); return; }
      termCmds[cmd](parts.slice(1).join(' '));
    }
    else if(CMD_UNLOCKED){ termRemote(raw); }
    else tLine("'"+parts[0]+"' — help 또는 'CMD 열기'로 잠금 해제","tl-err");
    tScroll();
  }

  const termHist=[]; let termHistIdx=0;
  function termGhostSync(){ tGhost.style.display=(document.activeElement!==tIn && !tIn.value)?'':'none'; }
  tIn.addEventListener('focus',termGhostSync);
  tIn.addEventListener('blur',termGhostSync);
  tIn.addEventListener('input',termGhostSync);
  tIn.addEventListener('keydown',function(e){
    if(e.key==='Enter'){
      const v=tIn.value.trim();
      if(v){ termExec(v); termHist.push(v); termHistIdx=termHist.length; }
      tIn.value=''; termGhostSync();
    } else if(e.key==='ArrowUp'){
      e.preventDefault();
      if(termHistIdx>0){ termHistIdx--; tIn.value=termHist[termHistIdx]; tIn.setSelectionRange(tIn.value.length,tIn.value.length); }
    } else if(e.key==='ArrowDown'){
      e.preventDefault();
      if(termHistIdx<termHist.length-1){ termHistIdx++; tIn.value=termHist[termHistIdx]; }
      else { termHistIdx=termHist.length; tIn.value=''; }
      tIn.setSelectionRange(tIn.value.length,tIn.value.length);
    }
  });
  document.getElementById('term-line').addEventListener('mousedown',function(e){ if(e.target!==tIn){ e.preventDefault(); tIn.focus(); } });
  tTgl.addEventListener('click',function(){
    const closed=termEl.classList.toggle('closed');
    tTgl.setAttribute('aria-expanded',String(!closed));
    tTgl.textContent=closed?'▴':'▾';
  });
  tLine('CHRO 터미널 — 자유 열람 중 · "CMD 열기"(비밀번호)로 실데이터·명령 연결 · help','tl-mut');
  termGhostSync();

  /* ===== 게이트 (허브 index.html 패턴 — 비번은 소스에 없음, 입력값을 백엔드 검증) ===== */
  const gateEl=document.getElementById('gate');
  function showGateEl(){ gateEl.style.display='flex'; }
  function hideGateEl(){ gateEl.style.display='none'; }
  async function attemptGate(pw){
    const errEl=document.getElementById('gateErr'), btn=document.getElementById('gateBtn');
    if(!pw||!String(pw).trim()){ try{sessionStorage.removeItem('wp_hr_pw');}catch(e){} if(errEl)errEl.textContent='비밀번호를 입력해 주세요.'; showGateEl(); return; }
    if(btn){btn.disabled=true;btn.textContent='확인 중…';}
    if(errEl)errEl.textContent='';
    let data=null, netErr=false;
    try{ data=await api({db:'hire',password:pw}); }catch(e){ netErr=true; }
    if(netErr||!data){ if(btn){btn.disabled=false;btn.textContent='입장';} if(errEl)errEl.textContent='서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.'; showGateEl(); return; }
    const bad=(data.__status===401)||(data.error&&/unauthorized|권한|비밀번호/i.test(String(data.error)))||!data.role;
    if(bad){ try{sessionStorage.removeItem('wp_hr_pw');}catch(e){} if(btn){btn.disabled=false;btn.textContent='입장';} if(errEl)errEl.textContent='비밀번호가 올바르지 않습니다.'; showGateEl(); return; }
    SESSION_PW=pw;
    try{sessionStorage.setItem('wp_hr_pw',pw);}catch(e){}
    hideGateEl();
    loadRealData();
  }
  document.getElementById('gateBtn').addEventListener('click',function(){ attemptGate(document.getElementById('gatePw').value); });
  document.getElementById('gatePw').addEventListener('keydown',function(e){ if(e.key==='Enter') attemptGate(document.getElementById('gatePw').value); });
  const _cmdOpenBtn=document.getElementById('cmd-open');
  if(_cmdOpenBtn) _cmdOpenBtn.addEventListener('click',promptCmdPw);
  (function gateBoot(){
    hideGateEl();          /* 무비번 자유 열람 */
    startAmbient();        /* 이름 없는 연출 모드 */
    let sp=''; try{ sp=sessionStorage.getItem('wp_cmd_pw')||''; }catch(e){}
    if(sp) cmdUnlock(sp,true);
  })();

  resize(); updateClock(); start();
})();
</script>
