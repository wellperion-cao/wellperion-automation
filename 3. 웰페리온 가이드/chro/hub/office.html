<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>웰페리온 · CHRO 복셀 오피스</title>
<style>
  /* ===== HR office v2 — FINAL_SPEC restyle: 귀엽고 정교한 라운드 피겨린 + 프리미엄 브라스 톤 =====
     기능·데이터는 original 그대로(패리티), 시각만 리빌드. 한글 시스템 폰트 스택 + tabular-nums. */
  :root{
    color-scheme: light dark;
    --bg:#0E1116; --ink:#F3ECDD; --muted:#9B9283;
    --panel:rgba(20,24,31,.64); --panel-brd:rgba(201,169,106,.28);
    --brass:#C9A96A; --brass-strong:#E8C877; --sage:#7FC8A0; --live:#E8746A;
    --serif:Georgia,'Times New Roman',serif;
    --ui:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#EFE9DB; --ink:#2A2318; --muted:#7C7059;
    --panel:rgba(255,252,245,.74); --panel-brd:rgba(140,108,44,.30);
    --brass:#8C6C2C; --brass-strong:#A6822E; --sage:#4E9E77; --live:#C0503F;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme]){
      --bg:#EFE9DB; --ink:#2A2318; --muted:#7C7059;
      --panel:rgba(255,252,245,.74); --panel-brd:rgba(140,108,44,.30);
      --brass:#8C6C2C; --brass-strong:#A6822E; --sage:#4E9E77; --live:#C0503F;
    }
  }
  *{box-sizing:border-box}
  .wrap{position:relative; width:100%; height:100vh; min-height:520px; overflow:hidden; background:var(--bg); font-family:var(--ui); color:var(--ink)}
  canvas#scene{position:absolute; inset:0; width:100%; height:100%; display:block; outline:none}
  canvas#scene:focus-visible{box-shadow:inset 0 0 0 2px var(--brass-strong)}

  .hud{position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(12px,2.4vw,26px)}
  .topbar{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
  .brand{display:flex; flex-direction:column; line-height:1}
  .wordmark{font-family:var(--serif); font-weight:700; letter-spacing:.20em; font-size:clamp(17px,2.7vw,26px); color:var(--ink)}
  .wordmark .dot{color:var(--brass)}
  .sub{font-family:var(--serif); font-style:italic; color:var(--muted); font-size:clamp(11px,1.5vw,14px); margin-top:6px; letter-spacing:.02em}

  .status{display:flex; align-items:center; gap:14px; pointer-events:auto}
  .live{display:flex; align-items:center; gap:7px; font-size:12px; letter-spacing:.16em; color:var(--ink); font-weight:600}
  .live .bulb{width:8px; height:8px; border-radius:50%; background:var(--live); animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,116,106,.55)}70%{box-shadow:0 0 0 8px rgba(232,116,106,0)}100%{box-shadow:0 0 0 0 rgba(232,116,106,0)}}
  .clock{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; font-size:15px; letter-spacing:.04em; color:var(--ink); font-weight:600; min-width:88px; text-align:right}
  .tgl{pointer-events:auto; cursor:pointer; border:1px solid var(--panel-brd); background:var(--panel); color:var(--ink); width:34px; height:34px; border-radius:50%; font-size:16px; display:grid; place-items:center; -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); transition:transform .2s, border-color .2s}
  .tgl:hover{transform:rotate(18deg); border-color:var(--brass)}
  .tgl:focus-visible{outline:2px solid var(--brass-strong); outline-offset:2px}

  .bottom{display:flex; flex-direction:column; gap:12px}
  .bottom-row{display:flex; justify-content:space-between; align-items:flex-end; gap:14px}
  .counter{pointer-events:none}
  .counter .lbl{font-size:11px; letter-spacing:.22em; color:var(--muted); text-transform:uppercase}
  .counter .num{font-family:var(--serif); font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; font-weight:700; font-size:clamp(40px,7vw,68px); line-height:.9; color:var(--ink)}
  .counter .num .today-unit{font-size:.34em; letter-spacing:.1em; color:var(--muted); margin-left:8px; font-family:var(--ui); font-weight:600}
  .tally{display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:min(62%,440px); pointer-events:none}
  .chip{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--panel-brd); border-radius:9px; padding:5px 9px; font-size:11px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
  .chip .sw{width:9px;height:9px;border-radius:3px}
  .chip .cid{color:var(--muted); font-weight:600}
  .chip .cn{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; font-weight:700; color:var(--ink); min-width:12px; text-align:right}
  .chip.hit{border-color:var(--brass-strong); box-shadow:0 0 0 2px rgba(201,169,106,.25)}

  /* 팀장 · Claude 브리핑 — full-width processing-log feed docked in the bottom HUD (replaces the head bubble) */
  .leadfeed{width:100%; display:flex; flex-direction:column; gap:5px; background:var(--panel); border:1px solid var(--panel-brd); border-radius:14px; padding:9px 15px; -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); box-shadow:0 6px 22px rgba(0,0,0,.14)}
  .leadfeed .lf-head{display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:.20em; text-transform:uppercase; color:var(--brass); font-weight:700}
  .leadfeed .lf-dot{width:6px; height:6px; border-radius:50%; background:var(--brass); box-shadow:0 0 0 0 rgba(201,169,106,.5); animation:pulse2 2.6s infinite}
  @keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(201,169,106,.5)}70%{box-shadow:0 0 0 6px rgba(201,169,106,0)}100%{box-shadow:0 0 0 0 rgba(201,169,106,0)}}
  .leadfeed .lf-lines{display:flex; flex-direction:column; gap:2px}
  .lf-row{display:flex; align-items:baseline; gap:9px; font-size:12.5px; line-height:1.42}
  .lf-row .t{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; color:var(--muted); font-size:11px; flex:none}
  .lf-row .ag{display:inline-flex; align-items:center; gap:5px; font-weight:700; color:var(--ink); flex:none}
  .lf-row .ag .sw{width:8px; height:8px; border-radius:3px; display:inline-block}
  .lf-row .msg{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 auto}
  .lf-row .k{flex:none; font-size:9.5px; font-weight:700; letter-spacing:.08em; padding:1px 7px; border-radius:6px; color:var(--brass); background:rgba(201,169,106,.14)}
  .lf-row .k.k-done{color:var(--sage); background:rgba(127,200,160,.18)}
  .lf-row .k.k-brief{color:var(--muted); background:rgba(155,146,131,.16)}
  .lf-row.newest{animation:lfin .34s ease both}
  .lf-row.dim{opacity:.52}
  .lf-row.dim2{opacity:.34}
  @keyframes lfin{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}

  .foot{position:absolute; left:50%; transform:translateX(-50%); bottom:6px; font-size:10.5px; color:var(--muted); letter-spacing:.03em; pointer-events:none; text-align:center; width:100%; padding:0 10px}

  @media (max-width:560px){
    .tally{max-width:100%; justify-content:flex-start}
    .bottom-row{flex-direction:column; align-items:flex-start; gap:10px}
    .sub{display:none}
    .lf-row .k{display:none}
    .lf-row{font-size:11.5px}
  }
  @media (prefers-reduced-motion: reduce){
    .live .bulb{animation:none}
    .tgl{transition:none}
    .leadfeed .lf-dot{animation:none}
    .lf-row.newest{animation:none}
  }

  /* ===== CHRO 터미널 — 조회 전용 인터랙티브 명령창 (백엔드 미연결 · 페이지 내 데이터만) =====
     하단 HUD 도크: 데스크톱 = 브리핑 피드 좌 + 터미널 우, 모바일 = 세로 스택.
     스크린은 양 테마 모두 다크(책상 위 단말기 컨셉) — 패널 테두리·포인트만 페이지 토큰과 동조. */
  .dockrow{display:flex; align-items:flex-end; gap:12px; width:100%}
  .dockrow>.leadfeed{flex:1 1 auto; min-width:0; width:auto}
  .term{
    --t-ink:#E9E1CC; --t-mut:#9B9283; --t-brass:#E4C27C; --t-sage:#7FC8A0; --t-err:#E8746A;
    pointer-events:auto; flex:0 0 clamp(300px,34vw,412px); min-width:0;
    display:flex; flex-direction:column;
    background:rgba(13,16,22,.92); border:1px solid var(--panel-brd); border-radius:14px; overflow:hidden;
    -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
    box-shadow:0 6px 22px rgba(0,0,0,.18);
    font-family:ui-monospace,'Cascadia Mono',Consolas,'Courier New','Malgun Gothic','맑은 고딕',monospace;
  }
  :root[data-theme="light"] .term{border-color:rgba(140,108,44,.44)}
  .term-head{display:flex; align-items:center; gap:8px; padding:7px 12px; background:rgba(201,169,106,.10); border-bottom:1px solid rgba(201,169,106,.22)}
  .term-dot{width:7px; height:7px; border-radius:50%; background:var(--t-sage); flex:none}
  .term-title{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:700; color:var(--t-brass)}
  .term-badge{font-size:9px; font-weight:700; letter-spacing:.08em; color:var(--t-mut); border:1px solid rgba(155,146,131,.45); border-radius:6px; padding:1px 6px; flex:none}
  .term-tgl{margin-left:auto; cursor:pointer; background:none; border:1px solid transparent; border-radius:6px; color:var(--t-brass); font-size:12px; line-height:1; padding:3px 6px}
  .term-tgl:hover{border-color:rgba(201,169,106,.5)}
  .term-tgl:focus-visible{outline:2px solid var(--brass-strong); outline-offset:1px}
  .term-body{display:flex; flex-direction:column}
  .term.closed .term-body{display:none}
  .term-out{height:clamp(122px,20vh,192px); overflow-y:auto; overflow-x:hidden; padding:9px 12px 5px; scrollbar-width:thin; scrollbar-color:rgba(201,169,106,.4) transparent}
  .term-out::-webkit-scrollbar{width:7px}
  .term-out::-webkit-scrollbar-thumb{background:rgba(201,169,106,.35); border-radius:4px}
  .term-out .tl{font-size:12px; line-height:1.55; color:var(--t-ink); white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; margin:0 0 1px}
  .term-out .tl-cmd{color:var(--t-brass); margin-top:4px}
  .term-out .tl-h{color:var(--t-sage); font-weight:700}
  .term-out .tl-mut{color:var(--t-mut)}
  .term-out .tl-err{color:var(--t-err)}
  .term-line{display:flex; align-items:center; gap:7px; padding:7px 12px 9px; border-top:1px dashed rgba(201,169,106,.22)}
  .term-ps{color:var(--t-sage); font-weight:700; font-size:12.5px; flex:none}
  .term-ghost{flex:none; width:7px; height:14px; border-radius:1.5px; background:#E8C877; animation:tblink 1.06s step-end infinite}
  @keyframes tblink{0%,100%{opacity:1} 50%{opacity:0}}
  .term-in{flex:1 1 auto; min-width:0; background:transparent; border:none; outline:none; color:#F0E8D2; font:inherit; font-size:12.5px; caret-color:#E8C877; padding:0}
  .term-in::placeholder{color:rgba(155,146,131,.5)}
  @media (max-width:880px){
    .dockrow{flex-direction:column; align-items:stretch}
    .term{flex:1 1 auto; width:100%}
    .term-out{height:clamp(110px,24vh,170px)}
  }
  @media (prefers-reduced-motion: reduce){
    .term-ghost{animation:none}
  }
</style>
<style>
#gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg,#0E1116)}
.gate-card{background:var(--panel,rgba(20,24,31,.92));border:1px solid var(--panel-brd,rgba(201,169,106,.28));border-radius:14px;padding:32px 28px;width:100%;max-width:344px;text-align:center;font-family:var(--ui,sans-serif);color:var(--ink,#F3ECDD)}
.gate-card .mark{font-size:11px;letter-spacing:.28em;color:var(--brass,#C9A96A);font-weight:600;text-transform:uppercase}
.gate-card h2{font-size:18px;margin:9px 0 3px;letter-spacing:-.01em}
.gate-card p{font-size:12px;opacity:.72;margin-bottom:18px}
.gate-card input{width:100%;text-align:center;font-size:14px;padding:10px 12px;border-radius:8px;border:1px solid var(--panel-brd,rgba(201,169,106,.4));background:transparent;color:inherit;box-sizing:border-box}
.gate-card button{width:100%;margin-top:10px;padding:10px;border-radius:8px;border:1px solid var(--brass,#C9A96A);background:var(--brass,#C9A96A);color:#1a1408;font-weight:700;cursor:pointer;font-size:13px}
.gate-err{color:#E8746A;font-size:12px;margin-top:10px;min-height:16px}
.gate-foot{margin-top:16px;font-size:10.5px;opacity:.55;line-height:1.5}
</style>
</head>
<body>
<div id="gate" style="display:none">
  <div class="gate-card">
    <div class="mark">WELLPERION</div>
    <h2>CHRO 복셀 오피스</h2>
    <p>사내 전용 페이지입니다. 접근 비밀번호를 입력하세요.</p>
    <input type="password" id="gatePw" placeholder="접근 비밀번호" autocomplete="current-password">
    <button id="gateBtn">입장</button>
    <div class="gate-err" id="gateErr"></div>
    <div class="gate-foot">대외비 — 인사 일정·지원자 정보 포함. 권한 없는 열람·외부 공유를 금합니다.</div>
  </div>
</div>



<div class="wrap">
  <canvas id="scene" tabindex="0" role="img" aria-label="웰페리온 CHRO 인사팀 AI 오피스 아이소메트릭 시연 — 팀장 Claude와 7개 에이전트가 넓은 회의 테이블에서 업무를 처리합니다. 상석 뒤 벽에는 급훈(매출·긍정·협동·사랑) 현판, 정면 벽에는 실제 채용·온보딩 일정이 반영된 오늘(7월 8일) 일정 게시판과 7월 인사 스케줄 월력, 창문과 벽시계가 걸려 있습니다. 처리 로그는 화면 하단의 '팀장 · Claude 브리핑' 패널에 실시간 피드로 표시되며, 팀장 캐릭터는 말풍선에 가려지지 않습니다."></canvas>

  <div class="hud">
    <div class="topbar">
      <div class="brand">
        <div class="wordmark">WELLPERION<span class="dot">.</span></div>
        <div class="sub">CHRO AI 오피스 · 인사 운영 허브</div>
      </div>
      <div class="status">
        <div class="live"><span class="bulb"></span>LIVE</div>
        <div class="clock" id="clock">00:00:00</div>
        <button class="tgl" id="tgl" aria-label="라이트/다크 테마 전환" title="테마 전환">◐</button>
      </div>
    </div>

    <div class="bottom">
      <div class="bottom-row">
        <div class="counter">
          <div class="lbl">오늘 처리</div>
          <div class="num"><span id="today">0</span><span class="today-unit">건</span></div>
        </div>
        <div class="tally" id="tally"></div>
      </div>
      <div class="dockrow">
        <div class="leadfeed" id="leadfeed">
          <div class="lf-head"><span class="lf-dot"></span>팀장 · Claude 브리핑</div>
          <div class="lf-lines" id="lf-lines"></div>
        </div>
        <div class="term" id="term">
          <div class="term-head">
            <span class="term-dot"></span>
            <span class="term-title">CHRO 터미널</span>
            <span class="term-badge" id="term-badge">잠금</span>
            <button class="term-tgl" id="cmd-open" type="button" title="CMD 열기" style="margin-left:auto">🔒 CMD 열기</button>
            <button class="term-tgl" id="term-tgl" type="button" aria-expanded="true" aria-controls="term-body" title="터미널 접기/펼치기">▾</button>
          </div>
          <div class="term-body" id="term-body">
            <div class="term-out" id="term-out" role="log" aria-live="polite" aria-label="터미널 출력"></div>
            <div class="term-line" id="term-line">
              <span class="term-ps">chro&gt;</span>
              <span class="term-ghost" id="term-ghost" aria-hidden="true"></span>
              <input class="term-in" id="term-in" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="CHRO 터미널 명령 입력 — help 입력 시 명령 목록" placeholder="help">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">벽면 달력·오늘 일정 = 실데이터(면접·공고 마감·온보딩) · 데이터: 게이트 인증 후 실시간 로드 · 처리 로그 피드는 목업 시연(자동화 로그 연동 예정)</div>
</div>

<script>
(function(){
  "use strict";
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const rootEl = document.documentElement;

  /* ---------- isometric projection (matches verified layout) ---------- */
  const TW=44, TH=22, TZ=26;
  function project(gx,gy,gz){ return { x:(gx-gy)*TW/2, y:(gx+gy)*TH/2 - gz*TZ }; }

  const ROOM={x0:-2.8, x1:14.4, y0:0.3, y1:8.8};  // enlarged once more — roomier office, wider aisles + more wall to breathe
  const WALL_H=3.6;                               // taller walls to carry 급훈 + 월력 + 오늘 일정 signage

  /* ---------- palettes ---------- */
  const AGENT_COLORS={
    'A-1':'#5B7FB0', 'A-2':'#B0703E', 'A-3':'#4E9E7C', 'A-4':'#A6863E',
    'A-5':'#7A6DB4', 'A-6':'#C0603E', 'A-7':'#3E9AA6'
  };
  const PAL={
    dark:{
      bg:'#0E1116', floorA:'#3A342C', floorB:'#332E27',
      rugA:'#3C4A44', rugB:'#374540', rugEdge:'#C9A96A',
      wall:'#28241F', wallTrim:'#C9A96A', wallBack:'#211E1A',
      table:'#5C4A36', chair:'#2C2824', trouser:'#2A2D33',
      skin:'#D8B48C', hair:'#33291F',
      monOff:'#141B26', monOn:'#4E86C4', lampBrass:'#C9A96A', lampShade:'#F3C979',
      glow:'#F3C979', sage:'#7FC8A0', brass:'#C9A96A', muted:'#9B9283',
      lead:'#3B4150', leadTie:'#E8C877',
      shadow:'rgba(0,0,0,.34)', plant:'#4C7A56', plantPot:'#7A5236',
      wood:'#6A5236', cabinet:'#4A443C', cabinet2:'#5A5248', metal:'#8C8478',
      book:['#8E5B4B','#4E6E86','#7A8C5A','#B08A46','#6A5B86','#3E7A72'],
      winSky:'#BFD8E8', winSky2:'#8FB6D0', winFrame:'#5A5248', coffee:'#3A2A20', mug:'#D8D0C2',
      paper:'#EAE2D0', board:'#EDEAE2', boardTrim:'#8C8478', ceil:'#F3C979', steam:'#E8F2F6'
    },
    light:{
      bg:'#EFE9DB', floorA:'#D9C8A7', floorB:'#CEBC99',
      rugA:'#C6D3C7', rugB:'#BAC9BC', rugEdge:'#8C6C2C',
      wall:'#E7DFCD', wallTrim:'#8C6C2C', wallBack:'#DED4BE',
      table:'#BE9E70', chair:'#9C8C74', trouser:'#6C6454',
      skin:'#E3C39A', hair:'#4A3A2C',
      monOff:'#AEB6BE', monOn:'#7FA9D6', lampBrass:'#8C6C2C', lampShade:'#E7B54E',
      glow:'#F0C868', sage:'#4E9E77', brass:'#8C6C2C', muted:'#7C7059',
      lead:'#4A5364', leadTie:'#A6822E',
      shadow:'rgba(60,44,20,.20)', plant:'#6FA070', plantPot:'#A6714A',
      wood:'#B08E5E', cabinet:'#B7AE9E', cabinet2:'#C6BDAC', metal:'#C9C1B2',
      book:['#B87A62','#6E90A8','#93A56E','#C9A24E','#8C7CA8','#5E9C90'],
      winSky:'#DCEBF4', winSky2:'#B6D2E4', winFrame:'#C6BDAC', coffee:'#5A4030', mug:'#F0EADC',
      paper:'#FBF6EA', board:'#FDFBF5', boardTrim:'#C6BDAC', ceil:'#F0C868', steam:'#8C8478'
    }
  };
  const mqLightPref=window.matchMedia('(prefers-color-scheme: light)');
  function currentTheme(){
    const set = rootEl.getAttribute('data-theme');
    if(set) return set;
    return mqLightPref.matches ? 'light' : 'dark';
  }
  let P = PAL[currentTheme()];

  /* ---------- shading helpers — 단일 광원(좌상단) 일관 음영 ---------- */
  const _c={};
  function fc(hex,f){
    const key=hex+'|'+f; if(_c[key]) return _c[key];
    let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    r=Math.min(255,r*f)|0; g=Math.min(255,g*f)|0; b=Math.min(255,b*f)|0;
    return _c[key]=`rgb(${r},${g},${b})`;
  }
  let LW=0.7;
  function poly(pts,fill){
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
    ctx.lineWidth=LW; ctx.strokeStyle=fill; ctx.stroke();
  }
  function box(gx,gy,gz,w,d,h,hex,topF){
    const Z=gz+h, X=gx+w, Y=gy+d;
    const tA=project(gx,gy,Z), tB=project(X,gy,Z), tC=project(X,Y,Z), tD=project(gx,Y,Z);
    const bB=project(X,gy,gz), bC=project(X,Y,gz), bD=project(gx,Y,gz);
    poly([tB,tC,bC,bB], fc(hex,0.58));            // +gx right face (dark)
    poly([tD,tC,bC,bD], fc(hex,0.80));            // +gy left face (mid)
    poly([tA,tB,tC,tD], fc(hex, topF||1.16));     // top (warm light)
  }
  function boxC(ccx,ccy,gz,w,d,h,hex,topF){ box(ccx-w/2, ccy-d/2, gz, w,d,h,hex,topF); }
  function shadeHex(hex,f){
    if(!hex || hex[0]!=='#') return hex||'#000000';
    const r=Math.min(255,parseInt(hex.slice(1,3),16)*f)|0;
    const g=Math.min(255,parseInt(hex.slice(3,5),16)*f)|0;
    const b=Math.min(255,parseInt(hex.slice(5,7),16)*f)|0;
    return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }
  function tile(gx,gy,gz,w,d,fill){
    const tA=project(gx,gy,gz), tB=project(gx+w,gy,gz), tC=project(gx+w,gy+d,gz), tD=project(gx,gy+d,gz);
    poly([tA,tB,tC,tD], fill);
  }
  function shadowEllipse(gx,gy,rx){
    const c=project(gx,gy,0.02);
    ctx.save(); ctx.beginPath();
    ctx.ellipse(c.x,c.y, rx*TW*0.5, rx*TH*0.5, 0, 0, Math.PI*2);
    ctx.fillStyle=P.shadow; ctx.fill(); ctx.restore();
  }

  /* ---------- v2 rounded primitives (탈복셀 — 귀엽고 정교한 라운드 셰이딩) ----------
     orb  : 구(球) — 좌상단 하이라이트 방사 그라데이션, 캐릭터 머리/손/관절
     puck : 둥근 실린더 — 몸통/의자/화분, 밑면 타원 + 측면 수직 그라데이션 + 밝은 탑캡
     limb : 라운드캡 스트로크 캡슐 — 팔·소매·타이. world transform 안에서 project() 좌표로 그림 */
  function orb(gx,gy,gz,r,hex,squash){
    const p=project(gx,gy,gz);
    const rx=r*TW*0.98, ry=r*TW*(squash||0.92);
    const g=ctx.createRadialGradient(p.x-rx*0.35,p.y-ry*0.45,rx*0.12, p.x,p.y,rx*1.18);
    g.addColorStop(0, fc(hex,1.24)); g.addColorStop(0.55, fc(hex,1.0)); g.addColorStop(1, fc(hex,0.62));
    ctx.beginPath(); ctx.ellipse(p.x,p.y,rx,ry,0,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  }
  function puck(gx,gy,gz,r,h,hex){
    const b=project(gx,gy,gz), tp=project(gx,gy,gz+h);
    const rx=r*TW*0.92, ry=r*TH*0.92;
    const g=ctx.createLinearGradient(b.x-rx,0,b.x+rx,0);
    g.addColorStop(0, fc(hex,0.88)); g.addColorStop(0.42, fc(hex,1.04)); g.addColorStop(1, fc(hex,0.60));
    ctx.beginPath();
    ctx.moveTo(tp.x-rx, tp.y);
    ctx.lineTo(b.x-rx, b.y);
    ctx.ellipse(b.x,b.y,rx,ry,0, Math.PI, 0, true);   // 앞쪽 밑면 볼록
    ctx.lineTo(tp.x+rx, tp.y);
    ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    const tg=ctx.createRadialGradient(tp.x-rx*0.3,tp.y-ry*0.35,rx*0.1, tp.x,tp.y,rx*1.1);
    tg.addColorStop(0, fc(hex,1.28)); tg.addColorStop(1, fc(hex,1.02));
    ctx.beginPath(); ctx.ellipse(tp.x,tp.y,rx,ry,0,0,Math.PI*2); ctx.fillStyle=tg; ctx.fill();
  }
  function limb(x1,y1,z1,x2,y2,z2,wpx,hex,f){
    const a=project(x1,y1,z1), b=project(x2,y2,z2);
    ctx.save(); ctx.strokeStyle=fc(hex,f||0.98); ctx.lineWidth=wpx; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore();
  }

  /* ---------- characters ---------- */
  const lead={ id:'LEAD', name:'팀장 · Claude', gx:0.0, gy:4.0, face:'x+', lead:true, phase:0.0 };
  const agents=[
    {id:'A-1', tag:'이력서',  gx:2.2, gy:2.4, face:'y+'},
    {id:'A-2', tag:'채용',    gx:4.7, gy:2.4, face:'y+'},
    {id:'A-3', tag:'온보딩',  gx:7.2, gy:2.4, face:'y+'},
    {id:'A-4', tag:'평가',    gx:9.7, gy:2.4, face:'y+'},
    {id:'A-5', tag:'배포',    gx:3.45, gy:5.5, face:'y-'},
    {id:'A-6', tag:'감사',    gx:5.95, gy:5.5, face:'y-'},
    {id:'A-7', tag:'효율',    gx:8.45, gy:5.5, face:'y-'}
  ];
  // per-character personality — distinct idle facial-expression bias + a staggered starting behavior
  const EXPR_IDLE=[ ['calm','smile','ponder'], ['smile','grin','calm'], ['smile','content','wink'],
    ['calm','ponder','tired'], ['smile','calm','surprise'], ['focus','calm','ponder'], ['grin','smile','wink'] ];
  const INIT_BEH=['read','mouse','coffee','think','glance','type','stretch'];
  agents.forEach((a,i)=>{
    a.phase=i*0.9; a.status='idle'; a.task=''; a.tStart=0; a.tDur=0; a.tDone=0; a.color=AGENT_COLORS[a.id];
    a.nod=0; a.nodAt=2+Math.random()*4; a._nodStart=0;
    a.beh=INIT_BEH[i%INIT_BEH.length]; a.behStart=0; a.behDur=2.5; a.behEnd=1.2+i*0.55+Math.random()*1.4;
    a.behPrev=null; a.behBlendStart=-99;
    a.exprIdle=EXPR_IDLE[i%EXPR_IDLE.length]; a.expr=null; a.exprEnd=0.8+i*0.4;
    a.blinkAt=1.5+Math.random()*4; a._blinkT=-9;
  });
  lead.status='idle'; lead.color=null; lead.nod=0; lead.nodAt=3; lead._nodStart=0; lead.tag='';
  lead.beh='rest'; lead.behStart=0; lead.behDur=3; lead.behEnd=2.5; lead.behPrev=null; lead.behBlendStart=-99;
  lead.exprIdle=['smile','smile','content','grin','calm']; lead.expr='smile'; lead.exprEnd=2;
  lead.blinkAt=2.2; lead._blinkT=-9;
  const chars=[lead, ...agents];
  const byId={}; chars.forEach(c=>byId[c.id]=c);

  function faceVec(f){ return f==='y+'?[0,1] : f==='y-'?[0,-1] : [1,0]; }

  /* ---------- behavior / pose engine (varied, desynced idle motion) ----------
     Each character cycles through a small repertoire of behaviors (typing, coffee sip, stretch,
     reading, chin-thinking, mouse, glance, chair swivel) at randomized durations with a per-seat
     phase offset, so no two do the same thing at once. Busy agents lock to focused typing. A pose
     object (arm reach/lift, head pitch/tilt/turn, held prop) is produced per frame and blended
     briefly across switches so transitions read smoothly. Under prefers-reduced-motion the current
     pose is HELD (gesture envelope pinned to its peak) with no oscillation → a still, varied tableau. */
  const IDLE_BEHS=['rest','coffee','stretch','read','think','mouse','glance','swivel'];
  const LEAD_BEHS=['rest','think','glance','nod'];
  const BEH_DUR={ rest:[2.5,4.5], type:[99,99], coffee:[2.2,3.0], stretch:[1.4,2.0],
    read:[3.6,5.4], think:[2.6,4.2], mouse:[2.4,4.0], glance:[1.4,2.4], swivel:[2.2,3.4], nod:[1.6,2.6] };
  function behDur(nb){ const r=BEH_DUR[nb]||[2.5,4]; return r[0]+Math.random()*(r[1]-r[0]); }
  function setBeh(c,beh,t){ c.behPrev=c.beh; c.behStart=t; c.behDur=behDur(beh); c.behEnd=t+c.behDur; c.behBlendStart=t; c.beh=beh; }
  function updateBehavior(c,t){
    if(c.status==='busy'){ if(c.beh!=='type') setBeh(c,'type',t); return; }   // busy → focused typing
    if(c.beh==='type'){ setBeh(c,'rest',t); return; }                          // just finished → settle
    if(MOTION===0) return;                                                     // reduced motion → hold pose
    if(t>=c.behEnd){
      const pool=c.lead?LEAD_BEHS:IDLE_BEHS;
      let nb, guard=0; do{ nb=pool[(Math.random()*pool.length)|0]; guard++; }while(nb===c.beh && guard<4);
      setBeh(c,nb,t);
    }
  }
  function armObj(spread,fReach,hReach,dz){ return {spread:spread,fReach:fReach,hReach:hReach,dz:dz}; }
  function rawPose(beh,c,t,m){
    const ph=c.phase;
    const p=Math.max(0,Math.min(1,(t-(c.behStart||0))/(c.behDur||1)));
    const env = m? Math.sin(Math.PI*p) : 1;                 // 0→1→0 gesture envelope (held at peak when still)
    let A=armObj(0.31,0.24,0.44, m*Math.sin(t*3+ph)*0.03);
    let B=armObj(0.31,0.24,0.44, m*Math.sin(t*3+ph+1.7)*0.024);
    let nodF=0, tilt=0, yaw=0, prop=null, propSide=1;
    switch(beh){
      case 'type':
        A=armObj(0.30,0.27,0.47, m*Math.sin(t*13+ph)*0.10);
        B=armObj(0.30,0.27,0.47, m*Math.sin(t*13+ph+Math.PI)*0.10);
        nodF=0.06; break;
      case 'coffee':                                        // one hand lifts a mug to the mouth
        A=armObj(0.31-0.17*env, 0.30-0.05*env, 0.44-0.16*env, 0.50*env);
        nodF=0.10*env; prop='coffee'; propSide=1; break;
      case 'stretch':                                       // both arms up, head leans back
        A=armObj(0.31+0.10*env, 0.24-0.16*env, 0.44-0.28*env, 0.52*env);
        B=armObj(0.31+0.10*env, 0.24-0.16*env, 0.44-0.28*env, 0.52*env);
        nodF=-0.18*env; break;
      case 'read':                                          // both hands hold a sheet, head down
        A=armObj(0.22,0.30,0.40, 0.06+m*Math.sin(t*2+ph)*0.02);
        B=armObj(0.22,0.30,0.40, 0.06+m*Math.sin(t*2+ph+1)*0.02);
        nodF=0.30; prop='paper'; break;
      case 'think':                                         // chin rest, slight head tilt
        A=armObj(0.10,0.18,0.20, 0.40);
        nodF=0.12; tilt=0.05; break;
      case 'mouse':                                         // one hand nudges the mouse
        A=armObj(0.31+m*Math.sin(t*3.4+ph)*0.06, 0.30, 0.48, 0.02+m*Math.sin(t*7+ph)*0.02);
        break;
      case 'glance':                                        // quick look aside
        yaw = m? Math.sin(t*1.2+ph)*0.45 : 0.35; break;
      case 'swivel':                                        // slow chair turn
        yaw = m? Math.sin(t*0.6+ph)*0.60 : 0.45; break;
      case 'nod':                                           // gentle approving nod (lead)
        nodF = m? Math.max(0,Math.sin(t*3+ph))*0.16 : 0.08; break;
      case 'rest': default: break;
    }
    return {A:A,B:B,nodF:nodF,tilt:tilt,yaw:yaw,prop:prop,propSide:propSide};
  }
  function lerpArm(a,b,k){ return armObj(a.spread+(b.spread-a.spread)*k, a.fReach+(b.fReach-a.fReach)*k, a.hReach+(b.hReach-a.hReach)*k, a.dz+(b.dz-a.dz)*k); }
  function poseFor(c,t,busy,m){
    const cur=rawPose(c.beh||'rest',c,t,m);
    const BLEND=0.4, bt=t-(c.behBlendStart||-99);
    if(c.behPrev && c.behPrev!==c.beh && bt<BLEND){
      const prev=rawPose(c.behPrev,c,t,m), k=bt/BLEND;
      return { A:lerpArm(prev.A,cur.A,k), B:lerpArm(prev.B,cur.B,k),
        nodF:prev.nodF+(cur.nodF-prev.nodF)*k, tilt:prev.tilt+(cur.tilt-prev.tilt)*k,
        yaw:prev.yaw+(cur.yaw-prev.yaw)*k, prop:k>0.5?cur.prop:prev.prop, propSide:k>0.5?cur.propSide:prev.propSide };
    }
    return cur;
  }

  /* ---------- one drawable per character (internal painter order, back → front) ----------
     v2 「라운드 피겨린」: 의자(퍽+캡슐) → 무릎 → 몸통 캡슐 → 어깨 돔 → 카라·타이 →
     팔(라운드캡 캡슐 + 손 orb) → 목 → 큰 둥근 머리 orb → 헤어캡(상반부 아크) + 앞머리 + 옆머리 →
     복셀 박스 탈피, 단일 광원 그라데이션 구체 셰이딩. 팀장은 다크 수트 + 골드 타이 + 가르마 하이라이트.
     Preserves c._headZ (bubble anchor) and c._face (expression anchor). */
  function drawChar(c,t){
    const busy=c.status==='busy';
    const m=MOTION;
    const s=c.lead?0.98:0.80;
    const cx=c.gx, cy=c.gy;
    const pose=poseFor(c,t,busy,m);             // varied behavior pose (arms / head / prop)
    let fv=faceVec(c.face);
    if(c.lead && c.lookTarget){                 // lead turns toward the agent she just assigned
      fv = (c.lookTarget.gy < c.gy) ? [0.5,-0.86] : [0.5,0.86];
    }
    if(pose.yaw){                               // glance / chair-swivel turns the upper body
      const cs=Math.cos(pose.yaw), sn=Math.sin(pose.yaw);
      fv=[fv[0]*cs - fv[1]*sn, fv[0]*sn + fv[1]*cs];
    }
    const fl=Math.hypot(fv[0],fv[1])||1, fx=fv[0]/fl, fy=fv[1]/fl;   // facing unit
    const px=-fy, py=fx;                        // in-plane perpendicular (shoulder axis)
    const alongX=Math.abs(fx)>=Math.abs(fy);

    const shirt = c.lead?P.lead:c.color;        // jacket / shirt
    const shirtHi = shadeHex(shirt,1.10);
    const tieCol = c.lead?P.leadTie:shadeHex(c.color,0.60);   // lead gold tie / agent uniform accent
    const skin=P.skin, hair=P.hair;

    shadowEllipse(cx,cy, 0.72*s);               // AO 바닥 타원 그림자

    const breathe=Math.sin(t*1.7 + c.phase)*0.016*m;
    const nod=(c.nod||0)*0.085*m + pose.nodF;   // micro-nod + behavior head pitch (read/stretch/think…)

    /* ----- chair (behind) — rounded swivel chair ----- */
    puck(cx - fx*0.42*s, cy - fy*0.42*s, 0.04, 0.30*s, 1.02*s, P.chair);                 // back post (rounded)
    orb(cx - fx*0.42*s, cy - fy*0.42*s, 1.18*s, 0.24*s, shadeHex(P.chair,1.14), 0.66);   // headrest cushion
    puck(cx, cy, 0.02, 0.42*s, 0.42, P.chair);                                           // seat cushion
    limb(cx + px*0.38*s, cy + py*0.38*s, 0.16, cx + px*0.38*s, cy + py*0.38*s, 0.52, 0.10*TW*s, shadeHex(P.chair,0.9)); // armrest R
    limb(cx - px*0.38*s, cy - py*0.38*s, 0.16, cx - px*0.38*s, cy - py*0.38*s, 0.52, 0.10*TW*s, shadeHex(P.chair,0.9)); // armrest L

    /* ----- lap / knees (trousers), reaching forward ----- */
    puck(cx + fx*0.16*s, cy + fy*0.16*s, 0.44, 0.30*s, 0.22, P.trouser);
    orb(cx + fx*0.32*s + px*0.15*s, cy + fy*0.32*s + py*0.15*s, 0.60, 0.11*s, shadeHex(P.trouser,1.05), 0.8); // knee R
    orb(cx + fx*0.32*s - px*0.15*s, cy + fy*0.32*s - py*0.15*s, 0.60, 0.11*s, shadeHex(P.trouser,1.05), 0.8); // knee L

    /* ----- torso: soft capsule + shoulder dome ----- */
    const waistZ=0.52;
    puck(cx, cy, waistZ+breathe*0.5, 0.34*s, 0.74*s, shirt);                             // waist→chest capsule
    const shZ=waistZ+0.74*s;
    orb(cx, cy, shZ+breathe, 0.32*s, shirtHi, 0.52);                                     // shoulders (rounded dome)

    /* ----- collar + tie / uniform accent (on the camera-facing chest) ----- */
    orb(cx + fx*0.22*s, cy + fy*0.22*s, shZ-0.04+breathe, 0.11*s, c.lead? shadeHex(shirt,0.8):'#ECE4D2', 0.6); // collar
    limb(cx + fx*0.28*s, cy + fy*0.28*s, shZ-0.06+breathe,
         cx + fx*0.30*s, cy + fy*0.30*s, shZ-0.06-(c.lead?0.36:0.28)*s+breathe, 0.085*TW*s, tieCol, 1.15);      // tie / lanyard

    /* ----- rounded arms (pose-driven: reach / lift / spread vary by behavior) ----- */
    let propHand=null;
    for(let i=0;i<2;i++){
      const side=i===0?1:-1, ap=i===0?pose.A:pose.B;
      const sxo=cx+px*0.30*s*side, syo=cy+py*0.30*s*side;      // shoulder joint (sleeve anchor)
      const armPx=ap.spread*s*side;
      const ez=shZ-0.42*s + ap.dz;
      const hxp=cx+px*armPx + fx*ap.hReach*s, hyp=cy+py*armPx + fy*ap.hReach*s;
      limb(sxo, syo, shZ-0.04+breathe, hxp, hyp, ez+0.07, 0.125*TW*s, shirt, 1.0);       // sleeve capsule
      if(pose.prop==='coffee' && side===pose.propSide){ propHand={x:hxp,y:hyp,z:ez}; }   // draw hand+mug atop the face later
      else { orb(hxp, hyp, ez+0.05, 0.085*s, skin); }                                    // hand
    }
    // held sheet (reading) — upright in front of the chest, below the face
    if(pose.prop==='paper'){
      boxC(cx+fx*0.40*s, cy+fy*0.40*s, waistZ+0.28*s, (alongX?0.10:0.42)*s,(alongX?0.42:0.10)*s,0.30*s, P.paper, 1.22);
    }

    /* ----- neck ----- */
    puck(cx + fx*0.02*s, cy + fy*0.02*s, shZ+0.02+breathe, 0.09*s, 0.12*s, shadeHex(skin,0.94));

    /* ----- head: big cute orb + hair cap / bangs / side locks ----- */
    const hz=shZ+0.14*s + breathe - nod*0.30;
    const hx=cx + fx*nod*0.5 + px*pose.tilt*s, hy=cy + fy*nod*0.5 + py*pose.tilt*s;
    const headC=hz+0.26*s;                                                               // head orb center z
    orb(hx, hy, headC, 0.275*s, skin, 0.96);                                             // head
    const hp=project(hx,hy,headC);
    const hrx=0.275*s*TW*1.0, hry=0.275*s*TW*0.96;
    const fscr=project(hx+fx*0.3, hy+fy*0.3, headC);                                     // facing dir on screen
    const fsx=Math.sign(fscr.x-hp.x)||1;
    // hair cap — upper hemisphere chord fill with soft gradient
    const hg=ctx.createRadialGradient(hp.x-hrx*0.3,hp.y-hry*0.55,hrx*0.1, hp.x,hp.y-hry*0.2,hrx*1.15);
    hg.addColorStop(0, fc(hair,1.35)); hg.addColorStop(1, fc(hair,0.85));
    ctx.beginPath(); ctx.ellipse(hp.x,hp.y,hrx*1.03,hry*1.0,0, Math.PI, 0, false);
    ctx.closePath(); ctx.fillStyle=hg; ctx.fill();
    // bangs — soft fringe blob dipping onto the camera-facing forehead
    ctx.beginPath(); ctx.ellipse(hp.x+fsx*hrx*0.34, hp.y-hry*0.34, hrx*0.46, hry*0.30, fsx*0.3, 0, Math.PI*2);
    ctx.fillStyle=fc(hair,1.08); ctx.fill();
    // side locks
    ctx.beginPath(); ctx.ellipse(hp.x-hrx*0.88, hp.y+hry*0.05, hrx*0.20, hry*0.34, 0, 0, Math.PI*2); ctx.fillStyle=fc(hair,0.92); ctx.fill();
    ctx.beginPath(); ctx.ellipse(hp.x+hrx*0.88, hp.y+hry*0.05, hrx*0.20, hry*0.34, 0, 0, Math.PI*2); ctx.fillStyle=fc(hair,0.78); ctx.fill();
    if(c.lead){                                                                          // neat side part highlight
      ctx.beginPath(); ctx.ellipse(hp.x-fsx*hrx*0.12, hp.y-hry*0.62, hrx*0.34, hry*0.10, -fsx*0.5, 0, Math.PI*2);
      ctx.fillStyle=fc(hair,1.5); ctx.fill();
    }
    // blush dots — 볼터치 (귀여움 포인트, 표정과 무관한 고정 디테일)
    ctx.globalAlpha=0.30;
    ctx.beginPath(); ctx.ellipse(hp.x+fsx*hrx*0.52, hp.y+hry*0.28, hrx*0.14, hry*0.09, 0, 0, Math.PI*2);
    ctx.fillStyle='#E08A6A'; ctx.fill();
    ctx.globalAlpha=1;

    c._headZ = hz+0.58*s;

    // coffee: the raised hand + mug sit in FRONT of the face → drawn after the head
    if(propHand){
      orb(propHand.x, propHand.y, propHand.z+0.04, 0.085*s, skin);                       // hand
      puck(propHand.x, propHand.y, propHand.z+0.06, 0.085*s, 0.16, P.mug);               // mug
      const cs=project(propHand.x, propHand.y, propHand.z+0.22);
      ctx.beginPath(); ctx.ellipse(cs.x,cs.y, 0.055*s*TW, 0.055*s*TH, 0,0,Math.PI*2);
      ctx.fillStyle=fc(P.coffee,1.0); ctx.fill();                                        // coffee surface
    }

    // anchor for the (billboard) facial expression, on the camera-facing front of the head
    const fWx = hx + fx*0.20*s, fWy = hy + fy*0.19*s;
    const fp = toScreen(fWx, fWy, hz+0.24*s);
    c._face = { x:fp.x, y:fp.y, s:s };
  }

  /* ---------- desk props per seat ---------- */
  function propAnchor(c){
    if(c.face==='y+') return {px:c.gx, py:3.05, dir:'row'};
    if(c.face==='y-') return {px:c.gx, py:4.72, dir:'row'};
    return {px:0.95, py:c.gy-0.30, dir:'lead'};
  }
  function drawMonitor(c,t){
    const a=propAnchor(c); const on=c.status==='busy';
    // 모니터 글로우 플리커 — busy 화면은 미세하게 명멸 (micro-animation, MOTION 게이트)
    const flick = on ? (1.46 + 0.10*Math.sin(t*9+ (c.phase||0))*MOTION) : 1.0;
    const scr = on?P.monOn:P.monOff;
    if(a.dir==='lead'){
      puck(a.px+0.05, a.py+0.30, 1.0, 0.10, 0.12, P.chair);                    // rounded stand
      box(a.px, a.py, 1.10, 0.06,0.60,0.42, scr, flick);
      box(a.px-0.005, a.py-0.02, 1.08, 0.05,0.64,0.02, shadeHex(P.chair,1.3), 1.2); // slim bezel foot

      box(a.px-0.30, a.py, 1.10, 0.60,0.06,0.42, scr, flick);
      box(a.px-0.32, a.py-0.005, 1.08, 0.64,0.05,0.02, shadeHex(P.chair,1.3), 1.2);

    c._mon={x:a.px, y:a.py, on};
  }
  function drawLamp(c){
    const a=propAnchor(c); const lit=c.status==='busy'||c.status==='done';
    let lx,ly;
    if(a.dir==='lead'){ lx=a.px+0.02; ly=a.py+0.66; } else { lx=a.px+0.48; ly=a.py-0.02; }

  // 커피 김 — mug 위로 피어오르는 수증기 (micro-animation; reduced-motion이면 정지 한 가닥)
  function drawSteam(wx,wy,z,t,ph){
    ctx.save();
    for(let i=0;i<3;i++){
      const tt = MOTION? ((t*0.35 + i/3 + (ph||0))%1) : (0.25+i*0.22);
      const p=project(wx + Math.sin((t*2.2*MOTION)+(ph||0)+i*2.1)*0.03, wy, z + 0.10 + tt*0.55);
      const r=(0.028 + tt*0.05)*TW, alpha=(1-tt)*0.30*(MOTION?1:0.5);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2);
      ctx.fillStyle=hexA(P.steam, alpha); ctx.fill();
    }
    ctx.restore();
  }
