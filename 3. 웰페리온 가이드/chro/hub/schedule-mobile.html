<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>웰페리온 휴무 모바일</title>
<style>
  :root{
    --bg:#f3f0ea; --surface:#ffffff; --surface2:#f7f4ee; --raise:#efeae1;
    --ink:#26211d; --dim:#7a7468; --faint:#a29b8e;
    --line:rgba(60,50,40,.28); --line2:rgba(60,50,40,.16);
    --bronze:#9a7b4f; --bronze2:#7c6034;
    --green:#2f8a5a; --blue:#3b6ea8; --amber:#a9842f; --rose:#b5577f; --red:#c0463d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{overflow-x:hidden;max-width:100vw}
  body{font-family:"Pretendard",'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom)}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;font-size:14px;transition:.15s;min-height:44px}
  button:active{filter:brightness(.95)}
  button.primary{background:var(--bronze);color:#fff;border-color:var(--bronze);font-weight:800}
  button.ghost{background:transparent}
  button.danger{border-color:rgba(192,70,61,.45);color:var(--red)}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  header.top{position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 14px}
  .brand{font-size:15.5px;font-weight:800;letter-spacing:.2px}
  .brand span{color:var(--bronze)}
  .brand small{display:block;font-size:11px;font-weight:500;color:var(--dim);margin-top:2px}
  .statusrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .badge{font-size:11px;font-weight:700;border-radius:20px;padding:4px 10px;border:1px solid var(--line);color:var(--dim);background:var(--surface2)}
  .badge.ok{color:var(--green);border-color:rgba(47,138,90,.35);background:rgba(47,138,90,.07)}
  .badge.bad{color:var(--rose);border-color:rgba(181,87,127,.35);background:rgba(181,87,127,.07)}
  .badge.pin{color:var(--bronze2);border-color:rgba(154,123,79,.4);background:rgba(154,123,79,.08)}
  .iconbtn{min-width:38px;min-height:38px;padding:0 10px;border-radius:10px;font-size:12px}

  .empbar{position:sticky;top:64px;z-index:24;background:var(--surface2);border-bottom:1px solid var(--line);padding:10px 14px}
  .empbar label{display:block;font-size:10.5px;font-weight:700;color:var(--faint);margin-bottom:5px;letter-spacing:.3px}
  select.big{width:100%;font-size:16px;padding:12px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);min-height:48px;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%237a7468' d='M5 8l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
  /* [2026-09-03] 이름 선택 시 상단에 뜨는 잔여 연차 정보 — 서버 산출(SRV_ANN) 그대로 표시, 클라이언트 재계산 없음 */
  .leavebar{display:none;gap:8px;margin-top:8px}
  .leavebar.on{display:flex}
  .leavebar .lstat{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 6px;text-align:center;min-width:0}
  .leavebar .lstat .k{font-size:9.5px;color:var(--faint);font-weight:700;letter-spacing:.2px}
  .leavebar .lstat .v{font-size:15px;font-weight:800;margin-top:1px}
  .leavebar.note{background:#fff;border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--dim);text-align:center;display:none}
  .leavebar.note.on{display:block}

  .tabbar{display:flex;position:sticky;top:132px;z-index:23;background:var(--surface);border-bottom:1px solid var(--line)}
  .tabbtn{flex:1;padding:13px 4px;text-align:center;font-weight:800;font-size:13.5px;color:var(--dim);border:none;border-bottom:3px solid transparent;background:none;border-radius:0;min-height:46px}
  .tabbtn.on{color:var(--bronze2);border-bottom-color:var(--bronze)}

  .wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
  .hint{background:var(--surface);border:1px dashed rgba(154,123,79,.45);border-radius:11px;padding:10px 13px;font-size:12px;color:var(--dim);margin-bottom:14px}
  .hint b{color:var(--ink)}

  .monthnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .monthnav button{min-width:46px;min-height:46px;font-size:19px;flex-shrink:0;padding:0}
  .monthnav b{flex:1;text-align:center;font-size:17.5px;font-weight:800}
  .quickjump{display:flex;gap:8px;margin-bottom:14px}
  .quickjump button{flex:1;font-size:12.5px;padding:10px 4px}

  .daylist{display:flex;flex-direction:column;gap:7px}
  .dayrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 13px;min-height:58px}
  .dayrow.writable{cursor:pointer}
  .dayrow.writable:active{background:var(--raise)}
  .dayrow.today{border-color:var(--red);border-width:2px}
  .dnum{width:46px;text-align:center;flex-shrink:0}
  .dnum b{display:block;font-size:19px;font-weight:800;line-height:1.1}
  .dnum span{font-size:10.5px;color:var(--dim);font-weight:700}
  .dayrow.sat .dnum b{color:var(--blue)}
  .dayrow.sun .dnum b,.dayrow.hol .dnum b{color:var(--red)}
  .dmid{flex:1;min-width:0}
  .dholiday{font-size:10.5px;color:var(--red);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dval{flex-shrink:0}
  .chip{display:inline-block;font-size:12.5px;font-weight:800;border-radius:20px;padding:6px 13px;white-space:nowrap}
  .chip.empty{color:var(--faint);font-weight:600;font-size:12px;background:transparent;border:1px dashed var(--line2);padding:5px 12px}
  .chip.ghost{opacity:.55}
  .o-work{background:#f0e9da;color:#241d15;border:1px solid #d3c7ae}
  .o-hu,.o-yc,.o-hg,.o-gh,.o-dh{background:#e3ddd3;color:#6b6156;border:1px solid #cfc6b8}
  .o-bc{background:#e2eef9;color:#3b6ea8;border:1px solid #bcd6ec}
  .plus{color:var(--faint);font-size:20px;font-weight:400}
  .emptystate{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:40px 18px;text-align:center;color:var(--dim);font-size:13px}

  /* ===== 오버레이(모달·바텀시트) ===== */
  .ov{position:fixed;inset:0;background:rgba(30,25,20,.5);display:none;align-items:flex-end;justify-content:center;z-index:60}
  .ov.center{align-items:center;padding:16px}
  .ov.on{display:flex}
  .sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .modal{background:var(--surface);border-radius:18px;width:100%;max-width:340px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
  .sheet h3,.modal h3{font-size:16px;margin-bottom:3px}
  .sheet p.sub,.modal p.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .seg{display:flex;gap:8px;margin-bottom:16px}
  .seg button{flex:1;padding:12px 4px;font-weight:800;font-size:13.5px}
  .seg button.on{background:var(--bronze);color:#fff;border-color:var(--bronze)}
  .offgrid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .offgrid button{border-radius:999px;padding:11px 16px;font-size:13px;font-weight:800;min-height:46px}
  .offgrid button.sel{outline:3px solid var(--bronze);outline-offset:1px}
  label.fl{display:block;font-size:11px;font-weight:700;color:var(--faint);margin:12px 0 6px;letter-spacing:.3px}
  .row2{display:flex;gap:10px}
  .row2>div{flex:1}
  input[type=time]{width:100%;font-family:inherit;font-size:15px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:46px}
  .actions{display:flex;gap:9px;margin-top:18px}
  .actions button{flex:1}
  .pin-input{width:100%;font-family:inherit;font-size:22px;letter-spacing:9px;text-align:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .pin-input:focus{outline:none;border-color:var(--bronze)}
  .pin-err{color:var(--red);font-size:12px;font-weight:700;margin-top:8px;min-height:16px}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2a241e;color:#fff;font-size:13px;font-weight:600;border-radius:11px;padding:11px 18px;z-index:80;box-shadow:0 8px 26px rgba(0,0,0,.3);max-width:88vw;text-align:center;display:none}
  .savingbar{font-size:12px;color:var(--dim);text-align:center;margin-top:10px;display:none}
</style>
<link rel="stylesheet" href="../../assets/wp-typography.css">
</head>
<body>

<header class="top">
  <div class="brand">WELL<span>PERION</span> · 휴무 모바일
    <small>내 휴무 확인 / 다음 휴무표 작성 — 한남점</small>
  </div>
  <div class="statusrow">
    <span class="badge" id="syncBadge">● 서버 연결 중…</span>
    <span class="badge pin" id="pinBadge" style="display:none"></span>
    <button class="iconbtn ghost" onclick="manualRefresh()">↻ 새로고침</button>
  </div>
</header>

<div class="empbar">
  <label>내 이름 (보드 명단에서 선택)</label>
  <select class="big" id="empSel" onchange="onEmpChange()">
    <option value="">— 이름을 선택하세요 —</option>
  </select>
  <div class="leavebar" id="leaveStats">
    <div class="lstat"><div class="k">총연차</div><div class="v" id="lv_total">—</div></div>
    <div class="lstat"><div class="k">잔여</div><div class="v" id="lv_rem">—</div></div>
  </div>
  <div class="leavebar note" id="leaveNote"></div>
</div>

<div class="tabbar">
  <button class="tabbtn on" id="tabBtnView" onclick="switchTab('view')">📅 내 휴무 확인</button>
  <button class="tabbtn" id="tabBtnEdit" onclick="switchTab('edit')">✏️ 다음 휴무표 작성</button>
</div>

<div class="wrap">
  <!-- ===== 확인 탭 ===== -->
  <div id="panelView">
    <div class="hint">이름을 선택하면 <b>본인 휴무만</b> PIN 확인 후 표시됩니다. 조회 전용 — 수정은 <b>다음 휴무표 작성</b> 탭에서.</div>
    <div class="monthnav">
      <button class="ghost" onclick="moveMonth('view',-1)">‹</button>
      <b id="viewMonthLabel">–</b>
      <button class="ghost" onclick="moveMonth('view',1)">›</button>
    </div>
    <div class="quickjump">
      <button onclick="gotoMonth('view',0)">이번달</button>
      <button onclick="gotoMonth('view',1)">다음달</button>
    </div>
    <div class="daylist" id="viewList"></div>
  </div>

  <!-- ===== 작성 탭 ===== -->
  <div id="panelEdit" style="display:none">
    <div class="hint">칸을 누르면 <b>바로 입력</b>합니다. 값은 <b>휴무코드(휴·연차·반차오전·반차오후·공휴·대휴·휴관)</b> 또는 <b>출근시간</b> 중 하나만 저장됩니다. 저장 후 서버 재조회로 반영을 확인합니다.</div>
    <div class="monthnav">
      <button class="ghost" onclick="moveMonth('edit',-1)">‹</button>
      <b id="editMonthLabel">–</b>
      <button class="ghost" onclick="moveMonth('edit',1)">›</button>
    </div>
    <div class="quickjump">
      <button onclick="gotoMonth('edit',0)">이번달</button>
      <button class="primary" onclick="gotoMonth('edit',1)">다음달 (작성용)</button>
    </div>
    <div class="daylist" id="editList"></div>
  </div>
</div>

<!-- PIN 게이트 모달 -->
<div class="ov center" id="ovPin">
  <div class="modal">
    <h3 id="pin_title">PIN 확인</h3>
    <p class="sub" id="pin_sub"></p>
    <input type="password" inputmode="numeric" maxlength="4" class="pin-input" id="pin_inp" placeholder="····" autocomplete="off">
    <div class="pin-err" id="pin_err"></div>
    <div class="actions">
      <button class="ghost" onclick="closeOv('ovPin')">취소</button>
      <button class="primary" onclick="pinSubmit()">확인</button>
    </div>
  </div>
</div>

<!-- 편집 바텀시트 -->
<div class="ov" id="ovEdit">
  <div class="sheet">
    <h3 id="ed_title">휴무 입력</h3>
    <p class="sub" id="ed_sub"></p>
    <div class="seg">
      <button id="segOff" class="on" onclick="setEdMode('off')">휴무코드</button>
      <button id="segWork" onclick="setEdMode('work')">출근시간</button>
    </div>
    <div id="edOffWrap">
      <div class="offgrid" id="offGrid"></div>
    </div>
    <div id="edWorkWrap" style="display:none">
      <div id="freeTimeWrap">
        <label class="fl">출근</label>
        <div class="row2">
          <div><input type="time" id="ed_s"></div>
          <div><input type="time" id="ed_e" placeholder="퇴근(선택)"></div>
        </div>
        <p class="sub" style="margin-top:8px;margin-bottom:0">퇴근은 비워둘 수 있습니다.</p>
      </div>
      <div id="workPresetWrap" style="display:none">
        <label class="fl">근무조 선택 (지원부는 아래 중에서만)</label>
        <p class="sub" id="workPresetCur" style="margin-bottom:8px"></p>
        <div class="offgrid" id="workPresetGrid"></div>
      </div>
    </div>
    <div class="actions">
      <button class="danger" onclick="edClear()">삭제</button>
      <button class="ghost" onclick="closeOv('ovEdit')">취소</button>
      <button class="primary" onclick="edSave()">저장</button>
    </div>
    <div class="savingbar" id="savingBar">서버 저장 중…</div>
  </div>
</div>

<script>
/* =========================================================================
   웰페리온 휴무 모바일 — schedule.html(PC 스케줄보드)과 동일한 서버·게이트
   계약을 재사용한다. 새 백엔드 액션 없음 · 새 인증 방식 없음.
   - 읽기: GET action=schedboard-list (전체 캐시, 월 이동은 재요청 없이 클라이언트 렌더)
   - 쓰기: POST action=schedboard-set {emp,date,value,dept,pin?} — 단건 upsert(셀=성명+날짜 키)
     ⛔ 전체 덮어쓰기(full-sync) 창구는 이 페이지에서 절대 호출하지 않는다.
   - PIN: 서버 verifyOnly 검증(schedboard-set, verifyOnly:true) — 코드에 정답값 없음.
     view PIN(10분) = 개인 데이터 열람 게이트, admin PIN(30분) = 편집 잠금 해제 게이트.
     PC와 동일한 sessionStorage 키를 재사용해 같은 탭에서 PC↔모바일 세션이 이어진다.
========================================================================= */
const REQ_API="https://script.google.com/macros/s/AKfycbyyXrdM7nSXKPG3Dy8wI6_3AI1spZs24d-uHTzQZlsqzoRXKkFbSFnX-hr42D3ScQSSHQ/exec";

/* ----- 명단·기준 폴백(서버 미응답 시에만 사용 — 서버 roster 도착 즉시 전체 교체) ----- */
const DEFAULT_DEPTS=[
  ["운영",["김남욱","이경연","임정은","나우열","최준용","윤병현","이지영","백승화"]],
  ["뮤지컬",["편한별"]],
  ["시설",["이정헌","김종현","박호균"]],
  ["지원(남)",["천진석","박남일","김훈"]],
  ["지원(여)",["우춘화","김미영","이경미","이연희"]],
  ["지원·주차",["양상규"]],
  ["지원·탕청소",["한두희(외주)"]],
  ["수영",["주민환","박민서","송민근","강대경","천주희","구성우","박주혜","김성은","강승구","김형기","박지은","진승현","황윤진","김민선"]],
  ["PT",["김상식","김혜진S","김종진M","김재용","양승문","최동오S","이형진M","김지훈","최도희"]],
  ["PL",["최은지","조영은","황동희"]],
  ["골프",["최현준","김태엽","박찬중","김명선","정시우"]],
  ["체조",["이형주","배자경","김영운"]],
  ["스쿼시",["이상훈","박상현","최수진"]],
];
const LEAVE_EXEMPT_DEPTS=new Set(["수영","PT","PL","골프","체조","스쿼시"]);
/* [2026-09-03 매니저 확정] 지원(남)/지원(여) 근무조 SSOT — schedule.html(PC)과 동일 값.
   출근시간 화이트리스트·프리셋 버튼이 전부 이 표에서 파생(시간 재하드코딩 금지). */
const SUPPORT_SHIFTS={
  wd:[{code:"A",role:"오전",s:"05:40",e:"14:40"},{code:"B",role:"중간",s:"11:00",e:"20:00"},
      {code:"C",role:"중간2",s:"13:00",e:"22:00"},{code:"D",role:"마감",s:"13:40",e:"22:40"}],
  we:[{code:"A",role:"오전",s:"07:40",e:"16:40"},{code:"B",role:"중간",s:"09:00",e:"18:00"},
      {code:"C",role:"마감",s:"11:10",e:"20:10"}]
};
const SUPPORT_DEPTS=new Set(["지원(남)","지원(여)"]);
const HOLIDAYS_FALLBACK={
  "2026-01-01":"신정","2026-02-16":"설날","2026-02-17":"설날","2026-02-18":"설날",
  "2026-03-01":"삼일절","2026-03-02":"대체","2026-05-05":"어린이날","2026-05-24":"석가탄신",
  "2026-05-25":"대체","2026-06-03":"지방선거","2026-06-06":"현충일","2026-07-17":"제헌절","2026-08-15":"광복절","2026-08-17":"대체",
  "2026-09-24":"추석","2026-09-25":"추석","2026-09-26":"추석","2026-10-03":"개천절",
  "2026-10-05":"대체","2026-10-09":"한글날","2026-12-25":"성탄절"
};
const CLOSED_RULE={nth:[2,4],weekday:0};   // 매월 2·4번째 일요일 = 휴관(가상 표기)

const LEAVE_LABEL={"휴":"휴","연차":"연차","반차오전":"반차(오전)","반차오후":"반차(오후)","공휴":"공휴","대휴":"대휴","휴관":"휴관"};
const OFF_CLS={"휴":"o-hu","연차":"o-yc","반차오전":"o-bc","반차오후":"o-bc","공휴":"o-gh","대휴":"o-dh","휴관":"o-hg"};
const LEAVE_CODES=["휴","연차","반차오전","반차오후","공휴","대휴","휴관"];
const POLICY_PIN_TYPES={"연차":1,"반차오전":1,"반차오후":1};   // 직접 기입 차단 — 관리자 PIN 세션에서만 정정 허용

/* ----- 유틸(PC 스케줄보드와 동일 규칙) ----- */
const pad=n=>String(n).padStart(2,"0");
const ymd=(y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const ymdOf=d=>ymd(d.getFullYear(),d.getMonth(),d.getDate());
const fmtT=t=>{const h=+t.slice(0,2),m=+t.slice(3,5);return m?h+":"+t.slice(3):""+h;};
const isClosedSun=(y,m,d)=>{if(new Date(y,m,d).getDay()!==CLOSED_RULE.weekday)return false;const n=Math.floor((d-1)/7)+1;return CLOSED_RULE.nth.includes(n);};
/* PC 스케줄보드 isWE()와 동일 정의(토·일·서버 공휴일 HOL 전부 "주말·공휴" 취급) — 지원부 화이트리스트 판정용.
   날짜를 새로 하드코딩하지 않고 이미 로드된 서버 공휴일 데이터(HOL)를 그대로 재사용한다. */
const isWE=(y,m,d)=>{const dow=new Date(y,m,d).getDay();return dow===0||dow===6||!!HOL[ymd(y,m,d)];};
function supportShiftListFor(dt){
  const[y,m,d]=dt.split("-").map(Number);
  return isWE(y,m-1,d)?SUPPORT_SHIFTS.we:SUPPORT_SHIFTS.wd;
}
function parseCell(v){
  if(!v)return null;
  const p=String(v).split(" ");
  if(LEAVE_LABEL[p[0]]){
    const r={leave:p[0]};
    if(p[1]&&/^\d{2}:\d{2}$/.test(p[1])){r.s=p[1];if(p[2]&&/^\d{2}:\d{2}$/.test(p[2]))r.e=p[2];}
    return r;
  }
  if(!/^\d{2}:\d{2}$/.test(p[0]))return null;
  return{s:p[0],e:(p[1]&&/^\d{2}:\d{2}$/.test(p[1]))?p[1]:null};
}

/* ----- 상태 ----- */
let DEPTS=JSON.parse(JSON.stringify(DEFAULT_DEPTS));
let EMP_DEPT={}, RETIRED={}, SRV_EXEMPT=null, HOL=Object.assign({},HOLIDAYS_FALLBACK);
let schedD={};
let boardSynced=null;
/* [2026-09-03] 잔여 연차 — schedboard-list가 이미 동봉하는 서버 산출(ann{granted,carry,adjust,used,rem[,unset]})을
   그대로 소비한다. PC 스케줄보드(schedule.html)의 SRV_ANN/annInfoOf와 동일 계약 — 새 백엔드 액션 없음.
   클라이언트에서 잔여를 재계산하지 않는다(서버 값만 표시). */
let SRV_ANN=null, ANN_YEAR=String(new Date().getFullYear());
function rebuildEmpDept(){EMP_DEPT={};DEPTS.forEach(([d,ns])=>ns.forEach(n=>EMP_DEPT[n]=d));}
rebuildEmpDept();
function isLeaveExempt(nm){return SRV_EXEMPT?SRV_EXEMPT.has(nm):LEAVE_EXEMPT_DEPTS.has(EMP_DEPT[nm]);}
/* 총연차=부여+이월+조정(표시는 부여 기준, PC와 동일) · 잔여=서버 rem 그대로. unset=연차원장 미등재(부여 미확정). */
function annInfoOf(nm){
  const sv=SRV_ANN&&SRV_ANN[nm];
  if(!sv)return null;
  if(sv.unset)return{total:null,rem:null,granted:null,unset:true};
  /* [PC 스케줄보드와 동일 계약] "총연차" 표시값 = 부여(granted) 기준. 이월·조정은 잔여(rem) 산출에만
     반영되고 총연차 라벨에는 합산하지 않는다 — 합산 표시가 과거 PC에서 혼선을 일으켜 되돌린 이력 있음. */
  return{total:sv.granted,rem:sv.rem,granted:sv.granted,carry:sv.carry||0,adjust:sv.adjust||0,unset:false};
}
function exitYmOf(nm){return RETIRED[nm]?String(RETIRED[nm]).slice(0,7):null;}
function activeInYm(nm,ym){const x=exitYmOf(nm);return !x||ym<=x;}

const nextM=(()=>{const d=new Date(today.getFullYear(),today.getMonth()+1,1);return{y:d.getFullYear(),m:d.getMonth()};})();

/* ----- 서버 동기화 ----- */
function syncBadge(){
  const el=document.getElementById("syncBadge");
  if(boardSynced===null){el.textContent="● 서버 연결 중…";el.className="badge";}
  else if(boardSynced){el.textContent="● 서버 동기화됨";el.className="badge ok";}
  else{el.textContent="● 오프라인 — 마지막 캐시 표시 중";el.className="badge bad";}
}
async function boardPull(){
  for(let attempt=0;attempt<2;attempt++){
    try{
      const j=await(await fetch(REQ_API+"?action=schedboard-list&_r="+attempt+"_"+Date.now())).json();
      if(!j||!j.ok||typeof j.data!=="object")throw 0;
      schedD=j.data||{};
      applyServerMeta(j);
      boardSynced=true;
      break;
    }catch(e){
      boardSynced=false;
      if(attempt===0)await new Promise(r=>setTimeout(r,1200));
    }
  }
  syncBadge();
  fillEmpSelect();
  renderActiveTab();
}
function applyServerMeta(j){
  try{
    if(j.holidays&&typeof j.holidays==="object"&&Object.keys(j.holidays).length)HOL=j.holidays;
    if(j.year)ANN_YEAR=String(j.year);
    if(j.ann&&typeof j.ann==="object")SRV_ANN=j.ann;
    if(Array.isArray(j.roster)&&j.roster.length){
      const order=[],byDept={},ex=new Set(),ret={};
      j.roster.forEach(r=>{
        if(!r||!r.name)return;
        const dept=r.dept||"미분류";
        if(!byDept[dept]){byDept[dept]=[];order.push(dept);}
        byDept[dept].push(r.name);
        if(r.leaveApplied==="N")ex.add(r.name);
        if(r.exitDate)ret[r.name]=r.exitDate;
      });
      DEPTS=order.map(d=>[d,byDept[d]]);
      SRV_EXEMPT=ex; RETIRED=ret;
      rebuildEmpDept();
    }
  }catch(_){}
}
function manualRefresh(){boardSynced=null;syncBadge();boardPull();}

function fillEmpSelect(){
  const sel=document.getElementById("empSel");
  const keep=sel.value||curEmp;
  let h=`<option value="">— 이름을 선택하세요 —</option>`;
  DEPTS.forEach(([d,ns])=>{
    const shown=ns.filter(nm=>activeInYm(nm,ymd(today.getFullYear(),today.getMonth(),1).slice(0,7)));
    if(!shown.length)return;
    h+=`<optgroup label="${d}">`+shown.map(nm=>`<option value="${nm}"${nm===keep?" selected":""}>${nm}${RETIRED[nm]?" (퇴사)":""}</option>`).join("")+`</optgroup>`;
  });
  sel.innerHTML=h;
  if(DEPTS.some(([,ns])=>ns.includes(keep)))curEmp=keep; else curEmp="";
  sel.value=curEmp;
}
function onEmpChange(){
  curEmp=document.getElementById("empSel").value;
  if(!curEmp){renderActiveTab();return;}
  pinEnsure("view",()=>renderActiveTab());
}

/* [2026-09-03] 이름 선택 + PIN 확인 후에만 표시(기존 view PIN 게이트 재사용 — 새 인증 경로 없음).
   연차 미적용(강습 프리랜서·외주)은 잔여를 아예 표시하지 않는다(0일로 오인 방지). */
function renderMyLeave(){
  const box=document.getElementById("leaveStats"), note=document.getElementById("leaveNote");
  if(!curEmp||!pinOk("view")){box.classList.remove("on");note.classList.remove("on");return;}
  if(isLeaveExempt(curEmp)){
    box.classList.remove("on");
    note.textContent="🎫 연차 미적용(프리랜서·외주 계약)";
    note.classList.add("on");
    return;
  }
  const u=annInfoOf(curEmp);
  const f=n=>n%1?n.toFixed(1):n;
  if(!u||u.unset){
    box.classList.remove("on");
    note.textContent=ANN_YEAR+"년 연차 미확정 — 매니저 확인 대기";
    note.classList.add("on");
    return;
  }
  document.getElementById("lv_total").textContent=f(u.total)+"일";
  const rEl=document.getElementById("lv_rem");
  rEl.textContent=f(u.rem)+"일"+(u.rem<0?" (초과)":"");
  rEl.style.color=u.rem<0?"var(--red)":"var(--green)";
  box.classList.add("on");
  const extra=(u.carry||0)+(u.adjust||0);
  if(extra){
    note.textContent="이월·조정 "+(extra>0?"+":"")+f(extra)+"일(잔여에만 반영, 총연차 표시는 부여 기준)";
    note.classList.add("on");
  }else note.classList.remove("on");
  syncStickyOffsets();
}
/* [2026-09-03] 잔여 연차 바가 나타나면 .empbar 높이가 늘어나므로, 아래 sticky 탭바(top 고정값)가
   겹치지 않도록 실측 높이로 top을 재계산한다. 레이아웃 자체(순서·크기)는 그대로 — 겹침만 방지. */
function syncStickyOffsets(){
  try{
    const h=document.querySelector("header.top"), e=document.querySelector(".empbar"), t=document.querySelector(".tabbar");
    if(!h||!e||!t)return;
    e.style.top=h.offsetHeight+"px";
    t.style.top=(h.offsetHeight+e.offsetHeight)+"px";
  }catch(_){}
}
window.addEventListener("resize",syncStickyOffsets);

/* ----- 월 이동 ----- */
function monthState(kind){return kind==="view"?viewMon:editMon;}
function moveMonth(kind,delta){
  const st=monthState(kind);
  const d=new Date(st.y,st.m+delta,1);
  st.y=d.getFullYear();st.m=d.getMonth();
  if(kind==="view")renderViewList(); else renderEditList();
}
function gotoMonth(kind,offset){
  const d=new Date(today.getFullYear(),today.getMonth()+offset,1);
  const st=monthState(kind);
  st.y=d.getFullYear();st.m=d.getMonth();
  if(kind==="view")renderViewList(); else renderEditList();
}
function monthLabel(y,m){return `${y}년 ${m+1}월`;}

/* ----- 값 표시 칩 ----- */
function valueChipHTML(nm,dt,y,m,d){
  const raw=(schedD[nm]||{})[dt];
  const c=parseCell(raw);
  if(c){
    if(c.leave)return `<span class="chip ${OFF_CLS[c.leave]}">${LEAVE_LABEL[c.leave]}${c.s?" · "+fmtT(c.s)+(c.e?"–"+fmtT(c.e):""):""}</span>`;
    return `<span class="chip o-work">${fmtT(c.s)}${c.e?"–"+fmtT(c.e):""}</span>`;
  }
  if(isClosedSun(y,m,d))return `<span class="chip o-hg ghost">휴관</span>`;
  return `<span class="chip empty">미기재</span>`;
}
function dayRowClass(y,m,d){
  const dt=ymd(y,m,d);
  if(HOL[dt])return "hol";
  const dow=new Date(y,m,d).getDay();
  return dow===0?"sun":dow===6?"sat":"";
}

function renderViewList(){
  document.getElementById("viewMonthLabel").textContent=monthLabel(viewMon.y,viewMon.m);
  const wrap=document.getElementById("viewList");
  if(!curEmp){wrap.innerHTML=`<div class="emptystate">먼저 위에서 <b>내 이름</b>을 선택하세요.</div>`;return;}
  if(!pinOk("view")){wrap.innerHTML=`<div class="emptystate">🔒 PIN 확인 후 표시됩니다.</div>`;return;}
  const y=viewMon.y,m=viewMon.m,days=new Date(y,m+1,0).getDate();
  const T=ymdOf(today);
  let h="";
  for(let d=1;d<=days;d++){
    const dt=ymd(y,m,d),dow=new Date(y,m,d).getDay(),cls=dayRowClass(y,m,d);

       `<div class="dnum"><b>${d}</b><span>${DOW[dow]}</span></div>`+

       `<div class="dval">${valueChipHTML(curEmp,dt,y,m,d)}</div>`+
       `</div>`;

  wrap.innerHTML=h;

/* ===== PIN 게이트 (PC 스케줄보드와 동일 — sessionStorage 키·TTL 공용, 정답값은 서버만 안다) ===== */
const PIN_LS="wp_sched_pin_v1";
const PIN_TTL={admin:30*60*1000,view:10*60*1000};
const PIN_FAIL_MAX=5, PIN_LOCK_MS=60*1000;
function pinState(){try{return JSON.parse(sessionStorage.getItem(PIN_LS)||"{}");}catch(_){return{};}}
function pinSave(st){try{sessionStorage.setItem(PIN_LS,JSON.stringify(st));}catch(_){}}
function pinOk(kind){
  const st=pinState(); if(!st.pin)return false;
  if(st[kind+"Ts"]&&Date.now()-st[kind+"Ts"]<PIN_TTL[kind])return true;
  return kind==="view"&&!!(st.adminTs&&Date.now()-st.adminTs<PIN_TTL.admin);
}
function curPin(){const st=pinState();if(!st.pin)return null;const a=st.adminTs&&Date.now()-st.adminTs<PIN_TTL.admin;const v=st.viewTs&&Date.now()-st.viewTs<PIN_TTL.view;return(a||v)?st.pin:null;}
let pinCb=null,pinKind="view";
function pinEnsure(kind,cb){
  if(pinOk(kind)){cb();return;}
  pinKind=kind;pinCb=cb;
  document.getElementById("pin_title").textContent=kind==="view"?"내 휴무 조회 PIN":"편집 잠금 해제 PIN";
  document.getElementById("pin_sub").textContent=kind==="view"
    ?"개인 휴무 열람은 PIN 확인 후 가능합니다 (확인 후 10분 유지)"
    :"편집 잠금 기간(25일~말일 외) 수정에는 관리자 PIN이 필요합니다 (확인 후 30분 유지)";
  document.getElementById("pin_err").textContent="";
  const inp=document.getElementById("pin_inp");inp.value="";
  openOv("ovPin");setTimeout(()=>inp.focus(),60);
}
function pinSubmit(){
  const st=pinState();
  if(st.lockUntil&&Date.now()<st.lockUntil){
    document.getElementById("pin_err").textContent="입력 잠금 중 — "+Math.ceil((st.lockUntil-Date.now())/1000)+"초 후 다시 시도";
    return;
  }
  const pin=document.getElementById("pin_inp").value.trim();
  if(!/^\d{4}$/.test(pin)){document.getElementById("pin_err").textContent="숫자 4자리를 입력하세요";return;}
  document.getElementById("pin_err").textContent="서버 확인 중…";
  fetch(REQ_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"schedboard-set",verifyOnly:true,pin:pin})})
    .then(r=>r.json()).then(j=>{
      if(j&&j.ok&&j.verified){
        const st2=pinState();st2.pin=pin;st2.fails=0;st2.lockUntil=0;
        st2[pinKind+"Ts"]=Date.now(); if(pinKind==="admin")st2.viewTs=Date.now();
        pinSave(st2);closeOv("ovPin");renderPinBadge();
        const cb=pinCb;pinCb=null;if(cb)cb();
      }else{
        const st2=pinState();st2.fails=(st2.fails||0)+1;
        if(st2.fails>=PIN_FAIL_MAX){st2.lockUntil=Date.now()+PIN_LOCK_MS;st2.fails=0;}
        pinSave(st2);
        document.getElementById("pin_err").textContent=(j&&j.error==="pin_locked")
          ?SB_ERR.pin_locked
          :(st2.lockUntil?"5회 실패 — 60초 입력 잠금":"PIN이 올바르지 않습니다");
      }
    }).catch(()=>{document.getElementById("pin_err").textContent="서버 연결 실패 — 잠시 후 다시 시도";});
}
function editFree(){return new Date().getDate()>=25;}
function editAllowed(){return editFree()||pinOk("admin");}
function renderPinBadge(){
  const el=document.getElementById("pinBadge");
  if(pinOk("admin")){el.style.display="";el.className="badge pin";el.textContent="🛡️ 관리자 PIN 열림";}
  else if(pinOk("view")){el.style.display="";el.className="badge pin";el.textContent="🔓 조회 PIN 열림";}
  else{el.style.display="none";}
}
setInterval(renderPinBadge,5000);

/* ===== 편집 바텀시트 ===== */
let edDate=null, edMode="off", edSelCode=null, edSelWork=null;
function openEditor(dt){
  if(!curEmp)return;
  edDate=dt; edSelCode=null;
  const[y,m,d]=dt.split("-").map(Number);
  document.getElementById("ed_title").textContent=`${curEmp} · ${m}월 ${d}일 (${DOW[new Date(y,m-1,d).getDay()]})`;
  document.getElementById("ed_sub").textContent=HOL[dt]?("공휴일 · "+HOL[dt]):"";
  const c=parseCell((schedD[curEmp]||{})[dt]);
  document.getElementById("ed_s").value=(c&&!c.leave)?c.s:"";
  document.getElementById("ed_e").value=(c&&!c.leave&&c.e)?c.e:"";
  edSelWork=(c&&!c.leave)?c.s:null;   // 기존 값(허용목록 밖이어도 그대로 유지·표시)
  if(c&&c.leave)edSelCode=c.leave;
  setEdMode(c&&!c.leave?"work":"off");
  buildOffGrid();
  document.getElementById("savingBar").style.display="none";
  openOv("ovEdit");
}
function buildOffGrid(){
  const exempt=isLeaveExempt(curEmp);
  const codes=LEAVE_CODES.filter(c=>!(exempt&&c==="연차"));
  document.getElementById("offGrid").innerHTML=codes.map(c=>
    `<button class="${OFF_CLS[c]}${edSelCode===c?" sel":""}" onclick="pickOffCode('${c}')">${LEAVE_LABEL[c]}</button>`
  ).join("");
}
function pickOffCode(c){edSelCode=c;buildOffGrid();}
/* [2026-09-03 매니저 확정] 지원(남)/지원(여)는 출근시간 자유입력 대신 날짜별 근무조 버튼만 제공.
   허용값·판정 기준은 SUPPORT_SHIFTS(PC 스케줄보드와 동일 SSOT) — 여기서 시간을 새로 하드코딩하지 않는다. */
function isSupportRestricted(){return SUPPORT_DEPTS.has(EMP_DEPT[curEmp]);}
function buildWorkPresetGrid(){
  const list=supportShiftListFor(edDate);
  const cur=document.getElementById("workPresetCur");
  const allowed=list.map(x=>x.s);
  cur.textContent=(edSelWork&&!allowed.includes(edSelWork))?`현재 값: ${edSelWork} (허용 목록 밖 — 아래에서 선택해야 변경됨)`:"";
  document.getElementById("workPresetGrid").innerHTML=list.map(sh=>
    `<button class="${edSelWork===sh.s?" sel":""}" onclick="pickWorkPreset('${sh.s}')">${sh.role} ${sh.code}조<br><small>${sh.s}~${sh.e}</small></button>`
  ).join("");
}
function pickWorkPreset(s){edSelWork=s;buildWorkPresetGrid();}
function setEdMode(mode){
  edMode=mode;
  document.getElementById("segOff").className=mode==="off"?"on":"";
  document.getElementById("segWork").className=mode==="work"?"on":"";
  document.getElementById("edOffWrap").style.display=mode==="off"?"":"none";
  document.getElementById("edWorkWrap").style.display=mode==="work"?"":"none";
  if(mode==="work"){
    const restricted=isSupportRestricted();
    document.getElementById("freeTimeWrap").style.display=restricted?"none":"";
    document.getElementById("workPresetWrap").style.display=restricted?"":"none";
    if(restricted)buildWorkPresetGrid();
  }
}
function edClear(){doSave("");}
function edSave(){
  if(edMode==="off"){
    if(!edSelCode){toast("⚠ 휴무코드를 선택하세요");return;}
    doSave(edSelCode);
  }else if(isSupportRestricted()){
    const allowed=supportShiftListFor(edDate).map(x=>x.s);
    if(!edSelWork||!allowed.includes(edSelWork)){toast("⚠ 근무조를 선택하세요 (지원부는 "+allowed.join("·")+" 중에서만)");return;}
    doSave(edSelWork);
  }else{
    const s=document.getElementById("ed_s").value, e=document.getElementById("ed_e").value;
    if(!s){toast("⚠ 출근 시각을 입력하세요");return;}
    doSave(e?s+" "+e:s);
  }
}
async function doSave(value){
  const nm=curEmp, dt=edDate;
  if(!editAllowed()){pinEnsure("admin",()=>doSave(value));return;}
  const base=value?String(value).split(" ")[0]:"";
  if(base&&POLICY_PIN_TYPES[base]&&!pinOk("admin")){
    toast("⚠ "+SB_ERR.type_requires_pin);
    return;
  }
  const savingBar=document.getElementById("savingBar");
  savingBar.style.display="block";savingBar.textContent="서버 저장 중…";
  const body={action:"schedboard-set",emp:nm,date:dt,value:value||"",dept:EMP_DEPT[nm]||""};
  const p=curPin(); if(p)body.pin=p;
  try{
    const res=await fetch(REQ_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    const j=await res.json();
    if(!j||!j.ok){
      toast("⚠ "+((j&&SB_ERR[j.error])||(j&&j.message)||"저장 실패"));
      savingBar.style.display="none";
      return;
    }
    /* 재조회로 반영 확인 — 실패해도 재전송하지 않는다(중복행 방지) */
    savingBar.textContent="저장 확인 중…";
    const confirmed=await confirmWrite(nm,dt,value);
    savingBar.style.display="none";
    if(confirmed){
      boardSynced=true;syncBadge();
      toast("✅ 저장됨");
      closeOv("ovEdit");
      renderActiveTab();
    }else{
      toast("⚠ 저장 확인 필요 — 새로고침(↻) 후 반영 여부를 확인해 주세요");
    }
  }catch(e){
    savingBar.style.display="none";
    boardSynced=false;syncBadge();
    toast("⚠ "+SB_ERR.offline);
  }
}
async function confirmWrite(nm,dt,expected){
  try{
    const j=await(await fetch(REQ_API+"?action=schedboard-list&_r=cf_"+Date.now())).json();
    if(!j||!j.ok||typeof j.data!=="object")return false;
    schedD=j.data||{};
    applyServerMeta(j);
    const got=(schedD[nm]&&schedD[nm][dt])||"";
    return got===(expected||"");
  }catch(e){return false;}
}

/* ===== 공통 UI ===== */
function openOv(id){document.getElementById(id).classList.add("on");}
function closeOv(id){document.getElementById(id).classList.remove("on");}
let toastTimer=null;
function toast(msg){
  let el=document.getElementById("wpToast");
  if(!el){el=document.createElement("div");el.id="wpToast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;el.style.display="block";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.style.display="none";},3500);
}

/* ===== 시작 ===== */
fillEmpSelect();
renderPinBadge();
syncBadge();
syncStickyOffsets();
boardPull();
</script>
