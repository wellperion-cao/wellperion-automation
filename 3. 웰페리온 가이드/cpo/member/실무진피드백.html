<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 · 실무진 피드백</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  실무진 피드백 접수 팝업 — 여러 화면이 공유하는 단 하나의 실무진 창구다. 사본을 만들지 말고 이 파일을 iframe으로 연다.
  여는 곳: membership.html 「💬 실무진 피드백」(회원관리) · coo/reception/종합접수처_현황.html 「💬 실무진 피드백」(종합접수처).
  GM 지시(2026-07-24 신설 · 2026-07-27 종합접수처 합류 — "배치·항목 같게, 시트 통합").
  ★여는 쪽은 ?screen=<업무명> 을 붙인다(예: 실무진피드백.html?screen=종합접수처) — 그 업무가 미리 골라져 담당을 바로 가린다.

  ★전송 배선 완료(2026-07-25) — submitStaffFeedback() → GAS action=staff_feedback_submit → 멤버십 스프레드시트
    '실무진 피드백' 탭(접수ID FB…). 화면이 어디든 이 한 탭에 모인다(시트 통합).
    거기서 scripts/collectors/cpo_staff_feedback_watch.py 가 3분마다 읽어 status/_queue.json 에 배로 세운다.
    저장 안 됐는데 됐다고 표시하지 않는다(이 저장소 반복 사고 유형 — 발행완료 오표기 재발방지 원칙과 동일 취지).
  ★외부 라이브러리·CDN 0 — 시스템 한글 폰트 스택만 사용, 완전 자체완결(오프라인에서도 동작).
  ★라이트/다크 — 여는 쪽이 ?theme=dark|light 로 정해주면 그대로 따르고, 안 주면 OS 설정을 따른다(종전 동작).
    iframe은 부모의 테마 토글을 물려받지 못한다 → 부모가 다크 고정인 화면은 theme=dark 를 같이 붙여야
    폼만 밝게 떠 겉도는 일이 없다. 예: 실무진피드백.html?screen=종합접수처&theme=dark
═══════════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#f5f3f0;
  --paper:#ffffff;
  --paper-raised:#fbf9f6;
  --text:#221F20;
  --dim:#8a8579;
  --border:#e2dcd2;
  --accent:#B79F8A;
  --accent-bg:rgba(183,159,138,0.14);
  --accent-border:rgba(183,159,138,0.35);
  --red:#ED5B3F;--red-bg:rgba(237,91,63,0.10);--red-border:rgba(237,91,63,0.28);
  --warn-bg:rgba(230,200,78,0.16);--warn-border:rgba(230,200,78,0.4);--warn-text:#8a6d1a;
}
/* 다크 값은 여기 한 벌뿐이다. 어떤 조건에서 다크로 갈지는 CSS가 아니라 아래 스크립트가 정해
   <html data-theme="dark"> 를 달아준다 — ①여는 쪽이 ?theme=dark 로 지정했으면 그대로 ②없으면 OS 설정.
   (2026-07-27 시우) 부모가 다크 고정인 화면(종합접수처 현황 등) 안에 밝은 폼만 떠 이질감이 있었다.
   미디어쿼리 한 벌 + 속성 한 벌로 값을 두 번 적으면 한쪽이 옛것으로 어긋난다 — 그래서 값은 한 곳만 둔다. */
:root[data-theme="dark"]{
  --bg:#221F20;
  --paper:#272422;
  --paper-raised:#2e2b28;
  --text:#f0ece7;
  --dim:#9e9b93;
  --border:#38322e;
  --accent-bg:rgba(183,159,138,0.10);
  --accent-border:rgba(183,159,138,0.25);
  --red-bg:rgba(237,91,63,0.14);--red-border:rgba(237,91,63,0.32);
  --warn-bg:rgba(230,200,78,0.10);--warn-border:rgba(230,200,78,0.3);--warn-text:#e6c84e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--paper);color:var(--text);line-height:1.65;font-size:14px;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  padding:18px 16px 24px;
}
.intro{font-size:12.5px;color:var(--dim);margin-bottom:18px}
.intro b{color:var(--text)}
form{display:flex;flex-direction:column;gap:18px}
fieldset{border:0;padding:0;display:flex;flex-direction:column;gap:9px}
legend{font-size:13px;font-weight:800;color:var(--text);padding:0;margin-bottom:1px}
legend .req{color:var(--red);margin-left:2px;font-weight:800}
.choice-group{display:flex;flex-wrap:wrap;gap:7px}
.choice-btn{
  font:inherit;font-size:13px;font-weight:600;color:var(--text);
  background:var(--paper-raised);border:1px solid var(--border);
  border-radius:10px;padding:9px 14px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.choice-btn:hover{border-color:var(--accent-border)}
.choice-btn.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border);font-weight:800}
textarea{
  width:100%;min-height:120px;resize:vertical;
  font:inherit;font-size:14px;line-height:1.65;color:var(--text);
  background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;
  padding:12px 13px;outline:none;word-break:keep-all;
}
textarea:focus{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-bg)}
input[type="text"]{
  width:100%;font:inherit;font-size:14px;color:var(--text);
  background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;outline:none;
}
input[type="text"]:focus{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-bg)}
.hint{font-size:11.5px;color:var(--dim)}
.err-line{font-size:12.5px;color:var(--red);display:none;margin-top:-3px}
.err-line.show{display:block}
textarea.err{border-color:var(--red-border);box-shadow:0 0 0 3px var(--red-bg)}
.notice{
  display:none;font-size:12.5px;color:var(--warn-text);background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:10px;padding:11px 13px;line-height:1.6;
}
.notice.show{display:block}
/* 접수 결과 3색 — 진행중(기본 노랑) / 성공(초록) / 실패(빨강).
   ★실패를 성공처럼 보이게 하지 않는다: 저장이 안 됐는데 됐다고 표시한 사고(INC-014)의 재발방지. */
.notice.ok{color:#1f6b46;background:rgba(45,138,94,0.12);border-color:rgba(45,138,94,0.32)}
.notice.bad{color:var(--red);background:var(--red-bg);border-color:var(--red-border)}
@media (prefers-color-scheme: dark){
  .notice.ok{color:#7fd0a6;background:rgba(45,138,94,0.16);border-color:rgba(45,138,94,0.36)}
}
/* 사진 첨부(2026-07-29 GM 지시) — 선택 즉시 1600px로 줄여 미리보기, 최대 5장 */
input[type="file"]{font:inherit;font-size:12.5px;color:var(--dim)}
.fb-photo-preview{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.fb-photo-thumb{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--border);background:var(--paper-raised)}
.fb-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fb-photo-thumb .fb-photo-remove{
  position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;
  background:rgba(34,31,32,.62);color:#fff;font-size:12px;line-height:19px;text-align:center;
  cursor:pointer;border:0;padding:0;
}
.fb-photo-thumb.busy::after{
  content:'처리중';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--dim);background:rgba(255,255,255,.7);
}
.btn[disabled]{opacity:.55;cursor:default}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.btn{
  font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;
  padding:11px 20px;cursor:pointer;border:1px solid transparent;
}
.btn-cancel{background:var(--paper-raised);color:var(--dim);border-color:var(--border)}
.btn-cancel:hover{color:var(--text);border-color:var(--accent-border)}
.btn-send{background:var(--accent);color:#221F20}
.btn-send:hover{opacity:.9}
@media (max-width:380px){
  .btn-row{flex-direction:column-reverse}
  .btn{width:100%}
}
/* 내가 낸 신고 처리 현황(2026-08-04 GM 지시 · 배366) — 접수 후 처리 여부를 몰라 같은 신고를
   되풀이하는 일(FB260804-101548)이 실제로 나 붙였다. 기존 색·변수만 재사용, 새 팔레트 없음. */
.fb-status-wrap{margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.fb-status-summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--text);list-style:none}
.fb-status-summary::-webkit-details-marker{display:none}
.fb-status-summary::before{content:'▸ ';color:var(--dim)}
details[open]>.fb-status-summary::before{content:'▾ '}
.fb-status-list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.fb-status-empty{font-size:12.5px;color:var(--dim)}
.fb-status-item{background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12.5px}
.fb-status-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.fb-status-id{color:var(--dim);font-size:11px}
.fb-status-badge{font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.fb-status-badge.wait{color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-border)}
.fb-status-badge.doing{color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-border)}
.fb-status-badge.done{color:#1f6b46;background:rgba(45,138,94,0.12);border:1px solid rgba(45,138,94,0.32)}
@media (prefers-color-scheme: dark){.fb-status-badge.done{color:#7fd0a6;background:rgba(45,138,94,0.16);border-color:rgba(45,138,94,0.36)}}
.fb-status-content{color:var(--text)}
.fb-status-memo{margin-top:4px;color:var(--dim)}
.fb-status-picker{margin-top:10px;margin-bottom:10px}
.fb-status-picker input[type="text"]{font-size:13px;padding:9px 12px}
</style>
<script>
// 밝게 갈지 어둡게 갈지를 여기서 한 번 정한다(그리기 전에 정해야 깜빡임이 없어 head 안에 둔다).
// 여는 쪽이 ?theme=dark|light 로 정해줬으면 그 말을 따르고, 안 정해줬으면 OS 설정을 따른다.
// 부모 화면이 다크 고정인데 이 폼만 밝게 떠 생기던 이질감을 없애기 위함(2026-07-27 시우).
(function(){
  var want = 'light';
  try{
    want = new URLSearchParams(location.search).get('theme');
    if (want !== 'dark' && want !== 'light'){
      want = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
  }catch(e){ want = 'light'; }
  document.documentElement.setAttribute('data-theme', want);
})();
</script>
</head>
<body>

<div class="intro">지금 보고 계신 화면에서 불편한 점, 바꿨으면 하는 점, 오류 등을 알려주세요.<br>
남겨주신 내용은 <b>시포(AI CPO)</b>가 확인 후 개선에 반영합니다.</div>

<form id="feedbackForm" onsubmit="return false;">

  <fieldset>
    <legend>어떤 업무인가요?</legend>
    <div class="choice-group" data-field="screen">
      <!-- 업무별로 나눈다(2026-07-25 GM) — 멤버십은 멤버십, 강습은 강습, 종합접수처는 종합접수처.
           예전 '문의 접수'는 어느 화면을 말하는지 모호해 접수 뒤 담당을 가릴 수 없었다. -->
      <button type="button" class="choice-btn active" data-value="멤버십 회원관리">멤버십 회원관리</button>
      <button type="button" class="choice-btn" data-value="강습 회원관리">강습 회원관리</button>
      <button type="button" class="choice-btn" data-value="종합접수처">종합접수처</button>
      <!-- 상품 기획 페이지(cpo/product/상품기획.html) 피드백 버튼 신설(2026-07-29)에 맞춰 추가 —
           없으면 이 화면에서 남긴 피드백이 전부 '기타'로 섞여 나중에 구분이 안 된다. 라우팅은 route_clevel()
           매칭 실패 시 cpo 폴백이라 그대로 시포에게 온다(손대지 않음). -->
      <button type="button" class="choice-btn" data-value="상품 기획">상품 기획</button>
      <!-- 브로제이 업무분장 페이지(coo/brojay/) 피드백 버튼 신설(2026-07-29 GM 지시 — 강사진 포함
           실무진 누구나 기록)에 맞춰 추가. 라우팅 미변경(매칭 실패 시 cpo 폴백 — 웰리 확인). -->
      <button type="button" class="choice-btn" data-value="브로제이">브로제이</button>
      <button type="button" class="choice-btn" data-value="기타">기타</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>어떤 내용인가요?</legend>
    <div class="choice-group" data-field="type">
      <button type="button" class="choice-btn active" data-value="불편해요">불편해요</button>
      <button type="button" class="choice-btn" data-value="이렇게 바꿔주세요">이렇게 바꿔주세요</button>
      <button type="button" class="choice-btn" data-value="오류가 났어요">오류가 났어요</button>
      <button type="button" class="choice-btn" data-value="그 외">그 외</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>자세한 내용<span class="req">*</span></legend>
    <textarea id="fbContent" placeholder="예) 재등록 현황을 열면 로딩이 오래 걸려요 / 이 버튼 위치를 위쪽으로 옮겨주세요"></textarea>
    <div class="err-line" id="fbContentErr">내용을 입력해 주세요.</div>
  </fieldset>

  <fieldset>
    <legend>얼마나 급한가요?</legend>
    <div class="choice-group" data-field="urgency">
      <button type="button" class="choice-btn" data-value="급함">급함</button>
      <button type="button" class="choice-btn active" data-value="보통">보통</button>
      <button type="button" class="choice-btn" data-value="천천히">천천히</button>
    </div>
  </fieldset>

  <!-- 작성자 필수(2026-07-25 GM 지시 "작성자도 꼭 기록하게끔") — 무기명 피드백은 되물을 수가 없다.
       실제로 7/24~25 접수 8건 중 3건이 무기명이었고, 그중 2건이 '누구 회원의 어떤 내용이 사라졌다'는
       확인이 필요한 건이라 작성자에게 되묻지 못했다. 한 번 적으면 이 브라우저에 기억시켜(localStorage)
       다음부터 자동으로 채워 넣는다 — 필수로 만들되 매번 타이핑하는 부담은 주지 않는다. -->
  <fieldset>
    <legend>작성자 <span class="req">*</span> <span class="hint">(한 번 적으면 다음부터 자동으로 채워집니다)</span></legend>
    <input type="text" id="fbAuthor" placeholder="이름 (예: 임정은)" autocomplete="name">
    <div class="err-line" id="fbAuthorErr">누가 남기셨는지 적어 주세요 — 확인이 필요할 때 되묻기 위해 꼭 필요합니다.</div>
  </fieldset>

  <!-- 사진 첨부(선택·2026-07-29 GM 지시) — 폰 카메라로 찍은 원본도 고르면 여기서 즉시 1600px로 줄인다.
       accept="image/*" 는 갤러리·카메라 둘 다 열어 준다(폰에서 촬영도 문제 없음). -->
  <fieldset>
    <legend>사진 첨부 <span class="hint">(선택 · 최대 5장, 자동으로 크기를 줄여 올립니다)</span></legend>
    <input type="file" id="fbPhotoInput" accept="image/*" multiple>
    <div class="fb-photo-preview" id="fbPhotoPreview"></div>
    <div class="hint" id="fbPhotoHint"></div>
  </fieldset>

  <!-- 접수 결과가 여기에 뜬다(보내는 중 / 접수됨 / 실패). 문구는 보낼 때 채워진다. -->
  <div class="notice" id="fbNotice" style="white-space:pre-line"></div>

  <div class="btn-row">
    <button type="button" class="btn btn-cancel" onclick="cancelFeedback()">취소</button>
    <button type="button" class="btn btn-send" id="fbSendBtn" onclick="submitStaffFeedback()">보내기</button>
  </div>

</form>

<!-- 내가 낸 신고 처리 현황(2026-08-04 GM 지시 · 배366) — 접기 안에 두어 폼이 우선 보이게 한다.
     2026-08-05: localStorage 이름 없이도(다른 기기·다른 브라우저) 볼 수 있게, 이 안에서 직접 이름을
     고르거나 입력해 조회하는 칸을 둔다. 목록(datalist)은 시트에 실제 있는 작성자 값에서만 뽑는다. -->
<div class="fb-status-wrap">
  <details id="fbStatusDetails">
    <summary class="fb-status-summary">📬 내가 낸 신고 처리 현황</summary>
    <div class="fb-status-picker">
      <input type="text" id="fbStatusAuthor" list="fbStatusAuthorList" placeholder="이름을 입력하거나 목록에서 골라 주세요" autocomplete="off">
      <datalist id="fbStatusAuthorList"></datalist>
    </div>
    <div class="fb-status-list" id="fbStatusList"></div>
  </details>
</div>

<script>
"use strict";
// 지난번에 적은 작성자 자동 채움 — 필수 항목이라 매번 타이핑하지 않게(2026-07-25 GM).
try {
  var _fbSavedAuthor = localStorage.getItem('wlp_fb_author');

var FB_PHOTO_URL = 'https://script.google.com/macros/s/AKfycbz4wWhqICMQZR3F9bQc-7_LsDDA9Ywb-g-Q-6BNwjvqiw1EwAT_U94nEjUsf-Uor8uH/exec';
var FB_PHOTO_MAX_EDGE = 1600;
var FB_PHOTO_MAX_COUNT = 5;
var _fbPhotos = [];   // { b64, mime, fname, previewUrl }

function _fbResizeImage(file, maxEdge){
  return new Promise(function(resolve, reject){
    if (!/^image\//.test(file.type)) { reject(new Error('이미지 파일만 첨부할 수 있습니다(' + (file.name||'') + ')')); return; }
    var objUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try {
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) throw new Error('이미지 크기를 읽을 수 없습니다');
        var scale = Math.min(1, maxEdge / Math.max(w, h));
        var tw = Math.max(1, Math.round(w * scale)), th = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = tw; canvas.height = th;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, tw, th);
        canvas.toBlob(function(blob){
          URL.revokeObjectURL(objUrl);
          if (!blob) { reject(new Error('이미지를 줄이는 데 실패했습니다(' + (file.name||'') + ')')); return; }
          var reader = new FileReader();
          reader.onload = function(){
            resolve({
              b64: reader.result,   // data:image/jpeg;base64,... (GAS 쪽이 콤마 뒤만 잘라 씀 — 동일 규약)
              mime: 'image/jpeg',
              fname: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg',
              previewUrl: URL.createObjectURL(blob)
            });
          };
          reader.onerror = function(){ reject(new Error('사진 파일을 읽는 데 실패했습니다(' + (file.name||'') + ')')); };
          reader.readAsDataURL(blob);
        }, 'image/jpeg', 0.82);
      } catch (err) { URL.revokeObjectURL(objUrl); reject(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error('사진을 열 수 없습니다(' + (file.name||'') + ') — 다른 사진을 골라 주세요.')); };
    img.src = objUrl;
  });
}

function _fbRenderPhotoPreview(){
  var wrap = document.getElementById('fbPhotoPreview');
  if (!wrap) return;

  _fbPhotos.forEach(function(p, idx){
    var box = document.createElement('div');
    box.className = 'fb-photo-thumb';
    var img = document.createElement('img');
    img.src = p.previewUrl;
    img.alt = p.fname;
    var rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'fb-photo-remove';
    rm.textContent = '✕';
    rm.title = '이 사진 빼기';
    rm.onclick = function(){ _fbPhotos.splice(idx, 1); _fbRenderPhotoPreview(); };
    box.appendChild(img);
    box.appendChild(rm);
    wrap.appendChild(box);
  });
}

(function(){
  var input = document.getElementById('fbPhotoInput');
  var hint = document.getElementById('fbPhotoHint');
  if (!input) return;
  input.addEventListener('change', function(){
    var files = Array.prototype.slice.call(input.files || []);
    input.value = '';   // 같은 파일 다시 선택 가능하게 즉시 리셋
    if (!files.length) return;
    if (_fbPhotos.length >= FB_PHOTO_MAX_COUNT) {
      if (hint) hint.textContent = '이미 ' + FB_PHOTO_MAX_COUNT + '장을 선택했습니다. 더 첨부하려면 먼저 빼주세요.';
      return;
    }
    var room = FB_PHOTO_MAX_COUNT - _fbPhotos.length;
    var toProcess = files.slice(0, room);
    if (files.length > room && hint) {
      hint.textContent = '최대 ' + FB_PHOTO_MAX_COUNT + '장까지만 첨부됩니다 — 앞의 ' + toProcess.length + '장만 처리합니다.';
    } else if (hint) { hint.textContent = ''; }
    toProcess.forEach(function(file){
      _fbResizeImage(file, FB_PHOTO_MAX_EDGE).then(function(p){
        _fbPhotos.push(p);
        _fbRenderPhotoPreview();
      }).catch(function(err){
        if (hint) hint.textContent = '⚠️ ' + (err && err.message ? err.message : '사진 처리 중 문제가 발생했습니다') + ' — 다른 사진으로 다시 시도해 주세요.';
      });
    });
  });
})();

// getDisplayMedia 허용 팝업 때문에 못 만들어서 주소·창 크기 문자열을 '내용' 뒤에 붙이는 것으로 대신했다.
// 그 결과 실무진이 쓴 글 밑에 매번 기계 문자열이 따라붙어 읽기만 나빠졌다 — GM 판단은 "안 되면 그냥 안 하면
// 된다". 그래서 대체 자리를 새로 만들지 않고 기능 자체를 걷어낸다(화면 구분은 기존 '업무 구분' 칸으로 충분).

function submitStaffFeedback(){
  var contentEl = document.getElementById('fbContent');
  var content = (contentEl.value || '').trim();
  var errEl = document.getElementById('fbContentErr');

  if (!content){
    contentEl.classList.add('err');
    errEl.classList.add('show');
    contentEl.focus();
    return;
  }
  contentEl.classList.remove('err');
  errEl.classList.remove('show');

  // 작성자 필수(2026-07-25 GM) — 무기명이면 보내지 않는다. 내용 검사와 같은 방식·같은 어조.
  var authorEl = document.getElementById('fbAuthor');
  var authorErr = document.getElementById('fbAuthorErr');
  var author = (authorEl.value || '').trim();
  if (!author){
    authorEl.classList.add('err');
    if (authorErr) authorErr.classList.add('show');
    authorEl.focus();
    return;
  }
  authorEl.classList.remove('err');
  if (authorErr) authorErr.classList.remove('show');
  try { localStorage.setItem('wlp_fb_author', author); } catch(e) {}   // 다음 접수 때 자동 채움

  var payload = {
    action: 'staff_feedback_submit',
    t: FB_TOKEN,
    screen: _fbGroupValue('screen'),
    kind: _fbGroupValue('type'),
    // 쓴 사람이 입력한 글 그대로만 보낸다 — 뒤에 아무것도 덧붙이지 않는다(2026-08-05 GM).
    content: content,
    urgency: _fbGroupValue('urgency'),
    writer: author,
    // 같은 글의 재시도는 같은 번호로 보낸다 → 두 번 눌러도 시트엔 한 줄만 남는다.
    submissionId: _fbSubmissionId()
  };

  var notice = document.getElementById('fbNotice');
  var sendBtn = document.getElementById('fbSendBtn');
  _fbSetNotice(notice, '', '보내는 중입니다…');
  if (sendBtn) sendBtn.disabled = true;

  // GAS 웹앱 호출 — Content-Type: text/plain 이라 사전요청(preflight) 없이 통과하고,
  // redirect 를 따라가면 응답 본문({ok,error})을 그대로 읽을 수 있다.
  // ★no-cors 로 보내면 실패를 못 읽어 '저장됐다'고 거짓 표시하게 된다 — 쓰지 않는다(INC-013).
  fetch(FB_GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  })
  .then(function(r){
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  })
  .then(function(res){
    if (!res || res.ok !== true) {
      if (sendBtn) sendBtn.disabled = false;
      _fbSetNotice(notice, 'bad', '❌ 보내지 못했습니다 — ' + ((res && res.error) || '알 수 없는 오류')
        + '\n입력하신 내용은 그대로 있습니다. 잠시 뒤 다시 눌러 주세요.');
      return;
    }
    _fbSubId = '';   // 접수 성공 → 다음 글은 새 번호로
    var feedbackId = res.id || '';
    if (!_fbPhotos.length || !feedbackId) {
      if (sendBtn) sendBtn.disabled = false;
      _fbSetNotice(notice, 'ok', '✅ 접수됐습니다. (접수번호 ' + (feedbackId || '-') + ')\n'
        + '담당자가 확인하고 처리 결과를 남깁니다. 의견 주셔서 감사합니다.');
      contentEl.value = '';
      _fbPhotos = []; _fbRenderPhotoPreview();
      _fbLoadMyStatus(true);
      return;
    }
    // 텍스트는 이미 저장됐다 — 사진 업로드는 별도 GAS(콘텐츠 접수 재사용) 호출.
    _fbSetNotice(notice, '', '접수됐습니다. (접수번호 ' + feedbackId + ') 사진 올리는 중…');
    fetch(FB_PHOTO_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'staff_feedback_photo',
        feedbackId: feedbackId,
        photos: _fbPhotos.map(function(p){ return { b64: p.b64, mime: p.mime, fname: p.fname }; })
      }),
      redirect: 'follow'
    })
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(pres){
      if (sendBtn) sendBtn.disabled = false;
      if (!pres || pres.ok !== true) {
        _fbSetNotice(notice, 'bad', '⚠️ 글은 접수됐지만(접수번호 ' + feedbackId + ') 사진 첨부에 실패했습니다 — '
          + ((pres && pres.err) || '알 수 없는 오류')
          + '\n사진 없이 접수만 남겨졌습니다. 사진은 잠시 후 다시 시도하거나, 담당자에게 접수번호로 문의해 주세요.');
        return;
      }
      _fbSetNotice(notice, 'ok', '✅ 접수됐습니다. (접수번호 ' + feedbackId + ')\n'
        + '사진 ' + _fbPhotos.length + '장도 함께 저장됐습니다. 의견 주셔서 감사합니다.');
      contentEl.value = '';
      _fbPhotos = []; _fbRenderPhotoPreview();
      _fbLoadMyStatus(true);
    })
    .catch(function(){
      if (sendBtn) sendBtn.disabled = false;
      _fbSetNotice(notice, 'bad', '⚠️ 글은 접수됐지만(접수번호 ' + feedbackId + ') 사진을 올리는 중 통신에 실패했습니다 — '
        + '인터넷 연결을 확인하고 다시 시도해 주세요(글은 다시 보내지 않아도 됩니다).');
    });
  })
  .catch(function(e){
    if (sendBtn) sendBtn.disabled = false;
    // 통신 자체가 실패한 경우 — 저장 여부를 알 수 없으므로 성공이라 말하지 않는다.
    _fbSetNotice(notice, 'bad', '❌ 보내지 못했습니다 — 인터넷 연결을 확인하고 다시 눌러 주세요.'
      + '\n입력하신 내용은 그대로 있습니다.');
  });
}

//   staff_feedback_list 는 이미 살아 있는 조회 API(Survey.js) — 새 API·새 토큰 없이 그대로 재사용.

function _fbRenderFilteredStatus(){
  var list = document.getElementById('fbStatusList');

    empty.textContent = '이름을 입력하거나 목록에서 골라 주세요.';
    list.appendChild(empty);

  if (!_fbAllRows){

    loading.textContent = '불러오는 중…';
    list.appendChild(loading);
    return;
  }
  var norm = _fbNormName(author);
  var mine = _fbAllRows.filter(function(row){

function _fbLoadMyStatus(force){
  var list = document.getElementById('fbStatusList');
  if (!list) return;

  list.textContent = '';
  var loading = document.createElement('div');
  loading.className = 'fb-status-empty';
  loading.textContent = '불러오는 중…';
  list.appendChild(loading);
  fetch(FB_GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'staff_feedback_list', t: FB_TOKEN }),
    redirect: 'follow'
  })
  .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
  .then(function(res){
    if (!res || res.ok !== true) throw new Error((res && res.error) || 'unknown');
    _fbAllRows = res.rows || [];
    _fbFillAuthorOptions(_fbAllRows);
    _fbRenderFilteredStatus();
  })
  .catch(function(){
    _fbAllRows = null;
    list.textContent = '';

function _fbRenderMyStatus(rows, author){
  var list = document.getElementById('fbStatusList');
  if (!list) return;
  list.textContent = '';
  if (!rows.length){
    var empty = document.createElement('div');
    empty.className = 'fb-status-empty';
    empty.textContent = author ? ('"' + author + '" 이름으로 접수된 신고가 없습니다.') : '아직 접수한 신고가 없습니다.';
    list.appendChild(empty);
    return;
  }
  rows.forEach(function(row){
    var status = String(row['처리상태'] || '').trim() || '접수됨(대기)';
    var memo = String(row['처리메모'] || '').trim();
    var content = String(row['내용'] || '').trim().slice(0, 40);
    var when = String(row['접수시각'] || '').trim();
    var id = String(row['접수ID'] || '').trim();
    var badgeClass = 'wait';
    if (/완료|반영/.test(status)) badgeClass = 'done';
    else if (status !== '접수됨(대기)' && status !== '접수') badgeClass = 'doing';

    var item = document.createElement('div');
    item.className = 'fb-status-item';

    var top = document.createElement('div');
    top.className = 'fb-status-top';
    var idEl = document.createElement('span');
    idEl.className = 'fb-status-id';
    idEl.textContent = id + (when ? ' · ' + when : '');
    var badge = document.createElement('span');
    badge.className = 'fb-status-badge ' + badgeClass;
    badge.textContent = status;
    top.appendChild(idEl);
    top.appendChild(badge);
    item.appendChild(top);

    var contentEl = document.createElement('div');
    contentEl.className = 'fb-status-content';
    contentEl.textContent = content + (content.length >= 40 ? '…' : '');
    item.appendChild(contentEl);

    if (memo){
      var memoEl = document.createElement('div');
      memoEl.className = 'fb-status-memo';
      memoEl.textContent = '💬 ' + memo;
      item.appendChild(memoEl);
    }
    list.appendChild(item);
  });
}

function cancelFeedback(){
  try{
    if (window.parent && window.parent !== window && typeof window.parent.closeStaffFeedback === 'function'){
      window.parent.closeStaffFeedback();
      return;
    }
  }catch(e){}
  // 단독으로 열린 경우(부모 창 없음) — 닫을 대상이 없으니 안내만.
  var notice = document.getElementById('fbNotice');
  if (notice){ notice.textContent = '창을 닫아 주세요.'; notice.classList.add('show'); }
}
