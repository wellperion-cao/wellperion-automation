<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 · 실무진 피드백</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  실무진 피드백 접수 팝업 — membership.html 「💬 실무진 피드백」 버튼 → 모달 iframe으로 이 페이지를 연다.
  GM 지시(2026-07-24, 우선순위 높음). 대상 실무진: 임정은M 등 회원관리 화면 사용 실무자.

  ★전송 배선 미완성(의도됨) — 저장 백엔드(GAS action staff_feedback_submit)는 시포가 별도로 만든다.
    지금은 submitStaffFeedback()에서 실제 전송 대신 "준비 중" 안내만 띄우고 입력값은 그대로 둔다.
    저장 안 됐는데 됐다고 표시하지 않는다(이 저장소 반복 사고 유형 — 발행완료 오표기 재발방지 원칙과 동일 취지).
  ★외부 라이브러리·CDN 0 — 시스템 한글 폰트 스택만 사용, 완전 자체완결(오프라인에서도 동작).
  ★라이트/다크 자동 대응 — prefers-color-scheme(부모 페이지 테마 토글과 독립, 이 페이지는 iframe으로 단독 로드되므로
    OS 설정을 그대로 따른다).
═══════════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#f5f3f0;
  --paper:#ffffff;
  --paper-raised:#fbf9f6;
  --text:#221F20;
  --dim:#8a8579;
  --border:#e2dcd2;
  --accent:#B79F8A;
  --accent-bg:rgba(183,159,138,0.14);
  --accent-border:rgba(183,159,138,0.35);
  --red:#ED5B3F;--red-bg:rgba(237,91,63,0.10);--red-border:rgba(237,91,63,0.28);
  --warn-bg:rgba(230,200,78,0.16);--warn-border:rgba(230,200,78,0.4);--warn-text:#8a6d1a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#221F20;
    --paper:#272422;
    --paper-raised:#2e2b28;
    --text:#f0ece7;
    --dim:#9e9b93;
    --border:#38322e;
    --accent-bg:rgba(183,159,138,0.10);
    --accent-border:rgba(183,159,138,0.25);
    --red-bg:rgba(237,91,63,0.14);--red-border:rgba(237,91,63,0.32);
    --warn-bg:rgba(230,200,78,0.10);--warn-border:rgba(230,200,78,0.3);--warn-text:#e6c84e;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;overflow-x:hidden}
body{
  font-family:"Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--paper);color:var(--text);line-height:1.65;font-size:14px;
  word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;
  padding:18px 16px 24px;
}
.intro{font-size:12.5px;color:var(--dim);margin-bottom:18px}
.intro b{color:var(--text)}
form{display:flex;flex-direction:column;gap:18px}
fieldset{border:0;padding:0;display:flex;flex-direction:column;gap:9px}
legend{font-size:13px;font-weight:800;color:var(--text);padding:0;margin-bottom:1px}
legend .req{color:var(--red);margin-left:2px;font-weight:800}
.choice-group{display:flex;flex-wrap:wrap;gap:7px}
.choice-btn{
  font:inherit;font-size:13px;font-weight:600;color:var(--text);
  background:var(--paper-raised);border:1px solid var(--border);
  border-radius:10px;padding:9px 14px;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
  white-space:nowrap;
}
.choice-btn:hover{border-color:var(--accent-border)}
.choice-btn.active{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border);font-weight:800}
textarea{
  width:100%;min-height:120px;resize:vertical;
  font:inherit;font-size:14px;line-height:1.65;color:var(--text);
  background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;
  padding:12px 13px;outline:none;word-break:keep-all;
}
textarea:focus{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-bg)}
input[type="text"]{
  width:100%;font:inherit;font-size:14px;color:var(--text);
  background:var(--paper-raised);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;outline:none;
}
input[type="text"]:focus{border-color:var(--accent-border);box-shadow:0 0 0 3px var(--accent-bg)}
.hint{font-size:11.5px;color:var(--dim)}
.err-line{font-size:12.5px;color:var(--red);display:none;margin-top:-3px}
.err-line.show{display:block}
textarea.err{border-color:var(--red-border);box-shadow:0 0 0 3px var(--red-bg)}
.notice{
  display:none;font-size:12.5px;color:var(--warn-text);background:var(--warn-bg);
  border:1px solid var(--warn-border);border-radius:10px;padding:11px 13px;line-height:1.6;
}
.notice.show{display:block}
/* 접수 결과 3색 — 진행중(기본 노랑) / 성공(초록) / 실패(빨강).
   ★실패를 성공처럼 보이게 하지 않는다: 저장이 안 됐는데 됐다고 표시한 사고(INC-014)의 재발방지. */
.notice.ok{color:#1f6b46;background:rgba(45,138,94,0.12);border-color:rgba(45,138,94,0.32)}
.notice.bad{color:var(--red);background:var(--red-bg);border-color:var(--red-border)}
@media (prefers-color-scheme: dark){
  .notice.ok{color:#7fd0a6;background:rgba(45,138,94,0.16);border-color:rgba(45,138,94,0.36)}
}
.btn[disabled]{opacity:.55;cursor:default}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
.btn{
  font:inherit;font-size:13.5px;font-weight:700;border-radius:10px;
  padding:11px 20px;cursor:pointer;border:1px solid transparent;
}
.btn-cancel{background:var(--paper-raised);color:var(--dim);border-color:var(--border)}
.btn-cancel:hover{color:var(--text);border-color:var(--accent-border)}
.btn-send{background:var(--accent);color:#221F20}
.btn-send:hover{opacity:.9}
@media (max-width:380px){
  .btn-row{flex-direction:column-reverse}
  .btn{width:100%}
}
</style>
</head>
<body>

<div class="intro">지금 보고 계신 화면에서 불편한 점, 바꿨으면 하는 점, 오류 등을 알려주세요.<br>
남겨주신 내용은 <b>시포(AI CPO)</b>가 확인 후 개선에 반영합니다.</div>

<form id="feedbackForm" onsubmit="return false;">

  <fieldset>
    <legend>어떤 화면인가요?</legend>
    <div class="choice-group" data-field="screen">
      <button type="button" class="choice-btn active" data-value="멤버십 회원관리">멤버십 회원관리</button>
      <button type="button" class="choice-btn" data-value="강습 회원관리">강습 회원관리</button>
      <button type="button" class="choice-btn" data-value="문의 접수">문의 접수</button>
      <button type="button" class="choice-btn" data-value="기타">기타</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>어떤 내용인가요?</legend>
    <div class="choice-group" data-field="type">
      <button type="button" class="choice-btn active" data-value="불편해요">불편해요</button>
      <button type="button" class="choice-btn" data-value="이렇게 바꿔주세요">이렇게 바꿔주세요</button>
      <button type="button" class="choice-btn" data-value="오류가 났어요">오류가 났어요</button>
      <button type="button" class="choice-btn" data-value="그 외">그 외</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>자세한 내용<span class="req">*</span></legend>
    <textarea id="fbContent" placeholder="예) 재등록 현황을 열면 로딩이 오래 걸려요 / 이 버튼 위치를 위쪽으로 옮겨주세요"></textarea>
    <div class="err-line" id="fbContentErr">내용을 입력해 주세요.</div>
  </fieldset>

  <fieldset>
    <legend>얼마나 급한가요?</legend>
    <div class="choice-group" data-field="urgency">
      <button type="button" class="choice-btn" data-value="급함">급함</button>
      <button type="button" class="choice-btn active" data-value="보통">보통</button>
      <button type="button" class="choice-btn" data-value="천천히">천천히</button>
    </div>
  </fieldset>

  <!-- 작성자 필수(2026-07-25 GM 지시 "작성자도 꼭 기록하게끔") — 무기명 피드백은 되물을 수가 없다.
       실제로 7/24~25 접수 8건 중 3건이 무기명이었고, 그중 2건이 '누구 회원의 어떤 내용이 사라졌다'는
       확인이 필요한 건이라 작성자에게 되묻지 못했다. 한 번 적으면 이 브라우저에 기억시켜(localStorage)
       다음부터 자동으로 채워 넣는다 — 필수로 만들되 매번 타이핑하는 부담은 주지 않는다. -->
  <fieldset>
    <legend>작성자 <span class="req">*</span> <span class="hint">(한 번 적으면 다음부터 자동으로 채워집니다)</span></legend>
    <input type="text" id="fbAuthor" placeholder="이름 (예: 임정은)" autocomplete="name">
    <div class="err-line" id="fbAuthorErr">누가 남기셨는지 적어 주세요 — 확인이 필요할 때 되묻기 위해 꼭 필요합니다.</div>
  </fieldset>

  <!-- 접수 결과가 여기에 뜬다(보내는 중 / 접수됨 / 실패). 문구는 보낼 때 채워진다. -->
  <div class="notice" id="fbNotice" style="white-space:pre-line"></div>

  <div class="btn-row">
    <button type="button" class="btn btn-cancel" onclick="cancelFeedback()">취소</button>
    <button type="button" class="btn btn-send" id="fbSendBtn" onclick="submitStaffFeedback()">보내기</button>
  </div>

</form>

<script>
"use strict";
// 지난번에 적은 작성자 자동 채움 — 필수 항목이라 매번 타이핑하지 않게(2026-07-25 GM).
try {
  var _fbSavedAuthor = localStorage.getItem('wlp_fb_author');
  if (_fbSavedAuthor) document.getElementById('fbAuthor').value = _fbSavedAuthor;
} catch(e) {}

// 선택형 필드(button group) — 클릭한 버튼만 active, 같은 그룹 내 나머지는 해제.
document.querySelectorAll('.choice-group').forEach(function(group){
  group.addEventListener('click', function(e){
    var btn = e.target.closest('.choice-btn');
    if (!btn || !group.contains(btn)) return;
    group.querySelectorAll('.choice-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  });
});

// 접수 저장소 — 퍼널 GAS 웹앱(prod /exec). 문의 접수와 같은 엔드포인트를 쓰고,
//   action=staff_feedback_submit 이 멤버십 스프레드시트 '실무진 피드백' 탭에 적는다.
//   ★주소·토큰 정본 = .deploy-funnel-v2/Survey.js (FUNNEL_EXEC_URL · INTAKE_SUBMIT_TOKEN).
var FB_GAS_URL = 'https://script.google.com/macros/s/AKfycbykgMyFc-g_KG7x3HoKStKBwerKhYYfmbqNeFqCL5O1b_4-1nng4wEiKhkNJtfB4BWo/exec';
var FB_TOKEN   = 'wlp_intake_9f4c1b7e2a63';   // 자체 폼과 동일한 위조방지 토큰(자동 제출 차단용)

function _fbGroupValue(field){
  var active = document.querySelector('.choice-group[data-field="' + field + '"] .choice-btn.active');
  return active ? active.getAttribute('data-value') : '';
}

function submitStaffFeedback(){
  var contentEl = document.getElementById('fbContent');
  var content = (contentEl.value || '').trim();
  var errEl = document.getElementById('fbContentErr');

  if (!content){
    contentEl.classList.add('err');
    errEl.classList.add('show');
    contentEl.focus();
    return;
  }
  contentEl.classList.remove('err');
  errEl.classList.remove('show');

  // 작성자 필수(2026-07-25 GM) — 무기명이면 보내지 않는다. 내용 검사와 같은 방식·같은 어조.
  var authorEl = document.getElementById('fbAuthor');
  var authorErr = document.getElementById('fbAuthorErr');
  var author = (authorEl.value || '').trim();
  if (!author){
    authorEl.classList.add('err');
    if (authorErr) authorErr.classList.add('show');
    authorEl.focus();
    return;
  }
  authorEl.classList.remove('err');
  if (authorErr) authorErr.classList.remove('show');
  try { localStorage.setItem('wlp_fb_author', author); } catch(e) {}   // 다음 접수 때 자동 채움

  var payload = {
    action: 'staff_feedback_submit',
    t: FB_TOKEN,
    screen: _fbGroupValue('screen'),
    kind: _fbGroupValue('type'),
    content: content,
    urgency: _fbGroupValue('urgency'),
    writer: author,
    // 같은 글의 재시도는 같은 번호로 보낸다 → 두 번 눌러도 시트엔 한 줄만 남는다.
    submissionId: _fbSubmissionId()
  };

  var notice = document.getElementById('fbNotice');
  var sendBtn = document.getElementById('fbSendBtn');
  _fbSetNotice(notice, '', '보내는 중입니다…');
  if (sendBtn) sendBtn.disabled = true;

  // GAS 웹앱 호출 — Content-Type: text/plain 이라 사전요청(preflight) 없이 통과하고,
  // redirect 를 따라가면 응답 본문({ok,error})을 그대로 읽을 수 있다.
  // ★no-cors 로 보내면 실패를 못 읽어 '저장됐다'고 거짓 표시하게 된다 — 쓰지 않는다(INC-013).
  fetch(FB_GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow'
  })
  .then(function(r){
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  })
  .then(function(res){
    if (sendBtn) sendBtn.disabled = false;
    if (!res || res.ok !== true) {
      _fbSetNotice(notice, 'bad', '❌ 보내지 못했습니다 — ' + ((res && res.error) || '알 수 없는 오류')
        + '\n입력하신 내용은 그대로 있습니다. 잠시 뒤 다시 눌러 주세요.');
      return;
    }
    _fbSubId = '';   // 접수 성공 → 다음 글은 새 번호로
    _fbSetNotice(notice, 'ok', '✅ 접수됐습니다. (접수번호 ' + (res.id || '-') + ')\n'
      + '담당자가 확인하고 처리 결과를 남깁니다. 의견 주셔서 감사합니다.');
    contentEl.value = '';   // 내용만 비우고 나머지 선택은 그대로 — 연달아 남기기 쉽게
  })
  .catch(function(e){
    if (sendBtn) sendBtn.disabled = false;
    // 통신 자체가 실패한 경우 — 저장 여부를 알 수 없으므로 성공이라 말하지 않는다.
    _fbSetNotice(notice, 'bad', '❌ 보내지 못했습니다 — 인터넷 연결을 확인하고 다시 눌러 주세요.'
      + '\n입력하신 내용은 그대로 있습니다.');
  });
}

// 접수 결과 표시 — kind: ''(진행중) | 'ok' | 'bad'
function _fbSetNotice(el, kind, msg){
  if (!el) return;
  el.classList.remove('ok', 'bad');
  if (kind) el.classList.add(kind);
  el.textContent = msg;
  el.classList.add('show');
}

// 재시도해도 중복 저장되지 않게 하는 번호 — 접수에 성공하면 비워서 다음 글은 새 번호를 받는다.
var _fbSubId = '';
function _fbSubmissionId(){
  if (!_fbSubId) {
    _fbSubId = 'sf-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
  }
  return _fbSubId;
}

function cancelFeedback(){
  try{
    if (window.parent && window.parent !== window && typeof window.parent.closeStaffFeedback === 'function'){
      window.parent.closeStaffFeedback();
      return;
    }
  }catch(e){}
  // 단독으로 열린 경우(부모 창 없음) — 닫을 대상이 없으니 안내만.
  var notice = document.getElementById('fbNotice');
  if (notice){ notice.textContent = '창을 닫아 주세요.'; notice.classList.add('show'); }
}
</script>
</body>
</html>
