<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 · 휴회 접수</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  휴회 접수는 종합접수처로 통합됐습니다 (GM 지시 2026-07-23 · 시우 처리).

  경위: 2026-07-22 이 페이지로 회원 공개 접수를 열었으나, 2026-07-23 GM 지시로
        종합접수처(wellperion.com/ko/reception/)의 접수유형에 '휴회 접수'가 들어가고
        누르면 그 자리에서 폼이 열리도록 바뀌었다. 같은 폼이 두 곳에 있으면
        규칙이 바뀔 때 한쪽만 고쳐져 어긋난다(약속 L01) → 이 페이지는 폼을 걷어내고
        종합접수처로 보내는 안내만 남긴다.

  삭제가 아니라 이동 안내로 남긴 이유: 저장소 어디에도 이 페이지를 거는 링크는 없지만
    (membership.html·reception_block.html 언급은 전부 주석), 회원이 저장해둔 주소나
    공유된 링크가 있을 수 있어 404 대신 목적지로 보낸다.

  ★파일 소유는 시포(회원) — 완전 삭제 여부는 배9948에서 시포가 판단한다.
  ★접수 처리 백엔드(member_hold_apply)는 그대로 살아 있다. 바뀐 건 '입구'뿐이다.
  ★원본(폼 전체)은 git 이력에 남아 있어 언제든 되살릴 수 있다.
═══════════════════════════════════════════════════════════════════════════ -->
<meta http-equiv="refresh" content="3;url=http://wellperion.com/ko/reception/">
<style>
  :root{ --bg:#1a1918; --card:#2f2d2b; --line:#45423f;
    --text:#f3efe9; --dim:#a8a39c; --gold:#c9a24b; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#262524,#1a1918);color:var(--text);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    min-height:100vh;padding:24px 16px;display:flex;justify-content:center;align-items:center;
    line-height:1.65;word-break:keep-all;-webkit-text-size-adjust:100%}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:38px 26px;max-width:440px;width:100%;text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .mk{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:700}
  h1{font-size:22px;margin-top:10px;font-weight:800;letter-spacing:-.3px}
  p{font-size:14px;color:var(--dim);margin-top:10px}
  p b{color:var(--text)}
  .go{display:inline-block;margin-top:24px;padding:14px 26px;border-radius:12px;
    background:var(--gold);color:#1a1918;font-size:15px;font-weight:800;text-decoration:none}
  .go:hover{opacity:.92}
  .sub{margin-top:16px;font-size:12.5px;color:#8a847c}
</style>
</head>
<body>
  <div class="card">
    <div class="mk">WELLPERION</div>
    <h1>휴회 접수가 옮겨졌습니다</h1>
    <p>이제 <b>종합접수처</b>에서 휴회 접수를 받습니다.<br>잠시 후 자동으로 이동합니다.</p>
    <a class="go" href="http://wellperion.com/ko/reception/">종합접수처로 이동</a>
    <div class="sub">이동 후 「휴회 접수」를 누르시면 그 자리에서 신청하실 수 있습니다.</div>
  </div>
</body>
</html>
