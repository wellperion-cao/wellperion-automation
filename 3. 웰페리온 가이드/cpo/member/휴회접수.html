<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 · 휴회 신청</title>
<!-- ══════════════════════════════════════════════════════════════════════════
  휴회 신청 (회원 self-service) — 별도 휴회 접수 페이지. 2026-07-22 시포·GM.
  · 백엔드 재사용: v2 GAS(/exec AKfycbyk) member_hold_preview / member_hold_apply.
    검증(3회·총60일·1회 7~60일)은 서버 단일 SSOT — 이 페이지는 표시·전송만(규칙 이중화 금지).
  · 본인확인 = 이름+연락처 동시일치(서버 fail-closed). 반환은 본인 휴회 이력(횟수/누적/잔여)뿐.
  · ★게이트: 미리보기 read-only. 실제 접수(apply)는 서버 HOLD_LIVE=false로 차단(초안 검토 단계) →
    이 경우 '데스크 신청 안내'로 친절 안내. 라이브 발효·종합접수처 연동은 GM go.
  · self-service 조회 분기(selfName/selfPhone)는 새 public PII 표면 → 배포·발효 GM go 전까지 미배포 초안.
═══════════════════════════════════════════════════════════════════════════ -->
<style>
  :root{
    --bg:#1a1918; --card:#2f2d2b; --card2:#262524; --line:#45423f;
    --text:#f3efe9; --dim:#a8a39c; --gold:#c9a24b; --red:#e06a5a; --green:#7bb872;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#262524,#1a1918);color:var(--text);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;padding:24px 16px;display:flex;justify-content:center;align-items:flex-start}
  .wrap{width:100%;max-width:460px}
  .brand{text-align:center;margin-bottom:18px}
  .brand .mk{font-size:11px;letter-spacing:.28em;color:var(--gold);font-weight:700}
  .brand h1{font-size:22px;margin-top:6px;font-weight:800}
  .brand p{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.5}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;
    box-shadow:0 18px 50px rgba(0,0,0,.4);margin-bottom:14px}
  .label{font-size:12.5px;color:var(--dim);font-weight:700;margin:14px 0 6px}
  .label:first-child{margin-top:0}
  input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    background:var(--card2);color:var(--text);font:14px inherit;outline:none}
  input:focus{border-color:var(--gold)}
  .btn{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;cursor:pointer;
    background:var(--gold);color:#1a1918;font:700 14px inherit}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
  .hist{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
    font-size:13px;line-height:1.7;margin-top:14px}
  .hist b{color:var(--text)}
  .hist .rem{color:var(--gold);font-weight:800}
  .msg{font-size:13px;font-weight:700;margin-top:12px;min-height:18px;line-height:1.5}
  .msg.ok{color:var(--green)} .msg.err{color:var(--red)}
  .rule{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.6}
  .hidden{display:none}
  .foot{text-align:center;font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.7}
  .foot a{color:var(--gold);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mk">WELLPERION</div>
    <h1>휴회 신청</h1>
    <p>멤버십 이용을 잠시 멈추실 수 있습니다.<br>본인 확인 후 신청해 주세요.</p>
  </div>

  <!-- STEP 1 — 본인 확인 -->
  <div class="card" id="cardVerify">
    <div class="label">성함</div>
    <input type="text" id="fName" placeholder="회원 성함" autocomplete="name">
    <div class="label">연락처</div>
    <input type="tel" id="fPhone" placeholder="010-0000-0000" autocomplete="tel" inputmode="numeric">
    <button class="btn" id="btnVerify" onclick="verifyMember()">내 휴회 현황 조회</button>
    <div class="msg" id="verifyMsg"></div>
    <div class="rule">휴회는 <b>총 3회 · 누적 60일</b>까지, 1회 <b>최소 7일 ~ 최대 60일</b> 신청 가능합니다. 잔여는 조회 시 자동 계산됩니다.</div>
  </div>

  <!-- STEP 2 — 휴회 신청(본인 확인 후 표시) -->
  <div class="card hidden" id="cardApply">
    <div class="hist" id="histBox"></div>
    <div class="label">휴회 시작일</div>
    <input type="date" id="fStart" onchange="refreshPreview()">
    <div class="label">휴회 일수 <span style="color:var(--dim);font-weight:400">(7~60일)</span></div>
    <input type="number" id="fDays" min="7" max="60" step="1" placeholder="예: 30" oninput="refreshPreview()">
    <div class="msg" id="applyMsg"></div>
    <button class="btn" id="btnApply" onclick="submitHold()">휴회 신청</button>
    <button class="btn ghost" onclick="resetForm()">다시 조회</button>
  </div>

  <div class="foot">
    문의: <a href="http://wellperion.com/ko/inquiry/">wellperion.com</a> · 대표전화로도 신청하실 수 있습니다.
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbykgMyFc-g_KG7x3HoKStKBwerKhYYfmbqNeFqCL5O1b_4-1nng4wEiKhkNJtfB4BWo/exec';
  var _self = null;   // { name, phone } 확인된 본인

  function post(payload){
    return fetch(GAS_URL, { method:'POST', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function(r){ return r.text(); })
      .then(function(t){ try{ return JSON.parse(t); }catch(e){ return { ok:false, error:'응답 파싱 실패' }; } });
  }

  // STEP1 — 본인 확인 + 이력 조회(member_hold_preview, 요청 없이)
  function verifyMember(){
    var name = (document.getElementById('fName').value||'').trim();
    var phone = (document.getElementById('fPhone').value||'').trim();
    var msg = document.getElementById('verifyMsg'); msg.className='msg';
    if(!name || !phone){ msg.className='msg err'; msg.textContent='성함과 연락처를 모두 입력해 주세요.'; return; }
    var btn = document.getElementById('btnVerify'); btn.disabled=true; msg.textContent='조회 중…';
    post({ action:'member_hold_preview', selfName:name, selfPhone:phone })
      .then(function(d){
        if(!d || d.ok===false){
          msg.className='msg err';
          msg.textContent = (d && d.error==='self-not-found') ? '일치하는 회원 정보를 찾을 수 없습니다. 성함·연락처를 확인해 주세요.'
                          : (d && d.error==='self-ambiguous') ? '동일 정보 회원이 여럿입니다. 데스크로 문의해 주세요.'
                          : (d && (d.detail||d.error)) || '조회에 실패했습니다.';
          return;
        }
        _self = { name:name, phone:phone };
        renderHistory(d);
        document.getElementById('cardVerify').classList.add('hidden');
        document.getElementById('cardApply').classList.remove('hidden');
      })
      .catch(function(){ msg.className='msg err'; msg.textContent='네트워크 오류. 잠시 후 다시 시도해 주세요.'; })
      .then(function(){ btn.disabled=false; });
  }

  function renderHistory(d){
    var hb = document.getElementById('histBox');
    hb.innerHTML = '📋 <b>휴회 이력</b> — 사용 <b>'+d.current.count+'회</b> / 누적 <b>'+d.current.cumDays+'일</b>'
      + ' · 잔여 <span class="rem">'+d.remaining.count+'회 · '+d.remaining.days+'일</span>'
      + ' <span style="color:var(--dim)">(한도 '+d.limits.maxCount+'회 · '+d.limits.maxTotal+'일)</span>';
  }

  // STEP2 — 시작일·일수 입력 시 실시간 미리보기(서버 검증)
  function refreshPreview(){
    if(!_self) return;
    var start=(document.getElementById('fStart').value||'').trim();
    var days=parseInt(document.getElementById('fDays').value,10);
    var msg=document.getElementById('applyMsg'); msg.className='msg';
    if(!start || isNaN(days)){ msg.textContent=''; return; }
    post({ action:'member_hold_preview', selfName:_self.name, selfPhone:_self.phone, holdStart:start, holdDays:days })
      .then(function(d){
        if(!d || d.ok===false){ msg.className='msg err'; msg.textContent=(d&&(d.detail||d.error))||'확인 실패'; return; }
        renderHistory(d);
        if(d.valid){ msg.className='msg ok'; msg.textContent='✅ 신청 가능 — 휴회 '+d.request.start+' ~ '+d.request.end+' ('+d.request.days+'일)'; }
        else { msg.className='msg err'; msg.textContent='⛔ '+(d.error||'신청할 수 없습니다.'); }
      })
      .catch(function(){ msg.className='msg err'; msg.textContent='네트워크 오류'; });
  }

  // 휴회 신청(member_hold_apply) — 서버 HOLD_LIVE=false면 준비중 안내로 매핑(내부용어 노출 금지)
  function submitHold(){
    if(!_self){ return; }
    var start=(document.getElementById('fStart').value||'').trim();
    var days=parseInt(document.getElementById('fDays').value,10);
    var msg=document.getElementById('applyMsg'); msg.className='msg';
    if(!start){ msg.className='msg err'; msg.textContent='휴회 시작일을 입력해 주세요.'; return; }
    if(isNaN(days)){ msg.className='msg err'; msg.textContent='휴회 일수를 입력해 주세요.'; return; }
    var btn=document.getElementById('btnApply'); btn.disabled=true; msg.textContent='신청 중…';
    post({ action:'member_hold_apply', selfName:_self.name, selfPhone:_self.phone, holdStart:start, holdDays:days })
      .then(function(d){
        if(d && d.ok===false){
          if(d.error==='hold-gated'){ msg.className='msg'; msg.style.color='var(--gold)';
            msg.textContent='현재 온라인 휴회 신청은 준비 중입니다. 데스크(대표전화)로 신청해 주시면 바로 처리해 드립니다.'; return; }
          msg.className='msg err'; msg.textContent=(d.detail||d.error||'신청에 실패했습니다.'); return;
        }
        msg.className='msg ok';
        msg.textContent='✅ 휴회 신청이 접수되었습니다 — '+d.start+' ~ '+d.end+' ('+days+'일). 확정 시 안내드립니다.';
        document.getElementById('btnApply').classList.add('hidden');
      })
      .catch(function(){ msg.className='msg err'; msg.textContent='네트워크 오류. 잠시 후 다시 시도해 주세요.'; })
      .then(function(){ btn.disabled=false; });
  }

  function resetForm(){
    _self=null;
    document.getElementById('cardApply').classList.add('hidden');
    document.getElementById('cardVerify').classList.remove('hidden');
    document.getElementById('verifyMsg').textContent='';
    document.getElementById('applyMsg').textContent='';
    document.getElementById('fStart').value=''; document.getElementById('fDays').value='';
    document.getElementById('btnApply').classList.remove('hidden');
  }
</script>
</body>
</html>
