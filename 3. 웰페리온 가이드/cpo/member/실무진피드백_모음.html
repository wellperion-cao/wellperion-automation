<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웰페리온 · 실무진 피드백 모음</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<!-- ══ 실무진 피드백 모음 페이지 (GM 지시 2026-07-29 밤 — "실무진 피드백 버튼은 별도로 페이지에 모이게 해주고")
     ★PII 주의: 피드백 본문에 회원 이름·전화번호가 섞여 들어온다(실측). 공개 URL로 그냥 열리면 안 되므로
     기존 보안 커튼(_assets/gate.js) 그대로 적용 — 새 보안장치 신설 없음(약속 L21).
     데이터 소스: 이미 도는 피드백 시트(실무진피드백.html이 쓰는 것과 동일 스프레드시트,
     "실무진 피드백" 탭)를 GVIZ로 읽기 전용 조회 — 새 GAS 액션·새 저장소 신설 없음.
     이 페이지에서 시트를 고치지 않는다(읽기 전용). ══ -->
<script src="../../_assets/gate.js" charset="utf-8"></script>
<style>
  :root{
    --bg:#1c1a1b; --paper:#252220; --surface:#181615;
    --text:#f3efe9; --text-soft:#c9c4bc; --dim:#87837c;
    --accent:#8b5cf6; --accent-soft:#b8a0fb;
    --border:#3a3532; --border-strong:#4c4642;
    --gold:#e8b84b; --green:#5fbf82; --blue:#6fb4e8; --rose:#dd7f6e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{overflow-x:hidden;}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color:var(--text); background:var(--bg); line-height:1.6; font-size:15px; -webkit-font-smoothing:antialiased; padding:20px clamp(16px,2vw,32px) 48px;}
  header.page-head{margin-bottom:16px; padding-bottom:12px; border-bottom:2px solid var(--border-strong); display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;}
  header.page-head h1{font-size:24px; font-weight:800; letter-spacing:-0.02em;}
  header.page-head .slogan{font-size:13px; color:var(--dim); margin-top:3px;}
  header.page-head .back{font-size:13.5px; color:var(--accent-soft); text-decoration:none; border:1px solid var(--border-strong); border-radius:7px; padding:6px 14px; white-space:nowrap; margin-left:auto;}
  header.page-head .back:hover{background:var(--surface);}

  .unproc-banner{display:flex; align-items:baseline; gap:10px; background:var(--surface); border:1px solid var(--rose); border-left:4px solid var(--rose); border-radius:10px; padding:14px 18px; margin-bottom:16px; flex-wrap:wrap;}
  .unproc-banner .n{font-size:30px; font-weight:800; color:var(--rose); font-variant-numeric:tabular-nums;}
  .unproc-banner .lbl{font-size:14px; color:var(--text-soft);}
  .unproc-banner .sub{font-size:12px; color:var(--dim); width:100%;}

  .fb-filters{display:flex; flex-wrap:wrap; gap:8px 10px; margin-bottom:14px; align-items:center;}
  .fb-filter-group{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .fb-filter-label{font-size:12px; color:var(--dim); margin-right:2px;}
  .fb-chip{font-size:12.5px; font-weight:700; padding:6px 13px; border-radius:20px; border:1.5px solid var(--border); background:var(--surface); color:var(--text-soft); cursor:pointer; font-family:inherit;}
  .fb-chip.active{background:var(--accent); border-color:var(--accent); color:#1a1918;}
  .fb-search{flex:1; min-width:160px; padding:7px 12px; border-radius:8px; border:1px solid var(--border); background:var(--paper); color:var(--text); font-size:13px; font-family:inherit;}

  .fb-count-line{font-size:12.5px; color:var(--dim); margin-bottom:10px;}

  .fb-card{border:1px solid var(--border); border-left:3px solid var(--border-strong); border-radius:10px; padding:13px 16px; margin-bottom:10px; background:var(--surface);}
  .fb-card.st-접수{border-left-color:var(--rose);}
  .fb-card.st-진행중{border-left-color:var(--gold);}
  .fb-card.st-처리완료{border-left-color:var(--green);}
  .fb-card-head{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px;}
  .fb-tag{font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; background:var(--paper); border:1px solid var(--border); color:var(--text-soft); white-space:nowrap;}
  .fb-tag.status{font-weight:800;}
  .fb-tag.st-접수{color:var(--rose); border-color:var(--rose);}
  .fb-tag.st-진행중{color:var(--gold); border-color:var(--gold);}
  .fb-tag.st-처리완료{color:var(--green); border-color:var(--green);}
  .fb-time{font-size:11.5px; color:var(--dim); margin-left:auto;}
  .fb-author{font-size:13px; font-weight:700; color:var(--text);}
  .fb-content{font-size:14px; color:var(--text-soft); line-height:1.6; white-space:pre-wrap; margin:8px 0;}
  .fb-memo{font-size:13px; color:var(--text-soft); background:var(--paper); border-radius:7px; padding:8px 11px; margin-top:6px;}
  .fb-memo-label{font-size:11px; color:var(--dim); font-weight:700; margin-bottom:2px;}
  .fb-empty{color:var(--dim); font-size:13.5px; text-align:center; padding:40px 0;}
  .fb-photo-note{font-size:11px; color:var(--dim); font-style:italic; margin-top:6px;}

  @media (max-width:420px){
    .fb-card-head{gap:6px;}
    .fb-time{margin-left:0; width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div>
      <h1>💬 실무진 피드백 모음</h1>
      <div class="slogan">전 화면(멤버십·강습·종합접수처·상품기획·브로제이) 접수 통합 · 읽기 전용</div>
    </div>
    <a class="back" href="membership.html">◂ 멤버십 회원관리로</a>
  </header>

  <div id="unprocBanner" class="unproc-banner">
    <div class="n" id="unprocCount">…</div>
    <div class="lbl">건 미처리 (접수+진행중)</div>
    <div class="sub" id="totalLine">불러오는 중…</div>
  </div>

  <div class="fb-filters">
    <div class="fb-filter-group" id="screenFilter"><span class="fb-filter-label">업무구분</span></div>
  </div>
  <div class="fb-filters">
    <div class="fb-filter-group" id="statusFilter"><span class="fb-filter-label">처리상태</span></div>
  </div>
  <div class="fb-filters">
    <input type="text" class="fb-search" id="authorSearch" placeholder="작성자로 찾기…">
  </div>

  <div class="fb-count-line" id="countLine"></div>
  <div id="fbList"><div class="fb-empty">불러오는 중…</div></div>
</div>

<script>
(function(){
  var SHEET_ID = '12AWcAlgmmYKr2nUbWmVpa71_z3zi0BaU4ZdnOwrI_7U';
  var TAB_NAME = '실무진 피드백';
  var GVIZ_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json&sheet=' + encodeURIComponent(TAB_NAME);

  function esc(s){
    s = (s === undefined || s === null) ? '' : String(s);
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var _all = [];       // 전체 접수(파싱된 배열)
  var _screen = '전체';
  var _status = '전체';

  function parseGviz(text){
    // gviz 응답은 "google.visualization.Query.setResponse(...)" 로 감싸져 있다 — JSON만 추출.
    var m = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
    if(!m) return null;
    try { return JSON.parse(m[1]); } catch(e){ return null; }
  }
  function cellStr(row, i){
    var c = row.c && row.c[i];
    if(!c) return '';
    return (c.f !== undefined && c.f !== null) ? String(c.f) : (c.v !== undefined && c.v !== null ? String(c.v) : '');
  }

  function loadFeedback(){
    return fetch(GVIZ_URL, {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(text){
        var data = parseGviz(text);
        if(!data || !data.table || !data.table.rows){ throw new Error('parse_failed'); }
        var rows = data.table.rows;
        // 헤더: 접수시각·접수ID·업무 구분·종류·급한정도·작성자·내용·처리상태·처리메모 (Survey.js staff_feedback_submit 정의 그대로)
        _all = rows.map(function(r){
          return {
            at: cellStr(r, 0), id: cellStr(r, 1), screen: cellStr(r, 2) || '(미기재)',
            kind: cellStr(r, 3), urgency: cellStr(r, 4), author: cellStr(r, 5) || '(무기명)',
            content: cellStr(r, 6), status: cellStr(r, 7) || '접수', memo: cellStr(r, 8)
          };
        });
        buildFilters();
        render();
      })
      .catch(function(e){
        document.getElementById('fbList').innerHTML = '<div class="fb-empty">불러오지 못했습니다 (' + esc(e.message) + ').<br>시트 접근 권한 또는 네트워크를 확인해 주세요.</div>';
        document.getElementById('unprocCount').textContent = '—';
      });
  }

  function buildFilters(){
    var screens = ['전체'];
    _all.forEach(function(r){ if(screens.indexOf(r.screen) < 0) screens.push(r.screen); });
    var statuses = ['전체', '접수', '진행중', '처리완료'];

    var sf = document.getElementById('screenFilter');
    sf.innerHTML = '<span class="fb-filter-label">업무구분</span>' + screens.map(function(s){
      return '<button type="button" class="fb-chip' + (s === _screen ? ' active' : '') + '" data-filter="screen" data-value="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');

    var stf = document.getElementById('statusFilter');
    stf.innerHTML = '<span class="fb-filter-label">처리상태</span>' + statuses.map(function(s){
      return '<button type="button" class="fb-chip' + (s === _status ? ' active' : '') + '" data-filter="status" data-value="' + esc(s) + '">' + esc(s) + '</button>';
    }).join('');

    document.querySelectorAll('.fb-chip').forEach(function(btn){
      btn.onclick = function(){
        var field = btn.getAttribute('data-filter');
        var val = btn.getAttribute('data-value');
        if(field === 'screen') _screen = val; else _status = val;
        buildFilters();
        render();
      };
    });
  }

  function render(){
    var authorQuery = (document.getElementById('authorSearch').value || '').trim();
    var filtered = _all.filter(function(r){
      if(_screen !== '전체' && r.screen !== _screen) return false;
      if(_status !== '전체' && (r.status || '접수') !== _status) return false;
      if(authorQuery && r.author.indexOf(authorQuery) === -1) return false;
      return true;
    });

    var unprocessed = _all.filter(function(r){ return (r.status || '접수') !== '처리완료'; }).length;
    document.getElementById('unprocCount').textContent = unprocessed;
    document.getElementById('totalLine').textContent = '전체 접수 ' + _all.length + '건 중 미처리 ' + unprocessed + '건';
    document.getElementById('countLine').textContent = '필터 결과: ' + filtered.length + '건 / 전체 ' + _all.length + '건';

    var list = document.getElementById('fbList');
    if(!filtered.length){ list.innerHTML = '<div class="fb-empty">해당하는 접수가 없습니다.</div>'; return; }

    list.innerHTML = filtered.map(function(r){
      var stCls = 'st-' + (r.status || '접수');
      var memoHtml = r.memo ? '<div class="fb-memo"><div class="fb-memo-label">처리메모(회신)</div>' + esc(r.memo) + '</div>' : '';
      return '<div class="fb-card ' + stCls + '">' +
        '<div class="fb-card-head">' +
          '<span class="fb-author">' + esc(r.author) + '</span>' +
          '<span class="fb-tag">' + esc(r.screen) + '</span>' +
          '<span class="fb-tag">' + esc(r.kind) + '</span>' +
          (r.urgency ? '<span class="fb-tag">' + esc(r.urgency) + '</span>' : '') +
          '<span class="fb-tag status ' + stCls + '">' + esc(r.status || '접수') + '</span>' +
          '<span class="fb-time">' + esc(r.at) + '</span>' +
        '</div>' +
        '<div class="fb-content">' + esc(r.content) + '</div>' +
        memoHtml +
        '<div class="fb-photo-note">📎 사진 첨부는 준비 중입니다(다음 업데이트에서 표시됩니다).</div>' +
      '</div>';
    }).join('');
  }

  document.getElementById('authorSearch').addEventListener('input', function(){ render(); });

  loadFeedback();
})();
</script>
</body>
</html>
