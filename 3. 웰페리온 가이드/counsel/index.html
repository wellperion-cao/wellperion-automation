<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담</title>
<style>
/* 색 토큰 = erp/brand/tokens.css 값 그대로 인라인(이 페이지는 로그인 없이 열려 관문 뒤 자산을 못 불러온다) */
:root{--paper:#F4F0EB;--ink:#221F20;--accent-text:#8F7659;--beige:#B79F8A;--line:rgba(34,31,32,.14);--good:#2E6B3A;--bad:#B3402B}
*{box-sizing:border-box}
body{margin:0;padding:0;background:var(--paper);color:var(--ink);font:15px/1.6 'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff}
header{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
header h1{margin:0;font-size:17px;font-weight:700;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:5px}
.status{font-size:11.5px;color:var(--accent-text);white-space:nowrap}
.greet{padding:14px 18px 6px;font-size:14px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 18px 12px}
.chip{border:1px solid var(--line);background:none;color:var(--accent-text);font-size:12px;padding:5px 10px;border-radius:14px;cursor:pointer}
.chip:hover{border-color:var(--beige);color:var(--ink)}
#log{flex:1;padding:6px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.msg{max-width:88%;padding:10px 13px;border-radius:12px;font-size:14.5px;white-space:pre-wrap;word-break:keep-all}
.msg.q{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:2px}
.msg.a{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:2px}
.msg.typing{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:2px;color:var(--accent-text);letter-spacing:2px}
.msg.a .fb{margin-top:8px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--accent-text)}
.msg.a .fb button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:13px}
.msg.a .fb button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.msg.a .reserve{display:inline-block;margin-top:8px;padding:7px 12px;background:var(--ink);color:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700}
form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
form input{flex:1;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--paper);color:var(--ink)}
form button{padding:11px 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-weight:700;font:inherit;cursor:pointer}
footer{padding:10px 18px 18px;font-size:12px;color:var(--accent-text);border-top:1px solid var(--line);text-align:center}
footer a{color:var(--accent-text)}
</style>
</head><body>
<div class="wrap">
<header><h1 id="botName">상담</h1><span class="status"><span class="dot"></span>응답 가능</span></header>
<div class="greet" id="greet">궁금한 것을 편하게 물어보세요.</div>
<div class="chips" id="chips"></div>
<div id="log"></div>
<form id="askForm"><input id="q" placeholder="궁금한 것을 편하게 물어보세요" autocomplete="off" autofocus required><button type="submit">보내기</button></form>
<footer id="foot"></footer>
</div>
<script>
(function(){
"use strict";
var TENANT_BY_PATH = {"/counsel/":"1_wellperion","/dietcamp/counsel/":"2_dietcamp","/spogym/counsel/":"3_spogym"};
var tenant = TENANT_BY_PATH[location.pathname] || new URLSearchParams(location.search).get("t") || "1_wellperion";
var API = "/api/chat/" + tenant;
var log = document.getElementById("log");
var reservationUrl = "";
var typingMs = 900;

// 대화 문맥 유지용 세션 id(배1036 GM 구조전환②) — 이 브라우저 탭 안에서만(sessionStorage), 개인정보 아님.
var sessionId = "";
try {
  sessionId = sessionStorage.getItem("counsel_sid") || "";
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
    sessionStorage.setItem("counsel_sid", sessionId);
  }
} catch (e) { /* 시크릿 모드 등 저장 불가 — 세션 없이 매 질문 새로(문맥 유지만 못 함) */ }

function addMsg(role, text, extra){
  var d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  if (extra) d.appendChild(extra);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

function feedbackRow(faqId){
  var row = document.createElement("div");
  row.className = "fb";
  var label = document.createElement("span");
  label.textContent = "도움이 됐나요?";
  row.appendChild(label);
  ["up", "down"].forEach(function(vote){
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = vote === "up" ? "👍" : "👎";
    b.onclick = function(){
      row.querySelectorAll("button").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      fetch(API + "/feedback", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({faq_id: faqId, vote: vote})}).catch(function(){});
    };
    row.appendChild(b);
  });
  return row;
}

function ask(text){
  text = (text || "").trim();
  if (!text) return;
  addMsg("q", text);
  document.getElementById("q").value = "";
  var chips = document.getElementById("chips");
  if (chips) chips.hidden = true;   // 칩은 첫 질문 전 살짝 보이는 보조일 뿐(GM 09-05) — 대화 시작되면 치운다
  var typing = document.createElement("div");
  typing.className = "msg typing"; typing.textContent = "●●●";
  log.appendChild(typing); log.scrollTop = log.scrollHeight;
  fetch(API, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({q:text, session_id:sessionId})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      setTimeout(function(){
        typing.remove();
        var extra = null;
        if (!d.answered){
          var a = document.createElement("a");
          a.className = "reserve"; a.textContent = "상담 예약";
          a.href = reservationUrl || "#"; a.target = "_blank"; a.rel = "noopener";
          extra = a;
        } else {
          extra = feedbackRow(d.faq_id);
        }
        addMsg("a", d.answer || "", extra);
      }, typingMs);
    })
    .catch(function(){ typing.remove(); addMsg("a", "지금 답을 받아올 수 없습니다. 잠시 후 다시 시도해 주세요."); });
}

document.getElementById("askForm").addEventListener("submit", function(e){
  e.preventDefault();
  ask(document.getElementById("q").value);
});

fetch(API + "/profile").then(function(r){ return r.json(); }).then(function(p){
  var name = (p.persona && p.persona.name) || p.name || "상담";
  document.title = name;
  document.getElementById("botName").textContent = name;
  if (p.persona && p.persona.greeting) document.getElementById("greet").textContent = p.persona.greeting;
  if (p.persona && p.persona.typing_ms) typingMs = p.persona.typing_ms;
  reservationUrl = p.reservation_url || "";
  var c = p.contact || {};
  var footBits = [];
  if (c.phone) footBits.push('<a href="tel:' + c.phone.replace(/[^0-9+]/g, "") + '">📞 ' + c.phone + '</a>');
  if (c.kakao) footBits.push('<a href="' + c.kakao + '" target="_blank" rel="noopener">💬 카카오톡</a>');
  if (c.naver_place) footBits.push('<a href="' + c.naver_place + '" target="_blank" rel="noopener">📍 위치</a>');
  document.getElementById("foot").innerHTML = footBits.join(" · ");
  var chips = p.chips || [];
  var wrap = document.getElementById("chips");
  chips.slice(0, 3).forEach(function(c){   // 처음 한 번 살짝 보이는 보조일 뿐(GM 09-05) — 6개→3개로 가볍게
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = c.q;
    b.onclick = function(){ ask(c.q); };
    wrap.appendChild(b);
  });
  var withAnswer = chips.filter(function(c){ return c.q && c.a; });
  if (withAnswer.length){
    var ld = {"@context":"https://schema.org","@type":"FAQPage",
      "mainEntity": withAnswer.map(function(c){
        return {"@type":"Question","name":c.q,"acceptedAnswer":{"@type":"Answer","text":c.a}};
      })};
    var s = document.createElement("script");
    s.type = "application/ld+json";
    s.textContent = JSON.stringify(ld);
    document.head.appendChild(s);
  }
}).catch(function(){});
})();
</script>
</body></html>
