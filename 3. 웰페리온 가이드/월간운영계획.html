<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📅 웰페리온 월간 운영 계획·보고</title>
<link rel="icon" type="image/x-icon" href="welly_favicon.ico">
<style>
  :root{
    --bg:#221F20; --paper:#2a2725; --surface:#1a1817;
    --text:#f5f2ef; --text-soft:#d4d0cc; --dim:#8c8b83;
    --accent:#7C3AED; --accent-soft:#a875f5;
    --border:#3d3835; --border-strong:#4d4845;
    --gold:#f0c674; --green:#6abf7b; --blue:#7ac4f0; --rose:#e08a7a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color:var(--text); background:var(--bg); line-height:1.5; font-size:13px; -webkit-font-smoothing:antialiased; padding:18px 18px 32px;}
  .wrap{max-width:1120px; margin:0 auto;}

  header.page-head{margin-bottom:12px; padding-bottom:10px; border-bottom:2px solid var(--border-strong); display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px;}
  header.page-head h1{font-size:22px; font-weight:800; letter-spacing:-0.02em; flex:1;}
  header.page-head .back{font-size:12px; color:var(--accent-soft); text-decoration:none; border:1px solid var(--border-strong); border-radius:7px; padding:4px 11px; white-space:nowrap;}
  header.page-head .back:hover{background:var(--surface);}

  /* ── 3층 네비 (북극성 → 월간 → 오늘) ── */
  .layers{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 0 14px; padding:8px 11px; background:var(--paper); border:1px solid var(--border); border-radius:10px; font-size:12px;}
  .layers a, .layers span.cur{text-decoration:none; border:1px solid var(--border-strong); border-radius:20px; padding:3px 12px; color:var(--text-soft); white-space:nowrap;}
  .layers a:hover{border-color:var(--accent); color:var(--accent-soft);}
  .layers span.cur{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700;}
  .layers .arw{color:var(--dim); font-size:11px;}

  /* ── 월 선택 바 + 편집 ── */
  .month-bar{display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:8px;}
  .month-bar label{font-size:12px; color:var(--dim);}
  .month-bar select{font-size:14px; font-weight:700; color:var(--text); background:var(--surface); border:1px solid var(--border-strong); border-radius:8px; padding:5px 12px; cursor:pointer;}
  .ebtn{font-size:12px; padding:5px 13px; border-radius:8px; cursor:pointer;}
  .ebtn.edit{background:var(--surface); color:var(--accent-soft); border:1px solid var(--accent);}
  .ebtn.save{background:var(--accent); color:#fff; border:none;}
  .ebtn.cancel{background:var(--surface); color:var(--dim); border:1px solid var(--border-strong);}
  .ebtn.chair{background:var(--surface); color:var(--gold); border:1px solid var(--border-strong);}
  .ebtn.chair.on{background:var(--gold); color:#221F20; border-color:var(--gold); font-weight:700;}

  /* ── 경영진 보고 인쇄 배너(화면 숨김·인쇄+경영진 보고 모드에서만) ── */
  .print-head{display:none;}

  /* ── 월 헤더 ── */
  .month-head{margin:6px 0 14px; padding:12px 15px; border:1px solid var(--border); border-left:4px solid var(--accent); border-radius:11px; background:var(--paper); display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;}
  .month-head .mtitle{font-size:17px; font-weight:800;}
  .month-head .mtheme{font-size:13px; color:var(--text-soft); flex:1; min-width:200px;}

  .mstat{display:inline-block; font-size:11.5px; font-weight:700; border-radius:20px; padding:3px 11px; white-space:nowrap;}
  .mstat.계획{color:var(--dim); background:var(--surface); border:1px solid var(--border-strong);}
  .mstat.진행{color:var(--blue); background:rgba(122,196,240,0.10); border:1px solid rgba(122,196,240,0.35);}
  .mstat.완료{color:var(--green); background:rgba(106,191,123,0.10); border:1px solid rgba(106,191,123,0.35);}
  .mstat.이월{color:var(--gold); background:rgba(240,198,116,0.10); border:1px solid rgba(240,198,116,0.35);}

  h2.sec{font-size:15px; font-weight:700; margin:20px 0 9px; display:flex; align-items:center; gap:7px;}
  h2.sec .stag{font-size:11px; font-weight:400; color:var(--dim);}

  /* ── 도달율 진행 막대 (공통) ── */
  .prog{display:flex; align-items:center; gap:8px; min-width:118px;}
  .prog .track{flex:1; height:13px; border-radius:8px; background:var(--surface); border:1px solid var(--border); overflow:hidden; min-width:52px;}
  .prog .track>i{display:block; height:100%; border-radius:8px; transition:width .25s ease;}
  .prog .track.done>i{background:linear-gradient(90deg,#3f8f4f,var(--green));}
  .prog .track.prog>i{background:linear-gradient(90deg,var(--accent),var(--accent-soft));}
  .prog .track.plan>i{background:linear-gradient(90deg,#5a5550,#8c8b83);}
  .prog .track.carry>i{background:linear-gradient(90deg,#b8860b,var(--gold));}
  .prog .pnum{font-size:13px; font-weight:800; color:var(--text); min-width:38px; text-align:right;}
  .prog .pin-num{width:58px; font-size:12px; color:var(--text); background:var(--surface); border:1px solid var(--accent); border-radius:6px; padding:3px 6px; text-align:right;}
  .prog.big .track{height:20px;}
  .prog.big .pnum{font-size:17px; min-width:48px;}

  /* ── 보고서형 표 (목표 보드 · 연간 재무) ── */
  .rpt-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--paper);}
  table.rpt{width:100%; border-collapse:collapse; min-width:720px;}
  table.rpt thead th{font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; color:var(--dim); text-align:left; padding:10px 13px; background:var(--surface); border-bottom:1px solid var(--border-strong); white-space:nowrap;}
  table.rpt tbody td{padding:12px 13px; border-bottom:1px solid var(--border); vertical-align:top; font-size:12.5px; color:var(--text-soft);}
  table.rpt tbody tr:last-child td{border-bottom:none;}
  table.rpt tbody tr:hover td{background:rgba(124,58,237,0.04);}
  .r-title{font-weight:700; font-size:13.5px; color:var(--text); line-height:1.35;}
  .r-title .chip.ns{margin-left:5px;}
  .c-own{white-space:nowrap;}
  .c-own .r-dept{font-size:10.5px; color:var(--dim); margin-top:4px;}
  .c-prog{min-width:150px;}
  .c-note .r-note{font-size:11.5px; color:var(--dim); line-height:1.5; white-space:pre-wrap;}
  .c-note{max-width:280px;}

  .chip{display:inline-block; font-size:11px; border-radius:6px; padding:2px 8px; white-space:nowrap;}
  .chip.own{color:var(--accent-soft); background:var(--surface); border:1px solid var(--border-strong);}
  .chip.dept{color:var(--dim); background:var(--surface); border:1px solid var(--border);}
  .chip.ns{color:var(--gold); background:rgba(240,198,116,0.08); border:1px solid rgba(240,198,116,0.30); text-decoration:none;}
  .chip.ns:hover{border-color:var(--gold);}

  .obadge{display:inline-block; font-size:11px; font-weight:700; border-radius:20px; padding:2px 10px; white-space:nowrap;}
  .obadge.계획{color:var(--dim); background:var(--surface); border:1px solid var(--border-strong);}
  .obadge.진행{color:var(--blue); background:rgba(122,196,240,0.12); border:1px solid rgba(122,196,240,0.38);}
  .obadge.완료{color:var(--green); background:rgba(106,191,123,0.12); border:1px solid rgba(106,191,123,0.38);}
  .obadge.이월{color:var(--gold); background:rgba(240,198,116,0.12); border:1px solid rgba(240,198,116,0.38);}

  /* ── metric 막대(목표치 셀 내) ── */
  .metric{margin-top:7px; padding:7px 9px; border:1px solid var(--border-strong); border-radius:8px; background:var(--surface);}
  .metric-h{display:block; font-size:9.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;}
  .metric-h .live{color:var(--green); text-transform:none; letter-spacing:0; font-weight:700;}
  .metric-h .manual{color:var(--gold); text-transform:none; letter-spacing:0; font-weight:700;}
  .mbar{height:7px; border-radius:5px; background:var(--paper); border:1px solid var(--border); overflow:hidden; margin:3px 0;}
  .mbar>i{display:block; height:100%; border-radius:5px; background:linear-gradient(90deg,var(--accent),var(--accent-soft));}
  .mbar.gold>i{background:linear-gradient(90deg,#b8860b,var(--gold));}
  .mbar.green>i{background:linear-gradient(90deg,#3f8f4f,var(--green));}
  .metric-meta{font-size:11.5px; color:var(--text-soft);}
  .metric-meta b{color:var(--text); font-weight:700;}
  .metric-meta .pct{color:var(--accent-soft); font-weight:700;}
  .metric-none{font-size:11px; color:var(--dim);}

  /* ── 편집 컨트롤 ── */
  .rpt select, .rpt input[type=number]{font-size:12px; color:var(--text); background:var(--surface); border:1px solid var(--border-strong); border-radius:6px; padding:3px 8px;}
  .mc-edit{margin-top:6px; font-size:11px; color:var(--dim);}
  .mc-edit input{width:88px;}
  .note-edit{font-size:11.5px; color:var(--text); background:var(--surface); border:1px dashed var(--accent); border-radius:7px; padding:5px 8px; min-height:52px; min-width:200px; white-space:pre-wrap; outline:none;}
  .note-edit:focus{border-color:var(--accent-soft); background:rgba(124,58,237,0.08);}

  /* ── 연간 매출·지출 대시 ── */
  table.rpt.fin{min-width:520px;}
  .fin td{font-size:13px;}
  .fin .fmo{color:var(--text); font-weight:700; white-space:nowrap;}
  .fin tr.cur-m td{background:rgba(124,58,237,0.12) !important;}
  .fin tr.cur-m .fmo{color:var(--accent-soft);}
  .fin .fin-none{color:var(--dim); font-size:12px;}
  .fin .fin-sub{display:block; font-size:10.5px; color:var(--dim); margin-top:2px;}
  .fin .fin-live-v{color:var(--green); font-weight:800;}
  .fin b{color:var(--text);}
  .fin b.pos{color:var(--green);} .fin b.neg{color:var(--rose);}
  .fin tr.fin-tot td{border-top:2px solid var(--border-strong); background:var(--surface); font-size:13.5px; font-weight:700;}
  .fin-in{width:118px !important; text-align:right;}
  .fin-live{font-size:10px; color:var(--green); margin-top:3px;}
  .fchart{display:flex; gap:5px; align-items:flex-end; margin-top:12px; padding:14px 12px 8px; background:var(--paper); border:1px solid var(--border); border-radius:12px; overflow-x:auto;}
  .fcol{flex:1; min-width:36px; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .fbars{display:flex; align-items:flex-end; gap:3px; height:104px; width:100%; justify-content:center; border-radius:5px; padding:0 2px;}
  .fbars>i{width:11px; border-radius:3px 3px 0 0; display:block;}
  .fbars .bs{background:linear-gradient(180deg,var(--accent-soft),var(--accent));}
  .fbars .be{background:linear-gradient(180deg,var(--gold),#b8860b);}
  .fcol .fmo{font-size:10.5px; color:var(--dim);}
  .fcol.cur-m .fmo{color:var(--accent-soft); font-weight:800;}
  .fcol.cur-m .fbars{background:rgba(124,58,237,0.08);}
  .flegend{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-top:10px; font-size:11px; color:var(--text-soft);}
  .flegend span{display:inline-flex; align-items:center; gap:5px;}
  .flegend i{width:12px; height:12px; border-radius:3px; display:inline-block;}
  .flegend .ls{background:var(--accent);} .flegend .le{background:var(--gold);}
  .flegend .fnote{color:var(--dim); font-size:10.5px;}

  /* ── 실무책임자 도달율 스코어보드 ── */
  .pscore{display:flex; flex-direction:column; gap:10px;}
  .prow{background:var(--paper); border:1px solid var(--border); border-left:3px solid var(--gold); border-radius:12px; padding:13px 16px; display:grid; grid-template-columns:230px 1fr 230px; gap:8px 18px; align-items:center;}
  .prow .pmeta{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .prow .pname{font-size:15px; font-weight:800; color:var(--text);}
  .prow .pgoal{font-size:12.5px; color:var(--text-soft); line-height:1.45;}
  .prow .pns{grid-column:1 / -1; font-size:11.5px; color:var(--gold); border-top:1px dashed var(--border); padding-top:7px; margin-top:2px;}
  .prow .pns.empty{color:var(--dim); font-style:italic;}

  .report-box{padding:13px 15px; border:1px dashed var(--border-strong); border-radius:11px; background:var(--surface); font-size:12px; color:var(--text-soft); line-height:1.55;}
  .report-box.done{border-style:solid; border-left:3px solid var(--green);}
  .report-box .rh{font-size:13px; font-weight:700; color:var(--text); margin-bottom:5px;}

  .board-status{padding:16px; font-size:12px; color:var(--dim); text-align:center;}
  footer.foot{margin-top:22px; font-size:10.5px; color:var(--dim); border-top:1px solid var(--border); padding-top:10px; line-height:1.55;}

  @media (max-width:720px){
    .prow{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    header.page-head h1{font-size:19px;}
  }
  @media print{
    @page{size:A4 portrait; margin:10mm;}
    body{background:#fff; color:#111; padding:0; font-size:10px;}
    .layers, .month-bar, .ebtn, header.page-head .back{display:none !important;}
    input, select, .note-edit, .fin-in, .pin-num{display:none !important;}
    header.page-head, .month-head, .rpt-wrap, .metric, .report-box, .fchart, .prow, table.rpt tr{break-inside:avoid;}
    .month-head, .rpt-wrap, table.rpt, .metric, .report-box, .fchart, .prow{background:#fff !important; color:#111 !important; border-color:#999 !important;}
    table.rpt thead th{background:#f2f2f2 !important; color:#333 !important; border-color:#999 !important;}
    table.rpt tbody td, table.rpt tbody tr:hover td, .fin tr.cur-m td{background:#fff !important; color:#222 !important; border-color:#bbb !important;}
    .fin tr.fin-tot td{background:#f2f2f2 !important;}
    .r-title, .month-head .mtitle, .month-head .mtheme, .metric-meta, .metric-meta b, h2.sec, .pname, .fmo, .fin b, .prog .pnum{color:#111 !important;}
    .r-note, .metric-h, .pgoal, .fin-sub{color:#333 !important;}
    .prog .track, .mbar{background:#eee !important; border-color:#999 !important;}
    .prog .track>i{background:#555 !important;}
    .mbar>i{background:#666 !important;}
    .fbars .bs{background:#555 !important;} .fbars .be{background:#999 !important;}
    .fcol.cur-m .fbars{background:#eee !important;}
    .chip{color:#000 !important; background:#fff !important; border-color:#666 !important;}
    .obadge, .mstat{color:#000 !important; background:#f2f2f2 !important; border-color:#666 !important;}
    body.chair-mode .print-head{display:block !important; text-align:center; margin:0 0 12px; padding-bottom:8px; border-bottom:1.5px solid #999;}
    body.chair-mode .print-head .ph-title{font-size:15px; font-weight:800; color:#111 !important;}
    body.chair-mode .print-head .ph-sub{font-size:11px; color:#444 !important; margin-top:3px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <h1>📅 월간 운영 계획·보고</h1>
    <a class="back" href="#" onclick="window.print();return false;">🖨️ 인쇄</a>
  </header>

  <!-- 3층 구조: 북극성 → 월간 → 오늘 -->
  <div class="layers">
    <a href="헌법한장.html">🌟 북극성 (헌법)</a>
    <span class="arw">›</span>
    <span class="cur">📅 월간 운영</span>
    <span class="arw">›</span>
    <a href="wellperion_guide(main).html">🧭 오늘의 항로 (G1)</a>
  </div>

  <!-- 월 선택 + 편집 -->
  <div class="month-bar">
    <label for="month-sel">월 선택</label>
    <select id="month-sel"></select>
    <button class="ebtn chair" id="chair-toggle" onclick="window._toggleChair()" title="C-Level 표기를 공식 직함으로 전환(경영진 제출용)">👔 경영진 보고</button>
    <span id="edit-wrap"></span>
    <span id="save-flag" style="font-size:11px;color:var(--dim);"></span>
  </div>

  <!-- 경영진 보고 인쇄 배너(화면 숨김·인쇄+경영진 보고 모드에서만 표시) -->
  <div class="print-head" id="print-head"></div>

  <!-- 월 헤더 -->
  <div class="month-head" id="month-head" style="display:none;"></div>

  <!-- 💰 연간 매출·지출 대시 (지속 관리·월 선택 무관) -->
  <h2 class="sec">💰 2026 연간 매출·지출 <span class="stag">매출 − 지출 = 순액 · 당월 매출 라이브</span></h2>
  <div id="fin-board"><div class="board-status">연간 재무 정본을 불러오는 중…</div></div>

  <!-- 📋 이달 계획 -->
  <h2 class="sec">📋 이달 계획 <span class="stag">목표 · 담당 · 상태 · 도달율 · 진행</span></h2>
  <div id="obj-board"><div class="board-status">월간 계획 정본을 불러오는 중…</div></div>

  <!-- 👤 실무책임자 도달율 -->
  <h2 class="sec" id="prac-sec" style="display:none;">👤 실무책임자 도달율 <span class="stag">GM 직속 3라인</span></h2>
  <div id="prac-board" style="display:none;"></div>

  <!-- 📊 월말 결과 보고 -->
  <h2 class="sec">📊 월말 결과 보고</h2>
  <div id="report-area"></div>

  <footer class="foot">
    정본 = <code>status/monthly_ops_plan.json</code> · 편집 저장 = GM/담당 PIN.
  </footer>

</div>

<script>
(function(){
  // ── 설정: 라이브 URL(헌법한장.html 동일 GAS·raw 폴백 패턴) ──
  var GAS_URL  = 'https://script.google.com/macros/s/AKfycbxDwFkrxK1YIaEoSNcuw2MiHiZQ-7o5N6311ytksSyeEd86ZFOhLknOWqQgNArQvZ-7/exec';
  var RAW_BASE = 'https://raw.githubusercontent.com/wellperion-cao/wellperion-automation/master/';
  var PLAN_PATH = 'status/monthly_ops_plan.json';
  var FIN_YEAR = '2026';

  var _data = null;      // monthly_ops_plan.json 전체(정본 모델)
  var _sel = null;       // 선택 월 키
  var _homeSales = undefined; // home_kpi sales.month (라이브) — undefined=미조회, null=미측정
  var _editMode = false;

  // ── 경영진 보고 모드: C-Level 표기를 닉네임 → 공식 직함으로 전환(화면 전환만·정본 무변경) ──
  var TITLE_MAP = {ceo:"AI CEO", cmo:"AI CMO", coo:"AI COO", cto:"AI CTO", cpo:"AI CPO", cfo:"AI CFO", chro:"AI CHRO", gm:"대표(GM)"};
  var _chairMode = false;
  try{ _chairMode = (localStorage.getItem('wp_mops_chair') === '1'); }catch(e){}

  var esc = function(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  };
  var nickOf = function(role){
    if(_chairMode && TITLE_MAP[role]) return TITLE_MAP[role];
    return (_data && _data.owner_nick && _data.owner_nick[role]) || role || '';
  };

  // 원 단위 사람친화 포맷: 6.5억 / 2,434만
  function fmtWon(n){
    if(typeof n !== 'number' || isNaN(n)) return '—';
    if(n >= 100000000){ var eok = Math.round(n / 100000000 * 100) / 100; return eok + '억'; }
    if(n >= 10000){ return Math.round(n / 10000).toLocaleString() + '만'; }
    return n.toLocaleString() + '원';
  }
  function clampPct(v){ v = Number(v); if(isNaN(v)) return 0; return Math.max(0, Math.min(100, Math.round(v))); }
  function pad2(n){ return ('0' + n).slice(-2); }

  // ── 읽기: GAS read_file(최신·캐시없음) → raw GitHub 폴백 ──
  function readPlan(){
    return fetch(GAS_URL, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'read_file', path:PLAN_PATH})})
      .then(function(r){ return r.json(); })
      .then(function(res){ if(res && res.ok && res.content){ return JSON.parse(res.content); } throw new Error((res && res.error) || 'read 실패'); })
      .catch(function(){ return fetch(RAW_BASE + PLAN_PATH + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }); });
  }
  // ── 라이브 매출: home_kpi → sales.month(당월 실측). 실패/미측정=null ──
  function readHomeSales(){
    return fetch(GAS_URL + '?action=home_kpi', {method:'GET', redirect:'follow'})
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.ok && res.sales && typeof res.sales.month === 'number') return res.sales.month;
        return null;
      })
      .catch(function(){ return null; });
  }

  // ── 월 선택 드롭다운 ──
  function buildMonthSelect(){
    var sel = document.getElementById('month-sel');
    var keys = Object.keys((_data && _data.months) || {}).sort();
    if(!keys.length){ sel.innerHTML = '<option>—</option>'; return; }
    if(!_sel || keys.indexOf(_sel) < 0){
      var running = keys.filter(function(k){ return _data.months[k].month_status === '진행'; });
      _sel = running.length ? running[running.length-1] : keys[keys.length-1];
    }
    sel.innerHTML = keys.map(function(k){
      var ms = _data.months[k].month_status || '';
      return '<option value="' + esc(k) + '"' + (k === _sel ? ' selected' : '') + '>' + esc(k) + ' · ' + esc(ms) + '</option>';
    }).join('');
    sel.onchange = function(){ _sel = sel.value; _editMode = false; render(); };
  }

  // ── 월 헤더 ──
  function renderMonthHead(){
    var mh = document.getElementById('month-head');
    var m = _data.months[_sel];
    if(!m){ mh.style.display = 'none'; return; }
    mh.style.display = 'flex';
    var ms = m.month_status || '';
    mh.innerHTML =
      '<span class="mtitle">' + esc(_sel) + '</span>' +
      '<span class="mstat ' + esc(ms) + '">' + esc(ms) + '</span>' +
      '<span class="mtheme">' + esc(m.theme || '') + '</span>';
  }

  // ── 도달율 진행 막대(공통) ──
  function progClass(status, v){
    if(status === '완료' || v >= 100) return 'done';
    if(status === '이월') return 'carry';
    if(status === '계획' || !v) return 'plan';
    return 'prog';
  }
  function progBar(val, status, editable, editAttrs, big){
    var v = clampPct(typeof val === 'number' ? val : (val == null ? 0 : val));
    var cls = progClass(status, v);
    var track = '<div class="track ' + cls + '"><i style="width:' + v + '%"></i></div>';
    var right = editable
      ? '<input class="pin-num" type="number" min="0" max="100" ' + editAttrs + ' value="' + v + '" oninput="window._pv(this)">'
      : '<span class="pnum">' + v + '%</span>';
    return '<div class="prog' + (big ? ' big' : '') + '">' + track + right + '</div>';
  }
  // 편집 중 막대 미리보기
  window._pv = function(el){
    var v = clampPct(el.value);
    var box = el.parentNode;
    var i = box.querySelector('.track > i');
    if(i) i.style.width = v + '%';
  };

  // ── 측정 목표 막대(metric) ──
  function metricBlock(o){
    var mt = o.metric;
    if(!mt) return '';
    var isSales = (mt.unit === '원') && /매출/.test(mt.name || '');
    if(isSales){
      var tgt = mt.target || 0;
      var cur = _homeSales;
      var lab = '<span class="metric-h"><span class="live">● 라이브</span> ' + esc(mt.name || '매출') + ' · home_kpi 당월 실측</span>';
      if(typeof cur === 'number' && tgt){
        var pct = Math.max(0, Math.round(cur / tgt * 100));
        var w = Math.max(0, Math.min(100, pct));
        return '<div class="metric">' + lab +
          '<div class="mbar green"><i style="width:' + w + '%"></i></div>' +
          '<div class="metric-meta">현재 <b>' + fmtWon(cur) + '</b> / 목표 <b>' + fmtWon(tgt) + '</b> · <span class="pct">' + pct + '%</span></div>' +
        '</div>';
      }
      return '<div class="metric">' + lab +
        '<div class="metric-none">목표 <b style="color:var(--text)">' + fmtWon(tgt) + '</b> · 당월 실측 대기(가짜값 없음)</div>' +
      '</div>';
    }
    var tg = mt.target || 0;
    var cr = mt.current;
    var unit = mt.unit || '';
    var lab2 = '<span class="metric-h"><span class="manual">✍ 수동</span> ' + esc(mt.name || '') + '</span>';
    if(typeof cr === 'number' && tg){
      var p = Math.max(0, Math.round(cr / tg * 100));
      var w2 = Math.max(0, Math.min(100, p));
      return '<div class="metric">' + lab2 +
        '<div class="mbar gold"><i style="width:' + w2 + '%"></i></div>' +
        '<div class="metric-meta">현재 <b>' + esc(cr) + unit + '</b> / 목표 <b>' + esc(tg) + unit + '</b> · <span class="pct">' + p + '%</span></div>' +
      '</div>';
    }
    return '<div class="metric">' + lab2 +
      '<div class="metric-none">목표 <b style="color:var(--text)">' + esc(tg) + unit + '</b> · 현재 <b style="color:var(--gold)">미입력</b></div>' +
    '</div>';
  }

  // ── 목표 = 표의 행(보고서형) ──
  function objRow(o){
    var ns = o.northstar ? '<a class="chip ns" href="헌법한장.html" title="북극성(헌법)">🌟</a>' : '';
    var titleCell = '<div class="r-title">' + esc(o.title) + ns + '</div>' + metricBlock(o);

    var ownCell = '<span class="chip own">' + esc(nickOf(o.owner)) + '</span>' +
      '<div class="r-dept">' + esc(o.dept || '') + '</div>';

    var targetCell = o.target ? esc(o.target) : '—';
    if(_editMode && o.metric && !((o.metric.unit === '원') && /매출/.test(o.metric.name || ''))){
      var cv = (typeof o.metric.current === 'number') ? o.metric.current : '';
      targetCell += '<div class="mc-edit">✍ <input type="number" data-id="' + esc(o.id) + '" data-f="current" value="' + esc(cv) + '" placeholder="미입력"> ' + esc(o.metric.unit || '') + '</div>';
    }

    var statusCell;
    if(_editMode){
      var opts = ((_data && _data.status_enum) || ['계획','진행','완료','이월']).map(function(s){
        return '<option value="' + esc(s) + '"' + (o.status === s ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('');
      statusCell = '<select data-id="' + esc(o.id) + '" data-f="status">' + opts + '</select>';
    } else {
      statusCell = '<span class="obadge ' + esc(o.status || '') + '">' + esc(o.status || '') + '</span>';
    }

    var progCell = progBar(o.progress, o.status, _editMode, 'data-id="' + esc(o.id) + '" data-f="progress"', false);

    var noteCell;
    if(_editMode){
      noteCell = '<div class="note-edit" contenteditable="true" data-id="' + esc(o.id) + '" data-f="progress_note" ' +
        'oncompositionstart="window._compOn()" oncompositionend="window._compOff()">' + esc(o.progress_note || '') + '</div>';
    } else {
      noteCell = o.progress_note ? '<div class="r-note">' + esc(o.progress_note) + '</div>' : '<span class="fin-none">—</span>';
    }

    return '<tr>' +
      '<td class="c-title">' + titleCell + '</td>' +
      '<td class="c-own">' + ownCell + '</td>' +
      '<td>' + targetCell + '</td>' +
      '<td>' + statusCell + '</td>' +
      '<td class="c-prog">' + progCell + '</td>' +
      '<td class="c-note">' + noteCell + '</td>' +
    '</tr>';
  }

  function renderBoard(){
    var board = document.getElementById('obj-board');
    var m = _data.months[_sel];
    var objs = (m && m.objectives) || [];
    if(!objs.length){ board.innerHTML = '<div class="board-status">이 달의 목표가 없습니다.</div>'; return; }
    board.innerHTML =
      '<div class="rpt-wrap"><table class="rpt"><thead><tr>' +
        '<th>목표</th><th>담당</th><th>목표치</th><th>상태</th><th>도달율</th><th>진행 메모</th>' +
      '</tr></thead><tbody>' + objs.map(objRow).join('') + '</tbody></table></div>';

  // ── 연간 매출·지출 대시 ──
  function renderFinance(){
    var host = document.getElementById('fin-board');
    var fy = _data.finance && _data.finance[FIN_YEAR];
    if(!fy){ host.innerHTML = '<div class="board-status">연간 재무 정본(finance)이 없습니다.</div>'; return; }
    var now = new Date();
    var curM = (now.getFullYear() === Number(FIN_YEAR)) ? pad2(now.getMonth() + 1) : null;
    var months = ['01','02','03','04','05','06','07','08','09','10','11','12'];

    var rows = months.map(function(mm){
      var f = fy[mm] || {sales:null, expense:null};
      var stored = (typeof f.sales === 'number') ? f.sales : null;
      var live = (mm === curM && typeof _homeSales === 'number') ? _homeSales : null;
      var effSales = (stored != null) ? stored : (live != null ? live : null);
      var exp = (typeof f.expense === 'number') ? f.expense : null;
      var net = (effSales != null && exp != null) ? (effSales - exp) : null;
      return {mm:mm, stored:stored, live:live, effSales:effSales, exp:exp, net:net};
    });

    var maxV = 1, sumS = 0, sumE = 0, cntS = 0, cntE = 0;
    rows.forEach(function(r){
      if(r.effSales != null){ maxV = Math.max(maxV, r.effSales); sumS += r.effSales; cntS++; }
      if(r.exp != null){ maxV = Math.max(maxV, r.exp); sumE += r.exp; cntE++; }
    });
    var sumNet = (cntS || cntE) ? (sumS - sumE) : null;

    var trs = rows.map(function(r){
      var cur = (r.mm === curM) ? ' class="cur-m"' : '';
      var salesCell;
      if(_editMode){
        salesCell = '<input class="fin-in" type="number" data-fin-m="' + r.mm + '" data-fin-f="sales" value="' + (r.stored != null ? r.stored : '') + '" placeholder="미입력">' +
          (r.live != null ? '<div class="fin-live">● 라이브 ' + fmtWon(r.live) + '</div>' : '');
      } else if(r.live != null){
        salesCell = '<span class="fin-live-v">● ' + fmtWon(r.live) + '</span>' +
          (r.stored != null ? '<span class="fin-sub">편집 ' + fmtWon(r.stored) + '</span>' : '<span class="fin-sub">당월 라이브</span>');
      } else if(r.stored != null){
        salesCell = '<b>' + fmtWon(r.stored) + '</b>';
      } else {
        salesCell = '<span class="fin-none">미입력</span>';
      }
      var expCell = _editMode
        ? '<input class="fin-in" type="number" data-fin-m="' + r.mm + '" data-fin-f="expense" value="' + (r.exp != null ? r.exp : '') + '" placeholder="미입력">'
        : (r.exp != null ? ('<b>' + fmtWon(r.exp) + '</b>') : '<span class="fin-none">미입력</span>');
      var netCell = (r.net != null)
        ? ('<b class="' + (r.net >= 0 ? 'pos' : 'neg') + '">' + fmtWon(r.net) + '</b>')
        : '<span class="fin-none">—</span>';
      return '<tr' + cur + '><td class="fmo">' + r.mm + '월</td><td>' + salesCell + '</td><td>' + expCell + '</td><td>' + netCell + '</td></tr>';
    }).join('');

    var totRow = '<tr class="fin-tot"><td>누계</td>' +
      '<td><b>' + fmtWon(sumS) + '</b><span class="fin-sub">평균 ' + (cntS ? fmtWon(Math.round(sumS / cntS)) : '—') + '</span></td>' +
      '<td><b>' + fmtWon(sumE) + '</b><span class="fin-sub">평균 ' + (cntE ? fmtWon(Math.round(sumE / cntE)) : '—') + '</span></td>' +
      '<td>' + (sumNet != null ? ('<b class="' + (sumNet >= 0 ? 'pos' : 'neg') + '">' + fmtWon(sumNet) + '</b>') : '—') + '</td></tr>';

    var table = '<div class="rpt-wrap"><table class="rpt fin"><thead><tr>' +
      '<th>월</th><th>매출</th><th>지출</th><th>순액</th>' +
      '</tr></thead><tbody>' + trs + totRow + '</tbody></table></div>';

    var chart = '<div class="fchart">' + rows.map(function(r){
      var hs = r.effSales ? Math.max(3, Math.round(r.effSales / maxV * 100)) : 0;
      var he = r.exp ? Math.max(3, Math.round(r.exp / maxV * 100)) : 0;
      return '<div class="fcol' + (r.mm === curM ? ' cur-m' : '') + '"><div class="fbars">' +
        '<i class="bs" style="height:' + hs + '%" title="매출 ' + (r.effSales ? fmtWon(r.effSales) : '미입력') + '"></i>' +
        '<i class="be" style="height:' + he + '%" title="지출 ' + (r.exp ? fmtWon(r.exp) : '미입력') + '"></i>' +
        '</div><span class="fmo">' + r.mm + '</span></div>';
    }).join('') + '</div>';

    var legend = '<div class="flegend">' +
      '<span><i class="ls"></i>매출</span><span><i class="le"></i>지출</span>' +
      '<span class="fnote">● 당월=home_kpi 라이브 실측 · 나머지=편집값 · 미입력=측정 전(가짜값 없음)</span>' +
    '</div>';

    host.innerHTML = table + legend + chart;
  }

  // ── 실무책임자 도달율 스코어보드 ──
  function pracRow(p, goal, prog){
    var nsHtml = (p.northstar && String(p.northstar).trim())
      ? '<div class="pns">🌟 ' + esc(p.northstar) + '</div>'
      : '<div class="pns empty">🌟 미입력 — 예정 (각자 확인)</div>';
    var bar = progBar(prog, null, _editMode, 'data-pid="' + esc(p.id) + '" data-f="pprogress"', true);
    return '<div class="prow">' +
      '<div class="pmeta"><span class="pname">' + esc(p.name) + '</span>' +
        '<span class="chip dept">' + esc(p.dept || '') + '</span>' +
        '<span class="chip own">' + esc(p.role || '') + '</span></div>' +
      '<div class="pgoal">' + (goal ? esc(goal) : '<span style="color:var(--dim)">—</span>') + '</div>' +
      '<div class="pbarwrap">' + bar + '</div>' +
      nsHtml +
    '</div>';
  }

  function renderPractitioners(){
    var sec = document.getElementById('prac-sec');
    var board = document.getElementById('prac-board');
    var roster = (_data && _data.practitioners) || [];
    var m = _data.months[_sel];
    var goals = (m && m.practitioner_goals) || null;
    if(!roster.length || !goals){
      sec.style.display = 'none'; board.style.display = 'none'; board.innerHTML = '';
      return;
    }
    var progMap = (m && m.practitioner_progress) || {};
    sec.style.display = ''; board.style.display = '';
    board.innerHTML = '<div class="pscore">' + roster.map(function(p){
      var pr = (typeof progMap[p.id] === 'number') ? progMap[p.id] : 50;
      return pracRow(p, goals[p.id], pr);
    }).join('') + '</div>';
  }

  // ── 월말 보고 영역 ──
  function renderReport(){
    var el = document.getElementById('report-area');
    var m = _data.months[_sel];
    if(!m){ el.innerHTML = ''; return; }
    if(m.month_status === '완료'){
      var done = (m.objectives || []).filter(function(o){ return o.status === '완료'; }).length;
      var tot = (m.objectives || []).length;

        '<div class="rh">✅ ' + esc(_sel) + ' 마감 — 목표 ' + done + '/' + tot + ' 완료</div>' +
        '테마: ' + esc(m.theme || '') + '. 목표별 최종 상태·도달율은 위 표 참조.' +
      '</div>';
    } else {
      el.innerHTML = '<div class="report-box">' +
        '<div class="rh">🗓️ ' + esc(_sel) + ' 진행 중 — 월말 보고 대기</div>' +
        '이 달이 <b>완료</b>로 마감되면 목표 달성 요약(완료 N/전체 · 도달율)이 여기 표시됩니다.' +
      '</div>';
    }
  }

  // ── 편집 버튼 ──
  function renderEditBtn(){
    var w = document.getElementById('edit-wrap');
    if(_editMode){
      w.innerHTML = '<button class="ebtn save" id="save-btn" onclick="window._planSave()">저장</button>' +
                    '<button class="ebtn cancel" onclick="window._planCancel()">취소</button>';

  // ── 경영진 보고 토글(화면 전환만·정본 무변경) ──

  window._planEdit = function(){ _editMode = true; render(); };

    _editMode = false;
    readPlan().then(function(d){ _data = d; render(); });
  };

  // 편집 DOM → _data 모델 반영
  function gatherEdits(){
    var m = _data.months[_sel];
    if(!m) return;

    // 목표(상태·metric.current·도달율·진행메모)
    var byId = {};
    (m.objectives || []).forEach(function(o){ byId[o.id] = o; });
    Array.prototype.forEach.call(document.querySelectorAll('#obj-board [data-f]'), function(el){
      var id = el.getAttribute('data-id'), f = el.getAttribute('data-f');
      var o = byId[id]; if(!o) return;
      if(f === 'status'){ o.status = el.value; }
      else if(f === 'current'){
        if(!o.metric) return;
        var v = el.value.trim();
        o.metric.current = (v === '') ? null : Number(v);
      }
      else if(f === 'progress'){ o.progress = clampPct(el.value); }
      else if(f === 'progress_note'){ o.progress_note = (el.innerText || el.textContent || '').trim(); }
    });

    // 실무책임자 도달율
    if(!m.practitioner_progress) m.practitioner_progress = {};
    Array.prototype.forEach.call(document.querySelectorAll('#prac-board [data-f="pprogress"]'), function(el){
      var pid = el.getAttribute('data-pid'); if(!pid) return;
      m.practitioner_progress[pid] = clampPct(el.value);
    });

    // 연간 매출·지출
    var fy = _data.finance && _data.finance[FIN_YEAR];
    if(fy){
      Array.prototype.forEach.call(document.querySelectorAll('#fin-board [data-fin-m]'), function(el){
        var mm = el.getAttribute('data-fin-m'), fld = el.getAttribute('data-fin-f');
        if(!fy[mm]) fy[mm] = {sales:null, expense:null};
        var v = el.value.trim();
        fy[mm][fld] = (v === '') ? null : Number(v);
      });
    }
  }

  window._planSave = function(){
    var pin = prompt('편집 저장 — GM/담당 비밀번호를 입력하세요:');
    if(pin === null || pin === '') return;
    if(!_data) return;
    gatherEdits();
    _data.updated_at = new Date().toISOString().slice(0,10);
    var content = JSON.stringify(_data, null, 2);
    var btn = document.getElementById('save-btn');
    if(btn){ btn.textContent = '저장 중…'; btn.disabled = true; }
    fetch(GAS_URL, {
      method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action:'commit_file', path:PLAN_PATH, content:content,
        message:'[월간운영] ' + _sel + ' 상태·도달율·재무 편집 ' + _data.updated_at, key:pin
      })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.ok){
          alert('저장 완료. (커밋: ' + ((res.commit||'') + '').slice(0,7) + ')');
          _editMode = false; render();
        } else {
          alert('저장 실패: ' + ((res && res.error) || '알 수 없는 오류'));
          if(btn){ btn.textContent = '저장'; btn.disabled = false; }
        }
      })
      .catch(function(e){
        alert('저장 오류: ' + e.message);
        if(btn){ btn.textContent = '저장'; btn.disabled = false; }
      });
  };

  // ── 부팅 ──
  Promise.all([ readPlan(), readHomeSales() ])
    .then(function(arr){
      _data = arr[0];
      _homeSales = arr[1];
      buildMonthSelect();
      render();
    })
    .catch(function(e){
      document.getElementById('obj-board').innerHTML =
        '<div class="board-status">월간 계획 정본을 불러오지 못했습니다 (' + esc(e.message) +
        '). 정본: <code>status/monthly_ops_plan.json</code></div>';
    });
})();
</script>
</body>
</html>
