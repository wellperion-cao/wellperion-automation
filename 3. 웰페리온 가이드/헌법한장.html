<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏛️ 웰페리온 전사 운영 헌법 — 한 장</title>
<link rel="icon" type="image/x-icon" href="welly_favicon.ico">
<style>
  :root{
    --bg:#221F20; --paper:#2a2725; --surface:#1a1817;
    --text:#f5f2ef; --text-soft:#d4d0cc; --dim:#8c8b83;
    --accent:#7C3AED; --accent-soft:#a875f5;
    --border:#3d3835; --border-strong:#4d4845;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color:var(--text); background:var(--bg); line-height:1.5; font-size:13px; -webkit-font-smoothing:antialiased; padding:18px 18px 32px;}
  .wrap{max-width:1340px; margin:0 auto;}

  header.page-head{margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid var(--border-strong); display:flex; flex-wrap:wrap; align-items:baseline; gap:10px 16px;}
  header.page-head h1{font-size:22px; font-weight:800; letter-spacing:-0.02em;}
  header.page-head .sub{font-size:12px; color:var(--dim); line-height:1.45; flex:1; min-width:240px;}
  header.page-head .back{font-size:12px; color:var(--accent-soft); text-decoration:none; border:1px solid var(--border-strong); border-radius:7px; padding:4px 11px; white-space:nowrap;}
  header.page-head .back:hover{background:var(--surface);}

  h2.sec{font-size:15px; font-weight:700; margin:16px 0 2px; display:flex; align-items:center; gap:7px;}
  .sec-note{font-size:11px; color:var(--dim); margin-bottom:8px;}

  /* ── 매트릭스 ── */
  .matrix-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:11px; background:var(--paper);}
  table.matrix{border-collapse:collapse; width:100%; min-width:1040px; font-size:13px; table-layout:fixed;}
  table.matrix th, table.matrix td{border:1px solid var(--border); padding:7px 9px; text-align:left; vertical-align:top; line-height:1.42; white-space:pre-wrap; word-break:break-word;}
  table.matrix thead th{background:var(--surface); font-weight:700; font-size:12px; position:sticky; top:0; z-index:2;}
  table.matrix thead th.grp-np{color:#f0c674;}
  table.matrix thead th.grp-boot{color:#7ac4f0;}
  table.matrix thead th.grp-guard{color:#6abf7b;}
  table.matrix thead th.grp-collab{color:var(--accent-soft);}
  table.matrix th.role-col{width:95px; min-width:90px;}
  td.role-cell{background:var(--surface);}
  td.role-cell .ricon{font-size:16px;}
  td.role-cell .rname{font-weight:800; font-size:14px;}
  td.role-cell .rtitle{font-size:11px; color:var(--dim); margin-top:1px;}
  td.role-cell .rowner{font-size:11px; color:var(--accent-soft); margin-top:2px;}
  .rdraft{font-size:9px;color:#e0a;background:rgba(238,0,170,0.12);border-radius:3px;padding:1px 4px;font-weight:600;vertical-align:middle;margin-left:4px;}
  tr.role-gm td{background:rgba(184,134,11,0.10);}
  tr.role-gm td.role-cell{background:rgba(184,134,11,0.18);}
  .dim-label{font-size:10.5px; font-weight:700; letter-spacing:0.02em; color:var(--dim); display:block; margin-bottom:1px; text-transform:uppercase;}
  .dim-val{display:block; margin-bottom:8px; white-space:pre-wrap;}
  .dim-val:last-child{margin-bottom:0;}
  .dim-bul{list-style:none; margin:3px 0 0 0; padding:0;}
  .dim-bul li{font-size:12.5px; line-height:1.45; margin-bottom:3px;}
  .dim-empty{list-style:none; color:var(--dim); margin-left:0;}
  .col-own{width:170px;}
  .own-chip{display:inline-block; font-size:11px; color:var(--accent-soft); text-decoration:none; border:1px solid var(--border-strong); border-radius:6px; padding:2px 8px; margin:0 4px 4px 0;}
  .own-chip:hover{background:var(--surface); border-color:var(--accent);}
  .matrix-status{padding:14px; font-size:12px; color:var(--dim);}
  /* ── 살아있는 지휘판: KPI 실측 막대 · 진행현황 · 오늘 추천 (2026-06-29) ── */
  .kmeas{margin:4px 0 8px;}
  .kmeas-h{display:block; font-size:9px; color:var(--dim); text-transform:none; letter-spacing:0; margin-bottom:2px;}
  .kbar{height:6px; border-radius:4px; background:var(--surface); border:1px solid var(--border); overflow:hidden; margin-bottom:2px;}
  .kbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-soft)); border-radius:4px;}
  .kbar.alt>i{background:linear-gradient(90deg,#3f8f4f,#6abf7b);}
  .kmeta{font-size:11px; color:var(--text-soft); margin-bottom:4px;}
  .kmeta b{color:var(--text);}
  .pstat{font-size:12px; color:var(--text-soft); margin-bottom:8px;}
  .pstat b{color:var(--accent-soft);}
  .todaychip{display:inline-block; font-size:11.5px; color:#f0c674; background:rgba(240,198,116,0.10); border:1px solid rgba(240,198,116,0.35); border-radius:7px; padding:3px 9px; margin-bottom:4px; line-height:1.35; white-space:normal;}
  /* ── 🌟 북극성 도달율 (궁극 목표 · 전면 · 골드) vs 작업 처리율 (보조 · 강등) — 2026-06-30 ── */
  .nsreach{margin:5px 0 9px; padding:6px 8px; border:1px solid rgba(240,198,116,0.30); border-left:3px solid #f0c674; border-radius:8px; background:rgba(240,198,116,0.06);}
  .nsreach-h{display:block; font-size:10.5px; font-weight:800; color:#f0c674; letter-spacing:0.01em; text-transform:none; margin-bottom:4px;}
  .nsreach-note{font-size:9.5px; color:var(--dim); font-weight:400;}
  .kbar.gold{height:9px; border-color:rgba(240,198,116,0.45);}
  .kbar.gold>i{background:linear-gradient(90deg,#b8860b,#f0c674);}
  .nsreach-meta{font-size:13px; color:#f0c674; font-weight:700; margin-top:2px;}
  .nsreach-meta b{color:#ffd97a; font-size:14px;}
  .nsreach-build{font-size:11.5px; color:var(--text-soft); font-weight:600;}
  /* 작업 처리율 — 보조 지표(활동량) · 강등(작게·dim·중립색) */
  .workrate{margin:2px 0 8px; opacity:0.8;}
  .workrate-h{display:block; font-size:9px; color:var(--dim); text-transform:none; letter-spacing:0; margin-bottom:2px;}
  .kbar.neutral{height:4px;}
  .kbar.neutral>i{background:var(--dim);}
  .workrate-meta{font-size:10.5px; color:var(--dim);}
  .workrate-meta b{color:var(--text-soft);}
  /* ── 편집 모드 ── */
  .ebtn{font-size:11px; padding:3px 11px; border-radius:7px; cursor:pointer; margin-left:6px;}
  .ebtn.edit{background:var(--surface); color:var(--accent-soft); border:1px solid var(--accent);}
  .ebtn.save{background:var(--accent); color:#fff; border:none;}
  .ebtn.cancel{background:var(--surface); color:var(--dim); border:1px solid var(--border-strong);}
  .cell-edit{outline:2px dashed var(--accent); outline-offset:-3px; background:rgba(124,58,237,0.06); cursor:text; white-space:pre-wrap;}
  .cell-edit:focus{outline-color:var(--accent-soft); background:rgba(124,58,237,0.12);}
  /* 열 너비 드래그 조정 핸들 — 편집 모드에서만 노출 */
  .col-resizer{position:absolute; top:0; right:0; width:8px; height:100%; cursor:col-resize; display:none; z-index:5; user-select:none;}
  table.matrix.editing .col-resizer{display:block;}
  table.matrix.editing .col-resizer:hover{background:var(--accent-soft);}

  /* ── 공통 4섹션 카드 ── */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; margin-top:4px;}
  .ccard{background:var(--paper); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:10px; padding:11px 13px;}
  .ccard h3{font-size:13px; font-weight:700; margin-bottom:2px;}
  .ccard .desc{font-size:11px; color:var(--dim); margin-bottom:8px; line-height:1.4;}
  .ccard a.lk{display:inline-block; font-size:11.5px; color:var(--accent-soft); text-decoration:none; border:1px solid var(--border-strong); border-radius:6px; padding:3px 9px; margin:0 5px 5px 0;}
  .ccard a.lk:hover{background:var(--surface); border-color:var(--accent);}

  .dedupe{margin-top:11px; font-size:11px; color:var(--dim); background:var(--surface); border:1px dashed var(--border-strong); border-radius:9px; padding:9px 13px;}
  footer.foot{margin-top:16px; font-size:10.5px; color:var(--dim); border-top:1px solid var(--border); padding-top:10px; line-height:1.55;}

  @media print{
    @page{size:A3 portrait; margin:8mm;}
    body{background:#fff; color:#111; padding:0; font-size:9px;}
    header.page-head{margin-bottom:8px; padding-bottom:6px;}
    header.page-head h1{font-size:16px;}
    h2.sec{margin:9px 0 2px; font-size:12px;}
    table.matrix{min-width:0; font-size:8px;}
    table.matrix th, table.matrix td{padding:3px 4px;}
    .matrix-scroll, table.matrix tr, .ccard{break-inside:avoid;}
    .cards{grid-template-columns:repeat(2,1fr); gap:6px;}
    header.page-head .back, .ccard a.lk, .ebtn{display:none;}
    .ccard a.lk{display:none;}
    /* 인쇄 색상 강제 라이트 — 다크배경/밝은글자 충돌(보호색) 방지 */
    table.matrix, table.matrix tr, table.matrix th, table.matrix td{background:#fff !important; color:#111 !important; border-color:#999 !important;}
    table.matrix thead th{background:#ececec !important; color:#000 !important;}
    td.role-cell{background:#f4f4f4 !important;}
    tr.role-gm td, tr.role-gm td.role-cell{background:#f8f2dc !important;}
    td.role-cell .rname, td.role-cell .rtitle, td.role-cell .rowner, .dim-label, .dim-val{color:#111 !important;}
    .dim-bul li{color:#111 !important;}
    .own-chip{color:#000 !important; border-color:#666 !important; background:#fff !important;}
    .matrix-scroll{background:#fff !important; border-color:#999 !important;}
    .ccard, .ccard h3, .ccard .desc{background:#fff !important; color:#111 !important; border-color:#999 !important;}
    h2.sec, header.page-head h1{color:#111 !important;}
    /* 신규 지휘판 요소도 인쇄 시 라이트색·검정글자 강제 */
    .kbar{background:#eee !important; border-color:#999 !important;}
    .kbar>i, .kbar.alt>i, .kbar.gold>i, .kbar.neutral>i{background:#666 !important;}
    .kmeas-h, .kmeta, .kmeta b, .pstat, .pstat b{color:#111 !important;}
    .todaychip{color:#111 !important; background:#f8f2dc !important; border-color:#999 !important;}
    .nsreach{background:#f8f2dc !important; border-color:#caa84a !important;}
    .nsreach-h, .nsreach-meta, .nsreach-meta b, .nsreach-note, .nsreach-build, .workrate-h, .workrate-meta, .workrate-meta b{color:#111 !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <h1>🏛️ 웰페리온 전사 운영 헌법 — 한 장</h1>
    <a class="back" href="wellperion_guide(main).html#S2">← 웰페리온 ERP 운영 가이드(S2)로</a>
    <a class="back" href="#" onclick="window.print();return false;">🖨️ 인쇄</a>
  </header>

  <!-- ════ A. 8주체 × 3칸 매트릭스 (편집형 · 2026-06-29) ════ -->
  <h2 class="sec">🧭 8주체 × 3칸 매트릭스 <span id="matrix-edit-wrap" style="font-size:11px;font-weight:400;"></span></h2>
  <div class="sec-note">핵심 3칸만 표시. 재발방지·결재선·소유침범·보고협업 4개 차원은 S2 본인탭 참조. 📊 KPI = ssot/kpi.json 정본 직독(읽기전용 · 편집 제외).</div>
  <div class="matrix-scroll">
    <table class="matrix">
      <thead>
        <tr>
          <th class="role-col">주체</th>
          <th class="grp-np">🌟 목표·지표</th>
          <th class="grp-boot">🔧 일하는 법</th>
          <th class="grp-guard col-own">🚧 소유 관리</th>
        </tr>
      </thead>
      <tbody id="matrix-body">
        <tr><td colspan="4" class="matrix-status">매트릭스 정본을 불러오는 중…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- ════ B. 공통 헌법 4섹션 (S2 정본으로 링크만) ════ -->
  <h2 class="sec">📜 공통 헌법 4섹션</h2>
  <div class="cards" id="common-cards"><!-- JS가 라이브 URL로 채움 --></div>


</div>

<script>
(function(){
  // S2 라이브 URL 기준 (GitHub Pages 루트 = "3. 웰페리온 가이드/" → 접두사 없음)
  var S2 = 'wellperion_guide(main).html';

  // ── B. 공통 4섹션 카드 (S2 앵커 링크) ──
  var cards = [
    {
      h:'⚖️ 절대기준 2종',
      d:'절대 원칙 3대 + 완료의 단일 정의(4요건 · ③ "다음"=브릿지 흡수)',
      links:[
        ['절대 원칙 3대', 'con-absolute'],
        ['완료 4요건', 'con-done4']
      ]
    },
    {
      h:'🔗 통합원칙 10',
      d:'전 C-Level 통합 원칙 (S2 공통탭 토글)',
      links:[
        ['통합 원칙 보기', 'con-unified']
      ]
    },
    {
      h:'📌 정본데이터 7 (핵심4+기계3)',
      d:'핵심4: 약속 · 재발방지 · 공식값 · KPI(ssot/kpi.json 정본) / 기계3: forbidden_terms · enforcement_mode · incident_baseline',
      links:[
        ['우리의 약속', 'common-promises'],
        ['🛡️ 재발방지', 'common-incidents'],
        ['🏛️ 공식값', 'common-canon-body']
      ]
    },
    {
      h:'🔌 운영 SOP 5',
      d:'부팅 · 보고표 · GM 결재 5종(5종 단일출처) · 입력금지 5종 · 텔레그램',
      links:[
        ['🎯 GM 결재 5종', 'con-gm5'],
        ['🚫 입력 금지 5종', 'con-input5'],
        ['🎚️ 토큰 라우팅', 'con-token']
      ]
    }
  ];
  var cc = document.getElementById('common-cards');
  cc.innerHTML = cards.map(function(c){
    var ls = c.links.map(function(l){
      return '<a class="lk" href="' + S2 + '#S2/common/' + l[1] + '">' + l[0] + ' ↗</a>';
    }).join('');
    return '<div class="ccard"><h3>' + c.h + '</h3><div class="desc">' + c.d + '</div>' + ls + '</div>';
  }).join('');

  // ── A. 매트릭스 정본 직독 렌더 + GM 3칸 병합 인라인 편집 (2026-06-29) ──
  //   읽기=RAW_URL(raw GitHub) → _matrixData에 8 dims 전체 보유.
  //   저장=GAS commit_file(coo/bootsetup_matrix.json). 편집칸(dims 0,2,1)만 반영, 나머지(3,4,5,6,7) 원본 보존.
  //   3칸 병합: 목표·지표=[🌟0(편집) · 📊KPI(ssot/kpi.json 직독·읽기전용)] / 일하는 법=[📚2,🔧1] / 소유 관리=role.owns 링크칩(편집 대상 아님).
  //   ※ KPI 복사발산 차단(INC-001류): KPI 정본=ssot/kpi.json. dims[3]은 KPI 표시에서 미사용(kpi.json 없는 주체=GM만 dims[3] 폴백).
  var RAW_URL = 'https://raw.githubusercontent.com/wellperion-cao/wellperion-automation/master/3.%20%EC%9B%B0%ED%8E%98%EB%A6%AC%EC%98%A8%20%EA%B0%80%EC%9D%B4%EB%93%9C/coo/bootsetup_matrix.json';
  var KPI_RAW_URL = 'https://raw.githubusercontent.com/wellperion-cao/wellperion-automation/master/ssot/kpi.json';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxDwFkrxK1YIaEoSNcuw2MiHiZQ-7o5N6311ytksSyeEd86ZFOhLknOWqQgNArQvZ-7/exec';
  var RAW_BASE = 'https://raw.githubusercontent.com/wellperion-cao/wellperion-automation/master/';
  var _matrixData = null;
  var _kpiData = null;
  var _kpiValues = null;      // status/kpi_values.json roles{} — 현재 실측값(없으면 null)
  var _queueCounts = null;    // status/_queue.json 집계 → role.id별 {active, doneToday}
  var _pendingByRole = null;  // status/northstar_pending.json → role.id별 후보 1개
  var _editMode = false;

  // 뷰어 로컬(=GM 기준 KST) 오늘 날짜 YYYY-MM-DD
  function localToday(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  // _queue 직독 집계: 활성(PENDING+IN_PROGRESS) · 오늘 완료(DONE & processed_at=오늘)
  function computeQueueCounts(arr){
    var m = {}, today = localToday();
    (Array.isArray(arr) ? arr : []).forEach(function(t){
      var role = t && t.clevel; if(!role) return;
      var o = m[role] || (m[role] = { active:0, doneToday:0 });
      var st = t.status;
      if(st === 'PENDING' || st === 'IN_PROGRESS') o.active++;
      else if(st === 'DONE' && String(t.processed_at || '').slice(0,10) === today) o.doneToday++;
    });
    return m;
  }
  // northstar_pending.candidates → role별 첫 후보
  function computePending(d){
    var m = {}, arr = (d && d.candidates) || [];
    arr.forEach(function(c){ if(c && c.role && !m[c.role]) m[c.role] = c; });
    return m;
  }

  var esc = function(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  };

  var body = document.getElementById('matrix-body');

  // 라벨 블록: 작은 라벨(.dim-label) + 값.
  //   비편집 = 원문을 ·/줄바꿈으로 split → 불릿 목록(.dim-bul). 빈 항목 제거. 없으면 '—'.
  //   편집 = 기존처럼 원문 그대로(.cell-edit · 개별 contenteditable · IME 핸들러). 저장은 원문.
  function dimBlock(role, di, label){
    var d = (role.dims) || [];
    var raw = (d[di] == null ? '' : String(d[di]));
    var lab = '<span class="dim-label">' + label + '</span>';
    if(_editMode){
      return lab + '<div class="dim-val cell-edit" contenteditable="true" data-role="' + esc(role.id) + '" data-dim="' + di + '" ' +
             'oncompositionstart="window._compOn()" oncompositionend="window._compOff()" ' +
             'onblur="window._cellBlur(this)">' + esc(raw) + '</div>';
    }
    var items = raw.split(/\n+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
    var lis = items.length
      ? items.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('')
      : '<li class="dim-empty">—</li>';
    return lab + '<ul class="dim-bul">' + lis + '</ul>';
  }

  function ideasBlock(role){
    var raw = (role.ideas == null ? '' : String(role.ideas));
    var lab = '<span class="dim-label">💡 확장 아이디어</span>';
    if(_editMode){
      return lab + '<div class="dim-val cell-edit" contenteditable="true" data-role="' + esc(role.id) + '" data-field="ideas" ' +
             'oncompositionstart="window._compOn()" oncompositionend="window._compOff()" ' +
             'onblur="window._cellBlur(this)">' + esc(raw) + '</div>';
    }
    var items = raw.split(/\n+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
    var lis = items.length
      ? items.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('')
      : '<li class="dim-empty">—</li>';
    return lab + '<ul class="dim-bul">' + lis + '</ul>';
  }

  // 📊 KPI 블록 — 정본=ssot/kpi.json 직독(읽기전용 · 복사발산 차단). 편집 모드와 무관하게 항상 읽기전용.
  //   kpi.json roles[id].kpi_html = 렌더 셀(이미 HTML이므로 escape 금지). kpi.json에 없는 주체(GM)는 dims[3] 폴백.
  function kpiBlock(role){
    var note = '<span style="font-size:9.5px;color:var(--dim);font-weight:400;text-transform:none;letter-spacing:0;"> · 정본 ssot/kpi.json</span>';
    var lab = '<span class="dim-label">📊 KPI' + note + '</span>';
    var kd = (_kpiData && _kpiData[role.id]) || null;
    if(kd && kd.kpi_html){
      return lab + '<div class="dim-val" style="white-space:normal;">' + kd.kpi_html + '</div>';
    }
    // kpi.json 미등록 주체(예: GM) — dims[3] 폴백(읽기전용)
    var d = (role.dims) || [];
    var raw = (d[3] == null ? '' : String(d[3]));
    var items = raw.split(/\n+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
    var lis = items.length
      ? items.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('')
      : '<li class="dim-empty">—</li>';
    return lab + '<ul class="dim-bul">' + lis + '</ul>';
  }

  // 🌟 북극성 도달율 — 궁극 목표 · 전면(골드). 정본 = status/kpi_values.json의 '목표 대비 현재 비율' 필드.
  //   측정 가능 = 골드 막대 N%(강조·전면). 측정 불가(대부분) = 거짓 숫자 금지 → "🔧 측정 인프라 구축 필요" 정직 텍스트(막대 없음).
  //   판정: kpi_values 필드 중 키가 (완료율|달성률|도달율|전환율|가동률)로 끝나고 숫자인 것. 완결률(=작업 활동량)은 제외.
  //   (현재 데이터 = coo 지원부_점검완료율 하나뿐 → coo만 골드 막대, 나머지는 구축 필요.)
  function northStarReachBlock(role){
    var lab = '<span class="nsreach-h">🌟 북극성 도달율 <span class="nsreach-note">(궁극 목표)</span></span>';
    var v = (_kpiValues && _kpiValues[role.id]) || null;
    var key = null, val = null;
    if(v){
      for(var k in v){
        if(!Object.prototype.hasOwnProperty.call(v, k)) continue;
        if(k === '완결률') continue;                                    // 완결률 = 작업 처리율(활동량) → 도달율 아님
        if(typeof v[k] !== 'number') continue;                          // null(미측정)·문자 제외 → 정직
        if(/(완료율|달성률|도달율|전환율|가동률)$/.test(k)){ key = k; val = v[k]; break; }
      }
    }
    if(key !== null){
      var pct = Math.max(0, Math.min(100, Math.round(val * 100)));
      var nm = String(key).replace(/_/g, ' ');
      return '<div class="nsreach">' + lab +
        '<div class="kbar gold" title="북극성 도달율(목표 대비 현재)"><i style="width:' + pct + '%"></i></div>' +
        '<div class="nsreach-meta">🌟 도달율 <b>' + pct + '%</b> <span class="nsreach-note">· ' + esc(nm) + '</span></div>' +
      '</div>';
    }
    // 측정 불가 — 거짓 숫자 금지(kpi_values 원칙: 측정 불가=null·정직). 막대 없이 정직 텍스트.
    return '<div class="nsreach">' + lab +
      '<div class="nsreach-build">🔧 측정 인프라 구축 필요 <span class="nsreach-note">— 도달율 데이터 확보 후 전면 표시</span></div>' +
    '</div>';
  }

  // 작업 처리율 — 보조 지표(활동량) · 강등. 구 "완결률" = 할당 작업 처리량이지 북극성 도달과 다름.
  //   status/kpi_values.json 완결률(0~1) → 중립색 작은 막대 + 누적 완료 수 병기. 값 없으면 빈 문자열(graceful).
  //   coo 지원부_점검완료율은 #1 북극성 도달율로 승격 → 여기서 중복 표시하지 않음.
  function workRateBlock(role){
    var v = (_kpiValues && _kpiValues[role.id]) || null;
    if(!v || typeof v['완결률'] !== 'number') return '';
    var pct = Math.max(0, Math.min(100, Math.round(v['완결률'] * 100)));
    return '<div class="workrate"><span class="workrate-h">작업 처리율 · 보조 지표(활동량)</span>' +
      '<div class="kbar neutral" title="작업 처리율 — 할당 작업 처리량(북극성 도달과 다름)"><i style="width:' + pct + '%"></i></div>' +
      '<div class="workrate-meta">처리율 <b>' + pct + '%</b>' +
      (typeof v['완료'] === 'number' ? (' · 누적 완료 <b>' + v['완료'] + '</b>') : '') +
      ' <span class="nsreach-note">· 할당 작업 처리량 — 목표 도달과 다름</span></div>' +
    '</div>';
  }

  // 📍 진행현황 — status/_queue.json 직독 집계(활성 N · 오늘 완료 M). 데이터 없으면 줄 생략.
  function progressBlock(role){
    var c = (_queueCounts && _queueCounts[role.id]) || null;
    if(!c) return '';
    var lab = '<span class="dim-label">📍 진행현황</span>';
    return lab + '<div class="pstat">📍 활성 <b>' + c.active + '</b> · 오늘 완료 <b>' + c.doneToday + '</b></div>';
  }

  // 🌅 오늘 추천 — status/northstar_pending.json 후보 1개. 없으면 숨김.
  function recommendBlock(role){
    var cand = (_pendingByRole && _pendingByRole[role.id]) || null;
    if(!cand || !cand.title) return '';
    var lab = '<span class="dim-label">🌅 오늘 추천</span>';
    return lab + '<div class="todaychip" title="' + esc(cand.rationale || '') + '">🌅 ' + esc(cand.title) + '</div>';
  }

  function renderMatrix(){
    var roles = (_matrixData && _matrixData.roles) || [];
    if(!roles.length){
      body.innerHTML = '<tr><td colspan="4" class="matrix-status">roles 비어 있음. 정본: <code>coo/bootsetup_matrix.json</code></td></tr>';
      return;
    }
    body.innerHTML = roles.map(function(role){
      var ac = role.accent || 'var(--accent)';
      var gm = role.id === 'gm';
      // 칸1 목표·지표 = 🌟북극성(dims[0]·편집) → 🌟북극성 도달율(궁극 목표·전면·골드) → 📊KPI 지표 정의(읽기전용)
      //   → 작업 처리율(보조·강등) → 📍진행현황 → 🌅오늘 추천.
      //   GM 결재(2026-06-30): 완결률(작업 활동량) 아닌 북극성 도달율이 궁극 목표 → 전면 배치. 처리율은 보조로 강등.
      var c1 = '<td>' + dimBlock(role, 0, '🌟 북극성') + northStarReachBlock(role) + kpiBlock(role) +
               workRateBlock(role) + progressBlock(role) + recommendBlock(role) + '</td>';
      // 칸2 일하는 법 = 📚읽는 정본(2) + 🔧일 흐름(1)
      var c2 = '<td>' + dimBlock(role, 2, '📚 읽는 정본') + dimBlock(role, 1, '🔧 일 흐름') + '</td>';
      // 칸3 소유 관리 = role.owns 링크칩(편집 대상 아님)
      var owns = (role.owns || []).map(function(o){
        return '<a class="own-chip" href="' + esc(o.href) + '">' + esc(o.label) + '</a>';
      }).join('');
      var c3 = '<td>' + owns + ideasBlock(role) + '</td>';
      return '<tr class="' + (gm ? 'role-gm' : '') + '">' +
        '<td class="role-cell" style="border-left:4px solid ' + esc(ac) + ';">' +
          '<div class="ricon">' + esc(role.icon) + '</div>' +
          '<div class="rname" style="color:' + esc(ac) + ';">' + esc(role.name) + (role.draft ? '<span class="rdraft">🔖 초안</span>' : '') + '</div>' +
          '<div class="rtitle">' + esc(role.title) + '</div>' +
          (role.owner ? '<div class="rowner">담당 · ' + esc(role.owner) + '</div>' : '') +
        '</td>' + c1 + c2 + c3 +
      '</tr>';
    }).join('');
  }

  // IME 안전: 조합 중 blur 반영 차단
  window._compOn  = function(){ window._composing = true; };
  window._compOff = function(){ window._composing = false; };
  window._cellBlur = function(el){
    if(window._composing) return;
    var role  = el.getAttribute('data-role');
    var field = el.getAttribute('data-field');
    var val   = el.innerText || el.textContent || '';
    if(!_matrixData) return;
    if(field === 'ideas'){
      (_matrixData.roles || []).forEach(function(r){
        if(r.id === role) r.ideas = val;
      });
    } else {
      var dim = parseInt(el.getAttribute('data-dim'), 10);
      (_matrixData.roles || []).forEach(function(r){
        if(r.id === role && Array.isArray(r.dims) && dim < r.dims.length){
          r.dims[dim] = val;   // 편집칸 인덱스(0,3,2,1)만 갱신 — 나머지 dims는 손대지 않음
        }
      });
    }
  };

  function renderEditBtn(){
    var wrap = document.getElementById('matrix-edit-wrap');
    if(!wrap) return;
    if(_editMode){
      wrap.innerHTML = '<button class="ebtn save" id="matrix-save-btn" onclick="window._matrixSave()">저장</button>' +
                       '<button class="ebtn cancel" onclick="window._matrixCancel()">취소</button>';
    } else {
      wrap.innerHTML = '<button class="ebtn edit" onclick="window._matrixEdit()">✏️ GM 편집</button>';
    }
  }

  function setEdit(on){
    _editMode = !!on;
    var t = document.querySelector('table.matrix');
    if(t) t.classList.toggle('editing', _editMode);
    renderMatrix();
    renderEditBtn();
  }

  // 편집 모드에서 열 너비 드래그 조정 (GM PC localStorage 저장 · 정본 아님)
  function initColResizers(){
    var table = document.querySelector('table.matrix');
    if(!table) return;
    var ths = table.querySelectorAll('thead th');
    var KEY = 'hunjang-colw-v3', saved = {};
    try{ saved = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){}
    Array.prototype.forEach.call(ths, function(th, i){
      if(saved[i]) th.style.width = saved[i] + 'px';
      var rz = document.createElement('div');
      rz.className = 'col-resizer';
      rz.addEventListener('mousedown', function(e){
        e.preventDefault(); e.stopPropagation();
        var startX = e.clientX, startW = th.offsetWidth;
        function mv(ev){ th.style.width = Math.max(40, startW + (ev.clientX - startX)) + 'px'; }
        function up(){ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up);
          saved[i] = th.offsetWidth; try{ localStorage.setItem(KEY, JSON.stringify(saved)); }catch(e){} }
        document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
      });
      th.appendChild(rz);
    });
  }

  window._matrixEdit = function(){ setEdit(true); };
  function fetchMatrix(){
    // 최신 보장: GAS read_file(GitHub API 직독·CDN 캐시 없음) → 실패 시 Pages 폴백
    return fetch(GAS_URL, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'read_file', path:'3. 웰페리온 가이드/coo/bootsetup_matrix.json'})})
      .then(function(r){ return r.json(); })
      .then(function(res){ if(res && res.ok && res.content){ return JSON.parse(res.content); } throw new Error((res && res.error) || 'read 실패'); })
      .catch(function(){ return fetch('coo/bootsetup_matrix.json?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }); });
  }
  // KPI 정본 직독 — GAS read_file(ssot/kpi.json) → 실패 시 raw GitHub 폴백.
  //   (ssot/는 GitHub Pages 발행루트 밖이라 Pages 폴백 불가 → raw 사용.)
  function fetchKpi(){
    return fetch(GAS_URL, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'read_file', path:'ssot/kpi.json'})})
      .then(function(r){ return r.json(); })
      .then(function(res){ if(res && res.ok && res.content){ return JSON.parse(res.content); } throw new Error((res && res.error) || 'kpi read 실패'); })
      .catch(function(){ return fetch(KPI_RAW_URL + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }); });
  }
  // 범용 직독: GAS read_file(최신·캐시없음) → 실패 시 raw GitHub 폴백. 실패해도 호출부에서 .catch(null) 처리.
  function gasRead(path, rawUrl){
    return fetch(GAS_URL, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action:'read_file', path:path})})
      .then(function(r){ return r.json(); })
      .then(function(res){ if(res && res.ok && res.content){ return JSON.parse(res.content); } throw new Error((res && res.error) || 'read 실패'); })
      .catch(function(){ return fetch(rawUrl + '?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }); });
  }
  window._matrixCancel = function(){
    fetchMatrix().then(function(d){ _matrixData = d; setEdit(false); });
  };
  window._matrixSave = function(){
    var pin = prompt('GM 편집 저장 — 비밀번호를 입력하세요:');
    if(pin === null || pin === '') return;
    if(!_matrixData) return;
    // 저장 직전 편집칸 전체를 모델에 반영 — blur/IME 누락 방지(원상복귀 버그 차단)
    Array.prototype.forEach.call(body.querySelectorAll('.cell-edit[contenteditable]'), function(el){
      var role = el.getAttribute('data-role'), field = el.getAttribute('data-field'), val = el.innerText || el.textContent || '';
      if(field === 'ideas'){
        (_matrixData.roles || []).forEach(function(r){ if(r.id === role) r.ideas = val; });
      } else {
        var dim = parseInt(el.getAttribute('data-dim'), 10);
        (_matrixData.roles || []).forEach(function(r){ if(r.id === role && Array.isArray(r.dims) && dim < r.dims.length) r.dims[dim] = val; });
      }
    });
    _matrixData.updated_at = new Date().toISOString().slice(0,10);
    var content = JSON.stringify(_matrixData, null, 2);
    var btn = document.getElementById('matrix-save-btn');
    if(btn){ btn.textContent = '저장 중…'; btn.disabled = true; }
    fetch(GAS_URL, {
      method: 'POST',
      redirect: 'follow',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: 'commit_file',
        path: '3. 웰페리온 가이드/coo/bootsetup_matrix.json',
        content: content,
        message: '[GM] 헌법 한 장 3칸 편집 ' + _matrixData.updated_at,
        key: pin
      })
    })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(res && res.ok){
          alert('저장 완료. (커밋: ' + ((res.commit||'') + '').slice(0,7) + ')');
          setEdit(false);
        } else {
          alert('저장 실패: ' + ((res && res.error) || '알 수 없는 오류'));
          if(btn){ btn.textContent = '저장'; btn.disabled = false; }
        }
      })
      .catch(function(e){
        alert('저장 오류: ' + e.message);
        if(btn){ btn.textContent = '저장'; btn.disabled = false; }
      });
  };

  Promise.all([
    fetchMatrix(),
    fetchKpi().catch(function(){ return null; }),
    gasRead('status/kpi_values.json',     RAW_BASE + 'status/kpi_values.json').catch(function(){ return null; }),
    gasRead('status/_queue.json',         RAW_BASE + 'status/_queue.json').catch(function(){ return null; }),
    gasRead('status/northstar_pending.json', RAW_BASE + 'status/northstar_pending.json').catch(function(){ return null; })
  ])
    .then(function(arr){
      _matrixData = arr[0];
      _kpiData = (arr[1] && arr[1].roles) || {};
      _kpiValues = (arr[2] && arr[2].roles) || {};
      _queueCounts = computeQueueCounts(arr[3]);
      _pendingByRole = computePending(arr[4]);
      renderMatrix();
      renderEditBtn();
      initColResizers();
    })
    .catch(function(e){
      body.innerHTML = '<tr><td colspan="4" class="matrix-status">매트릭스 정본을 불러오지 못했습니다 (' + esc(e.message) +
        '). 정본: <code>coo/bootsetup_matrix.json</code></td></tr>';
    });
})();
</script>
</body>
