<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>웰페리온 둘러보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 시설 둘러보기 — 스크롤 스크럽 걷기(GM 재정의 2026-09-04).
   실제 촬영 사진 28장을 동선 순서 프레임으로 삼아, 스크롤 위치 = 걷는 위치.
   프레임 정본 = ../assets/360/walk_frames.json (공개 홈 home/ 안에 자족 · 2026-09-05 이동) — 영상 오면 이 파일만 교체, 엔진은 그대로. */
:root{
  --bg:#0F0E0E; --ink:#F1ECE5; --ink-2:#BFB4A9; --ink-3:#7E746C;
  --beige:#B79F8A; --line:rgba(241,236,229,.16);
  --serif:"Playfair Display","Noto Serif KR",Georgia,serif;
  --sans:"Pretendard","Jost","Noto Sans KR",-apple-system,sans-serif;
  --label:"Jost","Pretendard",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

.track{position:relative}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.stage .frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0}
.stage .frame.on{opacity:1}
.vignette{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to top, rgba(15,14,14,.85) 0%, rgba(15,14,14,.2) 26%, transparent 52%),
  linear-gradient(to bottom, rgba(15,14,14,.4) 0%, transparent 20%)}

.topbar{position:fixed;top:0;left:0;right:0;height:3px;background:rgba(241,236,229,.14);z-index:5}
.topbar .bar{height:100%;width:0;background:var(--beige)}

.caption{position:fixed;left:28px;right:28px;bottom:32px;z-index:5;opacity:0;transition:opacity .35s ease;pointer-events:none}
.caption .en{font-family:var(--label);letter-spacing:.28em;font-size:11px;color:var(--beige);text-transform:uppercase}
.caption h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,3.6vw,44px);line-height:1.08;margin:8px 0 6px;letter-spacing:-.01em}
.caption p{margin:0;color:var(--ink-2);font-size:14px;letter-spacing:.02em}

.end{padding:64px 28px 90px;text-align:center;font-family:var(--label);font-size:12px;letter-spacing:.14em;color:var(--ink-2)}

@media (max-width:900px){
  .caption{left:18px;right:18px;bottom:26px}
}
</style>
</head>
<body>

<div class="track" id="track">
  <div class="stage" id="stage">
    <img class="frame" id="fA" alt="">
    <img class="frame" id="fB" alt="">
    <div class="vignette"></div>
  </div>
</div>

<div class="topbar"><div class="bar" id="bar"></div></div>
<div class="caption" id="caption">
  <div class="en" id="capEn">WELLPERION</div>
  <h2 id="capSpace"></h2>
  <p id="capLine"></p>
</div>

<div class="end">문의: wellperion.com/ko/inquiry</div>

<script>
(function(){
  var BASE = '../assets/360/';
  var FRAME_PX = 60; // 프레임당 스크롤 길이(px) — 프레임 수 x 이 값 = 페이지 높이
  var track = document.getElementById('track');
  var fA = document.getElementById('fA'), fB = document.getElementById('fB');
  var bar = document.getElementById('bar');
  var caption = document.getElementById('caption');
  var capSpace = document.getElementById('capSpace'), capLine = document.getElementById('capLine');
  var FRAMES = [], lastSpace = null, capTimer = null;

  function preload(i){
    if(i<0 || i>=FRAMES.length || FRAMES[i]._img) return;
    var im = new Image(); im.src = BASE + FRAMES[i].src; FRAMES[i]._img = im;
  }

  function setSpace(i){
    var f = FRAMES[i];
    if(f.space === lastSpace) return;
    lastSpace = f.space;
    clearTimeout(capTimer);
    caption.style.opacity = 0;
    capTimer = setTimeout(function(){ capSpace.textContent = f.space; capLine.textContent = f.caption; caption.style.opacity = 1; }, 180);
  }

  function render(){
    var n = FRAMES.length; if(!n) return;
    var max = Math.max(track.offsetHeight - innerHeight, 1);
    var y = Math.min(Math.max(window.scrollY, 0), max);
    var p = y / max;
    bar.style.width = (p*100) + '%';
    var pos = p * (n-1);
    var i0 = Math.floor(pos), frac = pos - i0;
    var i1 = Math.min(i0+1, n-1);
    preload(i0); preload(i1); preload(i1+1);
    if(FRAMES[i0]._img && FRAMES[i0]._img.complete){ fA.src = FRAMES[i0]._img.src; fA.classList.add('on'); }
    if(i1!==i0 && FRAMES[i1]._img && FRAMES[i1]._img.complete){ fB.src = FRAMES[i1]._img.src; fB.style.opacity = frac; }
    else fB.style.opacity = 0;
    setSpace(i0);
  }

  var ticking = false;
  function onScroll(){
    if(ticking) return; ticking = true;
    requestAnimationFrame(function(){ render(); ticking = false; });
  }

  fetch(BASE + 'walk_frames.json').then(function(r){ return r.json(); }).then(function(data){
    FRAMES = data.frames || [];
    if(!FRAMES.length) return;
    track.style.height = (FRAMES.length * FRAME_PX) + 'px';
    preload(0);
    FRAMES[0]._img.onload = render;
    if(FRAMES[0]._img.complete) render();
    for(var k=1;k<FRAMES.length;k++){ (function(k){ setTimeout(function(){ preload(k); }, k*40); })(k); }
    addEventListener('scroll', onScroll, {passive:true});
    addEventListener('resize', onScroll);
    render();
  });
})();
</script>
</body>
</html>
