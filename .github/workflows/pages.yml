name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - '3. 웰페리온 가이드/**'
      - '1. AI학습자료_아카이브/08_로고&워터마크/_assets/**'
      - 'ssot/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 2026-07-03: 커밋 폭주 시 배포 겹침→"try again later" 간헐 실패로 GM 실패메일 폭탄.
# cancel-in-progress:true = 새 푸시 오면 겹친 옛 배포 취소(취소는 실패 아님·메일 없음), 최신만 배포.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage pages with external assets
        run: |
          mkdir -p _pages_build
          cp -r "3. 웰페리온 가이드/." _pages_build/
          mkdir -p "_pages_build/1. AI학습자료_아카이브/08_로고&워터마크/_assets"
          cp -r "1. AI학습자료_아카이브/08_로고&워터마크/_assets/." \
                "_pages_build/1. AI학습자료_아카이브/08_로고&워터마크/_assets/"
          mkdir -p _pages_build/ssot
          cp ssot/dashboard.html ssot/incidents.json ssot/canon_values.json "ssot/약속.json" _pages_build/ssot/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages_build'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
