name: Deploy to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - '3. 웰페리온 가이드/**'
      # 2026-07-20 (시우·GM 승인) 배포 적체 해소 시도 — ⚠️ 아래 negative pattern 3줄은 **실측 결과 작동하지 않았다.**
      #
      # 배경: 훅이 status/_queue.json 을 이 폴더로 미러링하는데, C-Level 자동화가 1분마다 큐를
      #   갱신하면서 매번 전체 재배포를 깨웠다. 실측(최근 6시간 커밋 91건): 실제 화면 변경 16건(18%)
      #   / 데이터만 75건(82%). 그 82%가 진짜 배포를 밀어내 라이브가 1시간+ 정체 → 약속 L03 붕괴.
      #
      # 검증 결과(반증): 이 패턴이 트리 안에 들어있는 커밋 663def74·6a9e0f98 은 변경 파일이
      #   `3. 웰페리온 가이드/status/_queue.json` + `status/_queue.json` 뿐인데도 배포가 트리거됐다.
      #   (gh run list 로 workflowName='Deploy to GitHub Pages', event=push 확인)
      #   → GitHub paths 의 `!` negation 이 이 경우 기대대로 필터링하지 않는다. 원인 미규명.
      #
      # 따라서 이 3줄은 **현재 무효**다. 남겨둔 이유는 "이미 시도했고 안 통했다"는 기록 때문 —
      #   같은 방법을 다시 시도해 시간 낭비하지 말라는 표지다. 지운다고 동작이 달라지지 않는다.
      #
      # 진짜 해법 후보(시토 판단): ① 잡 레벨 early-exit 가드로 변경파일 검사 후 스킵
      #   ② G1 이 raw.githubusercontent 직독으로 전환되면 미러 자체 제거(근본)
      #   ③ 자동화 커밋 묶기(빈도 감소)
      # 상세 진단: status/briefs/시토_배포적체_진단_20260720.md · G1 인계: status/briefs/웰리_G1_큐직독_인계_20260720.md
      # (배9199)
      - '!3. 웰페리온 가이드/status/**'
      - '!3. 웰페리온 가이드/**/*.jsonl'
      - '!3. 웰페리온 가이드/cmo/review/**'
      - '1. AI자료_아카이브/08_로고&워터마크/_assets/**'
      - 'ssot/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 2026-07-03: 커밋 폭주 시 배포 겹침→"try again later" 간헐 실패로 GM 실패메일 폭탄.
#   → cancel-in-progress:true 로 겹친 옛 배포를 취소해 메일 폭탄은 막았음.
# 2026-07-20 (시우·GM 승인): 그 설정이 반대 방향 사고를 낳음 — C-Level 자동화가 30초~1분마다
#   커밋하면서 배포가 시작될 때마다 다음 푸시에 취소됨. 최근 20회 중 취소 15 / 성공 3.
#   결과: 라이브가 몇 시간씩 옛 버전에 머물러 "푸시했으니 반영됨" 보고가 전부 거짓이 됨(약속 L03 붕괴).
#   → cancel-in-progress:false. 취소 대신 '줄 세우기'.
#   겹침 방지는 그대로(동시 실행 0 → "try again later" 재발 없음)이면서, 최신 커밋이 반드시 배포된다.
#   대기열은 무한정 늘지 않는다 — 대기 중 run 은 더 새 커밋이 오면 GitHub 이 자동 교체(superseded)한다.
#   ※ 이 값을 true 로 되돌리면 라이브 반영이 다시 막힌다. 되돌리기 전 반드시 배포 성공률부터 확인할 것.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage pages with external assets
        run: |
          mkdir -p _pages_build
          cp -r "3. 웰페리온 가이드/." _pages_build/
          mkdir -p "_pages_build/1. AI자료_아카이브/08_로고&워터마크/_assets"
          cp -r "1. AI자료_아카이브/08_로고&워터마크/_assets/." \
                "_pages_build/1. AI자료_아카이브/08_로고&워터마크/_assets/"
          mkdir -p _pages_build/ssot
          cp ssot/dashboard.html ssot/incidents.json ssot/canon_values.json "ssot/약속.json" _pages_build/ssot/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_pages_build'
      # 2026-07-03: Pages 백엔드가 커밋 폭주 시 "Deployment failed, try again later"를 간헐 반환.
      # 실패해도 잠깐 대기 후 재배포(백엔드 회복 통상 <1분) → 실패 메일 제거. 즉시 배포는 유지.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Settle before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Settle before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (final attempt)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
